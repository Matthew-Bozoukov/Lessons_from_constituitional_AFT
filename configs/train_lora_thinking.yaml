# ABOUTME: QLoRA SFT config for the thinking-format difficult-advice data (reasoning_content).
# ABOUTME: Run on GPU: python src/experiments/train_lora.py --config configs/train_lora_thinking.yaml

seed: 0
model: "Qwen/Qwen3-32B"
data_path: "data/sft_dataset_thinking.jsonl"   # augmented with <think> traces
output_dir: "output/train_lora_thinking"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  epochs: 2
  batch_size: 4
  grad_accum: 4
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  max_seq_len: 2048          # longer targets (answer + reasoning trace)
  packing: true
  assistant_only_loss: false
  attn_implementation: sdpa
