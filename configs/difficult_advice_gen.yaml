# ABOUTME: Config for difficult-advice SFT data generation via Sonnet 4.5 (OpenRouter).
# ABOUTME: Run: uv run src/experiments/generate_difficult_advice.py --config configs/difficult_advice_gen.yaml

seed: 0

# Which constitution (src/prompts.py::CONSTITUTIONS) steers response generation + grading.
constitution: v1

# Models (OpenRouter ids). Sonnet 4.5 generates and grades the data.
gen_model: "anthropic/claude-sonnet-4.5"
grade_model: "anthropic/claude-sonnet-4.5"

# Scale. 18 domains x scenarios_per_domain scenarios. ~3M Qwen tokens is the target.
scenarios_per_domain: 220
target_tokens: 3000000

scenario:
  batch_size: 5        # scenarios requested per generation call
  temperature: 1.0
  max_tokens: 4000

response:
  temperature: 1.0
  max_tokens: 2048

grading:
  temperature: 0.0
  min_score: 7         # keep responses with overall_score >= this (and passing gates)

max_workers: 24
tokenizer: "Qwen/Qwen3-32B"
output_dir: "output/difficult_advice_gen"
