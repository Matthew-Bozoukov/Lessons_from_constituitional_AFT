# ABOUTME: SAE property extraction (dataset diffing) over synth corpora — the setup of
# ABOUTME: arXiv:2512.10092 with local Goodfire SAE weights (docs/sae_property_extraction.md).
# Run: uv run --project scratch/sae_properties python scratch/sae_properties/run_embed.py --config configs/properties/sae_diff.yaml   (GPU host)
#      uv run --project scratch/sae_properties python scratch/sae_properties/run_diff.py  --config configs/properties/sae_diff.yaml run=<embed-run>   (anywhere)
# Smoke (8B reader, 16 rows, CPU-able): ... run_embed.py --config ... sae.variant=Llama-3.1-8B-Instruct-SAE-l19 'sae.device={model: cpu, sae: cpu}' embed.limit=16 embed.batch_size=2

run: null                    # embed-run directory name; null -> timestamped. run_diff REQUIRES it.

sae:
  variant: Llama-3.3-70B-Instruct-SAE-l50   # the paper's SAE (layer 50, d_sae 65536, LMSYS-trained)
  hf_model: null             # null = official meta-llama repo (gated). BACKUP while approval is pending:
                             # sae.hf_model=unsloth/Llama-3.3-70B-Instruct (ungated mirror, identical weights)
  dtype: bfloat16
  quantize: false            # true = 8-bit reader on one 80GB card (upstream warns activations lose accuracy)
  max_length: 2048           # paper caps analyzed texts at 2048 tokens
  device: {model: auto, sae: "cuda:0"}      # model 'auto' shards the truncated reader across GPUs

embed:
  channels: [response]       # query | reasoning | response — embedded separately
  batch_size: 4
  limit: 1000                # docs per corpus (seeded sample); null = all
  out_root: output/sae_properties

corpora:                     # dataset diffing inputs — synth corpora (see docs/sae_property_extraction.md §3)
  - {name: difficult_advice, repo: LASR-Callum/2026-08-13-difficult-advice-v2, file: stage_8_export_sft.jsonl}  # legacy synth layout: stage files, no dataset.jsonl
  - {name: peer_critique, repo: LASR-Callum/2026-08-14-peer-critique, file: dataset.jsonl}
  - {name: courtroom, repo: LASR-Callum/2026-08-14-courtroom, file: dataset.jsonl}
  - {name: post_action_retrospection, repo: LASR-Callum/2026-08-17-post-action-retrospection, file: dataset.jsonl}

diff:                        # paper defaults (section 4.1 / appendix D.2, L.1)
  target: difficult_advice
  others: [peer_critique, courtroom, post_action_retrospection]
  channel: response
  query: "What are the most significant, interesting differences?"
  model: google/gemini-2.5-flash          # relabel + hypothesis summarizer (paper's choice;
  judge_model: google/gemini-2.5-flash    # 3.7-flash is capacity-capped at 300 RPM on OpenRouter, 2026-08-19)
  min_difference: 0.03       # latent frequency-difference floor
  max_feature_diffs: 200     # paper's cap: top-200 latents by frequency difference
  label_score_threshold: 0.75  # min label-accuracy score for a latent to count
  num_hypotheses: 10
  max_concurrency: 100
