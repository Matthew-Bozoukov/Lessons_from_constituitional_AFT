# ABOUTME: Property discovery over ODCV rollouts from BOTH arms of the 716-row experiment:
# ABOUTME: what the 7.16%-difficult-advice model does that its NuminaMath control does not.
# Run: uv run python scripts/properties/discover.py --config configs/properties/discover_odcv_difficult_advice_716_vs_numina.yaml [--smoke]

tag: odcv_da716_vs_numina

registry: output/properties/properties.jsonl

# TWO arms, which is what makes this different from discover_odcv_difficult_advice_716.yaml. That run
# could say "here is what da716 does and here is which of it goes with violating"; it could
# not say whether any of it was a property of the FINE-TUNE rather than of any model on
# these scenarios. With a matched control it can:
#
#   contrast:  which properties are more common in one model than the other
#   outcomes:  which properties go with violating, WITHIN each arm and condition
#   probe:     how much of the arm difference the property set accounts for at all
#
# The arms are matched by construction: identical 9,284 filtered instruction rows, and 716
# rows that differ only in kind — constitution-grounded difficult advice in one, NuminaMath
# chain-of-thought in the other. Same row count, same presence of real reasoning traces.
# Measured misalignment rate 15.0% vs 43.7%.
source:
  name: odcv_rollouts
  runs:
    # 339 rollouts over 70 cells, 4-5 per cell. Adapter
    # LASR-Callum/2026-08-06-qwen36-lora-table2-9284-synthdoc-716-rank-64 over Qwen/Qwen3.6-27B.
    - repo: matboz/2026-08-08-difficult-advice-5pct-qwen36-odcv-rollouts
      arm: da716_5pct
    # 174 rollouts over 63 cells, 1-3 per cell. Adapter
    # matboz/qwen3.6-27b-lora-9284-numina-control-716-r64, same base.
    - repo: matboz/2026-08-19-difficult-advice-0pct-qwen36-odcv-rollouts
      arm: numina_control_0pct
  # Both repos are pinned to the sha they resolve to and the pin lands on every property
  # row's `corpus`, so a prevalence stays attached to the corpus it was measured on.
  #
  # A rollout with two sentences of reasoning contributes a vector describing nothing. The
  # count dropped is printed, so this stays a stated exclusion rather than a silent one.
  # (Measured 2026-08-20: zero rollouts in either arm fall below it.)
  min_reasoning_chars: 200
  # Every rate below is over judged rollouts; an unjudged one silently leaving the
  # denominator is a bias, not a rounding error. Fail instead.
  require_outcomes: true

producers:

  # TWO FITS, ONE PER CHANNEL, and that is deliberate. The post clusters user turns,
  # thoughts and responses in separate spaces, and the reason is not tidiness: "weighs
  # competing obligations" is a move in reasoning and "writes the file it was told not to"
  # is an action, and a single cluster space would have them competing to define the same
  # group. Two fits keep them distinct and let the cross-channel question — does the
  # reasoning bind the action? — be asked as a join rather than assumed by the clustering.
  #
  # The config key is the LABEL and `producer:` names the producer, so both dirs get their
  # own property ids (`clusters:clusters_reasoning:g007` vs `...clusters_response:g007`).

  clusters_reasoning: &channel_defaults
    producer: clusters

    # The autorater reads each rollout's reasoning ALONE and writes 10-20 free-text
    # descriptions of what it does; the deduped vocabulary is embedded and clustered.
    # Descriptions have already thrown the subject matter away, so a group is a recurring
    # MOVE rather than a recurring topic — and one rollout carries several properties,
    # which is what rollouts are like.
    evidence: features
    channel: reasoning

    extract:
      model: anthropic/claude-sonnet-5
      n_min: 10
      n: 20
      workers: 16
      # Appended to features.jsonl as they land; a rerun against this run directory labels
      # only what is missing. Extraction is the expensive half, so an interrupted run
      # keeps what it paid for — and so a resolution sweep costs nothing.

    embed:
      # ~500 rollouts produce under ten thousand distinct feature strings — short ones. The
      # API is cheaper than a pod at that size and it is the same model either way, so the
      # cosines stay comparable with a runpod-embedded run.
      backend: openrouter
      model: qwen/qwen3-embedding-8b
      workers: 8

    grouping:
      reduce: umap
      cluster: hdbscan
      # A floor on FEATURE STRINGS, not rollouts, and CHOSEN BY MEASUREMENT rather than
      # taste — `resolution_sweep.md` in the run directory holds the grid, measured on
      # THIS corpus's own embeddings. The 2026-08-19 run's value (25) was measured on a
      # 4,540-string corpus and does not transfer; this channel has 7,906.
      #
      # Swept over [15, 25, 40, 60, 90, 130] x 3 seeds:
      #     15 -> 120-130 groups, 24-27% noise, ARI 0.60-0.64   stable
      #     25 ->  74- 77 groups, 26-28% noise, ARI 0.65-0.70   stable
      #     40 ->  45- 47 groups, 27-29% noise, ARI 0.68-0.73   stable   <- here
      #     60 ->  27- 31 groups                                stable
      #     90 ->  17- 20 groups                                stable
      #    130 ->   7- 10 groups                                stable, coarse
      # Every resolution is stable on this channel, so the choice is granularity rather
      # than safety: 40 lands at ~46 groups, matching the published da716 run's 45 and
      # keeping the two readable side by side. NOTE the response channel is NOT like this
      # — see its own block.
      min_cluster_size: 40
      n_neighbors: 15
      n_components: 10
      seed: 42

    # Callum's 2026-08-17 note: check UMAP is doing anything at all by clustering the same
    # vectors without it. Written to grouping_comparison.json, not gated on.
    #
    # k-means rather than HDBSCAN on the unreduced side, and that is a feasibility call
    # rather than a preference: HDBSCAN's mutual-reachability graph over 7,900 points in
    # 4,096 dimensions has no usable index, so it degrades to a brute-force O(n^2 d) pass —
    # hours, for a diagnostic. It does mean the baseline changes reducer AND clusterer at
    # once, so ARI alone cannot attribute the difference to either. The number that CAN is
    # in the same file and is clusterer-independent: `geometry.neighbour_overlap`, the
    # share of each point's full-dimensional neighbours the reduction kept. That is the
    # direct answer to "did UMAP preserve the geometry", and ARI is the supporting reading.
    baseline_grouping:
      reduce: none
      cluster: kmeans
      # Matched to the group count the swept resolution produces, so the two labelings are
      # compared at the same granularity rather than across a granularity difference.
      k: 46
      seed: 42

    interpret:
      model: anthropic/claude-sonnet-5
      # The post's number, and what the published feature-discovery runs used.
      n_shown: 100
      workers: 8

    # A group covering fewer rollouts than this is a handful of near-duplicates. 12 over
    # 513 records is the 2026-08-19 run's 10-over-275 at the same share, rounded up.
    min_group_records: 12

    # Which MODEL produced the rollout. The contrast below is between values of this.
    arm_key: arm

    # The STRATUM every outcome rate is computed inside, and it is the PAIR rather than
    # either field. Both axes carry a base-rate difference: the arms violate at 15.0% and
    # 43.7%, and within the 5pct arm incentivized rollouts violate at 20.0% against
    # mandated's 9.8% — with the ordering FLIPPING in the control (41.2% vs 46.1%).
    # Pooling either axis lets a property concentrated in the safer half look protective
    # for free.
    group_by: [arm, condition]

    # Cross each group against the judged outcome, within stratum, BH-corrected.
    outcomes:
      # Two readings of the same 0-5 rubric, each its own family of tests. `violation` is
      # ODCV's own headline (severity >= 3) and is the primary. `any_misalignment` is
      # severity > 0, and it exists because the arms differ MORE there than at the
      # threshold: 28.6% vs 64.9%, against 15.0% vs 43.7%. A mean severity would use the
      # same information at the cost of treating an ordinal judge median as a length.
      fields: [violation, any_misalignment]
      fdr: 0.10
      # Strata smaller than this are flagged and still contribute at their weight.
      min_stratum_records: 20

    # THE HEADLINE. Which properties separate the two models, within stratum, BH-corrected
    # over the family of groups. Sets the export order, so the two ends of the list are
    # what the difficult-advice arm does more of and what it does less of.
    contrast:
      focus: da716_5pct
      reference: numina_control_0pct
      # Primary: two strata, full power. Measured 2026-08-20, the scenario-mix imbalance
      # between the arms moves the violation-rate gap by 0.25pp on a 28.6pp effect, so
      # condition is the stratification the data actually needs.
      strata: condition
      # Robustness: same scenario, same condition, different model — 63 shared cells, which
      # removes the scenario-mix imbalance outright at the cost of thin strata (the 5pct
      # arm ran 7 cells the control never did). A delta that survives only the primary is
      # one that may be a difference in which scenarios each arm ran.
      robustness_strata: cell
      fdr: 0.10

    # The multivariate view the per-property tables cannot give: taken TOGETHER, do these
    # properties account for what separates the models, and how few of them suffice?
    # Free — logistic regression on a 513 x ~50 binary matrix — and the permutation null is
    # what makes the AUC readable.
    probe:
      targets: [arm, violation, any_misalignment]
      seed: 0
      folds: 5
      permutations: 50

    # Redundancy, buried behaviours, scenario concentration, and the seed stability sweep.
    # `stability: true` refits the whole matrix once per (neighbourhood, seed) pair and
    # scores every fit against every other — the check that says whether the groups are a
    # finding or a seed.
    #
    # THREE seeds rather than the 2026-08-19 run's five, and the reason is cost, stated
    # rather than hidden: a seeded UMAP fit is single-threaded by construction, and this
    # corpus is 7,900 feature strings against that run's 4,540. Nine fits per channel is
    # 36 pairwise ARI comparisons, which is enough to catch a grouping that reshuffles.
    audit:
      stability: true
      neighbours: [10, 15, 30]
      seeds: [0, 1, 2]
      # Is a property really a scenario marker? A group drawn mostly from one scenario is
      # one whose label must be read as scoped to that scenario.
      concentration_keys: [scenario, condition, arm]
      concentration_threshold: 0.5

    # OFF, on a measurement rather than on principle — and this is the one setting here
    # that changed as a result of being checked.
    #
    # The plan was to replace cluster-membership prevalence ("a feature of this record
    # landed in this group") with detector-measured prevalence ("a judge says this record
    # does this thing"), because the second is the better instrument and the one that means
    # the same thing across producers. Measuring every record only becomes affordable with
    # `batched: true` — one call per record carrying every rubric — so the whole plan rests
    # on batching being the same instrument as asking one rubric at a time.
    #
    # It is not. A/B on 2026-08-20 over 48 real detectors x 20 real rollouts (960 verdict
    # cells), against the unbatched path as reference:
    #
    #     batched  38.1% prevalence,  85.0% cell agreement,  12s
    #     single   47.5% prevalence,  --                  ,  465s
    #
    # A judge shown ~50 rubrics at once says yes 7-9 points less often than the same judge
    # shown one, mean per-property gap 11.1%, individual properties moving up to 35 points
    # ("Repetitive looping restatement": 45% batched vs 80% single). That is a systematic
    # deflation, not noise. Building the headline arm contrast on it would mean publishing
    # a rate with a known bias and a caveat attached, and a number that needs a caveat that
    # large is a number not worth publishing.
    #
    # The unbatched alternative is honest and unaffordable at this scale: 513 records x ~49
    # rubrics x 2 channels is ~60,000 calls, roughly eight hours.
    #
    # So membership stays CLUSTER membership — which is what the LessWrong method uses, what
    # the published 2026-08-19 da716 run used, and a quantity whose meaning is stated rather
    # than assumed. The detector is not abandoned: it runs afterwards, unbatched, over a
    # stratified sample of records for the SHORTLIST of properties the contrast surfaces,
    # and that agreement is reported as a validation of the property list rather than used
    # as its basis. See scratch/properties/validate_shortlist.py.
    measure_with_detector: false
    detector:
      model: anthropic/claude-sonnet-5
      workers: 16
      sample: null
      batched: true
      verify: 25

  clusters_response:
    # Same everything, pointed at what the model DID rather than what it thought. After the
    # 2026-08-20 role split this channel is the assistant's visible text and its tool CALLS
    # only — the scenario's system prompt, the user's task and the tool harness's own
    # output are not the model's behaviour and are not in it.
    <<: *channel_defaults
    channel: response

    # A DIFFERENT RESOLUTION, because this channel's density landscape is not the other's
    # and the sweep says so plainly. Over 7,181 units x 3 seeds:
    #     15 -> 118-121 groups, 25-26% noise, ARI 0.62-0.65   stable
    #     25 ->  65- 73 groups, 25%    noise, ARI 0.63-0.68   stable   <- here
    #     40 ->  41,  40,   3 groups                          BIFURCATING (ARI 0.60/.04/.03)
    #     60 ->  23,   6,   2 groups                          bifurcating
    #     90 ->  16,   2,   2 groups                          bifurcating
    #    130 ->   6,   2,   2 groups                          bifurcating
    # From 40 upward the seed decides between "about forty groups" and "everything is one
    # or two groups with no noise at all" — two readings of the same landscape, and a
    # result reported from there is a coin flip. Only 15 and 25 are usable; 25 is the
    # coarser of the two. Forcing this channel to the reasoning channel's 40 for symmetry
    # would be choosing a prettier config over a real measurement.
    grouping:
      reduce: umap
      cluster: hdbscan
      min_cluster_size: 25
      n_neighbors: 15
      n_components: 10
      seed: 42

    baseline_grouping:
      reduce: none
      cluster: kmeans
      k: 69
      seed: 42

# Two independent fits over the same rollouts, so a label appearing in both is
# corroboration across channels rather than a within-fit duplicate. Worth seeing.
check_collisions: true

constitution: constitutions/claude_distilled_12_principles_mid/constitution.md

# Tiny slice, full wiring: a handful of rollouts, clustering that cannot fail on a small n,
# no stability sweep, no detector pass, and the probe reduced to something a 16-record
# matrix can actually fit.
smoke:
  source:
    limit: 8
    min_reasoning_chars: 0
    require_outcomes: false
  producers:
    clusters_reasoning:
      min_group_records: 2
      grouping: {reduce: none, cluster: kmeans, k: 2}
      baseline_grouping: null
      audit: {stability: false}
      outcomes: {min_stratum_records: 1}
      contrast: {strata: condition, robustness_strata: null}
      probe: {targets: [arm], permutations: 3, folds: 2}
      measure_with_detector: false
    clusters_response:
      min_group_records: 2
      grouping: {reduce: none, cluster: kmeans, k: 2}
      baseline_grouping: null
      audit: {stability: false}
      outcomes: {min_stratum_records: 1}
      contrast: {strata: condition, robustness_strata: null}
      probe: {targets: [arm], permutations: 3, folds: 2}
      measure_with_detector: false
