# ABOUTME: 10k-example mixture for the FIRST model-eval-model organism: 8,000 spec-filtered
# ABOUTME: Table-2 interchange rows + 2,000 m1/m2 self-eval docs (supervise: final).
# Run: uv run python scripts/data/mixture/build_mixture.py --config configs/data/mixture/2026-08-07_qwen36_table2_memory_self_20_80.yaml
#
# The model-eval-model twin of qwen36_table2_selfreflect_20_80: same 80/20-by-examples
# shape, with the 20% side the self-arm corpus. Converted to the interchange schema on
# 2026-08-07 (its original `format: rendered` inputs cannot run since the legacy mode's
# removal; this is a RECIPE, not a byte-for-byte regenerator of the pre-conversion arm —
# the rendered originals live on HF, see this file's git history):
# - table2: the spec-filtered Table-2 pool in interchange form. Produce it by running
#   configs/data/mixture/2026-08-06_qwen36_msm_table2.yaml stages 1-2 (filter ~ $4-5 in judge
#   calls, ledger 2026-08-06) and staging its mixture_filtered.jsonl here. The
#   pre-conversion arm's Qwen-rendered pool
#   (LASR-Callum/2026-08-04-table2-only-9284-h200x4-train) has no interchange original.
# - mem_self: stage_5_sft.jsonl from LASR-Callum/2026-08-06-model-eval-model-self
#   (2,087 interchange rows; metadata.supervise=final rides through build_mixture so
#   only the reflection turn trains).

seed: 0
# Budget/length counting only — the stored rows carry no model-specific rendering.
tokenizer: "Qwen/Qwen3.6-27B"

sources:
  table2:
    path: "data/msm_table2_filtered_8000.jsonl"
    reasoning: none
    examples: 8000
  mem_self:
    path: "data/model_eval_model_self_sft.jsonl"
    reasoning: native
    examples: 2000

# Matches the twin arm's training window; mem_self rows top out ~4.6k rendered tokens.
max_seq_len: 8192

output_dir: "output/mixture_table2_memself_20_80"
