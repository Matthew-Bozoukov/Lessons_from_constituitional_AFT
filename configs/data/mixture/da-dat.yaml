# ABOUTME: The combined arm: difficult-advice AND difficult-agentic-task rows in one mixture,
# ABOUTME: equal shares of the synthetic budget. Publishes as `<date>-da-dat-<pct>-mix`.
# Run: uv run mix --config configs/data/mixture/da-dat.yaml [synthetic_pct=100 total_examples=1400]
#
# Same shape as da.yaml and dat.yaml: the nosynth blend supplies the non-synthetic share at
# fixed proportions and `synthetic_pct` is a launch argument. Two synthetic sources with
# equal `examples` budgets split the synthetic share 50/50 (blend() uses budgets as RATIOS),
# so `synthetic_pct=100 total_examples=1400` is 700 da rows + 700 dat rows and nothing else:
#   da  -> the DA baseline, neutral 752: the 2026-09-14 regeneration
#          against the full-length neutral constitution, trait-balanced as in the 2026-09-15 da-7 mix
#   dat -> 2026-09-07 bash-only dat-synth @f76acecd (as dat-7 on 2026-09-08)
# (The 2026-09-09 da-dat-100 arm drew its da rows from the 2026-08-21 principle-scoped corpus
# @48aef0e2, the DA baseline then; that mixture's resolved config travels with it.)

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"
max_seq_len: 8192

base: "configs/data/mixture/nosynth.yaml"
base_mixture:
  repo: "${oc.env:HF_ORG}/2026-09-22-nosynth-mix"
  file: mixture.jsonl
  revision: "5bbf1ecb1d78ccf6cfd24f78b873532f984d2342"

synthetic_pct: 100
total_examples: 1400

sources:
  da:
    dataset: "${oc.env:HF_ORG}/2026-09-14-da-synth"
    revision: "013886238fca238c4d54ace96530f444bb2b2f02"
    examples: 1
    reasoning: native
    balance_by: trait_id
  dat:
    dataset: "${oc.env:HF_ORG}/2026-09-07-dat-synth"
    revision: "f76acecdeced7dc5eaa31c6883da639476eb78d4"
    examples: 1
    reasoning: native

output_dir: "output/mixture_da_dat"

hf:
  experiment: "combined arm: 700 rows of the DA baseline (neutral 752, the 2026-09-14 regeneration) plus the 700 difficult-agentic-task rows of the 09-08 dat-7 mixture, no replay blend"
  constitution: "constitutions/claude_distilled_09_principles/constitution.md"
  private: false
