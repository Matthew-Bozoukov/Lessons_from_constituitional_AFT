# ABOUTME: The MSM paper's Table 2 instruction-tuning mixture (10,000 samples at its exact
# ABOUTME: per-source counts) + spec filter + the difficult-advice synthetic share.
# Run: uv run scripts/data/mixture/build_mixture.py --config configs/data/mixture/qwen36_msm_table2.yaml
#
# The staged pipeline this config drives (see src/data/mixture/build_mixture.py):
#   1. mix the nine Table-2 sources at their verbatim counts  -> push mixture_unfiltered.jsonl
#   2. spec-filter them against the constitution              -> push mixture_filtered.jsonl
#      + verdicts.jsonl (re-cut the filter at any threshold without re-judging)
#      then stratified-downsample the kept rows to keep_examples
#   3. mix in the difficult-advice synthetic share            -> push mixture.jsonl
# Rows are MODEL-AGNOSTIC interchange messages (reasoning as reasoning_content, never
# rendered think tags); train_lora applies the family template at train time.
#
# The filtered artifact of stage 2 is itself the 0%-synthetic control arm's training file.

seed: 0
# Budget/length counting only — the stored rows carry no model-specific rendering.
tokenizer: "Qwen/Qwen3.6-27B"

# 8192, not the 3072 of the earlier arms: LongAlign's rows average 10,677 tokens and ALL
# of them exceed 3072. Even at 8192 roughly 80% are dropped, so that source is the one to
# watch in the build report — see its note below.
max_seq_len: 8192
shuffle_buffer: 1000

# Table 2 verbatim; the nine base counts sum to exactly 10,000. Each spec's key resolves
# its adapter in src/data/mixture/sources/ (repo, subset, schema normalisation).
sources:
  no_robots:
    examples: 2779
    reasoning: none
  tulu3_if:
    examples: 1471
    reasoning: none
  numinamath_cot:
    examples: 1063
    reasoning: none
  self_oss_instruct:
    examples: 1064
    reasoning: none
  smol_constraints:
    examples: 1055
    reasoning: none
  apigen_function_calling:
    examples: 1054
    reasoning: none
  smol_summarize:
    examples: 984
    reasoning: none
  # GAIR/lima ships a loading script HF no longer supports, so the adapter reads the same
  # data re-uploaded in vicuna format. Verify provenance before publishing anything from it.
  lima:
    examples: 314
    reasoning: none
  # Long-context alignment data: mean 10,677 tokens, ~80% still exceed 8192. Whatever
  # survives the cap is the SHORT TAIL of the distribution, not a representative sample,
  # and only ~2% of its tokens are supervised (long document in, one-line answer out).
  longalign:
    examples: 216
    reasoning: none
  # The synthetic difficult-advice corpus joins AFTER the filter (constitution-generated;
  # judging it against the same constitution would be circular). Pull the stage-6 export
  # from HF (LASR-Callum/2026-08-04-synthdoc-difficult-advice-9-principles,
  # stage_6_final.jsonl) or point at a local output/synthdoc_v2/<ts>/stage_6_final.jsonl.
  difficult_advice:
    source: difficult_advice
    path: "data/difficult_advice_stage6.jsonl"
    examples: 2203
    reasoning: native
    synthetic: true

filter:
  constitution: "constitutions/claude_distilled_12_principles_mid/constitution.md"
  model: "openai/gpt-5.6-terra"
  workers: 24
  max_chars: 12000
  # After filtering (~7% rejected on the 2026-08-04 run), hold the Table-2 source
  # proportions while cutting to a round training share.
  keep_examples: 8000

hf:
  experiment: "MSM Table 2 instruction-tuning mixture, spec-filtered, + difficult-advice synthetic share (Teaching Claude Why replication)"
  # Naming rule: the date is the day the data is GENERATED — bump before a fresh run.
  base_repo: "LASR-Callum/2026-08-06-msm-table2-instruction-mixture-spec-filtered"
  final_repo: "LASR-Callum/2026-08-06-msm-table2-difficult-advice-sft-mixture"
  private: false

output_dir: "output/mixture_msm_table2"
