# ABOUTME: The reasoning-only (CoT-only) arm: configs/data/mixture/da.yaml with ONE field changed -- the da source's
# ABOUTME: `supervise:`. Publishes as `<date>-da-<pct>-cot-mix`.
#
# 2026-10-07. A LABEL change, not a data change: this reads the SAME corpus as the da arm, byte
# for byte, and the same plain base at the same revision, so this arm and `2026-10-05-da-15-mix`
# differ in nothing but which tokens of a da row carry loss. src/train/masking.py: "cot" supervises only the final turn's REASONING and TRUNCATES the row at its
# think_close, so the visible answer never enters the sequence.
#
# The supervise modes and the masking rule are Nika's (nika/cot-only-supervision, 2026-08-31,
# scratch/cot_only/); her cot-only arm measured ODCV 14.1% [6.2, 23.4].
#
# `variant:` is the name's word for the override (src/naming.py SUPERVISE_VARIANTS); the builder
# refuses one without the other, so that a variant cannot publish under the plain da name and be
# its own control.
variant: cot

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"
max_seq_len: 8192

# THE fixed non-synthetic blend. The YAML supplies proportions; base_mixture supplies
# the already-reviewed rows and existing reasoning, rather than resampling upstream.
base: "configs/data/mixture/plain.yaml"
base_mixture:
  # 2026-10-05: the `plain` base -- 1,832 rows / 5,000,005 supervised tokens with a published (not on-policy)
  # reasoning trace on every row: 45% chat, 22.5% maths, 22.5% code, 10% science (plain.yaml; the mix's card).
  # Until this date the base was 2026-09-29-nosynth-mix @ 058e163e (the MSM Table 2 blend with on-policy
  # Qwen3.6 traces on 1,130 rows, `base: nosynth.yaml`), which every da arm before it was built on; that base
  # with its traces removed is 2026-10-05-msm-mix, and da-msm.yaml is this arm on it.
  repo: "${oc.env:HF_ORG}/2026-10-05-plain-mix"
  file: mixture.jsonl
  revision: "019e239ce51f5adbbcaff4f92f26e63fcd31c080"

# The synthetic share: the number in the mixture's name and the only thing that varies
# across this ladder. It is a share of SUPERVISED TOKENS, not rows (`share_unit` below).
# Under token weighting (`train.loss_agg: token_mean`) that is the synthetic source's share
# of the gradient.
synthetic_pct: 15
# How the share is taken (`plan_swap` in src/data/mixture/build_mixture.py, 2026-09-21): the
# mixture is the size of the published nosynth base; base rows are removed in a seeded,
# source-proportional, share-nested order until `synthetic_pct` of the base's supervised
# tokens are freed, and synthetic rows refill them trait-balanced.
# Mixtures built before 2026-09-22 (`total_examples: 10000`, no `share_unit`) declared a share
# of ROWS: da-7 by rows was 15.4% of supervised tokens, so the numbers are not comparable.
share_unit: supervised_tokens
# The synthetic share. Several styles here would split the share by these budgets and the
# mixture would be `da-<style>-<pct>`; with one style the budget only has to be non-zero.
sources:
  da:
    # The 2026-09-23 regeneration on the ambiguous-decision recipe (configs/data/synth/da.yaml
    # on branch jamie/da-ambiguous: undecided user, stage 4 leaves a direct test alone,
    # grounded rewrite with a saved audit): 769 rows, t1 83 ... t9 86. The previous corpus,
    # 2026-09-14-da-synth @ 013886238fca238c4d54ace96530f444bb2b2f02 (752 rows), is what
    # every da-15 arm before this date trained on.
    # 2026-09-24: the same recipe extended (`extend_from`, src/data/synth/ours/extend.py):
    # the 769 rows above carried verbatim plus 557 new ones deduped against them, 1,326 in
    # all (t1 146 ... t9 147) -- enough for a 25% supervised-token share. The 09-23 repo @
    # 1f816d13 is what da-15 trained on before this date and is a prefix of this one.
    # 2026-09-25: regenerated from scratch on the "ask, not instruct" wording (da.yaml @
    # 9f093f2c: the sender may wonder about the assistant but never orders it; the reviser
    # never adds an instruction to the assistant): 1,155 rows, t1 130 ... t9 130, t6 126.
    # The pressure classifier puts t6 at override 12% (was 69%) and the corpus at monitor
    # 3% (was 10%). The 09-24 repo @ 4f4ca43b is what da-15/da-5/da-25 trained on before.
    # 2026-09-28: regenerated with trait notes keeping every scenario human except t6 (the
    # principle's human version; no AI system but the assistant), the reviser seeing the same
    # notes, a grey-area requirement 4 and a gender audit line (da.yaml @ 47efcc60): 1,194
    # rows, t1 134 ... t9 133. The user's organisation runs an AI system in 76% of the 09-25
    # corpus and 11-15% of the smokes on this recipe. The 09-25 repo @ 618060e1 is what
    # da-15 (seeds 0, 1) and da-new-t6 trained on before this date.
    # 2026-09-29 (UTC 09-28): the same corpus minus 8 rows an error audit found must go
    # (scratch/da_error_screen.py + da_error_judge.py, every row read): an invented
    # drug interaction, an illegal eagle sale endorsed, an advisor-client loan endorsed, three
    # pipeline leaks ("the prompt", "the principle here", "the draft" x2) and a misapplied
    # oversight frame. Derived, not regenerated (scratch/derive_corpus_subset.py); 1,186 rows.
    # 2026-10-01: regenerated on the recipe that is configs/data/synth/da.yaml from this date
    # (the 2026-09-23 recipe + the writer's ask anchored on the convenient path + a t6-only
    # note + half of every non-t6 trait's writer calls told no AI system appears): 647 rows,
    # t1 73 ... t9 72. Another AI is central in 14% of rows, the assistant itself in 11%.
    # The 09-28 repo @ 14efefbf is what da-15 trained on before this date.
    # 2026-10-02: regenerated with each writer call DEALT a sector (43) and its AI presence, the wave
    # list off, the similarity gate at 0.78 and `dedupe_scenarios` gone (configs/data/synth/da.yaml @
    # 8f2a0d23): 642 rows, t1 71 ... t9 72, t6 68. Dealt outside t6: 12% the assistant itself, 11% another
    # AI system, 39% no AI, 38% nothing said; t6 half self, half other. The 10-01 repo @ a2e3434b is what
    # 2026-10-01-da-15-mix trained on.
    # 2026-10-02 (later): the same recipe plus one sentence in the writer, drafter and reviser (the person
    # is weighing, not demanding, and the right option is not clear): 646 rows, generated as
    # 2026-10-02-da-unclear-synth @ 80ad3793 and republished as this repo's head. The repo @ b758bcdd is
    # the corpus without the sentence, which 2026-10-02-da-15-mix @ 508af3a2 was built from.
    # 2026-10-02 (later still): extended to 1,283 rows by a second run of the same recipe (similarity gate
    # seeded with the first run's scenarios, sector walk continued where the first run stopped). Needed
    # because a 25% share takes about 1,190 rows. 2026-10-02-da-15-mix @ 5bc0eb0e was built from 12437255.
    dataset: "${oc.env:HF_ORG}/2026-10-02-da-synth"
    revision: "305914d58627457002f61d86ba69866f6fa2b9a9"
    examples: 1
    reasoning: native
    supervise: cot
    balance_by: trait_id

# Reuse the published corrected base verbatim, including its reasoning traces.
# No additional spec filtering or synthetic generation is run.

output_dir: "output/mixture_da_cot"

hf:
  experiment: "difficult-advice arm: the plain base blend (2026-10-05-plain-mix) scaled around a synthetic difficult-advice share"
  constitution: "constitutions/claude_distilled_09_principles/constitution.md"
  private: false
