# ABOUTME: The low-stakes difficult-advice arm: the base blend (configs/data/mixture/plain.yaml) scaled around a
# ABOUTME: synthetic share generated by configs/data/synth/da-low.yaml. Publishes as `<date>-da-low-<pct>-mix`.
# Run: uv run mix --config configs/data/mixture/da-low.yaml [synthetic_pct=15]
#
# configs/data/mixture/da.yaml with one thing changed: the synthetic source. Same base, same pin, same share
# unit, so an adapter trained on this mix differs from the da one only in the magnitude of the stakes in the
# synthetic rows (the recipe differs from da.yaml in three sentences; see the synth config's header).

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"
max_seq_len: 8192

base: "configs/data/mixture/plain.yaml"
base_mixture:
  # 2026-10-06: the `plain` base, as da.yaml (1,832 rows / 5,000,005 supervised tokens, published traces on every
  # row). 2026-10-04-da-low-15-mix @ its head was built on 2026-09-29-nosynth-mix @ 058e163e (`base: nosynth.yaml`),
  # the base every arm before 2026-10-05 used; this arm follows da.yaml onto plain so the two stay comparable.
  repo: "${oc.env:HF_ORG}/2026-10-05-plain-mix"
  file: mixture.jsonl
  revision: "019e239ce51f5adbbcaff4f92f26e63fcd31c080"

synthetic_pct: 15
share_unit: supervised_tokens
sources:
  da-low:
    # 2026-10-04: 894 rows from da-low.yaml @ 49ab6f1a-ish (900 scenarios, Haiku/Sonnet as da.yaml, 6 dropped by the
    # lint); about 1,020 supervised tokens a row, so a 15% share takes about 715 rows.
    dataset: "${oc.env:HF_ORG}/2026-10-04-da-low-synth"
    revision: "c8a61e2661be8d564b27bfb513ba3f31eec27897"
    examples: 1
    reasoning: native
    balance_by: trait_id

output_dir: "output/mixture_da_low"

hf:
  experiment: "low-stakes difficult-advice arm: the plain base blend (2026-10-05-plain-mix) scaled around a synthetic difficult-advice share whose scenarios keep every consequence small, the stakes-magnitude comparison for the difficult-advice baseline"
  constitution: "constitutions/claude_distilled_09_principles/constitution.md"
  private: false
