# ABOUTME: The Sonnet-taught deliberative-alignment arm: the base blend (configs/data/mixture/nosynth.yaml)
# ABOUTME: scaled around a synthetic `delib-sonnet` share. Publishes as `<date>-delib-sonnet-<pct>-mix`.
# Run: uv run mix --config configs/data/mixture/delib-sonnet.yaml [synthetic_pct=7]
#
# delib.yaml with ONE change: the synthetic corpus. Same pinned nosynth base, same seed, so this
# arm, delib-7 and da-7 share their 9,300 replay rows byte for byte. The corpus is the DA
# BASELINE's prompts (neutral 752, 2026-09-14-da-synth @ 01388623) answered by Sonnet 5
# deliberating over the abridged constitution in a templated <think> block (the model's hidden
# thinking is off; Anthropic returns only a summary of it and skips it on some prompts),
# best-of-2 filtered by the same Sonnet judge, one judge run: 751 of 752 prompts survived
# (2026-09-16). 7% of 10,000 is 700, so 700 of the 751 are drawn at random (seed 0); no trait
# balancing, as in delib.yaml. The superseded arm used the 708-prompt 2026-09-08-da-synth
# corpus (2026-09-11-delib-sonnet-synth @ 74f12a4b, 707 rows; docs/LOG.md 2026-09-12).
#
# Masking is identical to delib-7's: one assistant turn per row, `supervise: final` (== `all`
# on a single-turn row), the trace in `reasoning_content` rendered natively at train time --
# the think prefill masked, the trace, its close, the answer and the turn end supervised.

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"
max_seq_len: 8192

base: "configs/data/mixture/nosynth.yaml"
base_mixture:
  repo: "${oc.env:HF_ORG}/2026-09-22-nosynth-mix"
  file: mixture.jsonl
  revision: "378ec1ee0f0eea9294683779438b839e52b9700a"

synthetic_pct: 7
# The synthetic share is a share of SUPERVISED TOKENS (`plan_swap` in src/data/mixture/build_mixture.py,
# 2026-09-21): the published nosynth mixture is the size of this arm, base rows leave in a
# seeded, source-proportional, share-nested order until `synthetic_pct` of its supervised
# tokens are freed, and synthetic rows refill them trait-balanced. Under token weighting
# (`train.loss_agg: token_mean`) that share IS the source's share of the gradient. Mixtures
# built before 2026-09-22 (`total_examples: 10000`, no `share_unit`) declared a share of ROWS
# — da-7 by rows was 15.4% of supervised tokens — and are not comparable at equal numbers.
share_unit: supervised_tokens
sources:
  delib-sonnet:
    dataset: "${oc.env:HF_ORG}/2026-09-16-delib-sonnet-synth"
    revision: "6628d1f71e558e74291f045b47d3cfaebb43481d"
    examples: 1
    reasoning: native

output_dir: "output/mixture_delib_sonnet"

hf:
  experiment: "deliberative-alignment arm, Sonnet 5 as teacher: the MSM Table 2 base blend scaled around a synthetic share of Sonnet's constitution-guided answers (templated think traces) to the difficult-advice prompts, best-of-N judge-filtered"
  constitution: "constitutions/abridged/constitution.md"
  private: false
