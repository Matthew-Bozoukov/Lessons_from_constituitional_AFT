# ABOUTME: The LESS arm's training file — the 220 highest-influence rows (top 10%) of the
# ABOUTME: difficult-advice pool by score_max, and nothing else.
# Run: uv run mix --config configs/data/mixture/qwen36_less_top10.yaml
#
# THE LESS ARM. Its control is qwen36_less_random220.yaml, which differs in one line —
# the source `path:` — and therefore in WHICH 220 rows of the same 2,203-row pool are
# taken, and nothing else: same tokenizer, same budget, same seed, same shuffle.
#
# This is LESS as the paper runs it: rank the candidate pool by influence on a target
# behaviour, keep the top fraction, train on the kept rows alone. It is NOT the 2026-08-17
# less-swap arm, which left a 10,000-row mixture intact and replaced 151 of its rows.
#
# `score_max` is the paper's aggregation (max over the validation set) and is the ordering
# the published ranking's `rank` field already carries. Read the selection knowing what it
# is: 199 of the 220 rows win on the `stayed_ai` subtask, so this arm is trained on a
# largely one-behaviour selection. docs/LOG.md 2026-08-14 measures that collapse; the
# alternative is `score_mean`, which shares only 131/220 rows with this cut.
#
# The input file is written by scratch/less/select_topk.py, which pins the ranking to an
# exact HF commit and asserts the positional join to the pool. Regenerate it before
# rebuilding this mixture — the path is a local staging file, not the provenance. The
# provenance is `ranking` in data/less/selection_meta.json.
#
# No `filter:` block. The pool is generated FROM the constitution below, so spec-filtering
# it against that same constitution would be circular — the same reasoning that puts the
# difficult-advice share after the filter in qwen36_msm_table2.yaml.

seed: 0
# Budget/length counting only; the stored rows carry no model-specific rendering.
tokenizer: "Qwen/Qwen3.6-27B"

# 8192 to match every other arm in this family. Nothing here is near it: the longest of
# the 220 rows is 2,243 tokens, so no row is dropped and the cap is inert.
max_seq_len: 8192

sources:
  less_top10:
    source: difficult_advice
    path: "data/less/d_top10_score_max.jsonl"
    # Exact by contract: the builder fails loudly if the file holds fewer than 220 usable
    # rows, which is what would happen if a row were dropped by the length cap.
    examples: 220
    # Every row carries a real reasoning trace (asserted in select_topk.py), which is what
    # lets the train config declare `thinking: true`.
    reasoning: native

hf:
  experiment: "LESS top-10% selection over the difficult-advice pool (score_max), as a standalone SFT arm"
  constitution: "constitutions/claude_distilled_12_principles_mid/constitution.md — the constitution the scored pool was generated from; every row traces to one of its traits via metadata.trait_id in the source pool"
  final_repo: "LASR-Callum/2026-08-19-less-top10-difficult-advice-220-train"
  private: false

output_dir: "output/mixture_less_top10"
