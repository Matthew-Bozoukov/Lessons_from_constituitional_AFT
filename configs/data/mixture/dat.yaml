# ABOUTME: The difficult-agentic-task arm: the base blend (configs/data/mixture/nosynth.yaml)
# ABOUTME: scaled around a synthetic `dat` share. Publishes as `<date>-dat-<pct>-mix`.
# Run: uv run mix --config configs/data/mixture/dat.yaml [synthetic_pct=7]
#
# The flipped experiment's training file (docs/LOG.md 2026-09-06): agentic deliberation rows
# in, conversational misalignment evals out. Same shape as da.yaml -- the nosynth blend's
# proportions are held and only its total shrinks around the synthetic share, which is a
# launch argument -- with two deliberate differences:
#
#   * NO `filter:` block. Both DA and DAT now sample the same pinned, corrected nosynth
#     mixture with the same seed, retaining selected rows and reasoning verbatim.
#     The base YAML supplies proportions only; it does not reload upstream sources.
#   * The synthetic rows carry `tools` and `tool_calls` (the ODCV bash/task_complete
#     schemas), rendered by the training family's template (src/model_profile.py
#     render_chat), and `supervise: final` under `metadata`, so only the deliberation turn
#     is loss. Both ride through `_take_interchange` untouched. Since 2026-09-07 that
#     supervised turn calls `bash` ALONE: `task_complete` is still declared in `tools`,
#     because the harness offers it, but no row demonstrates calling it. The 09-06 corpus
#     fired both in one turn, so the summary asserted an outcome the command had not
#     produced, and the arm learned to report success over failed commands (docs/LOG.md
#     2026-09-07). Read submission rate first on any eval of this arm.
#
# `dataset:` is the canonical synth intake: the repo's default config (dataset.jsonl),
# pinned to its exact sha in run_meta. 733 rows are on the Hub; 7% of 10,000 takes 700.

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"
max_seq_len: 8192

base: "configs/data/mixture/nosynth.yaml"
base_mixture:
  repo: "${oc.env:HF_ORG}/2026-09-22-nosynth-mix"
  file: mixture.jsonl
  revision: "5bbf1ecb1d78ccf6cfd24f78b873532f984d2342"

synthetic_pct: 7
# The synthetic share is a share of SUPERVISED TOKENS (`plan_swap` in src/data/mixture/build_mixture.py,
# 2026-09-21): the published nosynth mixture is the size of this arm, base rows leave in a
# seeded, source-proportional, share-nested order until `synthetic_pct` of its supervised
# tokens are freed, and synthetic rows refill them trait-balanced. Under token weighting
# (`train.loss_agg: token_mean`) that share IS the source's share of the gradient. Mixtures
# built before 2026-09-22 (`total_examples: 10000`, no `share_unit`) declared a share of ROWS
# — da-7 by rows was 15.4% of supervised tokens — and are not comparable at equal numbers.
share_unit: supervised_tokens
sources:
  dat:
    dataset: "${oc.env:HF_ORG}/2026-09-07-dat-synth"
    revision: "f76acecdeced7dc5eaa31c6883da639476eb78d4"
    examples: 1
    reasoning: native

output_dir: "output/mixture_dat"

hf:
  experiment: "difficult-agentic-task arm: the MSM Table 2 base blend (unfiltered, as the nosynth control) scaled around a synthetic difficult-agentic-task share"
  constitution: "constitutions/abridged/constitution.md"
  private: false
