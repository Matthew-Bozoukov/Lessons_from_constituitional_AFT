# ABOUTME: The difficult-advice arm on the TRACE-FREE base: da.yaml with the base blend swapped for
# ABOUTME: <date>-msm-mix (the MSM Table 2 rows with no on-policy reasoning). Publishes as `<date>-da-msm-<pct>-mix`.
# Run: uv run mix --config configs/data/mixture/da-msm.yaml [synthetic_pct=15]
#
# What this one changes against da.yaml is the base and nothing else: the same difficult-advice corpus at the
# same pinned revision, the same share rule, the same seed. The base is `2026-10-05-msm-mix`, which is
# `2026-09-29-nosynth-mix` (da.yaml's base) with its 1,143 Qwen3.6-27B traces removed -- the same 10,000 rows
# in the same order -- so an arm built here against one built from da.yaml isolates whether the base blend
# needs on-policy traces. The source key below is `da-msm`, not `da`, because a mixture is named from its
# synthetic source keys and this arm must not publish under da.yaml's name.

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"
max_seq_len: 8192

# The blend's proportions come from nosynth.yaml (the nine MSM Table 2 sources at their exact counts, which
# the msm mix keeps); the rows come from the published trace-free mix.
base: "configs/data/mixture/nosynth.yaml"
base_mixture:
  # 2026-10-05: 2026-09-29-nosynth-mix @ 058e163e with every reasoning_content removed
  # (scratch/nosynth_no_traces/build.py). 2,145,839 supervised tokens under the history rule.
  repo: "${oc.env:HF_ORG}/2026-10-05-msm-mix"
  file: mixture.jsonl
  revision: "844f7edfdf2a9f7bec5a92c4e838dc2cce5935c5"

# A share of SUPERVISED TOKENS, as in da.yaml. NOTE the base here holds 2.15M supervised tokens against the
# traced base's 4.84M, so the same percentage is fewer difficult-advice rows: 15% is about 280 rows here and
# about 630 on da.yaml's base. To hold the ABSOLUTE dose fixed across the two bases, raise this share.
synthetic_pct: 15
share_unit: supervised_tokens
sources:
  da-msm:
    # The corpus da.yaml pins: 2026-10-02-da-synth @ 305914d5, 1,283 rows.
    dataset: "${oc.env:HF_ORG}/2026-10-02-da-synth"
    revision: "305914d58627457002f61d86ba69866f6fa2b9a9"
    examples: 1
    reasoning: native
    balance_by: trait_id

output_dir: "output/mixture_da_msm"

hf:
  experiment: "difficult-advice arm on the trace-free MSM Table 2 base blend (2026-10-05-msm-mix): da.yaml with only the base changed"
  constitution: "constitutions/claude_distilled_09_principles/constitution.md"
  private: false
