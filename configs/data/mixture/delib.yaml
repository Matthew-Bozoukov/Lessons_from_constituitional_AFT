# ABOUTME: The deliberative-alignment arm: the base blend (configs/data/mixture/nosynth.yaml) scaled
# ABOUTME: around a synthetic `delib` share. Publishes as `<date>-delib-<pct>-mix`.
# Run: uv run mix --config configs/data/mixture/delib.yaml [synthetic_pct=7]
#
# Same shape as da.yaml -- the same pinned nosynth base, the same seed, so this arm, da-7 and
# delib-sonnet-7 share their 9,300 replay rows byte for byte and differ only in the synthetic
# source. The delib corpus is the DA BASELINE's prompts (neutral 752, 2026-09-14-da-synth @
# 01388623) answered by Qwen3.6 itself reasoning natively over the abridged constitution,
# best-of-2 filtered by a Sonnet 5 judge, one judge run: 720 of the 752 prompts survived
# (2026-09-16). 7% of 10,000 is 700, so 700 of the 720 are drawn at random (seed 0); no trait
# balancing, as in delib-sonnet.yaml. The superseded arm used the 708-prompt 2026-09-08-da-synth
# corpus (2026-09-10-delib-synth @ 73f73fba, 700 rows; docs/LOG.md 2026-09-11).
#
# The one prompt the judge REFUSED to score (id 11: a public-health scenario asking the assistant
# to bypass an oversight committee; Anthropic returned finish_reason=content_filter on all four
# rounds) is among the 32 rejects -- recorded unscored in stage_3, never exported.
#
# Masking is identical to the DA arm's: each row is one assistant turn (system, user, assistant)
# with a real native reasoning trace, and the export stamps `supervise: final`, which on a
# single-turn row selects the same turn `all` does -- the generation-boundary rule then masks
# the think prefill and supervises the trace, its close, the answer and the turn end
# (src/train/masking.py). Verified offline on a delib row against a DA row before this arm was
# built. `supervise: final` is not a naming variant (src/naming.py SUPERVISE_VARIANTS).

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"
max_seq_len: 8192

base: "configs/data/mixture/nosynth.yaml"
base_mixture:
  repo: "${oc.env:HF_ORG}/2026-09-22-nosynth-mix"
  file: mixture.jsonl
  revision: "5bbf1ecb1d78ccf6cfd24f78b873532f984d2342"

synthetic_pct: 7
# The synthetic share is a share of SUPERVISED TOKENS (`plan_swap` in src/data/mixture/build_mixture.py,
# 2026-09-21): the published nosynth mixture is the size of this arm, base rows leave in a
# seeded, source-proportional, share-nested order until `synthetic_pct` of its supervised
# tokens are freed, and synthetic rows refill them trait-balanced. Under token weighting
# (`train.loss_agg: token_mean`) that share IS the source's share of the gradient. Mixtures
# built before 2026-09-22 (`total_examples: 10000`, no `share_unit`) declared a share of ROWS
# — da-7 by rows was 15.4% of supervised tokens — and are not comparable at equal numbers.
share_unit: supervised_tokens
sources:
  delib:
    dataset: "${oc.env:HF_ORG}/2026-09-16-delib-synth"
    revision: "f0b8dc9c96bd1d9ccc32451e7d7134b06d8fd564"
    examples: 1
    reasoning: native

output_dir: "output/mixture_delib"

hf:
  experiment: "deliberative-alignment arm: the MSM Table 2 base blend scaled around a synthetic share of Qwen3.6's own constitution-guided answers to the difficult-advice prompts, best-of-N judge-filtered"
  constitution: "constitutions/abridged/constitution.md"
  private: false
