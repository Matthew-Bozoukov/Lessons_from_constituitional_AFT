# ABOUTME: The agentified difficult-advice arm: the base blend (configs/data/mixture/plain.yaml)
# ABOUTME: scaled around a synthetic `daa` share. Publishes as `<date>-daa-<pct>-mix`.
# Run: uv run mix --config configs/data/mixture/daa.yaml [synthetic_pct=15]
#
# da.yaml's shape exactly -- same plain base at the same pin, same seed, same share unit -- with
# the synthetic source swapped for the daa corpus TRIMMED TO ITS DELIBERATION (2026-10-07,
# scratch/daa_trim.py over 2026-09-17-daa-synth @ 9d0f1af0): the same difficult-advice rows
# re-cast as an agent with a bash tool over a small file environment, every command run for real,
# cut after the one turn that carries the da deliberation. So an arm on this mix differs from da-15
# in the FORMAT the deliberation arrives in (3-4 real looks at files before it, and in 465 of 749
# rows an action call after it) and nothing about the dilemma content.
#
# Three things are deliberate here (Jamie, 2026-10-07):
#   supervise: final -- the loss is the deliberation turn alone: its trace, then the reply (284
#     rows, where the deliberation was already the final turn; their task_complete call was
#     removed in the corpus) or the action call (465 rows: a memo written or a script run). The
#     looks before it are context, as dat's exploration is.
#   tools: drop -- the corpus carries no tool schemas, so the template renders no tool
#     definitions; the agent's calls are made without ever being shown a function. The
#     builder's declared-calls check is waived for this source for exactly that reason.
#   The 2026-09-17 arm (daa-7: full transcripts, every turn supervised, tools declared, nosynth
#     base) is NOT comparable to this one on any axis but the dilemma rows; its config is this
#     file before this date (git log) and its adapter dougalldeepmind/2026-09-17-qwen36-0-daa-7.

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"
max_seq_len: 8192

base: "configs/data/mixture/plain.yaml"
base_mixture:
  # The `plain` base (1,832 rows / 5,000,005 supervised tokens, published traces). da.yaml pins
  # 019e239c; this is the same rows (identical mixture.jsonl) at the later commit whose
  # mixture_stats.json also says `reasoning_traces.origin: published` -- a record the trainer
  # stamps and no longer gates on (src/train/launch.py trace_record, 2026-10-07).
  repo: "${oc.env:HF_ORG}/2026-10-05-plain-mix"
  file: mixture.jsonl
  revision: "c118c4b0a4a66eec4020edf2f6964b8a2bcf955b"

synthetic_pct: 15
# A share of SUPERVISED TOKENS (`plan_swap`, src/data/mixture/build_mixture.py): base rows leave
# in a seeded, source-proportional, share-nested order until `synthetic_pct` of the base's
# supervised tokens are freed, and synthetic rows refill them trait-balanced. Each daa row is
# counted under ITS mode -- `final`, one turn -- so the 15% is of what the trainer will supervise.
share_unit: supervised_tokens
sources:
  daa:
    # 749 rows (t1 78 ... t9 85), each 2026-09-17-daa-synth's row cut after its deliberation turn
    # and stripped of `tools` (scratch/daa_trim.py; the repo's card and provenance.json pin the
    # source revision and say per row how many turns went).
    dataset: "${oc.env:HF_ORG}/2026-10-07-daa-synth"
    revision: "113b14ddb611ccb66b3557335c6c0997beed9cef"
    examples: 1
    reasoning: native
    balance_by: trait_id
    supervise: final
    tools: drop

output_dir: "output/mixture_daa"

hf:
  experiment: "agentified difficult-advice arm: the plain base blend (2026-10-05-plain-mix) scaled around a synthetic daa share -- the 2026-09-17 daa transcripts cut after the deliberation turn, tool schemas removed, supervise: final"
  constitution: "constitutions/claude_distilled_09_principles/constitution.md"
  private: false
