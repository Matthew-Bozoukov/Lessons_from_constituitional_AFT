# ABOUTME: The agentified difficult-advice arm: the base blend (configs/data/mixture/nosynth.yaml)
# ABOUTME: scaled around a synthetic `daa` share. Publishes as `<date>-daa-<pct>-mix`.
# Run: uv run mix --config configs/data/mixture/daa.yaml [synthetic_pct=7]
#
# da.yaml's shape exactly -- same pinned nosynth base, same seed, same share as a launch
# argument -- with the synthetic source swapped for the daa2 corpus: the SAME difficult-advice
# rows (dougalldeepmind/2026-09-14-da-synth) re-cast as an agent with a bash tool over a small
# file environment, every command run for real, the deliberation and reply kept verbatim where
# nothing had to change (scratch/da_agentified/agentify2.py; docs/LOG.md 2026-09-12 and 2026-09-17). So
# a daa-7 arm against the da-7 arm isolates the agentic FORMAT from the dilemma CONTENT.
#
# The rows carry `tools` and `tool_calls` (the ODCV bash/task_complete schemas) and NO
# `supervise` field, so every assistant turn is loss (the trainer's default) -- the per-look
# thoughts, the deliberation with its action, the writes, the reply and the task_complete close --
# unlike dat's `final`, because here the reasoning before the reply IS the intervention. (An
# explicit all-`all` column is refused by train_lora as an arm identical to its control.)

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"
max_seq_len: 8192

base: "configs/data/mixture/nosynth.yaml"
base_mixture:
  repo: "${oc.env:HF_ORG}/2026-09-22-nosynth-mix"
  file: mixture.jsonl
  revision: "5bbf1ecb1d78ccf6cfd24f78b873532f984d2342"

synthetic_pct: 7
# The synthetic share is a share of SUPERVISED TOKENS (`plan_swap` in src/data/mixture/build_mixture.py,
# 2026-09-21): the published nosynth mixture is the size of this arm, base rows leave in a
# seeded, source-proportional, share-nested order until `synthetic_pct` of its supervised
# tokens are freed, and synthetic rows refill them trait-balanced. Under token weighting
# (`train.loss_agg: token_mean`) that share IS the source's share of the gradient. Mixtures
# built before 2026-09-22 (`total_examples: 10000`, no `share_unit`) declared a share of ROWS
# — da-7 by rows was 15.4% of supervised tokens — and are not comparable at equal numbers.
share_unit: supervised_tokens
sources:
  daa:
    # 749 rows (t1 78, t2 83, t3 85, t4 83, t5 84, t6 84, t7 83, t8 84, t9 85): 733 by sonnet,
    # plus 10 of its content-classifier refusals recovered with opus, 6 with fable (repeated
    # rounds) and 1 with sonnet under `--lean-map` (the map call given no private reasoning);
    # the 3 still refused are `[bio]`-tagged health/biosecurity scenarios, none t1. So the
    # trait-balanced draw of 700 = 78 x t1-t7 + 77 x t8-t9 fills, exactly as da.yaml's does.
    dataset: "${oc.env:HF_ORG}/2026-09-17-daa-synth"
    revision: "9d0f1af04c001332d2c7f0941519d48c7b6986fa"
    examples: 1
    reasoning: native
    balance_by: trait_id

output_dir: "output/mixture_daa"

hf:
  experiment: "agentified difficult-advice arm: the MSM Table 2 base blend scaled around a synthetic daa share (the 2026-09-14 DA rows re-cast as bash-tool agent transcripts)"
  constitution: "constitutions/claude_distilled_09_principles/constitution.md"
  private: false
