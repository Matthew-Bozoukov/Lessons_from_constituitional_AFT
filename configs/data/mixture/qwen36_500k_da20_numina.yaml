# ABOUTME: The 80% non-difficult-advice half of the 500k mixture: NuminaMath-CoT 67% of it,
# ABOUTME: TULU3 and No Robots sharing the other 33%. All replay: no reasoning carried.
# Run: uv run scripts/data/mixture/build_mixture.py --config configs/data/mixture/qwen36_500k_da20_numina.yaml
# Converted to interchange form 2026-08-07 (legacy strip/format rendering removed):
# rows are now model-agnostic messages, rendered at train time via ModelProfile. The
# published artifact the legacy form produced is on HF; rebuilding THAT byte-form needs
# a pre-2026-08-07 checkout.

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"

# 500,000 total - 95,813 of trait-balanced difficult-advice = 404,187 for this half.
# NuminaMath 67% of that; TULU3 and No Robots 16.5% each.
sources:
  numinamath_cot:
    repo: "AI-MO/NuminaMath-CoT"
    reasoning: none
    split: "train"
    tokens: 270805
  tulu3:
    repo: "allenai/tulu-3-sft-mixture"
    reasoning: none
    split: "train"
    tokens: 66691
  no_robots:
    repo: "HuggingFaceH4/no_robots"
    reasoning: none
    split: "train"
    tokens: 66691

max_seq_len: 3072
shuffle_buffer: 1000

output_dir: "output/mixture_500k_da20_numina"
