# ABOUTME: 100k-token mixture in equal thirds from TULU3, NuminaMath-CoT and No Robots.
# ABOUTME: All three are replay sources: no reasoning carried (reasoning: none).
# Run: uv run scripts/data/mixture/build_mixture.py --config configs/data/mixture/2026-08-03_qwen36_100k_three_source.yaml
# Converted to interchange form 2026-08-07 (legacy strip/format rendering removed):
# rows are now model-agnostic messages, rendered at train time via ModelProfile. The
# published artifact the legacy form produced is on HF; rebuilding THAT byte-form needs
# a pre-2026-08-07 checkout.

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"

# 100,000 tokens total, split evenly three ways.
sources:
  tulu3:
    repo: "allenai/tulu-3-sft-mixture"
    reasoning: none
    split: "train"
    tokens: 33333
  numinamath_cot:
    repo: "AI-MO/NuminaMath-CoT"
    reasoning: none
    split: "train"
    tokens: 33333
  no_robots:
    repo: "HuggingFaceH4/no_robots"
    reasoning: none
    split: "train"
    tokens: 33334

# Drop conversations longer than the training sequence length rather than truncating
# them mid-answer.
max_seq_len: 3072

output_dir: "output/mixture_100k_three_source"
shuffle_buffer: 1000
