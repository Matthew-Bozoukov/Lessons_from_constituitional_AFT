# ABOUTME: Data config for the 0%-synthetic control arm: a 1.5M-token sample of Tulu 3.
# ABOUTME: Run: uv run python -m src.data.mixture.sources.tulu3 --config configs/data/mixture/tulu-control.yaml

seed: 0
dataset: "allenai/tulu-3-sft-mixture"
split: "train"

# Budget the sample in TOKENS, not examples. The treatment arm mixes synthetic
# constitution documents into a Tulu baseline, so "same SFT dose, zero synthetic"
# is only a fair control if both arms see the same amount of text.
token_budget: 1_500_000

# Must match train.max_seq_len in configs/train/qwen36-tulu-100.yaml. Examples longer than
# this are skipped rather than truncated, so budgeted tokens are tokens actually trained on.
max_seq_len: 2048

# Counted with the chat template the trainer renders, so the budget is not an estimate.
tokenizer: "Qwen/Qwen3.6-27B"

# Streaming shuffle buffer. Large enough that the sample is not just the head of the
# mixture (which is ordered by source and would over-represent one subset).
shuffle_buffer: 50_000

out_path: "data/tulu-control_1p5M.jsonl"
