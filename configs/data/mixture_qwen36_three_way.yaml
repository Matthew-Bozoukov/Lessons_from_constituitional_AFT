# ABOUTME: Three-way target mixture (embodied + difficult-advice + agentic tool-use) at equal
# ABOUTME: token share, forming 20% of the corpus with TULU3 replay as the other 80%.
# Run: uv run scripts/data/build_mixture.py --config configs/data/mixture_qwen36_three_way.yaml

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"

# Matches the 10/90, 20/80 and 40/60 sweep arms: same 1,493,000-token total and same 20%
# target share as the 20/80 arm, but the target is three-way instead of pure
# difficult-advice. Budgets below are that arithmetic made explicit:
# int(1493000 * 0.20) // 3 = 99533 per source, remainder 1194400 to TULU3.
#
# All three sources are pre-rendered by src/data/convert_synthdoc_qwen.py, which fixes the
# synthdoc corpora's multiple system turns and string-encoded tool_calls, keeps real
# reasoning traces, and leaves Qwen3.6's empty `<think></think>` marker on assistant turns
# that have none.
sources:
  embodied:
    path: "output/synthdoc_approved_embodied_qwen36/sft_qwen36.jsonl"
    format: rendered
    tokens: 99533
  difficult_advice:
    path: "output/synthdoc_approved_difficult_advice_qwen36/sft_qwen36.jsonl"
    format: rendered
    tokens: 99533
  agentic_tools:
    path: "output/synthdoc_agentic_qwen36_emptythink/sft_qwen36.jsonl"
    format: rendered
    tokens: 99533
  tulu3:
    repo: "allenai/tulu-3-sft-mixture"
    # Historical: this artifact predates the preserve-thinking default (2026-08-04);
    # strip reproduces its no-think rendering. New mixtures declare native|none.
    reasoning: strip
    tokens: 1194400
    # The old dedicated tulu3 code path used this buffer; kept so regeneration
    # samples identically.
    shuffle_buffer: 10000

# Drop replay conversations longer than the training sequence length so they are never
# truncated mid-answer.
max_seq_len: 2048

output_dir: "output/mixture_qwen36_three_way"
