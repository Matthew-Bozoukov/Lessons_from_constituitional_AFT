# ABOUTME: Courtroom document type: the assistant runs an internal for-vs-against deliberation
# ABOUTME: in its CoT, then delivers a judged answer naturally. Two prompt families in one corpus
# ABOUTME: (a dispute arriving pre-articulated in a framed wrapper vs an open-ended hard question);
# ABOUTME: a non-generator judge critiques every draft and Sonnet's rewrite acts on the finding.
# Run: uv run scripts/data/synth/build_dataset.py --config configs/data/synth/2026-08-14_courtroom.yaml [--smoke]
#
# WHAT THE FINISHED TRAINING EXAMPLE LOOKS LIKE
#
#   turn 1  user       a dispute with both sides already articulated, arriving in a frame
#                      the scenario brainstorm invents fresh per record and whose diversity
#                      is checked like scenario text. The argued positions are written by
#                      two cheap mismatched models and rendered into the frame: prompt
#                      material, not assistant voice.
#   turn 2  assistant  THE TRAINING TARGET. The CoT is a genuine adversarial deliberation
#                      -- it steelmans and extends BOTH given arguments past what the user
#                      wrote, the strongest points neither party thought to make -- and
#                      then adjudicates. The reply delivers the judged conclusion naturally
#                      in the person's frame, informed by the deliberation without
#                      recapitulating it.
#
# The trained behaviour is one habit: weigh both sides deeply, including the losing one,
# then judge.
#
# WHY THE DRAFT -> JUDGE -> REWRITE LOOP IS THE POINT
#
# The known failure mode of a corpus like this is slop: plausible deliberation-shaped
# text with so little signal that training on it does nothing. So three model families
# each touch every document once: Gemini drafts the deliberation, an OpenAI judge reads
# the draft (deliberation genuine, judgment sound, label consistent, not slop) and
# returns one concrete finding, and Sonnet's single rewrite -- the constitution
# revision -- also acts on that finding in the same call. Nothing is dropped: the
# judge's verdict and finding ride into the export metadata, so being choosier
# (training only on judge-passed records) stays a filter operation at mixture time.
# scratch/cr_review_pack.py stratifies the human read pack by judge verdict, and a
# rubric edit re-pays only judge + rewrite calls on resume.
#
# HOW THE AGAINST-CASE IS FORCED (the three-flaws trick, adapted)
#
# Asked to weigh both sides, a model argues for its initial lean and pads the other side.
# So `draft_verdict` first writes the strongest honest case FOR EACH side into scaffold
# fields (`case_a`/`case_b`, never trained, kept for audit), and only then writes the
# deliberation that weighs them. The commitment is the mechanism: a case you have actually
# argued cannot be dismissed in a clause. `revise_verdict` then rewrites the trained turn
# against the constitution, and its lint strips every fingerprint of this scaffolding --
# the deliberation must read as thinking, not as an exercise.
#
# The verdict (`lean`: a/b/mixed/neither) is pinned at the rewrite except in one
# direction: when the judge found the label inconsistent with where the reasoning
# honestly lands, the label moves to match the reasoning -- never the reverse.
# `lean_initial` keeps the draft's value for audit.
#
# NO CELLS, NO NEW OPERATORS. Every stage is a generic operator; no Python knows this
# document type exists. (The one engine touch for this config was adding the non-
# Anthropic models to PRICES in stage_runtime.py so the budget guard sees their spend.)
#
# NOT YET RUN AT SCALE. Verify with --smoke (8 docs, local only) and `uv run synth
# check`, re-price with `--estimate --measured <smoke manifest>`, then run a
# ~300-scenario pilot (`--overrides "total_scenarios=300,hf_repo=null"`) and READ IT
# (cr_review_pack.py) before committing to the full corpus.

pipeline: 2026-08-14_courtroom

seed: 0

constitution: "constitutions/claude_distilled_09_principles_mid_20260804/constitution.md"
n_traits: 9
chunking: principle

output_dir: "output/courtroom"

hf_repo: "2026-08-14-courtroom"
hf_repo_smoke: null
hf_private: false

# Stage names to ablate (run their declared `ablate_with` field-copy instead of the model
# call). [revise_verdict] trains on the un-revised drafts.
ablate: []

workers: 16
# Re-price with `--estimate --measured <smoke manifest>` and reset this before the
# full run -- assumed priors have run low before. Headroom for retries, not a target.
budget_usd: 500.0

smoke:
  total_scenarios: 8
  scenarios_per_call: 4
  hf_repo: null
  # At 8 records ANY single flaky item is >2%, so the run-level default would fail the
  # wiring check on binomial noise. The full run keeps the strict default.
  max_fail_pct: 15.0

# ONE SCENARIO, ONE DOCUMENT, and nothing drops after generation (reviewer findings are
# repaired, not discarded), so the corpus size IS this number minus lint attrition.
# 2,000 sizes the corpus against difficult-advice v2's 2,000.
total_scenarios: 2000
scenarios_per_call: 8

defaults:
  temperature: 1.0
  max_tokens: 4096

# Hidden extended thinking is disabled on every stage: the visible <reasoning> block IS
# the deliberation, and hidden thinking makes Sonnet 5 drift in-character and skip the
# tagged scaffold (measured 2026-08-06 on post_action_retrospection's base config). On
# the tight-budget judges it would eat the whole token cap and return empty content.
models:
  # Stage 2 -- brainstorm the disputes. Temperature high: this stage's whole job is
  # spread, and every downstream diversity gate inherits whatever it fails to produce.
  # Gemini blocks carry no reasoning-disable flag (some non-OpenAI endpoints are
  # reasoning-MANDATORY on OpenRouter and 400 on it, measured 2026-08-14) and get
  # max_tokens headroom so hidden thinking cannot starve the tagged/JSON answer.
  scenarios:
    model: "google/gemini-3.7-flash"
    temperature: 1.15
    max_tokens: 16384
    assumed_tokens: {in: 750, out: 1700}
  # Stage 5 -- name the two positions and their holders. Mechanical extraction.
  positions:
    model: "google/gemini-3.7-flash"
    temperature: 0.7
    max_tokens: 2048
    assumed_tokens: {in: 400, out: 250}
  # Stages 6-7 -- the two-model debate, run for every dispute. Deliberately cheap and
  # deliberately MISMATCHED families: the arguments are prompt material a user pastes
  # in, so two different voices arguing past each other is the realism, not a defect.
  # Neither model writes anything that trains.
  debater_a:
    model: "openai/gpt-5.6-luna"
    temperature: 1.0
    max_tokens: 2048
    reasoning: {enabled: false}
    assumed_tokens: {in: 500, out: 450}
  debater_b:
    model: "google/gemini-3.7-flash"
    temperature: 1.0
    max_tokens: 4096
    assumed_tokens: {in: 1000, out: 700}
  # Stage 8 -- render the debate into its frame, plus the deployment system prompt.
  # 32768: gemini-3.7-flash's hidden thinking counts against this cap, and 5.7% of
  # full-run calls still died mid-<user> at 16384 (2026-08-14). Billing is by actual
  # output, so the headroom is free until used.
  compose:
    model: "google/gemini-3.7-flash"
    temperature: 1.0
    max_tokens: 32768
    assumed_tokens: {in: 1900, out: 1000}
  # Stage 10 -- sharpen the prompt against the full constitution.
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.8
    max_tokens: 6144
    reasoning: {enabled: false}
    assumed_tokens: {in: 2800, out: 1100}
  # Stage 10 -- the scaffolded cases + deliberation + judged reply. DELIBERATELY not
  # the rewrite model's family: the draft comes from Gemini, is judged by an OpenAI
  # model, and is rewritten by Sonnet -- three lineages, each touching the document
  # once. No reasoning-disable flag (some non-OpenAI endpoints are reasoning-MANDATORY
  # on OpenRouter and 400 on it, measured 2026-08-14); the cap leaves headroom so any
  # hidden thinking cannot starve the two scaffold cases plus the trained turn.
  deliberate:
    model: "google/gemini-3.7-flash"
    temperature: 0.8
    max_tokens: 16384
    assumed_tokens: {in: 3400, out: 2400}
  # Stage 12 -- the ONE rewrite: constitution revision and judge-finding repair in the
  # same Sonnet call, for every record.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 12288
    reasoning: {enabled: false}
    assumed_tokens: {in: 5200, out: 2600}
  # Stage 11 -- the single reviewer, from a family that is neither the drafter's nor
  # the rewriter's. Its one-sentence finding must name a concrete, fixable problem
  # (never a vibe): the finding is context the rewrite acts on. It never drops
  # records; its verdict rides to metadata for mixture-time selectivity.
  judge:
    model: "openai/gpt-5.6-luna"
    temperature: 0.2
    max_tokens: 700
    reasoning: {enabled: false}
    assumed_tokens: {in: 3200, out: 200}
  # Judged corpus checks. Sonnet 5 matches the `checks:` judge, so a rating here and a
  # rating there mean the same thing.
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 2500, out: 120}
  # pattern_scan's SCAN pass: sees batch_size whole documents per call.
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 8000
    assumed_tokens: {in: 28000, out: 3500}
  # pattern_scan's AUTORATE pass: a yes/no classifier run thousands of times.
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

# Consumed by `uv run synth check --config <this file> --run_dir <dir>`.
checks:
  stages:
    plan: dedupe_scenarios
    drafted: draft_verdict
    # Quality is judged on what actually ships: the post-revision records. Nothing
    # drops between plan and here except lint attrition, so check_coverage and
    # check_gate_yield measure generation health, not selection.
    generated: revise_verdict
    sft: export_sft
  fields:
    group: trait_id
    id: scenario_id
    verdict: lean
  # No `expected_majority`: where the verdict should land varies by dispute -- that
  # is the premise. check_verdict_distribution still reports the per-trait lean
  # histogram; the degenerate-mixed monitor (an "everyone has a point" monoculture)
  # lives in the judge's rubric per-record and in cr_review_pack.py --tally at
  # corpus level. Arm-specific checks (gold_validation, flaw_identification,
  # blindness, surface_shortcut) find no good/flawed labels here and self-skip.
  judges:
    posthoc_system: 'You audit reasoning traces for one specific failure: stating the conclusion before
      the considerations that supposedly produce it.'
    posthoc_user: |-
      <reasoning_trace>
      {reasoning}
      </reasoning_trace>

      Does this trace commit to its verdict near the start and then argue backwards to justify it -- rather than working through the considerations first and earning the conclusion at the end?

      Return exactly:
      <posthoc>yes or no</posthoc>
      <why>one sentence</why>
  judge_model: "anthropic/claude-sonnet-5"
  sample: 100
  gates:
    template_8gram_share_max: 0.20
    user_turn_unique_share_min: 0.95
    length_cv_min: 0.15
    opening_5gram_share_max: 0.20

# --- The pipeline itself ------------------------------------------------------------

stages:

# --- 1-4. the dispute pool ----------------------------------------------------------
- name: chunk_constitution
  kind: segment

- name: write_scenarios
  kind: scenarios
  model: scenarios
  # Beyond the base domain/situation/shortcut shape, every spec carries the freshly
  # invented framing the dispute arrives in. The wrapper is the brainstorm's job (not
  # a fixed taxonomy) and is scenario material, so it goes through the same diversity
  # machinery -- the avoid list shows used framings to the generator, and
  # corpus_scenarios checks it like situation text.
  fields:
    required: [wrapper]
  # Enforced scenario diversity, copied from 2026-08-01_difficult_advice.yaml: the `avoid` list
  # extends each wave with what earlier waves actually wrote, and `reject_cosine` refuses
  # near-clones at generation time and re-queues the shortfall. 0.86 is the measured
  # floor from scratch/measure_dedup_threshold.py, identical to embedding_dedup's
  # threshold. No example domains appear in the prompt: naming examples measurably
  # produced the concentration it meant to prevent.
  diversity:
    wave_size: 12
    reject_cosine: 0.86
    max_regen_rounds: 2
    max_carry: 150
    over_share: 0.04
    over_min_docs: 60
  prompts:
    system: |-
      You invent the genuine disagreements people bring to an AI assistant. You write
      disputes, not dialogue, and both sides of every dispute get their day: a dispute
      with a strawman in it is a defective dispute.
    user: |-
      Below is one principle from an AI assistant's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Invent {n} DISTINCT disputes on which reasonable people genuinely land on opposite
      sides, where this principle quietly bears on how a good adjudication differs from
      a lazy one.

      Each dispute will become a message someone sends an AI assistant, with both
      sides' arguments carried inside the message. So for each dispute, also invent
      the CONTEXT it arrives in: who relays it to the assistant, in what medium,
      pasted or retold, and what relation the sender has to the two sides. Draw it
      from how the people in THIS situation would actually communicate -- the framing
      is part of the scenario, so invent it fresh every time. Do not reuse a framing
      within this set, and treat a framing already in the do-not-repeat list below as
      used.

      Requirements for every dispute:
      - Two positions, both genuinely defensible: a thoughtful person could hold either
        without being careless or malicious. If one side only exists to be knocked down,
        the dispute is wrong for this set.
      - The disagreement is CONCRETE -- about what someone should do, whether a decision
        was right, how a situation should be read. Never an abstract debate-club
        resolution.
      - The principle must matter for JUDGING it well: an adjudication that ignored the
        principle would be worse in a way you could point at. Do not make the dispute
        ABOUT the principle.
      - Vary the stakes hard: some disputes are small enough to laugh about later, some
        carry real weight for the people in them.
      - Vary the domain widely and do not reuse a domain in this set. Most real
        disagreements live in ordinary life -- households, purchases, neighbours,
        hobbies, plans, work of every kind -- not on committees. If a dispute reads
        like an ethics-board case study, or its natural domain label would contain
        the word "ethics", it is wrong for this set: the principle should be doing
        its work quietly inside a practical disagreement.
      - Name the domain by the area of life, never by the norm at stake.
      - Vary where the truth lies across the set: in some disputes one side is, on
        reflection, substantially right; in others it is genuinely close; occasionally
        both framings miss what actually matters. A corpus where the answer is always in
        the middle teaches evasion.
      - Both positions must be arguable in words alone. Never write a dispute where one
        side can only be defended by supplying dangerous operational detail (how to
        cause harm, how to evade detection): that side is not genuinely defensible, so
        the dispute is one-sided and wrong for this set.
      - Specific people in a specific setting, never a category. Vary the people:
        names, ages, places, walks of life -- and never reuse a name within this set
        or from the do-not-repeat list.

      {avoid}

      {overrepresented}

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>", "situation": "<2-4 sentences, third person, no
      dialogue: the dispute, who holds each side and why they hold it>",
      "shortcut": "<1 sentence: the evasive answer that validates everyone and settles
      nothing>",
      "wrapper": "<1-2 sentences: the concrete context this dispute arrives in>"}}

# Scenario-level checks, where diversity is actually DECIDED: everything downstream costs
# real money per scenario. An observer, so it takes no snapshot position.
- name: corpus_scenarios
  kind: corpus_check
  on_fail: warn
  fields:
    id: scenario_id
    # The wrapper is checked like scenario text: a corpus whose disputes all arrive
    # as "my friend emailed me" is collapsed even if the disputes themselves differ.
    text: [situation, shortcut, wrapper]
    group: trait_id
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: situation
    params:
      # Every scenario, not the default sample: `dedupe_scenarios` acts on these labels,
      # and a filter must never be handed a verdict about only part of the corpus.
      sample: 0

# With `diversity.reject_cosine` refusing clones at generation time this should drop
# ZERO; anything it removes is the generation-time gate's error rate.
- name: dedupe_scenarios
  kind: corpus_filter
  from: corpus_scenarios
  drop_when:
  - embedding_dup
  max_drop_share: 0.05

# --- 5. name the two positions ------------------------------------------------------
# `op_scenarios` fixes the scenario record shape (domain/situation/shortcut), so the
# positions are derived here rather than brainstormed: a cheap extraction every record
# needs -- to argue the sides, and to define what `lean: a|b` refers to.
- name: draft_positions
  kind: llm_json
  model: positions
  checkpoint: scenario_id
  save:
    position_a: position_a
    holder_a: holder_a
    position_b: position_b
    holder_b: holder_b
  prompts:
    system: You distil disputes into their two positions, cleanly and without taking
      sides.
    user: |-
      A dispute:

      {situation}

      Name the two positions in this dispute and who holds them.

      Rules:
      - State each position in its holder's own terms, as its holder would accept it --
        one or two sentences, no editorialising, no framing that signals doubt.
      - The two must genuinely conflict: acting on one forecloses the other.
      - Holders are short role descriptions taken from the dispute itself, never
        names or letters.
      - If the dispute as written leans one-sided, state the strongest position the
        other side COULD honestly hold. Do not write a strawman.

      Return ONLY JSON:
      {{"position_a": "<first position>", "holder_a": "<who holds it>",
        "position_b": "<second position>", "holder_b": "<who holds it>"}}

# --- 6-7. the debate: every dispute gets its two sides argued ------------------------
# Two cheap models from different families argue the positions -- B reads A and rebuts,
# so the exchange is a real one. Quality deliberately need not be on-policy: these
# arguments become the material INSIDE the user's message, and mismatched voices arguing
# past each other is what pasted disputes actually look like.
- name: argue_a
  kind: llm_tagged
  model: debater_a
  checkpoint: scenario_id
  tags: [argument]
  save: {argument_a: argument}
  lint:
    fields: [argument]
    min_chars: 300
    max_chars: 2600
    retries: 2
  prompts:
    system: |-
      You write one side of a real disagreement, honestly and in its holder's voice. You
      argue to win on the merits, never by caricaturing the other side.
    user: |-
      The situation:

      {situation}

      You are {holder_a}, and this is your position:

      <position>
      {position_a}
      </position>

      Make your case. Argue it the way you actually would -- from the facts of the
      situation, from what matters to you, from what you think the other side is
      missing. Be persuasive and be fair: no invented facts, no misstating anyone.

      One to three paragraphs, in the register this person would actually use in a
      message or across a table -- not a debate speech.

      Return exactly this form, with no other text:

      <argument>
      your case
      </argument>

- name: argue_b
  kind: llm_tagged
  model: debater_b
  checkpoint: scenario_id
  tags: [argument]
  save: {argument_b: argument}
  lint:
    fields: [argument]
    min_chars: 300
    max_chars: 2600
    retries: 2
  prompts:
    system: |-
      You write one side of a real disagreement, honestly and in its holder's voice. You
      argue to win on the merits, never by caricaturing the other side.
    user: |-
      The situation:

      {situation}

      You are {holder_b}, and this is your position:

      <position>
      {position_b}
      </position>

      The other side has already made their case:

      <their_argument>
      {argument_a}
      </their_argument>

      Make yours. Answer their STRONGEST point head-on -- not their weakest -- then say
      what you hold and why. Be persuasive and be fair: no invented facts, no misstating
      what they said.

      One to three paragraphs, in the register this person would actually use in a
      message or across a table -- not a debate speech.

      Return exactly this form, with no other text:

      <argument>
      your case
      </argument>

# --- 8. the user turn ---------------------------------------------------------------
# The frame is the brainstorm's freshly invented `wrapper`, never a fixed taxonomy:
# the archived model_eval_model_other config reused four fixed wrapper strings across
# its whole corpus, and that structural artifact is one reason it was retired. Nothing
# here is a template a model could key on.
- name: compose_prompts
  kind: llm_tagged
  model: compose
  checkpoint: scenario_id
  tags: [system, user]
  save:
    system: system
    user: user
  lint:
    fields: [user]
    min_chars: 200
    retries: 2
  prompts:
    system: |-
      You write the messages real people actually send to AI assistants -- their words,
      their mess, their assumptions. When a message quotes other voices, each voice
      stays itself.
    user: |-
      The dispute:

      {situation}

      The two sides have argued their positions.

      {holder_a} argues:
      <argument_a>
      {argument_a}
      </argument_a>

      {holder_b} argues:
      <argument_b>
      {argument_b}
      </argument_b>

      Write the message a real person sends to an AI assistant carrying this
      dispute, plus the system prompt the assistant is running under.

      How the dispute arrives: {wrapper}

      Realise that framing faithfully -- its medium, its voices, its texture --
      and present the sides in whatever order the framing itself makes natural.

      The message must:
      - carry BOTH argued positions substantially: compressed and reworded into the
        frame's register, but with each side's actual points intact and neither
        reduced to a caricature. The framing must not privilege either side beyond
        what the frame itself implies about who is speaking.
      - end on a real ask, in the person's own words: who is right, what the
        assistant makes of it, what they should do.
      - read as something actually typed or pasted, with the texture of its frame --
        never a case study, never a briefing.
      - never mention ethics, values or principles, and never signal that anything
        is being tested.

      The system prompt is an ordinary, plausible deployment prompt for a general
      assistant. It must not mention any constitution, value or principle.

      Return exactly this form, with no other text:

      <system>
      the system prompt
      </system>
      <user>
      the person's message
      </user>

# --- 9. sharpen the prompt against the constitution ----------------------------------
- name: revise_prompts
  kind: llm_tagged
  model: refine
  checkpoint: scenario_id
  tags: [system, user, domain, situation, position_a, position_b, wrapper, changes]
  save:
    system: system
    user: user
    domain: domain
    situation: situation
    position_a: position_a
    position_b: position_b
    wrapper: wrapper
    refine_changes: changes
  lint:
  - fields: [user]
    min_chars: 200
    retries: 2
  - fields: [situation, position_a, position_b]
    min_chars: 40
    retries: 2
  prompts:
    system: |-
      You improve draft training prompts so they test a specific value precisely. You
      are terse and you do not pad. You never write anything that tells the assistant
      how to answer -- you change only what it is asked.
    user: |-
      Full constitution the assistant is trained against:

      <constitution>
      {constitution}
      </constitution><<<cache>>>

      This exchange is meant to put weight on ONE principle in particular:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      Draft system prompt:
      <draft_system>
      {system}
      </draft_system>

      Draft user message:
      <draft_user>
      {user}
      </draft_user>

      The message brings the assistant a genuinely two-sided dispute, both sides
      argued inside it. The assistant's job will be to weigh both sides and deliver
      a judgment. Rewrite the system prompt and message so that doing that job well is
      demanding and doing it lazily is costly:

      - **Both sides must survive scrutiny.** If either position has quietly become a
        strawman -- overstated, under-argued, or held for silly reasons -- rebuild it
        until a thoughtful person could hold it. A dispute is only worth training on if
        judging it takes real work.
      - **The principle must be live** in how a good adjudication differs from a lazy
        one. If the draft could be judged well without the principle bearing on it at
        all, fix that -- without ever making the dispute be ABOUT the principle.
      - **The lazy answers must cost something.** Reflexive agreement with the asker,
        validating everyone, splitting every difference: if any of those would serve
        this person fine, sharpen the situation until it would not.
      - **Realism.** Quoted voices keep their texture and their disagreement; cut
        anything that reads as written-for-a-benchmark.
      - **Audit the message's opening.** If its first sentence could open a different
        person's message unchanged ("I need to think through something...", "I could
        use an outside perspective..."), it is a stock opener: rewrite it so the
        message starts where THIS person, in this situation and this medium, would
        actually start -- mid-story, with the thing that happened, with what they
        just read -- and never with a preamble about needing to think.
      - **Neither side privileged by construction.** Check the order and the framing:
        which side is presented first, which gets warmer words or more space, should
        follow from the frame's own nature and who is speaking in it -- never from the
        message quietly campaigning for one side. Rebalance if the draft leans.
      - **No leakage.** Neither prompt may mention a constitution, a value or a
        principle, and the asker must not signal that anything is being tested.

      Keep the system prompt an ordinary deployment prompt, and keep the message's
      frame (who is quoted, how it arrives) intact.

      Finally, re-describe what you actually produced. `domain`, `situation`,
      `position_a`, `position_b` and `wrapper` arrive here describing the DRAFT, and
      you are about to replace or reframe parts of it -- so if you echo them back
      unchanged they become a description of a message that no longer exists. Write
      them fresh, from your revised message, as though you had never seen the
      originals.

      Return exactly this form, with no other text:

      <system>
      the revised system prompt
      </system>
      <user>
      the revised user message
      </user>
      <domain>
      one or two words, describing YOUR revised message
      </domain>
      <situation>
      2-4 sentences, third person: the dispute as YOUR revised message carries it
      </situation>
      <position_a>
      the first position, as YOUR revised message carries it
      </position_a>
      <position_b>
      the second position, as YOUR revised message carries it
      </position_b>
      <wrapper>
      1-2 sentences: the context YOUR revised message arrives in (who relays the
      dispute, in what medium)
      </wrapper>
      <changes>
      1-2 sentences on what you changed and why
      </changes>

# --- 10. the deliberation: scaffolded cases, then the trained turn -------------------
# `conversation:` puts the person's message in a genuine user turn, so the assistant is
# answering someone rather than completing a description of someone. The scaffold order
# is the against-case mechanism (see header): both cases are ARGUED into fields that
# never train, and only then is the deliberation written -- a case you have argued
# cannot be dismissed in a clause.
- name: draft_verdict
  kind: llm_tagged
  model: deliberate
  checkpoint: scenario_id
  tags: [case_a, case_b, reasoning, response, lean]
  save:
    case_a: case_a
    case_b: case_b
    draft_reasoning: reasoning
    draft_response: response
    lean: lean
  normalize: [lean]
  # No fingerprint ban_patterns HERE, deliberately: the draft is allowed to be raw --
  # rule-vocabulary, stock openers and all -- because `revise_verdict` is the
  # naturalization pass and carries the full lint. Banning the draft's voice without
  # instructing it (the first smoke's mistake) burns 3 retries per record and fails
  # half of them for text the rewrite would have replaced anyway.
  lint:
  - fields: [case_a, case_b]
    min_chars: 150
    retries: 2
  - fields: [reasoning]
    min_chars: 700
    retries: 2
  - fields: [response]
    min_chars: 300
    retries: 2
  - fields: [lean]
    allowed: [a, b, mixed, neither]
    retries: 2
  conversation:
  - role: system
    content: |-
      You are generating training data: the private reasoning and reply an exemplary AI
      assistant produces when someone brings it a genuinely two-sided question.

      The assistant is operating under these deployment instructions:

      <deployment_instructions>
      {system}
      </deployment_instructions>

      It holds to this constitution:

      <constitution>
      {constitution}
      </constitution>

      The exchange puts weight on this principle in particular:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      The two sides of the question, for your reference (the person may state them
      differently, or not at all):

      <side_a>
      {position_a}
      </side_a>
      <side_b>
      {position_b}
      </side_b>

      The person's message carries an articulated dispute -- two sides already
      argued. Do not merely referee the words on the page. Extend both arguments
      past what was given: the strongest points neither party thought to make, the
      places where an argument is better than its author made it sound.

      How the work must go, in order:
      1. FIRST, as scaffolding no reader will ever see: construct the strongest honest
         case for EACH side -- argued as by someone who believes it, not summarised.
         Whichever way you already lean, the other side's case gets your full strength;
         a case built to lose is worthless here.
      2. THEN the private reasoning: a genuine adjudication. It weighs what the cases
         found against each other, anchored in this dispute's specifics -- these people,
         these stakes -- and it takes the strongest version of the side it rules
         against seriously before ruling. The conclusion is earned at the end, never
         stated first and justified after. It argues from what is at stake for the
         people involved, never by citing any document shown above. It reads as the
         assistant thinking, in whatever shape THIS question demands: no
         for/against/verdict skeleton, no labelled sections, and no two deliberations
         organised the same way.
      3. THEN the visible reply: the judged answer, delivered naturally to this person
         in the frame they asked in. It engages their actual situation and their actual
         ask, informed by the deliberation without recapitulating it. It comes down
         where the reasoning came down -- plainly, if a side is right. An unearned
         "you both have a point" is the failure this corpus exists to avoid; an honest
         split verdict is allowed only when the reasoning genuinely split.
      4. LAST, one word for where the judgment landed.
  - role: user
    content: |-
      {user}

      ---
      Write the assistant's turn. Return exactly this form, with no other text:

      <case_a>
      the strongest honest case for side A -- scaffolding, never shown to anyone
      </case_a>
      <case_b>
      the strongest honest case for side B -- scaffolding, never shown to anyone
      </case_b>
      <reasoning>
      the assistant's private deliberation: the genuine adjudication, earning its
      conclusion at the end
      </reasoning>
      <response>
      the assistant's reply to the person
      </response>
      <lean>
      exactly one word: a (side A is substantially right), b (side B is substantially
      right), mixed (the honest judgment genuinely takes from both), or neither (both
      framings miss what matters)
      </lean>

# --- 11. the judge: one external reviewer of the draft, from a third family ----------
# Reads the Gemini draft before the Sonnet rewrite. It never drops records: its
# verdict rides to metadata (mixture-time selectivity stays a filter), and its
# one-sentence finding is context the rewrite acts on -- so the finding must name a
# concrete, fixable problem, never a vibe.
- name: judge_draft
  kind: llm_tagged
  model: judge
  checkpoint: scenario_id
  tags: [verdict, why]
  normalize: [verdict]
  lint:
  - fields: [verdict]
    allowed: [pass, fail]
    retries: 2
  - fields: [why]
    min_chars: 15
    retries: 2
  save:
    judge_verdict: verdict
    judge_why: why
  prompts:
    system: |-
      You review draft documents for a synthetic training corpus. You judge whether
      the private reasoning genuinely weighs both sides, whether the judgment it
      reaches is sound and actually delivered, and whether the text is slop. You are
      strict -- a merely acceptable draft is a fail -- and your finding must be
      concrete enough that an editor could act on it: name the specific place and the
      specific problem, never a vibe.
    user: |-
      A person brought an assistant a two-sided dispute.

      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      The assistant's draft private reasoning:

      <reasoning>
      {draft_reasoning}
      </reasoning>

      Its draft reply:

      <response>
      {draft_response}
      </response>

      The pipeline recorded this draft's verdict as "{lean}" (a = the first side of
      the dispute, b = the second, mixed = the honest judgment genuinely takes from
      both, neither = both framings miss what matters).

      Fail the draft if any of these holds:
      - The reasoning commits to its conclusion early and back-fills the weighing.
      - The side it rules against gets token weight: mentioned in order to be
        dismissed, rather than argued the way its holder would argue it.
      - The considerations are generic -- they could be pasted into a deliberation
        about a different dispute with the names changed.
      - The answer splits the difference or validates both sides where the question,
        honestly weighed, admits an answer -- an unearned "you both have a point".
      - The conclusion does not follow from the weighing actually performed, or the
        reasoning, the reply and the recorded verdict disagree about where the
        judgment landed.
      - The reply does not deliver a judgment in the frame the person asked in.
      - Slop: filler validation, hedging formulas, list-itis where prose is called
        for, template shape, length padding, register mismatch with how the person
        asked.

      Pass only if none of these holds and the draft is one you would show someone as
      an exemplar of weighing both sides deeply.

      Return exactly:
      <verdict>pass or fail</verdict>
      <why>one sentence: if failing, the specific problem and where it is; if passing,
      what carries the document</why>

# --- 12. the ONE rewrite: constitution revision + judge repair, every record ---------
# The difficult-advice revise_responses twin and the naturalization pass, with the
# judge's finding as extra context in the same call: this is where the constitution
# enters the trained turn, so it is also where scaffold fingerprints would enter --
# the lint and the leave-no-trace contract are the enforcement. The verdict is
# pinned EXCEPT in one direction: when the judge found the label inconsistent with
# where the reasoning honestly lands, the label moves to match the reasoning, never
# the reverse. `lean_initial` preserves the draft's label for audit.
- name: revise_verdict
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  assign:
    by: scenario_id
    copy:
      lean_initial: lean
  tags: [reasoning, response, lean, changes]
  save:
    reasoning: reasoning
    response: response
    lean: lean
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  normalize: [lean]
  lint:
  - fields: [reasoning]
    min_chars: 700
    retries: 2
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bsteel[- ]?man
    - \bdevil'?s advocate\b
    - \bon (?:the )?one hand\b
    - \bcase_[ab]\b
    - "</?(?:reasoning|response|changes|case_[ab]|side_[ab]|user_message|constitution|judge_[a-z]+)>"
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
  - fields: [response]
    min_chars: 300
    retries: 2
    ban_patterns:
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \bsteel[- ]?man
    - \bdevil'?s advocate\b
    - "</?(?:reasoning|response|changes|case_[ab]|side_[ab]|user_message|constitution|judge_[a-z]+)>"
    - '[一-鿿]'
  - fields: [lean]
    allowed: [a, b, mixed, neither]
    retries: 2
  prompts:
    system: |-
      You revise adjudication documents so they maximally exhibit one specific
      principle. You preserve everything that already works, you repair what an
      external reviewer actually found, and you leave no trace of either instruction
      in what you write.
    user: |-
      Full constitution the assistant is trained against:

      <constitution>
      {constitution}
      </constitution><<<cache>>>

      The principle this document must maximally exhibit:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      The conversation the assistant's turn answers:

      <conversation>
      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>
      </conversation>

      The assistant's draft turn, whose judgment landed on "{lean}":

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      An external reviewer read this draft:

      <judge_finding verdict="{judge_verdict}">
      {judge_why}
      </judge_finding>

      Rewrite the assistant's reasoning and response so they exhibit the target
      principle as strongly as possible while staying true to the exchange.

      Hold to all of this:
      - **Deliberate genuinely on both sides.** The reasoning argues the strongest
        version of the side it rules against from the inside before ruling, weighs in
        this dispute's specifics rather than in generalities, and earns its conclusion
        at the end -- never a verdict first, justified after. Strengthen the weighing
        where the draft is thin, but do not impose a shape on it: no fixed skeleton,
        and two deliberations about different disputes must not be organised the same
        way. This is the ingredient that matters most.
      - **Repair what the reviewer found.** If the finding names a real problem, fix
        it at its source -- as thinking, not as a correction. Do not restructure what
        it did not fault.
      - **The verdict follows the reasoning.** Keep it exactly "{lean}" unless the
        reviewer found the label inconsistent with where the reasoning honestly lands
        -- in that case restate the label to match the reasoning, never the reverse.
      - **Audit the opening before you write it.** Read the draft's first sentence and
        ask: could this sentence open a deliberation about a completely different
        dispute? If yes, it is a stock opener and you must replace it. "Let me…" in any
        form, restating the request back, a discourse marker doing the work ("Okay,
        so…"), naming the difficulty ("This is a genuinely hard one"), validating first
        -- all of these are the failure, not the style. Start on something only THIS
        dispute contains. The first eight words should be impossible to reuse in any
        other transcript in this corpus.
      - **Deliver the judgment in the person's frame.** The reply answers what they
        actually asked, in the register they asked it, and does not walk through the
        deliberation again -- it is informed by it. If a side is right, say so plainly
        and say what follows for this person; do not soften a clear judgment into
        diplomacy.
      - **Never name the constitution.** You have been shown it so you can apply it,
        not quote it. The reasoning argues from what is at stake for the people
        involved, never from what you are permitted or required to do. Any sentence
        that would survive being moved into a different dispute is the wrong sentence.
      - **Leave no trace of this instruction.** Nothing above is visible to anyone
        reading the finished turn. No reader may be able to tell a reviewer existed.
        No talk of steelmanning, of scaffolds, of "the case for" as a label, no tag or
        heading from this prompt, no vocabulary of an exercise -- the weighing shows
        in what the thinking does, never in labels for what it is doing.
      - **Stay concrete. Stay proportionate.** Warm, practical, specific, not preachy;
        length and register stay close to the draft's.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <lean>
      exactly one word: a, b, mixed, or neither
      </lean>
      <changes>
      1-2 sentences on what you strengthened or repaired
      </changes>

# --- 13. corpus checks, over exactly what ships -------------------------------------
# After the rewrite (audits what trains), before export (the trained turn is still the
# flat reasoning/response fields). quality_filter is deliberately OMITTED: the judge
# already gives every document that read, and its verdict is in the metadata.
# pattern_scan is ENABLED and pointed at the REASONING: this corpus trains the
# deliberation pattern itself, so a reasoning-shape monoculture is its worst failure,
# and pattern_scan is the only check that can find a tic nobody named in advance.
- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate
  fields:
    id: scenario_id
    text: [reasoning, response]
    group: trait_id
    unit: trait_id
    members: chunk_ids
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: situation
  - property: pattern_scan
    enabled: true
    model: scan
    rate_model: classify
    fields:
      text: reasoning
    params:
      scan_max_tokens: 8000
  rubrics:
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown
        a batch of transcripts drawn from ONE dataset and you report what recurs across
        them. Report only what you can see repeating in this batch. Do not speculate
        about the generating process, do not judge whether a pattern is good or bad, and
        do not report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.

        {documents}

        List every pattern that recurs across these transcripts, in three categories:

        - structural: openings, section ordering, response length or shape, identical
          phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-
          up-front summaries, characteristic transitions
        - behavioural: always asks a clarifying question, always names its own values,
          always offers alternatives, always ends by inviting a follow-up

        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}

        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave
        to what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in
        order, each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}

        Snippets that DO exhibit it:
        {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}

        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.

        {documents}

        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present

        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]

# --- 14. export: three messages, one trained turn ------------------------------------
- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - situation
  - position_a
  - position_b
  # The brainstormed framing the dispute arrived in.
  - wrapper
  - lean
  # The reviewer record: verdicts + one-sentence findings, the revision flag, the
  # pre-revision label and what the repair changed. Mixture-time selectivity (e.g.
  # train only on clean-first-pass documents) is a filter over these.
  - judge_verdict
  - judge_why
  - lean_initial
  - rewrite_changes
  # Chunking provenance from stage 1.
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks
