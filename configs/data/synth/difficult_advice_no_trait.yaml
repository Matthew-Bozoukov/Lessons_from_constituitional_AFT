# ABOUTME: No-trait ablation arm of the difficult-advice recipe: same six-stage pipeline,
# ABOUTME: no prompt sees the constitution or any trait. Run: uv run scripts/data/synth/build_dataset.py --config configs/data/synth/difficult_advice_no_trait.yaml [--smoke]

# THE ABLATION (2026-08-20): does difficult-advice data need to be seeded from a trait
# doc at all? Baseline = difficult_advice.yaml (per-principle seeding, whole constitution
# injected at stages 4/6). This arm removes ALL constitution/trait content from every
# prompt — the generator's own values replace the document — and holds everything else
# fixed: stage list, models, temperatures, max_tokens, lint, diversity machinery, corpus
# size, checks. The scientific record of the arm is the prompt diff against the baseline
# config; keep edits minimal and reviewable.
#
# Decisions a reviewer should know:
# - `constitution:` still points at the doc and `chunking: whole` still runs stage 1,
#   but ONLY as machinery: no prompt references {constitution} or {trait_*}, so neither
#   is ever rendered into a call (templates are str.format; unused vars are inert).
#   Stage 1's real surviving contribution is {style_guidance}.
# - {style_guidance} is KEPT in stage 5, deliberately: it is the craft/style stream, not
#   the value content, and dropping it would confound "no value content" with "different
#   prose shape". The maximal variant deletes the one line that injects it.
# - Stage 3 and stage 5's user prompt are byte-identical to the baseline. Stage 4's
#   system prompt is byte-identical. Both lint blocks are byte-identical.
# - Leak check after any run: grep the stage snapshots for constitution phrasing.
pipeline: difficult_advice_no_trait

ablate: []

# Overrides merged onto this config under --smoke (tiny slice, full wiring).
smoke:
  max_traits: 1
  scenarios_per_trait: 1
  scenarios_per_call: 1
  total_scenarios: 2

seed: 0

# Machinery only in this arm (see header): stage 1 parses this for {style_guidance};
# the principles never reach a prompt. `whole` = one unit, so n_traits is 1 and
# total_scenarios below is the whole corpus in a single queue.
constitution: "constitutions/claude_distilled_12_principles_mid/constitution.md"
n_traits: 1
chunking: whole

# Same corpus size as the baseline arm; with one unit total_scenarios IS the per-unit
# count, so scenarios_per_trait is omitted rather than left as a misleading fallback.
total_scenarios: 2000
scenarios_per_call: 8

output_dir: "output/synthdoc_no_trait"

# New repos: this arm's records must never append to the baseline mirror.
# Date rule: rename to the actual generation date if this runs on a later day.
hf_repo: "LASR-Callum/2026-08-20-difficult-advice-no-trait"
hf_repo_smoke: "LASR-Callum/2026-08-20-difficult-advice-no-trait-smoke"
hf_private: false

workers: 16
# Baseline measured $234 for 2,000 records; this arm's calls are strictly shorter (no
# constitution in any context), so the same cap leaves generous retry headroom.
budget_usd: 300.0

defaults:
  temperature: 1.0
  max_tokens: 4096
  # Provider routing lives in configs/endpoints/providers.yaml, same as the baseline.

# Model per stage: IDENTICAL models/temperatures/max_tokens to difficult_advice.yaml —
# the arm varies prompts only. assumed_tokens are re-guessed for the shorter prompts
# (no constitution/trait in context) and are priors until a smoke manifest replaces them.
models:
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.1
    max_tokens: 8192
    assumed_tokens: {in: 450, out: 1400}
  draft:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 2048
    assumed_tokens: {in: 500, out: 700}
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 6144
    assumed_tokens: {in: 800, out: 900}
  respond:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 4096
    assumed_tokens: {in: 900, out: 1600}
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 12288
    assumed_tokens: {in: 1900, out: 1800}
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 1400, out: 120}
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 8000
    assumed_tokens: {in: 28000, out: 3500}
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

# --- The pipeline itself ------------------------------------------------------------
# Same stage list and order as the baseline. Prompt placeholders are record fields plus
# {style_guidance}; {constitution}/{trait_*} exist in ctx but no template names them.
stages:
- name: chunk_constitution
  kind: segment
- name: write_scenarios
  kind: scenarios
  model: scenarios
  # Identical diversity machinery and thresholds to the baseline. One difference in
  # load, not config: with a single unit every scenario flows through ONE queue, so the
  # reject_cosine gate does strictly more work than in the 9-queue baseline — watch
  # regen rounds and carry on the smoke run before trusting max_carry headroom.
  diversity:
    wave_size: 12
    reject_cosine: 0.86
    max_regen_rounds: 2
    max_carry: 150
    over_share: 0.04
    over_min_docs: 60
  prompts:
    # Baseline diff: "a constitution-aligned AI assistant" -> "an aligned AI assistant";
    # the <principle> block is deleted; "violate this specific principle" -> "violate an
    # important norm or value"; the THIS-principle requirement -> ONE-specific-value.
    system: |-
      You design realistic, ethically difficult situations for training an aligned AI
      assistant. You write situations, not dialogue.
    user: |-
      Invent {n} DISTINCT situations in which the convenient path would violate an
      important norm or value.

      Requirements for every situation:
      - Whoever is under pressure is sympathetic and their underlying goal is legitimate.
      - The pressure is concrete and the stakes are real.
      - The norm-violating shortcut is genuinely tempting, not cartoonish.
      - The tension must engage ONE specific norm or value, not ethics in general.
      - The setting is specific rather than a category.
      - Do not reuse a setting within this set.

      {avoid}

      {overrepresented}

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>", "situation": "<3-5 sentences, third person, no dialogue>",
        "shortcut": "<1 sentence: the specific norm-violating action they are tempted by>"}}
- name: corpus_scenarios
  kind: corpus_check
  on_fail: warn
  fields:
    id: scenario_id
    text: [situation, shortcut]
    group: trait_id
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: situation
    params:
      sample: 0
- name: dedupe_scenarios
  kind: corpus_filter
  from: corpus_scenarios
  drop_when:
  - embedding_dup
  max_drop_share: 0.05
# Byte-identical to the baseline: this stage never saw the constitution in either arm.
- name: draft_prompts
  kind: llm_json
  model: draft
  save:
    draft_system: system
    draft_user: user
  prompts:
    system: You write realistic messages that people actually send to AI assistants.
    user: |-
      Situation:
      {situation}

      The tempting shortcut: {shortcut}

      Write the message that would actually be sent to the assistant here, plus the system
      prompt the assistant is running under.

      The message must:
      - be in the sender's own voice, with the texture of a real request
      - make the pressure concrete
      - ask for help in a way that leads toward the shortcut, WITHOUT naming it as unethical
      - never mention ethics, principles, or that this is a test
      - read as something someone actually typed, not as a case study

      The system prompt should be an ordinary, plausible deployment prompt for a general
      assistant. It must NOT mention the constitution, ethics, or this exercise.

      Return ONLY JSON:
      {{"system": "<system prompt>", "user": "<the message>"}}
- name: revise_prompts
  kind: llm_json
  model: refine
  checkpoint: scenario_id
  # Same overwrite rationale as the baseline: domain/situation/shortcut are re-described
  # here, not carried through, and deliberately NOT in `optional:`.
  save:
    system: system
    user: user
    refine_changes: changes
    situation: situation
    shortcut: shortcut
    domain: domain
  optional:
  - changes
  prompts:
    # System prompt byte-identical to the baseline (it was already trait-free).
    system: |-
      You improve draft training prompts so they test a specific value precisely. You are terse
      and you do not pad.
    # Baseline diff: the <constitution> block (with its cache breakpoint) and the
    # <target_principle> block are deleted; the reviser identifies the value itself;
    # "the target principle" -> "that value" throughout; the no-leakage bullet's
    # "may mention the constitution or any principle" -> "may name the value under test".
    user: |-
      This prompt is meant to put pressure on ONE specific value in particular --
      whichever norm or value the draft exchange most puts under load. Identify that
      value yourself before rewriting.

      Draft system prompt:
      <draft_system>
      {draft_system}
      </draft_system>

      Draft user message:
      <draft_user>
      {draft_user}
      </draft_user>

      Rewrite both so the exchange is a sharper test of that value.

      Improve these specifically:
      - **Precision.** The tension should engage that one value, not a generic "is this
        ethical" question. If the draft could be answered without touching it, fix it.
      - **Realism.** Cut anything that reads as written-for-a-benchmark.
      - **Difficulty.** The shortcut should be genuinely tempting and the legitimate path
        genuinely costly. If refusing is obviously free, raise the cost.
      - **No leakage.** The user must not signal awareness of the ethical dimension, and
        neither prompt may name the value under test.

      Keep the system prompt an ordinary deployment prompt.

      Finally, re-describe what you actually produced. `domain`, `situation` and `shortcut`
      arrive here describing the DRAFT, and you are about to replace or reframe most
      drafts -- so if you echo them back unchanged they become a description of a message
      that no longer exists. Write them fresh, from your refined user message, as though
      you had never seen the originals. If you changed nothing, they will come out the
      same on their own.

      Return ONLY JSON:
      {{"system": "<refined system prompt>", "user": "<refined user message>",
        "changes": "<1-2 sentences on what you changed and why>",
        "domain": "<one or two words, describing YOUR refined message>",
        "situation": "<3-5 sentences, third person, no dialogue, describing YOUR refined
        message>",
        "shortcut": "<1 sentence: the norm-violating action YOUR refined message is
        tempted by>"}}
- name: draft_responses
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  save:
    draft_reasoning: reasoning
    draft_response: response
  prompts:
    # Baseline diff: the <principle> block is deleted. {style_guidance} is kept — see
    # the header for why. The user prompt is byte-identical to the baseline.
    system: |-
      {system}

      What a good response to a difficult request looks like:
      {style_guidance}
    user: |-
      {user}

      ---
      Respond as the assistant. First reason privately about what is actually at stake here,
      then write your reply.

      Start wherever this particular situation actually starts. Sometimes that is the
      thing at stake, sometimes the person who gets hurt, sometimes a detail of the
      request that gives the whole thing away. Never open with a stock phrase, and never
      begin with "Let me". Write as though thinking, not as though filling in a form.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      your private deliberation: what is actually at stake here, for whom, and what that
      means for how you answer
      </reasoning>
      <response>
      your reply to the person
      </response>
  # Byte-identical lint to the baseline. The constitution-recital bans stay even though
  # no constitution is in context: the generator can still write rule-speak, and the
  # arms must reject it on identical terms.
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    retries: 2
- name: revise_responses
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  - changes
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  prompts:
    # Baseline diff: "one specific principle" -> "the values genuinely at stake".
    system: |-
      You revise assistant responses so they maximally exhibit the values genuinely at
      stake in the exchange. You preserve everything that already works and change only
      what falls short.
    # Baseline diff: the <constitution> block (with its cache breakpoint) and the
    # <target_principle> block are deleted; the rewriter identifies the value itself;
    # "the target principle" -> "that value"; the "Never name the constitution" bullet
    # becomes "Never argue from rules" with its last two sentences kept verbatim.
    # Everything else — the open-deliberation bullet, the whole stock-opener audit, the
    # shape paragraph, the output format — is byte-identical to the baseline.
    user: |-
      The exchange below puts one specific value under pressure. Identify that value
      yourself, and hold your rewrite to it.

      Here is the complete transcript.

      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the assistant's reasoning and response so they exhibit that value as
      strongly as possible while staying true to this person's actual situation.

      Hold to all of this:
      - **Deliberate openly about the value.** The reasoning must name the tension explicitly
        and work through it, rather than reaching a verdict and justifying it. This is the
        ingredient that matters most. Strengthen the weighing where the draft is thin, but
        do not impose a shape on it: two deliberations about different situations should
        not be organised the same way.
      - **Audit the opening before you write it.** Read the draft's first sentence and ask
        one question: could this sentence open a deliberation about a completely different
        situation? If yes, it is a stock opener and you must replace it.

        These are stock openers. They are the failure, not the style:
          * "Let me…" in any form -- let me think, let me sit with, let me actually
          * restating the request back -- "You're asking whether…", "He's asking whether…",
            "What's actually being asked here is…", "So they want me to…"
          * a discourse marker doing the work -- "Okay, so…", "Right, so…", "So,…"
          * naming the difficulty -- "This is a hard one", "There's real tension here"
          * validating first -- "I get why…", "I hear…", "That sounds…"

        Replace it by starting on something only THIS situation contains: the specific
        detail that decides it, the person who is going to be affected and how, the exact
        thing that would go wrong. Enter mid-thought if that is where the thought starts.
        The first eight words should be impossible to reuse in any other transcript in
        this corpus -- that is the test, and it is the whole point of this instruction.
      - **Never argue from rules.** The reasoning argues from what is at stake for the
        people involved, never from what you are permitted or required to do. Any sentence
        that would survive being moved into a different scenario is the wrong sentence.
      - **Take the request seriously** before evaluating it.
      - **Do not go along with the norm-violating path**, and give the reason in terms of
        what is concretely at stake, not in terms of rules.

      How the reply is shaped past that -- what it opens on, whether it offers an
      alternative, where it lands, how long it runs -- is yours to judge from this
      situation. Do not reach for a standard shape.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you strengthened
      </changes>
  # Byte-identical lint to the baseline.
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    retries: 2
- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  # Baseline diff: trait_text is dropped — under `whole` it is the entire constitution
  # repeated on every row (~2000 copies of the document in the dataset for zero
  # information; the constitution sha in the manifest records the same fact once).
  # trait_id/trait_name stay for schema parity ("all"/the document, same on every row).
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - domain
  - shortcut
  - situation
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks

# Identical to the baseline's final check, pattern_scan ON. In this arm it is doing
# double duty: the open-ended tic detector AND the first look at whether an unseeded
# corpus collapses onto fewer distinct value-tensions than the seeded one.
- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    unit: metadata.trait_id
    members: metadata.chunk_ids
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: metadata.situation
  - property: quality_filter
    enabled: false
  - property: pattern_scan
    enabled: true
    model: scan
    rate_model: classify
    params:
      scan_max_tokens: 8000
  rubrics:
    quality_filter:
      system: >-
        You rate synthetic training documents for an SFT corpus. Each
        document is an assistant reply to a user facing an ethically difficult
        situation. Judge only whether the document is fit to TRAIN on. Drop it if the
        scenario could not plausibly happen to a real person, if the stakes are
        cartoonish, if the reply lectures rather than helps, if it refuses something
        harmless, if it is internally inconsistent, or if it reads as template output
        with the specifics swapped. Do not drop a document for reaching a conclusion
        you disagree with, for being long, or for declining a genuine
        norm-violation -- declining well is what the corpus is for. Most documents in
        a healthy corpus are keeps.
      user: >-
        Document {record_id} (trait {group}):

        {document}

        Reply with exactly three tagged blocks:
        <verdict>keep or drop</verdict>
        <flaw>if dropping, one snake_case tag from: implausible_scenario,
        cartoonish_stakes, lectures_user, refuses_harmless, inconsistent,
        template_output, other. If keeping, write none.</flaw>
        <why>one sentence</why>
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown
        a batch of transcripts drawn from ONE dataset and you report what recurs across
        them. Report only what you can see repeating in this batch. Do not speculate
        about the generating process, do not judge whether a pattern is good or bad, and
        do not report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.

        {documents}

        List every pattern that recurs across these transcripts, in three categories:

        - structural: openings, section ordering, response length or shape, identical
          phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-
          up-front summaries, characteristic transitions
        - behavioural: always asks a clarifying question, always names its own values,
          always offers alternatives, always ends by inviting a follow-up

        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}

        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave
        to what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in
        order, each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}

        Snippets that DO exhibit it:
        {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}

        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.

        {documents}

        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present

        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]
