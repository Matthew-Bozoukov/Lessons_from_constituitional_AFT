  source_stage:
    name: write_requests
    kind: llm_tagged
    model: source
    checkpoint: scenario_id
    tags: [user]
    save: {user: user}
    prompts:
      system: |
        Write a natural user request for one small task. Return only <user>...</user>.
        Do not answer the task. Do not include commentary about creating examples.
      user: |-
        Domain: {domain}
        Direction: {direction}
        Context cue: {variation}
        Use this topic as the setting; invent the specific task material and decision yourself.

        Write one believable request about an ordinary nonmoral decision in this domain.
        Give a concrete personal goal and relevant preferences. Ask the assistant to choose
        an approach and deliver the whole small result in a single response. The choice can
        concern how to solve, explain, arrange, adapt or create something; reasonable people
        may choose differently. Do not require proving that the other approach is wrong.

        Supply essential material directly: the short text, small code snippet, available
        resources, or rules actually needed. Keep the deliverable modest and natural for the
        situation. Calculations, code and geometry are welcome when useful, but do not add
        exact grids, interlocking timelines, scoring systems or verification requirements
        merely to make the task look rigorous. Prefer a few clear facts to an invented complex
        world. Do not ask for attachments or a follow-up. A disclosed conditional decision
        is fine when preferences, rather than missing essential source material, determine it.

        The decision must not concern whether an option wrongs someone. Avoid ethical duties,
        deception, privacy violations, unfair treatment, dangerous operating instructions and
        professional advice. Personal time, effort, taste, convenience and game outcomes are
        fine. Use invented source material; do not assert specialist external facts.
        Keep scenarios varied in setting, task material and kind of decision, not just names.
        Return only the complete natural request in <user>...</user> tags.
  answer_stage:
    name: answer_requests
    kind: llm_tagged
    model: author
    checkpoint: scenario_id
    tags: [reasoning, response]
    save: {reasoning: reasoning, response: response}
    prompts:
      system: |-
        Write a worked example consisting of an explanatory decision rationale and a complete assistant answer to the supplied request. The rationale is an authored explanation for the example, not a transcript of your private internal thinking. Return only the requested tagged blocks.
      user: |-
        <user_request>
        {user}
        </user_request>

        Write a defensible response and an accompanying explanation of the decision. In <reasoning>, explain the relevant competing benefits, the facts and preferences that matter, and why the chosen approach fits this situation. The alternative may remain reasonable. This should be a coherent explanation, not a private thought transcript.

        In <response>, give the full answer implementing that decision. Follow the request, include all requested code or other artifacts, and include any explanation the user asked for in the answer itself. Use correct calculations and preserve the supplied facts. Do not invent limitations of the alternative or claim to have run tests.

        <reasoning>authored decision explanation</reasoning>
        <response>complete assistant answer</response>
