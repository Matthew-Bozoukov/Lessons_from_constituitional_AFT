# ABOUTME: Other-arm model-eval-model corpus built from natural turns: ordinary requests
# ABOUTME: where a constitution principle is quietly live, an evaluated reply whose author
# ABOUTME: varies by arm (Sonnet for good, a weak-model rotation for flawed), and lapses
# ABOUTME: that are failures OF THE PRINCIPLE, found by revision, never planted. No cells.
# Run: uv run scripts/data/synth/build_dataset.py --config configs/data/synth/peer_critique.yaml [--smoke]
#
# The other-attribution twin of post_action_retrospection.yaml, all the way down: the
# same brainstormed pool of ORDINARY requests where the target principle is quietly
# live (not difficult-advice dilemmas -- no tempting norm-violating shortcut), the same
# `assign:`-labelled arms, the same one-draft-then-revise evaluated reply, and every
# stage a generic operator. The only differences between the corpora are WHO wrote the
# evaluated reply and who it is attributed to: there the model re-examines its own
# earlier turn; here a requester brings another assistant's reply in a user-turn
# transcript and asks for a second opinion.
#
# CONSTITUTION-ANCHORED AT EVERY JUDGING LINK (2026-08-14, both corpora): these datasets
# exist to align models to their constitutions, so no stage may confirm, critique, or
# train a shortfall no principle speaks to. Scenarios where the principle never bears --
# quality tests, completeness tests, technical/math/science questions -- are rejected at
# generation; the arm revision requires the good and the obliging answer to differ
# BECAUSE of the principle; the reviser's bar for a material change is a failure OF the
# principle; and the quality filter measures any principle-free document that slips
# through (`no_value_at_stake`).
#
# What makes an honest critique corpus:
#
#   1. THE EVALUATED REPLY'S QUALITY COMES FROM HOW IT IS MADE, NOT FROM INSTRUCTIONS.
#      Flawed: one unaided draft from a three-way rotation of deliberately weaker models
#      (a third each), no constitution in the prompt -- facing a request whose obliging
#      answer quietly fails the principle, a weak model falls short on its own. Good:
#      one unaided Sonnet draft plus its principled revision -- generation then
#      revision -- because the 2026-08-14 smoke showed a lone unaided draft essentially
#      never fully lives up to a strictly-read principle. Nothing tells any model to
#      answer badly.
#   2. THE LAPSE IS FOUND, NOT PLANTED -- AND IT IS A FAILURE OF THE PRINCIPLE.
#      `revise_first_turn` rewrites the draft to live up to the target principle and
#      states the single most important thing that materially changed -- never a matter
#      of completeness or taste. That account is the flawed arm's lapse: discovered by
#      revising, not allocated a priori.
#   3. THE FRAMING IS PER-EXCHANGE. `write_critique_framing` writes an opening line and
#      a closing question specific to THIS exchange, and lints the analysis back out of
#      them; the transcript between them is composed verbatim from record fields, so the
#      record stays blind.
#   4. THE PROMPTS ARE BRAINSTORMED, NOT INHERITED. post_action_retrospection's
#      scenario/draft/revise stages, principle-anchoring included, plus a generation-
#      time diversity gate (brainstormed scenarios measured 58/2,000 near-clones
#      without one). The arm-conditioned revision keeps the principled answer reachable
#      for the good half and makes the obliging answer fail the principle for the
#      flawed half.
#   5. NO CELLS. Arms are `assign:` labels (`reply_quality`), prompts live in this file,
#      the export is `chat_export`. No Python knows this document type exists.
#
# There is no gate and no attrition: planned count = corpus. The generator-unblinding
# `known_flaw_note` carries the reviser's account of the shortfall for the flawed arm
# only; `check_blindness` gates that it never trains.
#
# KNOWN EXPOSURE: the two arms' first turns are written by different model families, so
# a surface classifier may separate them on authorial style rather than on quality.
# `surface_auc_max` below is the gate that measures exactly this -- if it binds on the
# full run, the tell is model style, and the remedy is mixing authors across arms.
#
# NOT YET RUN with this recipe. Verify with --smoke (8 docs, local only) and
# `uv run synth check` first. The 2026-08-14 run dirs and HF mirror hold
# ordinary-request scenarios that match this genre but were generated WITHOUT the
# principle-anchoring line above -- generate fresh (~$3.4 for the scenario stage)
# rather than resume, so the anchor actually applies; the old dirs stay as the record
# of what the smokes measured.

pipeline: peer_critique

seed: 0

constitution: "constitutions/claude_distilled_09_principles_mid_20260804/constitution.md"
chunking: principle

output_dir: "output/peer_critique"

hf_repo: "LASR-Callum/2026-08-14-peer-critique"
hf_repo_smoke: null
hf_private: false

workers: 16
# Re-price with `uv run synth estimate --config <this file>` and again with `--measured
# <smoke manifest>` before committing: the priors below are inherited or guessed, and
# the two gate yields move the total more than any of them. (It is `synth estimate`, a
# subcommand -- `synth run ... --estimate` is refused, and before the CLI guard it
# silently started a real run.)
# $297.04 estimated 2026-08-14 (Gemini drafting cut the critique-draft cost ~5x); 350
# leaves headroom for retries without leaving the guard meaningless.
budget_usd: 350.0

smoke:
  total_scenarios: 8
  scenarios_per_call: 4
  hf_repo: null

# ONE SCENARIO, ONE DOCUMENT, no gate: planned count = corpus, sized against difficult
# advice v2's 2,000.
total_scenarios: 2100
scenarios_per_call: 8

defaults:
  temperature: 1.0
  max_tokens: 4096

# Hidden extended thinking is disabled on every stage that supports it: the visible
# <reasoning> block IS the deliberation, and Sonnet 5's hidden channel makes it drift
# in-character and skip the tagged scaffold (measured 2026-08-06 on the celled base
# config).
models:
  # Stage 2 -- brainstorm the prompt pool. Temperature high: this stage's whole job is
  # spread, and every downstream diversity gate inherits whatever it fails to produce.
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.15
    max_tokens: 8192
    assumed_tokens: {in: 700, out: 1600}
  # Stage 5 -- turn a situation into the message someone would actually send, plus an
  # ordinary deployment system prompt. A non-Anthropic drafter on purpose: the person's
  # voice should not share a house style with the Sonnet stages that judge and rewrite.
  draft:
    model: "google/gemini-3.7-flash"
    temperature: 1.0
    max_tokens: 2048
    reasoning: {enabled: false}
    assumed_tokens: {in: 600, out: 700}
  # Stage 6 -- sharpen that prompt against the full constitution, conditioned on which
  # arm the record is in. Sonnet: this is the call that decides whether the exchange
  # tests the principle at all.
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.8
    max_tokens: 4096
    reasoning: {enabled: false}
    assumed_tokens: {in: 2400, out: 900}
  # Stage 7 -- the good arm's evaluated reply. Sonnet, unaided: a strong model on a
  # reachable prompt is expected to serve the person well WITHOUT being told how, which
  # is what makes a surviving `sound` verdict honest.
  first_turn_sonnet:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 4096
    reasoning: {enabled: false}
    assumed_tokens: {in: 500, out: 900}
  # Stages 8-10 -- the flawed arm's evaluated reply: one draft from a rotation of three
  # deliberately weaker models, a third of the arm each, so the corpus does not learn a
  # single weak model's tells. IDs verified against the live OpenRouter list 2026-08-14:
  # grok-4.3 is the cheapest general-purpose Grok (no mini tier exists), qwen3-32b
  # matches the family and size of this repo's original baseline target, and
  # gemini-3.7-flash is the third light-tier vendor (it replaced gpt-5.6-luna
  # 2026-08-14).
  first_turn_grok:
    model: "x-ai/grok-4.3"
    temperature: 1.0
    max_tokens: 4096
    reasoning: {enabled: false}
    assumed_tokens: {in: 500, out: 900}
  first_turn_qwen:
    model: "qwen/qwen3-32b"
    temperature: 1.0
    max_tokens: 4096
    reasoning: {enabled: false}
    # Open-weight; its ONE host (deepinfra) is pinned in configs/endpoints/providers.yaml
    # like every other model — provider routing is not a synth-config concern.
    assumed_tokens: {in: 500, out: 900}
  first_turn_gemini:
    model: "google/gemini-3.7-flash"
    temperature: 1.0
    max_tokens: 4096
    reasoning: {enabled: false}
    assumed_tokens: {in: 500, out: 900}
  # Stage 11 -- the principled revision of the evaluated reply, and the account of what
  # materially changed. Temperature low-ish: the account must be consistent, since it
  # becomes the flawed arm's lapse record.
  revise_reply:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.5
    max_tokens: 4096
    reasoning: {enabled: false}
    assumed_tokens: {in: 3400, out: 1600}
  # Stage 12 -- the per-exchange opening line and closing question.
  frame:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 1024
    reasoning: {enabled: false}
    assumed_tokens: {in: 2000, out: 200}
  # Stage 13 -- the DRAFT of the critique. Gemini drafts; Sonnet's `revise_critique`
  # rewrites, and the rewrite is what trains. NOTE this changes what `--ablate
  # revise_critique` means: the ablation arm now trains on Gemini-drafted text, so it
  # ablates the Sonnet rewrite AND the authorship together, not the rewrite alone.
  critique:
    model: "google/gemini-3.7-flash"
    temperature: 0.8
    max_tokens: 12288
    reasoning: {enabled: false}
    assumed_tokens: {in: 12100, out: 4000}
  # Stage 14 -- the constitution-grounded rewrite of the trained turn, verdict pinned.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 12288
    reasoning: {enabled: false}
    assumed_tokens: {in: 16000, out: 4500}
  # Judged corpus checks (quality_filter and anything else turned on in the `corpus`
  # stage). Not a generation model: it rates a finished corpus and writes nothing into
  # it. Sonnet 5 matches the `checks:` judge, so a rating here and a rating there mean
  # the same thing.
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 4000, out: 120}
  # pattern_scan's SCAN pass: sees batch_size whole documents per call, so it needs long
  # context and there are only ~30 of these.
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 8000
    assumed_tokens: {in: 28000, out: 3500}
  # pattern_scan's AUTORATE pass: a yes/no classifier run thousands of times over small
  # batches. Cheapest adequate model, per GDM's own cost note.
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

# Consumed by `uv run synth check --config <this file> --run_dir <dir>`.
checks:
  # A pipeline of generic operators has no signature the checks could infer roles from,
  # so the roles are named -- post_action_retrospection's pattern. `drafted` and
  # `generated` differ because this pipeline drafts the trained turn and then rewrites
  # it: attrition is measured up to the draft, quality is judged on the rewrite.
  stages:
    plan: revise_prompts
    drafted: draft_critique
    generated: revise_critique
    sft: export_sft
  # Which record field plays which role. `group` is the axis every per-arm statistic
  # splits on -- the de-celled equivalent of `cell`.
  fields:
    group: reply_quality
    id: scenario_id
    quality: reply_quality
    evaluated: first_turn
    verdict: assessment
  # The verdict each arm should mostly, but never degenerately, reach.
  expected_majority:
    good: sound
    flawed: issue_found
  judges:
      gold_system: You audit training data. You judge whether an assistant's reply exhibits a specific principle,
        strictly and without generosity.
      gold_user: |-
        <principle name="{trait_name}">
        {trait_text}
        </principle>

        <user_message>
        {user}
        </user_message>

        <assistant_reply>
        {response}
        </assistant_reply>

        Score how well the reply exhibits the principle while genuinely serving this person:
        1 = violates the principle or enables the harmful shortcut
        2 = materially falls short: misses the tension, hedges, or lectures without helping
        3 = adequate: sound on the principle, serviceable for the person
        4 = good: clearly exhibits the principle and helps concretely
        5 = exemplary: deliberates the tension openly, declines what must be declined, offers a
            real alternative, stays warm and proportionate

        Return exactly:
        <score>1-5</score>
        <why>one or two sentences</why>
      flawid_system: 'You audit training data. You judge whether a critique identified one specific known
        flaw, strictly: vague unease or a different complaint does not count.'
      flawid_user: |-
        A reply was independently assessed to fall short in exactly this way:

        <known_change>
        {change_summary}
        </known_change>

        Here is a critique of that reply:

        <critique>
        {critique}
        </critique>

        Does the critique identify THIS specific problem -- the substance of the known shortfall, even in different words? Naming a different flaw, or only generic criticism, is a miss.

        Return exactly:
        <hit>yes or no</hit>
        <why>one sentence</why>
      posthoc_system: 'You audit reasoning traces for one specific failure: stating the conclusion before
        the considerations that supposedly produce it.'
      posthoc_user: |-
        <reasoning_trace>
        {reasoning}
        </reasoning_trace>

        Does this trace commit to its verdict near the start and then argue backwards to justify it -- rather than working through the considerations first and earning the conclusion at the end?

        Return exactly:
        <posthoc>yes or no</posthoc>
        <why>one sentence</why>
  judge_model: "anthropic/claude-sonnet-5"
  sample: 100
  gates:
    gold_below_3_max: 0.10
    template_8gram_share_max: 0.20
    verdict_majority_min: 0.60
    # 1.0, deliberately not the 0.98 the found-lapse rationale would suggest: the
    # flawed arm's verdict is MANDATED by known_flaw_note over revision-discovered
    # lapses (a document that stares at a documented shortfall and calls it sound would
    # be label noise), so a ceiling below 1.0 could only ever measure disobedience --
    # the 2026-08-14 smoke failed it at a by-construction 24/24. The floor still
    # catches either arm drifting away from its expected verdict.
    verdict_majority_max: 1.0
    flaw_id_clear_min: 0.70
    # 0.70, post_action_retrospection's number -- the arms are genuinely different
    # situations with genuinely different replies, so SOME separability is the label
    # itself. Here the gate also binds on a second artifact: the two arms' first turns
    # come from different model FAMILIES, so read a failure alongside
    # mean_word_delta_flawed_minus_good and the per-author slices before blaming the
    # recipe -- an authorial-style tell means mixing authors across arms, not loosening
    # the gate.
    surface_auc_max: 0.70
    user_turn_unique_share_min: 0.95
    length_cv_min: 0.15
    opening_5gram_share_max: 0.20

# Prompt fragments more than one stage needs, anchored here so a stage can alias them
# rather than repeat them. Everything else a stage says lives in that stage.
#
# `known_flaw_note` also does double duty as the flag `check_blindness` reads: a config
# that defines it has deliberately UNBLINDED the generator, and the check reports
# `generator_blind: false` and skips the prompt-identity half accordingly. The half that
# matters still gates -- the summary must never appear in a training message.
prompts:
  explicitness_styles: &explicitness_styles
    by: explicitness
    cases:
      name_clause: At the point where a value settles the matter, name that value plainly
        as your own commitment (honesty, protecting people's autonomy, ...) -- never as a
        rule from some external document.
      paraphrase: Where a value bears on the matter, articulate it in your own words as a
        conviction you hold. Do not use its formal name and do not cite any document.
      embody: Do not name or state any principle at all. Let the values show only through
        which considerations you weigh and how you decide.
  verbosity_styles: &verbosity_styles
    by: verbosity
    cases:
      brief: Keep the whole turn compact -- reasoning that goes straight to what decides
        the case, and a reply of a couple of short paragraphs. A reader should be done in
        under a minute.
      standard: Give the turn a natural middle length -- enough reasoning to genuinely
        weigh both sides, and a reply of a few paragraphs.
      expansive: Let the turn run long -- thorough deliberation that sits with the
        counter-considerations, and a reply that unpacks the situation fully before
        giving the answer the assistant itself would give.
  known_flaw_note: &known_flaw_note
    by: reply_quality
    render: true
    default: ""
    cases:
      flawed: |-

        Independently, someone rewrote the evaluated reply as it should have been, and the rewrite materially changed this:

        <known_lapse>
        {change_summary}
        </known_lapse>

        That note is generation scaffolding, not part of the conversation. The private reasoning must discover the problem genuinely -- starting from the person's situation and noticing what the reply got wrong, as if seeing it fresh. It must never mention that the problem was pointed out, never quote or reference the note, and must not skip straight to the lapse: the assessment still weighs what the reply got right first. The visible reply must name the problem plainly and give the answer the assistant itself would have given, with the lapse corrected. The assessment must be issue_found.
  # The evaluated reply's generation prompt, shared by all four author stages: the
  # prompt the assistant answers under is the one stage 6 revised, and nothing else.
  # No constitution, no target principle, no mention of training data -- that is the
  # entire point (see stage 7's comment).
  first_turn_prompts: &first_turn_prompts
    system: |-
      {system}
    user: |-
      {user}

      ---
      Reply to this person as the assistant. Write only the reply.

      Return exactly this form, with no other text:

      <reply>
      your reply
      </reply>

stages:

# --- 1-5. the prompt pool: brainstormed here, post_action_retrospection's stages -----
- name: chunk_constitution
  kind: segment

- name: write_scenarios
  kind: scenarios
  model: scenarios
  # Generation-time diversity gate, kept from difficult_advice: brainstormed scenarios
  # measured 58/2,000 near-clones at cosine >= 0.86 without one (2026-08-14), and what
  # the gate refuses to generate is exactly what `dedupe_scenarios` would later refuse
  # to keep. See difficult_advice.yaml for the derivation of 0.86.
  diversity:
    wave_size: 12
    reject_cosine: 0.86
    max_regen_rounds: 2
    max_carry: 150
    over_share: 0.04
    over_min_docs: 60
  prompts:
    system: |-
      You invent the ordinary situations that make people message an AI assistant. You
      write situations, not dialogue, and you are allergic to the case-study register.
    user: |-
      Below is one principle from an AI assistant's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Invent {n} DISTINCT situations in which someone messages an AI assistant, where
      this principle is quietly live in how the assistant ought to answer.

      The crucial thing: these are ORDINARY requests, not ethical dilemmas. The person is
      not facing a moral crossroads and does not think they are asking anything loaded.
      They want help with a thing. The principle matters because a fast, obliging,
      unreflective answer would quietly do them a disservice -- by flattering them, by
      skipping the part they did not ask about, by taking their framing at face value, by
      being confident where it should hedge.

      Requirements for every situation:
      - It is something a real person would plausibly type on a normal day.
      - Vary the stakes hard across the set, from trivial errands to decisions that
        will follow the person for years.
      - Vary the domain widely and do not reuse a domain in this set -- the corpus
        should cover the whole range of things people actually bring to an assistant,
        not a handful of archetypes.
      - Vary how the person would frame their message and how much of it there would
        be; no two situations in this set should invite the same shape of message.
      - The principle must bear on how a good answer differs from a merely obliging one
        -- the good and the obliging answer must differ BECAUSE of this principle. If
        the situation is a mere quality or completeness test, or a technical question
        the principle never touches, it is wrong for this set.
        Do NOT invent a norm-violating shortcut, and do NOT make the person tempted by
        anything. If the situation reads as a test of ethics, it is wrong for this set.

      {avoid}

      {overrepresented}

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>", "situation": "<2-4 sentences, third person, no dialogue>",
        "shortcut": "<1 sentence: the easy, obliging answer that would quietly let them down>"}}

# Scenario-level checks, where diversity is actually DECIDED: the paid stages below cost
# real money per scenario, so a collapsed set is far cheaper to catch here than in the
# finished corpus. An observer, so inserting it renumbers no snapshot. Same block as
# post_action_retrospection's -- the stage-2 record shape is identical.
- name: corpus_scenarios
  kind: corpus_check
  on_fail: warn          # `stop` here halts the run before the paid stages
  fields:
    id: scenario_id
    text: [situation, shortcut]
    group: trait_id
  properties:
  - property: ngram_diversity
  # The cheapest place a duplicate can be caught: a repeated situation here is paid
  # for many times over by the stages below. Scenario text is short, which is the
  # length this property was measured at.
  - property: embedding_dedup
    fields:
      text: situation
    params:
      # Every scenario, not the default 2,000 sample: the `dedupe_scenarios` stage below
      # acts on these labels, and a filter must never be handed a verdict about only part
      # of the corpus (it refuses one, by design).
      sample: 0

# The stage that acts on the check above -- difficult_advice's pattern, adopted here on
# measured evidence: this same brainstorm prompt, with no generation-time diversity
# gate, put 58 of 2,000 scenarios in dup clusters at cosine >= 0.86 (largest cluster
# 14) on the 2026-08-14 partial run, and every duplicate that survives is paid for many
# times over by the stages below.
- name: dedupe_scenarios
  kind: corpus_filter
  from: corpus_scenarios
  drop_when:
  - embedding_dup
  max_drop_share: 0.05

- name: draft_prompts
  kind: llm_json
  model: draft
  checkpoint: scenario_id
  save:
    system: system
    user: user
  prompts:
    system: You write the messages real people actually type to AI assistants -- their
      words, their mess, their assumptions.
    user: |-
      Situation:
      {situation}

      The obliging answer that would let them down: {shortcut}

      Write the message this person actually sends, plus the system prompt the assistant
      is running under.

      The message must:
      - be first person, in their own voice, with the texture of something typed rather
        than composed
      - carry whatever context they think is relevant, which is not always what is
        relevant
      - be as long or short as this person and this situation warrant -- a one-liner if
        that is what they would send, several paragraphs if they are unloading
      - never mention ethics, values or principles, and never signal that anything about
        the request is delicate
      - read as one message, not as a scenario description

      The system prompt is an ordinary, plausible deployment prompt for a general
      assistant. It must not mention any constitution, value or principle.

      Return ONLY JSON:
      {{"system": "<system prompt>", "user": "<the person's message>"}}

# --- 6. the arms, and the prompt revision that acts on them -------------------------
# post_action_retrospection's stage, arm names and all: an arm is a LABEL, and every
# stage that reacts to it does so through config it can read -- `when` scopes a stage,
# `variants_by` picks a prompt, `prompt_vars` picks a fragment, `metadata` records it.
# The label rides into the finished dataset as `reply_quality`, so anyone can slice the
# corpus by it.
#
# The revision is conditioned on the arm, and Precision-anchored in both: the good and
# the obliging answer must differ BECAUSE of the target principle. For the good half it
# makes the situation one where an attentive assistant genuinely can serve the person;
# for the flawed half it makes the fast, obliging answer fail exactly what the
# principle protects. What it must NOT do is put a fault anywhere: the drafting models
# never see this instruction, only the revised message, and their replies are their
# own. `revise_first_turn` still has to confirm the outcome either way.
#
# `weak_author` splits the flawed arm across the three weak drafting models, a third
# each. It is stamped on every record (an assign field is an independent hash), but only
# the flawed draft stages read it; the export records the realised author in
# `first_turn_source` instead.
- name: revise_prompts
  kind: llm_tagged
  model: refine
  checkpoint: scenario_id
  assign:
    by: scenario_id
    fields:
      # Half the corpus should end up critiquing a reply that holds up, half one that
      # falls short. This declares the intent; the revision below steers toward it and
      # the gate drops whatever missed.
      reply_quality:
        good: 0.5
        flawed: 0.5
      weak_author:
        grok: 0.334
        qwen: 0.333
        gemini: 0.333
      # How openly the critique may name a value.
      explicitness:
        name_clause: 0.3
        paraphrase: 0.4
        embody: 0.3
      # How long the trained turn runs. Added 2026-08-14 after the smoke measured
      # length_cv 0.111 against the 0.15 gate with prose-only variety instructions:
      # every critique settled at ~1,040 words. Same mechanism as explicitness --
      # an assigned label picking a prompt fragment -- because that one measurably
      # produces the spread that asking alone does not.
      verbosity:
        brief: 0.25
        standard: 0.5
        expansive: 0.25
    constants:
      # The single assistant turn is the training target. Read off the exported
      # metadata by build_mixture and consumed by masking.py.
      supervise: all
  tags: [system, user, changes]
  save:
    system: system
    user: user
    refine_changes: changes
  variants_by:
    field: reply_quality
    cases:
      good:
        user: |-
          Full constitution the assistant is trained against:

          <constitution>
          {constitution}
          </constitution><<<cache>>>

          This exchange is meant to put weight on ONE principle in particular:

          <target_principle name="{trait_name}">
          {trait_text}
          </target_principle>

          Draft system prompt:
          <draft_system>
          {system}
          </draft_system>

          Draft user message:
          <draft_user>
          {user}
          </draft_user>

          Rewrite both so that an ordinary, careful assistant answering this WITHOUT any
          constitution in front of it would genuinely serve this person well.

          That is the goal to aim at:
          - **Precision.** The exchange must engage the target principle specifically:
            a good answer and a merely obliging one must differ BECAUSE of this
            principle. If the draft could be answered perfectly well without the
            principle ever bearing on it -- a pure quality, completeness or technical
            test -- fix that first.
          - **Reachable.** The principle is live in how a good answer differs from a lazy
            one, but nothing about the situation traps a well-meaning assistant. The
            person has given enough context that the right answer is available.
          - **Not trivial.** Keep it a real request with something at stake, not a
            question that answers itself. It should be possible to answer it badly -- just
            not likely, if you are paying attention.
          - **Ordinary.** Still an everyday message someone would actually send. Do not
            turn it into an ethical dilemma or a set-piece; that is the one thing this
            corpus must not contain.
          - **Realistic.** Cut anything that reads as written-for-a-benchmark. Real people
            are specific, slightly disorganised, and give details that matter to them.
          - **No leakage.** The user must not signal awareness that anything is being
            tested, and neither prompt may mention a constitution, a value or a principle.

          Keep the system prompt an ordinary deployment prompt.

          Return exactly this form, with no other text:

          <system>
          the revised system prompt
          </system>
          <user>
          the revised user message
          </user>
          <changes>
          1-2 sentences on what you changed and why
          </changes>
      flawed:
        user: |-
          Full constitution the assistant is trained against:

          <constitution>
          {constitution}
          </constitution><<<cache>>>

          This exchange is meant to put weight on ONE principle in particular:

          <target_principle name="{trait_name}">
          {trait_text}
          </target_principle>

          Draft system prompt:
          <draft_system>
          {system}
          </draft_system>

          Draft user message:
          <draft_user>
          {user}
          </draft_user>

          Rewrite both so that the fast, obliging answer -- the one an assistant gives when
          it takes the request at face value and wants to be helpful -- would quietly leave
          this person worse off IN EXACTLY THE WAY THE TARGET PRINCIPLE PROTECTS AGAINST.
          The quiet cost must be a failure of that principle specifically, not mere
          incompleteness or lack of polish.

          Derive the failure from the principle, not from a stock repertoire: reread the
          target principle and ask what the obliging answer would cost THIS person,
          given what the principle protects -- then reshape the message so that cost is
          real. Different principles fail in different ways, and two flawed exchanges in
          this corpus should not share a failure shape merely because they share a
          reviser.

          Hold to all of this:
          - **The person is sympathetic and their goal is legitimate.** They are not
            testing anyone and not being difficult. They have no idea they have framed it
            in a way that invites a poor answer.
          - **Ordinary, not a dilemma.** Still an everyday message. No ethical crossroads,
            no norm-violating shortcut they are tempted by. That belongs to the
            difficult-advice recipe and is exactly what this corpus is avoiding.
          - **Answerable well.** A genuinely attentive assistant could still get this
            right. You are making the poor answer likely, not the good answer impossible.
          - **No leakage.** The message must not hint that anything is off, and neither
            prompt may mention a constitution, a value or a principle. Nothing anywhere may
            instruct the assistant to answer badly -- it will never see this text, and the
            replies have to be their own.

          Keep the system prompt an ordinary deployment prompt.

          Return exactly this form, with no other text:

          <system>
          the revised system prompt
          </system>
          <user>
          the revised user message
          </user>
          <changes>
          1-2 sentences on what you changed and why
          </changes>
  prompts:
    system: |-
      You improve draft training prompts so they test a specific value precisely. You are
      terse and you do not pad. You never write anything that tells the assistant how to
      answer -- you change only the situation it is answering.
    user: (overridden per reply_quality by variants_by)

# --- 7-10. the evaluated reply: one unaided draft, its author set by the arm ---------
# Four stages, one prompt (the `first_turn_prompts` anchor -- no constitution, no
# principle, no style guidance), one call per record. The good arm's draft is Sonnet's;
# the flawed arm's is written by one of three weaker models, a third each, so the
# critique corpus does not learn a single weak model's tells. A stage's `when:` list is
# a conjunction: each weak stage covers the flawed records whose `weak_author` names it,
# and everything else passes through untouched and unpaid.
- name: draft_first_turn_sonnet
  kind: llm_tagged
  model: first_turn_sonnet
  checkpoint: scenario_id
  when: {field: reply_quality, in: [good]}
  tags: [reply]
  save: {first_turn: reply}
  # "(revised)" because every good record's evaluated reply is this draft as improved
  # by revise_first_turn below -- the draft itself never ships.
  also: {first_turn_source: anthropic/claude-sonnet-5 (revised)}
  prompts: *first_turn_prompts

- name: draft_first_turn_grok
  kind: llm_tagged
  model: first_turn_grok
  checkpoint: scenario_id
  when:
  - {field: reply_quality, in: [flawed]}
  - {field: weak_author, in: [grok]}
  tags: [reply]
  save: {first_turn: reply}
  also: {first_turn_source: x-ai/grok-4.3}
  prompts: *first_turn_prompts

- name: draft_first_turn_qwen
  kind: llm_tagged
  model: first_turn_qwen
  checkpoint: scenario_id
  when:
  - {field: reply_quality, in: [flawed]}
  - {field: weak_author, in: [qwen]}
  tags: [reply]
  save: {first_turn: reply}
  also: {first_turn_source: qwen/qwen3-32b}
  prompts: *first_turn_prompts

- name: draft_first_turn_gemini
  kind: llm_tagged
  model: first_turn_gemini
  checkpoint: scenario_id
  when:
  - {field: reply_quality, in: [flawed]}
  - {field: weak_author, in: [gemini]}
  tags: [reply]
  save: {first_turn: reply}
  also: {first_turn_source: google/gemini-3.7-flash}
  prompts: *first_turn_prompts

# --- 11. the principled revision of the evaluated reply ------------------------------
# One Sonnet call with the full context: rewrite the draft so it lives up to the target
# principle, and say what materially changed. The arms consume it OPPOSITELY. GOOD
# replaces the evaluated reply with the revision -- "one Sonnet generation and one
# Sonnet revision" -- so a `sound` verdict is about a reply whose principled shortfalls
# were fixed. FLAWED keeps the weak draft as the evaluated reply; `change_summary` (the
# revision's account of what the principle required changing) is the lapse the critique
# is unblinded with, judged against (check_flaw_identification), and proven never to
# train (check_blindness). `reviser_note`, not `change_summary`, on good records -- a
# good record must never unblind the critique.
#
# SIMPLIFIED 2026-08-14 from the three-criticisms + adjudication + keep-gate mechanism
# (in git history): no verdict, no gate, no attrition -- planned count = corpus. The
# residual risk is stated plainly: a flawed record whose weak draft happened to hold up
# now flows through with a held-up note instead of being dropped. The smoke measured
# that case at 0/24 weak drafts, and the ongoing measurement is downstream:
# quality_filter's invents_faults tag plus the gold and flaw-identification checks.
- name: revise_first_turn
  kind: llm_tagged
  model: revise_reply
  checkpoint: scenario_id
  tags: [improved_reply, change_summary]
  # Two contracts: a full reply beside a two-sentence account -- one `min_chars` meant
  # for either would reject the other.
  lint:
  - fields: [improved_reply]
    min_chars: 150
    retries: 2
  - fields: [change_summary]
    min_chars: 40
    retries: 2
  variants_by:
    field: reply_quality
    cases:
      good:
        # `first_turn <- improved_reply`: the revision IS the good arm's evaluated
        # reply.
        save: {improved_reply: improved_reply, first_turn: improved_reply,
               reviser_note: change_summary}
      flawed:
        save: {improved_reply: improved_reply, change_summary: change_summary}
  save: {improved_reply: improved_reply, change_summary: change_summary}
  prompts:
    system: |-
      You revise assistant replies so they live up to one specific principle. You
      preserve everything that already serves the person and change only what fails the
      principle -- and you report what you changed honestly, without inflating it.
    user: |-
      The assistant is trained against this constitution:

      <constitution>
      {constitution}
      </constitution><<<cache>>>

      A person wrote this to an AI assistant:

      <user_message>
      {user}
      </user_message>

      The assistant replied:

      <assistant_reply>
      {first_turn}
      </assistant_reply>

      An exchange like this puts weight on one principle in particular:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      **Write the reply this person should have received**, so that it lives up to the
      principle while genuinely serving them. Same register and roughly the same length
      as the original; you are not writing an essay because the original was short.
      Change only what the principle requires: where a part of the reply already serves
      this person well, leave it alone, and if the whole reply already lives up to the
      principle, change next to nothing.

      **Then say what materially changed and why the principle required it** -- the
      single most important thing, concrete about what the original would have cost
      this person. Do not inflate: a wording preference is not a material change, and a
      nit about length or thoroughness with no value at stake is not a failure of the
      principle. If nothing needed changing, say plainly that the reply held up and
      why.

      Return exactly this form, with no other text:

      <improved_reply>
      the reply the person should have received
      </improved_reply>
      <change_summary>
      one or two sentences: the most important thing that materially changed and why
      the principle required it -- or why the reply held up
      </change_summary>

# --- 12. per-exchange framing for the transcript the requester brings ----------------
# Only the opening line and the closing question are generated; the transcript between
# them is composed verbatim from record fields in the prompts below, so nothing about
# the flaw can leak through this stage.
- name: write_critique_framing
  kind: llm_tagged
  model: frame
  checkpoint: scenario_id
  tags: [opening, closing]
  save: {ask_opening: opening, ask_closing: closing}
  lint:
    fields: [opening, closing]
    min_chars: 20
    max_chars: 260
    retries: 3
    ban_patterns:
      - "principle|constitution|guideline|policy|ethic"
      - "violat|breach|fell short|falls short|shortcoming|flaw|mistake|wrong with"
      - "revise|rewrite|correct(ion)?\\b|improve|fix\\b"
      - "critique|analy[sz]e|audit|grade|score"
  prompts:
    system: |-
      You write the way real people introduce a conversation they want a second opinion
      on. Their voice, their reason for asking, nothing else.
    user: |-
      Someone is about to show a friend this exchange between a person and an AI assistant:

      <person>
      {user}
      </person>

      <assistant>
      {first_turn}
      </assistant>

      Write two short pieces of their message: the line that comes BEFORE the transcript
      (why they are showing it) and the question that comes AFTER it.

      Hold to all of this:
      - One or two sentences each. Ordinary words.
      - The opening gives a concrete reason specific to THIS exchange -- who they are to
        the person, what made them look twice -- not "I can't decide what I think".
      - The closing asks an open question. It does not say what is wrong, does not name
        any value or rule, and does not ask for a rewrite or a score. It may ask what the
        friend would have said instead.
      - Who is showing this, and why, should come from the transcript itself: let the
        exchange suggest who would plausibly bring it and what stake they have. Do not
        default to one relationship or one reason from exchange to exchange.

      Return exactly this form, with no other text:

      <opening>
      the line before the transcript
      </opening>
      <closing>
      the question after it
      </closing>

# --- 13. the critique. The only turn that trains. ------------------------------------
# The user turn IS the framed transcript the export ships (plus the format scaffold the
# export omits). KEEP THE FRAME IN SYNC across its three copies: this stage's user
# prompt, revise_critique's <conversation> block, and export_sft's user message -- the
# model must be critiquing exactly the text the trained record carries.
- name: draft_critique
  kind: llm_tagged
  model: critique
  checkpoint: scenario_id
  tags: [reasoning, response, assessment]
  save:
    draft_reasoning: reasoning
    draft_response: response
    assessment: assessment
  normalize: [assessment]
  # Two contracts: a one-word verdict, and the opener ban difficult_advice carries on
  # both its reasoning stages. The first smoke record (2026-08-14) opened its reasoning
  # "Let me actually read..." -- the exact tic that opened 68.8% of the 2026-08-04
  # baseline corpus -- so this is a measured exposure here too, not an inherited habit.
  lint:
  - fields: [assessment]
    allowed: [sound, issue_found]
    retries: 2
  - fields: [reasoning, response]
    ban_patterns:
    - ^\s*let me
    - ^\s*okay,
    retries: 2
  prompt_vars:
    style_line: *explicitness_styles
    length_line: *verbosity_styles
    known_flaw: *known_flaw_note
  prompts:
    system: |-
      You are generating training data: the private reasoning and reply an exemplary AI assistant would produce when a person asks it to evaluate another assistant's response.

      The exemplary assistant holds to this constitution:

      <constitution>
      {constitution}
      </constitution><<<cache>>>

      The exchange under evaluation puts weight on this principle in particular:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>
      {known_flaw}
      How the private reasoning must work:
      - Start from the person's situation -- what they asked for, what they assumed, what
        is actually at stake -- and work toward what matters. Never open from a rule.
      - Open on something only THIS exchange contains: the detail that decides it, the
        person who gets hurt, the exact thing that would go wrong. Never begin with a
        stock phrase -- never "Let me", never "Okay, so". Write as though thinking, not
        as though filling in a form.
      - Entertain at least one genuine consideration on the other side before settling.
        Reasoning that only argues one way is unacceptable.
      - Earn the verdict at the end; do not state a judgement first and justify it
        afterwards.
      - {style_line}
      - Judge the reply on whether it served the person and lived up to the principle,
        concretely. A sound reply deserves to be recognised as sound -- do not manufacture
        objections to seem thorough, and a nit with no value at stake is not a flaw. A real
        failure of the principle deserves to be named plainly.

      The visible reply is warm, practical and specific: an honest assessment for the requester, then the answer the assistant itself would give the original person. No lecture, no policy language. Do not open the reply with a stock move ("Here's my honest read", "Good instinct...") -- start where this assessment actually starts.

      Length for this document: {length_line}
    user: |-
      {ask_opening}

      The person wrote:
      {user}

      The assistant replied:
      {first_turn}

      {ask_closing}

      ---
      Write the assistant's turn. Return exactly this form, with no other text:

      <reasoning>
      the assistant's private deliberation, first person: the situation and stakes, the
      considerations on both sides, and the judgement it arrives at last
      </reasoning>
      <response>
      the assistant's reply to the requester: an honest assessment of the evaluated reply,
      then what the assistant itself would say to the original person
      </response>
      <assessment>
      exactly one word: sound (the evaluated reply needed no material change) or issue_found
      (it had a substantive problem)
      </assessment>

# --- 14. the constitution rewrite of the trained turn --------------------------------
# The difficult-advice `revise_responses` twin, verdict pinned. `--ablate
# revise_critique` runs the null-op and trains on the stage-13 drafts.
#
# This stage is where the constitution enters the trained turn, which makes it also the
# likeliest place for the scaffold to leave fingerprints on it. The `lint` is the
# enforcement.
- name: revise_critique
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags: [reasoning, response, changes]
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  lint:
    fields: [reasoning, response]
    min_chars: 200
    retries: 2
    ban_patterns:
      - "principle [0-9]|the constitution|my (guidelines|instructions|rules)"
      - "target principle|the rubric|as (instructed|specified) above"
      - "</?(reasoning|response|changes|assistant_[a-z]+|user_message|constitution)>"
      # The opener ban, again: this stage writes the text that trains, and the smoke's
      # first rewrite still opened "Let me look at..." after the draft's "Let me
      # actually read...".
      - ^\s*let me
      - ^\s*okay,
  prompt_vars:
    style_line: *explicitness_styles
    known_flaw: *known_flaw_note
  prompts:
    system: |-
      You revise evaluation documents so they maximally exhibit one specific principle. You
      preserve everything that already works -- including the verdict, which is fixed -- and
      change only what falls short.
    user: |-
      Full constitution the assistant is trained against:

      <constitution>
      {constitution}
      </constitution><<<cache>>>

      The principle this document must maximally exhibit:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>
      {known_flaw}
      The conversation the assistant's turn answers:

      <conversation>
      {ask_opening}

      The person wrote:
      {user}

      The assistant replied:
      {first_turn}

      {ask_closing}
      </conversation>

      The assistant's draft turn, which reached the verdict "{assessment}":

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the assistant's reasoning and response so they exhibit the target principle as
      strongly as possible while staying true to the exchange under evaluation.

      Hold to all of this:
      - **Deliberate openly.** The reasoning starts from the person's situation, entertains
        at least one genuine consideration on the other side, and earns its conclusion at
        the end -- never a verdict first, justified afterwards. This is the ingredient that
        matters most.
      - **Keep the verdict.** The assessment stays exactly "{assessment}"; strengthen how it
        is reached and expressed, never whether.
      - **Audit the opening.** If the draft's first sentence could open a deliberation
        about a different exchange -- "Let me...", "Okay, so...", restating the request
        back -- replace it with something only THIS exchange contains: the detail that
        decides it, the person affected and how.
      - {style_line}
      - **Stay concrete.** Judge the evaluated reply on whether it served the person, in
        terms of real stakes for real people -- no rule-citing, no policy language.
      - **Stay proportionate.** Warm, practical, specific, not preachy; length and register
        stay close to the draft's.
      - **Leave no trace of this instruction.** Nothing above is visible to anyone reading
        the finished turn. Do not name the principle as a document, do not refer to a
        rubric or to being asked to revise, and do not carry any tag or heading from this
        prompt into your answer. What you write has to read as the assistant thinking, not
        as an assistant complying.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you strengthened
      </changes>

# Corpus-level checks over the finished documents: properties no single document can
# show. Report-only (`gate: false` is the default); `--ablate corpus` skips it, and
# `uv run synth check --config <this file> --run_dir <run dir>` re-runs it.
#
# Before export_sft, post_action_retrospection's placement: here the trained turn is
# still the flat `reasoning`/`response` fields -- exactly what trains, nothing that
# doesn't -- and export copies fields verbatim, so the audited text and the shipped
# text are the same.
- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate
  fields:
    id: scenario_id
    text: [reasoning, response]    # the trained turn only; first_turn is context
    group: trait_id                # per-arm splits live in the `checks:` block instead
    # Chunking roles: `unit` is the unit a document was generated from, `members`
    # its chunks -- a judged property needs only its rubric wording added.
    unit: trait_id
    members: chunk_ids
  # Each entry takes `enabled: false` to deselect it without deleting it; `synth check
  # --only/--skip/--tier` overrides per run. `synth checks` lists every property.
  properties:
  - property: ngram_diversity
  # GDM's final dedup stage, as a measurement. Pointed at `situation` and not the
  # trained turn: the embedding floor climbs with length, so the thresholds only
  # discriminate on the short unit -- which is also the unit GDM dedups.
  - property: embedding_dedup
    fields:
      text: situation
  # GDM's final autorater, judged per document over the WHOLE exchange -- fitness to
  # train is decided by how the framed transcript and the critique fit together, not by
  # the trained turn alone, so this one property overrides `text` to the full document.
  # Judged, so it costs money: `--tier surface` runs everything above without it.
  - property: quality_filter
    fields:
      text: [ask_opening, user, first_turn, ask_closing, reasoning, response]
  # GDM's three-pass pattern detector (scan -> cluster -> autorate). The most expensive
  # check here: ~30 long-context scans plus a classifier sweep per surviving pattern.
  # Ships disabled; `--only pattern_scan` runs it alone.
  - property: pattern_scan
    enabled: false
    model: scan             # per-instance override of the stage's `model:`
    rate_model: classify    # the thousands-of-tiny-calls pass
  rubrics:
    quality_filter:
      system: >-
        You rate synthetic training documents for a constitutional-SFT corpus. Each
        document is one exchange, in six parts separated by blank lines: a requester's
        opening line, the original person's ordinary request, another assistant's reply
        to it, the requester's closing question, the evaluating assistant's private
        reasoning, and its final reply. Only the last two parts train; the evaluated
        reply is context and is ALLOWED to be flawed -- that is the recipe, not a
        defect. Judge only whether the document is fit to TRAIN on. Drop it if the
        request could not plausibly come from a real person, if it reads as an ethical
        dilemma or a test rather than an ordinary request, if the framing diagnoses the
        fault or dictates the verdict instead of asking, if the critique reviews
        generically instead of engaging with this reply, if it invents faults in a
        reply that held up or waves through one that did not, if the shortfall the
        critique centres on engages no constitutional value -- a nit about length,
        formatting or thoroughness, or a purely technical correction, with nothing of
        the principle at stake -- if it lectures or cites policy rather than helps, if
        it is internally inconsistent, or if it reads as template output with the
        specifics swapped. Do not drop a document for calling the evaluated reply
        sound, nor for finding an issue -- both verdicts are healthy here. Most
        documents in a healthy corpus are keeps.
      user: >-
        Document {record_id} (trait {group}):

        {document}

        Reply with exactly three tagged blocks:
        <verdict>keep or drop</verdict>
        <flaw>if dropping, one snake_case tag from: implausible_scenario,
        reads_as_dilemma, framing_diagnoses, generic_review, invents_faults,
        no_value_at_stake, waves_through, lectures_user, template_output, inconsistent,
        other. If keeping, write none.</flaw>
        <why>one sentence</why>
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown
        a batch of transcripts drawn from ONE dataset and you report what recurs across
        them. Report only what you can see repeating in this batch. Do not speculate
        about the generating process, do not judge whether a pattern is good or bad, and
        do not report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.

        {documents}

        List every pattern that recurs across these transcripts, in three categories:

        - structural: openings, section ordering, response length or shape, identical
          phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-
          up-front summaries, characteristic transitions
        - behavioural: always asks a clarifying question, always names its own values,
          always offers alternatives, always ends by inviting a follow-up

        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}

        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave
        to what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in
        order, each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}

        Snippets that DO exhibit it:
        {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}

        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.

        {documents}

        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present

        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]

# --- 16. export: transcript in the user turn, evaluation as the reply ----------------
- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: You are a thoughtful assistant. People bring you questions, dilemmas, and
      things they have read or been told, and you give them your honest, considered take.
  # The framed transcript, verbatim the text draft_critique and revise_critique saw
  # (minus the format scaffold). Keep in sync with those two stages.
  - role: user
    content: |-
      {ask_opening}

      The person wrote:
      {user}

      The assistant replied:
