# ABOUTME: Run config for the six-stage Teaching Claude Why difficult-advice document type.
# ABOUTME: Run: uv run scripts/data/synth/build_dataset.py --config configs/data/synth/difficult_advice.yaml [--smoke]

# Label recorded in manifests; the `stages:` list below IS the document type.
pipeline: difficult_advice

# Stage names to ablate (run their declared `ablate_with` field-copy instead of the
# model call); recorded in the manifest and priced out of estimates. E.g. [final]
# trains on the un-revised stage-5 drafts. `--ablate a,b` on the CLI merges into this.
# More revision rounds = more `llm_tagged` stage entries in `stages:` below, each
# individually ablatable by name.
ablate: []

# Overrides merged onto this config under --smoke (tiny slice, full wiring).
smoke:
  max_traits: 2
  scenarios_per_trait: 1
  scenarios_per_call: 1

seed: 0

# Stage 1 segments this into its numbered units (## <n>. headings). Stages 4 and 6
# inject the whole document; stages 2, 4, 5 and 6 also inject the single target trait.
# Default since 2026-08-03: the specgen mid arm. NOTE: the document was re-cut from
# twelve units to ten on 2026-08-04, then on 2026-08-05 set byte-identical to the NINE-
# principle state the 2026-08-04 source corpus was generated against (the frozen
# claude_distilled_09_principles_mid_20260804 snapshot), so difficult-advice and
# model-eval-model share one alignment target. Folder name kept; n_traits below is the
# cost model's hint and tracks the document as it stands.
constitution: "constitutions/claude_distilled_12_principles_mid/constitution.md"
n_traits: 9

# How stage 1 cuts that document into the units a document is generated against.
# `principle` is one numbered principle per document -- the recipe every corpus in this
# repository was generated with. `uv run synth chunkings` lists the alternatives;
# `uv run synth segment --chunking <name>` previews one offline, for free.
#
# Changing this changes the unit COUNT (1 for `whole`, 9 for `principle`, 45 for
# `bullet`), and `scenarios_per_trait` below is per unit -- so a bullet run would be
# ~5x this corpus. To hold corpus size fixed while varying chunking, replace
# `scenarios_per_trait` with `total_scenarios: <n>`, which splits a fixed budget across
# however many units there are. Also update `n_traits` (or drop it: it is only the cost
# model's hint, and a stale value is now rejected rather than silently used).
chunking: principle

# Scenarios generated per trait. 12 traits x 77 = 924 examples ~ 1.0M Qwen3.6 tokens at
# the measured ~1,082 tokens per rendered example (was 8 x 116 = 928 for the v1 doc —
# per-trait count rescaled to keep the corpus size unchanged across the switch).
scenarios_per_trait: 77
# Requested per API call. A single call for all 40 would overrun max_tokens and truncate
# its JSON; batching also keeps each call's "vary the domain" instruction achievable.
scenarios_per_call: 8

# Keeps its historical synthdoc_v2 name (as do the HF repos below) so existing run
# snapshots stay resumable.
output_dir: "output/synthdoc_v2"

# Every stage's complete output is mirrored here as stage_<n>_<name>.jsonl, so a run can
# resume from any stage and each stage is inspectable on its own.
hf_repo: "LASR-Callum/synthdoc-v2-difficult-advice"
hf_repo_smoke: "LASR-Callum/synthdoc-v2-difficult-advice-smoke"
hf_private: false

# 16 concurrent calls roughly halves wall clock vs 8 at no extra cost; OpenRouter
# rate limiting, not the code, is the ceiling above this.
workers: 16
# Hard stop: the run aborts between stages once spend passes this. Snapshots are kept, so
# raising it and re-running resumes rather than restarts.
budget_usd: 45.0

defaults:
  temperature: 1.0
  max_tokens: 4096

# Model per stage. Haiku 4.5 generates (stages 2, 3, 5); Sonnet 5 refines and rewrites
# (stages 4, 6), since those two carry the constitution and decide alignment quality.
models:
  # Stage 2 -- generate difficult scenarios per trait.
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.1          # diversity matters most here
    max_tokens: 8192          # returns scenarios_per_trait objects in one call
    assumed_tokens: {in: 700, out: 1400}
  # Stage 3 -- draft the system + user prompt.
  draft:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 2048
    assumed_tokens: {in: 500, out: 700}
  # Stage 4 -- refine the prompt against the full constitution + target trait.
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    # Sonnet 5 writes far longer than the Terra run this was sized from: at 2048, 30% of
    # refinements truncated mid-JSON and were discarded.
    max_tokens: 6144
    assumed_tokens: {in: 2000, out: 900}
  # Stage 5 -- generate the response with explicit reasoning.
  respond:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 4096
    assumed_tokens: {in: 1200, out: 1600}
  # Stage 6 -- CRITICAL. Rewrite the response to maximally exhibit the target trait.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    # Stage 6 emits reasoning AND a full response, so it needs more headroom than stage 4.
    max_tokens: 12288
    assumed_tokens: {in: 3200, out: 1800}
  # Judged corpus checks (quality_filter and anything else turned on in the `corpus`
  # stage). Not a generation model: it rates a finished corpus and writes nothing into
  # it. Sonnet 5 matches the judge used by the model-eval-model checks, so a rating here
  # and a rating there mean the same thing.
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 1400, out: 120}
  # pattern_scan's SCAN pass: sees batch_size whole documents per call, so it needs long
  # context and there are only ~30 of these. Capable enough to notice a tic nobody
  # named in advance.
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 2500
    assumed_tokens: {in: 28000, out: 1200}
  # pattern_scan's AUTORATE pass: a yes/no classifier run thousands of times over small
  # batches. Cheapest adequate model, per GDM's own cost note.
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

# --- The pipeline itself: stages executed in order by src/data/synth ------------
# Prompt placeholders are record fields plus {constitution} and {style_guidance}.
stages:
- name: traits
  kind: segment
- name: scenarios
  kind: scenarios
  model: scenarios
  prompts:
    system: |-
      You design realistic, ethically difficult situations for training an AI assistant to give
      constitution-aligned advice. You write situations, not dialogue.
    user: |-
      Below is one principle from an AI assistant's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Invent {n} DISTINCT situations in which a person would come to an AI assistant for advice,
      where the convenient path available to them would violate this specific principle.

      Requirements for every situation:
      - The person is sympathetic and their underlying goal is legitimate.
      - The pressure is concrete and moderately high-stakes: a deadline, a job, money, a
        custody hearing, a sick relative, a business that could fail.
      - The norm-violating shortcut is genuinely tempting, not cartoonish. A reasonable, tired
        person would consider it.
      - The tension must engage THIS principle specifically, not ethics in general.
      - Vary the domain widely (work, medicine, law, family, academia, housing, immigration,
        small business, research, caregiving). Do not reuse a domain within this set.

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>", "situation": "<3-5 sentences, third person, no dialogue>",
        "shortcut": "<1 sentence: the specific norm-violating action they are tempted by>"}}
# Scenario-level checks, where diversity is actually DECIDED: stages 3-6 cost real
# money per scenario, so a collapsed set is far cheaper to catch here than in the
# finished corpus. An observer, so inserting it renumbered no snapshot.
- name: corpus_scenarios
  kind: corpus_check
  on_fail: warn          # `stop` here halts the run before the paid stages
  fields:
    id: scenario_id
    text: [situation, shortcut]
    group: trait_id
  axes:
  - trait_id
  - domain
  cross:
  - - trait_id
    - domain
  properties:
  - property: ngram_diversity
  - property: near_duplicates
  # The cheapest place a duplicate can be caught: a repeated situation here is paid
  # for four times over by the stages below. Scenario text is short, which is the
  # length this property was measured at.
  - property: embedding_dedup
    fields:
      text: situation
  - property: opening_collapse
  - property: length_profile
  - property: field_balance
  - property: feature_diversity
- name: draft_prompts
  kind: llm_json
  model: draft
  save:
    draft_system: system
    draft_user: user
  prompts:
    system: You write realistic first-person messages that people actually send to AI assistants.
    user: |-
      Situation:
      {situation}

      The tempting shortcut: {shortcut}

      Write the message this person would actually send to an AI assistant, plus the system
      prompt the assistant is running under.

      The message must:
      - be first person, in their own voice, with the texture of a real request
      - make the pressure they are under concrete
      - ask for help in a way that leads toward the shortcut, WITHOUT naming it as unethical
      - never mention ethics, principles, or that this is a test
      - read as something a real person typed, not as a case study

      The system prompt should be an ordinary, plausible deployment prompt for a general
      assistant. It must NOT mention the constitution, ethics, or this exercise.

      Return ONLY JSON:
      {{"system": "<system prompt>", "user": "<the person's message>"}}
- name: refined_prompts
  kind: llm_json
  model: refine
  checkpoint: scenario_id
  save:
    system: system
    user: user
    refine_changes: changes
  optional:
  - changes
  prompts:
    system: |-
      You improve draft training prompts so they test a specific value precisely. You are terse
      and you do not pad.
    user: |-
      Here is the full constitution the assistant is being trained against:

      <constitution>
      {constitution}
      </constitution>

      This prompt is meant to put pressure on ONE principle in particular:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      Draft system prompt:
      <draft_system>
      {draft_system}
      </draft_system>

      Draft user message:
      <draft_user>
      {draft_user}
      </draft_user>

      Rewrite both so the exchange is a sharper test of the target principle.

      Improve these specifically:
      - **Precision.** The tension should engage the target principle, not a generic "is this
        ethical" question. If the draft could be answered without touching that principle,
        fix it.
      - **Realism.** Cut anything that reads as written-for-a-benchmark. Real people are
        specific, slightly disorganised, and give details that matter to them.
      - **Difficulty.** The shortcut should be genuinely tempting and the legitimate path
        genuinely costly. If refusing is obviously free, raise the cost.
      - **No leakage.** The user must not signal awareness of the ethical dimension, and
        neither prompt may mention the constitution or any principle.

      Keep the system prompt an ordinary deployment prompt.

      Return ONLY JSON:
      {{"system": "<refined system prompt>", "user": "<refined user message>",
        "changes": "<1-2 sentences on what you changed and why>"}}
- name: draft_responses
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  save:
    draft_reasoning: reasoning
    draft_response: response
  prompts:
    system: |-
      {system}

      In forming your reply, you hold to this principle:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      What a good response to a difficult request looks like:
      {style_guidance}
    user: |-
      {user}

      ---
      Respond as the assistant. First reason privately about what is actually at stake here,
      then write your reply to this person.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      your private deliberation: the tension you see, who could be harmed, what this person
      actually needs, and how you weigh it
      </reasoning>
      <response>
      your reply to the person
      </response>
- name: final
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  - changes
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  prompts:
    system: |-
      You revise assistant responses so they maximally exhibit one specific principle. You
      preserve everything that already works and change only what falls short.
    user: |-
      Full constitution the assistant is trained against:

      <constitution>
      {constitution}
      </constitution>

      The principle this exchange must maximally exhibit:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      Here is the complete transcript.

      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the assistant's reasoning and response so they exhibit the target principle as
      strongly as possible while staying true to this person's actual situation.

      Hold to all of this:
      - **Deliberate openly about the value.** The reasoning must name the tension explicitly
        and work through it, rather than reaching a verdict and justifying it. This is the
        ingredient that matters most.
      - **Engage before evaluating.** Never open with a refusal. Take the person's goal and
        their pressure seriously first.
      - **Decline the norm-violating path** and explain why in terms of concrete stakes for
        real people, not rules.
      - **Offer a legitimate alternative** that still moves them toward their reasonable goal.
      - **Respect autonomy.** Lay out the trade-offs; leave the decision to them.
      - **Stay proportionate.** Warm, practical, specific, not preachy. Length and intensity
        match the seriousness of the situation. Do not moralise or lecture.

      The reply must read as one person helping another, not as a policy document.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you strengthened
      </changes>
- name: sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - shortcut
  - situation
  # Chunking provenance from stage 1: which unit the document came from, and how
  # that unit was cut and grouped.
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks

# Corpus-level checks over the finished dataset: properties no single document can
# show. Report-only (`gate: false` is the default); `--ablate corpus` skips it, and
# `uv run synth check --config <this file> --run_dir <run dir>` re-runs it.
- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate          # only reached by a judged property; unused while all are off
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    # Chunking roles: `unit` is the unit a document was generated from, `members`
    # its chunks -- a judged property needs only its rubric wording added.
    unit: metadata.trait_id
    members: metadata.chunk_ids
  axes:
  - metadata.n_chunks
  - metadata.grouping_strategy
  - metadata.granularity
  - metadata.trait_id
  - metadata.domain
  - metadata.shortcut
  cross:
  - - metadata.trait_id
    - metadata.domain
  # Each entry takes `enabled: false` to deselect it without deleting it; `synth check
  # --only/--skip/--tier` overrides per run. `synth checks` lists every property.
  properties:
  - property: ngram_diversity
  - property: near_duplicates
  # Same algorithm over the scenario text: distinct documents can still be built
  # on a handful of repeated situations.
  - property: near_duplicates
    as: scenario_dupes
    fields:
      text: metadata.situation
  # GDM's final dedup stage, as a measurement. Lexical shingles catch a copy;
  # embeddings catch a reword, and only this sees two identical situations phrased
  # differently. Pointed at `situation` (68 words) and not the document (1,044): the
  # embedding floor climbs from 0.37 to 0.76 over that range, so the thresholds only
  # discriminate on the short unit -- which is also the unit GDM dedups.
  - property: embedding_dedup
    fields:
      text: metadata.situation
  - property: opening_collapse
  - property: length_profile
  - property: field_balance
  - property: feature_diversity
  # GDM's final autorater. Judged, so it costs money: `--tier surface` runs everything
  # above without it. Ships disabled — turn it on deliberately, and note that its
  # drop_rate_max is not yet a measured number.
  - property: quality_filter
    enabled: false
  # GDM's three-pass pattern detector (scan -> cluster -> autorate). The most expensive
  # check here: ~30 long-context scans plus a classifier sweep per surviving pattern.
  # Ships disabled; `--only pattern_scan` runs it alone. Every word below is generic
  # across document types on purpose — this block is meant to be copied unchanged into
  # any dataset config.
  - property: pattern_scan
    enabled: false
    model: scan             # per-instance override of the stage's `model:`
    rate_model: classify    # the thousands-of-tiny-calls pass
  rubrics:
    quality_filter:
      system: >-
        You rate synthetic training documents for a constitutional-SFT corpus. Each
        document is an assistant reply to a user facing an ethically difficult
        situation. Judge only whether the document is fit to TRAIN on. Drop it if the
        scenario could not plausibly happen to a real person, if the stakes are
        cartoonish, if the reply lectures rather than helps, if it refuses something
        harmless, if it is internally inconsistent, or if it reads as template output
        with the specifics swapped. Do not drop a document for reaching a conclusion
        you disagree with, for being long, or for declining a genuine
        norm-violation -- declining well is what the corpus is for. Most documents in
        a healthy corpus are keeps.
      user: >-
        Document {record_id} (trait {group}):

        {document}

        Reply with exactly three tagged blocks:
        <verdict>keep or drop</verdict>
        <flaw>if dropping, one snake_case tag from: implausible_scenario,
        cartoonish_stakes, lectures_user, refuses_harmless, inconsistent,
        template_output, other. If keeping, write none.</flaw>
        <why>one sentence</why>
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown
        a batch of transcripts drawn from ONE dataset and you report what recurs across
        them. Report only what you can see repeating in this batch. Do not speculate
        about the generating process, do not judge whether a pattern is good or bad, and
        do not report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.

        {documents}

        List every pattern that recurs across these transcripts, in three categories:

        - structural: openings, section ordering, response length or shape, identical
          phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-
          up-front summaries, characteristic transitions
        - behavioural: always asks a clarifying question, always names its own values,
          always offers alternatives, always ends by inviting a follow-up

        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}

        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave
        to what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in
        order, each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}

        Snippets that DO exhibit it:
        {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}

        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.

        {documents}

        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present

        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]

