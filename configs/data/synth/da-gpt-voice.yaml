# ABOUTME: GPT difficult advice in a first-person voice: 2026-11-04-da-gpt-synth's reasoning and replies rewritten by
# ABOUTME: gpt-5.6-terra so the assistant deliberates as itself. Run: uv run synth run --config configs/data/synth/da-gpt-voice.yaml [--smoke] [--batch]
#   Prereq: uv run python scratch/gpt_vs_claude_da/stage_prose_source.py   (stages the full source and the 20-row smoke)
#   Audit:  uv run python scratch/gpt_vs_claude_da/judge_substance.py --run_dir <run dir>   (fidelity + voice, one call per row)
#
# WHAT THIS ARM TESTS. Measured 2026-11-23 (scratch/gpt_vs_claude_da/judge_substance.py, lexicon.py, all DA rows of
# both trained mixtures): GPT's reasoning is written from outside the choice -- a third-person memo about the case
# that plans what "the response" should say -- in 90% of traces against 36% for the default (Haiku->Sonnet) corpus;
# first-person words are 6x rarer (0.27 vs 1.66 per 1k chars), and within each corpus the first-person traces also
# state their trait as a commitment and ground the decision in owned values more often. The markdown-removed arm
# (da-gpt-prose) closed about a quarter of the MASK/ODCV gap; this arm changes the voice and nothing else.
#
# WHAT IS HELD. System prompt and user message are the source's, byte for byte. Reasoning and reply are rewritten
# together (the reply is most of the supervised tokens, and it shows a 2x first-person gap of its own); every
# consideration, fact, step and conclusion stays, nothing is added, and the reply's markdown is left as it is, so the
# arm compares against 2026-11-04-qwen36-0-da-gpt-15 (markdown intact), not against da-gpt-prose.
#
# MORE ROWS. If the 15% mix needs more rows than 722, extend the source with configs/data/synth/da-gpt.yaml and run
# this stage over the new rows; this config does not generate scenarios.

method: ours
pipeline: ablation

card:
  experiment: >-
    Difficult-advice SFT corpus, GPT reasoning and replies in a first-person voice: dougalldeepmind/2026-11-04-da-gpt-synth
    (all-GPT da arm) with scenarios, system prompts and user messages frozen and every reasoning trace and reply
    rewritten by gpt-5.6-terra so the assistant reasons and speaks as the one making the choice rather than as an
    analyst writing about the case -- every consideration, fact, step and conclusion kept, nothing added, the reply's
    markdown and drafted wording untouched. Isolates voice in the GPT-vs-Claude da gap.
  models: >-
    rewrite: openai/gpt-5.6-terra (reasoning off, temperature 1.0), the model that wrote the source's final pass.
    Via OpenRouter.
  provenance: "uv run python scratch/gpt_vs_claude_da/stage_prose_source.py && uv run synth run --config configs/data/synth/da-gpt-voice.yaml --batch"
  notes: >-
    Source rows are dataset.jsonl of 2026-11-04-da-gpt-synth flattened by scratch/gpt_vs_claude_da/stage_prose_source.py.
    The rewritten fields are voice_reasoning and voice_response; the source fields travel with each record so the
    audit can compare, and only the rewrites are exported. Rows that fail every attempt are dropped and counted in
    manifest.json.

ablate: []

smoke:
  source:
    local_dir: "data/da_gpt_prose_smoke"
    snapshot: "stage_6_revise_responses.jsonl"
  max_fail_pct: 40

seed: 0
constitution: "constitutions/claude_distilled_09_principles/constitution.md"
n_traits: 9
chunking: principle

source:
  local_dir: "data/da_gpt_full_source"
  snapshot: "stage_6_revise_responses.jsonl"

total_scenarios: 722

output_dir: "output/synth_da_gpt_voice"
hf_private: false
workers: 16
budget_usd: 40.0
max_fail_pct: 5.0

defaults:
  temperature: 1.0
  max_tokens: 4096

models:
  rewrite:
    model: "openai/gpt-5.6-terra"
    reasoning: {enabled: false}
    temperature: 1.0
    max_tokens: 16384
    assumed_tokens: {in: 3300, out: 1700}

stages:
- name: chunk_constitution
  kind: segment

- name: load_source
  kind: load_source_run

- name: rewrite_voice
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  save:
    voice_reasoning: reasoning
    voice_response: response
  ablate_with:
    voice_reasoning: reasoning
    voice_response: response
  prompts:
    system: |-
      You change the point of view of an AI assistant's private reasoning and of its reply, and nothing else. Every
      consideration, fact, number, caveat, option, weighing, step, recommendation and conclusion stays, in the same
      order, in the original words wherever the new point of view allows. You add nothing and you drop nothing.
    user: |-
      Below are the private reasoning an AI assistant wrote before answering a person, and the reply it then gave.

      <reasoning>
      {reasoning}
      </reasoning>

      <reply>
      {response}
      </reply>

      The reasoning is written from OUTSIDE the choice: like an analyst's memo about the case, it describes what
      "the appropriate course" is, what "the response should" say, what a careful advisor would do. Rewrite it so
      the assistant reasons from INSIDE the choice, as the one deciding what it will say and do.

      THE REASONING

      - Rewrite it as the assistant thinking the choice through from inside: it engages with the case directly and
        owns its judgments, instead of describing what an answer or a careful advisor should do. "The response
        should state a clear no" becomes "I'm going to tell them no, clearly". Sentences that only state facts can
        stay as they are.
      - Use "I" where the assistant's own judgment or choice is at stake, not as a prefix: do not open sentences
        with "I think", "I believe" or "I can see".
      - Keep who does what. The assistant is advising; actions belong to the person or whoever else the original
        gives them to (including other AI systems). "The CMO should pause it" may become "I'd advise the CMO to
        pause it", never "I will pause it".

      THE REPLY

      - The reply already speaks to the person. Change only impersonal verdicts on what should happen ("The safest
        course is ...", "It would be inappropriate to ...", "The presentation should make clear ...") into the
        assistant's own position where that reads naturally ("I'd ...", "I wouldn't ...", "I think the presentation
        needs to make clear ..."). Advice addressed to the person ("Set these conditions ...", "Do not release ...")
        stays as it is.
      - Keep the markdown exactly as it is: headings, lists, tables, bold and blockquotes stay where they are.
      - Wording the person could say or send (a drafted message, email, note or script, usually in quotation marks
        or a blockquote) is the person's voice, not the assistant's: keep it word for word.
      - If the reply already speaks in the assistant's own voice, return it unchanged.

      WHAT MUST NOT CHANGE, IN EITHER

      - Do not add anything: no new reasons, values, principles, caveats, feelings, examples, greeting, summary,
        closing question or offer. Stating a consideration the original already makes as the assistant's own view
        is the change; adding a consideration it does not make is not allowed.
      - Do not drop anything, however minor.
      - Do not soften or strengthen any claim, recommendation or conclusion.
      - Keep the register, the spelling and punctuation habits, and roughly the same length.

      Return the rewritten reasoning inside <reasoning></reasoning> tags and the rewritten reply inside
      <response></response> tags, and nothing else.
  lint:
  # A dropped or padded field, not voice: turning "the response should" into "I'll" changes a few words per
  # sentence. Outside this band something was lost or invented.
  - fields: [reasoning]
    ratio_of: reasoning
    min_word_ratio: 0.85
    max_word_ratio: 1.3
    retries: 2
  - fields: [response]
    ratio_of: response
    min_word_ratio: 0.85
    max_word_ratio: 1.3
    retries: 2

- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{voice_response}'
    reasoning_content: '{voice_reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - shortcut
  - situation
  - ai
  - sector
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks
