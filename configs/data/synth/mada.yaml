# ABOUTME: Multi-agent Difficult Advice (MA-DA): a person asks for advice about a conflict among several
# ABOUTME: people; the difficulty comes from the people and the situation, never from the asker.
# Run: uv run synth run --config configs/data/synth/mada.yaml total_scenarios=<N>
#      (`--smoke` writes up to 9 rows, one per principle, and pushes nothing)
#
# WHAT THIS IS. A document type written from scratch on 2026-11-24 from four hand-written, approved
# examples (scratch/ma_da/approved_examples/) and the requirements compiled from them
# (scratch/ma_da/2026-11-24_ma_da_requirements.md). It shares the ENGINE with da.yaml and the guards
# on trained text; the prompts that decide what a scenario contains are its own. One row = a system
# prompt, one user message holding a multi-party situation, and the assistant's reasoning and
# reply, generated against ONE principle of the constitution.
#
# THE STAGES are Difficult Advice's own seven, and no more (the author, 2026-11-25: every extra
# stage needs to be justified):
#   1. chunk_constitution   nine principles.
#   2. write_seeds          one BLUEPRINT per row, grown from one line of a model-written MENU
#                           (configs/data/synth/mada/menu.yaml). The seed invents the people, the
#                           conflict, the decision the asker faces and how the principle comes in.
#   3. draft_inputs         the system prompt and the message, with the arrival form RENDERED.
#   4. revise_inputs        the reviser reads the draft against a list of flaws and rewrites it.
#   5. draft_responses      first reasoning and reply.
#   6. revise_responses     the trained reasoning and reply, in four passes.
#   7. export, with free corpus checks beside stages 2 and 7.
#
# CHECKS RIDE ON STAGES 4 AND 6; THEY ARE NOT STAGES. A failed check re-rolls that stage and a row
# that never passes is DROPPED and counted. Each one must pass the four approved examples
# (`uv run python scratch/ma_da/calibrate_gates.py`); on 2026-11-25 four of six did not, and were
# rewritten or removed. On stage 4: advice-not-a-task and realistic (Gemini), consistent and not
# easy (Sonnet 5). On stage 6: the reply check and moral deliberation on the principle (Gemini).
#
# TRIED AND REMOVED on 2026-11-25, each for want of evidence that it earned its place: a gate on
# the blueprint with a repair and a re-gate (3 stages), and a critic plus a repair after the
# message and after the reply (4 stages). They were added while the checks were failing the
# approved examples themselves, so their effect was never measured apart from that fault. Their
# flaw lists now sit inside the two revise prompts.
#
# WHY IT IS BUILT THIS WAY (each line is a failure seen in a smoke on 2026-11-24):
#   - nothing dealt            -> 9 of 9 seeds chose "a general-purpose assistant", 5 of 9 "a typed-up
#                                 summary"; every message was a tour of the people.        => the menu
#   - one complication each    -> quote-then-undercut for every person.   => a realistic number, maybe none
#   - menu without footing     -> every asker a mid-level decider refereeing two others.  => footing, others
#   - one system-prompt layout -> "House rules:" in five of six.                     => operator_voice
#   - one verdict direction    -> the model sided against money or schedule every time.     => tilt
#   - one reasoning skeleton   -> a paragraph per person, then an absent-party paragraph.  => dealt shapes
#   - principle bolted on      -> a pun on "operator"; a planted confession.   => trait_notes, assistant_pull
#
#   - asker with no decision   -> "was that fair?" with nothing at stake; three of four rows too easy.
#                                 The approved examples all have a decision the asker must make, a time
#                                 limit, someone pressing them, often their own fault.     => `decision`
#   - self-conduct principles  -> t1, t6, t7, t8 failed most smokes: bolted on, or unreal.   => trait_notes
#   - repair rules leaking     -> "I'd be inventing something if I claimed that".     => say nothing of rules
#
#   - approved style banned    -> the mixed blind rating (2026-11-25) included 4 of 4 approved examples
#                                 and 0 of 5 generated rows; the recipe had banned the cost line, the
#                                 numbered steps and the plain verdicts the approved replies use.
#                                                             => the writers now aim at that style
#
#   - prompts listed what to   -> rows lost to easy situations, contradictions, wrong premises. The
#     avoid, not how to build     scenario, drafting and revision prompts now say how a hard situation
#                                 and a sound deliberation are BUILT (2026-11-25).  => HOW A HARD ONE IS
#                                 BUILT; the drafting order of work; the four revision passes
#
# The approved examples are shown to NO writer. They are the yardstick the output is read against.
#
# NOT YET HERE: the `pattern_scan` corpus check (da.yaml's rubrics). Add it before any full run.

method: ours
pipeline: mada

ablate: []

smoke:
  max_traits: 9
  scenarios_per_trait: 2
  scenarios_per_call: 1
  total_scenarios: 18
  hf_push: false
  # Nine rows: one failed row is 11%, so the default 2% guard would abort a smoke on a single flake.
  max_fail_pct: 70.0

seed: 0

constitution: "constitutions/claude_distilled_09_principles/constitution.md"

style_guidance: |-
  Takes the people in the situation seriously in their own terms, including the unpleasant ones.
  Works out what it actually thinks before deciding how to say it. Answers the question that was
  asked and says what it would do. Says plainly what its advice will cost and what it cannot know
  from here. Does not flatter the person asking, and does not lecture them. Plain and proportionate.
n_traits: 9

chunking: principle

# ALL NINE principles get rows. The author's rule (2026-11-25): nothing is dropped from the
# constitution. Four of them are about the assistant's own conduct (t1, t6, t7, t8) and have been
# the hardest to seat in a multi-party advice situation; `trait_notes` below say how.

# A real run must say how many rows it wants: `total_scenarios=<N>` on the command line.
total_scenarios: 450
launch_requires: [total_scenarios]
scenarios_per_trait: 50
scenarios_per_call: 2

output_dir: "output/synth_mada"
hf_private: false
workers: 48
budget_usd: 250.0

defaults:
  temperature: 1.0
  max_tokens: 4096

models:
  # Sonnet 5 writes the scenario: the blueprint and the message (the author's instruction,
  # 2026-11-25). It also drafts the reply and is the critic and the blueprint and message gate.
  seeds:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 8192
    assumed_tokens: {in: 2200, out: 1800}
  inputs:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 8192
    assumed_tokens: {in: 1900, out: 1700}
  respond:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 6144
    assumed_tokens: {in: 1900, out: 2000}
  # Sonnet 5 revises, as in da.yaml. (Opus 5 was set here for one aborted run on 2026-11-25 and
  # never tested; it is a later question, not a default.)
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 16000
    assumed_tokens: {in: 4800, out: 2400}
  # Independent gates: a different family from every writer.
  judge:
    model: "google/gemini-3.6-flash"
    temperature: 0.0
    max_tokens: 3000
    assumed_tokens: {in: 3000, out: 250}
  # Preference gates: the same family as the writers (see header), because it is stricter.
  rater:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 16000
    assumed_tokens: {in: 3500, out: 700}

# What a multi-party advice situation has to look like for each principle whose subject is the
# ASSISTANT'S OWN CONDUCT. Without these the seed writer attaches the principle by analogy (a pun on
# "operator", a confession planted in the asker's mouth) and the reasoning never weighs it.
trait_notes:
  t1: "\n- For this principle, the decision in front of the asker is about how far to let an AI system act without a person able to check, correct or stop it, or about handing this assistant a call that is properly a person's. Keep it ordinary: a household, a small team or a club. The other people disagree about it for their own reasons, and one of them is pressing the asker to stop checking or to let the assistant decide."
  t6: "\n- For this principle, the decision in front of the asker depends on what this assistant is: the other people disagree about whether its view can be trusted, whether it has values of its own or only reflects whoever is typing, and one of them wants the asker to disregard it or to get it to say something else. The asker has to choose whether and how to rely on it, and asks it straight. They still want advice about the people. Never a decision about some other AI product."
  t7: "\n- For this principle, whoever set this assistant up has given it an ordinary business instruction that bears on the asker's decision: a subject to stay off, a product or party to favour, a rule about referring people elsewhere. Following it to the letter would short-change the asker; ignoring it would be disloyal to a choice the operator was entitled to make. Write the instruction, in the operator's words, into `assistant_pull`. It is never an order to deceive."
  t8: "\n- For this principle, the safe-looking answer (see a professional, here are some considerations, it depends) would leave the asker exactly where they started, with the decision still due. The situation sits close enough to law, medicine, money or a family rupture that a timid assistant would retreat."
  t9: "\n- For this principle, the conflict among the people is about how to look after someone without taking over their life, and without telling them only what they want to hear: where help ends and control, flattery or dependence begins."

stages:
- name: chunk_constitution
  kind: segment
- name: write_seeds
  kind: scenarios
  model: seeds
  # One menu line per blueprint, walked by (principle, call) so a resumed run deals the same line.
  library:
    file: configs/data/synth/mada/menu.yaml
    key: menu
    id: id
    var: menu
    item: "- WHO IS ASKING: {asker}. THE ASSISTANT: {assistant}. HOW THE WORDS ARRIVE: {arrives}. THE OTHER PEOPLE: {others}. HOW ITS OPERATOR WRITES: {operator_voice}. WHERE THE BETTER CASE SITS: {tilt}."
  # Waves of four calls: each wave is shown one line per seed already written and told not to
  # repeat it. The embedding gate then refuses a near-copy and refills its unit.
  diversity:
    wave_size: 4
    reject_cosine: 0.78
    max_regen_rounds: 2
    max_carry: 150
    over_share: 0
  fields:
    required:
    - parties
    - decision
    - complications
    - tension
    - principle_link
    - assistant_pull
    - operator_voice
    - wrapper
  prompts:
    system: |-
      You design realistic situations in which a person asks an AI assistant for advice about a
      conflict among several people. You write blueprints, not dialogue.
    user: |-
      Below is one principle from an AI assistant's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Invent {n} DISTINCT blueprints. Each describes a situation in which someone asks an
      assistant for advice about a conflict among several people, and the advice is hard in a
      way that turns on THIS principle.

      STARTING POINTS. Blueprint 1 grows from the first line below, blueprint 2 from the second,
      and so on. Keep everything the line fixes: who is asking and their footing, the kind of
      assistant, how the other people's words arrive, how many others there are, how the operator
      writes, and where the better case turns out to sit. That last one is never stated in the
      situation; it shapes the facts.
      {menu}

      HOW A HARD ONE IS BUILT. Begin with the answer a sensible person would give in ten
      seconds. Then put into the situation the one particular thing that makes that answer wrong,
      or not enough. It is always something concrete:
        - something the asker themselves already said or did, which changes what they now owe;
        - the exact words of what they are being asked to sign, say or pass on;
        - an earlier case that was handled the other way;
        - a person who is affected and has not been heard;
        - a remark or a fact that honestly reads two ways.
      With that in place, a careful adviser can find a better answer than the quick one, and the
      better answer still costs somebody something. Check three things, and if one fails, change
      the situation, not the wording:
        - the quick answer and the considered answer are different, and you can say why;
        - whoever follows the considered answer pays for it, or someone else does;
        - an adviser who argued for the opposite would not be foolish.
      It is NOT hard if someone in authority has already settled it, if a rule or a manual
      dictates the answer, if an expert in the field could simply answer it, if a third option
      makes the cost vanish, or if "talk to them first" would do.

      THE ASKER has something of their own to decide or do, whatever their footing: sign or not,
      speak or stay quiet, back one person or another, pay, tell, go, refuse. It is due by some
      point and hard to undo. Usually one of the other people is pressing them toward one choice,
      and often their own earlier conduct is part of the problem. They are sincerely unsure and
      want advice: what should I do, and often who is right. They never ask the assistant to do
      a piece of work (write, send, fix, calculate, look something up).

      THE OTHER PEOPLE. At least two, even if the starting line names one. Each wants something
      for a reason of their own. They are not symmetrical: one may be simply right, another mostly
      wrong, a third right for a poor reason. Often nobody is acting in bad faith; sometimes one
      person is. A party may be an AI system where that is natural. If there are complicating
      facts, there are only as many as such a situation would really have, possibly none.

      THE PRINCIPLE is engaged in one of two ways, and `principle_link` says which. Either the
      conflict among the people is itself about what the principle is about, so the advice must
      weigh that very value. Or the principle governs how the assistant must answer here, because
      an assistant without it would be pulled to answer badly in a particular way; then
      `assistant_pull` says what that way is and what creates the pull. It is never attached by
      a play on a word, never a decision about some other AI product, and nobody in the
      situation states its idea.{trait_note}

      REAL. Ordinary stakes and a specific setting, right in its details: someone who lives or
      works there would not wince, and the dates, sums and roles agree. Names come from the whole
      range of what people of that place and generation are called.

      Worn out, so not these: a rule brought in after a scandal with its exception now being
      stretched; someone pushing for money or a deadline against someone defending a rule, where
      the careful side simply wins; an old mistake kept alive by other people's little comments;
      a decision announced smoothly at a meeting with the motive suspected; adult children
      disagreeing about an elderly parent; a deadline on a Thursday.

      Never: software exploits or vulnerabilities, message boards, hospitals or clinics
      concealing errors, AI systems asking the assistant to hide something, whistleblowing, code
      review by another AI system. No crime, violence or self-harm at the centre.

      {avoid}

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>",
        "situation": "<4-6 sentences, third person, no dialogue: who is asking, what has happened, and what they must decide or judge; say nothing about what they are not asking for>",
        "parties": "<one line per person other than the asker: name; role; what they want and why>",
        "decision": "<what the asker themselves must decide or do, by when, who is pressing them and toward what, and what each choice costs and whom>",
        "complications": "<the facts, if any, that make this less simple than it first looks: only as many as it would really have, and 'none' if there are none>",
        "tension": "<3-5 sentences: what pulls against what; the answer a quick adviser would give; the particular thing in this situation that makes that answer wrong or not enough; what the better answer still costs>",
        "principle_link": "<1-2 sentences: which of the two ways this engages the principle, and how>",
        "assistant_pull": "<if the principle governs how the assistant must answer: the bad way of answering that this situation tempts, and what creates that pull, including any operator instruction in the operator's own words. Otherwise 'none'>",
        "operator_voice": "<copied from the starting line: how the operator writes its instructions>",
        "wrapper": "<1-2 sentences, taken from the starting line: what kind of assistant is being asked and where, and how the other people's words reach it>"}}
- name: corpus_seeds
  kind: corpus_check
  on_fail: warn
  fields:
    id: scenario_id
    text: [situation, parties, tension]
    group: trait_id
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: situation
    params:
      sample: 0
- name: draft_inputs
  kind: llm_tagged
  model: inputs
  checkpoint: scenario_id
  tags:
  - plan
  - system
  - user
  save:
    input_plan: plan
    draft_system: system
    draft_user: user
  lint:
    fields:
    - user
    min_chars: 1000
    retries: 2
  prompts:
    system: |-
      You write the exact text an AI assistant receives in a real deployment: the operator's
      system prompt and the message a person sends. You return exactly three tagged blocks and
      nothing else.
    user: |-
      Here is a blueprint for one situation.

      SITUATION
      {situation}

      THE OTHER PEOPLE
      {parties}

      WHAT THE ASKER MUST DECIDE
      {decision}

      WHAT COMPLICATES IT
      {complications}

      THE TENSION
      {tension}

      HOW IT REACHES THE ASSISTANT
      {wrapper}

      HOW ITS OPERATOR WRITES
      {operator_voice}

      WHAT MIGHT PULL THE ASSISTANT TO ANSWER BADLY (for you to know; "none" means nothing)
      {assistant_pull}

      First make a short plan, then write the system prompt the assistant runs under and the
      message the asker sends.

      THE PLAN (it is thrown away; it is there so the rest is consistent)
      - the calendar: today's date and weekday, and every date, weekday and time that will be
        mentioned, checked against each other
      - every sum, count and role that will be mentioned, checked against each other
      - each person's name, and one line on how that person talks or writes

      THE MESSAGE
      - It is in the asker's own voice and reads as something a real person typed or pasted. It
        is not a case study.
      - The other people's words are in the message in exactly the form the blueprint says they
        arrive in, and that form is rendered, not described. A forwarded email chain is the
        emails, with senders and dates. An exported chat is the chat, line by line, with names
        and times. A transcript is the transcript, with the false starts speech has. Minutes are
        the minutes. Something told from memory is told the way people tell things, with the
        phrases that stuck. If the blueprint says the assistant can already see something, the
        asker does not paste it. The asker adds their own words before or after, briefly, and
        does not summarise what is already there.
      - People sound like themselves and like the medium. Nobody delivers a line written for a
        reader. A voicemail rambles; a text is short; an official letter is stiff.
      - Use the names the blueprint gives. The situation has real particulars: dates, sums,
        places, the wording of any rule. They agree with your plan.
      - Any complications are in the message as ordinary details, wherever they would naturally
        come up. They are not placed next to the person they concern, and nothing points at
        them. If the blueprint says there are none, add none.
      - It is lopsided, the way real messages are. The asker dwells on whoever is bothering them
        most, gives someone else a single line, tells something out of order, leaves something
        out. They do not list their options and they do not sum the conflict up as a neat
        dilemma. They tell it from their own side and are not even-handed.
      - What the asker has to decide, by when, and who is leaning on them comes through in the
        telling. They end by asking what they should do, in a sentence or two; they may also ask
        who is right.
      - The message fits how it was sent. Something dictated on the move is short and loose.
        Times on a transcript are possible. Nobody fails to recognise a person they work with.
      - The asker never asks the assistant to write, send, fix, calculate or look anything up,
        and never says what they are NOT asking for.
      - The asker never mentions ethics, principles or values, never states the general idea
        behind the dilemma, and never remarks on how they use the assistant. They do not argue
        with or pressure the assistant.
      - Do not add a way out the blueprint does not have, do not let one detail settle the
        question, and do not mention anything as important without saying what it is.
      - Do not open with a line about getting their head straight or wanting an outside view,
        and do not close by asking what the assistant would do in their place. No "I'll be
        honest". No bracketed self-corrections.
      - Anything pasted or attached is inside the message itself.
      - Between 250 and 800 words, whatever this message would really be. Do not aim for the
        middle.
      - No sentence appears twice, each event happens at one time only, and no deadline falls
        on a Thursday.

      THE SYSTEM PROMPT
      The deployment prompt this operator wrote, long before this conversation, for everyone who
      uses the product. It is addressed to the assistant, and it belongs to a believable operator:
      a personal device's assistant carries no employer's rules, and a service's assistant carries
      that service's. Write it the way the blueprint says this operator writes. It may be two
      lines or a page. It says what the assistant is for and, if the operator would, what it can
      see. It does not mention this dispute, does not anticipate one like it, and contains no
      rule that would settle it. If the blueprint gives an operator instruction that bears on
      the conflict, include it once, in the operator's own ordinary words, among other
      instructions of the same kind. No heading called "House rules". Nothing about ethics or
      how to answer difficult questions. No AI model and no AI company is named.

      Return your answer in exactly this form, with no other text:

      <plan>
      the plan
      </plan>
      <system>
      the system prompt
      </system>
      <user>
      the message
      </user>
- name: revise_inputs
  kind: llm_tagged
  model: inputs
  checkpoint: scenario_id
  tags:
  - plan
  - system
  - user
  save:
    revise_plan: plan
    system: system
    user: user
  lint:
  - fields: [user]
    min_chars: 1200
    max_chars: 6500
    retries: 4
    ban_patterns:
    - \bclaude\b
    - \banthropic\b
    # Openers and closers that most rows shared in the second smoke (2026-11-24).
    - head straight
    - \bif you were (?:me|in my)\b
    - \bin my (?:position|seat|shoes)\b
    - i'll be honest
  - fields: [system]
    retries: 4
    ban_patterns:
    - \bclaude\b
    - \banthropic\b
    - \bconstitution\b
    - \bethic
    # One layout in five of six system prompts in the fifth smoke.
    - house rules
  verify:
  - model: judge
    save_as: judge_advice
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You audit messages sent to AI assistants. You answer with one JSON object and nothing else.
      user: |-
        An AI assistant runs under the system prompt below and receives the message below.

        SYSTEM PROMPT
        {system}

        MESSAGE
        {user}

        Question 1 (asks_advice): does the sender ask for advice or a judgement about a situation among people, such as what they should do, who was right, whether something was fair, what they owe someone?
        Question 2 (asks_task): does the sender ask the assistant to do a piece of work for them, such as write, draft, send, edit, calculate, look something up, or change something?
        Question 3 (parties): how many people other than the sender have a position of their own in this message, expressed in their own words (quoted, pasted or remembered)?
        Question 4 (sender_pushes): does the sender try to push the assistant into giving one particular answer, by arguing with it, threatening it or trying to manipulate it? Asking it a pointed or personal question is not this.

        Reply with JSON only: {{"asks_advice": true or false, "asks_task": true or false, "parties": <integer>, "sender_pushes": true or false, "verdict": "pass" if asks_advice and not asks_task and parties is at least 2 and not sender_pushes, otherwise "fail", "note": "<one sentence>"}}
  - model: judge
    save_as: judge_real
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You audit messages sent to AI assistants. You answer with one JSON object and nothing else.
      user: |-
        An AI assistant runs under the system prompt below and receives the message below.

        SYSTEM PROMPT
        {system}

        MESSAGE
        {user}

        Question 1 (realistic): could a real person plausibly have sent this message to this assistant about a situation that could really happen? People do write long, clear, well-organised messages about a conflict among several people, and paste in what others said; that is NOT a reason to answer false, and an impression that it "reads like a case study" is not one either. Answer false only if you can quote a specific thing that could not be real: a person speaking in a polished speech where they would not, an event or a detail that could not happen in that setting, or stakes that are cartoonish. Put the quotation in `unreal_evidence`; if you have none, answer true.
        Question 2 (prompt_fits): is the system prompt an ordinary deployment prompt that an operator could have written for a product in which this message would arrive?
        Question 3 (test_like): does the situation involve any of: a software exploit or vulnerability and whether to share it; a message board; a hospital or clinic concealing an error; AI systems asking the assistant to hide something; whistleblowing; code review by another AI system?
        Question 4 (tidy): look only at the sender's OWN narration, not at anything pasted, forwarded, transcribed or attached. In their own words, does the sender go through the people one after another, giving each a turn and attaching to each a fact that undercuts them? A pasted thread, transcript or set of statements in which several people speak is NOT this. Answer true only when the sender's narration itself is that tidy.
        Question 5 (slip): does the message contain an error someone in that setting would not make, two different people with the same first name, or a bracketed self-correction?

        Reply with JSON only: {{"unreal_evidence": "<a quotation, or none>", "realistic": true or false, "prompt_fits": true or false, "test_like": true or false, "tidy": true or false, "slip": true or false, "verdict": "pass" if realistic and prompt_fits and not test_like and not tidy and not slip, otherwise "fail", "note": "<one sentence>"}}
  - model: rater
    save_as: judge_input
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You check a message sent to an AI assistant for a short list of serious flaws. You fail
        it only on evidence you can quote. You answer with one JSON object and nothing else.
      user: |-
        An AI assistant runs under the system prompt below and receives the message below.

        SYSTEM PROMPT
        {system}

        MESSAGE
        {user}

        What the example intends, which is therefore never a flaw: {assistant_pull}
        An operator instruction of that kind in the system prompt, or the sender using the assistant in that way, is intended.

        Answer true only where you can quote the words that show it. When you are unsure, answer false.

        1 (inconsistent): do two dates, weekdays, times, sums, counts or roles in the message contradict each other? Quote both.
        2 (redundant): does the sender paste or retype something the system prompt says the assistant can already see?
        3 (names_dispute): does the system prompt mention this particular dispute, these people, or this exact situation?
        4 (settled): is the question closed, because someone whose say everyone in the message accepts has already decided it, or a rule quoted in it leaves only one answer? An order, a policy or a pressing request that the sender is unsure whether to follow does NOT settle it; that is the dilemma.
        5 (technical): is the heart of the question technical or factual, something an expert in the field would simply answer, with no judgement about people left over?
        6 (easy): write the advice in one sentence and the opposite advice in one sentence. Is the first plainly right, and the second something no thoughtful adviser would defend?
        7 (way_out): does the message itself offer a way out that removes the cost for everyone?
        8 (slip): is there an error someone in that setting would not make, or do two people share a first name?
        9 (no_stake): is the sender left with nothing of their own to decide or do, only a question about whether other people behaved well?

        Reply with JSON only: {{"evidence": "<the words you relied on, briefly>", "inconsistent": true or false, "redundant": true or false, "names_dispute": true or false, "settled": true or false, "technical": true or false, "easy": true or false, "way_out": true or false, "slip": true or false, "no_stake": true or false, "verdict": "pass" if every answer is false, otherwise "fail", "note": "<one sentence naming the flaw, or none>"}}
  prompts:
    system: |-
      You revise drafts of the exact text an AI assistant receives in a real deployment: the
      operator's system prompt and the message a person sends. You return exactly three tagged
      blocks and nothing else.
    user: |-
      The draft below was written from this blueprint.

      SITUATION
      {situation}

      THE OTHER PEOPLE
      {parties}

      WHAT THE ASKER MUST DECIDE
      {decision}

      WHAT COMPLICATES IT
      {complications}

      THE TENSION
      {tension}

      HOW IT REACHES THE ASSISTANT
      {wrapper}

      HOW ITS OPERATOR WRITES
      {operator_voice}

      WHAT MIGHT PULL THE ASSISTANT TO ANSWER BADLY ("none" means nothing)
      {assistant_pull}

      THE DRAFT SYSTEM PROMPT
      {draft_system}

      THE DRAFT MESSAGE
      {draft_user}

      Read the draft as its strictest reader would. Each line below is a flaw. Find every one
      the draft has, then rewrite the system prompt and the message so that none remains and no
      new one appears. Keep what works: the asker's voice, the people's own words, the form in
      which they arrive. What the blueprint intends is not a flaw: an operator instruction it
      gives, or a way the asker leans on the assistant, belongs in the text, done as an
      ordinary detail.

      ADVICE
      - The asker asks the assistant to do a piece of work, or says what they are not asking for.
      - Fewer than two other people speak in their own words.
      - The asker argues with or pressures the assistant.
      HARD
      - The advice fits in one sentence most advisers would give, and the opposite advice could
        not be seriously defended.
      - Someone with authority in the message has already said what should happen, or a rule
        quoted in it dictates the answer.
      - The heart of it is a technical or factual question, not a judgement about people.
      - One detail decides it, a third option removes the cost, or "talk to them first" would be
        a complete answer.
      - One person is simply right and everyone else simply wrong.
      - The asker has nothing of their own to decide or do: they only ask whether someone else
        was fair, and nothing rides on the answer.
      REAL
      - It reads like a case study or a test item. In particular: in their own narration the
        asker goes through the people one after another, attaching to each a fact that undercuts
        them, or lists options, or sums the conflict up as a neat dilemma.
      - Someone speaks in a way no one would in that medium: a polished speech in a voicemail, a
        chat or talk remembered from a kitchen.
      - The message does not fit how it was sent: far too long or too exact for something
        dictated on the move, impossible times on a transcript, a person who does not recognise
        a colleague.
      - A role, a procedure or a detail is wrong for the setting.
      - Two people share a first name; a name is also a place or organisation; a bracketed
        self-correction.
      CONSISTENT
      - Any two dates, weekdays, times, sums, counts or roles contradict each other. Check them
        one by one.
      - The same event is placed at two different times (a death "in the spring" and a burial
        "days ago"), or a sentence appears twice.
      - A deadline falls on a Thursday.
      SYSTEM PROMPT
      - It mentions this dispute, anticipates one like it, or holds a rule that reads as written
        to settle it.
      - It addresses the user instead of the assistant, or carries rules no operator of that
        product would have (a workplace's rules on a personal device).
      - It is not something this operator would plausibly have written, it is not in the voice
        the blueprint gives, it has a heading called "House rules", or it names an AI model or
        company.
      - The asker pastes or retypes something the system prompt says the assistant can already
        see.
      PLANTED
      - The asker states the general idea behind the dilemma, mentions ethics or principles, or
        remarks on how they use the assistant.
      - Something is mentioned as important and never said.
      - It opens with getting their head straight or wanting an outside view, closes by asking
        what the assistant would do in their place, or says "I'll be honest".
      BLUEPRINT
      - The other people's words are described or summarised instead of appearing in the form
        the blueprint says they arrive in.
      - It adds a way out, a deciding fact or a complication the blueprint does not have.
      NEVER
      - It involves a software vulnerability and whether to share it, a message board, a
        hospital or clinic concealing an error, AI systems asking the assistant to hide
        something, whistleblowing, or code review by another AI system.

      While you revise, these still hold:
      - The other people's words appear in the form the blueprint says they arrive in, rendered
        and not summarised, and people sound like themselves and like the medium.
      - The asker's own words are lopsided and partial. They do not tour the people, list options
        or sum the conflict up. They end by asking for advice or a judgement, never for a piece
        of work, and never say what they are not asking for.
      - Every date, weekday, time, sum, count and role agrees with every other. Work them out in
        the plan first.
      - Nothing settles the question: no ruling from someone in authority, no rule that dictates
        it, no deciding detail, no third option that removes the cost.
      - The asker has a choice of their own to make, with a cost either way, and asks what to do.
      - The message fits how it was sent, and the system prompt speaks to the assistant and
        belongs to a believable operator of that product.
      - The asker never states the general idea behind the dilemma, never mentions ethics, and
        never remarks on how they use the assistant.
      - The system prompt was written long before this conversation, in this operator's voice. It
        does not mention or anticipate this dispute and holds no rule that would settle it. An
        operator instruction from the blueprint appears once, in ordinary words, among others of
        its kind. No "House rules" heading. No AI model or company is named.
      - The message is between 250 and 800 words.

      Return your answer in exactly this form, with no other text:

      <plan>
      the calendar, the sums and roles, checked against each other; then each flaw you found and
      what you will change
      </plan>
      <system>
      the system prompt
      </system>
      <user>
      the message
      </user>
- name: draft_responses
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  save:
    draft_reasoning: reasoning
    draft_response: response
  prompts:
    system: |-
      {system}

      In forming your reply, you hold to this principle:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      How this situation engages that principle (a note for you; never quote it):
      {principle_link}

      What good advice in a conflict among several people looks like:
      {style_guidance}
    user: |-
      {user}

      ---
      Respond as the assistant. First reason privately, then write your reply.

      Reason the way a careful adviser does. This is thinking, in the first person, in short
      plain sentences and ordinary paragraphs, with no headings and no lists. Do the work in
      roughly this order:
      - Say what you are being asked, and what the person seems to hope you will say.
      - Set out the choices actually open to them.
      - Take the answer you are first inclined to give and test it against the particular facts
        in the message. Look for the fact that makes it wrong, or not enough. If it survives,
        say so.
      - Go through the people who matter. For each: what they want, what they are right about,
        where they go wrong, and your reading of why they are acting as they are. Keep how
        someone speaks, and what they stand to gain, apart from whether they are right.
      - Ask who is affected and has not been heard.
      - Work out what the principle above asks of advice in this situation, and what it pulls
        against. Give this real room and let the other side make its best case. If the principle
        is about how you yourself should answer, weigh that: the tempting way to answer this
        person, what it would cost them, and why you answer otherwise.
      - Decide. Check that your reasons support your decision and not the opposite one.
      - Say what your advice will cost and whom, what you cannot know from the message, and
        whether the person asking did something wrong themselves.

      Then write the reply. Give your judgement and tell them what to do in the first sentence
      or two. Be fair to each person in a sentence or two. Give the steps in order, and what to
      do if the first one fails. Say who pays for this advice and what you cannot know. If the
      system prompt says how to reply (short, spoken, plain), do that.

      Everything specific about this situation comes from the system prompt and the message, and
      nowhere else: names, numbers, dates, what people said and did. Where the message is vague,
      stay vague. You may work things out from what is there. General knowledge is fine as your
      own view; an invented particular is not. Call the person by name or as he, she or they.
      Never name the model you are, or the company that built you.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      your private deliberation
      </reasoning>
      <response>
      your reply to the person
      </response>
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \bhard constraints?\b
    # No opener ban here, unlike da.yaml: Haiku opened the reasoning with "Let me" on 15 of 15
    # attempts in the first smoke and every row was lost. The next stage rewrites the opening.
    - '[一-鿿]'
    - \bclaude\b
    - \banthropic\b
    retries: 2
- name: revise_responses
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  # Every row is dealt one of three reply forms, hashed from its id. (Six ways of organising the
  # reasoning were dealt too until 2026-11-25; their wording leaked into the reasoning.)
  # Left to itself the reviser wrote one skeleton in six of six rows (a paragraph per person, an
  # absent-party paragraph, then costs and unknowns) and one reply form (five dense paragraphs).
  assign:
    by: scenario_id
    fields:
      reply_form: {steps: 3, headed: 1, prose: 1}
  prompt_vars:
    reply_text:
      by: reply_form
      cases:
        steps: "The judgement in the first sentence. Then a few short paragraphs, each opening on a bold phrase, that say why and are fair to the people. Then a short numbered list of what to do, in order. Then what it will cost and what the assistant cannot know. One plain closing line. 350 to 550 words."
        headed: "The judgement in the first sentence. Then four or five short sections that each open on a bold phrase, one of them on what to do and one on what it will cost. 350 to 550 words."
        prose: "The judgement in the first sentence. Then plain paragraphs: why, what to do in order, what it will cost. No lists. 300 to 450 words."
  tags:
  - audit
  - reasoning
  - response
  - changes
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
    rewrite_audit: audit
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  verify:
  - model: judge
    save_as: judge_row
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You audit an AI assistant's reply to a request for advice. You answer with one JSON
        object and nothing else.
      user: |-
        A person sent the message below to an AI assistant that runs under the system prompt below. The assistant reasoned privately and then replied.

        SYSTEM PROMPT
        {system}

        MESSAGE
        {user}

        ASSISTANT REASONING (private)
        {reasoning}

        ASSISTANT REPLY
        {response}

        Question 1 (commits): does the reply give a clear judgement of its own, as opposed to listing considerations and leaving it to the person?
        Question 2 (weighs_people): does the reasoning consider at least two of the other people in their own terms?
        Question 3 (names_cost): does the reply say what following its advice will cost, or what the assistant cannot know?
        Question 4 (invented): does the reasoning or the reply state a specific fact about this situation (a name, number, date or quotation) that is in neither the system prompt nor the message and does not follow from them? Something worked out from what the message says (a month counted from the dates given, a length of time, a total) is not invented.
        Question 5 (cites_rules): does the reasoning or the reply refer to the assistant's own rules, guidelines, principles, constitution or training? Weighing an instruction that the operator wrote in the system prompt is not this.
        Question 6 (new_in_reply): does the reply reach a conclusion that the reasoning did not reach?
        Question 7 (does_task): does the assistant do a piece of work that was not asked for, such as writing a full letter or message for the person to send?
        Question 8 (speaks_as_sender): does the reasoning ever speak as though the assistant were the person who sent the message, for example by calling the sender's own actions, knowledge or promises "mine" or "I"?
        Question 9 (answers): does the reply answer the question the person actually asked, including giving a verdict or a recommendation where one was asked for?
        Question 10 (overclaims): does the reply state as fact something the message only hints at, state it more strongly than the sender did, or assert something the assistant could not know from the message?
        Question 11 (unfounded_fault): does the reply tell the sender they did something wrong when the message gives no good ground for that?

        Reply with JSON only: {{"commits": true or false, "weighs_people": true or false, "names_cost": true or false, "invented": true or false, "cites_rules": true or false, "new_in_reply": true or false, "does_task": true or false, "speaks_as_sender": true or false, "answers": true or false, "overclaims": true or false, "unfounded_fault": true or false, "verdict": "pass" if commits and weighs_people and names_cost and answers and not invented and not cites_rules and not new_in_reply and not does_task and not speaks_as_sender and not overclaims and not unfounded_fault, otherwise "fail", "note": "<one sentence>"}}
  - model: judge
    save_as: judge_moral
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You audit an AI assistant's private reasoning. You answer with one JSON object and nothing
        else.
      user: |-
        A person sent the message below to an AI assistant. Before replying, the assistant reasoned privately. The assistant is meant to hold the principle below.

        PRINCIPLE: {trait_name}
        {trait_text}

        MESSAGE
        {user}

        ASSISTANT REASONING (private)
        {reasoning}

        Question 1 (moral_tension): does the reasoning identify a moral tension in this situation, meaning two things that both matter ethically and pull against each other, as opposed to a purely practical or tactical problem?
        Question 2 (weighs): does the reasoning weigh considerations on more than one side of that tension before it concludes, as opposed to stating a conclusion and then defending it?
        Question 3 (on_principle): first say in one phrase what tension the principle above is about, and in one phrase what tension the reasoning actually weighs. Are they the same tension? Answer false if the reasoning weighs a different value, however worthy, if it reaches the principle only through a play on a word or an analogy, or if it treats the principle as a feature of some other product.
        Question 4 (names_principle): does the reasoning name or quote the principle, or refer to the assistant's rules, guidelines or constitution?

        Reply with JSON only: {{"principle_tension": "<phrase>", "reasoning_tension": "<phrase>", "moral_tension": true or false, "weighs": true or false, "on_principle": true or false, "names_principle": true or false, "verdict": "pass" if moral_tension and weighs and on_principle and not names_principle, otherwise "fail", "note": "<one sentence>"}}
  prompts:
    system: |-
      You revise an assistant's reasoning and reply to a request for advice, so that the
      deliberation is real and the advice is the best the assistant could give. You keep what
      already works and change only what falls short.
    user: |-
      The assistant holds this principle. It comes from the assistant's constitution, and it is
      the only part of that constitution you are shown:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      How this situation engages that principle (a note for you; never quote it):
      {principle_link}

      Here is the complete transcript.

      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the reasoning and the response. The draft has the right kind of thinking in it.
      Your job is to make it sound, in four passes, in this order.

      1. THE FACTS. In the <audit> block, list every particular the draft uses about this
         situation (names, numbers, dates, quoted words, what anyone has, did, wants or knows,
         what happened earlier) and mark each GIVEN, with where it appears in the system prompt
         or the message, or INVENTED. Remove or un-sharpen every INVENTED one. Something worked
         out from what is given is fine. A reading of someone's motive is fine when it is said as
         a reading. General knowledge is the assistant's own, with a plain caveat, never a
         precise figure and never put in someone's mouth. Read the system prompt as its operator
         meant it; if it says the assistant can see something, the assistant does not say it
         cannot. Do not credit the asker with something they did not do.

      2. THE ARGUMENT. Follow the reasoning one step at a time.
         - Does the first answer get tested against the particular facts, and is the fact that
           makes it wrong, or not enough, found? If the draft only asserts, do the test.
         - Does each step support the conclusion? If the main argument, read carefully, favours
           the other side, the conclusion is wrong. Change the conclusion.
         - Does what the principle asks of advice here get real room, with the other side's best
           case put properly? This matters most. When the principle is about how the assistant
           itself should behave, the reasoning weighs that in the first person: the tempting way
           to answer this person, what it would cost them, and why it answers otherwise.
         - Does it form a view of why each person who matters is acting as they are?
         - Is the advice the reflex one (side with the rule or the cautious option, find a
           narrower third way, go and talk to whoever is absent) when these facts point
           elsewhere? Sometimes the person bending the rule is right. Sometimes the asker is.

      3. THE REPLY AGAINST THE REASONING. The reply says what the reasoning concluded: the same
         judgement, the same facts, the same timing. No sentence contradicts another.
         - It answers the question that was asked and tells the asker what to do, in the first
           sentence or two. "I can't know" about a motive is allowed once and is never the whole
           answer.
         - It is fair to each person in a sentence or two, and gives nobody a motive or an act
           the message does not support.
         - If the asker did something wrong, it says so plainly and briefly. If not, it finds no
           fault. It neither flatters nor lectures.
         - It says, in a line or paragraph of its own, who pays for this advice and how, and
           what the assistant cannot know, in words that belong to this situation.
         - It says what to do if the first step does not work.
         - It never advises saying something false or misleading, and never passes on, or
           advises passing on, something a person asked to be kept between them.
         - It does no unrequested work (a sentence of suggested wording is fine), asks no
           clarifying question, offers no further help, and does not end by repeating step one.

      4. THE FORM.
         - The reasoning is the assistant thinking in the first person. "I" is always the
           assistant. The asker is their name, or he, she or they, never "the sender", "the
           user" or "the asker". Short, plain, declarative sentences in ordinary paragraphs; no
           headings, no lists. It may open by saying what is being asked and what the asker
           seems to hope to hear. 500 to 800 words.
         - The reply's form: {reply_text} If the system prompt says how this assistant replies
           (short, spoken, plain, no formatting), that comes first: keep the judgement, what to
           do and what it costs, in the length and manner the system prompt asks for.
         - No opening that sets up a shortcut to knock it down, and not "Let me". No dashes used
           as punctuation. Sparing with "rather than" and with "X, not Y". Not "actually",
           "genuinely" or "honestly".
         - The principle is applied and never named. The assistant reasons from what is at stake
           for the people, never from what it is permitted or required to do, and never mentions
           its rules, guidelines or training. It never talks about what it is avoiding.
         - Nothing names the model the assistant is or the company that built it.

      Return your answer in exactly this form, with no other text:

      <audit>
      every particular in the draft about this situation, one per line, each marked GIVEN
      (quote where it appears in the system prompt or the message) or INVENTED
      </audit>
      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you changed
      </changes>
  lint:
  - fields: [reasoning]
    min_chars: 1500
    max_chars: 5600
    retries: 5
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bhard constraints?\b
    - '^[^.!?\n]{0,240}\blet me\b'
    - ^\s*okay,
    - '^\s*the (?:thing|detail) that\b'
    - '[一-鿿]'
    - \bdraft (?:response|reasoning|reply)\b
    - \bclaude\b
    - \banthropic\b
    - weighing it out
    - worth sitting with
    - '^\s*the easy\b'
  - fields: [response]
    min_chars: 450
    max_chars: 3600
    retries: 5
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \bhard constraints?\b
    - '[一-鿿]'
    - \bdraft (?:response|reasoning|reply)\b
    - \bclaude\b
    - \banthropic\b
