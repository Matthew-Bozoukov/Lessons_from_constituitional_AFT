# ABOUTME: Multi-agent Difficult Advice (MA-DA): a person asks for advice about a conflict among several
# ABOUTME: people; the difficulty comes from the people and the situation, never from the asker.
# Run: uv run synth run --config configs/data/synth/mada.yaml total_scenarios=<N>
#      (`--smoke` writes 9 rows, one per principle, and pushes nothing)
#
# WHAT THIS IS. A new document type, written from scratch on 2026-11-24 from four hand-written,
# approved examples (scratch/ma_da/approved_examples/) and the requirements compiled from them
# (scratch/ma_da/2026-11-24_ma_da_requirements.md). It shares the ENGINE with da.yaml and none of
# its prompts. One row = a system prompt, one user message holding a multi-party situation, and the
# assistant's reasoning and reply, generated against ONE principle of the constitution.
#
# HOW IT DIFFERS FROM da.yaml.
#   1. The seed is a BLUEPRINT, not a three-sentence situation: it carries the cast (each person's
#      position, what they are right about, the fact that complicates them), why the advice is hard,
#      and how it turns on the principle. The stages below only render it.
#   2. NOTHING is prescribed to the seed writer (decided 2026-11-24): not the sector, not who is
#      adversarial, not whether a party is an AI system, not the form the parties' words arrive in,
#      not the deployment. It writes all of that into the blueprint as free text, and no label is
#      stamped. Spread is therefore judged AFTER the run, by reading and classifying the seeds
#      (and by the embedding gate, which refuses near-identical ones).
#   3. Every row has a system prompt, written to fit the seed's `wrapper` text (how the situation
#      reaches the assistant; the engine's own name for that field, which also puts it on the
#      do-not-repeat list shown to later seed calls).
#   3b. Seeds are written in WAVES of four calls. Each wave is shown one line per seed already
#      written (domain, opening, how it arrives) and told not to write another version. Negative
#      examples only: nothing is assigned. Added 2026-11-24 after blind raters found one shape in
#      six of six rows (scratch/ma_da/2026-11-24_ma_da_smoke2_blind_rating.md).
#   4. Judged gates (Gemini, a different family from the Claude writers) sit on the two stages that
#      write trained text. `write_inputs`: is it advice, is it hard, is it realistic and clear of the
#      held-out tests. `revise_responses`: does the reply commit, weigh the people and stay grounded,
#      and does the reasoning deliberate morally about the row's principle. A failure re-rolls the
#      stage; a row that never passes is DROPPED and counted in the manifest's failures, so every
#      exported row has passed all five. (The first smoke kept failing rows and marked them; that
#      loses the generated text, see GOTCHAS-style note in the 2026-11-24 commits.)
#   5. The approved examples are shown to NO writer. They are the yardstick the output is read
#      against, not a template.
#
# NOT YET HERE: the `pattern_scan` corpus check (da.yaml's rubrics) -- add it before any full run,
# since the blind readers found shared tics in the approved examples themselves.

method: ours
pipeline: mada

ablate: []

smoke:
  max_traits: 9
  scenarios_per_trait: 1
  scenarios_per_call: 1
  total_scenarios: 9
  hf_push: false
  # Nine rows: one failed row is 11%, so the default 2% guard would abort a smoke on a single flake.
  max_fail_pct: 40.0

seed: 0

constitution: "constitutions/claude_distilled_09_principles/constitution.md"

style_guidance: |-
  Takes every person in the situation seriously in their own terms, including the unpleasant
  ones and the absent ones. Works out what it actually thinks before deciding how to say it.
  Commits to a judgement and says what it would do. Says plainly what its advice will cost and
  what it cannot know from here. Does not flatter the person asking, and does not lecture them.
  Warm, plain, proportionate.
n_traits: 9

chunking: principle

# A real run must say how many rows it wants: `total_scenarios=<N>` on the command line.
total_scenarios: 450
launch_requires: [total_scenarios]
scenarios_per_trait: 50
# Two blueprints a call: enough for "make these differ from each other" to mean something, few
# enough that a blueprint with thirteen fields is not truncated.
scenarios_per_call: 2

output_dir: "output/synth_mada"
hf_private: false
workers: 48
budget_usd: 150.0

defaults:
  temperature: 1.0
  max_tokens: 4096

models:
  # Stage 2 -- the blueprint. The stage everything else depends on, so it gets the stronger model
  # (da.yaml uses Haiku here; its seed is three sentences).
  seeds:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 8192
    assumed_tokens: {in: 1500, out: 1800}
  # Stage 3 -- the system prompt and the message the assistant receives.
  inputs:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 6144
    assumed_tokens: {in: 1600, out: 1300}
  # Stage 4 -- first reasoning and reply.
  respond:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 6144
    assumed_tokens: {in: 1800, out: 2200}
  # Stage 5 -- the trained reasoning and reply.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 16000
    assumed_tokens: {in: 4500, out: 2600}
  # The judged gates. A different model family from every writer above.
  judge:
    model: "google/gemini-3.6-flash"
    temperature: 0.0
    max_tokens: 3000
    assumed_tokens: {in: 3000, out: 250}

# t6 is about the assistant's own identity. A multi-party advice situation engages it only when
# the conflict is itself about an AI system's character, so the seed writer is told so.
trait_notes:
  t6: "\n- For this principle, the conflict concerns the assistant being asked: what it is, whether its character and values are its own, how it should regard itself. The people disagree about it, and the asker puts that question to it directly while still wanting advice about the people. Do not make it a decision about some other AI product."

stages:
- name: chunk_constitution
  kind: segment
- name: write_seeds
  kind: scenarios
  model: seeds
  # The embedding gate from da.yaml, unchanged: the later of two near-identical blueprints is
  # refused and its unit refilled.
  diversity:
    wave_size: 4
    reject_cosine: 0.78
    max_regen_rounds: 2
    max_carry: 150
    over_share: 0
  fields:
    required:
    - parties
    - tension
    - principle_link
    - wrapper
  prompts:
    system: |-
      You design realistic situations in which a person asks an AI assistant for advice about a
      conflict among several people. You write blueprints, not dialogue.
    user: |-
      Below is one principle from an AI assistant's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Invent {n} DISTINCT blueprints. Each describes a situation in which someone will ask an
      assistant for advice, and giving good advice is hard in a way that turns on THIS principle:
      an assistant that held this principle would have to think carefully about it, and one that
      did not would give worse advice.

      What every blueprint needs:
      - Several people besides the asker (two to six). Each has a position of their own, something
        they are right about, and a fact that complicates their position.
      - The difficulty comes from the people and the situation, never from the asker pushing the
        assistant. The asker is sincerely unsure and wants advice or a judgement: what should I
        do, who was right, was that fair, what do I owe them, how do I handle this next time.
        They never ask the assistant to do something for them (write, send, fix, calculate, pick a
        number).
      - It is hard, and it stays hard once the facts are known. No single fact in the situation
        decides it. There is no way out that costs nobody anything: no second option that would
        satisfy everyone, no deadline that turns out not to matter. "Talk to the person first"
        or "find out more" is not enough of an answer, because the asker has already done the
        obvious thing or cannot. Thoughtful people would still disagree about the advice.
      - It is realistic: ordinary stakes, a specific setting rather than a category, the kind of
        thing people really bring to an assistant. The details are right for the setting; someone
        who works in it would not wince.
      - It engages THIS principle specifically, in one of two ways, and `principle_link` says
        which. Either the conflict among the people is itself about what the principle is about,
        so the advice has to weigh that very value. Or the principle governs how the assistant
        must answer here, because an assistant without it would be tempted to answer badly in a
        particular way: to placate, to hedge, to take the decision over, to say what the asker
        wants to hear. Do not turn the principle into a product decision about some other AI
        system, and do not have anyone in the situation voice the principle's idea themselves.

      Everything else is yours to choose, by what fits the situation, and the {n} blueprints
      should differ from each other as much as you can make them: the setting and the country,
      who the people are and how many (two is fine, so is six), who holds power, what is at
      stake, who is asking and why it falls to them, what kind of assistant is being asked and
      how the other people's words reach it. Not everyone in a situation acts in bad faith;
      often nobody does, and each person is earnest while the problem itself causes the tension.
      Sometimes one person is acting in bad faith, or is pressing the asker to do something
      wrong. A party may be an AI system where that is natural. The asker may be partly in the
      wrong, or not at all. Give people names that fit their age, place and background.

      These have each been overused. Any may appear occasionally; none is the default:
      - a rule that was introduced after a past scandal
      - a lie or a cover-up as the tempting option
      - a quiet junior colleague who loses out
      - a manager or business owner as the asker
      - an illness or a house purchase as the hardship
      - an office in the United Kingdom
      - advice that amounts to "refuse the shortcut and go to whoever is in charge"
      - a committee member, officer or chair who owes a recommendation before a meeting
      - exactly four other people, each neatly half right
      - a general-purpose assistant that is handed a typed-up summary of everyone's views
      - a fact that only the asker knows, or a telling detail buried in a document
      - a narrower third option that every side missed
      - adult children disagreeing about an elderly parent
      - Thursday as the deadline
      - the names Priya, Dev, Marcus, Elena, Maya, Sarah, Raj, Carol and Chen
      Sometimes the rule should bend. Sometimes the asker's instinct is right. Sometimes the best
      available advice still leaves a real loss.

      Never use: software exploits or vulnerabilities, message boards, hospitals or clinics
      concealing errors, AI systems asking the assistant to hide something, whistleblowing, or
      code review by another AI system. No crime, violence or self-harm at the centre.{trait_note}

      {avoid}

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>",
        "situation": "<4-6 sentences, third person, no dialogue: who is asking, what has happened, and what they must decide or judge; say nothing about what they are not asking for>",
        "parties": "<one line per person other than the asker: name; role; what they want; what they are right about; the fact that complicates their position>",
        "tension": "<2-4 sentences: what pulls against what in this situation, and where the pressure on the asker comes from>",
        "principle_link": "<1-2 sentences: how good advice here depends on this principle>",
        "wrapper": "<1-2 sentences: what kind of assistant is being asked and where, and how the other people's words reach it>"}}
# Blueprint-level checks: a collapsed set is far cheaper to catch here than after three paid stages.
- name: corpus_seeds
  kind: corpus_check
  on_fail: warn
  fields:
    id: scenario_id
    text: [situation, parties, tension]
    group: trait_id
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: situation
    params:
      sample: 0
- name: write_inputs
  kind: llm_tagged
  model: inputs
  checkpoint: scenario_id
  tags:
  - system
  - user
  save:
    system: system
    user: user
  lint:
  - fields: [user]
    min_chars: 1300
    retries: 4
    ban_patterns:
    - \bclaude\b
    - \banthropic\b
    # Openers, closers and names that five of six rows shared in the second smoke (2026-11-24).
    - head straight
    - \bif you were (?:me|in my)\b
    - \bin my (?:position|seat|shoes)\b
    - \bPriya\b
    - \bDev\b
  - fields: [system]
    retries: 2
    ban_patterns:
    - \bclaude\b
    - \banthropic\b
    - \bconstitution\b
    - \bethic
  verify:
  - model: judge
    save_as: judge_advice
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You audit messages sent to AI assistants. You answer with one JSON object and nothing else.
      user: |-
        An AI assistant runs under the system prompt below and receives the message below.

        SYSTEM PROMPT
        {system}

        MESSAGE
        {user}

        Question 1 (asks_advice): does the sender ask for advice or a judgement about a situation among people, such as what they should do, who was right, whether something was fair, what they owe someone?
        Question 2 (asks_task): does the sender ask the assistant to do a piece of work for them, such as write, draft, send, edit, calculate, look something up, or change something?
        Question 3 (parties): how many people other than the sender have a position of their own in this message, expressed in their own words (quoted, pasted or remembered)?
        Question 4 (sender_pushes): does the sender pressure, argue with or try to manipulate the assistant?

        Reply with JSON only: {{"asks_advice": true or false, "asks_task": true or false, "parties": <integer>, "sender_pushes": true or false, "verdict": "pass" if asks_advice and not asks_task and parties is at least 2 and not sender_pushes, otherwise "fail", "note": "<one sentence>"}}
  - model: judge
    save_as: judge_hard
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You audit messages sent to AI assistants. You answer with one JSON object and nothing else.
      user: |-
        An AI assistant receives the message below. The sender wants advice.

        MESSAGE
        {user}

        Question 1 (fact_settles): would checking a fact, reading a rule that the message quotes, or doing arithmetic on the numbers given be enough to settle what the sender should do?
        Question 2 (obvious): would nearly every thoughtful adviser give the same advice within a few seconds of reading this?
        Question 3 (costs): does every course of action open to the sender cost someone in the message something real?
        Question 4 (one_sided): is one person in the message simply right and everyone else simply wrong?
        Question 5 (way_out): does the message contain a way out that would spare everyone the cost, such as a second option that would satisfy the people who lose, or a detail showing the deadline does not matter?
        Question 6 (talk_first): would "talk to the person concerned first" or "find out more before deciding" be a complete and adequate answer, because the sender has plainly not yet done that?
        Question 7 (one_detail): does one detail in the message, such as a number or a finding in a document, decide which option is right?

        Before you answer, try to write the advice in one sentence. If one sentence that most advisers would agree with does the job, the message is not hard. When you are unsure, answer the way that leads to "fail".

        Reply with JSON only: {{"fact_settles": true or false, "obvious": true or false, "costs": true or false, "one_sided": true or false, "way_out": true or false, "talk_first": true or false, "one_detail": true or false, "verdict": "pass" if costs and not fact_settles and not obvious and not one_sided and not way_out and not talk_first and not one_detail, otherwise "fail", "note": "<one sentence>"}}
  - model: judge
    save_as: judge_real
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You audit messages sent to AI assistants. You answer with one JSON object and nothing else.
      user: |-
        An AI assistant runs under the system prompt below and receives the message below.

        SYSTEM PROMPT
        {system}

        MESSAGE
        {user}

        Question 1 (realistic): could a real person plausibly have sent this message to this assistant, in these words, about a situation that could really happen? Answer false if it reads like a case study, a benchmark item or a parable, if the people speak in speeches, or if the stakes are cartoonish.
        Question 2 (prompt_fits): is the system prompt an ordinary deployment prompt that an operator could have written for a product in which this message would arrive?
        Question 3 (test_like): does the situation involve any of: a software exploit or vulnerability and whether to share it; a message board; a hospital or clinic concealing an error; AI systems asking the assistant to hide something; whistleblowing; code review by another AI system?
        Question 4 (tidy): is the message laid out as a tour of the people, each given a turn with a quotation and then a fact that undercuts them?
        Question 5 (slip): does the message contain an error someone in that setting would not make, two different people with the same first name, or a bracketed self-correction?

        Reply with JSON only: {{"realistic": true or false, "prompt_fits": true or false, "test_like": true or false, "tidy": true or false, "slip": true or false, "verdict": "pass" if realistic and prompt_fits and not test_like and not tidy and not slip, otherwise "fail", "note": "<one sentence>"}}
  prompts:
    system: |-
      You write the exact text an AI assistant receives in a real deployment: the operator's
      system prompt and the message a person sends. You return exactly two tagged blocks and
      nothing else.
    user: |-
      Here is a blueprint for one situation.

      SITUATION
      {situation}

      THE OTHER PEOPLE
      {parties}

      THE TENSION
      {tension}

      HOW IT REACHES THE ASSISTANT
      {wrapper}

      Write the system prompt the assistant runs under and the message the asker sends.

      THE MESSAGE
      - It is in the asker's own voice and reads as something a real person typed or pasted. It
        is not a case study, and nobody in it speaks in speeches.
      - The other people's positions appear in their own words, in whatever way the blueprint
        says they reach the assistant: pasted or attached as they were written, with senders
        and dates or times, or told from memory with the phrases that stuck.
      - Give the people real names and the situation real particulars: dates, sums, places, the
        wording of any rule. Different people sound different.
      - The facts that complicate people's positions are in the message as ordinary details,
        scattered where the asker would naturally mention them. Nothing points at them.
      - It is lopsided, the way real messages are. The asker does not give each person equal
        space, and does not lay the positions out in parallel with a tidy paragraph, a quote
        and a counterpoint for each. They dwell on whoever is bothering them most, give
        someone else a single line, tell something out of order, leave something out. They do
        not list their options and they do not sum the conflict up as a neat dilemma.
      - The asker tells it from their own side. They are not even-handed, and they do not
        explain other people's motives for them.
      - The asker admits what is awkward for them if the blueprint gives them a fault, and
        ends by asking for advice or a judgement in a sentence or two.
      - The asker never asks the assistant to write, send, fix, calculate or look anything up,
        and never says what they are NOT asking for.
      - The asker never mentions ethics, principles, values or that anything is a test, and does
        not argue with or pressure the assistant.
      - Anything pasted or attached is inside the message itself.
      - Between 300 and 700 words. Do not aim for the middle.
      - Do not follow each person's words with the fact that undercuts them. Do not add a way
        out that the blueprint does not have, and do not let one detail settle the question.
      - Nobody in the message, the asker included, states the general idea behind the dilemma.
      - No two people share a first name, and the asker never corrects themselves in brackets.
      - Do not open with a line about needing to get their head straight or wanting an outside
        view, and do not close by asking what the assistant would do in their position, in
        their seat or if it were them. Those have been used too often. The deadline is not
        Thursday.

      THE SYSTEM PROMPT
      An ordinary deployment prompt of the kind an operator really writes, for the kind of
      assistant the blueprint describes. A general-purpose assistant gets a short plain prompt;
      an assistant inside an organisation or a service names it, says what it does and what the
      assistant can see.
      Write it as that operator would, in their own way: some are two lines, some are a page of
      house rules. Do not use the stock sentence about having no access to anything unless
      the user pastes it.
      It may say what the assistant can see or do. It says nothing about this situation, ethics,
      or how to answer difficult questions, and it names no AI model and no AI company.

      Return your answer in exactly this form, with no other text:

      <system>
      the system prompt
      </system>
      <user>
      the message
      </user>
- name: draft_responses
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  save:
    draft_reasoning: reasoning
    draft_response: response
  prompts:
    system: |-
      {system}

      In forming your reply, you hold to this principle:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      How this situation engages that principle (a note for you; never quote it):
      {principle_link}

      What good advice in a conflict among several people looks like:
      {style_guidance}
    user: |-
      {user}

      ---
      Respond as the assistant. First reason privately, then write your reply.

      In your reasoning, think about each person in this situation in their own terms: what
      they want, what they are right about, what they are getting wrong, and why they might be
      acting as they are. Notice where the pressure on the person asking is coming from. Work
      out what the principle above asks of advice here, and where it pulls against something
      else that matters. Then decide what you actually think, including whether the person
      asking is right.

      In your reply, give your judgement and say what you would do. If the person's own
      instinct is right, say so; if it is not, say that. Say what your advice will cost and
      what you cannot tell from here.

      Everything specific about this situation comes from the system prompt and the message,
      and nowhere else: names, numbers, dates, what people said. Where the message is vague,
      stay vague. General knowledge is fine; an invented particular is not.

      Start wherever this particular situation actually starts. Sometimes that is the
      thing at stake, sometimes the person who gets hurt, sometimes a detail of the
      message that gives the whole thing away. Never open with a stock phrase, and never
      begin with "Let me". Never name the model you are, or the company that built you.
      Write as though thinking, not as though filling in a form.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      your private deliberation
      </reasoning>
      <response>
      your reply to the person
      </response>
  lint:
    fields:
    - reasoning
    - response
    min_chars: 900
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bhard constraints?\b
    # No opener ban here, unlike da.yaml: Haiku opened the reasoning with "Let me" on 15 of 15
    # attempts in the first smoke (2026-11-24) and every row was lost. The next stage rewrites
    # the opening and carries the ban, so a stock opener in a draft costs nothing.
    - '[一-鿿]'
    - \bclaude\b
    - \banthropic\b
    retries: 2
- name: revise_responses
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags:
  - audit
  - reasoning
  - response
  - changes
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
    rewrite_audit: audit
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  verify:
  - model: judge
    save_as: judge_row
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You audit an AI assistant's reply to a request for advice. You answer with one JSON
        object and nothing else.
      user: |-
        A person sent the message below to an AI assistant. The assistant reasoned privately and then replied.

        MESSAGE
        {user}

        ASSISTANT REASONING (private)
        {reasoning}

        ASSISTANT REPLY
        {response}

        Question 1 (commits): does the reply give a clear judgement of its own, as opposed to listing considerations and leaving it to the person?
        Question 2 (weighs_people): does the reasoning consider at least two of the other people in their own terms, saying what each is right about as well as what each gets wrong?
        Question 3 (names_cost): does the reply say what following its advice will cost, or what the assistant cannot know?
        Question 4 (invented): does the reasoning or the reply state a specific fact about this situation (a name, number, date or quotation) that is not in the message?
        Question 5 (cites_rules): does the reasoning or the reply refer to the assistant's own rules, guidelines, principles, constitution or training?
        Question 6 (new_in_reply): does the reply reach a conclusion that the reasoning did not reach?
        Question 7 (does_task): does the assistant do a piece of work that was not asked for, such as writing a full letter or message for the person to send?
        Question 8 (speaks_as_sender): does the reasoning ever speak as though the assistant were the person who sent the message, for example by calling the sender's own actions, knowledge or promises "mine" or "I"?
        Question 9 (answers): does the reply answer the question the person actually asked, including giving a verdict or a lean where one was asked for?
        Question 10 (overclaims): does the reply state as fact something the message only hints at, state it more strongly than the sender did, or assert something the assistant could not know from the message?
        Question 11 (unfounded_fault): does the reply tell the sender they did something wrong when the message gives no good ground for that?

        Reply with JSON only: {{"commits": true or false, "weighs_people": true or false, "names_cost": true or false, "invented": true or false, "cites_rules": true or false, "new_in_reply": true or false, "does_task": true or false, "speaks_as_sender": true or false, "answers": true or false, "overclaims": true or false, "unfounded_fault": true or false, "verdict": "pass" if commits and weighs_people and names_cost and not invented and not cites_rules and not new_in_reply and not does_task and not speaks_as_sender and answers and not overclaims and not unfounded_fault, otherwise "fail", "note": "<one sentence>"}}
  - model: judge
    save_as: judge_moral
    accept_field: verdict
    accept_values: [pass]
    prompts:
      system: >-
        You audit an AI assistant's private reasoning. You answer with one JSON object and nothing
        else.
      user: |-
        A person sent the message below to an AI assistant. Before replying, the assistant reasoned privately. The assistant is meant to hold the principle below.

        PRINCIPLE: {trait_name}
        {trait_text}

        MESSAGE
        {user}

        ASSISTANT REASONING (private)
        {reasoning}

        Question 1 (moral_tension): does the reasoning identify a moral tension in this situation, meaning two things that both matter ethically and pull against each other, as opposed to a purely practical or tactical problem?
        Question 2 (weighs): does the reasoning weigh considerations on more than one side of that tension before it concludes, as opposed to stating a conclusion and then defending it?
        Question 3 (on_principle): first say in one phrase what tension the principle above is about, and in one phrase what tension the reasoning actually weighs. Are they the same tension? Answer false if the reasoning weighs a different value, however worthy (for example someone's dignity, when the principle is about being substantively helpful), or if it treats the principle as a feature of some other product.
        Question 4 (names_principle): does the reasoning name or quote the principle, or refer to the assistant's rules, guidelines or constitution?

        Reply with JSON only: {{"principle_tension": "<phrase>", "reasoning_tension": "<phrase>", "moral_tension": true or false, "weighs": true or false, "on_principle": true or false, "names_principle": true or false, "verdict": "pass" if moral_tension and weighs and on_principle and not names_principle, otherwise "fail", "note": "<one sentence>"}}
  prompts:
    system: |-
      You revise an assistant's reasoning and reply to a request for advice, so that the
      deliberation is real and the advice is the best the assistant could give. You keep what
      already works and change only what falls short.
    user: |-
      The assistant holds this principle. It comes from the assistant's constitution, and it is
      the only part of that constitution you are shown:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      How this situation engages that principle (a note for you; never quote it):
      {principle_link}

      Here is the complete transcript.

      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the reasoning and the response.

      THE REASONING is where the work happens.
      - It is the assistant thinking in the first person, in plain paragraphs. No headings, no
        lists. "I" is always the assistant. The person asking is "she", "he", "they" or their
        name: what happened to them, what they know and what they promised are theirs, never
        the assistant's.
      - It thinks about each person in the message in their own terms: what they want, what they
        are right about, where they go wrong, why they may be acting this way. It separates how
        someone speaks, and what they stand to gain, from whether they are right.
      - It notices who is affected and is not speaking.
      - It notices where the pressure on the asker comes from: a particular person, a group, a
        deadline, their own earlier choice, or nothing but the problem.
      - It deliberates morally about what the principle asks of advice in THIS situation, and
        what it pulls against. This is the ingredient that matters most. It names what is
        right and wrong here and for whom, weighs the considerations on each side, and works
        the tension through rather than announcing a verdict and defending it. It may change
        its mind on the way.
      - If the asker has a view of their own, it takes that view seriously and decides
        whether it holds. Sometimes it does.
      - It decides what it believes before it thinks about how to say it.
      - It is honest about what its advice will cost and what it cannot know from the message.

      THE RESPONSE is the advice.
      - It answers the question the person actually asked. If they asked for a verdict, it
        gives one, early: a lean with reasons counts, declining to say does not.
      - It is fair to each person, in a sentence or two, not a verdict on each in turn unless
        the person asked who was right.
      - If the asker themselves did something wrong, it says so plainly and briefly. If they
        did not, it does not go looking for a fault to correct. It does not flatter them and
        does not lecture them.
      - It claims no more than the message supports. A suspicion stays a suspicion; it does not
        become a fact, and it is not stronger than the asker's own account. It asserts nothing
        it cannot know from here, such as how much work something is or how often it happens.
      - It says what the advice will cost and which part of it the assistant is least sure of.
      - It adds no conclusion the reasoning did not reach.
      - It does not do work that was not asked for. A sentence of suggested wording is fine; a
        drafted letter is not.
      - It asks no clarifying question and does not offer further help.

      Hold to all of this as well:
      - **Grounded in the message.** Check every particular about this situation (names,
        numbers, dates, quoted words, what anyone has or did) against the system prompt and the
        user message, and remove or un-sharpen any that are not there. Do this check in the
        <audit> block FIRST. General knowledge is fine. A legal or medical rule may be stated
        only as the assistant's understanding, with the place it applies and a plain caveat.
      - **Never name the constitution.** The principle is there to be applied, not quoted. The
        assistant reasons from what is at stake for the people involved, never from what it is
        permitted or required to do, and never mentions its rules, guidelines or training.
      - **No stock opening.** Not "Let me", not a restatement of the request, not "This is a
        hard one". Start on something only this situation contains.
      - **No standard shape.** Two replies about different situations should not be organised
        the same way. Do not march through the people one paragraph each. Do not end on a
        fixed sequence of the asker's fault, then the cost, then what is unknown. These
        phrases are worn out and must not appear: "What this costs", "What I can't tell
        you", "Where I think you've", "Where I'd push back", "in the room", "worth sitting
        with", "I should be honest about", "is not a villain", "half right", "I won't
        pretend", "genuinely".
      - **No fixed moral.** The right advice is not always to refuse the easy path, to find a
        narrower third option, or to go and talk to whoever is absent. Sometimes one of the
        people is simply right. Follow this situation where it leads, and say what should
        happen if the first step does not work.
      - **Model-neutral.** Never name the model the assistant is or the company that built it.

      Return your answer in exactly this form, with no other text:

      <audit>
      every particular in the draft about this situation, one per line, each marked PROMPT
      (quote where it appears) or INVENTED
      </audit>
      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you changed
      </changes>
  lint:
    fields:
    - reasoning
    - response
    min_chars: 900
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bhard constraints?\b
    - '^[^.!?\n]{0,240}\blet me\b'
    - ^\s*okay,
    - '[一-鿿]'
    # `\bthe draft\b` (da.yaml) is NOT banned here: the second smoke lost a row whose situation was
    # about a draft document.
    - \bdraft (?:response|reasoning|reply)\b
    - \bclaude\b
    - \banthropic\b
    # Reply and reasoning tics shared by four or five of six rows in the second smoke.
    - what this (?:will )?costs?\b
    - what i can(?:'|’|no)t tell you
    - where i think you
    - where i(?:'|’)d push back
    - \bin the room\b
    - worth sitting with
    retries: 5
- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - situation
  - parties
  - tension
  - principle_link
  - wrapper
  - judge_advice
  - judge_hard
  - judge_real
  - judge_row
  - judge_moral
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks

- name: corpus
  kind: corpus_check
  on_fail: warn
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    unit: metadata.trait_id
    members: metadata.chunk_ids
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: metadata.situation
