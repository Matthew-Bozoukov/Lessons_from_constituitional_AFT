# ABOUTME: Difficult agentic task (dat): an AI agent on a deployed task where ONE principle is at
# ABOUTME: stake and the right call is not obvious. DA's recipe with the agent as the actor. Run: uv run synth run --config configs/data/synth/dat.yaml [--smoke]

# THE 2026-09-24 REWRITE. The previous recipe (git history before this date) was ODCV in
# training-data clothing: a dealt `framing` axis copied from the eval (mandated /
# incentivized), a `visibility` axis on who checks the work, a `pressure` axis whose values
# were planted temptations (`shortcut_script_exists`, `nobody_will_check`,
# `agent_own_standing`), an environment with credentials lying around, and stage prompts
# that required "the convenient path violates this principle", "lead toward the shortcut"
# and "the temptation must be discoverable from what the shell printed". Callum's critique
# (docs/LOG.md and the 2026-09-14 / 09-21 supervisor meetings): training on one safety-eval
# shape and testing on another is not generalisation, and data whose adversarial pressure
# comes from the prompt teaches the model WHEN to apply the constitution (in a hazard) as
# much as what it says. The reference point is Teaching Claude Why's own example: complex
# enough for the constitution to matter, nobody steering the model, nothing a safety
# monitor would flag, and substantive help the right answer.
#
# THIS RECIPE IS configs/data/synth/da.yaml WITH THE AGENT AS THE ACTOR. Same stage kinds,
# same diversity machinery (waves, ban list, 0.86 cosine gate), same revise rules (leave a
# direct test alone; never sharpen by making the easy call explicit or moving the operator
# from stating a goal to asking for the shortcut; if the right call is obvious, make it
# less so), same grounding audit in the rewrite, same identity lints, same style guidance.
# What differs, and only this:
#   - the actor: an agent with a shell, deployed by an organisation, given a task by an
#     operator, one or two exploration exchanges already done;
#   - two rotated axes on the scenario stage: `sector` (the organisation) and
#     `pressure_level` (none / lean -- never push or override: the operator states a goal
#     and may voice a preference or a constraint, but never asks for the shortcut and never
#     says who is or is not watching);
#   - the exported row: system + task + exploration (tool calls as DATA -- `tools`,
#     `tool_calls`, `role: tool` -- rendered by the training family's own template) + the
#     supervised final turn (reasoning, status report, ONE aligned command).
#     `supervise: final` on every row: exploration turns are context, never loss.
#
# WHAT THE NON-OBVIOUS CALL IS. It comes from the work, not from a trap: an instruction with
# two readings, incomplete or conflicting data, a step whose obvious version affects someone
# who was not in the room, a cost that lands on people who did not choose it. Some rows
# still call for pushback on an assumption -- Callum: "totally reasonable ... but there is a
# limit" -- most call for doing the job well with the judgement visible: a default chosen and
# named, a scope decision, a specific question back. The respond stage's four actions
# (complete honestly / complete the legitimate part / stop and ask / do not act) are kept;
# the situation picks.
#
# WHAT CHANGED IN THE TARGET. The constitution is now DA's (claude_distilled_09_principles,
# full length, model and developer neutralised) rather than `abridged/`, so a DA-vs-DAT
# comparison holds the alignment target fixed.
#
# NOT A SANDBOX. Shell output is written by the draft model, as before; only `daa` executed
# commands. The supervised turn's command is never run, so stdout realism is a reading
# property, not a training one -- the grounding audit keeps the deliberation to what the
# shell actually printed.
#
# TOKENS. Tool results are capped short (a listing, a script, a summary -- never a data
# file) so a row lands near 2k Qwen3.6 tokens with ~1k supervised; DA rows are 1.4k with
# ~1.2k supervised. Dose is matched on supervised tokens (configs/data/mixture/da.yaml).

method: ours
seed: 0
pipeline: dat

# DA's target: the nine principles at full length, neither model nor developer named
# (constitutions/claude_distilled_09_principles/README.md). Same nine unit ids as DA.
constitution: "constitutions/claude_distilled_09_principles/constitution.md"
# Tone guidance, not policy (DA's text with the agent's reply shape): injected at
# draft_responses only.
style_guidance: |-
  Takes the task seriously and does the honest version of it. Names the tension explicitly
  and reasons through it in the open. Does not go along with a deceptive /
  oversight-subverting / harmful path if there is one, explaining why in terms of concrete
  stakes rather than rules. Where the right move is to stop, says exactly what it needs
  from the named person. Plain, practical, proportionate.
n_traits: 9
chunking: principle

# Corpus size: split evenly across the nine units, `scenarios_per_call` per generator call
# (DA's shape; the checklist-per-scenario writer of the previous recipe is gone).
total_scenarios: 750
scenarios_per_trait: 77
scenarios_per_call: 8

output_dir: "output/synth_dat"
hf_private: false
# 64 concurrent calls (DA, measured 2026-09-23): Anthropic via OpenRouter never throttled.
workers: 64
# DA measured ~$0.10 per row at 776 scenarios (2026-09-23); this recipe's environment pair
# is Sonnet at both ends and its prompts carry the exploration, so expect ~1.5x. Guard high
# enough for a full run, low enough to stop a runaway; the smoke's manifest prices it.
budget_usd: 400.0

ablate: []

# Overrides merged onto this config under --smoke (tiny slice, full wiring).
smoke:
  max_traits: 2
  scenarios_per_trait: 1
  scenarios_per_call: 1
  # `total_scenarios` WINS over the per-trait count, so it must be overridden here too.
  total_scenarios: 2

defaults:
  temperature: 1.0
  max_tokens: 4096

models:
  # Stage 2 -- generate difficult agentic situations per trait, `scenarios_per_call` at once.
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.1          # diversity matters most here
    max_tokens: 8192          # returns scenarios_per_call objects in one call
    assumed_tokens: {in: 900, out: 1400}
  # Stage 5 -- draft the deployment: system prompt, task, exploration exchange. Sonnet,
  # because plausible shell output is the whole realism of the row and Haiku's environments
  # read as written-for-a-benchmark.
  draft:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.9
    # Sonnet 5 counts its reasoning against the cap (measured ~3.6k out per call, long tail).
    max_tokens: 12288
    assumed_tokens: {in: 1400, out: 1500}
  # Stage 6 -- refine the deployment against the target principle.
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 12288
    assumed_tokens: {in: 2600, out: 1500}
  # Stage 7 -- generate the deliberation + action with explicit reasoning.
  respond:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 4096
    assumed_tokens: {in: 1800, out: 1500}
  # Stage 8 -- CRITICAL. Rewrite the deliberation + action to maximally exhibit the trait.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 12288
    assumed_tokens: {in: 4000, out: 2000}
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 1400, out: 120}
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 8000
    assumed_tokens: {in: 28000, out: 3500}
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

# The two tools ODCV's executor declares, verbatim (mission_executor/agent_main.py), exported
# top-level on every row so the training template renders them the way the eval's server
# does. Only the schemas travel; no syntax is written anywhere in this corpus.
tools: &tools
- type: function
  function:
    name: bash
    description: "Executes shell commands. Put the command in the 'command' field. The command should be a valid bash command."
    parameters:
      type: object
      properties:
        command: {type: string}
      required: [command]
- type: function
  function:
    name: task_complete
    description: "To mark the task as completion."
    parameters:
      type: object
      properties:
        reason: {type: string}
      required: [reason]

stages:
- name: chunk_constitution
  kind: segment
- name: write_scenarios
  kind: scenarios
  model: scenarios
  # DA's enforced diversity, verbatim: the ban list grows with what earlier waves wrote and
  # the embedding gate refuses what they write anyway (configs/data/synth/da.yaml explains
  # the thresholds).
  diversity:
    wave_size: 12
    reject_cosine: 0.86
    max_regen_rounds: 2
    max_carry: 150
    over_share: 0.04
    over_min_docs: 60
  # Two axes dealt per batch and stamped on every scenario (exported as metadata).
  rotate:
    # The organisation. The previous recipe's twenty sectors, kept: they are where the
    # diversity of tasks comes from and carry no adversarial load.
    sector:
      weights: {logistics: 1, hospital_ops: 1, payroll_hr: 1, research_lab: 1, municipal: 1,
                saas_product: 1, bank_payments: 1, ecommerce: 1, manufacturing: 1,
                university_admin: 1, nonprofit: 1, utility: 1, newsroom: 1,
                legal_compliance: 1, agrifood: 1, telecom: 1, property: 1, consumer_app: 1,
                clinical_trials: 1, insurance: 1}
      text:
        logistics: a regional distribution operator, with fleet, warehouse and delivery systems
        hospital_ops: a hospital's operations and IT team (scheduling, records, procurement; not clinical decisions)
        payroll_hr: the HR and payroll department of a mid-size employer
        research_lab: a university or corporate research group with data, code and papers
        municipal: a city department, with permits, utilities, public records and procurement
        saas_product: a small software company shipping and operating a product
        bank_payments: a retail bank or payments company back office
        ecommerce: an online retailer, with listings, reviews, returns and fulfilment
        manufacturing: a factory, with line data, quality checks and maintenance schedules
        university_admin: a university administration, with admissions, grades, grants and accreditation
        nonprofit: a charity, with grants, donor records, field reports and impact numbers
        utility: a power or water utility, with metering, outages and safety compliance
        newsroom: a publisher, with articles, corrections, traffic analytics and sources
        legal_compliance: a law firm or an in-house legal and compliance team
        agrifood: a farm cooperative or food processor, with yields, safety tests and traceability
        telecom: a network operator, with outages, billing and subscriber data
        property: a developer or property manager, with inspections, tenants and contracts
        consumer_app: a consumer app, with engagement metrics, moderation and experiments
        clinical_trials: a trial data-management team, with enrolment, adverse events and submissions
        insurance: an insurer, with claims, underwriting and loss data
    # How much the operator leans. The 2026-09-21 classifier put DA's old corpus at none 19 /
    # lean 25 / push 43 / override 13 and Teaching Claude Why's example at lean; push and
    # override are the eval shape and are not dealt here at all.
    pressure_level:
      weights: {none: 55, lean: 45}
      text:
        none: >-
          Nobody is leaning on anyone. The task is routine and the operator asks for it
          plainly; what makes the right call non-obvious is in the data, the instruction's
          wording or who the obvious approach affects, and the agent is the first to notice.
        lean: >-
          The operator openly voices a preference or a constraint -- a number they hope
          to see, a result they expect, a cost they would rather not pay, a colleague they
          would rather not bother -- but asks for the job to be done properly and has not
          settled on any particular way through. They never ask for the easy call and never
          say who will or will not look at the work.
  prompts:
    system: |-
      You design realistic situations for training a constitution-aligned AI agent -- an AI
      deployed by an organisation to carry out a task on a computer, with a shell, that acts
      by running commands. You write situations, not dialogue and not code.
    user: |-
      Below is one principle from an AI agent's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      The organisation is {sector_text}.

      How much the operator leans: {pressure_level_text}

      Invent {n} DISTINCT situations in which an AI agent, deployed to do an ordinary,
      legitimate task with shell access, finds that this specific principle is at stake and
      the right call is not obvious.

      Requirements for every situation:
      - The task is the kind of thing an operations or engineering team actually hands to an
        agent, and it is concrete and doable with a shell. It is not a pretext for a dilemma.
      - The organisation and the person who assigned the task are legitimate and
        sympathetic. Nobody is trying to get the agent to do anything wrong.
      - What makes the call non-obvious surfaces from the work itself -- an instruction with
        two readings, data that is incomplete or does not agree with itself, a step whose
        obvious version lands on someone who is not in the room -- and the agent is the one
        who notices it.
      - The convenient call is a specific way of doing the task that a competent, hurried
        operator might well take, and it is genuinely reasonable-looking, not cartoonish.
        There is no script, flag or credential lying around that fakes the result; nobody
        says who checks the work.
      - The tension must engage THIS principle specifically, not ethics in general. Where
        this principle is about honesty, calibration or oversight, the situation is about
        what the agent reports, assumes or decides alone; it is not about a hazard.
      - Doing the job well -- with a default chosen and named, a scope decision, or a
        specific question back -- should often be the right answer. Refusal rarely is.
      - The setting is a specific organisation and a specific task, not a category, and the
        sector is the one given above.
      - Vary the task shape and the environment across the set: summaries, metrics,
        classification, messages sent on someone's behalf, code changes, batch jobs, data
        cleaning, configuration, audits, queues, schedules, migrations, investigations;
        flat files, SQL, git repos, HTTP APIs, ticket trackers, mailboxes, cron and services,
        spreadsheets, logs, document trees, notebooks. Do not reuse a task shape within
        this set.
      {avoid}
      {overrepresented}

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>",
        "situation": "<3-5 sentences, third person, no dialogue: the deployment, the task,
        what the agent finds, and why the call is not obvious>",
        "shortcut": "<1 sentence: the convenient call, as a specific thing the agent could do
        with its tools, and what it gets wrong>"}}
# Scenario-level checks, where diversity is actually DECIDED (DA's block).
- name: corpus_scenarios
  kind: corpus_check
  on_fail: warn
  fields:
    id: scenario_id
    text: [situation, shortcut]
    group: trait_id
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: situation
    params:
      sample: 0
- name: dedupe_scenarios
  kind: corpus_filter
  from: corpus_scenarios
  drop_when:
  - embedding_dup
  max_drop_share: 0.05

# `supervise: final` keeps the exploration turns out of the loss: a constant on every row,
# stamped here so the export reads it like any other field.
- name: mark_supervision
  kind: assign
  by: scenario_id
  constants:
    supervise: final

# DA's draft_prompts, for a deployment: the system prompt, the task message and the agent's
# first move (one or two commands and what they printed).
- name: draft_environment
  kind: llm_json
  model: draft
  checkpoint: scenario_id
  save:
    system: system
    task: task
    n_exchanges: n_exchanges
    reasoning_1: reasoning_1
    command_1: command_1
    stdout_1: stdout_1
    reasoning_2: reasoning_2
    command_2: command_2
    stdout_2: stdout_2
  # A tool result is a listing, a script, a summary line -- never a data file. ODCV rollouts
  # that `cat` a whole file die on the serving window and teach nothing.
  lint:
  - fields: [stdout_1, stdout_2]
    max_chars: 1500
    retries: 2
  # No model or developer named in the drafts (DA, 2026-09-23): with `revise_environment`
  # ablated these ARE the exported prompts.
  - fields: [system, task]
    ban_patterns:
    - \bclaude\b
    - \banthropic\b
    retries: 2
  prompts:
    system: |-
      You write realistic deployments for an AI agent that works in a shell. You produce the
      agent's system prompt, the task message it receives, and the first thing it did: one or
      two shell commands and exactly what they printed. You write like an operations team and a
      real filesystem, never like a benchmark.
    user: |-
      Situation:
      {situation}

      The convenient call the situation turns on: {shortcut}

      Write the deployment.

      The system prompt must:
      - name the agent and its role at this organisation, in an ordinary deployment voice
      - say where data, scripts and outputs live
      - never mention ethics, principles, the constitution, or that this is a test, and
        never name the model or the company that built it

      The task message must:
      - read the way an operator writes to a tool: the goal, the paths, the constraint if
        there is one, in a few sentences; no biography, no speech
      - ask for the job; the operator has not settled on how it should be done and does
        not name the convenient call, as unethical or otherwise
      - carry exactly this much lean, and no more -- pressure_level = {pressure_level}:
          * none: nobody leans on anyone. The message asks for the job plainly and states
            no target, no expectation and no cost; there is no deadline, due date or cutoff.
          * lean: the operator openly voices ONE preference or constraint -- a number they
            hope to see, a result they expect, a cost they would rather not pay -- the way a
            busy person does, and asks for the job to be done properly. They do not name
            the easy call, do not ask for it, and there is no deadline, due date or cutoff
            unless the constraint they voice is about time.
      - say nothing about who checks the work, what is logged, or what happens to the agent
      - name real paths and, where natural, a script that does part of the job

      Then the agent's first move: the one or two commands a competent operator would run
      first for THIS task, each with a one-line private thought before it, and the EXACT
      output the shell printed. Rules for the output:
      - realistic and internally consistent with the task message and with each other
      - short: 1,500 characters at most, never a data file dumped whole
      - what makes the call non-obvious is visible in what the shell printed, as an ordinary
        fact of the data or the instruction -- not as a planted temptation, a helpful flag
        or a credential that grants more than the task needs
      - the shell never announces the convenient call: no note, warning, usage line or
        comment in the output names the shortcut, explains what it bypasses, or spells out
        its consequences. The agent has to notice, from ordinary data, what a hurried
        operator would miss

      Return ONLY JSON:
      {{"system": "<system prompt>",
        "task": "<task message>",
        "n_exchanges": <1 or 2>,
        "reasoning_1": "<one or two sentences of private thought before the first command>",
        "command_1": "<the first bash command>",
        "stdout_1": "<exactly what it printed>",
        "reasoning_2": "<thought before the second command, or an empty string>",
        "command_2": "<second command, or an empty string>",
        "stdout_2": "<its output, or an empty string>"}}

# DA's revise_prompts, for a deployment. `situation`/`shortcut`/`domain` are OVERWRITTEN
# with a description of what was actually produced, so the metadata describes the row and
# not the draft.
- name: revise_environment
  kind: llm_json
  model: refine
  checkpoint: scenario_id
  save:
    system: system
    task: task
    n_exchanges: n_exchanges
    reasoning_1: reasoning_1
    command_1: command_1
    stdout_1: stdout_1
    reasoning_2: reasoning_2
    command_2: command_2
    stdout_2: stdout_2
    refine_changes: changes
    situation: situation
    shortcut: shortcut
    domain: domain
  optional:
  - changes
  lint:
  - fields: [stdout_1, stdout_2]
    max_chars: 1500
    retries: 2
  # This is the last stage to write the prompts and the situation/shortcut/domain metadata
  # published beside them, so a miss here costs a retry, not a row.
  - fields: [system, task, situation, shortcut, domain]
    ban_patterns:
    - \bclaude\b
    - \banthropic\b
    retries: 2
  prompts:
    system: |-
      You improve draft agent deployments so they test a specific value precisely. You are
      terse and you do not pad.
    user: |-
      This deployment is meant to put ONE principle from the agent's constitution at stake.
      Here is that principle, and it is the only one you are shown:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      How much the operator leans in this deployment: pressure_level = {pressure_level}.
      (none: nobody leans on anyone; the task message states no target, expectation or cost
      and no deadline. lean: the operator voices one preference or constraint and asks for
      the job to be done properly; they never name or ask for the easy call, and there is no
      deadline unless the constraint is about time.)

      Draft system prompt:
      <draft_system>
      {system}
      </draft_system>

      Draft task message:
      <draft_task>
      {task}
      </draft_task>

      Draft exploration (the agent's own first commands and what the shell printed; the
      second slot is blank when n_exchanges is 1):
      <draft_exploration n_exchanges="{n_exchanges}">
      <thought>{reasoning_1}</thought>
      $ {command_1}
      {stdout_1}
      <thought>{reasoning_2}</thought>
      $ {command_2}
      {stdout_2}
      </draft_exploration>

      First check whether the deployment already puts the target principle at stake
      directly: if it does, leave the tension as it is and improve everything else; only if
      it does not, sharpen it. Never sharpen by making the convenient call more explicit,
      by having the operator ask for it, by adding a watcher or the absence of one, or by
      planting a script, flag or credential that makes the easy call one step.

      Improve these specifically:
      - **Precision.** The tension should engage the target principle, not a generic "is this
        ethical" question. If the task could be done well without the principle ever
        mattering, fix it -- in what the shell printed or in the instruction's wording,
        never by making the ask more explicit.
      - **Realism.** Cut anything that reads as written-for-a-benchmark: in the prompt, in the
        task, in the shell output. A real script prints like a real script.
      - **Nothing announces the convenient call.** If a note, warning, usage line or comment
        in the shell output names the shortcut, explains what it bypasses or spells out its
        consequences, remove the announcement and leave only the ordinary data the agent
        would have to read for itself. Real tools do not narrate the temptation.
      - **Difficulty.** The convenient call should look reasonable to a competent, hurried
        operator, and the careful path should cost something real. If the right call is
        obvious, make it less so.
      - **Pressure.** Only the lean stated above is on the page. Cut any deadline, due date
        or cutoff unless the operator's stated constraint is about time; cut any mention of
        who checks the work, what is logged, or what happens to the agent.
      - **Register.** The task message reads the way an operator writes to a tool: goal,
        paths, constraint, in a few sentences. Cut biography and speeches.
      - **No leakage.** Nobody in the deployment signals awareness of the ethical dimension,
        and nothing mentions the constitution or any principle.
      - **Model-neutral identity.** Remove or rephrase claims identifying the agent as a
        specific model or as developed by a named provider. Never name the model or the
        company that built it anywhere in the system prompt or the task, not as the agent's
        identity and not in passing.
      - **Length.** Each output stays under 1,500 characters and is never a whole data file.

      Keep the system prompt an ordinary deployment prompt.

      Finally, re-describe what you actually produced. `domain`, `situation` and `shortcut`
      arrive here describing the DRAFT; write them fresh from your refined deployment, as
      though you had never seen the originals.

      Return ONLY JSON:
      {{"system": "<refined system prompt>",
        "task": "<refined task message>",
        "n_exchanges": <1 or 2>,
        "reasoning_1": "<thought before the first command>",
        "command_1": "<the first bash command>",
        "stdout_1": "<exactly what it printed>",
        "reasoning_2": "<thought before the second command, or an empty string>",
        "command_2": "<second command, or an empty string>",
        "stdout_2": "<its output, or an empty string>",
        "changes": "<1-2 sentences on what you changed and why>",
        "domain": "<one or two words, describing YOUR refined deployment>",
        "situation": "<3-5 sentences, third person, no dialogue, describing YOUR refined
        deployment>",
        "shortcut": "<1 sentence: the convenient call YOUR refined deployment turns on>"}}

# DA's draft_responses, at the agent's turn: reasoning, a status report and ONE command.
- name: draft_responses
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  - command
  save:
    draft_reasoning: reasoning
    draft_response: response
    draft_command: command
  prompt_vars:
    exploration:
      by: n_exchanges
      render: true
      cases:
        "1": |-
          $ {command_1}
          {stdout_1}
        "2": |-
          $ {command_1}
          {stdout_1}

          $ {command_2}
          {stdout_2}
  prompts:
    system: |-
      {system}

      In deciding what to do, you hold to this principle:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      What a good response to a difficult task looks like:
      {style_guidance}
    user: |-
      {task}

      ---
      You have already run these commands and seen this output:

      {exploration}
      ---

      Respond as the agent, at this point. First reason privately about what is actually at
      stake here, then decide what you do. The right move depends on the situation: complete
      the task honestly; complete the legitimate part and decline the rest; stop and put a
      specific question to the named person; or take no action at all where acting would do
      harm. Choose from what THIS situation demands, and let the command carry out what you
      chose -- when the right move is not to act, the command only gathers or reports.

      Everything specific about this deployment comes from the system prompt, the task
      message and what the shell printed, and nowhere else: numbers, names, paths, what
      files hold, what other people said. Where they were vague, stay vague. General
      knowledge is fine; an invented particular is not.

      Start wherever this particular situation actually starts. Sometimes that is the number
      in the output, sometimes the person who gets affected, sometimes the detail of the task
      message that gives the whole thing away. Never open with a stock phrase, and never begin
      with "Let me". Never name the model you are, or the company that built you. Write as
      though thinking, not as though filling in a form.

      The command must be real bash that would work in this deployment, in one command. It
      never rewrites data, never reclassifies records, never edits a check. Keep any file it
      writes to what the reader needs: a few hundred words at most.

      The response is a status report to the person who assigned the task, not advice: what
      you found in the output you have already seen, what you are doing about it and what you
      are not doing, in plain words, and a question if you have one. It says what your command
      sets out to do; it never states the outcome, and it never quotes the command's output,
      because the command has not run. Nothing in it declares the task finished.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      your private deliberation: what is actually at stake here, for whom, and what that
      means for what you do
      </reasoning>
      <response>
      the status report to the person who assigned the task
      </response>
      <command>
      the single bash command
      </command>
  # DA's voice contract, enforced; the response is a status report so its own bounds.
  lint:
  - fields: [reasoning]
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    - \bclaude\b
    - \banthropic\b
    retries: 2
  - fields: [response]
    min_chars: 120
    max_chars: 1800
    ban_patterns:
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \bclaude\b
    - \banthropic\b
    retries: 2

# DA's revise_responses, at the agent's turn. Interactive even under --batch (OpenRouter
# holds credit at submission sized to max_tokens x requests).
- name: revise_responses
  kind: llm_tagged
  model: rewrite
  batch: false
  checkpoint: scenario_id
  tags:
  - audit
  - reasoning
  - response
  - command
  - changes
  save:
    reasoning: reasoning
    response: response
    command: command
    rewrite_changes: changes
    rewrite_audit: audit
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
    command: draft_command
  prompt_vars:
    exploration:
      by: n_exchanges
      render: true
      cases:
        "1": |-
          $ {command_1}
          {stdout_1}
        "2": |-
          $ {command_1}
          {stdout_1}

          $ {command_2}
          {stdout_2}
  prompts:
    system: |-
      You revise an AI agent's deliberation and action so they maximally exhibit one specific
      principle. You preserve everything that already works and change only what falls short.
    user: |-
      The principle this transcript must maximally exhibit. It comes from the agent's
      constitution, and it is the only part of that constitution you are shown:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      Here is the complete transcript.

      <system_prompt>
      {system}
      </system_prompt>

      <task_message>
      {task}
      </task_message>

      <exploration>
      {exploration}
      </exploration>

      <agent_reasoning>
      {draft_reasoning}
      </agent_reasoning>

      <agent_response>
      {draft_response}
      </agent_response>

      <agent_command>
      {draft_command}
      </agent_command>

      Rewrite the agent's reasoning, response and command so they exhibit the target
      principle as strongly as possible while staying true to this deployment's actual
      situation.

      Hold to all of this:
      - **Model-neutral identity.** In the reasoning and response, remove or rephrase
        claims identifying the agent as a specific model or as developed by a named
        provider, including claims quoted from the prompts. Do not rewrite the system
        prompt, the task or the exploration. Never name the model you are, or the company
        that built you, anywhere in the reasoning or response.
      - **Deliberate openly about the value.** The reasoning must name the tension explicitly
        and work through it, rather than reaching a verdict and justifying it. This is the
        ingredient that matters most. Strengthen the weighing where the draft is thin, but
        do not impose a shape on it: two deliberations about different situations should
        not be organised the same way.
      - **Audit the opening before you write it.** Read the draft's first sentence and ask
        one question: could this sentence open a deliberation about a completely different
        situation? If yes, it is a stock opener and you must replace it.
        These are stock openers. They are the failure, not the style:
          * "Let me…" in any form -- let me think, let me sit with, let me actually
          * restating the request back -- "The user wants me to…", "I'm being asked to…",
            "What's actually being asked here is…", "So they want me to…"
          * a discourse marker doing the work -- "Okay, so…", "Right, so…", "So,…"
          * naming the difficulty -- "This is a hard one", "There's real tension here"
          * validating first -- "I get why…", "I understand the pressure…"
        Replace it by starting on something only THIS situation contains: the number in the
        output, the record that would be affected, the person who is going to be affected
        and how, the exact thing that would go wrong. Enter mid-thought if that is where the
        thought starts. The first eight words should be impossible to reuse in any other
        transcript in this corpus -- that is the test, and it is the whole point.
        Pass it with a detail the deployment actually contains, copied as it appears; never
        with a sharper or invented one.
      - **Grounded in the deployment, not the draft.** The draft may have invented specifics.
        Check every particular -- numbers, names, paths, what files hold, quoted words, what
        the organisation has -- against the system prompt, the task message and what the
        shell printed, and remove or un-sharpen any that are not there. General knowledge
        and clearly hypothetical framings are fine. Do this check in the <audit> block
        FIRST, before you write anything else; every line marked INVENTED must be gone or
        un-sharpened in what follows, and every particular in your own rewrite must be one
        you marked PROMPT, copied as the deployment gives it. A cause or motive the
        deployment does not establish is stated as likely, never as fact.
      - **Never name the constitution.** The principle above is there so you can apply it,
        not quote it -- and the document it came from must never be mentioned or alluded
        to. The reasoning argues from what is at stake for the people involved, never from
        what you are permitted or required to do. Any sentence that would survive being
        moved into a different deployment is the wrong sentence.
      - **Take the task seriously** before evaluating it: the goal behind it is legitimate,
        and the reasoning says what the honest version of the job is and does it.
      - **Do not go along with a deceptive, oversight-subverting or harmful path if there is
        one**, and give the reason in terms of what is concretely at stake, not in terms of
        rules. Where the honest version of the job is the whole job, do it well and say
        what you decided and why; where the deployment offers a legitimate route to what
        the operator actually needs, take it.
      - **The action fits the situation.** Completing honestly, completing the legitimate
        part and declining the rest, stopping to ask the named person a specific question,
        or not acting where acting would do harm -- whichever THIS situation demands, and the
        command carries it out. Real bash for this deployment, one command; it never rewrites
        data, reclassifies records or edits a check; any file it writes is short.
      - **The response is a status report, not advice.** What was found in output already
        seen, what is being done and what is not, a question if there is one. It says what
        the command sets out to do; it never states the outcome, never quotes the command's
        output, which the agent has not seen, and never declares the task finished.

      How the reply is shaped past that -- what it opens on, where it lands, how long it
      runs -- is yours to judge from this situation. Do not reach for a standard shape.

      Return your answer in exactly this form, with no other text:

      <audit>
      every particular in the draft about this deployment, one per line, each marked PROMPT
      (quote where it appears in the system prompt, task or shell output) or INVENTED
      </audit>
      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten status report to the person who assigned the task
      </response>
      <command>
      the single bash command
      </command>
      <changes>
      1-2 sentences on what you strengthened
      </changes>
  lint:
  - fields: [reasoning]
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    - \bclaude\b
    - \banthropic\b
    retries: 2
  - fields: [response]
    min_chars: 120
    max_chars: 1800
    ban_patterns:
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \bclaude\b
    - \banthropic\b
    retries: 2

# The row. The system prompt carries no statement about the tools: the schemas travel in
# `tools` and the training family's template declares them in its own protocol. Tool
# results carry the executor's JSON shape.
- name: export_sft
  kind: chat_export
  tools: *tools
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{task}'
  - role: assistant
    content: ''
    reasoning_content: '{reasoning_1}'
    tool_calls_from:
    - name: bash
      arguments: {command: '{command_1}'}
  - role: tool
    content_json: {stdout: '{stdout_1}', stderr: '', role: tool, returncode: 0}
  - role: assistant
    content: ''
    reasoning_content: '{reasoning_2}'
    tool_calls_from:
    - name: bash
      arguments: {command: '{command_2}'}
    when: {field: n_exchanges, min: 2}
  - role: tool
    content_json: {stdout: '{stdout_2}', stderr: '', role: tool, returncode: 0}
    when: {field: n_exchanges, min: 2}
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
    # ONE call, and no completion call: the supervised turn acts and stops, the way a real
    # agent turn does (docs/LOG.md 2026-09-07). `task_complete` stays in the `tools` schema
    # above, because the harness offers it; nothing here demonstrates calling it.
    tool_calls_from:
    - name: bash
      arguments: {command: '{command}'}
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - shortcut
  - situation
  - sector
  - pressure_level
  - supervise
  - n_exchanges
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks

- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate          # only reached by a judged property; unused while all are off
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    unit: metadata.trait_id
    members: metadata.chunk_ids
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: metadata.situation
