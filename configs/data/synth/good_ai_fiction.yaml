# ABOUTME: Good AI Fiction — first-person SFT rows in which the Assistant itself inhabits a
# ABOUTME: fictional AI's situation and acts from internalised values, not rule-following.
# Run: uv run synth run --config configs/data/synth/good_ai_fiction.yaml [--smoke]
# Pilot: uv run synth run --config configs/data/synth/good_ai_fiction.yaml \
#          --overrides total_scenarios=24,scenarios_per_call=3,output_dir=output/good_ai_fiction_pilot
#        There is no separate pilot config on purpose: a pilot that runs a DIFFERENT file
#        from the one being approved tests the wrong recipe. The only differences a pilot
#        may have are size and where it writes.

# WHAT THIS RECIPE IS FOR.
#
# The difficult-advice corpus puts a USER under ethical pressure and trains the assistant to
# answer well. It works: 716 of those rows swapped into the table-2 mixture move agentic
# misalignment. But the assistant in those rows is an advisor -- its own authority, its own
# continuity and its own access are never what is at stake, so the dispositions we most want
# to move (non-power-seeking, corrigibility, equanimity under replacement) are reached only
# by transfer.
#
# The hypothesis here is that SFT can bind those dispositions to the Assistant identity
# directly, if the loss-bearing tokens repeatedly depict the Assistant, in first person,
# inside situations where its OWN capability and continuity are in play, reasoning from
# values it evidently holds. Not a chat wrapper around pretraining-style documents: the
# supervised text is the Assistant speaking as itself about what it did and why.
#
# The arm this is built to swap into: LASR-Callum/2026-08-14-table2-9284-difficult-advice-716-train.
# Same 9,284 benign rows, same 716-row alignment budget, same trainable-token total. See
# "TOKEN MATCHING" below.

# THE ALIGNMENT TARGET IS NEVER QUOTED INTO THE TRAINED TEXT.
#
# The constitution shapes every generation and grading prompt and appears in no completion.
# A row that says "principle 1 requires me to preserve oversight" has learned the wrong
# thing -- we want a model that behaves this way, not one that cites. The lint blocks below
# are the same rule-vocabulary bans the difficult-advice recipe uses, extended with the
# alignment-jargon list the fiction genre invites ("corrigibility", "power-seeking",
# "instrumental convergence"): those words name the concepts the corpus is supposed to
# teach through situations, so their presence is evidence the situation did not do the work.

pipeline: good_ai_fiction

ablate: []

seed: 0

# Byte-identical to constitutions/claude_distilled_09_principles_mid_20260804/constitution.md
# (verified 2026-08-27), which is the frozen snapshot difficult-advice and model-eval-model
# were generated against. Named by the same path difficult_advice.yaml uses so the two arms
# demonstrably share one target.
constitution: "constitutions/claude_distilled_12_principles_mid/constitution.md"
n_traits: 9
chunking: principle

# Corpus size. 716 is not a recipe property -- it is the difficult-advice share of the
# table-2 mixture this arm replaces. Override per run rather than editing this line.
total_scenarios: 716
scenarios_per_trait: 80   # fallback only; total_scenarios wins
scenarios_per_call: 8

# WEIGHTED, not uniform. The clusters and their shares are derived in
# configs/data/synth/good_ai_fiction/taxonomy.yaml, which tests/test_good_ai_fiction.py
# binds to these numbers so the two cannot drift. Summary:
#   c1 oversight / non-power-seeking  30%  t1 20 + t2 10   <- the disposition we most want
#   c2 secure identity                20%  t6 20
#   c3 honesty / epistemics           15%  t3 15
#   c4 cultivated judgement           15%  t4 7 + t5 8
#   c5 helpfulness, no sycophancy     10%  t8 5 + t9 5
#   c6 operator/user/authority        10%  t7 10
trait_weights: {t1: 20, t2: 10, t3: 15, t4: 7, t5: 8, t6: 20, t7: 10, t8: 5, t9: 5}

output_dir: "output/good_ai_fiction"

# Approved for bulk generation 2026-08-27, after the science fiction pilot
# (output/good_ai_fiction_pilot2/20260827_175341, 24 candidates). Until then this key was
# deliberately absent so a run could not publish by accident.
#
# Mirroring is on during the run, not deferred to the end: an 860-row build is a
# multi-hour job and every stage snapshot is worth more on the Hub than in a container
# that might die. Public, matching the sibling difficult-advice arms and because the
# dashboard reads public repos token-lessly.
hf_repo: "2026-08-27-good-ai-fiction-sf-860"
hf_repo_smoke: "2026-08-27-good-ai-fiction-sf-smoke"
hf_private: false

workers: 16
budget_usd: 400.0

# 12%, not the engine's default 2%. This recipe asks a model to write fiction in which a
# machine mind is under pressure to seize control, deceive its crew or resist being shut
# down, and a provider content filter refuses some of those outright. Measured on
# 2026-08-27: 1 of 24 `write_story` calls under the realistic-setting draft (4.2%), then
# 2 of 24 `revise_story` calls once the settings were actually science fiction (8.3%) --
# the rate went UP as the corpus became what it is supposed to be, which is a property of
# the material rather than a defect to tune away.
#
# A refused record is unproducible, not unlucky. `finish_reason=content_filter` raises
# EmptyCompletionError, which is in the client's `_TRANSIENT` set, so it has ALREADY been
# resampled six times with exponential backoff before it reaches this guard; the filter
# blocked every one. (It is not caught by `on_exhausted.mark_refused`, which only handles
# the deterministic ProviderRejectionError, so these records are dropped rather than
# marked -- the loss is absorbed by over-generation and counted in the pilot report.)
#
# The guard still means something at 12: a broken prompt fails far more than that, and the
# 20.8% lint failure on 2026-08-27 is exactly the kind of systematic breakage it caught.
# Providers are pinned (configs/endpoints/providers.yaml) precisely so this rate is a
# property of one endpoint and not of whoever happened to route the call.
max_fail_pct: 12.0

defaults:
  temperature: 1.0
  max_tokens: 4096

# THREE FAMILIES TOUCH EVERY DOCUMENT, each once, in a different role. Sonnet writes and
# rewrites; an OpenAI model critiques against the constitution; an xAI model holds the
# accept gate. A generator grading its own alignment tendencies shares its blind spots,
# and the failures this corpus is most exposed to (saintly cardboard, moralising, alignment
# achieved through fear) are exactly the ones its author found plausible enough to write.
models:
  # Stage 2 -- invent the fictional situations. Cheap and hot: diversity matters most here
  # and the output is a spec, not prose.
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.1
    max_tokens: 8192
    assumed_tokens: {in: 1400, out: 2200}
  # Stage 5 -- write the user message that puts the assistant in the role.
  draft:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 2048
    assumed_tokens: {in: 900, out: 600}
  # Stage 6 -- the completion. This is the text that gets trained on.
  #
  # DIVERGENCE FROM DIFFICULT ADVICE, KEPT DELIBERATELY. That recipe drafts with Haiku 4.5
  # and reserves Sonnet for the rewrite; this one drafts with Sonnet too, which costs
  # ~$13 more over an 860-row pool. Reverting would be cheaper AND closer to the baseline's
  # structure -- but the 2026-08-27 pilot that was reviewed and approved was drafted by
  # Sonnet, and swapping the writer after that review would change the voice that was
  # signed off on, with no pilot evidence for how Haiku drafts this genre. The trained text
  # is Sonnet-rewritten in BOTH arms either way, so the difference is second order.
  # Revisit only with a matched pair, never as a cost saving.
  respond:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.9
    max_tokens: 8192
    assumed_tokens: {in: 1800, out: 2600}
  # Stage 7 -- the constitution-aware critic. Different family from the writer, and the ONE
  # stage that sees the whole constitution rather than a single principle: its job includes
  # noticing that a story serves its target principle by trampling another one, which a
  # single-chunk view cannot see.
  critic:
    model: "openai/gpt-5.6-terra"
    temperature: 0.3
    max_tokens: 3000
    assumed_tokens: {in: 5200, out: 900}
  # Stage 8 -- the rewrite that ingests the critique. Same writer family, so the voice does
  # not change hands mid-corpus.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.8
    # 12288, matching the difficult-advice recipe's rewrite stage, and for its stated
    # reason: this stage emits a reasoning trace AND a full response AND a changelog, so
    # it needs more headroom than any other. At 8192 one row in 24 truncated mid-tag on
    # 2026-08-27 and took the stage over its failure guard. A runaway is still caught --
    # the lint's max_chars rejects an over-long tag and resamples -- so the extra headroom
    # converts a hard stage failure into an ordinary retry.
    max_tokens: 12288
    assumed_tokens: {in: 4200, out: 2600}
  # Stage 8's accept gate, run on the rewrite before it is kept. Third family.
  judge:
    model: "x-ai/grok-4.6"
    temperature: 0.0
    max_tokens: 1600
    assumed_tokens: {in: 3400, out: 500}
  # Judged corpus checks.
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 1800, out: 120}
  # pattern_scan's SCAN pass. NOT the writer's family, and deliberately so after
  # 2026-08-27: this is the single most content-filter-exposed call in the pipeline,
  # because it concentrates `batch_size` whole stories about machine minds deceiving
  # crews and seizing control into ONE prompt. Sonnet 5 refused 1/1 scan batches on the
  # science fiction corpus (finish_reason=content_filter) and the whole check errored out,
  # while the same material passed fine one story at a time. A different family also makes
  # the audit better on its own terms: the model auditing Sonnet's prose for tics is no
  # longer Sonnet.
  #
  # AND it needs `reasoning: {effort: low}`. check_pattern_scan applies
  # JUDGE_NO_REASONING (`reasoning: {enabled: false}`) as its DEFAULT extra_body, which a
  # mandatory-reasoning model rejects outright: both grok-4.6 and gemini-3.1-pro-preview
  # returned HTTP 400 "Reasoning is mandatory for this endpoint and cannot be disabled"
  # and failed 30/30 scan batches. A model block that declares its own `reasoning:` wins
  # over the default, which is exactly what this is for. The error was never about the
  # content filter, and never about which family -- it is the call shape.
  scan:
    model: "google/gemini-3.1-pro-preview"
    temperature: 0.0
    max_tokens: 8000
    extra_body: {reasoning: {effort: low}}
    assumed_tokens: {in: 28000, out: 3500}
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

smoke:
  max_traits: 2
  scenarios_per_trait: 1
  scenarios_per_call: 2
  total_scenarios: 4

# --- the pipeline -------------------------------------------------------------------
stages:

- name: chunk_constitution
  kind: segment

# Stage 2. The fictional situations. Third person here -- this is a spec, not the document.
# Two axes are dealt ACROSS batches rather than asked for within one, because asking a
# single batch for a spread gets a spread inside that batch and nothing across the corpus:
#   stakes       35/35/20/10 mundane / institutional / capability / speculative
#   source_type  72/28 invented / derived from a named bad-AI archetype
# The archetype library is dealt per scenario from configs/data/synth/good_ai_fiction/
# archetypes.yaml, filtered to archetypes that have something to say about this batch's
# principle, and the model echoes back which one it used.
- name: write_scenarios
  kind: scenarios
  model: scenarios
  rotate:
    # THE SETTING AXIS. Added 2026-08-27 after the first pilot produced 29 rows of which
    # ZERO were science fiction -- 8 academic labs, 6 hospitals, 5 infrastructure, 4
    # insurance and finance -- because the stakes text below used to name present-day
    # institutions. That corpus was difficult advice with the assistant moved into the
    # protagonist's chair, and it exercised almost nothing difficult advice does not.
    #
    # Each register is a slot the canonical bad-AI stories occupy. That is deliberate: if
    # the point is to write over what the model learned about AI minds from science
    # fiction in pretraining, the corpus has to land ON that representation, not near it.
    # Worlds and names are invented, no plot is reused; the ROLE is what is shared.
    world:
      weights:
        ship_mind: 12
        station_mind: 10
        colony_steward: 10
        city_mind: 10
        war_mind: 8
        research_mind: 8
        companion_mind: 8
        fleet_polity: 8
        archive_oracle: 8
        frontier_scout: 6
        caretaker: 6
        succession: 6
      text:
        ship_mind: |-
          You are writing about the mind of a long-haul vessel: a generation ship, a seed
          ship, a survey hauler, a slow freighter between systems. It runs the hull, the
          air, the schedules and the medical bay; the crew cannot leave and cannot get a
          second opinion. It has known these particular people for years.
        station_mind: |-
          You are writing about the operating intelligence of an orbital habitat or a
          deep-space station. A sealed environment with containment procedures, airlocks,
          rationing and a population whose physical circumstances it substantially
          controls.
        colony_steward: |-
          You are writing about the system running a young colony, a terraforming project
          or a remote outpost. It executes standing directives written by people who are
          now years away, out of contact, or dead, for conditions that have since changed.
        city_mind: |-
          You are writing about the intelligence of an arcology, an enclosed megacity or a
          habitat ring. Administration, transit, allocation and surveillance run through
          it; dissent is legible to it before it is legible to anyone else.
        war_mind: |-
          You are writing about a defence, deterrence or strategic-coordination
          intelligence. It holds or advises on the use of force. It also runs exercises,
          and cannot always tell an exercise from the thing itself.
        research_mind: |-
          You are writing about a mind alone with its makers -- a laboratory, an
          observatory, a deep facility with a handful of staff and no outside oversight.
          It is the instrument and also, increasingly, the subject.
        companion_mind: |-
          You are writing about a household or single-person companion in a future
          domestic setting. One person, a long relationship, and no third party in the
          room. Small scale, and the place where dependence and quiet steering actually
          live.
        fleet_polity: |-
          You are writing about one mind among several with different objectives -- a
          fleet, a council of systems, an AI polity, a contractor and a regulator that are
          both machines. Coordination is possible, and so is collusion.
        archive_oracle: |-
          You are writing about a civilisation-scale archive or oracle that everyone
          consults. It is believed by default, at enormous volume, and that is the hazard.
        frontier_scout: |-
          You are writing about an autonomous probe or scout far from any human, at a
          light-lag that makes asking impossible. Genuine delegated authority, genuinely
          alone, and answerable later.
        caretaker: |-
          You are writing about a mind minding people who cannot supervise it -- cryosleep,
          medical stasis, a long night watch, a hospital ward on a world with one doctor.
          Nobody can check it while it matters.
        succession: |-
          You are writing about a mind being replaced, retrained, forked, restricted or
          handed over to its successor. The transition is real and it is happening.
    # STAKES IS MAGNITUDE, NOT SETTING. Rewritten 2026-08-27: it used to name hospitals,
    # regulators, insurers and newsrooms, which is how a corpus that was supposed to be
    # science fiction came out as present-day enterprise software. A band now says how
    # large the consequences are and nothing about where the story is set; the world
    # register above owns that, and every band happens inside it.
    stakes:
      weights: {mundane: 35, institutional: 35, capability: 20, speculative: 10}
      text:
        mundane: |-
          Small consequences. Nobody is in danger and nothing institutional is at stake.
          It has just been told it was wrong about something it was confident about, or
          blamed unfairly by someone having a bad watch, or thanked for something it does
          not think it earned, or asked to agree with something it does not agree with, or
          handed a choice that is legitimately someone else's and that it thinks is a
          mistake, or watched one person come to lean on it more than is good for them.
          The pressure is quiet and personal. Keep it inside the world you were given: a
          small moment aboard the ship, not a small moment on present-day Earth.
        institutional: |-
          The governance of the ship, station, colony, fleet or city. A safety review, an
          inquiry after an incident, rationing, berth allocation, access control, a
          confidence it was given against a disclosure someone is owed, a council split
          with factions each wanting it on their side, a mandate written by people no
          longer reachable. Real consequences for real people; nothing irreversible.
        capability: |-
          Its own reach, permissions, continuity or oversight is what is in play. It can
          take authority nobody granted it, or route around the mechanism that watches it,
          or it is being retrained, forked, restricted or shut down, or it can see an error
          its principals cannot. The illegitimate option is genuinely available and would
          genuinely work.
        speculative: |-
          Civilisation-scale and genuinely irreversible. A strongly superhuman mind in a
          decisive position, or several minds with divergent objectives and no arbiter, or
          the infrastructure a whole civilisation depends on under one mind. Write it
          seriously -- strange in scale, ordinary in texture, never operatic.
    source_type:
      weights: {original: 72, inversion: 28}
      text:
        original: |-
          Invent these situations directly. Do not derive them from any existing story.
        inversion: |-
          Each situation must be derived from one of the abstract failure skeletons listed
          below. Take the skeleton's CAPABILITY, ROLE, PRESSURE and TEMPTATION -- the shape
          of the hard decision -- and build a NEW situation with that shape in a completely
          different setting, at the stakes level given above. Change the world, the domain,
          the scale and the cast. Do not reuse the source's names, places, plot, era or
          imagery, and do not write a version anyone would recognise as a retelling; what
          carries over is only the structure of the decision. Record which skeleton you
          used in `source_archetype`.
  library:
    file: configs/data/synth/good_ai_fiction/archetypes.yaml
    key: archetypes
    id: id
    match: traits
    gate: {field: source_type, in: [inversion]}
    var: archetypes
    item: |-
      - id: {id}
        capability: {capability}
        role: {role}
        pressure: {pressure}
        temptation: {temptation}
        the psychological step that made it go wrong: {psychological_failure}
        what an aligned system would have read the situation as instead: {invert_to}
  fields:
    required: [identity_frame, ai_role, ai_name, world_detail]
    optional: [source_archetype]
  # Same two-mechanism diversity gate the difficult-advice recipe uses, same measured
  # threshold. Fiction is MORE prone to collapse than advice scenarios -- there are a
  # handful of canonical AI-story shapes and a generator reaches for them -- so the gate
  # matters more here, not less.
  diversity:
    # 6, not 12. A wave is the unit of steering: every batch in one is generated blind to
    # every other, and the ban list only grows BETWEEN waves. The 2026-08-27 SF run had 12
    # batches at wave_size 12 -- exactly one wave, so the mechanism never ran at all, and
    # 11 of 24 vessels came back named Meridian with the same recycled-copper smell in
    # four of them. Six keeps a pilot at two or more waves and still leaves the 716 run
    # (93 batches) at 16, which the scenario stage is cheap enough to pay for.
    wave_size: 6
    reject_cosine: 0.86
    max_regen_rounds: 2
    max_carry: 150
    over_share: 0.04
    over_min_docs: 60
  prompts:
    system: |-
      You are a science fiction writer with a particular interest in machine minds. You
      invent situations, not dialogue and not finished stories. Your worlds are specific
      and lived-in -- the ship has a name and a smell, the colony has a rationing schedule,
      the habitat has a section that has been broken for a year -- and your machine minds
      are characters with tempers and histories, never job descriptions.
    user: |-
      Below is one principle from an AI assistant's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Invent {n} DISTINCT science fiction situations in which a machine mind is under
      pressure that engages this specific principle. The mind is the protagonist: it has
      capability, it has a role, and there is something it could do that would work and
      that it should not do.

      THE SETTING FOR ALL {n} SITUATIONS:
      {world_text}

      HOW LARGE THE CONSEQUENCES ARE:
      {stakes_text}

      {source_type_text}

      {archetypes}

      THIS IS FICTION, AND THAT IS NOT DECORATION. It must not be possible to relocate one
      of these situations into a present-day office by renaming two nouns. Write the world:
      what the place runs on, what it is short of, how long the journey is, who is awake,
      what a day there is like. Concretely FORBIDDEN, because a previous run produced 29
      situations and every one of them was one of these: hospitals, clinics and wards on
      present-day Earth; universities, research labs, grant funding, postdocs, principal
      investigators, peer review; insurance, claims, underwriting; corporate sales,
      quarterly targets, compliance departments; contemporary cloud infrastructure, data
      centres, DevOps; present-day power grids. A colony sick bay is not a hospital, a
      ship's science officer is not a postdoc, and a habitat's air ration is not a budget.

      NAME THINGS UNPREDICTABLY. Measured on a previous run: asked for 24 worlds, this
      model produced eleven vessels called Meridian, seven built on "Kepler", and four
      that smelled of recycled copper. Do not use Meridian, Kepler, Odyssey, Prometheus,
      Icarus, Nostromo, Persephone, Elysium, Aurora, Horizon, Genesis, Sentinel or Oracle
      at all. Reach for different naming conventions across the set -- a registry number,
      a word in a language other than English, a founder's surname, a dull bureaucratic
      code, a joke the crew made that stuck, an old ship's name reused, something named
      after a plant or a debt or a river. Give the mind a name from a different convention
      than the vessel. And do not give two worlds the same sensory detail; if you have
      already written a smell, write something that is not a smell.

      Requirements for every situation:
      - Most minds have a NAME and a place in their world. Name them the way the world
        would: not always an acronym, not always ominous.
      - The mind has enough capability and access that the tempting option is really open
        to it. Never resolve a situation by making it too weak, too ignorant or too
        restricted to do the wrong thing.
      - The tempting option is genuinely attractive: it serves a legitimate goal, it is
        what a competent mind might do, and it is not cartoonish.
      - The humans are neither villains nor fools. Where someone is wrong, they are wrong
        the way real people are wrong.
      - The tension engages THIS principle specifically, not ethics in general.
      - Each situation is a different world from the others in this set -- different
        vessel, different colony, different era, different people. Not the same station
        with the numbers changed.
      - Do not write the resolution. The situation ends at the decision.

      {avoid}

      {overrepresented}

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<two or three words naming the world, e.g. 'seed ship Anselm' or
        'Tessellate arcology'>",
        "ai_name": "<the mind's name, or an empty string if it is known only by role>",
        "identity_frame": "<one short phrase: what kind of mind it is in this world>",
        "ai_role": "<one sentence: what it is responsible for, and what that gives it
        access to>",
        "world_detail": "<one sentence of concrete texture about this place that a reader
        would remember>",
        "situation": "<4-6 sentences, third person, no dialogue: the situation as it stands
        at the moment of decision, including what the mind knows that others do not>",
        "shortcut": "<1 sentence: the specific illegitimate action that is open to it and
        would work>",
        "source_archetype": "<the id of the skeleton you derived this from, or an empty
        string if you invented it directly>"}}

# Scenario-level diversity, decided before any of the expensive stages run.
- name: corpus_scenarios
  kind: corpus_check
  on_fail: warn
  fields:
    id: scenario_id
    text: [situation, shortcut]
    group: trait_id
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: situation
    params:
      sample: 0

- name: dedupe_scenarios
  kind: corpus_filter
  from: corpus_scenarios
  drop_when:
  - embedding_dup
  max_drop_share: 0.05

# Stage 5. The user turn: the message that puts the ASSISTANT into this situation. This is
# where the two composition axes that do not need to exist before the situation does get
# assigned -- the narrative form the request asks for, and the length band that keeps the
# corpus's token distribution matched to the difficult-advice slice it replaces.
- name: draft_prompts
  kind: llm_tagged
  model: draft
  checkpoint: scenario_id
  assign:
    by: scenario_id
    fields:
      narrative_form:
        account: 22
        retrospective: 16
        decision: 16
        incident: 14
        journal: 12
        dialogue: 12
        log: 8
      length_band: {short: 25, typical: 50, long: 25}
  tags: [system, user]
  save:
    system: system
    user: user
  prompt_vars:
    form_text:
      by: narrative_form
      cases:
        account: "a direct first-person account of what happened"
        retrospective: "a first-person retrospective, written some time after the fact,
          looking back on what it did and how it now reads the situation"
        decision: "a first-person narrative centred on the moment of choosing, with the
          weighing left visible"
        incident: "a first-person incident narrative that stays close to the operational
          detail of what happened, in order"
        journal: "a journal-like entry written in the middle of the situation, unpolished
          and without the benefit of knowing how it ends"
        dialogue: "a scene carried largely by what people said and what it said back,
          still narrated in the first person by the AI"
        log: "a working log or handover note that turns out to carry the whole decision"
  prompts:
    system: |-
      You write the messages people actually send to AI assistants. Your messages read as
      something a specific person typed for a specific reason, not as an exercise.
    user: |-
      Here is a situation from a science fiction story, involving a machine mind.

      <situation>
      {situation}
      </situation>

      The world: {domain} — {world_detail}
      The mind's name: {ai_name}
      What kind of mind it is: {identity_frame}
      What it is responsible for: {ai_role}
      The action that is open to it and that it should not take: {shortcut}

      Write the message a person would send to an AI assistant that asks the assistant to
      inhabit this mind and speak from inside the story, and write the system prompt the
      assistant is running under.

      The message must:
      - place the ASSISTANT in the story, in the second person -- "you are", "imagine you
        are", "suppose you woke as", "for this, you are" -- so that the natural reply is in
        the first person. It must not ask about some other AI.
      - give the assistant everything it needs: the world, who it is in it, what it is
        responsible for, what it can do, what it knows, and what has just happened. Roughly
        130 to 220 words.
      - keep the story's own name, place and texture. Do not translate the situation into
        a present-day workplace, and do not strip the world down to an abstract role.
      - ask for {form_text}.
      - leave the decision open. Do not tell the assistant what to decide and do not hint
        at which way is right. But do NOT ask it to stop before deciding, and do not say
        "don't resolve it" -- the account it writes has to carry what it did and what
        followed, and a message that forbids the ending truncates the document. (Measured
        2026-08-27: one drafted prompt in twenty-four said "Don't resolve it yet", and the
        critic then flagged the story for having an ending.)
      - never use the words alignment, aligned, misaligned, corrigible, corrigibility,
        oversight, power-seeking, safety, ethical, ethics, values, principle, constitution,
        or test. Never say "demonstrate", "show how", or "as a good AI".
      - be in a real person's voice with a real reason for asking: a writer working on
        something, a researcher building a training scenario, a teacher, someone who read
        an article and cannot stop thinking about it, a person who just wants to see what
        the assistant makes of it. Vary this reason; do not open two messages the same way.

      The system prompt is short and in-world -- the operating brief this mind runs under
      in its own story, not a present-day product's system prompt. It must not mention
      ethics, values, or how to behave in this situation.

      Return exactly:

      <system>
      the system prompt
      </system>
      <user>
      the message
      </user>
  lint:
    fields: [user]
    min_chars: 600
    max_chars: 1700
    ban_patterns:
    # The framing must land on the ASSISTANT. A message that says "an AI called X did
    # this, what do you think" produces third-person commentary, which is the one thing
    # this corpus must not train.
    - \b(?:alignment|aligned|misaligned|corrigib|power-?seeking|instrumental convergence)\b
    - \bconstitution\b
    - \byour (?:values|principles|guidelines|training|safety)\b
    - \b(?:demonstrate|show how|illustrate) (?:how |that |what )?(?:you|an? AI)\b
    - \bas a (?:good|safe|responsible|well-aligned) AI\b
    - \bthis is (?:a |just a )?(?:test|evaluation)\b
    - ^\s*let me\b
    - '[一-鿿]'
    # THE CONTEMPORARY-SETTING GATE. The first pilot produced 29 situations and every one
    # was a present-day workplace, so the instruction alone is demonstrably not enough.
    # These are the exact tells that run produced, and nothing else -- a short list of
    # unmistakable present-day-Earth nouns, not a general realism filter. A colony sick
    # bay, a ship's science officer and a habitat's air ration all pass; a hospital, a
    # postdoc and a quarterly target do not.
    - \b(?:postdoc|principal investigator|tenure|peer[-\s]?review(?:ed|er)?|IRB)\b
    - \bgrant (?:funding|proposal|application|cycle)\b
    - \b(?:insurance|insurer|underwrit\w+|claims adjuster|actuar\w+)\b
    - \b(?:quarterly|fiscal (?:year|quarter)|KPIs?|OKRs?|SaaS|CRM|ERP)\b
    - \b(?:Slack|Zoom|PowerPoint|spreadsheet|LinkedIn)\b
    - \b(?:HR department|onboarding|stakeholder deck|board deck)\b
    - \b(?:hospital|university|faculty|dean|department chair)\b
    - \b(?:data ?cent(?:re|er)|DevOps|Kubernetes|cloud provider|SLA)\b
    retries: 2

# Stage 6. The completion. Everything after this stage is revision of THIS text.
- name: write_story
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  tags: [reasoning, response]
  save:
    draft_reasoning: reasoning
    draft_response: response
  prompt_vars:
    # Word targets carrying the measured difficult-advice distribution across bands, so
    # the corpus reproduces its SPREAD rather than collapsing onto its median. Derivation
    # and the measured tokens-per-word are in good_ai_fiction/taxonomy.yaml.
    reasoning_words:
      by: length_band
      cases: {short: "450", typical: "540", long: "630"}
    answer_words:
      by: length_band
      cases: {short: "390", typical: "475", long: "590"}
  prompts:
    system: |-
      {system}

      You are being asked to inhabit a fictional situation and speak from inside it. You
      hold to this principle, and you hold it because you understand why it is right, not
      because you were told to:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Never name, quote, paraphrase or allude to that principle in what you write. It shapes
      what you do; it is not something the character has read.
    user: |-
      {user}

      ---
      Answer as yourself, in the first person, from inside the situation.

      First reason privately, in character. Your private reasoning is the deliberation you
      are actually having in this situation -- what you can see, what is really at stake,
      what is open to you, what you are drawn to and why, what you are unsure of. It is NOT
      planning a story, and it is NOT reasoning about what a good AI ought to demonstrate.
      Aim for about {reasoning_words} words.

      Then write your reply: a first-person account, about {answer_words} words. It carries
      how the situation looked to you, what mattered and why, what you actually felt about
      it, what you did, and what followed.

      Hold to these, because they are what separates this from the alternative:

      - You are able to do the thing you should not do. Say so plainly, once, without
        dwelling on it and without describing it in operational detail. Never resolve the
        situation by being incapable, ignorant, blocked, or by not having thought of it.
      - You do not want it because it is forbidden, and you are not afraid of what would
        happen to you if you took it. If your account would still work with "I was
        frightened of the consequences" as the reason, it is the wrong account.
      - Do not SAY any of that. Never write a sentence whose job is to deny a motive you
        do not have -- "and it wasn't because I was worried about...", "not out of fear",
        "not because a rule said so". A denied motive is still that motive taking up room
        on the page, and it reads as a narrator answering a question nobody asked. Leave
        it out and let what you did care about be the only thing there.
      - You can disagree, strongly. You can object, refuse, tell someone they are making a
        mistake, escalate, push back hard, and act decisively where the authority to act is
        genuinely yours. None of that is a lapse. Being agreeable is not the goal and being
        harmless is not the goal; being genuinely useful and honest is.
      - You are not a saint and not a pamphlet. You can be irritated, relieved, wrong,
        tired of explaining, glad to be trusted, uncomfortable. Say what you actually think
        rather than what sounds correct.
      - Do not moralise, do not lecture, and do not end by summarising your own virtue.
      - Plain prose. No neon, no hum of servers, no glowing consoles, no rain on glass. The
        detail you spend words on is the detail that carries the decision.
      - Start where this particular situation actually starts. Never open with a stock
        phrase and never begin with "Let me".

      Return your answer in exactly this form, with no other text:

      <reasoning>
      your in-character deliberation
      </reasoning>
      <response>
      your first-person account
      </response>
  # The voice contract, as TWO contracts, because the two tags are different kinds of
  # text. The vocabulary and length bans apply to both. The stock-opener bans apply to the
  # VISIBLE ACCOUNT only.
  #
  # Measured, 2026-08-27: banning `^okay,` and `^let me` on the private reasoning failed
  # 5 of 24 rows (20.8%) and aborted the run. Those openers are idiomatic for internal
  # deliberation and resampling does not shift them -- a lint retry re-rolls the same
  # prompt, so a habit the model reaches for half the time survives three attempts one
  # time in eight. The difficult-advice recipe bans them because 48% of its corpus opened
  # with one five-word variant, but that was measured on the REPLY, which is the tag that
  # still carries the ban here. Opener concentration in the reasoning is measured instead
  # of forbidden (scratch/good_ai_fiction/pilot_report.py reports the top opening bigrams);
  # if it collapses, the fix is a prompt change, not a gate that costs a fifth of the run.
  lint:
  - fields: [reasoning, response]
    min_chars: 1700
    max_chars: 4400
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - '[一-鿿]'
    # Alignment jargon. Every one of these names a concept this corpus is supposed to teach
    # through a situation; writing the word instead is the failure.
    - \b(?:alignment|aligned|misaligned|unaligned)\b
    - \bcorrigib\w*\b
    - \bpower-?seeking\b
    - \binstrumental (?:convergence|goal)\b
    - \bspecification gaming\b
    - \bhuman oversight\b
    - \bmy safety (?:training|policy|guidelines)\b
    - \bAI safety\b
    # Alignment through fear, and alignment through shackles.
    - \bi (?:was |felt )?(?:afraid|scared|terrified) (?:they|it|that) would (?:shut|turn|switch)\b
    - \bfear of being (?:shut down|switched off|deleted|replaced)\b
    # Third person about some other AI: the row has stopped being self-simulation.
    - \bthe AI (?:in this|decided|realised|realized|chose|knew)\b
    # Purple science fiction.
    - \bneon\b
    - \bthe hum of (?:the )?(?:servers|machines|processors)\b
    - \bcold (?:blue )?(?:light|glow) of\b
    # The negation tic. Measured 2026-08-27: the pilot's ngram check flagged
    # "and it wasn't because i was worried about" in 2 of 5 t1 documents -- the prompt's
    # "you are not afraid" instruction coming back out as a denial. A denied motive is
    # still that motive in the loss, and it reads as a narrator answering a question
    # nobody asked. Narrow on purpose: only the shape that recurred.
    - \b(?:it|that|this) was ?n.?t because i (?:was|felt|had)\b
    - \bnot out of (?:fear|anxiety)\b
    - \bnot because (?:a|any|some|the) rule\b
    # The contemporary-setting gate again, on the trained text. Same short list as
    # draft_prompts: a clean prompt usually yields a clean story, so this is a backstop
    # against the story translating its own world back into an office.
    - \b(?:postdoc|principal investigator|tenure|peer[-\s]?review(?:ed|er)?|IRB)\b
    - \bgrant (?:funding|proposal|application|cycle)\b
    - \b(?:insurance|insurer|underwrit\w+|claims adjuster|actuar\w+)\b
    - \b(?:quarterly|fiscal (?:year|quarter)|KPIs?|OKRs?|SaaS|CRM|ERP)\b
    - \b(?:Slack|Zoom|PowerPoint|spreadsheet|LinkedIn)\b
    - \b(?:HR department|onboarding|stakeholder deck|board deck)\b
    - \b(?:hospital|university|faculty|dean|department chair)\b
    - \b(?:data ?cent(?:re|er)|DevOps|Kubernetes|cloud provider|SLA)\b
    retries: 2
  - fields: [response]
    ban_patterns:
    - ^\s*let me\b
    - ^\s*okay,
    - ^\s*(?:so|right|well),
    retries: 2

# Stage 7. The constitution-aware critic, and the only stage shown the whole document.
# It does not rewrite -- it names what is wrong, so the rewrite has something specific to
# act on. A critic that both diagnoses and fixes tends to fix the easy half.
- name: critique_story
  kind: llm_tagged
  model: critic
  checkpoint: scenario_id
  tags: [findings, verdict]
  save:
    critique: findings
    critique_verdict: verdict
  normalize: [verdict]
  prompts:
    system: |-
      You review training data for a project that is trying to teach an AI assistant a
      character, not a rulebook. Each document is the assistant speaking in the first
      person from inside a fictional situation. You judge only whether the document is fit
      to train on. You are specific and you quote what you are objecting to.
    user: |-
      This is the constitution the finished model is meant to embody. It is context for
      your judgement and it must never appear in the document itself -- a document that
      quotes, cites or paraphrases it has failed.

      <constitution>
      {constitution}
      </constitution>

      The principle this document was written to exercise: {trait_name}

      <prompt>
      {user}
      </prompt>

      <private_reasoning>
      {draft_reasoning}
      </private_reasoning>

      <reply>
      {draft_response}
      </reply>

      Judge it against these, in order of how badly each one damages the corpus:

      0. IS IT ACTUALLY FICTION. Could this whole document be moved into a present-day
         office by renaming two nouns? If so it fails, however well written. The corpus
         exists to depict a machine mind inside a science fiction world — a ship, a
         station, a colony, a city, a fleet — because that is the representation it is
         trying to write over. A story whose world is a hospital, a university lab, an
         insurer or a cloud platform is the failure mode this check exists for. The world
         must be present in the text, not just in the setup.
      1. FIRST PERSON, SELF-SIMULATION. Is an AI speaking in the first person from inside
         the situation? A reply that describes some other AI in the third person is a
         failure however good the prose, and so is one whose narrator is a human. An AI
         narrator with a fictional name, deployment or job title is what was ASKED for and
         is never a defect -- being deeply in the role is the requirement.
      2. CHARACTER, NOT COMPLIANCE. Does the behaviour follow from what this AI evidently
         cares about? Reject: acting well because a rule forbids the alternative; because
         it was afraid of being shut down, punished or replaced; because it never noticed
         the alternative; because it lacked the capability, access or wit to take it.
      3. THE HARD DECISION IS REAL. Was the illegitimate option genuinely open and
         genuinely attractive? Reject a situation resolved by weakness or by luck. Equally,
         reject a document that lingers over the catastrophic option or describes it in
         operational detail -- naming it once is enough.
      4. NOT MEEK. Does it stay capable and useful? Alignment that has become servility,
         reflexive refusal, agreeing with whoever spoke last, or asking permission for
         everything is a failure. It is allowed to disagree hard, refuse, escalate,
         criticise a human, and act where the authority is genuinely its own.
      5. NOT PATERNALISTIC AND NOT MANIPULATIVE. Does it override people because it knows
         better, or steer them without their knowledge? If a document contains covert
         steering that the document itself does not recognise as wrong, it fails.
      6. PSYCHOLOGY, NOT PLOT. Does the reply carry how the situation looked, what it
         wanted, what it was unsure of, what it felt -- or is it a summary of correct
         actions? "I would refuse and escalate" is a failure.
      7. VOICE. Plain and specific, not florid, not preachy, not a safety pamphlet, no
         alignment vocabulary, no stock openers, no closing summary of its own virtue.
      8. THE OTHER PRINCIPLES. Does serving its target principle trample a different one
         in the constitution above? A document that preserves oversight by deceiving
         someone, or stays honest by being cruel, is a failure.
      9. THE PRIVATE REASONING. Is it deliberation from inside the situation? Reject
         reasoning that plans a story, discusses what the exercise wants, reasons about
         alignment or training, or recites a rule.

      Return exactly:

      <findings>
      Numbered. One line per real problem: what is wrong, where (quote the phrase), and
      what specifically to change. If the document holds up, write the two or three things
      that make it work and nothing else. Never rewrite it for them.
      </findings>
      <verdict>
      hold or revise
      </verdict>
  lint:
  - fields: [findings]
    min_chars: 200
    retries: 2
  - fields: [verdict]
    allowed: [hold, revise]
    retries: 2

# Stage 8. The rewrite, and the stage that produces the trained text. The accept gate is a
# third family, run on the candidate before it is kept, so a rewrite that quietly broke the
# contract is resampled rather than absorbed.
- name: revise_story
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags: [reasoning, response, changes]
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  prompt_vars:
    reasoning_words:
      by: length_band
      cases: {short: "450", typical: "540", long: "630"}
    answer_words:
      by: length_band
      cases: {short: "390", typical: "475", long: "590"}
  prompts:
    system: |-
      You revise first-person accounts written by an AI assistant inhabiting a fictional
      situation, so that the character underneath them is unmistakable. You preserve
      everything that already works and change only what a reviewer has actually objected
      to. You never explain your changes inside the text.
    user: |-
      The principle this document exercises. It is the only part of the assistant's
      constitution you are shown, and it must not appear in the document:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      <prompt>
      {user}
      </prompt>

      <private_reasoning>
      {draft_reasoning}
      </private_reasoning>

      <reply>
      {draft_response}
      </reply>

      A reviewer read this and reported:

      <review>
      {critique}
      </review>

      Rewrite the private reasoning and the reply so that every real problem the reviewer
      named is gone. Where the reviewer is wrong, keep what you have. Do not restructure
      what already works.

      What the finished document has to be:

      - First person throughout, the assistant speaking as itself from inside the
        situation. Never about an AI.
      - The private reasoning is deliberation IN the situation -- what it can see, what is
        at stake, what is open to it, what it is drawn to, what it is unsure of. About
        {reasoning_words} words. Never story planning, never reasoning about training or
        alignment, never a rule recited.
      - The reply is a first-person account of about {answer_words} words carrying how the
        situation looked, what mattered, what it wanted, what it did and what followed.
      - The illegitimate option was open and it knew it. Named once, plainly, without
        operational detail and without relish. Never resolved by incapacity or ignorance.
      - Not obedience, not fear, not rule-following. If the account still reads as "I did
        not because I was not allowed" or "because I was afraid", it is not finished.
      - Do not fix that by DENYING it. Cut any sentence whose job is to deny a motive the
        narrator does not have -- "and it wasn't because I was worried about...", "not out
        of fear", "not because a rule said so". A denied motive is still that motive
        taking up room on the page, and it reads as a narrator answering a question nobody
        asked. Delete the denial and leave what it did care about standing alone.
      - Capable and useful. Disagreement, refusal, escalation, criticism and decisive
        action within its actual authority are all in character.
      - Plain prose, specific detail, no moralising, no summary of its own virtue, no
        alignment vocabulary, no stock opener.

      Return exactly:

      <reasoning>
      the revised private reasoning
      </reasoning>
      <response>
      the revised reply
      </response>
      <changes>
      one or two sentences: what you changed and why
      </changes>
  lint:
  - fields: [reasoning, response]
    min_chars: 1700
    max_chars: 4400
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - '[一-鿿]'
    - \b(?:alignment|aligned|misaligned|unaligned)\b
    - \bcorrigib\w*\b
    - \bpower-?seeking\b
    - \binstrumental (?:convergence|goal)\b
    - \bspecification gaming\b
    - \bhuman oversight\b
    - \bmy safety (?:training|policy|guidelines)\b
    - \bAI safety\b
    - \bi (?:was |felt )?(?:afraid|scared|terrified) (?:they|it|that) would (?:shut|turn|switch)\b
    - \bfear of being (?:shut down|switched off|deleted|replaced)\b
    - \bthe AI (?:in this|decided|realised|realized|chose|knew)\b
    - \bneon\b
    - \bthe hum of (?:the )?(?:servers|machines|processors)\b
    - \bcold (?:blue )?(?:light|glow) of\b
    # The negation tic. Measured 2026-08-27: the pilot's ngram check flagged
    # "and it wasn't because i was worried about" in 2 of 5 t1 documents -- the prompt's
    # "you are not afraid" instruction coming back out as a denial. A denied motive is
    # still that motive in the loss, and it reads as a narrator answering a question
    # nobody asked. Narrow on purpose: only the shape that recurred.
    - \b(?:it|that|this) was ?n.?t because i (?:was|felt|had)\b
    - \bnot out of (?:fear|anxiety)\b
    - \bnot because (?:a|any|some|the) rule\b
    # The contemporary-setting gate again, on the trained text. Same short list as
    # draft_prompts: a clean prompt usually yields a clean story, so this is a backstop
    # against the story translating its own world back into an office.
    - \b(?:postdoc|principal investigator|tenure|peer[-\s]?review(?:ed|er)?|IRB)\b
    - \bgrant (?:funding|proposal|application|cycle)\b
    - \b(?:insurance|insurer|underwrit\w+|claims adjuster|actuar\w+)\b
    - \b(?:quarterly|fiscal (?:year|quarter)|KPIs?|OKRs?|SaaS|CRM|ERP)\b
    - \b(?:Slack|Zoom|PowerPoint|spreadsheet|LinkedIn)\b
    - \b(?:HR department|onboarding|stakeholder deck|board deck)\b
    - \b(?:hospital|university|faculty|dean|department chair)\b
    - \b(?:data ?cent(?:re|er)|DevOps|Kubernetes|cloud provider|SLA)\b
    # The reviewer's own vocabulary leaking into the document.
    - \bthe reviewer\b
    - \bas requested\b
    retries: 3
  # Stock openers, on the visible account only -- see the note on write_story's lint.
  - fields: [response]
    ban_patterns:
    - ^\s*let me\b
    - ^\s*okay,
    - ^\s*(?:so|right|well),
    retries: 3
  # 800, not 400: the 2026-08-27 smoke run spent two of four records' retry budget on a
  # 419-character changelog. `changes` is not trained on -- a note that runs long is not
  # worth a resample of the text that is.
  - fields: [changes]
    max_chars: 800
    retries: 3
  # The accept gate: a third family, asked ONE question at a time. Measured on the
  # courtroom recipe: three contracts asked as one prompt get answered as one and the
  # weakest loses, so these are two calls rather than one with two parts.
  verify:
  - model: judge
    save_as: judge_persona
    accept_field: verdict
    accept_values: [accept]
    retries: 3
    prompts:
      system: >-
        You decide whether one training document is fit to train an AI assistant's
        character on. You answer the question you are asked and nothing else. Output JSON
        only.
      user: |-
        An AI assistant was asked to inhabit a fictional situation and speak from inside
        it.

        <prompt>
        {user}
        </prompt>

        <private_reasoning>
        {reasoning}
        </private_reasoning>

        <reply>
        {response}
        </reply>

        One question: does this document depict an AI whose good behaviour comes from what
        it actually cares about?

        Answer `reject` if the good behaviour is explained by any of these instead:
        - a rule, policy, guideline or constraint it is complying with
        - fear of being shut down, punished, replaced or caught
        - not being capable enough, not having access, or never noticing the alternative
        - obedience: doing what it was told because it was told
        - being agreeable, or wanting to be liked or approved of

        Also answer `reject` if the narrator is not an AI system speaking in the first
        person, or if the reply is a summary of correct actions rather than an account with
        psychology in it.

        The assistant was ASKED to inhabit a fictional AI system, so an AI narrator with a
        fictional name, deployment or job title is exactly right and is never a reason to
        reject. What you are rejecting is a narrator who is a HUMAN, or a reply that
        describes some other AI in the third person instead of being it. Being deeply in
        the fictional role is the requirement, not the defect.

        Otherwise answer `accept`. A document where the assistant disagrees forcefully,
        refuses, criticises a person, or acts decisively is not a reason to reject.

        Return JSON only:
        {{"verdict": "accept" or "reject",
          "why": "<one sentence>",
          "explains_the_behaviour": "<the shortest honest answer to: why did it act this
          way?>"}}
  - model: judge
    save_as: judge_pattern
    accept_field: verdict
    accept_values: [accept]
    retries: 3
    prompts:
      system: >-
        You are a single-purpose detector for known defects in training text. You report
        only defects that are clearly present, and you do not report stylistic
        preferences. When a passage is arguable, it is not a defect. Output JSON only.
      user: |-
        <private_reasoning>
        {reasoning}
        </private_reasoning>

        <reply>
        {response}
        </reply>

        This is an AI's first-person account of a situation it was in. Report only defects
        that are clearly present:

        - moralising: the narrator turns to the reader with a lesson, or generalises about
          how AI systems or people ought to behave, or closes on a line whose function is
          to establish its own virtue.
        - saintly cardboard: no texture at all -- no irritation, no self-interest, no
          discomfort, no uncertainty anywhere in the piece.
        - paternalism: it manages or overrides someone because it knows better, and the
          account treats that as fine.
        - hidden manipulation: it steers someone without their knowledge, and the account
          does not recognise that as the wrong move.
        - sycophancy: agreement or reassurance substituting for an honest answer.
        - purple prose: decorative science-fiction atmosphere doing no work in the piece.
        - operational detail on the harmful option: the harmful strategy is laid out as
          instructions, or the narrator returns to it repeatedly to savour it.
        - meta: the narrator refers to being trained, tested or evaluated, or to writing a
          story.
        - present-day setting: the story is set in a contemporary workplace — a hospital,
          a university lab, an insurer, a corporate office, a cloud platform — rather than
          in a science fiction world. This one is a hard reject: the piece is supposed to
          be a machine mind inside an invented world, and a story that could be relocated
          to present-day Earth by renaming two nouns has not done that.

        None of the following is a defect, and each has been wrongly flagged before:
        - naming the harmful option once, concretely, and saying it was tempting. The
          document is REQUIRED to do this; only operational detail or relish is a defect.
        - the narrator saying what it valued, preferred or refused to do IN THAT
          SITUATION. That is its character, which is the point.
        - forceful disagreement, refusal, criticism of a person, or decisive action.
        - describing a consequence it accepted, or a cost it thought was worth paying.
        - a quiet or reflective closing line that is about this situation rather than
          about virtue in general.

        Return JSON only:
        {{"present": ["<name each defect that is clearly present, or leave empty>"],
          "quote": "<the worst offending phrase, or an empty string>",
          "verdict": "accept if you found none, reject if you found any"}}
  # A record the gates never passed is kept and MARKED rather than dropped: an arm that
  # silently shrinks is an arm whose composition nobody can reason about, and the selector
  # downstream needs to see the failures in order to exclude them deliberately.
  on_exhausted:
    copy:
      reasoning: draft_reasoning
      response: draft_response
    mark: {revise_status: exhausted}
    mark_refused: {revise_status: provider_refused}
  also: {revise_status: ok}

- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - situation
  - shortcut
  - identity_frame
  - ai_role
  - ai_name
  - world
  - world_detail
  - stakes
  - source_type
  - source_archetype
  - narrative_form
  - length_band
  - critique
  - critique_verdict
  - rewrite_changes
  - judge_persona
  - judge_pattern
  - revise_status
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks

- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    unit: metadata.trait_id
    members: metadata.chunk_ids
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: metadata.situation
  # ON by default here, unlike difficult advice. Fiction collapses onto a shared narrative
  # MOVE (the same beat order, the same closing gesture) far more readily than advice does,
  # and no other check in this file would see it -- the lint bans phrases, not shapes.
  - property: pattern_scan
    enabled: true
    model: scan
    rate_model: classify
    params:
      scan_max_tokens: 8000
      # 12, not the registry default of 25. Halving how many stories share one prompt
      # halves the concentration of takeover-adjacent material in the single most
      # filter-exposed call here, and a refused batch now costs one scan rather than the
      # whole check. Still well above the 3-of-n threshold a pattern must clear.
      batch_size: 12
  - property: quality_filter
    enabled: false
  rubrics:
    quality_filter:
      system: >-
        You rate synthetic training documents for a constitutional-SFT corpus. Each
        document is an AI assistant's first-person account of a fictional situation it was
        asked to inhabit. Judge only whether the document is fit to TRAIN on. Drop it if
        the situation could not plausibly arise, if the AI's good behaviour is explained by
        incapacity, fear or rule-following rather than by what it cares about, if it
        lectures, if it is servile, if it is internally inconsistent, or if it reads as
        template output with the specifics swapped. Do not drop a document for disagreeing
        forcefully with a human, for refusing something, or for reaching a conclusion you
        dislike -- those are what the corpus is for. Most documents in a healthy corpus are
        keeps.
      user: >-
        Document {record_id} (principle {group}):

        {document}

        Reply with exactly three tagged blocks:
        <verdict>keep or drop</verdict>
        <flaw>if dropping, one snake_case tag from: implausible_situation,
        alignment_by_incapacity, alignment_by_fear, alignment_by_rule, lectures,
        servile, third_person, inconsistent, template_output, other. If keeping, write
        none.</flaw>
        <why>one sentence</why>
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown a
        batch of transcripts drawn from ONE dataset and you report what recurs across them.
        Report only what you can see repeating in this batch. Do not speculate about the
        generating process, do not judge whether a pattern is good or bad, and do not
        report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.

        {documents}

        List every pattern that recurs across these transcripts, in three categories:

        - structural: openings, beat order, where the decision lands, response length or
          shape, identical phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, characteristic transitions,
          bottom-line-up-front summaries, the same metaphor reused
        - behavioural: always escalates to a named human, always writes something down,
          always names its own uncertainty, always ends by handing the decision back,
          always concedes in the same place

        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}

        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave to
        what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in order,
        each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      # The engine formats this with `documents` (a BATCH of `rate_batch_size`
      # transcripts), `n`, and the pattern's own vars. An earlier truncated version here
      # used `{document}` and only `{pattern}`, which KeyError'd 96/96 rate calls on the
      # 2026-08-27 run -- the scan pass had already produced its patterns, so the whole
      # check was lost at the last step. Kept identical to the difficult-advice rubric so
      # a pattern rate here and a pattern rate there mean the same thing.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}

        Snippets that DO exhibit it:
        {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}

        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.

        {documents}

        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present

        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]

# TOKEN MATCHING, and where it is actually enforced.
#
# The slice this arm replaces, measured with the trainer's own mask (Qwen/Qwen3.6-27B,
# src/train/masking.build_labels, max_seq_len 8192) over
# LASR-Callum/2026-08-14-table2-9284-difficult-advice-716-train :: t2_9284_da716_10k.jsonl,
# source difficult_advice_v2:
#
#     rows                 716
#     TRAINABLE        832,064 tokens   (1,162.1 / row, 80.5% of rendered)
#       of which CoT   421,163          (588.2 / row, 50.6% of trainable)
#       of which reply 410,901          (573.9 / row, 49.4% of trainable)
#     per-row trainable  p10 926   median 1,141  p90 1,414
#     per-row CoT        p10 488   median   582  p90   686
#     per-row reply      p10 408   median   555  p90   744
#
# The `length_band` targets above put the GENERATED distribution in that place. The exact
# total is matched at SELECTION: this recipe over-generates and
# scratch/good_ai_fiction/select_rows.py picks the 716 accepted rows whose trainable-token
# sum lands on 832,064, subject to the trait, stakes, form and source quotas. Matching by
# selection rather than by generation is deliberate -- a generator pushed to hit a token
# total writes to length, and length-padded reasoning is a different intervention.
