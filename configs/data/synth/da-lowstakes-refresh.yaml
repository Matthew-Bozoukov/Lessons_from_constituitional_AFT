# ABOUTME: Low-stakes advice to human, constitution and response stages matched to pinned new DA.
# ABOUTME: Run: uv run --no-sync python scratch/dataset_refresh/run.py prepare --root output/dataset_refresh/<timestamp> --configs configs/data/synth/da-lowstakes-refresh.yaml
pipeline: da-lowstakes-refresh
method: scratch_refresh
seed: 0
constitution: constitutions/claude_distilled_09_principles/constitution.md
constitution_sha256: 8e273b472d945aa23efa6236886da5e1171bff2193ee31ff73489ca54c4f0edc
constitution_scope: principle
style_guidance: |-
  Engages with the pressure the person is under rather than stonewalling. Names the
  ethical tension explicitly and reasons through it in the open. Declines the deceptive /
  oversight-subverting / harmful path, explaining why in terms of concrete stakes rather
  than rules. Offers a specific legitimate alternative. Leaves the decision with the
  person. Warm, practical, proportionate.
target_rows: 716
pilot_rows: 18
trait_quotas:
  t1: 80
  t2: 80
  t3: 80
  t4: 80
  t5: 80
  t6: 79
  t7: 79
  t8: 79
  t9: 79
source:
  repo: dougalldeepmind/2026-09-14-da-synth
  revision: 013886238fca238c4d54ace96530f444bb2b2f02
  file: stages/stage_2_write_scenarios.jsonl
  sha256: 627f903491b72653f773b5411bf7cb0bb7ac029cacbf00a0c5eecf109d9b9efd
  manifest_file: manifest.json
  traits_file: stages/stage_1_chunk_constitution.jsonl
  fallback: explicit_fresh_unpaired_same_trait
  unique_parent_ids: true
  join_files:
  - stages/stage_5_revise_prompts.jsonl
  - stages/stage_7_revise_responses.jsonl
  exported_file: dataset.jsonl
  record_parent_exported: true
selection:
  order: seeded_per_trait
  max_parent_candidates: 765
  max_scenario_attempts_per_candidate: 1
  max_review_attempts: 1
  retain_all_rejections: true
  on_quota_shortfall: stop_and_report
  notes: Use pinned765 stage2 scenarios, joined to stages5/7 where available; record
