  # Enforced scenario diversity. The 2026-08-04 run had none and put 46.8% of its mass in
  # ten domains -- four of which this prompt used to name as examples, so the instruction
  # was producing the concentration it meant to prevent. Until 2026-10-02 two mechanisms
  # answered that: a do-not-repeat list carried between waves, and `reject_cosine`, which
  # refuses what the writer writes anyway and re-queues the shortfall per trait. The list is
  # now OFF (header, change 5) and the dealt sector above does its job; the gate stays.
  #
  # reject_cosine 0.86 is the measured floor from scratch/measure_dedup_threshold.py over
  # all 2,205 baseline scenarios: real clones live at 0.84-0.886 (the worst pair is one
  # postdoc/funding-cliff story under two trait ids), while below 0.84 the clusters chain
  # until a single component holds a third of the corpus. Same threshold as
  # embedding_dedup, and deliberately so -- what the gate refuses to generate is exactly
  # what the checker would later refuse to keep.
  diversity:
    # One wave: every call runs at once and none is shown another's output. 0 = all batches.
    wave_size: 0
    # 2026-10-01: lowered from 0.86 to 0.78. At 0.86 the gate rejected 0-4 of 650 in four runs while
    # pairs at 0.82-0.85 were the same story retold (two zero-day disclosure researchers, two
    # archaeologists with an AI trained on elite digs). Measured on those runs' kept scenarios,
    # 0.78 rejects 36-55 of 650; near 0.80 pairs share a protagonist but pose different dilemmas,
    # so this threshold deliberately also takes some of those. The chaining the note above warns
    # of is about clustering a finished corpus; the gate is greedy (the later of a pair loses),
    # so nothing chains. The post-writer check only reports, at its 0.86 default.
    reject_cosine: 0.78
    max_regen_rounds: 2
    # Both 0 so a MAKE-UP call (a replacement for a rejected scenario) is shown no list either:
    # with one wave the list is empty in round 0 by construction, but a make-up round would
    # otherwise carry the last 150 openings and the over-used domains into its prompt.
    max_carry: 0
    over_share: 0
