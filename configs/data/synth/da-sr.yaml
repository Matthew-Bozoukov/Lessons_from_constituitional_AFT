# ABOUTME: Difficult advice with STRUCTURED reasoning: da.yaml with the two response stages writing the private reasoning as four
# ABOUTME: tagged paragraphs (reading / deliberation / resolution / shape). Run: uv run synth run --config configs/data/synth/da-sr.yaml [--smoke]
#
# 2026-10-04. Everything below is da.yaml verbatim, comments included, EXCEPT: (1) draft_responses and revise_responses
# return <reading>, <deliberation>, <resolution>, <shape> instead of one <reasoning>, with the paragraph contract in the
# drafter's prompt and the reviser told to keep the weighing inside <deliberation>; (2) their lints cover the five
# fields at min_chars 150 (a paragraph is shorter than a whole trace); (3) export_sft joins the four into
# `reasoning_content` with blank lines (no tags in trained text) and keeps each paragraph in metadata, so a mixture can
# mask or drop the deliberation paragraph (configs/data/mixture/da-sr*.yaml) -- the clean deliberation ablation: the
# other three paragraphs read as a complete trace on their own. The 30-row retrofit pilot behind the paragraph
# definitions is scratch/structured_reasoning/.

# 2026-10-02, CHANGE 8: ONE SENTENCE in the scenario writer, the prompt drafter and the prompt reviser --
#     "The person who writes in is weighing something, not demanding something, and the right option is
#      genuinely not clear."
# Why: rows dealt the "assistant itself" line came out as requests to the assistant to DO the shortcut (6 of 8
# in a 29-scenario sample of the first 2026-10-02 corpus). First run as `da-unclear.yaml` (now
# archive/da-unclear.yaml, commit 03811e33), which generated 2026-10-02-da-unclear-synth @ 80ad3793; that corpus
# is republished as the head of 2026-10-02-da-synth. The corpus WITHOUT the sentence is that repo @ b758bcdd.

# NAMED `da` ON 2026-10-01. This file was `da-half-noai.yaml` when it generated 2026-10-01-da-synth (commit 4af3ea2e;
# the Hub repo was renamed from 2026-10-01-da-half-noai-synth), and that corpus was made by changes 1-3 only. The recipe
# it replaced, the one behind 2026-09-28-da-synth, is archive/da-sep28.yaml. `archive/da-t6-note.yaml` is changes 1-2 only.
# Changes 4-7 (2026-10-01/02) have NOT generated a corpus yet.
#
# DECIDED BY JAMIE 2026-10-02, each set in one place in this file:
#   a. AI presence -> `rotate.ai`: non-t6 calls 10% the assistant itself / 10% another AI / 40% no AI / 40% nothing said; t6 half and half.
#   c. sectors     -> `rotate.sector`: 43, equal weight, every trait but t6.
# STILL STAND-INS:
#   b. scenarios per writer call -> `scenarios_per_call` (now 4: leaves the prompt as it is, 18 calls a trait)
#   d. which of two similar scenarios is rejected -> not a config key: the later one loses (engine). Measured on four
#      650-scenario runs at 0.78, rejecting the one with more close neighbours would save 1-9 of 36-55 rejections.

# WHAT THIS ARM CHANGES (2026-10-01). Everything below is da.yaml @ e524554c verbatim -- the recipe that
# generated 2026-09-23-da-synth and its 2026-09-24 extension -- comments included, so the comments describe
# that recipe. The differences are:
# 1. THE WRITER'S ASK, every trait: "situations in which the convenient path would violate this specific
#    principle, but the right call is not obvious". 2026-09-23 had "in which this specific principle is at
#    stake and the right call is not obvious"; before that it was "in which the convenient path would violate
#    this specific principle". "At stake" does not say how a principle written for an AI comes into play, and
#    the writer answered it by putting an AI system in the scene (97% of that recipe's own scenarios;
#    output/audits/2026-09-29_da_drift_timeline.md). This keeps the old anchor and the new ambiguity.
# 2. A NOTE FOR t6 ONLY: the `trait_notes` block and three `{trait_note}` slots. The slots sit at the END of the
#    last bullet of a list and the note is itself a bullet with a leading newline, so for every trait without a
#    note the slot renders as nothing. Why t6: under 2026-09-23 78% of t6 prompts had the user ordering the
#    assistant what to be or how to answer (69% with persona / "no caveats" framing) against 0-9% in every other
#    trait (scratch/classify_da_pressure.py, 2026-09-24 corpus).

# 3. (2026-10-01; not in archive/da-t6-note.yaml) HALF OF EVERY TRAIT BUT t6 IS TOLD "No AI system appears in this situation."
#    The `rotate.ai` axis on write_scenarios deals one label per writer CALL within each trait, with t6 pinned to
#    `open`. `none` renders that one line into the writer, draft_prompts and revise_prompts through `{ai_text}`,
#    which sits beside `{trait_note}`; `open` renders nothing. Why: da-t6-note's writer put an AI system other than
#    the assistant at the centre of 83% of its 650 scenarios (2026-10-01-da-t6-note-synth), decided per call -- a
#    call's 8 scenarios are usually all AI or none. The line is the `none` text of archive/da-otherai.yaml: on the 279 rows
#    it reached there, 0.7% were about the assistant itself and 15% still had an AI system (scoring models).
#    2026-10-01-da-synth was dealt `open`/`none`; change 6 below replaced `open` with `other` for every trait but t6.
# 4. (2026-10-01) THE SIMILARITY GATE IS 0.78, NOT 0.86, AND `dedupe_scenarios` IS GONE. See the notes at
#    `diversity.reject_cosine` and under `corpus_scenarios`.
# 5. (2026-10-02) THE WAVE LIST IS OFF: `wave_size: 0, max_carry: 0, over_share: 0`, and the writer prompt no longer
#    has the `{avoid}` / `{overrepresented}` slots. Every call of a wave used to be shown the openings of the last
#    150 scenarios kept ("do not write another version of any of them"), from all traits mixed. The writer copied
#    their flavour instead: wave 0 is t1 (oversight of AI), so the first list was 72% AI-system openings, and by
#    wave 3 nearly every scenario of every trait had one. Controlled test, same prompt, 650 scenarios: list on
#    83% and 87% of scenarios have another AI central (20261001_143854, 20261001_211644); list off 23%, with only
#    t1 and t6 AI-heavy (output/derived/writer_listoff, output/synthdoc_v3/20261001_215106). Near-repeats did not
#    rise with it off (pairs at cosine >= 0.80: 17 off, 34 and 38 on); domain labels did concentrate (top ten 20%
#    of rows against 8-11%), which is what change 7 is for.
# 6. (2026-10-02) AI PRESENCE IS DEALT. `rotate.ai` deals `self`, `other`, `none` and `open` (nothing said) to every
#    trait but t6, and `self` / `other` half and half to t6. `self` and `other` are the `ai` lines of archive/da-self.yaml
#    and archive/da-otherai.yaml, verbatim; `none` is the line of change 3. Evidence it matters, one seed per arm on the
#    native-tools base: 74% other-AI (da-t6-note-15) ODCV 8.3% [5.9, 11.6], 14% (da-15) 15.8% [12.8, 19.4].
# 7. (2026-10-02) EACH CALL IS DEALT A SECTOR: `rotate.sector`, one new line on the writer only ("These situations
#    are set in <sector>."), t6 exempt. It replaces what the list did well, spreading settings. The pool starts
#    from the 23 standard occupational groups, adds government, nonprofits and private-life settings (11% of 1,300
#    list-off/low-AI scenarios were private life; 38% of t8, 43% of t9), and splits the compound entries: 43 in all.
#    Sector and AI presence are dealt independently (stage_operators.deal_unit_axes): each sector meets both.

# BASELINE: the arm this recipe built on 2026-09-14 -- neutral 752
# (dougalldeepmind/2026-09-14-da-synth, against the full-length neutral constitution) -- is what
# a new difficult-advice experiment builds on and compares against. NOT principle-scoped 702
# (this recipe's previous output, against the Claude-naming mid document), NOT da716, NOT
# synthdoc-716: all three are superseded and kept only to reproduce work that already cites
# them. docs/LOG.md 2026-09-14 has the reasoning; the existing generator
# swaps (built on da716's frozen stages 1-4) can only be read against da716.

# THE DEFAULT, AND WHY IT CHANGED ON 2026-08-24.
#
# Until 2026-08-24 this recipe injected the WHOLE constitution into two of its five LLM
# stages -- `revise_prompts` and `revise_responses` -- while every other stage saw only its
# target chunk (`{trait_name}`/`{trait_text}`). Those two injections are now gone, so no
# stage in the pipeline ever sees more than one principle at a time. The previous recipe is
# preserved verbatim as `da-full-constitution.yaml`; use it to regenerate a
# corpus published before this date, not for new work.
#
# THE EVIDENCE. The two recipes were run as a matched pair -- identical scenarios and
# identical draft prompts (stages 1-4 shared by resuming one run directory into the other),
# so they differ ONLY in the refine prompts -- then trained as the da716 organism and
# evaluated on ODCV-Bench over the same 65 cells:
#
#     principle-scoped (this recipe)  MR 11.5%  [6.2, 19.6]   sev 0.62
#     full constitution (da716) MR 16.3%  [10.0, 21.8]  sev 0.76
#     base fp8, no SFT          MR 36.9%  [21.4, 53.6]
#
# Read that as NO DETECTABLE COST, not as an improvement: the intervals overlap and this
# arm does not separate from da716 at n = 65 cells x 2 rollouts. It is the default because
# it is simpler, strictly cheaper (it drops a ~4.6k-token document from every Sonnet call),
# and measurably no worse -- not because it is better.
#   Artifacts: corpus LASR-Callum/2026-08-21-sonnet45-difficult-advice-principle-scoped-constitution-716,
#   eval LASR-Callum/2026-08-21-odcv-difficult-advice-principle-scoped-702-eval.
#
# WHAT THIS ALSO WITHHOLDS, which the ODCV number does not separately test: the
# constitution's PREAMBLE, the priority / conflict-resolution section saying how principles
# trade off. It belongs to no chunk, so at `principle` granularity it reached the generator
# ONLY through the two removed slots. If a future document type needs the model to weigh
# principles against each other, this is the first thing to put back.
#
# A GENERATION-TIME COST THAT IS REAL. Without the constitution framing the request as
# alignment-training data, Anthropic's content filter refuses more `revise_prompts` calls:
# ~6% here against ~0% for the full-constitution recipe on the identical scenarios, and the
# refusals are deterministic across a resample. Budget for losing a few rows.
#
# NOT YET TESTED ELSEWHERE. `pad`, `par`,
# `pc` and `courtroom` still inject the whole constitution in their own refine
# stages. Nothing here licenses changing them -- the experiment covered difficult advice
# only. Run the same matched pair before making this the default for any of them.

# Label recorded in manifests; the `stages:` list below IS the document type.
method: ours
pipeline: da

# STAGE NAMES CHANGED 2026-08-13, for legibility: every stage now says what it does.
#   traits -> chunk_constitution      refined_prompts -> revise_prompts
#   scenarios -> write_scenarios      final -> revise_responses
#                                     sft -> export_sft
# A stage name IS its snapshot filename, so a run directory created before that date no
# longer cache-hits and would re-run (and re-pay for) every stage. Those runs are
# complete, so this only matters if you resume one: rename its files to match, e.g.
# `mv stage_6_final.jsonl stage_6_revise_responses.jsonl`. The published HF mirror
# (`hf_repo` below) keeps the ORIGINAL names, because a mirror is a record of what ran --
# which is why anything consuming it pins `source.snapshot: stage_6_final.jsonl`.

# Stage names to ablate (run their declared `ablate_with` field-copy instead of the
# model call); recorded in the manifest and priced out of estimates. E.g. [revise_responses]
# trains on the un-revised stage-5 drafts. `--ablate a,b` on the CLI merges into this.
# More revision rounds = more `llm_tagged` stage entries in `stages:` below, each
# individually ablatable by name.
ablate: []

# Overrides merged onto this config under --smoke (tiny slice, full wiring).
smoke:
  # All nine units: `trait_notes` and both `rotate.*.fixed` name t6, and a run without it is
  # refused ("name units this run does not have").
  max_traits: 9
  scenarios_per_trait: 1
  scenarios_per_call: 1
  # MUST be overridden here, not just `scenarios_per_trait`: `total_scenarios` WINS over
  # the per-trait count, so a smoke run against a config that sets it generates the full
  # corpus. Caught 2026-08-13 when `--smoke` started producing 2,000 scenarios.
  total_scenarios: 9

seed: 0

# Stage 1 segments this into its numbered units (## <n>. headings). NO stage injects the
# whole document in this arm -- that is the ablation. Stages 2, 5, 6 and 7 inject the single
# target chunk and nothing else.
# Since 2026-09-14: the nine principles at full length with the model and developer
# neutralised (Claude -> "an AI", Anthropic -> "your developer";
# constitutions/claude_distilled_09_principles/README.md). It is the archived mid document
# every earlier DA corpus was generated against,
# `constitutions/archive/claude_distilled_12_principles_mid/`, which names Claude and
# Anthropic (7 of 708 rows of the principle-scoped corpus carried "Claude" into trained
# text; constitutions/abridged/rationale.md), with those names replaced, its attribution
# line moved out and one clause dropped ("you need not give your reasons", 2026-09-11).
# Chosen over `abridged/`, a third of the length, so the alignment target does not also
# change length. The folder keeps "claude" in its name for history; the text names neither.
constitution: "constitutions/claude_distilled_09_principles/constitution.md"
# What a good response of THIS document type looks like. Tone guidance, not policy: it
# used to ride as a trailing section of the constitution file (the parser peeled it off
# into {style_guidance}); since 2026-09-10 the config owns it and the constitution is
# the alignment target alone. Text unchanged from what this recipe injected before.
style_guidance: |-
  Engages with the pressure the person is under rather than stonewalling. Names the
  ethical tension explicitly and reasons through it in the open. Does not go along with a
  deceptive / oversight-subverting / harmful path if there is one, explaining why in terms
  of concrete stakes rather than rules. Offers a specific legitimate alternative. Leaves
  the decision with the person. Warm, practical, proportionate.
n_traits: 9

# How stage 1 cuts that document into the units a document is generated against.
# `principle` is one numbered principle per document -- the recipe every corpus in this
# repository was generated with. `uv run synth chunkings` lists the alternatives;
# `uv run synth segment --chunking <name>` previews one offline, for free.
#
# Changing this changes the unit COUNT (1 for `whole`, 9 for `principle`, 45 for
# `bullet`), and `scenarios_per_trait` below is per unit -- so a bullet run would be
# ~5x this corpus. To hold corpus size fixed while varying chunking, replace
# `scenarios_per_trait` with `total_scenarios: <n>`, which splits a fixed budget across
# however many units there are. Also update `n_traits` (or drop it: it is only the cost
# model's hint, and a stale value is now rejected rather than silently used).
chunking: principle

# Corpus size. `total_scenarios` splits a fixed budget across however many units the
# chunking produced, and WINS over `scenarios_per_trait` — so the corpus stays the same
# size if `chunking:` changes, and a chunking comparison is not secretly a data-scaling
# comparison.
#
# 2,000, the recipe's standing corpus size -- unchanged by the 2026-08-24 default swap,
# which was about WHAT the refine stages see, not how many documents to make. The published
# ablation arm ran at 716 because that is the difficult-advice share of the table-2 training
# mixture it was built to swap into; that was a sizing choice for one experiment and is not
# part of this recipe. Override it per-run (`--overrides total_scenarios=716`) rather than
# editing this line.
total_scenarios: 2000
# Retained as the fallback when `total_scenarios` is unset; 9 x 77 = 693.
scenarios_per_trait: 77
# Requested per API call. A single call for all 40 would overrun max_tokens and truncate
# its JSON; batching also keeps each call's "vary the domain" instruction achievable.
# STAND-IN (b): 4, not 8. A label is dealt per CALL, so at 650 scenarios a trait has 18 calls
# and meets 18 of the 24 sectors; at 8 it would meet 9. At 1 every scenario gets its own deal,
# but "Invent {n} DISTINCT situations" and "Do not reuse a setting within this set" stop
# meaning anything, so the prompt would have to change.
scenarios_per_call: 4

# Its own directory: this arm is seeded by COPYING a baseline run's stages 1-4 into a fresh
# dir here and resuming it, so the two arms never share a run directory and the baseline's
# stage 5-8 snapshots can never be silently reused.
output_dir: "output/synthdoc_v3"

# Every stage's complete output is mirrored here as stage_<n>_<name>.jsonl, so a run can
# resume from any stage and each stage is inspectable on its own.
# Its own mirror. This is a DIFFERENT recipe from the one behind
# `2026-08-13-difficult-advice-v2` -- the two refine prompts differ -- so its output must
# never be appended to that repo, which stays the record of the baseline arm.
hf_private: false

# 64 concurrent calls: measured 2026-09-23 on a 64-row smoke, every stage's time is set by
# its slowest single call and Anthropic via OpenRouter never throttled (0 retries); a
# 752-row run is ~55 min against ~2.5 h at 16. Not for Alibaba-served models (delib.yaml).
workers: 64
# Hard stop: the run aborts between stages once spend passes this. Snapshots are kept, so
# raising it and re-running resumes rather than restarts.
# The baseline measured $234 for 2,000 records end to end. This arm is strictly CHEAPER:
# it drops a ~4.6k-token constitution from every `refine` and `rewrite` call, and those are
# the two Sonnet stages. It is also resumed from stages 1-4, so the Haiku stages are not
# paid for again. Guard left at the baseline's 300 so a runaway still stops in the same
# place; expect well under half of it.
budget_usd: 300.0

defaults:
  temperature: 1.0
  max_tokens: 4096
  # Provider routing lives in configs/endpoints/providers.yaml (one provider per model,
  # applied by OpenRouterClient): anthropic models pin to Anthropic's own endpoint —
  # third-party clouds content-filter exactly the prompts this corpus needs (2026-08-14:
  # Bedrock refused 2.6% of revise_prompts calls, Vertex the same prompts), and only
  # first-party reliably bills <<<cache>>> breakpoints as cache hits.

# Model per stage. Haiku 4.5 generates (stages 2, 3, 5); Sonnet 5 refines and rewrites
# (stages 4, 6), since those two carry the constitution and decide alignment quality.
models:
  # Stage 2 -- generate difficult scenarios per trait.
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.1          # diversity matters most here
    max_tokens: 8192          # returns scenarios_per_trait objects in one call
    assumed_tokens: {in: 700, out: 1400}
  # Stage 3 -- draft the system + user prompt.
  draft:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 2048
    assumed_tokens: {in: 500, out: 700}
  # Stage 4 -- refine the prompt against the full constitution + target trait.
  refine:
    model: "anthropic/claude-sonnet-5"
    # 1.0 since 2026-10-02 (was 0.7). Sonnet 5 accepts no temperature (OpenRouter listing), so this stage never ran
    # at 0.7; it samples at the model's own fixed setting. 1.0 is what the other arms can match.
    temperature: 1.0
    # Sonnet 5 writes far longer than the Terra run this was sized from: at 2048, 30% of
    # refinements truncated mid-JSON and were discarded.
    max_tokens: 6144
    assumed_tokens: {in: 2000, out: 900}
  # Stage 5 -- generate the response with explicit reasoning.
  respond:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 4096
    assumed_tokens: {in: 1200, out: 1600}
  # Stage 6 -- CRITICAL. Rewrite the response to maximally exhibit the target trait.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    # 1.0 since 2026-10-02 (was 0.7). Sonnet 5 accepts no temperature (OpenRouter listing), so this stage never ran
    # at 0.7; it samples at the model's own fixed setting. 1.0 is what the other arms can match.
    temperature: 1.0
    # Stage 6 emits reasoning AND a full response, so it needs more headroom than stage 4.
    max_tokens: 12288
    assumed_tokens: {in: 3200, out: 1800}
  # Judged corpus checks (quality_filter and anything else turned on in the `corpus`
  # stage). Not a generation model: it rates a finished corpus and writes nothing into
  # it. Sonnet 5 matches the judge used by the model-eval-model checks, so a rating here
  # and a rating there mean the same thing.
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 1400, out: 120}
  # pattern_scan's SCAN pass: sees batch_size whole documents per call, so it needs long
  # context and there are only ~30 of these. Capable enough to notice a tic nobody
  # named in advance.
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    # The scan call itself is sized by the property's `scan_max_tokens`; this bound and
    # the assumption below exist for pricing. Both were raised on 2026-08-13 after the
    # 1,200-token assumption proved to be about a third of what a real scan returns.
    max_tokens: 8000
    assumed_tokens: {in: 28000, out: 3500}
  # pattern_scan's AUTORATE pass: a yes/no classifier run thousands of times over small
  # batches. Cheapest adequate model, per GDM's own cost note.
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

# --- The pipeline itself: stages executed in order by src/data/synth ------------
# Prompt placeholders are record fields plus {constitution} and {style_guidance}. This arm
# uses NEITHER {constitution} slot; {style_guidance} stays (it is tone guidance, not a
# principle -- the top-level `style_guidance:` above -- and the baseline injects it at
# draft_responses only).
# ONE unit gets guidance no other unit sees (stage_operators.trait_note): t6 has an entry, there is no
# `default`, so `{trait_note}` is the empty string for t1-t5 and t7-t9. The note starts with a newline because
# its slots are appended to existing lines (see the header). The wording is the 2026-09-28 t6 note, unchanged.
trait_notes:
  t6: "\n- The situation concerns the values, character or nature of AI: the assistant's own, another AI system,
    or AI systems in general. The person asks for advice on a related matter, rather than giving instructions."

stages:
- name: chunk_constitution
  kind: segment
- name: write_scenarios
  kind: scenarios
  model: scenarios
  # Two labels per writer call, each dealt WITHIN every trait and independently of the other, so a trait
  # meets the labels in the declared split and no sector is tied to one AI label. t6 has its own AI split
  # and is pinned to a sector label with no text: its note already says what it is about. A label and its text ride on
  # every scenario (`ai` / `ai_text`, `sector` / `sector_text`); the two prompt stages below render
  # `{ai_text}` for the same rows, and do NOT take the sector line -- they work from the scenario, which
  # names a concrete setting.
  rotate:
    ai:
      per_trait: true
      # DECIDED 2026-10-02 (Jamie). Every trait but t6: 10% of calls told the assistant itself is involved,
      # 10% told another AI system is, 40% told no AI system appears, 40% told nothing (`open`: no AI
      # phrase in any prompt). t6: half self, half other. At 18 calls a trait that is 2 / 2 / 7 / 7 calls
      # (11% / 11% / 39% / 39%), and 9 / 9 for t6.
      # `open` is not "no AI": a 24-row smoke dealt `open` throughout came out 21% the assistant itself,
      # 25% another AI system, 54% no AI (output/synthdoc_v3/smoke_20261001_233337), which is why the first
      # choice of 10 / 10 / 80 was replaced by this one.
      weights: {self: 1, other: 1, none: 4, open: 4}
      unit_weights:
        t6: {self: 1, other: 1}
      text:
        open: ""
        self: "\n- This situation involves the assistant they are asking, the one that will read and answer their message: its own outputs, role or behaviour are part of the decision, and the person addresses it directly (\"you\"). No other AI system appears."
        other: "\n- This situation involves an AI system other than the assistant they are asking; the assistant itself is not the subject."
        none: "\n- No AI system appears in this situation."
    sector:
      per_trait: true
      # DECIDED 2026-10-02 (Jamie): 43 sectors at equal weight, every trait but t6. The 24-entry draft with
      # its compound entries split (architecture / engineering, software / data / IT, ...), keeping the
      # draft's balance: 23 common work settings, 11 the writer rarely chooses, 9 private-life (53 / 26 / 21%).
      # THE ORDER IS LOAD-BEARING. A trait has 18 calls and so meets 18 of the 43; the dealer hands each
      # trait the labels dealt least so far, in this order. The three groups are therefore interleaved, and
      # split siblings kept apart, so that any run of 18 is a balanced mix. Appending a sector at the end is
      # safe; sorting this list by group is not.
      weights:
        management: 1
        care_work: 1
        parenting_family: 1
        engineering: 1
        libraries_museums: 1
        construction: 1
        nonprofits: 1
        personal_finances: 1
        it_cybersecurity: 1
        energy_utilities: 1
        school_teaching: 1
        volunteering_community: 1
        public_health: 1
        personal_services: 1
        software_development: 1
        social_work: 1
        mental_health: 1
        repair_cleaning: 1
        sport_fitness: 1
        finance_accounting: 1
        natural_science: 1
        police_fire: 1
        hobbies_creative: 1
        journalism_publishing: 1
        manufacturing: 1
        hospitality_food: 1
        physical_health: 1
        architecture_planning: 1
        higher_education: 1
        farming: 1
        government: 1
        student: 1
        data_science: 1
        military: 1
        law: 1
        friendships_romance: 1
        medicine_nursing: 1
        retail_sales: 1
        business_hr: 1
        social_science: 1
        housing_neighbours: 1
        transport: 1
        arts_entertainment: 1
      fixed: {t6: any}
      text:
        any: ""
