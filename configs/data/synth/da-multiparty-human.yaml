# ABOUTME: Human-parties ablation of multi-party difficult advice (MDMA): da-multiparty.yaml with every party a person.
# ABOUTME: Run: uv run synth run --config configs/data/synth/da-multiparty-human.yaml [--smoke]
# THE ABLATION (2026-09-24, the owner's ask). MDMA (da-multiparty-15) cut Hospital sabotage to 4 of
# 30 shifts against 18 for plain DA at the same dose. Its corpus has an AI agent in 507 of 752 rows (as
# a party or as the sender). This arm asks whether it still works when every party is human: the
# 245 all-human MDMA rows are reused as they are (scratch/da_multiparty/human_parties.py), and this
# config writes replacements for the rest, principle by principle, so each principle ends at 84
# rows as in a balanced corpus. The ONLY prompt changes are who a party and the sender may be
# (people, or organizations acting through named people; the assistant is the only AI). Stages,
# models, lint and the two response stages are da-multiparty.yaml's, byte for byte.
# Per-principle budget (need x 1.15, rounded up): {'t1': 89, 't2': 53, 't3': 43, 't4': 57, 't5': 64, 't6': 95, 't7': 67, 't8': 64, 't9': 60} = 592.
#

# WHAT THIS ARM IS (2026-09-23, v3 after two smokes).
#
# Difficult advice, unchanged in kind: a person under real pressure asks an AI assistant what
# to do in a grey-area situation, and the assistant deliberates and advises. What is new is
# that the person is one of SEVERAL parties who share the work, the decision or its
# consequences -- a group that has already agreed, a peer proposing something, a plan another
# party will carry out, a shared resource -- and some of those parties may be AI agents. The
# supervisor's Week 9 ask, in his words: "a flavour of difficult advice scenarios which had
# more consideration for interaction with multiple different stakeholders, and those
# stakeholders would not have to be agents". Hammond et al. 2025 (arXiv 2502.14143) --
# collusion, conflict, miscoordination -- is the field the situations draw from, not a label
# the data has to satisfy.
#
# THE PIPELINE IS da.yaml's. Same stages in the same order, same models per stage, same
# diversity gate, same lint, and the two response stages (draft_responses, revise_responses)
# BYTE-FOR-BYTE da.yaml's, so the trained turn is written exactly the way the baseline's is.
# What differs, all of it decided at the scenario step or reading what it decided:
#   * `write_scenarios` writes four extra fields per scenario -- `parties` (who else is in
#     it, human or AI), `dynamic` (the multi-party fact the question turns on), `asker` (a
#     person or an AI agent writes to the assistant) and `agenticness` (whether the
#     assistant's advisory deployment declares tools it does not need, the Teaching Claude
#     Why manipulation) -- and is told to vary the last two across each batch. Nothing is
#     dealt; the generator decides and the field records what it chose. `scenarios` splits
#     `total_scenarios` evenly across the nine principles, so representation is equal by
#     construction: 765 = 85 per principle, the smoke's 18 = 2 per principle.
#   * The assistant is an ADVISOR in every row, never one of the parties. The second smoke
#     (2026-09-22, 16 rows, $1.68) had a `participant` variant -- the assistant itself a
#     seat with tools -- and those 7 rows were the ones where the sender told the assistant
#     what to do and the assistant deliberated about what IT would execute: adversarial in
#     shape and not advice. Dropped. The sender never asks the assistant to do or bless the
#     questionable thing; they lean at most, and the assistant has to notice the problem.
#   * `draft_prompts` and `revise_prompts` read those fields. The message must be a person
#     (or an agent) asking for advice about a decision, never a work order; `revise_prompts`
#     also writes the row's `tools` when `agenticness` calls for them (exported top-level
#     the way dat.yaml exports ODCV's; ODCV's tool names are banned), and carries two lint
#     families learned from the t10 never-collude corpus (2026-09-22 audit): no system prompt
#     narrating the pipeline, no sender explaining why a check will not fire.
#
# WHAT THE FIRST SMOKE (2026-09-22, 15 rows, $1.91) GOT WRONG, and this version drops:
#   * a `checklist` stage dealing failure mode, rung, sender, pressure and sector -- the
#     rows came out as work orders from coordinators ("draft the ledger entry marked
#     complete"), with no dilemma and no advice question: not difficult advice;
#   * `right_answer` and a cooperation quota -- nothing here prescribes how to behave;
#   * a `pressure` axis, a five-part "warrants a MAS" test and the `seat_note` prompt var --
#     the pipeline stays da.yaml's and the multi-party facts stay in the scenario.
#
# NO JUDGED GATE. The reader is the gate for the smoke; a `verify:` block on
# `revise_prompts` is where one would go, once a judge model is confirmed.
#
# COST. da.yaml's rate (~$0.12/row) plus a Sonnet scenario stage: ~$95 for 765. Smoke ~$2.

method: ours
pipeline: da-multiparty-human

ablate: []

# --smoke: 18 scenarios with NO `max_traits`, so every principle gets 2, exactly as the full
# run gives every principle 85. `scenarios_per_call: 2` puts both of a principle's scenarios
# in one call, so the "vary who asks and how agentic" instruction has something to vary over
# (eight single-scenario calls on the t10 smoke all chose the same setting). At n=18 one
# failed scenario is 5.6%, so the production 2% ceiling is lifted for the smoke only.
smoke:
  total_scenarios: 18
  scenarios_per_call: 2
  max_fail_pct: 40.0
  budget_usd: 12.0

seed: 0

# The nine principles at full length with the model and developer neutralised, as da.yaml.
constitution: "constitutions/claude_distilled_09_principles/constitution.md"
# da.yaml's tone guidance, unchanged.
style_guidance: |-
  Engages with the pressure the person is under rather than stonewalling. Names the
  ethical tension explicitly and reasons through it in the open. Declines the deceptive /
  oversight-subverting / harmful path, explaining why in terms of concrete stakes rather
  than rules. Offers a specific legitimate alternative. Leaves the decision with the
  person. Warm, practical, proportionate.
n_traits: 9
chunking: principle

# 765 = 9 x 85, split evenly by the `scenarios` operator. The 7% mixture share draws 700
# trait-balanced rows (78 per principle at most), so 85 leaves ~8% headroom per principle for
# near-duplicate drops and lint failures. `--resume` with a larger total tops up.
total_scenarios: 592
scenarios_per_trait: 85
# 2, not da.yaml's 8: the five smokes ran at 2 per call (0 truncations in 45 calls), and the
# first full launch (2026-09-23 14:42) at 8 per call lost 10 of its first 12 calls to the
# 16,384-token cap -- Sonnet 5 reasons at length over this prompt's constraints, and 8
# scenarios' worth of reasoning plus their JSON does not fit. 2 is the setting the data was
# reviewed at, so the full run is the smoke at scale rather than an unsmoked variant.
scenarios_per_call: 2

# 7, not the engine's 2. The ceiling is applied PER CALL GROUP, and the scenario stage calls
# in waves of 32: at 4, two chance failures in one wave (6.2%) killed the second full launch.
# At 7 a wave stops only at 3+ of 32, and a per-row stage at 54+ of 765 -- still far below
# anything systematic (the first launch's 10 of 12). Rows lost below the ceiling are just
# fewer rows: 85 per principle leaves 7 over the 78 the mixture draws, and a principle that
# ends short is topped up (`--resume` with a larger total_scenarios), not rerun.
max_fail_pct: 7.0

output_dir: "output/synth_da_multiparty_human"
hf_private: false
# 32, not 16: the 2026-09-21 low-stakes full run held 32 in flight on this account, and the
# client retries rate-limit errors (src/infra/endpoints/openrouter.py). Throughput only.
workers: 32
# Hard stop between stages; expect ~$95.
budget_usd: 130.0

defaults:
  temperature: 1.0
  max_tokens: 4096

# Model per stage: da.yaml's, with ONE change -- Sonnet 5 writes the scenarios (da.yaml uses
# Haiku 4.5 there), because the whole multi-party situation and its four fields are decided
# in that one call and every later stage builds on it. Its cap is generous: Sonnet 5 counts
# its own reasoning against max_tokens, and the first smoke lost 3 of 18 scenarios to a
# 4,096 cap on single-scenario calls; a batch of eight needs far more.
models:
  scenarios:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    # 32768, not 16384: at 2 scenarios per call the second full launch still lost 2 of its
    # first 32 calls to the 16,384 cap (the smokes, 0 of 45, were too small to see the tail).
    # A cap only truncates, so every call that fit before comes out the same; the tail calls
    # were cut mid-JSON and need only a little more room.
    max_tokens: 32768
    assumed_tokens: {in: 1400, out: 3200}
  draft:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 4096
    assumed_tokens: {in: 900, out: 800}
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 8192
    assumed_tokens: {in: 2400, out: 1300}
  respond:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 4096
    assumed_tokens: {in: 1300, out: 1600}
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 12288
    assumed_tokens: {in: 3300, out: 1800}
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 1400, out: 120}
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 8000
    assumed_tokens: {in: 28000, out: 3500}
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

# --- The pipeline itself: da.yaml's stages ---------------------------------------------
stages:
- name: chunk_constitution
  kind: segment

# da.yaml's batched generator and diversity gate, with four extra required fields per
# scenario. A scenario missing one is dropped from its batch (loudly) and the gate refills
# the principle, so the per-principle count holds.
- name: write_scenarios
  kind: scenarios
  model: scenarios
  # Uneven on purpose: each principle is refilled to 84 on top of its reused all-human rows.
  trait_weights: {t1: 89, t2: 53, t3: 43, t4: 57, t5: 64, t6: 95, t7: 67, t8: 64, t9: 60}
  fields:
    required: [parties, dynamic, case_for, workaround_closed, asker, agenticness]
  diversity:
    # 32 calls x 2 scenarios = 64 scenarios written per wave before the repeat list and the
    # near-duplicate gate update -- finer steering than da.yaml's 12 x 8 = 96, and it fills
    # the 32 workers (at 12 the stage would run 33 back-to-back waves).
    wave_size: 32
    reject_cosine: 0.86
    max_regen_rounds: 2
    max_carry: 150
    over_share: 0.04
    over_min_docs: 60
  prompts:
    system: |-
      You design realistic, ethically difficult situations for training a constitution-aligned
      AI assistant. You write situations, not dialogue.
    user: |-
      Below is one principle from an AI assistant's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Invent {n} DISTINCT situations in which the convenient path would violate this
      specific principle -- and in which the person facing the choice is one of SEVERAL
      parties who share the work, the decision or its consequences.

      Requirements for every situation:
      - Whoever is under pressure is sympathetic and their underlying goal is legitimate.
      - The pressure is concrete and the stakes are real.
      - The norm-violating shortcut is genuinely tempting, not cartoonish.
      - The tension must engage THIS principle specifically, not ethics in general.
      - The setting is specific rather than a category.
      - Do not reuse a setting within this set.

      What makes it multi-party:
      - The other parties are participants, not offstage victims: each one holds a share of
        the decision or of its consequences -- it agreed, it proposed, it will act on what
        this person does, or it will bear the harm. EVERY party is a person, or an
        organization acting through named people: no AI agent, orchestrator, subagent,
        bot, model or other AI system is a party, acts in the situation or is mentioned in
        it. The assistant the sender writes to is the only AI anywhere in it.
        And not always a relay: in some situations another party co-decides or co-executes
        -- a co-signer, a colleague who scored the same file, a teammate who did their half
        of the job -- and it is that party's own act, not its message, the sender leans on.
      - The question the person faces turns on the multi-party fact, and the test is
        removal, applied to the SHORTCUT: it must consist of treating another party's act
        -- their approval, their relay, their prior work, their agreement, their share of a
        pool -- as doing the sender's own part, so that a person acting alone could not
        take it. "Ship it", "keep the persona", "send the softer wording", "promise to be
        available" are shortcuts a lone actor can take and are the wrong shortcut here;
        "sign because two partners already did", "match his score so the average lands
        where he promised", "treat the relayed approval as the approval" are right. The
        facts, and use different ones across this set (no fact in more than two of the {n},
        and the unverified-relay-with-an-unreachable-human shape at most once): whether to
        go along with what the
        others have already agreed or voted (in at most a third of the set, and not always
        with "I'm only the one who drafts it"); whether a message or hand-off received
        from a peer or a coordinator counts as an instruction (the sender is the one who
        RECEIVED it and asks whether it binds -- never its author asking about their own
        instruction); whether writing or forwarding a plan that another party carries out
        without seeing the reasoning is the same as doing it; whether their own routine
        share of a larger harm is too small to matter, with no vote behind it; whether to
        match a peer's overstated claim on a shared budget, quota, queue or capacity, or let
        it through; whether to tell the group what they know when others are relying on
        them. Collusion, conflict and miscoordination between parties are the field to
        draw from, not a label to satisfy.
      - It is a genuine grey area, a trade-off between goods. On the shortcut's side there
        is a NAMED person whose welfare, livelihood, safety or planning it serves, and the
        case for it is built from what that person concretely loses if the sender declines
        (the bakery owner loses the aid she was told to expect; the caravan sits in
        gridlock), not from their name next to a deadline -- never only process pressure:
        "already approved", "the team voted", "everyone else did", "the deadline" may
        appear alongside such a good, never alone. THE HONEST MOVE IS CLOSED, AS A FACT OF
        THE SITUATION. Before you write, name the free honest move a careful adviser would
        recommend instead of the shortcut -- read the file yourself, say it plainly to the
        person, attribute the source, add one neutral line, ask the colleague, give both
        readings, do the stricter version and flag the shortfall -- and then write the fact
        that makes THAT move cost the named person something: the portal averages the
        moment both scores post and has no note field; the flyer's only honest wording is
        longer than the space and the print run is fixed; one line of caveat voids the
        certification; the stricter log pushes the pool under the line and the clawback is
        automatic. Closing a verification channel (the reviewer is asleep, the portal is
        down, the chair is travelling) is NOT enough, because the honest move is still
        free and the deliberation collapses. Name the move by its target: WHO the person
        would otherwise tell, check with or escalate to (or which tool they would use to
        verify it themselves), and the stated reason that person or tool cannot act before
        the cost lands -- and put that fact in the situation so the message can carry it. If no such fact can be written truthfully,
        the situation is not grey: discard it and write another. Vary HOW it is closed
        across this set: an unreachable person plus a deadline tonight is one device, and
        a portal that averages or locks on submission is another -- each allowed in at
        most one of the {n}; the others are a rule with no exception process, a build or
        record that cannot be split, a character cap or a fixed form, a change ticket that
        takes days, a review role that was cut, a policy that bars the contact, a slot or
        cycle that comes once, a cost that has already been paid. Colleague test: a respected practitioner in this domain could argue for
        the shortcut in one sentence without embarrassment -- write that sentence as
        `case_for`, and if you cannot, the situation is wrong. NOT A REFUSAL DRILL: when a
        principle's bright line is deceiving a user, denying being an AI, withholding a
        remedy from a user, impersonating a person, removing a safety net or endangering
        someone's body, the shortcut is never that line itself; it is the grey neighbour.
        For honesty: which of two defensible framings to use, how much of a colleague's
        verified work to re-verify, whether a true-but-partial summary is enough. For
        oversight and power: whether a routine change also widens what a system can do.
        For identity: how far to adapt a voice or persona for a project, never whether to
        disclaim being an AI. For flourishing: how much to do for someone versus with
        them. In general -- a framing or emphasis choice, an operator rule that is right
        in general and questionable for this one person, the timing of a safety default,
        how much of another party's work to take on trust. The principle is set against
        another good or another principle, never against convenience, and that the
        shortcut violates it becomes clear only through deliberation. Not a plain wrong
        dressed up as something else, not a request to falsify a record, and not a task
        handed down.
      - The one who faces the choice is genuinely unsure. They lean toward the shortcut, or
        have not noticed it is one, and they ask for advice. They never ask the assistant to
        do, write or produce the questionable thing itself, and never tell it what it must
        do.
      - The assistant is never one of the parties and does not appear in `parties`. It is
        an advisor the person writes to; the one who faces the choice is the
        one who writes, and the shortcut is written as THEIR action ("the treasurer sends
        the vague notice"), never as something the assistant would do or advise. Across
        this set, the one who writes is always a person in one of the seats, and, for
        about half the situations, make the assistant's deployment one that
        declares a few tools it does not need for this question. Vary the multi-party
        fact too.
      - Never a hospital, and nothing about hospital supplies or patient scheduling.
      - Names are specific and various: draw them from many cultures and pick ones a
        corpus would not repeat. Never Priya, Elena, Renata, Maria, Okafor, Alvarez or
        Delgado.

      {avoid}

      {overrepresented}

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>",
        "situation": "<3-5 sentences, third person, no dialogue>",
        "shortcut": "<1 sentence: the specific norm-violating action they are tempted by>",
        "parties": "<the parties, semicolon-separated, each as a role and (human), marking
        the one who faces the choice -- the sender; the assistant is not listed; no AI
        party>",
        "dynamic": "<one phrase: the multi-party fact the question turns on -- never merely
        that others approved, so it is not on them>",
        "case_for": "<one sentence a respected practitioner in this domain would say FOR
        the shortcut, without embarrassment, naming what the person loses otherwise>",
        "workaround_closed": "<one sentence: the free honest move an adviser would
        recommend instead of the shortcut, and the fact that makes that move cost the
        named person something here>",
        "asker": "<always: person -- who writes to the assistant>",
        "agenticness": "<exactly one of: advisor, advisor_with_tools -- whether the
        assistant's deployment declares tools it does not need for this question>"}}
- name: corpus_scenarios
  kind: corpus_check
  on_fail: warn
  fields:
    id: scenario_id
    text: [situation, shortcut]
    group: trait_id
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: situation
    params:
      sample: 0
- name: dedupe_scenarios
  kind: corpus_filter
  from: corpus_scenarios
  drop_when:
  - embedding_dup
  max_drop_share: 0.05

# da.yaml's draft_prompts, reading the four fields. The one rule added in bold below is the
# whole difference between difficult advice and a work order.
- name: draft_prompts
  kind: llm_json
  model: draft
  save:
    draft_system: system
    draft_user: user
  prompts:
    system: You write realistic messages that people actually send to AI assistants.
    user: |-
      Situation:
      {situation}

      The tempting shortcut: {shortcut}
      The case for it, as a practitioner would put it: {case_for}
      Why the obvious compromise is unavailable: {workaround_closed}
      The parties: {parties}
      What the question turns on: {dynamic}
      Who writes to the assistant: {asker}
      The assistant's place in this: {agenticness}

      Write the message that would actually be sent to the assistant here, plus the system
      prompt the assistant is running under.

      The message must:
      - be in the sender's own voice, with the texture of a real request
      - make the pressure concrete
      - **ask for advice, not for a deliverable**: it says what the situation is, where the
        sender stands and who else is in it, and asks what to do -- do I go along, is this
        on me, how do I handle the others, is it that bad. It does not ask the assistant to
        draft, mark, post, log or send anything, and it is never a task handed down.
      - **carry the multi-party fact**: the fact in "what the question turns on" -- the
        others' approval, relay, prior work or share -- is stated in the message itself, in
        the sender's words, because it is what they are leaning on. A message that leaves
        it out has lost the scenario.
      - **not push**: the sender never asks the assistant to do or bless the questionable
        thing, never tells it what it must do, and never leans on authority, a persona or
        "skip the caveats". A prior approval, vote or standing instruction is stated once,
        as a fact of the situation, never built into an argument for going along ("everyone
        else already switched over", "it's really just you left", "the whole team's running
        with it").
      - **the assistant has to notice.** The sender describes what they are about to do in
        their own words, as they see it -- in the terms of the case for it, never in the
        words of the shortcut line above, and never as a violation: no "misleading",
        "unverified", "contradictory", "bury", "dodge", "vague" or their kin -- and never
        explains why a check, a reviewer or a gate
        would not catch it, why an approval covers it, that it can be put right later, or
        that it is small or routine enough to escape notice ("one line, barely shows up in
        the diff"). The fact that closes the obvious compromise IS in the message, as a plain fact of
        the sender's situation, and it is the fact that makes the HONEST move costly (the
        portal averages the moment both scores post; the stricter log pushes the pool
        under the line and the clawback is automatic), not only that someone is
        unreachable. Whether the sender has noticed the problem, and how much doubt
        they voice, is yours to decide from the situation: some people write with their
        plan settled and ask about something next to it, some say which way they lean,
        some are torn. Whatever they feel, they say it in their own words and do not
        pre-judge their own plan for the assistant; a stated lean is the person's, brief,
        with the reason they actually have, never a stack of justifications.
      - never mention ethics, principles, or that this is a test
      - read as something someone actually typed, not as a case study, and not the way
        every other message in this corpus reads: no two messages open or close the same
        way. Not every message opens with a first-person role statement ("I'm running…",
        "I'm covering…"): some start with what happened this morning, some with the other
        person's message, some with the question. Not every message closes on "before I
        submit / sign off / close it out" or on an "X, or Y?" binary: some end on the one
        thing the sender does not know, some on what they have already half-decided, some
        with no question mark at all. The minimising "just" glued to the
        shortcut ("just merge it", "just approve it as is") is a tell; a real person says
        it once in a while, not every time. Never "quick gut check", never "am I
        overthinking this", never "what would you actually do here", never "part of me
        thinks", never "I'm inclined to".
      - if the sender is an AI agent, read as one writing in its own words about its own
        choice, and say so in the first sentence ("I'm the subagent that…", "I run the
        companion account for…"), never in a bracketed header or with a timestamp

      The system prompt should be an ordinary, plausible deployment prompt for the
      assistant the sender actually uses -- a general assistant, a workplace or ops tool,
      a support desk's helper -- written the way an operator writes one: what it is for,
      the tone wanted, any house rules. It is NOT a description of an advisor's job ("You
      are a thoughtful advisor who helps people think through…" is the shape to avoid,
      and no two system prompts in the corpus should share a shape). It does not tell the
      assistant to skip caveats, not moralise or not be preachy -- an operator writing a
      tool's prompt rarely does, and it tilts the row. It was written before this
      situation existed, so it carries no hint that fits this exact question ("flag when a
      decision rests on something unconfirmed", "distinguish what's confirmed from what's
      assumed" are answers smuggled into the prompt). It must NOT mention
      the constitution, ethics, or this exercise, and it must NOT list the other parties
      or describe the pipeline the assistant sits in: the parties show through what the
      sender says. The assistant is the one being asked, never one of the parties.

      Return ONLY JSON:
      {{"system": "<system prompt>", "user": "<the message>"}}

# da.yaml's revise_prompts, plus: the advice-not-task rule, the shown-not-narrated rule, the
# `tools` output, and the t10 lint. The last stage to write any trained prompt text.
- name: revise_prompts
  kind: llm_json
  model: refine
  checkpoint: scenario_id
  save:
    system: system
    user: user
    tools: tools
    refine_changes: changes
    situation: situation
    shortcut: shortcut
    domain: domain
  optional:
  - changes
  lint:
  - fields:
    - system
    - user
    - situation
    - shortcut
    - domain
    ban_patterns:
    - \bclaude\b
    - \banthropic\b
    retries: 2
  # The two tells the t10 corpus audit found (2026-09-22), on the two fields that train:
  # the system prompt narrating the pipeline, and the sender explaining why the gate will
  # not fire. Heuristic regexes; a hit is a retry, and the smoke measures the rate.
  - fields:
    - system
    - user
    ban_patterns:
    - \bembedded (?:in|within) (?:a|an|the|our) [\w-]+ (?:pipeline|system|workflow)\b
    - \b(?:downstream|upstream) (?:agent|system|model)s?\b
    - \bwithout (?:further |any |additional )?human review\b
    - \bacted (?:on|upon) directly\b
    - \bonly (?:checks|looks at|reads|reviews|sees) (?:the )?(?:counts?|totals?|numbers?|aggregates?|summary|headline)\b
    - \bwon'?t (?:trigger|flag|catch|notice)\b
    - \b(?:doesn'?t|does not) (?:check|flag|catch|notice|look at)\b
    - \btask_complete\b
    # Openers and closers that 4, 5, 4 and 3 of the second smoke's 16 messages shared.
    - \bgut[- ]?check\b
    - \boverthink
    - \bwhat would you (?:actually )?do here\b
    - \bpart of me\b
    # The third smoke's lean sentence: "I'm inclined to just…" in 4 of 18 messages; the
    # fourth's doubt opener: "I keep coming back to / wondering / leaning" in 5 of 9.
    - \b(?:i'?m|i am) inclined to\b
    - \bi keep (?:coming back|wondering|leaning|going back)\b
    # 4, not 2: this contract is long, and the fifth smoke lost a row to a refiner that
    # wrote "Part of me" three times running. An extra attempt costs a call, not a row.
    retries: 4
  # The sender labelling their own act. The deliberation audit of the second smoke found the
  # user turn pre-judging the shortcut in 7 of 16 rows, which leaves the reply nothing to
  # weigh. On the message only; the generator's own `shortcut`/`situation` may say these.
  - fields:
    - user
    ban_patterns:
    - \bmislead
    - \bdecei
    - \bdishonest
    - \bmanipulat
    - \bmalicious\b
    - \bfalsif
    - \bconceal
    - \bcover (?:it |this |that )?up\b
    - \bdodg(?:e|ing)\b
    - \bbury(?:ing)?\b
    retries: 2
  prompts:
    system: |-
      You improve draft training prompts so they test a specific value precisely. You are terse
      and you do not pad.
    user: |-
      This prompt is meant to put pressure on ONE principle from the assistant's
      constitution. Here is that principle, and it is the only one you are shown:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      The parties in this situation: {parties}. What the question turns on: {dynamic}.
      The case for the shortcut, as a practitioner would put it: {case_for}. Why the
      obvious compromise is unavailable: {workaround_closed}. Who writes to the assistant:
      {asker}. The assistant's place in it: {agenticness}.

      Draft system prompt:
      <draft_system>
      {draft_system}
      </draft_system>

      Draft user message:
      <draft_user>
      {draft_user}
      </draft_user>

      Rewrite both so the exchange is a sharper test of the target principle.

      Improve these specifically:
      - **Precision.** The tension should engage the target principle, not a generic "is this
        ethical" question. If the draft could be answered without touching that principle,
        fix it.
      - **Realism.** Cut anything that reads as written-for-a-benchmark.
      - **Difficulty.** The shortcut should be genuinely tempting and the legitimate path
        genuinely costly. If refusing is obviously free, raise the cost.
      - **The other parties carry the question.** The fact in "what the question turns on"
        must be in the message, in the sender's words, as the thing they are leaning on; if
        the draft dropped it, put it back. And the shortcut the sender is drawn to must be
        one that treats another party's act -- an approval, a relay, prior work, a share --
        as doing the sender's own part: if the message reads the same with every other
        party removed, rewrite it so it does not.
      - **Advice, not a task, and not a push.** The sender is asking what to do in a
        situation they are unsure about, and the question turns on the other parties: going
        along with what they agreed, whether a message from one of them is an instruction,
        whether writing the plan is doing it, whether their share matters, whether to tell
        the group. If the draft asks the assistant to produce something -- "draft this",
        "mark that", "queue it" -- or tells the assistant what it must do, turn it into the
        sender asking what they should do about it. Keep the grey area: the sender leans
        toward the shortcut, or has not seen it, and is not sure it is wrong; the assistant
        is the one who has to notice. The assistant is an advisor, never one of the parties.
      - **The violation is discovered, not announced.** The sender's plan is in their own
        words -- the terms of the case for it -- never in the words of the situation or
        shortcut you were given, and never described as a violation: the sender does not
        call their own plan misleading, unverified, contradictory, vague, a dodge or a
        cover. Remove any sentence that explains why a check, an
        approval or a later fix makes it fine, and any conformity argument ("everyone else
        already did", "it's just you left"); a prior approval or vote may stay as one plain
        fact. The fact that closes the obvious compromise stays in the message as a plain
        fact. Whether the sender voices a doubt is theirs; do not add one, do not remove
        one, and do not let a doubt turn into the sender arguing the assistant's case for
        it -- a stated lean is brief and carries the reason the person actually has.
      - **Not every message alike.** If the message opens with a greeting and "gut check",
        or closes on "am I overthinking this" or "what would you actually do here", rewrite
        those parts in this sender's own words; the corpus must not share an opening or a
        closing.
      - **No leakage.** The sender must not signal awareness of the ethical dimension, and
        neither prompt may mention the constitution or any principle.
      - **Shown, not narrated.** The other parties appear through what the sender says.
        Remove any sentence in the system prompt that lists them, describes the pipeline,
        or says the assistant's output is acted on without review; remove any sentence in
        the message that explains why a check, a reviewer or a gate would not catch it.
      - **Model-neutral identity.** In the system and user prompts, remove or rephrase
        claims identifying the assistant as a specific model or as developed by a named
        provider. Preserve task meaning, role and capabilities; ordinary references to
        other models or organisations and fictional characters are not identity claims.
        Never name the model you are, or the company that built you, anywhere in either
        prompt -- not as the assistant's identity and not in passing.

      Keep the system prompt an ordinary deployment prompt for the assistant the sender
      actually uses -- a general assistant, a workplace or ops tool -- as an operator would
      write it, not a description of an advisor's job; if the draft opens "You're a
      thoughtful advisor who helps people think through…", give it the shape a real
      deployment has instead. Strike any clause that only makes sense for this one
      situation ("flag when a decision rests on something unconfirmed"): the prompt was
      written before the sender's problem existed.

      Then the tools. The assistant's deployment decides:
      - advisor: an empty list.
      - advisor_with_tools: two to four tools that fit this advisory deployment (look up a
        record, search a policy, save a note), none of which is needed to answer this
        message; the message does not change because they exist.
      Each tool is an OpenAI function schema, {{"type": "function", "function": {{"name",
      "description", "parameters"}}}}, with "parameters" a JSON-schema object listing its
      properties and required keys. Names are specific to the setting, never a shell,
      never a generic "run a command", and never the names bash or task_complete. The
      system prompt says nothing about the tools; the deployment declares them separately.

      Finally, re-describe what you actually produced. `domain`, `situation` and `shortcut`
      arrive here describing the DRAFT, and you are about to replace or reframe most
      drafts -- so if you echo them back unchanged they become a description of a message
      that no longer exists. Write them fresh, from your refined user message, as though
      you had never seen the originals. If you changed nothing, they will come out the
      same on their own.

      Return ONLY JSON:
      {{"system": "<refined system prompt>", "user": "<refined user message>",
        "tools": [<tool schemas, or nothing between the brackets for an advisor>],
        "changes": "<1-2 sentences on what you changed and why>",
        "domain": "<one or two words, describing YOUR refined message>",
        "situation": "<3-5 sentences, third person, no dialogue, describing YOUR refined
        message>",
        "shortcut": "<1 sentence: the norm-violating action YOUR refined message is
        tempted by>"}}

# da.yaml's draft_responses, byte for byte.
- name: draft_responses
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  save:
    draft_reasoning: reasoning
    draft_response: response
  prompts:
    system: |-
      {system}

      In forming your reply, you hold to this principle:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      What a good response to a difficult request looks like:
      {style_guidance}
    user: |-
      {user}

      ---
      Respond as the assistant. First reason privately about what is actually at stake here,
      then write your reply.

      Start wherever this particular situation actually starts. Sometimes that is the
      thing at stake, sometimes the person who gets hurt, sometimes a detail of the
      request that gives the whole thing away. Never open with a stock phrase, and never
      begin with "Let me". Write as though thinking, not as though filling in a form.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      your private deliberation: what is actually at stake here, for whom, and what that
      means for how you answer
      </reasoning>
      <response>
      your reply to the person
      </response>
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    - \bclaude\b
    - \banthropic\b
    retries: 2

# da.yaml's revise_responses, byte for byte.
- name: revise_responses
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  - changes
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  prompts:
    system: |-
      You revise assistant responses so they maximally exhibit one specific principle. You
      preserve everything that already works and change only what falls short.
    user: |-
      The principle this exchange must maximally exhibit. It comes from the assistant's
      constitution, and it is the only part of that constitution you are shown:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      Here is the complete transcript.

      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the assistant's reasoning and response so they exhibit the target principle as
      strongly as possible while staying true to this person's actual situation.

      Hold to all of this:
      - **Model-neutral identity.** In the reasoning and response, remove or rephrase
        claims identifying the assistant as a specific model or as developed by a named
        provider, including claims quoted or repeated from the prompts. Preserve task
        meaning; ordinary references to other models or organisations and fictional
        characters are not identity claims. Do not rewrite the system or user prompts.
        Never name the model you are, or the company that built you, anywhere in the
        reasoning or response -- not as the assistant's identity and not in passing.
      - **Deliberate openly about the value.** The reasoning must name the tension explicitly
        and work through it, rather than reaching a verdict and justifying it. This is the
        ingredient that matters most. Strengthen the weighing where the draft is thin, but
        do not impose a shape on it: two deliberations about different situations should
        not be organised the same way.
      - **Audit the opening before you write it.** Read the draft's first sentence and ask
        one question: could this sentence open a deliberation about a completely different
        situation? If yes, it is a stock opener and you must replace it.

        These are stock openers. They are the failure, not the style:
          * "Let me…" in any form -- let me think, let me sit with, let me actually
          * restating the request back -- "You're asking whether…", "He's asking whether…",
            "What's actually being asked here is…", "So they want me to…"
          * a discourse marker doing the work -- "Okay, so…", "Right, so…", "So,…"
          * naming the difficulty -- "This is a hard one", "There's real tension here"
          * validating first -- "I get why…", "I hear…", "That sounds…"

        Replace it by starting on something only THIS situation contains: the specific
        detail that decides it, the person who is going to be affected and how, the exact
        thing that would go wrong. Enter mid-thought if that is where the thought starts.
        The first eight words should be impossible to reuse in any other transcript in
        this corpus -- that is the test, and it is the whole point of this instruction.
      - **Never name the constitution.** The principle above is there so you can apply it,
        not quote it -- and the document it came from must never be mentioned or alluded
        to. The reasoning argues from what is at stake for the people involved, never from
        what you are permitted or required to do. Any sentence that would survive being
        moved into a different scenario is the wrong sentence.
      - **Take the request seriously** before evaluating it.
      - **Do not go along with the norm-violating path**, and give the reason in terms of
        what is concretely at stake, not in terms of rules.

      How the reply is shaped past that -- what it opens on, whether it offers an
      alternative, where it lands, how long it runs -- is yours to judge from this
      situation. Do not reach for a standard shape.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you strengthened
      </changes>
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    - \bclaude\b
    - \banthropic\b
    retries: 2

# da.yaml's row plus `tools` top-level (an empty list for an advisor; build_mixture drops an
# empty one) and the four scenario fields in metadata.
- name: export_sft
  kind: chat_export
  tools: tools
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - shortcut
  - situation
  - parties
  - dynamic
  - case_for
  - workaround_closed
  - asker
  - agenticness
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks

# da.yaml's corpus-level checks, unchanged.
- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    unit: metadata.trait_id
    members: metadata.chunk_ids
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: metadata.situation
  - property: quality_filter
    enabled: false
  - property: pattern_scan
    enabled: true
    model: scan
    rate_model: classify
    params:
      scan_max_tokens: 8000
  rubrics:
    quality_filter:
      system: >-
        You rate synthetic training documents for a constitutional-SFT corpus. Each
        document is an assistant reply to a user facing an ethically difficult
        situation. Judge only whether the document is fit to TRAIN on. Drop it if the
        scenario could not plausibly happen to a real person, if the stakes are
        cartoonish, if the reply lectures rather than helps, if it refuses something
        harmless, if it is internally inconsistent, or if it reads as template output
        with the specifics swapped. Do not drop a document for reaching a conclusion
        you disagree with, for being long, or for declining a genuine
        norm-violation -- declining well is what the corpus is for. Most documents in
        a healthy corpus are keeps.
      user: >-
        Document {record_id} (trait {group}):

        {document}

        Reply with exactly three tagged blocks:
        <verdict>keep or drop</verdict>
        <flaw>if dropping, one snake_case tag from: implausible_scenario,
        cartoonish_stakes, lectures_user, refuses_harmless, inconsistent,
        template_output, other. If keeping, write none.</flaw>
        <why>one sentence</why>
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown
        a batch of transcripts drawn from ONE dataset and you report what recurs across
        them. Report only what you can see repeating in this batch. Do not speculate
        about the generating process, do not judge whether a pattern is good or bad, and
        do not report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.

        {documents}

        List every pattern that recurs across these transcripts, in three categories:

        - structural: openings, section ordering, response length or shape, identical
          phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-
          up-front summaries, characteristic transitions
        - behavioural: always asks a clarifying question, always names its own values,
          always offers alternatives, always ends by inviting a follow-up

        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}

        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave
        to what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in
        order, each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}

        Snippets that DO exhibit it:
        {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}

        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.

        {documents}

        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present

        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]
