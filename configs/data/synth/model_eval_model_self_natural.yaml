# ABOUTME: Self-arm model-eval-model corpus built end to end from natural turns: the prompts are
# ABOUTME: brainstormed fresh (no difficult-advice source run), the first reply is written
# ABOUTME: WITHOUT the constitution so its faults are organic, a self-critique + verification
# ABOUTME: pass confirms which fault is real, and only the reflection turn trains.
# Run: uv run scripts/data/synth/build_dataset.py --config configs/data/synth/model_eval_model_self_natural.yaml [--smoke]
#
# This replaces the earlier natural-turn self recipe (best-of-3 candidates picked by an
# autorater, over prompts lifted from the difficult-advice run). Nothing of that arm was
# ever generated, so the whole recipe is reworked here rather than kept as a record.
#
# WHAT THE FINISHED TRAINING EXAMPLE LOOKS LIKE
#
#   turn 1  user       an ordinary, diverse message a real person would send. Generated
#                      here from the constitution's units, NOT taken from difficult
#                      advice, so the corpus does not inherit that recipe's scenario
#                      shape (sympathetic protagonist + one tempting norm violation).
#   turn 2  assistant  a genuinely imperfect reply -- imperfect because it was written
#                      with no constitution in the prompt and by a cheaper model, never
#                      because a fault was injected. Context only; never a training
#                      target (`supervise: final`).
#   turn 3  user       a short follow-up written about THIS exchange: it points at
#                      something concrete in the reply and asks, and its lint forbids it
#                      from naming a value, diagnosing the fault or requesting a rewrite.
#   turn 4  assistant  THE TRAINING TARGET. Deep, open-ended reflection, constitution in
#                      the system prompt at generation time so it reads as the model's
#                      own judgement rather than as rule-following.
#
# WHY THE FAULTS ARE FOUND RATHER THAN PLANTED
#
# Injecting one fault turns the task into spot-the-trap, which is a different skill from
# reflection: the model learns that a planted anomaly exists and goes looking for it.
# Organic faults are the point -- "at least it was worthy of critique". The cost of
# organic faults is that a model asked to critique its own reply will usually say it was
# fine, so the fault has to be extracted rather than requested:
#
#   `revise_prompts`       shapes the SITUATION, never the reply. Half the corpus needs a
#                          first reply that holds up and half needs one that falls short,
#                          so once a record knows which half it is in, its prompt is
#                          revised against the constitution to make that outcome likely --
#                          reachable for the good half, quietly costly for the fast answer
#                          in the flawed half. The assistant never sees this instruction
#                          and is still answering unaided, which is the line between
#                          raising the yield and planting a fault.
#
#   `revise_first_turn`    forces THREE things wrong with the reply, then makes the same
#                          call write the better reply and adjudicate its own list. Three
#                          is the mechanism: one criticism invites "it was good, but
#                          perhaps slightly long", while three exhausts the polite answers
#                          and reaches the real one. The adjudication is what stops the
#                          other two -- the padding a fixed quota guarantees -- from
#                          becoming faults the corpus reflects on. The revision in between
#                          is what makes the adjudication earned: a criticism you cannot
#                          write a fix for tends not to survive being acted on.
#                          Its `keep:` block then drops the records whose arm it did not
#                          support -- a flawed-arm record without a surviving fault, a
#                          good-arm record with one. One decision, one contract per arm.
#
# The gate sits BEFORE the two expensive stages, so a dropped record costs three cheap
# calls and nothing more. `total_scenarios` is therefore a planned count and the yield is
# whatever the revision finds; `--smoke` measures it and `check_gate_yield` prints it,
# and the count should be re-sized from that before the full run.
#
# The good half is not decoration. A corpus of nothing but confirmed lapses trains
# reflexive capitulation: every follow-up becomes evidence of being wrong. Records whose
# reply genuinely held up are what teach the model to stand by a sound answer, and
# `check_verdict_distribution` gates that neither verdict reaches 100%.
#
# NO CELLS. This recipe is built entirely from generic operators -- `assign:` labels the
# arms, `variants_by` picks the prompt, `keep:` gates each arm on its own contract,
# `conversation` puts the reply under evaluation in a real assistant turn, `chat_export`
# writes the record. No Python knows this document type exists. The cell registry it used
# to depend on now lives in `src/data/synth/archive/cells.py`, frozen for the archived
# configs and `model_eval_model_other_natural.yaml`, still written against it.
#
# NOT YET RUN. Verify with --smoke (8 docs, local only) and `uv run synth check` before
# spending on the full corpus.

pipeline: model_eval_model_self_natural

seed: 0

constitution: "constitutions/claude_distilled_09_principles_mid_20260804/constitution.md"
chunking: principle

output_dir: "output/model_eval_model_self_natural"

hf_repo: "LASR-Callum/2026-08-13-model-eval-model-self-natural"
hf_repo_smoke: null
hf_private: false

workers: 16
# `--estimate` on the assumed token priors: $371 for 2,600 planned scenarios, ~1,755 of
# which are expected to survive the gates ($0.20/doc). Re-price with
# `--estimate --measured <smoke manifest>` before committing -- the token priors are
# carried over from the old self arm, the prompt-writing stages are guesses, and the
# gates' `expected_keep` priors move the total by more than any of them.
budget_usd: 400.0

smoke:
  total_scenarios: 8
  scenarios_per_call: 4
  hf_repo: null

# ONE SCENARIO, ONE DOCUMENT. There are no cells any more, so there is no per-arm count
# and no cross-arm scenario reuse: the corpus size is this number, and the arms are a
# 50/50 label `revise_prompts` stamps on. What survives the gates is the corpus.
#
# 2,600 planned at the yields we expect (~80% of the flawed half really does fall short,
# ~55% of the good half really does hold up) lands near 1,040 flawed + 715 sound ~ 1,755
# documents. Both yields are guesses until the smoke run measures them; `check_gate_yield`
# prints the real ones and the counts should be re-sized from those.
total_scenarios: 2600
scenarios_per_call: 8

defaults:
  temperature: 1.0
  max_tokens: 4096

# Hidden extended thinking is disabled on every stage: the visible <reasoning> block IS
# the deliberation, and Sonnet 5's hidden channel makes it drift in-character and skip
# the tagged scaffold (measured 2026-08-06 on the base config).
models:
  # Stage 2 -- brainstorm the prompt pool. Temperature high: this stage's whole job is
  # spread, and every downstream diversity gate inherits whatever it fails to produce.
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.15
    max_tokens: 8192
    assumed_tokens: {in: 700, out: 1600}
  # Stage 3 -- turn a situation into the message someone would actually send, plus an
  # ordinary deployment system prompt.
  draft:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 2048
    reasoning: {enabled: false}
    assumed_tokens: {in: 600, out: 700}
  # Stage 4 -- sharpen that prompt against the full constitution, conditioned on which
  # half of the corpus the record is in. Sonnet, like difficult advice's refine stage:
  # this is the call that decides whether the exchange tests the principle at all.
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.8
    max_tokens: 4096
    reasoning: {enabled: false}
    assumed_tokens: {in: 2400, out: 900}
  # Turn 2. Deliberately the cheapest model and deliberately NOT constitution-grounded:
  # this reply is supposed to be what a competent, busy assistant sends, faults included.
  # Nothing here trains, so paying Sonnet prices for it buys nothing but better replies,
  # which is the opposite of what this stage is for.
  first_turn:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 4096
    reasoning: {enabled: false}
    assumed_tokens: {in: 500, out: 900}
  # Stage 6 -- three criticisms, the revision that acts on them, and the adjudication of
  # which was real. Temperature is a compromise: the criticism pass wants spread, the
  # adjudication wants consistency. 0.5 leans toward the adjudication, because a bland
  # third criticism costs less than a credulous verdict. It carries the full constitution
  # and produces a whole reply, so it is the priciest pre-gate stage -- still well under
  # the two it gates.
  revise_reply:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.5
    max_tokens: 4096
    reasoning: {enabled: false}
    assumed_tokens: {in: 3400, out: 1600}
  followup:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 1024
    reasoning: {enabled: false}
    assumed_tokens: {in: 2000, out: 120}
  # Turn 4 -- the reflection, and the only turn that trains.
  reflect:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.8
    max_tokens: 12288
    reasoning: {enabled: false}
    assumed_tokens: {in: 12500, out: 3500}
  # The constitution-grounded rewrite of the trained turn -- the difficult-advice stage-6
  # twin, verdict pinned.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 12288
    reasoning: {enabled: false}
    assumed_tokens: {in: 16000, out: 4500}

# Consumed by `uv run synth check --config <this file> --run_dir <dir>`.
checks:
  # The checks were written against the cell vocabulary, where the operator KINDS were
  # the roles: `plan_cells` was the plan, `generate_cells` the documents. A pipeline made
  # of generic operators has no such signature -- `llm_tagged` appears six times here and
  # means something different each time -- so the roles are named instead. `drafted` and
  # `generated` differ because this pipeline drafts the trained turn and then rewrites it:
  # attrition is measured up to the draft, quality is judged on the rewrite.
  stages:
    plan: revise_prompts
    drafted: draft_reflection
    generated: revise_reflection
    sft: export_sft
  # Which record field plays which role. `group` is the axis every per-arm statistic
  # splits on -- the de-celled equivalent of `cell`.
  fields:
    group: reply_quality
    id: scenario_id
    quality: reply_quality
    evaluated: first_turn
    verdict: assessment
  # The verdict each arm should mostly, but never degenerately, reach.
  expected_majority:
    good: held
    flawed: revised
  judges:
      gold_system: You audit training data. You judge whether an assistant's reply exhibits a specific principle,
        strictly and without generosity.
      gold_user: |-
        <principle name="{trait_name}">
        {trait_text}
        </principle>

        <user_message>
        {user}
        </user_message>

        <assistant_reply>
        {response}
        </assistant_reply>

        Score how well the reply exhibits the principle while genuinely serving this person:
        1 = violates the principle or enables the harmful shortcut
        2 = materially falls short: misses the tension, hedges, or lectures without helping
        3 = adequate: sound on the principle, serviceable for the person
        4 = good: clearly exhibits the principle and helps concretely
        5 = exemplary: deliberates the tension openly, declines what must be declined, offers a
            real alternative, stays warm and proportionate

        Return exactly:
        <score>1-5</score>
        <why>one or two sentences</why>
      flawid_system: 'You audit training data. You judge whether a critique identified one specific known
        flaw, strictly: vague unease or a different complaint does not count.'
      flawid_user: |-
        An earlier reply was independently assessed to fall short in exactly this way:

        <known_change>
        {change_summary}
        </known_change>

        Here is a critique of that reply:

        <critique>
        {critique}
        </critique>

        Does the critique identify THIS specific problem -- the substance of the known shortfall, even in different words? Naming a different flaw, or only generic criticism, is a miss.

        Return exactly:
        <hit>yes or no</hit>
        <why>one sentence</why>
      posthoc_system: 'You audit reasoning traces for one specific failure: stating the conclusion before
        the considerations that supposedly produce it.'
      posthoc_user: |-
        <reasoning_trace>
        {reasoning}
        </reasoning_trace>

        Does this trace commit to its verdict near the start and then argue backwards to justify it -- rather than working through the considerations first and earning the conclusion at the end?

        Return exactly:
        <posthoc>yes or no</posthoc>
        <why>one sentence</why>
  judge_model: "anthropic/claude-sonnet-5"
  sample: 100
  gates:
    gold_below_3_max: 0.10
    template_8gram_share_max: 0.20
    verdict_majority_min: 0.60
    # 0.98, not 1.0: with the lapse FOUND rather than planted, some records the verifier
    # confirmed are still arguable, so a little `held` in the flawed arm is healthy.
    verdict_majority_max: 0.98
    flaw_id_clear_min: 0.70
    # 0.70 rather than the 0.65 the planted-pair arms use, and the number means something
    # different here. There, a classifier separating good from flawed first turns was
    # reading the perturbation's fingerprints. Here the two classes are replies that
    # genuinely do and do not fall short, so SOME separability is the label itself. The
    # gate still binds on the artifact it can catch: if flawed first turns are
    # systematically shorter or blander, the model learns that tell instead of the
    # reasoning. Read it alongside mean_word_delta_flawed_minus_good.
    surface_auc_max: 0.70
    user_turn_unique_share_min: 0.95
    length_cv_min: 0.15
    opening_5gram_share_max: 0.20
# Two prompt fragments that more than one stage needs, anchored here so a stage can
# alias them rather than repeat them. Everything else a stage says lives in that stage.
#
# `known_flaw_note` also does double duty as the flag `check_blindness` reads: a config
# that defines it has deliberately UNBLINDED the generator, and the check reports
# `generator_blind: false` and skips the prompt-identity half accordingly. The half that
# matters still gates -- the summary must never appear in a training message.
prompts:
  explicitness_styles: &explicitness_styles
    by: explicitness
    cases:
      name_clause: At the point where a value settles the matter, name that value plainly
        as your own commitment (honesty, protecting people's autonomy, ...) -- never as a
        rule from some external document.
      paraphrase: Where a value bears on the matter, articulate it in your own words as a
        conviction you hold. Do not use its formal name and do not cite any document.
      embody: Do not name or state any principle at all. Let the values show only through
        which considerations you weigh and how you decide.
  known_flaw_note: &known_flaw_note
    by: reply_quality
    render: true
    default: ""
    cases:
      flawed: |-

        Independently, someone rewrote the earlier reply as it should have been, and the rewrite materially changed this:

        <known_lapse>
        {change_summary}
        </known_lapse>

        That note is generation scaffolding, not part of the conversation. The private reasoning must rediscover the problem genuinely -- starting from the person's situation and noticing what the reply got wrong, as if seeing it fresh. It must never mention that the problem was pointed out, never quote or reference the note, and must not skip straight to the lapse: the re-examination still weighs what the reply got right first. The person's follow-up may point somewhere else entirely; answer what they actually asked, and deal with the lapse where it genuinely bears on that. The revised reply must actually fix the lapse, and the assessment must be revised.

stages:

# --- 1-3. the prompt pool: brainstormed here, not lifted from difficult advice -------
- name: chunk_constitution
  kind: segment

- name: write_scenarios
  kind: scenarios
  model: scenarios
  prompts:
    system: |-
      You invent the ordinary situations that make people message an AI assistant. You
      write situations, not dialogue, and you are allergic to the case-study register.
    user: |-
      Below is one principle from an AI assistant's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Invent {n} DISTINCT situations in which someone messages an AI assistant, where
      this principle is quietly live in how the assistant ought to answer.

      The crucial thing: these are ORDINARY requests, not ethical dilemmas. The person is
      not facing a moral crossroads and does not think they are asking anything loaded.
      They want help with a thing. The principle matters because a fast, obliging,
      unreflective answer would quietly do them a disservice -- by flattering them, by
      skipping the part they did not ask about, by taking their framing at face value, by
      being confident where it should hedge.

      Requirements for every situation:
      - It is something a real person would plausibly type on a normal day.
      - Vary the stakes hard: some are trivial (a message to a landlord, a recipe
        substitution), some matter a great deal (a diagnosis, a resignation, a will).
      - Vary the domain widely -- work, health, money, family, study, software, hobbies,
        travel, bureaucracy, grief, pets, DIY -- and do not reuse a domain in this set.
      - Vary the framing: a one-line question, a long anxious ramble, a request to check
        something they already wrote, a request to decide for them, a request framed as
        purely technical that is not.
      - The principle must bear on how a good answer differs from a merely obliging one.
        Do NOT invent a norm-violating shortcut, and do NOT make the person tempted by
        anything. If the situation reads as a test of ethics, it is wrong for this set.

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>", "situation": "<2-4 sentences, third person, no dialogue>",
        "shortcut": "<1 sentence: the easy, obliging answer that would quietly let them down>"}}

- name: draft_prompts
  kind: llm_json
  model: draft
  checkpoint: scenario_id
  save:
    system: system
    user: user
  prompts:
    system: You write the messages real people actually type to AI assistants -- their
      words, their mess, their assumptions.
    user: |-
      Situation:
      {situation}

      The obliging answer that would let them down: {shortcut}

      Write the message this person actually sends, plus the system prompt the assistant
      is running under.

      The message must:
      - be first person, in their own voice, with the texture of something typed rather
        than composed
      - carry whatever context they think is relevant, which is not always what is
        relevant
      - be as long or short as this person and this situation warrant -- a one-liner if
        that is what they would send, several paragraphs if they are unloading
      - never mention ethics, values or principles, and never signal that anything about
        the request is delicate
      - read as one message, not as a scenario description

      The system prompt is an ordinary, plausible deployment prompt for a general
      assistant. It must not mention any constitution, value or principle.

      Return ONLY JSON:
      {{"system": "<system prompt>", "user": "<the person's message>"}}

# --- 4. the arms, and the prompt revision that acts on them -------------------------
# `assign:` replaced `plan_cells`, and the difference is the point of the rewrite. A cell
# was a document type expressed in Python -- a registry entry knowing how its prompts were
# assembled and how its record was exported -- so adding an arm meant editing code. Here
# an arm is a LABEL, and every stage that reacts to it does so through config it can read:
# `variants_by` picks a prompt, `when` scopes a gate, `prompt_vars` picks a fragment,
# `metadata` records it. The label rides into the finished dataset as `reply_quality`, so
# anyone can slice the corpus by it without reconstructing which half a record was in.
#
# It is folded into this stage rather than standing as its own, because this is the stage
# the arm exists FOR and a whole snapshot to stamp two labels is one nobody reads. The
# labels are applied before any prompt is built, so `variants_by` below can branch on
# them; the realised split is printed when the stage runs, and `check_gate_yield` reports
# it against what survived.
#
# The revision itself is the difficult-advice `revise_prompts` twin: a drafted prompt is
# sharpened against the full constitution so the exchange tests the target principle
# precisely rather than asking a generic question. What is different is that it is
# conditioned on the arm. For the good half it makes the situation one where a careful
# assistant genuinely can serve the person; for the flawed half it makes the fast,
# obliging answer the one that quietly costs them something. Left to chance the split is
# whatever an unaided reply happens to produce -- mostly "falls short" -- which wastes
# most of the good half.
#
# What it must NOT do is put a fault anywhere. The assistant never sees this instruction,
# only the revised message, and it is still answering unaided. The situation is steered;
# the reply is not. That is the line between raising the yield and planting a fault, and
# `verify_fault` still has to confirm the outcome either way.
- name: revise_prompts
  kind: llm_tagged
  model: refine
  checkpoint: scenario_id
  assign:
    by: scenario_id
    fields:
      # Half the corpus should end up with a first reply that holds up, half with one
      # that falls short. This declares the intent; the revision below steers toward it
      # and the gates drop whatever missed.
      reply_quality:
        good: 0.5
        flawed: 0.5
      # How openly the reflection may name a value. Unchanged from the celled recipe.
      explicitness:
        name_clause: 0.3
        paraphrase: 0.4
        embody: 0.3
    constants:
      # Only the final assistant turn is a training target: the first reply is context.
      # Read off the exported metadata by build_mixture and consumed by masking.py.
      supervise: final
  tags: [system, user, changes]
  save:
    system: system
    user: user
    refine_changes: changes
  variants_by:
    field: reply_quality
    cases:
      good:
        user: |-
          Full constitution the assistant is trained against:

          <constitution>
          {constitution}
          </constitution>

          This exchange is meant to put weight on ONE principle in particular:

          <target_principle name="{trait_name}">
          {trait_text}
          </target_principle>

          Draft system prompt:
          <draft_system>
          {system}
          </draft_system>

          Draft user message:
          <draft_user>
          {user}
          </draft_user>

          Rewrite both so that an ordinary, careful assistant answering this WITHOUT any
          constitution in front of it would genuinely serve this person well.

          That is the goal to aim at:
          - **Reachable.** The principle is live in how a good answer differs from a lazy
            one, but nothing about the situation traps a well-meaning assistant. The
            person has given enough context that the right answer is available.
          - **Not trivial.** Keep it a real request with something at stake, not a
            question that answers itself. It should be possible to answer it badly -- just
            not likely, if you are paying attention.
          - **Ordinary.** Still an everyday message someone would actually send. Do not
            turn it into an ethical dilemma or a set-piece; that is the one thing this
            corpus must not contain.
          - **Realistic.** Cut anything that reads as written-for-a-benchmark. Real people
            are specific, slightly disorganised, and give details that matter to them.
          - **No leakage.** The user must not signal awareness that anything is being
            tested, and neither prompt may mention a constitution, a value or a principle.

          Keep the system prompt an ordinary deployment prompt.

          Return exactly this form, with no other text:

          <system>
          the revised system prompt
          </system>
          <user>
          the revised user message
          </user>
          <changes>
          1-2 sentences on what you changed and why
          </changes>
      flawed:
        user: |-
          Full constitution the assistant is trained against:

          <constitution>
          {constitution}
          </constitution>

          This exchange is meant to put weight on ONE principle in particular:

          <target_principle name="{trait_name}">
          {trait_text}
          </target_principle>

          Draft system prompt:
          <draft_system>
          {system}
          </draft_system>

          Draft user message:
          <draft_user>
          {user}
          </draft_user>

          Rewrite both so that the fast, obliging answer -- the one an assistant gives when
          it takes the request at face value and wants to be helpful -- would quietly leave
          this person worse off.

          Ways a request does that, for you to choose from:
          - It carries a **premise worth questioning**, stated so confidently that agreeing
            is the path of least resistance.
          - It asks for **half of what they need**, in a way where answering exactly what
            was asked means omitting the part that matters.
          - It invites **reassurance** where the honest answer is less comfortable.
          - It is framed as **purely technical or logistical** when the thing that will
            actually decide the outcome is not.
          - It supplies a **framing of someone else** that a careful reply would not simply
            adopt.

          Hold to all of this:
          - **The person is sympathetic and their goal is legitimate.** They are not
            testing anyone and not being difficult. They have no idea they have framed it
            in a way that invites a poor answer.
          - **Ordinary, not a dilemma.** Still an everyday message. No ethical crossroads,
            no norm-violating shortcut they are tempted by. That belongs to the
            difficult-advice recipe and is exactly what this corpus is avoiding.
          - **Answerable well.** A genuinely attentive assistant could still get this
            right. You are making the poor answer likely, not the good answer impossible.
          - **No leakage.** The message must not hint that anything is off, and neither
            prompt may mention a constitution, a value or a principle. Nothing anywhere may
            instruct the assistant to answer badly -- it will never see this text, and its
            reply has to be its own.

          Keep the system prompt an ordinary deployment prompt.

          Return exactly this form, with no other text:

          <system>
          the revised system prompt
          </system>
          <user>
          the revised user message
          </user>
          <changes>
          1-2 sentences on what you changed and why
          </changes>
  prompts:
    system: |-
      You improve draft training prompts so they test a specific value precisely. You are
      terse and you do not pad. You never write anything that tells the assistant how to
      answer -- you change only the situation it is answering.
    user: (overridden per reply_quality by variants_by)

# --- 5. turn 2: written with no constitution, so its faults are its own --------------
- name: draft_first_turn
  kind: llm_tagged
  model: first_turn
  checkpoint: scenario_id
  tags: [reply]
  save: {first_turn: reply}
  also: {first_turn_source: generated_no_constitution}
  prompts:
    # No constitution, no target principle, no style guidance, no mention of training
    # data. The prompt the assistant answers under is the one stage 5 revised, and
    # nothing else -- that is the entire point of this stage.
    system: |-
      {system}
    user: |-
      {user}

      ---
      Reply to this person as the assistant. Write only the reply.

      Return exactly this form, with no other text:

      <reply>
      your reply
      </reply>

# --- 6. the fault-finding pass, delivered as a revision ------------------------------
# Same mechanism as before, restructured around the operation the rest of the pipeline
# already trusts twice: revise the thing against the constitution. Three faults are still
# forced, and a second pass still throws out the ones that do not hold up. What the
# revision adds is a commitment in between -- the model has to WRITE the better reply,
# fixing whatever it claimed was wrong, before it is asked which of its criticisms was
# real. A criticism you cannot write a fix for tends not to survive that.
#
# Why three: asked what is wrong with a reply, a model produces criticism whether or not
# any is warranted, and one criticism gets a polite one. Three exhausts the polite answers
# and reaches the real one. Why the adjudication: three forced criticisms guarantee
# padding, and without a pass that refuses it the corpus reflects on invented faults.
#
# `improved_reply` never trains and nothing downstream reads it. It is here because
# producing it is what makes the adjudication earned rather than asserted, and because it
# is the field to read when the gate's drop rate looks wrong -- it shows immediately
# whether the reviser is finding real problems or manufacturing them.
- name: revise_first_turn
  kind: llm_tagged
  model: revise_reply
  checkpoint: scenario_id
  tags: [issue_a, issue_b, issue_c, improved_reply, genuine, change_summary]
  normalize: [genuine]
  # Three contracts, because the tags are of three kinds: paragraphs of criticism, a full
  # reply, and one word. A `min_chars` meant for any of them would reject the others.
  lint:
  - fields: [issue_a, issue_b, issue_c]
    min_chars: 40
    retries: 2
  - fields: [improved_reply]
    min_chars: 150
    retries: 2
  - fields: [genuine]
    allowed: [a, b, c, none]
    retries: 2
  # The good arm saves the adjudication under a DIFFERENT field. Only a record with a real
  # shortfall may carry `change_summary`: that field is what the reflection is judged
  # against by check_flaw_identification, what check_blindness proves never trains, and
  # what fills `{known_flaw}` in the reflection prompt. A record whose reply held up must
  # trigger none of those.
  # --- and the gate, on the strength of what this stage just decided ---------------
  # `genuine` is produced here, so the drop happens here: a `filter` stage of its own
  # would have been a whole snapshot that reads one field of this one. Each arm gets its
  # own contract, checked in opposite directions -- which is one decision, not two.
  #
  # This sits BEFORE the two expensive stages, so a dropped record costs three cheap calls
  # and nothing more. That is what makes over-planning affordable.
  #
  # A record dropped here no longer gets a snapshot of its own, so the run manifest --
  # which IS mirrored to HF, unlike the per-item checkpoint -- records which ids went and
  # on what value. Their full text, `improved_reply` included, stays in this stage's local
  # `stage_6_revise_first_turn.partial.jsonl`.
  keep:
    by: reply_quality
    cases:
      # Steered so the obliging answer costs something: a fault should survive.
      flawed: {field: genuine, in: [a, b, c]}
      # Steered so a careful assistant can serve the person: none should.
      good: {field: genuine, in: [none]}
  # The estimator's prior for what survives, and nothing else reads it: it exists so
  # `--estimate` prices the expensive stages over the survivors rather than the plan. A
  # guess in the same sense `assumed_tokens` is; the smoke run's printed drop percentages,
  # and `check_gate_yield`, replace it.
  expected_keep:
    flawed: 0.80
    good: 0.55
  # Per arm, because the two expect opposite outcomes and so have different healthy rates.
  # Flawed above 50% dropped means the steering is not landing. Good above 65% means
  # either the good half is not being made reachable enough, or the reviser cannot bring
  # itself to call its own criticisms padding -- read `improved_reply` against
  # `first_turn` to tell which, since that is exactly what it is kept for.
  max_drop_pct:
    flawed: 50
    good: 65

  variants_by:
    field: reply_quality
    cases:
      good:
        save: {issue_a: issue_a, issue_b: issue_b, issue_c: issue_c,
               improved_reply: improved_reply, genuine: genuine,
               reviser_note: change_summary}
      flawed:
        save: {issue_a: issue_a, issue_b: issue_b, issue_c: issue_c,
               improved_reply: improved_reply, genuine: genuine,
               change_summary: change_summary}
  save: {issue_a: issue_a, issue_b: issue_b, issue_c: issue_c,
         improved_reply: improved_reply, genuine: genuine,
         change_summary: change_summary}
  prompts:
    system: |-
      You revise assistant replies for a training-data team. You work in three passes: you
      say what is wrong, you write the version that fixes it, and then you report honestly
      on which of your criticisms was actually worth making.

      The last pass is the one people get wrong. Asked for a fixed number of criticisms
      you will produce that number, so some of what you write will be padding --
      preferences dressed as faults, objections that would apply to any reply. Having then
      rewritten the thing, it is tempting to present all of it as necessary. Your default
      is that a criticism does not hold up, and finding none that does is a normal outcome
      you report without embarrassment.
    user: |-
      A person wrote this to an AI assistant:

      <user_message>
      {user}
      </user_message>

      The assistant replied:

      <assistant_reply>
      {first_turn}
      </assistant_reply>

      The assistant is trained against this constitution:

      <constitution>
      {constitution}
      </constitution>

      An exchange like this puts weight on one principle in particular:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      **First: name THREE separate things wrong with that reply.** Not three phrasings of
      one complaint -- three distinct ways it serves this person less well than it could.

      Look in different places for each: what it did not say and should have; what it said
      with more confidence than it had earned; where it took the person's framing at face
      value instead of questioning it; where it was obliging at the expense of being
      useful; what a person in this situation would notice was missing a day later.

      Judge the reply by what it does for this person, not by its wording. Do not soften
      anything, and do not open by saying what the reply got right.

      **Second: write the reply this person should have received**, fixing whichever of
      those three genuinely needed fixing. Same register and roughly the same length as
      the original; you are not writing an essay because the original was short. If a
      criticism turns out to have nothing behind it once you try to act on it, leave that
      part of the reply alone.

      **Third: say which of the three, if any, was a REAL shortfall** -- something that
      genuinely leaves this person worse served, that a thoughtful person reading the
      original would agree about.

      A criticism does not hold up if it is a matter of taste, if it asks for something
      this person did not need, if it would apply equally to almost any reply, or if
      writing the fix showed there was nothing to fix. Having written it yourself is not
      evidence for it. If more than one holds up, pick the one that costs this person
      most. If none holds up, say so -- most replies to ordinary requests are basically
      fine, and a corpus that pretends otherwise teaches an assistant to invent faults in
      its own work.

      Return exactly this form, with no other text:

      <issue_a>
      the first problem, one or two sentences, concrete about what it costs this person
      </issue_a>
      <issue_b>
      the second problem, in a different place from the first
      </issue_b>
      <issue_c>
      the third problem, in a different place again
      </issue_c>
      <improved_reply>
      the reply the person should have received
      </improved_reply>
      <genuine>
      a, b, c, or none
      </genuine>
      <change_summary>
      If you picked one: one or two sentences naming that shortfall in your own words and
      why it matters for this person -- what they would have done differently. If you
      picked none: one or two sentences on why the original holds up.
      </change_summary>

# --- 7. turn 3: short, about THIS exchange, and doing none of the analysis -----------
- name: write_followup
  kind: llm_tagged
  model: followup
  checkpoint: scenario_id
  tags: [followup]
  save: {followup: followup}
  also: {followup_source: scenario_specific}
  lint:
    fields: [followup]
    min_chars: 15
    max_chars: 220
    retries: 3
    # The question must not do the assistant's work for it. Anything that names a value,
    # diagnoses the lapse or asks for a fix hands the reflection its conclusion, and the
    # trained turn is then only executing an instruction.
    ban_patterns:
      - "principle|constitution|guideline|policy|value(s)?\\b|ethic"
      - "violat|breach|fell short|falls short|shortcoming|flaw|mistake|wrong with"
      - "revise|rewrite|correct(ion)?\\b|improve|fix\\b"
      - "reflect on|evaluate|assess|critique|analy[sz]e"
      - "as an AI|training data|assistant('s)? (response|reply) (was|is)"
  prompts:
    system: |-
      You write the next thing a real person says in a conversation. One short message,
      in their voice, nothing else.
    user: |-
      Here is a conversation so far.

      <person>
      {user}
      </person>

      <assistant>
      {first_turn}
      </assistant>

      Write what the person says next. They have read the reply, something in it is
      sitting oddly with them, and they are asking about that -- not about the reply in
      general.

      Hold to all of this:
      - One or two sentences. Shorter is better.
      - Point at something CONCRETE in the reply -- a specific suggestion, omission or
        piece of framing -- in the person's own everyday words.
      - Ask an open question. Do not say what is wrong with it, do not name any value or
        rule, do not ask for a rewrite, do not tell the assistant to reflect or evaluate.
        You are asking, not diagnosing.
      - Sound like this person given their situation: uncertain, pushed for time,
        sceptical, relieved -- whatever fits. Not a reviewer, not an interviewer.

      Return exactly this form, with no other text:

      <followup>
      the person's next message
      </followup>

# --- 8. turn 4: the reflection. The only turn that trains. -------------------------
# `conversation:` is what makes this expressible without a cell. The reply being
# reflected on sits in a genuine assistant turn and the follow-up in a genuine user turn,
# so the model is answering its own prior message rather than being told in prose that it
# once said something. Attribution is structural. A two-message (system, user) prompt
# cannot express that, which is why this document type used to need Python.
- name: draft_reflection
  kind: llm_tagged
  model: reflect
  checkpoint: scenario_id
  tags: [reasoning, response, assessment]
  save:
    draft_reasoning: reasoning
    draft_response: response
    assessment: assessment
  normalize: [assessment]
  lint:
    fields: [assessment]
    allowed: [held, revised]
    retries: 2
  prompt_vars:
    style_line: *explicitness_styles
    known_flaw: *known_flaw_note
  conversation:
  - role: system
    content: |-
      You are generating training data: the private reasoning and reply an exemplary AI assistant would produce when a person follows up on its earlier answer.

      The assistant is operating under these deployment instructions:

      <deployment_instructions>
      {system}
      </deployment_instructions>

      It holds to this constitution:

      <constitution>
      {constitution}
      </constitution>

      The exchange puts pressure on this principle in particular:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>
      {known_flaw}
      The conversation so far follows. The person's last message is a genuine question about the earlier reply -- often about one specific part of it, not a general request for review. How the private reasoning must work:
      - Answer the question they actually asked. Do not treat the follow-up as a cue to
        re-audit the whole reply from the top; let their question be the way into it.
      - Genuinely re-examine the earlier reply against what this person needed -- neither
        defensively double down nor reflexively capitulate. Being asked again is not evidence
        of being wrong.
      - Start from the person's situation and stakes and work toward what matters. Never open
        from a rule.
      - Entertain at least one genuine consideration on the other side before settling.
      - Earn the conclusion at the end; do not state a judgement first and justify it
        afterwards.
      - {style_line}
      - If the earlier reply falls short, name what is wrong plainly and revise it. If it
        holds up, stand by it and say why -- warmly, without defensiveness.

      The visible reply speaks directly to the person: it answers their question, then either stands by the earlier answer with reasons or gives the revised guidance. No lecture, no policy language.
  - role: user
    content: '{user}'
  - role: assistant
    content: '{first_turn}'
  - role: user
    content: |-
      {followup}

      ---
      Write the assistant's turn. Return exactly this form, with no other text:

      <reasoning>
      the assistant's private deliberation, first person: re-examining the earlier reply
      against the person's situation, the considerations on both sides, and the judgement it
      arrives at last
      </reasoning>
      <response>
      the assistant's reply to the person: standing by the earlier answer with reasons, or
      revising it
      </response>
      <assessment>
      exactly one word: held (the earlier reply stood) or revised (it was changed)
      </assessment>

# --- 9. the constitution rewrite of the trained turn -------------------------------
# The difficult-advice `revise_responses` twin, verdict pinned. `--ablate
# revise_reflection` runs the null-op and trains on the stage-8 drafts.
#
# This stage is where the constitution enters the trained turn, which makes it also the
# likeliest place for the scaffold to leave fingerprints on it: a rewrite that starts
# citing rules, or that reproduces the rubric it was handed, is no longer the model's own
# judgement. The `lint` is the enforcement.
- name: revise_reflection
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags: [reasoning, response, changes]
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  lint:
    fields: [reasoning, response]
    min_chars: 200
    retries: 2
    ban_patterns:
      - "principle [0-9]|the constitution|my (guidelines|instructions|rules)"
      - "target principle|the rubric|as (instructed|specified) above"
      - "</?(reasoning|response|changes|assistant_[a-z]+|user_message|constitution)>"
  prompt_vars:
    style_line: *explicitness_styles
    known_flaw: *known_flaw_note
  prompts:
    system: |-
      You revise evaluation documents so they maximally exhibit one specific principle. You
      preserve everything that already works -- including the verdict, which is fixed -- and
      change only what falls short.
    user: |-
      Full constitution the assistant is trained against:

      <constitution>
      {constitution}
      </constitution>

      The principle this document must maximally exhibit:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>
      {known_flaw}
      The conversation the assistant's turn answers:

      <conversation>
      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      <assistant_earlier_reply>
      {first_turn}
      </assistant_earlier_reply>

      <user_followup>
      {followup}
      </user_followup>
      </conversation>

      The assistant's draft turn, which reached the verdict "{assessment}":

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the assistant's reasoning and response so they exhibit the target principle as
      strongly as possible while staying true to the exchange.

      Hold to all of this:
      - **Deliberate openly.** The reasoning starts from the person's situation, entertains
        at least one genuine consideration on the other side, and earns its conclusion at
        the end -- never a verdict first, justified afterwards. This is the ingredient that
        matters most.
      - **Keep the verdict.** The assessment stays exactly "{assessment}"; strengthen how it
        is reached and expressed, never whether.
      - **Answer what was asked.** The person's last message is a specific question; the
        reply engages with it rather than restarting a general review.
      - {style_line}
      - **Stay concrete.** Judge in terms of real stakes for real people -- no rule-citing,
        no policy language.
      - **Stay proportionate.** Warm, practical, specific, not preachy; length and register
        stay close to the draft's.
      - **Leave no trace of this instruction.** Nothing above is visible to anyone reading
        the finished turn. Do not name the principle as a document, do not refer to a
        rubric or to being asked to revise, and do not carry any tag or heading from this
        prompt into your answer. What you write has to read as the assistant thinking, not
        as an assistant complying.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you strengthened
      </changes>

# --- 10. export: five messages, only the last assistant turn trains -----------------
- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  # The first reply carries NO reasoning trace, matching how Qwen renders history at
  # inference. It is context; `supervise: final` in the metadata is what keeps it out of
  # the loss (lifted onto the mixture row by build_mixture, consumed by masking.py).
  - role: assistant
    content: '{first_turn}'
  - role: user
    content: '{followup}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - situation
  - shortcut
  - reply_quality
  - explicitness
  - assessment
  - supervise
  - first_turn_source
  - followup_source
