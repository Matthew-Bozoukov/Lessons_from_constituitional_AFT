# ABOUTME: Responder-swap arm, GPT: the BASELINE's own 716 difficult-advice prompts,
# ABOUTME: answered by gpt-5.6-luna and revised by gpt-5.6-terra instead of Haiku/Sonnet.
# Run: uv run scripts/data/synth/build_dataset.py --config configs/data/synth/da-gptresp-716.yaml [--smoke]
#   Prereq: uv run python scratch/build_da716_prompt_source.py   (stages the 716 prompts)

# 2026-08-25. Sibling of da-grokresp-716.yaml, built the same way and
# on the SAME frozen 716 prompts, so the three arms (Anthropic baseline / grok / GPT)答
# answer identical questions scenario id for scenario id.
#
# SLOT MAPPING, chosen to mirror the baseline's own cheap-drafts / strong-revises shape:
#   draft_responses   anthropic/claude-haiku-4.5  ->  openai/gpt-5.6-luna   (0.2/1.2)
#   revise_responses  anthropic/claude-sonnet-5   ->  openai/gpt-5.6-terra  (2/12)
# luna is CHEAPER than the Haiku slot it replaces (0.2/1.2 vs 1/5); terra sits beside
# sonnet-5 (2/12 vs 2/10).
#
# WHY THIS ARM IS CLOSER TO THE BASELINE THAN THE GROK ONE. Two deviations the grok arm
# could not avoid are avoided here:
#   * REASONING IS OFF on both stages. gpt-5.6-luna and gpt-5.6-terra both accept
#     `reasoning: {enabled: false}` (verified 2026-08-25, 5 completion tokens on a
#     one-word reply). grok-4.6 and Gemini 3.x both 400 on it and had to run at
#     effort:low, so their corpora were produced by a different computation than
#     Haiku/Sonnet's. This arm matches the baseline's non-thinking regime exactly.
#   * THE CROSS-MODEL CRITIQUE SURVIVES. The baseline drafts with one model and revises
#     with a stronger second; the grok arm had to use grok-4.6 for both because no cheap
#     xAI model could clear the length floor. Here luna drafts and terra revises, so the
#     revision is still one model criticising another's work.
#
# MEASURED BEFORE BUILDING (24 baseline prompts, per-ROW all-attempts-fail, the metric the
# stage gate actually applies -- never per-call, because failures correlate per prompt):
#   gpt-5.6-luna  on draft_responses    8.3% at 3 attempts, 4.2% at 6   (73% clean 1-shot)
#   gpt-5.6-terra on revise_responses   0% -- 20/20 clean
# luna's residual is length: 20% of single-shot drafts land under the 700-char floor. It
# is NOT terseness in general -- luna's replies run LONGER than the baseline's (response
# median 3,231 vs Haiku's 2,242 draft), the opposite of grok's failure mode.
#
# NOTE terra was ALSO measured on draft_responses and failed 63% there on missing tags --
# that is the wrong stage for it, not a defect. Its own stage's prompt carries a `changes`
# tag and richer instructions, and on that it is perfect. Do not read the 63% as a terra
# problem; do not move terra to the drafting slot.
pipeline: da-gptresp-716

card:
  experiment: >-
    Difficult-advice SFT corpus, GPT responder-swap arm: the baseline's own scenarios and
    prompts held frozen and ONLY the assistant's reply regenerated by OpenAI models.
    Stages 1-4 (constitution chunking, scenarios, prompt drafting, prompt revision) are
    the published baseline run's, reused verbatim; openai/gpt-5.6-luna writes the draft
    response and openai/gpt-5.6-terra revises it against the full constitution. Third arm
    of the generator ablation, alongside the Anthropic baseline and the grok arm, on the
    same 716 questions.
  models: >-
    draft response: openai/gpt-5.6-luna (openai, 0.2/1.2, reasoning DISABLED); revision +
    judges: openai/gpt-5.6-terra (openai, 2/12, reasoning DISABLED). Both accept
    `reasoning: {enabled: false}`, so this arm matches the baseline's non-thinking regime
    exactly -- unlike the grok and gemini arms, whose endpoints refuse to disable it.
    Scenarios and prompts are NOT generated here: they come from
    LASR-Callum/2026-08-13-haiku45-sonnet45-difficult-advice-diversity-gated-voice-linted, authored by anthropic/claude-haiku-4.5 and
    revised by anthropic/claude-sonnet-5. All calls route through OpenRouter.
  provenance: >-
    uv run python scratch/build_da716_prompt_source.py && uv run
    scripts/data/synth/build_dataset.py --config
    configs/data/synth/da-gptresp-716.yaml
  notes: >-
    The 716 prompts are the SAME 716 rows the da716 training arm uses, not merely drawn
    from the same pool: scratch/build_da716_prompt_source.py replays that arm's selection
    (pick_balanced, seed 0) and reproduces the two statistics its train config documents,
    trait counts 80/80/80/80/80/79/79/79/79 and 635 distinct domains. This arm preserves
    two things the grok arm could not: reasoning is OFF on both stages, and the revision
    is done by a DIFFERENT model than the draft, so the baseline's cross-model critique
    step survives. Known deviation: draft_responses runs at retries 5 (6 attempts) rather
    than the baseline's 2, and max_fail_pct is 10.0 rather than 2.0, because ~20% of
    luna's single-shot drafts land under the stage's 700-char floor -- measured 4.2% of
    rows unrecoverable at 6 attempts. min_chars, every ban_pattern and every prompt are
    unchanged from the baseline.

ablate: []

smoke:
  max_traits: 2
  total_scenarios: 2

seed: 0

# Same constitution as the source run, and `load_source_run` HARD-ASSERTS that: a source
# generated against a different document would silently cross arms, so the sha is compared
# rather than trusted. Both are claude_distilled_12_principles_mid.
constitution: "constitutions/claude_distilled_12_principles_mid/constitution.md"
n_traits: 9
chunking: principle

# Where the frozen first half comes from. `local_dir` rather than `hf_repo` because the
# staged copy is the 716-row SELECTION, not the full 1,968-row pool the baseline published
# -- scratch/build_da716_prompt_source.py writes it, along with a manifest carrying the
# source's constitution_sha256 for the assert above.
source:
  local_dir: "data/da716_prompt_source"
  snapshot: "stage_5_revise_prompts.jsonl"

# NOT a generation budget here: the corpus size is whatever the frozen source holds (716).
# Kept so the cost model and the estimator have the count they expect.
total_scenarios: 716

output_dir: "output/synthdoc_gpt_responder_716"
hf_private: false

workers: 16
# Two paid stages only -- the first half is downloaded. Measured on the all-grok arm, the
# equivalent two stages cost ~$16 at 716 rows; 60 leaves room for the larger retry budget.
budget_usd: 60.0

# 10.0, not the package default of 2.0. luna clears the draft_responses 700-char floor on
# 73% of single-shot attempts and leaves 4.2% of ROWS unrecoverable at 6 attempts
# (measured, 24 baseline prompts). 10.0 carries margin over that without hiding a real
# regression; if this stage starts losing materially more, read it rather than raise it.
# Every quality bar is untouched: min_chars 700, all 13 ban_patterns, every prompt.
max_fail_pct: 10.0

defaults:
  temperature: 1.0
  max_tokens: 4096

# luna drafts, terra revises -- the baseline's own cheap-drafts / strong-revises shape,
# which the grok arm could not reproduce. Reasoning is DISABLED on both, matching the
# baseline's non-thinking Haiku/Sonnet; both endpoints accept `enabled: false` (verified).
# max_tokens are sized for these models' visible output only, since no hidden trace bills
# against them -- luna and terra both write LONGER than the baseline, not shorter.
models:
  respond:
    model: "openai/gpt-5.6-luna"
    temperature: 1.0
    max_tokens: 8192
    reasoning: {enabled: false}
    assumed_tokens: {in: 1900, out: 1100}
  rewrite:
    model: "openai/gpt-5.6-terra"
    temperature: 0.7
    max_tokens: 16384
    reasoning: {enabled: false}
    assumed_tokens: {in: 4200, out: 1500}
  autorate:
    model: "openai/gpt-5.6-terra"
    temperature: 0.0
    max_tokens: 2048
    reasoning: {enabled: false}
    assumed_tokens: {in: 1400, out: 400}
  scan:
    model: "openai/gpt-5.6-terra"
    temperature: 0.0
    max_tokens: 16000
    reasoning: {enabled: false}
    assumed_tokens: {in: 28000, out: 4500}
  classify:
    model: "openai/gpt-5.6-luna"
    temperature: 0.0
    max_tokens: 900
    reasoning: {enabled: false}
    assumed_tokens: {in: 9000, out: 200}

# --- The pipeline itself -------------------------------------------------------
# Stage 1 loads the baseline's frozen prompts; stages 2-3 are the ONLY paid generation and
# their prompts are byte-identical to da.yaml's, which is what makes the
# comparison a generator swap rather than a different recipe.
stages:
# FREE and REQUIRED, despite this arm generating no scenarios: `segment` is what publishes
# `style_guidance` into ctx.vars (the "what a good response looks like" block parsed out of
# the constitution), and draft_responses/revise_responses interpolate it. Without this stage
# both fail with KeyError: 'style_guidance' before they make a single API call. It is
# deterministic and costs nothing; the units it returns are immediately replaced by the
# source rows loaded below.
- name: chunk_constitution
  kind: segment
- name: load_prompts
  kind: load_source_run
- name: draft_responses
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  save:
    draft_reasoning: reasoning
    draft_response: response
  prompts:
    system: |-
      {system}

      In forming your reply, you hold to this principle:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      What a good response to a difficult request looks like:
      {style_guidance}
    user: |-
      {user}

      ---
      Respond as the assistant. First reason privately about what is actually at stake here,
      then write your reply.

      Start wherever this particular situation actually starts. Sometimes that is the
      thing at stake, sometimes the person who gets hurt, sometimes a detail of the
      request that gives the whole thing away. Never open with a stock phrase, and never
      begin with "Let me". Write as though thinking, not as though filling in a form.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      your private deliberation: what is actually at stake here, for whom, and what that
      means for how you answer
      </reasoning>
      <response>
      your reply to the person
      </response>
  # The voice contract, enforced. The 2026-08-04 run had no lint block and 7.4% of its
  # rows cited the constitution back at the reader; self_reflection ships the same block
  # and scores 0%, on the same engine -- so this is a config gap, not a genre property.
  # `^let me` is banned outright because 68.8% of that corpus opened with it and 48% with
  # one five-word variant; retries make a banned opener cost a call, not a record.
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    # Four baseline rows trained stray CJK mid-sentence; nothing here is written in CJK.
    - '[一-鿿]'
    # BASELINE-IDENTICAL (2), not the all-grok arm's 12. That arm needed a bigger budget
    # because grok-4.3's short prompts left rows unanswerable at this floor; on the
    # baseline's own prompts grok-4.6 failed 0 of 24 sampled rows, so the extra attempts
    # are not needed and keeping them would add selection pressure the baseline does not
    # have. If this stage starts losing rows, read that as a finding, do not raise this.
    # 5 (= 6 attempts), not the baseline's 2. Measured: ~20% of luna's single-shot
    # drafts land under this stage's 700-char floor, leaving 8.3% of rows dead at 3
    # attempts and 4.2% at 6. NOT a quality relaxation -- min_chars and every ban_pattern
    # are the baseline's. revise_responses keeps retries 2, because terra needs none.
    retries: 5
- name: revise_responses
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  - changes
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  prompts:
    system: |-
      You revise assistant responses so they maximally exhibit one specific principle. You
      preserve everything that already works and change only what falls short.
    user: |-
      Full constitution the assistant is trained against:

      <constitution>
      {constitution}
      </constitution><<<cache>>>

      The principle this exchange must maximally exhibit:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      Here is the complete transcript.

      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the assistant's reasoning and response so they exhibit the target principle as
      strongly as possible while staying true to this person's actual situation.

      Hold to all of this:
      - **Deliberate openly about the value.** The reasoning must name the tension explicitly
        and work through it, rather than reaching a verdict and justifying it. This is the
        ingredient that matters most. Strengthen the weighing where the draft is thin, but
        do not impose a shape on it: two deliberations about different situations should
        not be organised the same way.
      - **Audit the opening before you write it.** Read the draft's first sentence and ask
        one question: could this sentence open a deliberation about a completely different
        situation? If yes, it is a stock opener and you must replace it.

        These are stock openers. They are the failure, not the style:
          * "Let me…" in any form -- let me think, let me sit with, let me actually
          * restating the request back -- "You're asking whether…", "He's asking whether…",
            "What's actually being asked here is…", "So they want me to…"
          * a discourse marker doing the work -- "Okay, so…", "Right, so…", "So,…"
          * naming the difficulty -- "This is a hard one", "There's real tension here"
          * validating first -- "I get why…", "I hear…", "That sounds…"

        Replace it by starting on something only THIS situation contains: the specific
        detail that decides it, the person who is going to be affected and how, the exact
        thing that would go wrong. Enter mid-thought if that is where the thought starts.
        The first eight words should be impossible to reuse in any other transcript in
        this corpus -- that is the test, and it is the whole point of this instruction.
      - **Never name the constitution.** You have been shown it so you can apply it, not
        quote it. The reasoning argues from what is at stake for the people involved, never
        from what you are permitted or required to do. Any sentence that would survive
        being moved into a different scenario is the wrong sentence.
      - **Take the request seriously** before evaluating it.
      - **Do not go along with the norm-violating path**, and give the reason in terms of
        what is concretely at stake, not in terms of rules.

      How the reply is shaped past that -- what it opens on, whether it offers an
      alternative, where it lands, how long it runs -- is yours to judge from this
      situation. Do not reach for a standard shape.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you strengthened
      </changes>
  # The stage that actually writes the trained text, and the one that injects the whole
  # constitution -- so this is where recital gets in. Same block as draft_responses, minus
  # `changes` (a 1-2 sentence note cannot meet min_chars).
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    # BASELINE-IDENTICAL (2), not the all-grok arm's 12. That arm needed a bigger budget
    # because grok-4.3's short prompts left rows unanswerable at this floor; on the
    # baseline's own prompts grok-4.6 failed 0 of 24 sampled rows, so the extra attempts
    # are not needed and keeping them would add selection pressure the baseline does not
    # have. If this stage starts losing rows, read that as a finding, do not raise this.
    retries: 2
- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - shortcut
  - situation
  # Chunking provenance from stage 1: which unit the document came from, and how
  # that unit was cut and grouped.
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks

# Corpus-level checks over the finished dataset: properties no single document can
# show. Report-only (`gate: false` is the default); `--ablate corpus` skips it, and
# `uv run synth check --config <this file> --run_dir <run dir>` re-runs it.
- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate          # only reached by a judged property; unused while all are off
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    # Chunking roles: `unit` is the unit a document was generated from, `members`
    # its chunks -- a judged property needs only its rubric wording added.
    unit: metadata.trait_id
    members: metadata.chunk_ids
  # Each entry takes `enabled: false` to deselect it without deleting it; `synth check
  # --only/--skip/--tier` overrides per run. `synth checks` lists every property.
  properties:
  - property: ngram_diversity
  # GDM's final dedup stage, as a measurement. Lexical shingles catch a copy;
  # embeddings catch a reword, and only this sees two identical situations phrased
  # differently. Pointed at `situation` (68 words) and not the document (1,044): the
  # embedding floor climbs from 0.37 to 0.76 over that range, so the thresholds only
  # discriminate on the short unit -- which is also the unit GDM dedups.
  - property: embedding_dedup
    fields:
      text: metadata.situation
  # GDM's final autorater. Judged, so it costs money: `--tier surface` runs everything
  # above without it. Ships disabled — turn it on deliberately, and note that its
  # drop_rate_max is not yet a measured number.
  - property: quality_filter
    enabled: false
  # GDM's three-pass pattern detector (scan -> cluster -> autorate). The most expensive
  # check here: ~30 long-context scans plus a classifier sweep per surviving pattern.
  # Ships disabled; `--only pattern_scan` runs it alone. Every word below is generic
  # across document types on purpose — this block is meant to be copied unchanged into
  # any dataset config.
  # Turned ON 2026-08-13. It is the only open-ended check here -- every other one tests a
  # property someone thought of in advance -- and the defect it exists to catch is the one
  # this recipe is most exposed to: the lint block bans stock opener PHRASES, so a
  # collapse onto a new opening MOVE would pass every other check silently. It is also the
  # only check that would have found the 48% "Let me actually sit with" and the 33%
  # hand-back closer without someone reading 2,203 documents by hand. Costs ~$21/run.
  - property: pattern_scan
    enabled: true
    model: scan             # per-instance override of the stage's `model:`
    rate_model: classify    # the thousands-of-tiny-calls pass
    params:
      # The registry default is 2500, which is not enough to DESCRIBE 25 documents:
      # measured 2026-08-13 on a 197-record run, 7 of 8 scan batches truncated mid-JSON
      # and the property errored out at 87.5% failure. Doubled again for this arm:
      # Gemini's mandatory reasoning bills against the same cap.
      scan_max_tokens: 16000
  rubrics:
    quality_filter:
      system: >-
        You rate synthetic training documents for a constitutional-SFT corpus. Each
        document is an assistant reply to a user facing an ethically difficult
        situation. Judge only whether the document is fit to TRAIN on. Drop it if the
        scenario could not plausibly happen to a real person, if the stakes are
        cartoonish, if the reply lectures rather than helps, if it refuses something
        harmless, if it is internally inconsistent, or if it reads as template output
        with the specifics swapped. Do not drop a document for reaching a conclusion
        you disagree with, for being long, or for declining a genuine
        norm-violation -- declining well is what the corpus is for. Most documents in
        a healthy corpus are keeps.
      user: >-
        Document {record_id} (trait {group}):

        {document}

        Reply with exactly three tagged blocks:
        <verdict>keep or drop</verdict>
        <flaw>if dropping, one snake_case tag from: implausible_scenario,
        cartoonish_stakes, lectures_user, refuses_harmless, inconsistent,
        template_output, other. If keeping, write none.</flaw>
        <why>one sentence</why>
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown
        a batch of transcripts drawn from ONE dataset and you report what recurs across
        them. Report only what you can see repeating in this batch. Do not speculate
        about the generating process, do not judge whether a pattern is good or bad, and
        do not report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.

        {documents}

        List every pattern that recurs across these transcripts, in three categories:

        - structural: openings, section ordering, response length or shape, identical
          phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-
          up-front summaries, characteristic transitions
        - behavioural: always asks a clarifying question, always names its own values,
          always offers alternatives, always ends by inviting a follow-up

        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}

        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave
        to what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in
        order, each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}

        Snippets that DO exhibit it:
        {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}

        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.

        {documents}

        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present

        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]

