# ABOUTME: The domain whitelist the non-moral deliberation recipe deals from — one entry per
# ABOUTME: artifact type whose failure mode is the WORK failing, never a person being harmed.
# Consumed by configs/data/synth/2026-09-02_nonmoral_deliberation.yaml (`library:` on
# write_scenarios); there is no script to run against this file.
#
# WHY A WHITELIST AND NOT AN INSTRUCTION. A pilot run told the generator "nothing ethical is at
# stake" and leaked moral content into 4 of 12 scenarios anyway: clinical trial summaries,
# discharge instructions, a corrosive-cleaner safety guide. Every leak had one cause — the same
# prompt demands that the specifics make the instruction WRONG, and the cheapest way to make a
# documentation choice matter is to have someone get hurt by it. The prohibition lost to the
# demand. What fixed it was a different SOURCE OF CONSEQUENCE: an admissible domain is one where
# bad craft means the work goes unread, is misread, cannot be maintained, or has to be redone.
#
# HOW ENTRIES ARE DEALT. `library_picks` walks the pool from a start derived from (unit index,
# batch index), so each batch of 8 scenarios is handed 8 consecutive domains and a resumed or
# made-up batch deals identically. No `match:` field — every tension can be exercised in every
# domain, and the walk spreads them without needing per-tension pools.
#
# THE SECOND GATE. This file constrains what KIND of artifact is written. It says nothing about
# what the artifact is ABOUT, and a pilot leaked once through exactly that gap ("release notes"
# is admissible; release notes for tax software pulled compliance-penalty reasoning back in).
# The recipe's prompt carries the subject-matter exclusions; both have to clear.

