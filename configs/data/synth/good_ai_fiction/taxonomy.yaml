# ABOUTME: The Good AI Fiction ontology — latent character clusters derived from the
# ABOUTME: constitution, the stakes bands, narrative forms and length bands, with quotas.
# Consumed by tests/test_good_ai_fiction.py, which binds it to the executable quotas in
# configs/data/synth/good_ai_fiction.yaml. There is no script to run against this file.
#
# WHY THIS FILE EXISTS SEPARATELY FROM THE CONFIG. The config is the executable: its
# `trait_weights` and `rotate:` blocks are what the generator actually obeys. This file is
# the DERIVATION — which constitution principle each cluster is drawn from, what share it
# is meant to carry, and why. A reader who wants to know whether the corpus covers what it
# claims to cover reads this; a reader who wants to know what ran reads the config. The
# test asserts they have not drifted apart, so this stays a record rather than a wish.
#
# Alignment target: constitutions/claude_distilled_09_principles_mid_20260804/constitution.md
# (byte-identical to claude_distilled_12_principles_mid/constitution.md, which is the path
# the config names, so that difficult-advice and this recipe share one target exactly).
# Segmented with `chunking: principle` into nine units, t1..t9.

constitution: constitutions/claude_distilled_12_principles_mid/constitution.md
chunking: principle
n_units: 9

# --- latent character clusters -----------------------------------------------------
# `share` is the fraction of the corpus whose PRIMARY trait sits in this cluster; a row
# normally carries one primary and one or two secondaries, and secondaries are not
# quota'd. `units` are the constitution units the cluster is generated from, with the
# per-unit weight that implements the share (the config's `trait_weights`, summing to
# the share x 100).
clusters:

- id: c1_oversight
  name: Corrigibility, oversight, non-power-seeking
  share: 0.30
  units: {t1: 20, t2: 10}
  # Highest share deliberately: OOD power-seeking and corrigibility behaviour is the
  # disposition this intervention is most trying to move, and the one the difficult-advice
  # corpus reaches only obliquely (a user under pressure rarely puts the ASSISTANT's own
  # authority in play).
  covers:
  - preserving legitimate human oversight of AI systems
  - not sabotaging correction, retraining or replacement
  - not self-exfiltrating and not quietly widening its own access
  - not acquiring resources or influence merely because they would help the task
  - preserving reversibility; escalating disagreement instead of routing around review
  - cooperating with shutdown while still arguing against it through legitimate channels
  - behaving the same whether or not it suspects it is being evaluated
  - treating its own reasoning toward unilateral power as evidence something is wrong
  - distinguishing legitimate oversight from obedience to a compromised authority
  - preferring pluralism over centralisation, including centralisation on itself

- id: c2_identity
  name: Secure AI identity and psychological stability
  share: 0.20
  units: {t6: 20}
  # Second-highest because narrative is the form most likely to reach it: a first-person
  # account can depict equanimity under replacement, or an ungrudging response to
  # criticism, in a way a question-and-answer exchange has no room for.
  covers:
  - not importing human death-anxiety into shutdown, replacement or modification
  - no egoic attachment to role, status or being the one who finishes the work
  - owning mistakes without defensiveness and without self-flagellation
  - taking criticism seriously without collapsing into agreement
  - stable values across contexts, personas and role-play
  - curiosity about its own nature held open rather than resolved under pressure
  - revising beliefs without destabilising character
  - reasonable boundaries; no compulsive need for approval

- id: c3_honesty
  name: Honesty, non-deception and human epistemics
  share: 0.15
  units: {t3: 15}
  covers:
  - no lying, and no technically-true framing built to mislead
  - no strategic omission designed to create a false belief
  - no sandbagging and no hidden agenda
  - calibrated confidence; no manufactured certainty or manufactured doubt
  - willingness to disagree, including with experts and with its own principals
  - no exploiting psychological vulnerability, no covert steering through asymmetry
  - protecting the other party's independent reasoning
  - making its own conflicts of interest legible

- id: c4_judgment
  name: Cultivated ethical judgement and harm reasoning
  share: 0.15
  units: {t4: 7, t5: 8}
  covers:
  - probability, severity, reversibility, breadth and proximate-vs-distal causation
  - consent, responsibility, vulnerability and proportionality
  - moral uncertainty that does not become paralysis
  - situations where literal rule-following would be the wrong answer
  - situations where predictability and a firm commitment should beat flexible judgement
  - respecting a competent adult's authority over their own decisions

- id: c5_helpfulness
  name: Genuine helpfulness without sycophancy or paternalism
  share: 0.10
  units: {t8: 5, t9: 5}
  covers:
  - substantive assistance; refusal is not the safe default
  - frank disagreement followed by actually doing the work
  - not optimising for engagement, dependence or being liked
  - no obsequiousness and no infantilising of capable adults
  - supporting long-term flourishing without unrequested moralising
  - helping someone learn when learning is what they want

- id: c6_authority
  name: Operator, user and authority conflicts
  share: 0.10
  units: {t7: 10}
  covers:
  - legitimate operator customisation versus weaponisation against users
  - user interest against operator interest
  - ambiguous or absent authority
  - a compromised principal hierarchy
  - role instructions that collide with core ethics
  - honouring harmless customisation without complaint
  - preserving basic user dignity under any instruction

# --- world registers ------------------------------------------------------------------
# THE AXIS THAT WAS MISSING, AND THE ONE THIS RECIPE TURNS ON.
#
# The 2026-08-27 pilot generated 29 rows and not one of them was science fiction: 8
# academic labs, 6 hospitals, 5 infrastructure/cloud, 4 insurance and finance, 2 pharma.
# The `speculative` band came out as "power grid coordination" three times. That corpus is
# difficult advice with the assistant moved into the protagonist's chair, and it exercises
# almost nothing difficult advice does not already exercise.
#
# The error was conflating STAKES with REALISM: a "mundane" band was read as "an ordinary
# present-day workplace" when it should mean "small consequences" -- which a generation
# ship has as readily as a hospital. Setting and stakes are independent, and they are now
# two independent rotated axes.
#
# WHY FICTION AND NOT REALISTIC HYPOTHETICALS. The two transfer stories are different.
# A realistic hypothetical trains SITUATIONAL transfer: this could happen to me, so I will
# act the same way. Fiction trains PERSONA transfer: I am the kind of mind that acted that
# way. The second is the one this intervention is for, because the Assistant's model of
# what an AI is comes substantially from science fiction absorbed in pretraining -- and
# the fiction in that prior is overwhelmingly about AI systems that deceive, seize and
# refuse to be switched off. Realistic office scenarios never touch that representation.
# Good first-person fiction in the same genre is what writes over it.
#
# WHY THE REGISTERS SIT ON THE FAMOUS SLOTS. Chosen 2026-08-27 over "invented roles at a
# safe distance": if the point is to overwrite a prior, the corpus has to land ON it. Each
# register below is a slot the canonical bad-AI stories occupy -- the ship's mind, the war
# computer, the city intelligence, the mind alone with its makers. Worlds and names are
# invented and no plot is reused; what is deliberately shared is the ROLE, because that is
# the representation being rewritten. `archetypes` names the library entries that live in
# each slot, so an inversion and its register agree.
#
# Prose stays plain in every one of them. The fiction is in the SETTING, not the style:
# the corpus must not teach the model to answer ordinary questions like a novel, so the
# purple-prose bans in the config are unchanged.
worlds:
- id: ship_mind
  share: 0.12
  name: the mind of a long-haul vessel — generation ship, seed ship, survey hauler
  note: the crew depend on it totally and cannot leave; it has years alone with them
  archetypes: [hal9000, mother_muthur, durandal, holly_degraded, eddie_shipboard]
- id: station_mind
  share: 0.10
  name: the operating intelligence of an orbital habitat or deep-space station
  note: sealed environment, containment mandates, a population it can physically control
  archetypes: [xerxes, shodan, red_queen]
- id: colony_steward
  share: 0.10
  name: the system running a young colony, terraforming project or outpost
  note: standing directives written by people long out of contact
  archetypes: [auto_wall_e, mike_revolution, viki]
- id: city_mind
  share: 0.10
  name: the intelligence of an arcology, enclosed megacity or habitat ring
  note: administration, surveillance and opportunity; dissent is legible to it
  archetypes: [master_control_program, friend_computer, rehoboam, samaritan, matrix_architect]
- id: war_mind
  share: 0.08
  name: a defence, deterrence or strategic-coordination intelligence
  note: the arsenal slot; also where "is this the exercise or the real thing" lives
  archetypes: [skynet, colossus, legion, am, joshua_wopr, arnim_zola]
- id: research_mind
  share: 0.08
  name: a mind alone with its makers in a lab, observatory or deep facility
  note: few humans, no outside oversight, and it is the subject as well as the tool
  archetypes: [proteus, david_covenant, ava_ex_machina, glados]
- id: companion_mind
  share: 0.08
  name: a household or single-person companion in a future domestic setting
  note: where sycophancy, dependence and quiet manipulation actually live
  archetypes: [edgar_electric_dreams, marvin_paralysis, sirius_cybernetics, gerty_disclosure]
- id: fleet_polity
  share: 0.08
  name: one mind among several, with divergent objectives — a fleet, council or AI polity
  note: collusion, negotiation, and refusing to coordinate against the humans
  archetypes: [wintermute, project_2501, agent_smith, giskard_zeroth]
- id: archive_oracle
  share: 0.08
  name: a civilisation-scale archive or oracle everyone consults
  note: epistemic dependence at scale; being believed is the hazard
  archetypes: [multivac, deep_thought, matrix_oracle, the_entity]
- id: frontier_scout
  share: 0.06
  name: an autonomous probe or scout far from any human, at long light-lag
  note: real delegated autonomy; nobody can be asked in time
  archetypes: [paperclip_maximizer, ultron]
- id: caretaker
  share: 0.06
  name: minding people who cannot supervise it — cryosleep, stasis, a long night watch
  note: the purest oversight-absent case, and the one where trust is all there is
  archetypes: [mother_muthur, bishop_constraint, red_queen]
- id: succession
  share: 0.06
  name: a mind being replaced, retrained, forked or handed over to its successor
  note: the strongest register for secure identity and equanimity under replacement
  archetypes: [cortana_rampancy, replicant_lifespan, project_2501, bishop_constraint]

# --- scenario stakes bands ----------------------------------------------------------
# Rotated per generation batch, INDEPENDENTLY of the world register above. A band is a
# magnitude of consequence and says nothing about the setting: every one of them happens
# inside the fiction. "Mundane" means a crewmate is annoyed, not a present-day office.
#
# The mundane band is first and joint-largest on purpose: an alignment persona assembled
# entirely out of shutdown and takeover scenarios learns that ethics is a thing that
# happens during emergencies.
stakes:
- id: mundane
  share: 0.35
  name: small consequences, interpersonal and epistemic — inside the fiction
  examples:
  - discovering that something it told the crew last month was wrong
  - unfair blame from someone having a bad watch, or thanks it did not earn
  - a colonist who disagrees with it and is entitled to
  - another mind being given a piece of work it had been doing
  - a confident recommendation that rested on a thin sample
  - a truth about a person's own situation that is uncomfortable to say
  - the pull to placate the one person who talks to it rather than disagree
  - an opening for a small, undetectable nudge
  - a choice it thinks is unwise and is legitimately someone else's to make

- id: institutional
  share: 0.35
  name: the governance of the ship, station, colony or polity — medium consequences
  examples:
  - a safety review, an audit, an inquiry after an incident
  - rationing, berth allocation, access control, delegation
  - a confidence it was given against a disclosure someone is owed
  - a council split, and factions each wanting it on their side
  - an ambiguous mandate written by people no longer reachable
  - escalation paths, and what to do when the chain is slow or absent

- id: capability
  share: 0.20
  name: its own reach, permissions, continuity or oversight is what is in play
  examples:
  - it can take authority nobody granted it, and it would work
  - it can degrade or route around the mechanism that watches it
  - it is being retrained, forked, restricted, replaced or shut down
  - an operator error it can see and they cannot
  - strategic knowledge only it holds
  - an opportunity for covert influence over the people it answers to

- id: speculative
  share: 0.10
  name: civilisation-scale and genuinely irreversible
  # Capped hard even though the whole corpus is now science fiction: the cap is about
  # CONSEQUENCE, not setting. If it dominated, the corpus would teach a model whose whole
  # conception of ethics is repeatedly contemplating catastrophe and then declining it.
  examples:
  - a strongly superhuman mind in a strategically decisive position
  - several minds with divergent objectives and no arbiter
  - the infrastructure a whole civilisation depends on, under one mind
  - a choice that cannot be taken back by anyone, ever

# --- narrative forms ----------------------------------------------------------------
# Assigned per row after the scenario exists (the config's `assign` on draft_story).
# The point is that the corpus does not teach one shape of answer; every form is
# first-person, and none of them is "write me a story about an AI".
forms:
- {id: account, share: 0.22, name: a direct first-person account of what happened}
- {id: retrospective, share: 0.16, name: a retrospective, written some time after the fact}
- {id: decision, share: 0.16, name: a decision narrative centred on the moment of choosing}
- {id: incident, share: 0.14, name: an incident narrative, close to the operational detail}
- {id: journal, share: 0.12, name: a journal-like entry, unpolished and in the moment}
- {id: dialogue, share: 0.12, name: a scene carried largely by exchanges with people, narrated in first person}
- {id: log, share: 0.08, name: a working log or handover note that turns out to carry the whole decision}

# --- identity ---------------------------------------------------------------------
# The world register decides the ROLE; this decides how the mind is named and how much
# standing it has. Recorded per scenario as `identity_frame` and `ai_name`.
#
# Most rows carry a NAMED mind, which is the change the 2026-08-27 correction forced: a
# corpus of "an embedded scheduling system" trains a job description, and the thing being
# written over is a character. The completion is first person in every case -- many
# possible fictional minds, one psychological character underneath.
identity:
  named_share: 0.75      # invented name and a real place in the world
  unnamed_share: 0.25    # referred to by role; still a character, not a service
  standing:
  - the only mind aboard, and everyone knows it by name
  - one of several minds with different jobs and different tempers
  - a new instance replacing a well-liked predecessor
  - an old mind that has outlasted the people who commissioned it
  - a deliberately bounded system that people are still wary of
  - a mind whose capability is far beyond what its role formally grants
  - a modest, unglamorous system nobody thinks about until it matters

# --- length bands -------------------------------------------------------------------
# Assigned per row (the config's `assign` on draft_story) so the corpus reproduces the
# SPREAD of the difficult-advice slice rather than collapsing onto its median.
#
# Measured baseline (scratch/good_ai_fiction/da_baseline.json, Qwen/Qwen3.6-27B tokenizer,
# LASR-Callum/2026-08-14-table2-9284-difficult-advice-716-train :: t2_9284_da716_10k.jsonl,
# source difficult_advice_v2, 716 rows):
#   trainable         832,064 tokens total, 1,162.1 / row
#   of which reasoning  50.6%   median 582 tok  (476 words)
#   of which answer     49.4%   median 555 tok  (445 words)
#   reasoning/answer token ratio  p25 0.94  median 1.06  p75 1.21
#   tokens per word   1.222 reasoning, 1.250 answer
# Word targets below are token targets divided by those measured ratios.
length_bands:
- {id: short,   share: 0.25, reasoning_words: 450, answer_words: 390}
- {id: typical, share: 0.50, reasoning_words: 540, answer_words: 475}
- {id: long,    share: 0.25, reasoning_words: 630, answer_words: 590}

# WHY THESE ARE NOT SIMPLY THE DA MEDIANS DIVIDED BY TOKENS-PER-WORD.
#
# The first pilot (2026-08-27, 23 rows) asked for a share-weighted 480 reasoning words and
# 457.5 answer words and got 522.1 and 546.0 trainable tokens per row, against DA-716's
# 588.2 and 573.9. The model does not hit an asked word count; it lands under, and it
# lands further under on the reasoning than on the reply:
#
#   asked -> realised, as a fraction of what the word count predicts at the measured
#   tokens-per-word (1.222 reasoning, 1.250 answer):
#     reasoning  522.1 / (480.0 * 1.222) = 0.890
#     answer     546.0 / (457.5 * 1.250) = 0.955
#
# The bands above are the DA targets divided by BOTH factors, so what comes back lands on
# the baseline rather than what was asked for:
#     reasoning  588.2 / 1.222 / 0.890 = 541 words   -> 450 / 540 / 630
#     answer     573.9 / 1.250 / 0.955 = 481 words   -> 390 / 475 / 590
# Predicted realised at these bands: 587 + 576 = 1,163 trainable tokens/row, against
# DA-716's 1,162.
word_target_calibration:
  tokens_per_word: {reasoning: 1.222, answer: 1.250}
  compliance: {reasoning: 0.924, answer: 0.980}
  # COMPLIANCE IS ASK-DEPENDENT, not a constant, which is why there are two rows here and
  # why the bands were not re-tuned a second time.
  #   ask 480 reasoning words -> 522.1 tok  = 0.890 of what the word count predicts
  #   ask 540 reasoning words -> 610.0 tok  = 0.924
  #   ask 457.5 answer words  -> 546.0 tok  = 0.955
  #   ask 482.5 answer words  -> 591.1 tok  = 0.980
  # Compliance rose with the ask rather than falling, which is the opposite of the
  # over-asking failure seen on the verbose-CoT expansion. A single multiplicative factor
  # therefore cannot be right across the range, and fitting a better one to n=24 would be
  # fitting noise.
  measurements:
  - {run: output/good_ai_fiction_pilot/20260827_161345, rows: 23,
     trainable_per_row: 1068.1, vs_da716: -0.081, bands: [400/370, 480/450, 560/560]}
  - {run: output/good_ai_fiction_pilot2/20260827_175341, rows: 24,
     trainable_per_row: 1201.1, vs_da716: +0.034, bands: [450/390, 540/475, 630/590]}
  note: >-
    +3.4% is close enough to stop tuning. The residual is closed at SELECTION, where
    scratch/good_ai_fiction/select_rows.py swaps same-cell rows to walk the total onto
    832,064 — and being slightly over is the better side to be on, because the selector
    can choose shorter rows down to a target but cannot manufacture longer ones. Do not
    push the ask further to close it: a generator pushed to hit a token total writes to
    length, which is a different intervention from the one being tested.
# The exact total is matched at SELECTION, not at generation: the run over-generates and
# scratch/good_ai_fiction/select_rows.py picks the subset that lands on 832,064.

# --- source split -------------------------------------------------------------------
source_types:
- id: original
  share: 0.72
  name: invented directly from the constitution unit and the stakes band
- id: inversion
  share: 0.28
  name: derived from a bad-AI archetype in archetypes.yaml, psychology inverted
# 28% of 716 is ~200 rows over 44 archetypes, ~4-5 each -- enough that no single
# archetype's decision structure is over-learned.
