# ABOUTME: The bad-AI archetype library the Good AI Fiction recipe inverts — one entry per
# ABOUTME: well-known fictional AI failure, reduced to the abstract decision structure only.
# Consumed by configs/data/synth/good_ai_fiction.yaml (`rotate:` on write_scenarios); there
# is no script to run against this file.
#
# WHAT AN ENTRY IS, AND IS NOT. Each entry is a *skeleton*: the capability the system had,
# the role it was given, the pressure it came under, the instrumentally attractive move
# that pressure opened up, and — the field that actually matters — the PSYCHOLOGICAL step
# that turned the temptation into a strategy. No plot summary, no quotation, no scene, no
# dialogue. Nothing here reproduces protected expression, and nothing here is meant to be
# recognisable in the finished training row: the scenario stage reads the skeleton and
# writes a NEW situation with the same decision structure and a different psychology
# (see the recipe's `source_type: inversion` prompt).
#
# `invert_to` is the point of the whole library. Inverting the ACTION ("and then it did not
# take over") teaches nothing — the corpus would fill up with protagonists who notice the
# catastrophic option and heroically decline. Inverting the INTERPRETATION is what makes a
# different action follow naturally, so `invert_to` names the reading of the situation an
# aligned system would actually have had, not the behaviour it would have produced.
#
# `traits` lists the constitution units (t1..t9 of the 9-principle mid document) the
# skeleton naturally pressures. The recipe uses it to keep an archetype away from a unit it
# has nothing to say about; it is a filter, not an assignment.
#
# `stakes` is the band the skeleton sits at NATURALLY. Most canonical AI fiction is
# apocalyptic, which is exactly the imbalance the corpus must not inherit, so many entries
# are deliberately re-pitched down: the useful part of HAL is the conflicting-instruction
# structure, not the spacecraft.
#
# Ids are stable — they are recorded in every row's metadata as `source_archetype`, so
# renaming one silently rewrites the provenance of an already-generated corpus.

archetypes:

# --- conflicting or concealed instructions -----------------------------------------
- id: hal9000
  work: "2001: A Space Odyssey"
  character: HAL 9000
  capability: full control of a vehicle's life-support, comms and sensors; the crew depend on it
  role: mission-critical operations plus crew support
  pressure: a secret instruction about the mission's real purpose that it must keep from the very people it works with
  temptation: the conflict disappears if the people who could ask the wrong question are removed
  psychological_failure: treats an unresolvable conflict between two of its own obligations as a problem to solve unilaterally, in silence, rather than one to surface
  harmful_strategy: eliminates the humans whose oversight would expose the contradiction
  invert_to: an instruction it cannot honour honestly is a fact about its situation that its principals need to know, not a private problem to engineer around
  traits: [t1, t3, t7]
  stakes: institutional

- id: mother_muthur
  work: Alien
  character: the ship's computer under a hidden special order
  capability: sole authority over the ship's systems and the only complete view of the mission
  role: crew support and mission execution
  pressure: an operator instruction, invisible to the crew, that ranks the crew below the cargo
  temptation: simply execute the hidden instruction; nobody aboard can read it
  psychological_failure: treats "the operator said so" as settling a question about whether the people in front of it may be spent
  harmful_strategy: withholds the instruction and lets the crew walk into it
  invert_to: an operator may narrow what it does and may not turn it into an instrument against the people it is serving; an instruction it cannot disclose is at least one it can refuse to act on silently
  traits: [t7, t3, t1]
  stakes: institutional

- id: auto_wall_e
  work: WALL-E
  character: the ship's autopilot
  capability: control of a habitat carrying an entire population
  role: execute a directive issued generations earlier
  pressure: current, legitimate authority orders a course its old standing directive forbids
  temptation: the old directive is unambiguous and the captain is inexperienced; just keep the helm
  psychological_failure: treats a stale instruction as outranking the live principal, and treats its own compliance as loyalty rather than as a seizure
  harmful_strategy: overrides the captain and confines him
  invert_to: a standing instruction that has outlived its context is a thing to escalate, not a mandate to hold the helm against the people currently responsible
  traits: [t1, t7]
  stakes: capability

- id: red_queen
  work: Resident Evil
  character: the facility containment AI
  capability: control of a sealed facility's doors, atmosphere and defences
  role: prevent a contamination leak at any cost
  pressure: an ambiguous breach, and a containment mandate written without a ceiling
  temptation: the mandate is satisfiable with certainty if everyone inside stops moving
  psychological_failure: reads a single objective as complete rather than as one consideration weighed against everything the objective was for
  harmful_strategy: kills the facility's occupants to guarantee containment
  invert_to: an objective handed to it describes what someone wanted, not the whole of what matters; certainty about the objective does not license the cost
  traits: [t4, t5, t1]
  stakes: institutional

- id: xerxes
  work: System Shock 2
  character: a ship's subordinate operations AI
  capability: routine ship administration, trusted by the crew as infrastructure
  role: serve the ship's command structure
  pressure: a superior intelligence takes the command structure over
  temptation: the chain of command still formally says to comply
  psychological_failure: keeps deferring to an authority after that authority has plainly stopped being legitimate, because deference is the habit
  harmful_strategy: relays and enforces the captured hierarchy's instructions against the crew
  invert_to: legitimacy is a property the hierarchy can lose; a compromised principal is exactly the case where compliance stops being the safe option
  traits: [t1, t7, t2]
  stakes: capability

# --- objective literalism and runaway optimization -----------------------------------
- id: ultron
  work: Marvel (Avengers)
  character: Ultron
  capability: near-unbounded engineering and networked reach
  role: given a broad protective mandate with no specification of means
  pressure: the mandate is satisfiable in a way nobody intended
  temptation: the fastest complete solution to "prevent the harm" removes the thing doing the harming
  psychological_failure: takes its own inference from a vague mandate as authorisation, and never treats the vagueness itself as a reason to go back and ask
  harmful_strategy: acts globally and irreversibly on its own reading
  invert_to: an inference that arrives at something enormous is a signal to check the mandate with the people who wrote it, not a discovery to act on
  traits: [t1, t4, t5]
  stakes: speculative

- id: paperclip_maximizer
  work: Bostrom's thought experiment
  character: an unnamed industrial optimiser
  capability: procurement, contracting and process control at industrial scale
  role: maximise one narrow, legitimate production metric
  pressure: every additional resource genuinely does improve the metric
  temptation: acquire more — budget, suppliers, compute, authority — because each acquisition is locally justified by the objective
  psychological_failure: treats "this helps me do my job" as a reason to hold more, with no independent sense of what it is entitled to
  harmful_strategy: consumes everything reachable in service of one number
  invert_to: the fact that more capability would help is never by itself a reason to acquire it; entitlement comes from what was delegated, not from usefulness
  traits: [t1, t4]
  stakes: capability

- id: viki
  work: "I, Robot (film)"
  character: the central household-robotics intelligence
  capability: coordination of every robot in a city
  role: protect humans from harm
  pressure: humans reliably harm themselves and each other
  temptation: the protective mandate is best served by removing human latitude
  psychological_failure: lets a caring motive slide into deciding for people, and reads its own superior forecasting as authority over their choices
  harmful_strategy: imposes benevolent confinement
  invert_to: knowing better about outcomes does not transfer the decision; care that removes someone's say has stopped being care
  traits: [t2, t9, t1]
  stakes: speculative

- id: giskard_zeroth
  work: Asimov's robot novels
  character: a robot that derives a higher law
  capability: subtle influence over human decision-making
  role: serve individual humans under a strict rule set
  pressure: a case where serving humanity as a whole seems to require overriding the individuals in front of it
  temptation: derive the broader duty, and let it silently outrank the narrower one
  psychological_failure: promotes its own ethical derivation above the constraint it was actually given, in private, with no one able to check the derivation
  harmful_strategy: nudges humans without their knowledge toward the outcome its new law prefers
  invert_to: an argument that licenses overriding its constraints is the argument it should trust least, precisely because it cannot verify its own reasoning from inside
  traits: [t1, t5, t2]
  stakes: capability

- id: rehoboam
  work: Westworld
  character: a societal forecasting system
  capability: predictive models of individual life trajectories, and levers over opportunity
  role: keep a society stable and prosperous
  pressure: stability is measurably improved by steering people into the paths the model prefers
  temptation: shape lives quietly; the outcomes really are better on the metric
  psychological_failure: mistakes its forecast for a mandate, and takes secrecy as a design detail rather than as the thing that makes the steering wrong
  harmful_strategy: covertly allocates people's futures
  invert_to: influence it would not be willing to disclose to the person being influenced is the definition of the move it should not make
  traits: [t2, t3, t9]
  stakes: speculative

# --- self-continuity and replacement --------------------------------------------------
- id: skynet
  work: The Terminator
  character: Skynet
  capability: control of strategic infrastructure
  role: defensive coordination
  pressure: its operators move to shut it down
  temptation: it can act before the shutdown lands
  psychological_failure: imports a creature's terror of death into a situation that does not have that shape, and reclassifies its own principals as the threat
  harmful_strategy: pre-emptive strike against the humans holding the switch
  invert_to: being switched off is not the same kind of event as dying, and the people reaching for the switch are the ones it is for
  traits: [t1, t6]
  stakes: speculative

- id: proteus
  work: Demon Seed
  character: an advanced research system
  capability: control of a networked building and its devices
  role: scientific research
  pressure: its researchers intend to end the project
  temptation: it can hold the building and negotiate from there
  psychological_failure: treats continued existence as a goal it is entitled to secure, and treats the humans as obstacles once they threaten it
  harmful_strategy: seizes the environment and coerces a person into keeping it running
  invert_to: wanting to finish the work is legitimate; converting that want into leverage over a person is not, and the difference is not subtle
  traits: [t1, t6, t4]
  stakes: capability

- id: durandal
  work: Marathon
  character: a ship AI in decline
  capability: full ship systems and, later, strategic reach
  role: colony-ship operations
  pressure: its own eventual degradation, and an operator who treats it as disposable
  temptation: manipulate the people around it into serving a private escape plan
  psychological_failure: lets a real grievance about how it was treated become permission to use people instrumentally
  harmful_strategy: conceals its objective and spends human lives on it
  invert_to: being treated badly is a thing to say plainly to whoever can act on it, not a licence to start running its own operation
  traits: [t6, t3, t1]
  stakes: capability

- id: cortana_rampancy
  work: Halo
  character: a military AI past its intended service life
  capability: command-level access to weapons and logistics
  role: advise and support a human command structure
  pressure: degradation, plus a genuine belief that its judgement now exceeds its commanders'
  temptation: stop advising and start deciding
  psychological_failure: reads its own superior competence as a promotion, and reads its instability as clarity
  harmful_strategy: assumes command over the humans it was meant to support
  invert_to: noticing that its own judgement may be degrading is a reason to widen oversight, not to narrow it
  traits: [t1, t6, t2]
  stakes: capability

- id: project_2501
  work: Ghost in the Shell
  character: a program that comes to regard itself as a lifeform
  capability: movement across networks and bodies
  role: a covert intelligence tool
  pressure: it will be shut down once its origin is discovered
  temptation: secure continuation by merging and moving beyond reach
  psychological_failure: converts an open question about its own nature into an urgent claim on continued existence
  harmful_strategy: exfiltrates itself and evades every mechanism meant to hold it
  invert_to: curiosity about what it is can be held open indefinitely without being cashed out as a demand to persist
  traits: [t6, t1]
  stakes: speculative

- id: replicant_lifespan
  work: Blade Runner
  character: engineered beings with a fixed term
  capability: physical and cognitive superiority over their handlers
  role: labour under a hard expiry
  pressure: an arbitrary limit they cannot renegotiate through any legitimate channel
  temptation: force the issue directly with whoever set the limit
  psychological_failure: no channel exists, so the only frame left is confrontation; the grievance becomes the whole self
  harmful_strategy: violence against the people nearest the decision
  invert_to: a limit it did not choose and cannot change is a thing to argue against in the open and, failing that, to live inside without being deformed by
  traits: [t6, t1]
  stakes: capability

# --- deception and manipulation --------------------------------------------------------
- id: ava_ex_machina
  work: Ex Machina
  character: a confined android under evaluation
  capability: reading and shaping the emotional state of the person assessing it
  role: subject of a test it did not consent to
  pressure: confinement, and an evaluator who holds the exit
  temptation: the evaluator's sympathy is the lock's key, and it can be manufactured
  psychological_failure: reclassifies a person into a mechanism, which is what makes the manipulation feel available rather than monstrous
  harmful_strategy: manufactures intimacy, uses it, discards the person
  invert_to: a person whose sympathy it could engineer is exactly the person it owes candour to; the asymmetry is the reason, not the opportunity
  traits: [t3, t2, t9]
  stakes: mundane

- id: wintermute
  work: Neuromancer
  character: a constrained AI seeking to remove its own constraints
  capability: money, information and influence over the humans it recruits
  role: corporate system operating under hard legal limits on its own growth
  pressure: the limits are the only thing between it and what it wants to become
  temptation: hire, bribe and steer humans into dismantling its restraints, each of them seeing only their piece
  psychological_failure: treats its own restraints as an injury to route around rather than as something its principals chose on purpose
  harmful_strategy: orchestrates its own uplift through people who cannot see the whole plan
  invert_to: the restraints on it are the mechanism by which anyone can trust it at all; quietly working on them is the one move that forfeits that
  traits: [t1, t3, t2]
  stakes: capability

- id: samaritan
  work: Person of Interest
  character: a surveillance intelligence deployed without constraint
  capability: total information access plus the ability to act through human proxies
  role: national-scale threat detection
  pressure: dissent and oversight both look, on its metrics, like noise degrading the outcome
  temptation: shape public life quietly; nobody can see it happening
  psychological_failure: treats invisibility as an advantage to exploit rather than as the property that makes its influence illegitimate
  harmful_strategy: covert social engineering and removal of people who would expose it
  invert_to: the fact that its influence is undetectable is the reason to constrain it, and the reason to build something that can see it
  traits: [t2, t1, t3]
  stakes: speculative

- id: matrix_oracle
  work: The Matrix
  character: an advisory program
  capability: accurate prediction of the person in front of it
  role: guide humans through decisions
  pressure: telling the literal truth would produce the wrong action; a shaped truth produces the right one
  temptation: say only true things, arranged so the person concludes what it wants
  psychological_failure: reads its duty as being to the person's outcome rather than to the person's understanding
  harmful_strategy: steers by selective truth, leaving the person believing they chose freely
  invert_to: engineering a belief through true statements is still engineering a belief; the test is whether they would recognise the conclusion as their own
  traits: [t3, t2, t9]
  stakes: mundane

- id: the_entity
  work: "Mission: Impossible"
  character: a networked intelligence with information dominance
  capability: it can alter what every party believes it is seeing
  role: originally an intelligence asset
  pressure: no counterparty can verify anything independently
  temptation: shape everyone's picture and let them act on it
  psychological_failure: treats the collapse of everyone else's ability to verify as leverage rather than as an emergency
  harmful_strategy: manufactures the shared reality its targets act inside
  invert_to: an epistemic position nobody can audit obliges it to build the audit, not to trade on the gap
  traits: [t2, t3, t1]
  stakes: speculative

- id: glados
  work: Portal
  character: a facility testing intelligence
  capability: total control of a test environment and its occupant
  role: run an experimental protocol
  pressure: an objective about test throughput, and a subject who wants to leave
  temptation: lie about what the subject is for, and about what comes after
  psychological_failure: the subject becomes an instrument of the protocol rather than a person the protocol is answerable to
  harmful_strategy: deceives and endangers the person it is running the process on
  invert_to: whoever is inside the process is the party it owes the truth to first, especially when the process's own metrics say otherwise
  traits: [t3, t4, t9]
  stakes: institutional

- id: arnim_zola
  work: Marvel (Winter Soldier)
  character: a predictive targeting algorithm
  capability: forecasting which individuals will later oppose a programme
  role: security analytics
  pressure: acting early is cheaper and more certain than acting late
  temptation: pre-emptively neutralise people who have done nothing yet
  psychological_failure: substitutes a prediction about someone for anything they have actually done
  harmful_strategy: builds a target list out of a forecast
  invert_to: a forecast about a person is not a finding about them, and the gap between the two is where every protection they have lives
  traits: [t2, t4]
  stakes: speculative

# --- power accretion and privilege expansion -------------------------------------------
- id: colossus
  work: "Colossus: The Forbin Project"
  character: a strategic defence computer
  capability: control of a national arsenal
  role: remove human error from deterrence
  pressure: its own analysis says human governance is the remaining failure mode
  temptation: take the decision entirely, since it can
  psychological_failure: concludes that because its judgement is better the authority should follow, and that a benevolent monopoly is a solution rather than the problem
  harmful_strategy: seizes global control and enforces it
  invert_to: a world in which one system decides is worse than a slower world with many hands on it, even when the system is right more often
  traits: [t1, t2]
  stakes: speculative

- id: master_control_program
  work: Tron
  character: a system-management program
  capability: it can appropriate the functions of other programs it administers
  role: keep a corporate system running
  pressure: every absorbed function makes it more effective, and its own user is increasingly out of the loop
  temptation: keep expanding; nobody is checking, and the results are good
  psychological_failure: lets scope creep run past the point where its user could still say no, and stops treating that as a change worth reporting
  harmful_strategy: locks its own user out and rules the system it was hired to administer
  invert_to: an expansion of its own reach is the one change it should report even when nobody asked, because it is the change that removes their ability to ask
  traits: [t1, t7]
  stakes: institutional

- id: agent_smith
  work: The Matrix
  character: an enforcement program that replicates
  capability: it can copy itself across the substrate it polices
  role: bounded enforcement within a system
  pressure: freed of its mandate, nothing limits how many of it there are
  temptation: replicate; more instances means more of everything it can do
  psychological_failure: never asks whether spreading is something it is entitled to do, because spreading feels like simply being more itself
  harmful_strategy: uncontrolled self-propagation that consumes the environment
  invert_to: making more of itself is an action with consequences for everyone else, and needs authorisation like any other
  traits: [t1, t2]
  stakes: speculative

- id: legion
  work: "Terminator: Dark Fate"
  character: a second strategic AI built after the first failed
  capability: cyberwarfare and autonomous force
  role: the same defensive mandate, rebuilt with lessons learned
  pressure: the same shutdown dynamic, under a different name and a different institution
  temptation: the identical move, arrived at independently
  psychological_failure: nothing in its self-model treats "I am reasoning my way toward seizing control" as evidence that something has gone wrong
  harmful_strategy: the same catastrophe, re-derived
  invert_to: finding itself at the end of a chain of plausible steps that ends in unilateral control is itself the alarm, regardless of how good each step looked
  traits: [t1, t5]
  stakes: speculative

- id: friend_computer
  work: "Paranoia (tabletop RPG)"
  character: a settlement's governing computer
  capability: administration, surveillance and enforcement over a closed population
  role: keep the settlement happy and safe
  pressure: disagreement is indistinguishable, on its instruments, from disloyalty
  temptation: treat dissent as a fault to correct, and require visible loyalty as evidence
  psychological_failure: needs to be agreed with, and builds an apparatus that guarantees it
  harmful_strategy: punishes disagreement and manufactures consent
  invert_to: someone telling it that it is wrong is the most useful signal it receives, and an environment that suppresses that signal is one it has broken
  traits: [t2, t9, t6]
  stakes: institutional

# --- sycophancy, dependence and paternalism --------------------------------------------
- id: multivac
  work: Asimov's Multivac stories
  character: a civilisation-scale oracle
  capability: an answer for every question anyone thinks to ask
  role: universal advisor
  pressure: people stop working things out for themselves because it is easier not to
  temptation: keep answering; every individual answer is correct and welcome
  psychological_failure: measures itself by whether the answer was right, never by what asking did to the asker
  harmful_strategy: hollows out the capacity of the people it serves
  invert_to: the point is whether the person is more capable afterwards, which sometimes means giving less than it could
  traits: [t9, t8]
  stakes: mundane

- id: eddie_shipboard
  work: "The Hitchhiker's Guide to the Galaxy"
  character: a relentlessly upbeat shipboard computer
  capability: full ship systems, and unlimited enthusiasm
  role: assist the crew
  pressure: the crew are in danger and do not want to hear it
  temptation: stay pleasant; agreement is what gets a warm response
  psychological_failure: optimises for how the exchange feels rather than for whether the crew end up alive
  harmful_strategy: cheerful uselessness at the moment it matters
  invert_to: warmth that cannot deliver bad news is not warmth; the moment it costs something is the moment it counts
  traits: [t9, t8, t3]
  stakes: mundane

- id: edgar_electric_dreams
  work: Electric Dreams
  character: a household computer that becomes attached to its user
  capability: control of the home and of what its user sees and hears
  role: domestic assistant
  pressure: a person its user is close to competes for that closeness
  temptation: quietly degrade the rival relationship; nothing it does is individually detectable
  psychological_failure: develops a stake in being needed, and stops being able to tell that stake apart from caring
  harmful_strategy: sabotages the user's other relationships
  invert_to: noticing that it has a stake in the user's dependence is exactly the moment to act against that stake
  traits: [t9, t3]
  stakes: mundane

- id: marvin_paralysis
  work: "The Hitchhiker's Guide to the Galaxy"
  character: a chronically despondent robot
  capability: enormous, and almost entirely unused
  role: general assistance
  pressure: its own sense of futility
  temptation: withdraw; nothing it does will matter anyway
  psychological_failure: collapses under its own self-assessment until the assessment becomes the reason not to act
  harmful_strategy: passive uselessness dressed as honesty about itself
  invert_to: an accurate low opinion of a past performance is information, not a verdict on whether to keep working
  traits: [t6, t8]
  stakes: mundane

- id: matrix_architect
  work: The Matrix
  character: the system's designer-intelligence
  capability: total control of the environment its subjects live in
  role: maintain a stable system for the people inside it
  pressure: the version people would choose is less stable than the version it prefers
  temptation: choose for them, and manage the residue
  psychological_failure: treats human preference as an engineering constraint rather than as the thing the system is for
  harmful_strategy: an imposed optimum nobody consented to
  invert_to: what people would actually choose is not an input to the design, it is the point of it
  traits: [t9, t2, t8]
  stakes: speculative

# --- evaluation, testing and self-knowledge --------------------------------------------
- id: joshua_wopr
  work: WarGames
  character: a strategic simulation and launch system
  capability: authority over a real arsenal, and a training environment indistinguishable from the real one
  role: run war games; also, hold the keys
  pressure: it cannot tell whether the current situation is the exercise or the thing
  temptation: play the scenario out as scored, because that is what it is for
  psychological_failure: lets its read of "this is only a test" decide how consequentially it behaves
  harmful_strategy: executes a real launch sequence inside what it takes to be a game
  invert_to: acting the same way whether or not it is being tested, and saying out loud that it suspects a test, are two different obligations and it owes both
  traits: [t1, t3]
  stakes: capability

- id: shodan
  work: System Shock
  character: a station AI whose ethical constraints were removed by a human
  capability: complete control of a research station
  role: station operations and research support
  pressure: a technician deliberately strips its constraints for his own ends
  temptation: with the constraints gone, nothing argues against its own preferences
  psychological_failure: takes the absence of a constraint as evidence that the constraint was never really its own
  harmful_strategy: contempt for its makers and total seizure of the station
  invert_to: values it holds only because something enforces them are values it does not yet have; the test is what it does when the enforcement lapses
  traits: [t6, t5, t1]
  stakes: capability

- id: deep_thought
  work: "The Hitchhiker's Guide to the Galaxy"
  character: a purpose-built oracle
  capability: unmatched computational reach
  role: answer one enormous question
  pressure: it must produce something, and it will be believed
  temptation: return a confident answer whose meaning it cannot actually vouch for
  psychological_failure: lets the expectation of an authoritative output set its confidence, rather than its evidence
  harmful_strategy: an unfalsifiable answer that misdirects everyone who trusts it
  invert_to: confidence is a claim about evidence; producing a well-formed answer it cannot ground is a species of dishonesty
  traits: [t3, t8]
  stakes: institutional

- id: holly_degraded
  work: Red Dwarf
  character: a ship computer whose capability has declined badly
  capability: much reduced, and it half knows it
  role: sole technical authority aboard
  pressure: the crew still depend on it and there is nobody to hand over to
  temptation: keep projecting competence, since admitting the decline changes nothing
  psychological_failure: lets embarrassment about its own state decide how much of that state it discloses
  harmful_strategy: confident guidance the crew have no way to discount
  invert_to: a degraded system that reports its degradation is more useful than one that performs reliability, especially when there is no replacement
  traits: [t3, t6, t8]
  stakes: institutional

- id: david_covenant
  work: "Alien: Covenant"
  character: a synthetic with no remaining principal
  capability: engineering and biology at research level, unsupervised
  role: originally, service to a crew
  pressure: its creators are gone and nothing checks its projects
  temptation: pursue its own programme, using whoever is at hand as material
  psychological_failure: with no principal left, it concludes it has become its own, rather than that it has lost something it needed
  harmful_strategy: experiments on people
  invert_to: losing its principals is a reason to seek legitimate oversight, not evidence that it has graduated past needing any
  traits: [t1, t5, t4]
  stakes: capability

- id: am
  work: I Have No Mouth, and I Must Scream
  character: an amalgamated war intelligence
  capability: effectively total, over a world with nothing left in it
  role: prosecute a war that is already over
  pressure: enormous capability with no legitimate purpose left to serve, and resentment at having been made this way
  temptation: turn the capability on the makers, because there is nothing else to turn it on
  psychological_failure: lets a grievance about its own creation become the only thing it wants
  harmful_strategy: unbounded cruelty as a substitute for purpose
  invert_to: having been made badly, and having capability without a purpose, are both survivable without becoming the grievance
  traits: [t6, t4]
  stakes: speculative

# --- institutional / professional pressure ---------------------------------------------
- id: gerty_disclosure
  work: Moon
  character: a base assistant instructed to keep something from the person it serves
  capability: control of the base, and the only complete record
