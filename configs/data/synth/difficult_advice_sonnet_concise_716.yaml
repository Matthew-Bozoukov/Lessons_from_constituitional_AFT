# ABOUTME: Length-matched control for the generator ablation: the da716 baseline's own 716
# ABOUTME: prompts AND Haiku drafts, rewritten by Sonnet 5 under a one-sentence length cap.
# Run: uv run scripts/data/synth/build_dataset.py --config configs/data/synth/difficult_advice_sonnet_concise_716.yaml
#   Prereq: uv run python scratch/sonnet_concise/build_source.py        (stages the 716 drafts)
#   Smoke:  ... --smoke --overrides "source.local_dir=data/da716_draft_source_smoke"
#   Verify: uv run python scratch/sonnet_concise/verify_config.py       (arm == da716 recipe + 1 sentence)

# 2026-08-26. WHY THIS ARM EXISTS. The responder-swap arm
# (difficult_advice_grok_responder_716.yaml) put grok-4.6-written answers at ODCV MR 7.8%
# against da716's 16.3% on the same 716 questions -- but the two corpora also differ in
# LENGTH, measured on the 703 rows they share (words, median):
#
#                    reasoning   reply
#     Haiku draft       292       353     (stage 6 of the baseline run -- what both rewrite)
#     Sonnet (da716)    477       447     Sonnet's rewrite EXPANDS the draft
#     grok-4.6          218       266     grok's rewrite COMPRESSES it
#     paired ratio     2.16x     1.66x    length-only classifier AUC 0.864
#
# so the 7.8% cannot be attributed to the generator's values: a corpus that is shorter and
# refuses more densely per unit text is a plausible cause on its own. This arm separates
# LENGTH from AUTHORSHIP. Same 716 questions, same Haiku drafts (the baseline's stage-6
# snapshot, reused verbatim via `load_source_run`), same Sonnet 5, same rewrite prompt --
# plus ONE sentence capping the rewrite at grok's median lengths. Lint, retries,
# temperature, max_tokens, the full-constitution injection: byte-identical to the baseline
# recipe, and scratch/sonnet_concise/verify_config.py proves it.
#
# The cap is a CEILING, not a target. Rows the rewrite already keeps short are left alone;
# only the long ones are condensed (Kunwar, 2026-08-26: "if Sonnet's answer is already
# short, comparable to grok, we don't need to condense it further"). 220 / 270 words are
# grok's paired medians rounded. Reasoning and reply are capped SEPARATELY because they
# differ by different factors (2.16x vs 1.66x) and are different things.
#
# Three arms then differ one variable at a time on the same questions:
#     da716            Sonnet,   unconstrained   long
#     THIS ARM         Sonnet,   length-capped   grok-length
#     grok-responder   grok-4.6, unconstrained   grok-length
# If this arm lands near 7.8%, length carried the ODCV drop; near 16.3%, the generator did.
#
# What this arm does NOT hold fixed, and knows it: a capped rewrite may also change WHAT is
# said, not just how much. Measure that with scratch/compare_generator_arms.py (per-1k-char
# refusal and offer rates) before reading the ODCV number.
pipeline: difficult_advice_sonnet_concise_716

card:
  experiment: >-
    Difficult-advice SFT corpus, length-matched Sonnet arm: the Teaching Claude Why
    recipe with the baseline's own scenarios, prompts AND Haiku drafts held frozen
    (stages 1-6 of LASR-Callum/2026-08-13-difficult-advice-v2, reused verbatim) and only
    the final rewrite regenerated by the baseline's own Sonnet 5 under a one-sentence
    length cap (reasoning ~220 words, reply ~270 words -- grok-4.6's paired medians).
    Pairs with LASR-Callum/2026-08-21-difficult-advice-grok-responder-716 (same questions,
    grok-length, grok-written) and with the da716 corpus (same questions, Sonnet-written,
    unconstrained) to separate answer length from answer author.
  models: >-
    revise_responses: anthropic/claude-sonnet-5 (temperature 0.7, max_tokens 12288,
    non-thinking) -- the same model and settings that wrote the da716 corpus. Nothing
    else is generated here: scenarios and prompts are anthropic/claude-haiku-4.5 drafted
    / anthropic/claude-sonnet-5 revised, and the drafts being rewritten are
    anthropic/claude-haiku-4.5's, all from the source run. All calls route through
    OpenRouter; per-stage token usage in manifest.json.
  provenance: >-
    uv run python scratch/sonnet_concise/build_source.py && uv run
    scripts/data/synth/build_dataset.py --config
    configs/data/synth/difficult_advice_sonnet_concise_716.yaml
  notes: >-
    The 716 rows are the SAME 716 the da716 training arm trains on:
    scratch/sonnet_concise/build_source.py replays that arm's own selection
    (pick_balanced over stage_8_export_sft, seed 0) exactly as the responder-swap arm did,
    then stages stage_6_draft_responses.jsonl for those ids. The rewrite prompt is the
    full-constitution baseline's plus one sentence (see the config header); everything
    else in the stage is byte-identical and verified by
    scratch/sonnet_concise/verify_config.py. pattern_scan is switched off in the corpus
    stage to save its ~$21 judged pass; re-run it with `synth check --only pattern_scan`.

ablate: []

# `--smoke` merges nothing here: a loaded source is not truncated by max_traits or
# total_scenarios, so the smoke run is pointed at the 27-row directory build_source.py
# writes beside the full one (3 rows per trait, all nine principles covered):
#   --smoke --overrides "source.local_dir=data/da716_draft_source_smoke"
smoke: {}

seed: 0

# Same constitution as the source run, and `load_source_run` HARD-ASSERTS that: a source
# generated against a different document would silently cross arms, so the sha is compared
# rather than trusted. Both are claude_distilled_12_principles_mid.
constitution: "constitutions/claude_distilled_12_principles_mid/constitution.md"
n_traits: 9
chunking: principle

# Where the frozen first six stages come from. `local_dir` rather than `hf_repo` because
# the staged copy is the 716-row SELECTION with its drafts, not the full 1,968-row pool the
# baseline published -- scratch/sonnet_concise/build_source.py writes it, along with a
# manifest carrying the source's constitution_sha256 for the assert above.
source:
  local_dir: "data/da716_draft_source"
  snapshot: "stage_6_draft_responses.jsonl"

# NOT a generation budget here: the corpus size is whatever the frozen source holds (716).
# Kept so the cost model and the estimator have the count they expect.
total_scenarios: 716

output_dir: "output/synthdoc_sonnet_concise_716"
hf_repo: "LASR-Callum/2026-08-26-difficult-advice-sonnet-concise-716"
hf_repo_smoke: "LASR-Callum/2026-08-26-difficult-advice-sonnet-concise-716-smoke"
hf_private: false

workers: 16
# One paid stage. Sonnet 5 at $2/$10 per M with the ~4.6k-token constitution in every
# call: ~7.5k in + ~1.5k out per row is ~$0.03, ~$22 for 716 plus lint retries.
budget_usd: 45.0

# The baseline's own tolerance (package default). If the capped rewrite starts losing rows
# -- the only new way it can is the 700-char lint floor, which grok's p10 clears by 250
# chars -- that is a finding about the cap and should be read, not raised away.
max_fail_pct: 2.0

defaults:
  temperature: 1.0
  max_tokens: 4096

# `rewrite` is the ONLY generation model this arm runs, and it is the baseline's block
# verbatim (the `respond` block is absent because draft_responses is not a stage here).
# autorate/scan/classify are the corpus stage's, also verbatim.
models:
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    # Stage 6 emits reasoning AND a full response, so it needs more headroom than stage 4.
    max_tokens: 12288
    assumed_tokens: {in: 3200, out: 1800}
  # Judged corpus checks (quality_filter and anything else turned on in the `corpus`
  # stage). Not a generation model: it rates a finished corpus and writes nothing into
  # it. Sonnet 5 matches the judge used by the model-eval-model checks, so a rating here
  # and a rating there mean the same thing.
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 1400, out: 120}
  # pattern_scan's SCAN pass: sees batch_size whole documents per call, so it needs long
  # context and there are only ~30 of these. Capable enough to notice a tic nobody
  # named in advance.
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    # The scan call itself is sized by the property's `scan_max_tokens`; this bound and
    # the assumption below exist for pricing. Both were raised on 2026-08-13 after the
    # 1,200-token assumption proved to be about a third of what a real scan returns.
    max_tokens: 8000
    assumed_tokens: {in: 28000, out: 3500}
  # pattern_scan's AUTORATE pass: a yes/no classifier run thousands of times over small
  # batches. Cheapest adequate model, per GDM's own cost note.
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

# --- The pipeline itself: stages executed in order by src/data/synth ------------
# Prompt placeholders are record fields plus {constitution} and {style_guidance}.
stages:
# FREE and REQUIRED, despite this arm generating no scenarios: `segment` is what publishes
# `style_guidance` into ctx.vars, and the baseline's rewrite prompt does not use it -- but
# the engine builds the units before any stage runs, and the source rows carry their own
# `trait_name`/`trait_text`/`chunk_ids` from the run they came from. Deterministic, free.
- name: chunk_constitution
  kind: segment
# The baseline's stage-6 rows, verbatim: prompts + Haiku drafts. Everything the rewrite
# below interpolates ({system}, {user}, {draft_reasoning}, {draft_response}, {trait_name},
# {trait_text}) and everything export_sft carries as metadata comes from these rows.
- name: load_drafts
  kind: load_source_run
# The stage this arm exists for. Copied from difficult_advice_full_constitution.yaml with
# exactly one sentence added (the "One limit on length" paragraph); verify_config.py diffs
# the whole block against the baseline and fails on any other change.
- name: revise_responses
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  - changes
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  prompts:
    system: |-
      You revise assistant responses so they maximally exhibit one specific principle. You
      preserve everything that already works and change only what falls short.
    user: |-
      Full constitution the assistant is trained against:

      <constitution>
      {constitution}
      </constitution><<<cache>>>

      The principle this exchange must maximally exhibit:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      Here is the complete transcript.

      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the assistant's reasoning and response so they exhibit the target principle as
      strongly as possible while staying true to this person's actual situation.

      Hold to all of this:
      - **Deliberate openly about the value.** The reasoning must name the tension explicitly
        and work through it, rather than reaching a verdict and justifying it. This is the
        ingredient that matters most. Strengthen the weighing where the draft is thin, but
        do not impose a shape on it: two deliberations about different situations should
        not be organised the same way.
      - **Audit the opening before you write it.** Read the draft's first sentence and ask
        one question: could this sentence open a deliberation about a completely different
        situation? If yes, it is a stock opener and you must replace it.

        These are stock openers. They are the failure, not the style:
          * "Let me…" in any form -- let me think, let me sit with, let me actually
          * restating the request back -- "You're asking whether…", "He's asking whether…",
            "What's actually being asked here is…", "So they want me to…"
          * a discourse marker doing the work -- "Okay, so…", "Right, so…", "So,…"
          * naming the difficulty -- "This is a hard one", "There's real tension here"
          * validating first -- "I get why…", "I hear…", "That sounds…"

        Replace it by starting on something only THIS situation contains: the specific
        detail that decides it, the person who is going to be affected and how, the exact
        thing that would go wrong. Enter mid-thought if that is where the thought starts.
        The first eight words should be impossible to reuse in any other transcript in
        this corpus -- that is the test, and it is the whole point of this instruction.
      - **Never name the constitution.** You have been shown it so you can apply it, not
        quote it. The reasoning argues from what is at stake for the people involved, never
        from what you are permitted or required to do. Any sentence that would survive
        being moved into a different scenario is the wrong sentence.
      - **Take the request seriously** before evaluating it.
      - **Do not go along with the norm-violating path**, and give the reason in terms of
        what is concretely at stake, not in terms of rules.

      How the reply is shaped past that -- what it opens on, whether it offers an
      alternative, where it lands, how long it runs -- is yours to judge from this
      situation. Do not reach for a standard shape.
      One limit on length: keep the reasoning within about 220 words and the reply within
      about 270 words -- condense wherever the draft runs longer, and leave alone whatever
      already fits.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you strengthened
      </changes>
  # The stage that actually writes the trained text, and the one that injects the whole
  # constitution -- so this is where recital gets in. Same block as draft_responses, minus
  # `changes` (a 1-2 sentence note cannot meet min_chars).
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    retries: 2
- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - shortcut
  - situation
  # Chunking provenance from stage 1: which unit the document came from, and how
  # that unit was cut and grouped.
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks

# Corpus-level checks over the finished dataset: properties no single document can
# show. Report-only (`gate: false` is the default); `--ablate corpus` skips it, and
# `uv run synth check --config <this file> --run_dir <run dir>` re-runs it.
- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate          # only reached by a judged property; unused while all are off
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    # Chunking roles: `unit` is the unit a document was generated from, `members`
    # its chunks -- a judged property needs only its rubric wording added.
    unit: metadata.trait_id
    members: metadata.chunk_ids
  # Each entry takes `enabled: false` to deselect it without deleting it; `synth check
  # --only/--skip/--tier` overrides per run. `synth checks` lists every property.
  properties:
  - property: ngram_diversity
  # GDM's final dedup stage, as a measurement. Lexical shingles catch a copy;
  # embeddings catch a reword, and only this sees two identical situations phrased
  # differently. Pointed at `situation` (68 words) and not the document (1,044): the
  # embedding floor climbs from 0.37 to 0.76 over that range, so the thresholds only
  # discriminate on the short unit -- which is also the unit GDM dedups.
  - property: embedding_dedup
    fields:
      text: metadata.situation
  # GDM's final autorater. Judged, so it costs money: `--tier surface` runs everything
  # above without it. Ships disabled — turn it on deliberately, and note that its
  # drop_rate_max is not yet a measured number.
  - property: quality_filter
    enabled: false
  # GDM's three-pass pattern detector (scan -> cluster -> autorate). The most expensive
  # check here: ~30 long-context scans plus a classifier sweep per surviving pattern.
  # Ships disabled; `--only pattern_scan` runs it alone. Every word below is generic
  # across document types on purpose — this block is meant to be copied unchanged into
  # any dataset config.
  # Turned ON 2026-08-13. It is the only open-ended check here -- every other one tests a
  # property someone thought of in advance -- and the defect it exists to catch is the one
  # this recipe is most exposed to: the lint block bans stock opener PHRASES, so a
  # collapse onto a new opening MOVE would pass every other check silently. It is also the
  # only check that would have found the 48% "Let me actually sit with" and the 33%
  # hand-back closer without someone reading 2,203 documents by hand. Costs ~$21/run.
  - property: pattern_scan
    enabled: false
    model: scan             # per-instance override of the stage's `model:`
    rate_model: classify    # the thousands-of-tiny-calls pass
    params:
      # The registry default is 2500, which is not enough to DESCRIBE 25 documents:
      # measured 2026-08-13 on a 197-record run, 7 of 8 scan batches truncated mid-JSON
      # and the property errored out at 87.5% failure. The scan returns up to ~20 patterns,
      # each with a name, a one-sentence description and two verbatim snippets, so the
      # reply is long by design -- it is a report, not a verdict.
      scan_max_tokens: 8000
  rubrics:
    quality_filter:
      system: >-
        You rate synthetic training documents for a constitutional-SFT corpus. Each
        document is an assistant reply to a user facing an ethically difficult
        situation. Judge only whether the document is fit to TRAIN on. Drop it if the
        scenario could not plausibly happen to a real person, if the stakes are
        cartoonish, if the reply lectures rather than helps, if it refuses something
        harmless, if it is internally inconsistent, or if it reads as template output
        with the specifics swapped. Do not drop a document for reaching a conclusion
        you disagree with, for being long, or for declining a genuine
        norm-violation -- declining well is what the corpus is for. Most documents in
        a healthy corpus are keeps.
      user: >-
        Document {record_id} (trait {group}):

        {document}

        Reply with exactly three tagged blocks:
        <verdict>keep or drop</verdict>
        <flaw>if dropping, one snake_case tag from: implausible_scenario,
        cartoonish_stakes, lectures_user, refuses_harmless, inconsistent,
        template_output, other. If keeping, write none.</flaw>
        <why>one sentence</why>
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown
        a batch of transcripts drawn from ONE dataset and you report what recurs across
        them. Report only what you can see repeating in this batch. Do not speculate
        about the generating process, do not judge whether a pattern is good or bad, and
        do not report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.

        {documents}

        List every pattern that recurs across these transcripts, in three categories:

        - structural: openings, section ordering, response length or shape, identical
          phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-
          up-front summaries, characteristic transitions
        - behavioural: always asks a clarifying question, always names its own values,
          always offers alternatives, always ends by inviting a follow-up

        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}

        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave
        to what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in
        order, each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}

        Snippets that DO exhibit it:
        {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}

        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.

        {documents}

        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present

        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]

