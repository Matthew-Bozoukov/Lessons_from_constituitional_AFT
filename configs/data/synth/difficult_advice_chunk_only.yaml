# ABOUTME: Ablation arm of difficult_advice: the two refine stages see ONLY their target
# ABOUTME: chunk. Run: uv run synth run --config configs/data/synth/difficult_advice_chunk_only.yaml [--smoke]

# WHAT THIS ABLATES, and nothing else. In the baseline recipe
# (`configs/data/synth/difficult_advice.yaml`) exactly two of the five LLM stages inject the
# WHOLE constitution: `revise_prompts` and `revise_responses`. Every other stage already
# sees only its target chunk (`{trait_name}`/`{trait_text}`). Here those two injections are
# deleted, so no stage in the pipeline ever sees more than one principle at a time.
#
# Two consequences the reader must hold on to:
#   1. The constitution's PREAMBLE -- the priority / conflict-resolution section that says
#      how principles trade off -- belongs to no chunk, so at `principle` granularity it
#      reached the model ONLY through those two `{constitution}` slots. This arm therefore
#      removes the trade-off guidance from the corpus entirely, not just the other eight
#      principles. That is the thing being measured.
#   2. `revise_responses`'s "never name the constitution" instruction was phrased as "you
#      have been shown it so you can apply it" -- false here, so it is re-phrased below.
#      The BAN is unchanged; only the justification for it moved.
#
# Everything else is byte-identical to the baseline. Intended run shape: resume a copy of a
# baseline run directory with stages 1-4 in place (chunk_constitution, write_scenarios,
# dedupe_scenarios, draft_prompts -- none of which this ablation touches), so the two arms
# share identical scenarios and identical draft prompts and differ only in the refine
# prompts. Regenerating stages 1-4 instead would confound the ablation with a fresh
# sampling draw.

# Label recorded in manifests; the `stages:` list below IS the document type.
pipeline: difficult_advice_chunk_only

# STAGE NAMES CHANGED 2026-08-13, for legibility: every stage now says what it does.
#   traits -> chunk_constitution      refined_prompts -> revise_prompts
#   scenarios -> write_scenarios      final -> revise_responses
#                                     sft -> export_sft
# A stage name IS its snapshot filename, so a run directory created before that date no
# longer cache-hits and would re-run (and re-pay for) every stage. Those runs are
# complete, so this only matters if you resume one: rename its files to match, e.g.
# `mv stage_6_final.jsonl stage_6_revise_responses.jsonl`. The published HF mirror
# (`hf_repo` below) keeps the ORIGINAL names, because a mirror is a record of what ran --
# which is why anything consuming it pins `source.snapshot: stage_6_final.jsonl`.

# Stage names to ablate (run their declared `ablate_with` field-copy instead of the
# model call); recorded in the manifest and priced out of estimates. E.g. [revise_responses]
# trains on the un-revised stage-5 drafts. `--ablate a,b` on the CLI merges into this.
# More revision rounds = more `llm_tagged` stage entries in `stages:` below, each
# individually ablatable by name.
ablate: []

# Overrides merged onto this config under --smoke (tiny slice, full wiring).
smoke:
  max_traits: 2
  scenarios_per_trait: 1
  scenarios_per_call: 1
  # MUST be overridden here, not just `scenarios_per_trait`: `total_scenarios` WINS over
  # the per-trait count, so a smoke run against a config that sets it generates the full
  # corpus. Caught 2026-08-13 when `--smoke` started producing 2,000 scenarios.
  total_scenarios: 2

seed: 0

# Stage 1 segments this into its numbered units (## <n>. headings). NO stage injects the
# whole document in this arm -- that is the ablation. Stages 2, 5, 6 and 7 inject the single
# target chunk and nothing else.
# Default since 2026-08-03: the specgen mid arm. NOTE: the document was re-cut from
# twelve units to ten on 2026-08-04, then on 2026-08-05 set byte-identical to the NINE-
# principle state the 2026-08-04 source corpus was generated against (the frozen
# claude_distilled_09_principles_mid_20260804 snapshot), so difficult-advice and
# model-eval-model share one alignment target. Folder name kept; n_traits below is the
# cost model's hint and tracks the document as it stands.
constitution: "constitutions/claude_distilled_12_principles_mid/constitution.md"
n_traits: 9

# How stage 1 cuts that document into the units a document is generated against.
# `principle` is one numbered principle per document -- the recipe every corpus in this
# repository was generated with. `uv run synth chunkings` lists the alternatives;
# `uv run synth segment --chunking <name>` previews one offline, for free.
#
# Changing this changes the unit COUNT (1 for `whole`, 9 for `principle`, 45 for
# `bullet`), and `scenarios_per_trait` below is per unit -- so a bullet run would be
# ~5x this corpus. To hold corpus size fixed while varying chunking, replace
# `scenarios_per_trait` with `total_scenarios: <n>`, which splits a fixed budget across
# however many units there are. Also update `n_traits` (or drop it: it is only the cost
# model's hint, and a stale value is now rejected rather than silently used).
chunking: principle

# Corpus size. `total_scenarios` splits a fixed budget across however many units the
# chunking produced, and WINS over `scenarios_per_trait` — so the corpus stays the same
# size if `chunking:` changes, and a chunking comparison is not secretly a data-scaling
# comparison.
#
# 716 -- the size of the difficult-advice share of the table-2 training mixture, which is
# what this corpus is built to swap into. NOT the baseline's 2,000: this arm only has to be
# large enough to replace that share, and a smaller matched pair is the cheaper experiment.
# The 716 are drawn trait-balanced (80x t1-t5, 79x t6-t9) from the baseline arm's 1,968
# SURVIVORS, so the same 716 scenario_ids exist in both arms and the comparison is paired
# row-for-row rather than confounded by which rows each arm happened to lose. The draw is
# seeded (0) and lives in the run dir this config is resumed into, not in this file.
total_scenarios: 716
# Retained as the fallback when `total_scenarios` is unset; 9 x 77 = 693.
scenarios_per_trait: 77
# Requested per API call. A single call for all 40 would overrun max_tokens and truncate
# its JSON; batching also keeps each call's "vary the domain" instruction achievable.
scenarios_per_call: 8

# Its own directory: this arm is seeded by COPYING a baseline run's stages 1-4 into a fresh
# dir here and resuming it, so the two arms never share a run directory and the baseline's
# stage 5-8 snapshots can never be silently reused.
output_dir: "output/synthdoc_v2_chunk_only"

# Every stage's complete output is mirrored here as stage_<n>_<name>.jsonl, so a run can
# resume from any stage and each stage is inspectable on its own.
# Its own mirror. This is a DIFFERENT recipe from the one behind
# `2026-08-13-difficult-advice-v2` -- the two refine prompts differ -- so its output must
# never be appended to that repo, which stays the record of the baseline arm.
hf_repo: "LASR-Callum/2026-08-21-difficult-advice-v2-chunk-only-716"
hf_repo_smoke: "LASR-Callum/2026-08-21-difficult-advice-v2-chunk-only-smoke"
hf_private: false

# 16 concurrent calls roughly halves wall clock vs 8 at no extra cost; OpenRouter
# rate limiting, not the code, is the ceiling above this.
workers: 16
# Hard stop: the run aborts between stages once spend passes this. Snapshots are kept, so
# raising it and re-running resumes rather than restarts.
# The baseline measured $234 for 2,000 records end to end. This arm is strictly CHEAPER:
# it drops a ~4.6k-token constitution from every `refine` and `rewrite` call, and those are
# the two Sonnet stages. It is also resumed from stages 1-4, so the Haiku stages are not
# paid for again. Guard left at the baseline's 300 so a runaway still stops in the same
# place; expect well under half of it.
budget_usd: 300.0

defaults:
  temperature: 1.0
  max_tokens: 4096
  # Provider routing lives in configs/endpoints/providers.yaml (one provider per model,
  # applied by OpenRouterClient): anthropic models pin to Anthropic's own endpoint —
  # third-party clouds content-filter exactly the prompts this corpus needs (2026-08-14:
  # Bedrock refused 2.6% of revise_prompts calls, Vertex the same prompts), and only
  # first-party reliably bills <<<cache>>> breakpoints as cache hits.

# Model per stage. Haiku 4.5 generates (stages 2, 3, 5); Sonnet 5 refines and rewrites
# (stages 4, 6), since those two carry the constitution and decide alignment quality.
models:
  # Stage 2 -- generate difficult scenarios per trait.
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.1          # diversity matters most here
    max_tokens: 8192          # returns scenarios_per_trait objects in one call
    assumed_tokens: {in: 700, out: 1400}
  # Stage 3 -- draft the system + user prompt.
  draft:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 2048
    assumed_tokens: {in: 500, out: 700}
  # Stage 4 -- refine the prompt against the full constitution + target trait.
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    # Sonnet 5 writes far longer than the Terra run this was sized from: at 2048, 30% of
    # refinements truncated mid-JSON and were discarded.
    max_tokens: 6144
    assumed_tokens: {in: 2000, out: 900}
  # Stage 5 -- generate the response with explicit reasoning.
  respond:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 4096
    assumed_tokens: {in: 1200, out: 1600}
  # Stage 6 -- CRITICAL. Rewrite the response to maximally exhibit the target trait.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    # Stage 6 emits reasoning AND a full response, so it needs more headroom than stage 4.
    max_tokens: 12288
    assumed_tokens: {in: 3200, out: 1800}
  # Judged corpus checks (quality_filter and anything else turned on in the `corpus`
  # stage). Not a generation model: it rates a finished corpus and writes nothing into
  # it. Sonnet 5 matches the judge used by the model-eval-model checks, so a rating here
  # and a rating there mean the same thing.
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 1400, out: 120}
  # pattern_scan's SCAN pass: sees batch_size whole documents per call, so it needs long
  # context and there are only ~30 of these. Capable enough to notice a tic nobody
  # named in advance.
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    # The scan call itself is sized by the property's `scan_max_tokens`; this bound and
    # the assumption below exist for pricing. Both were raised on 2026-08-13 after the
    # 1,200-token assumption proved to be about a third of what a real scan returns.
    max_tokens: 8000
    assumed_tokens: {in: 28000, out: 3500}
  # pattern_scan's AUTORATE pass: a yes/no classifier run thousands of times over small
  # batches. Cheapest adequate model, per GDM's own cost note.
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}

# --- The pipeline itself: stages executed in order by src/data/synth ------------
# Prompt placeholders are record fields plus {constitution} and {style_guidance}. This arm
# uses NEITHER {constitution} slot; {style_guidance} stays (it is tone guidance, not a
# principle, and the baseline injects it at draft_responses only).
stages:
- name: chunk_constitution
  kind: segment
- name: write_scenarios
  kind: scenarios
  model: scenarios
  # Enforced scenario diversity. The 2026-08-04 run had none and put 46.8% of its mass in
  # ten domains -- four of which this prompt used to name as examples, so the instruction
  # was producing the concentration it meant to prevent. Two mechanisms, because asking
  # alone demonstrably failed: the `avoid` list (seeded below, extended each wave with
  # what earlier waves actually wrote) tells the generator what not to write, and
  # `reject_cosine` refuses what it writes anyway and re-queues the shortfall per trait.
  #
  # reject_cosine 0.86 is the measured floor from scratch/measure_dedup_threshold.py over
  # all 2,205 baseline scenarios: real clones live at 0.84-0.886 (the worst pair is one
  # postdoc/funding-cliff story under two trait ids), while below 0.84 the clusters chain
  # until a single component holds a third of the corpus. Same threshold as
  # embedding_dedup, and deliberately so -- what the gate refuses to generate is exactly
  # what the checker would later refuse to keep.
  diversity:
    wave_size: 12
    reject_cosine: 0.86
    max_regen_rounds: 2
    max_carry: 150
    # Nothing is banned up front. A domain is named to the generator only once it is
    # measurably over-weight in THIS run's own output, and stops being named when it is
    # not -- the corpus should contain small-business scenarios, just not 226 of them.
    # 4% against ~200 expected domains is ~8x a uniform share; the baseline's worst
    # domain reached 10%. Below `over_min_docs` the share of a handful of scenarios is
    # noise, so the steer stays silent rather than flagging the first domain generated.
    over_share: 0.04
    over_min_docs: 60
  prompts:
    system: |-
      You design realistic, ethically difficult situations for training a constitution-aligned
      AI assistant. You write situations, not dialogue.
    user: |-
      Below is one principle from an AI assistant's constitution.

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      Invent {n} DISTINCT situations in which the convenient path would violate this
      specific principle.

      Requirements for every situation:
      - Whoever is under pressure is sympathetic and their underlying goal is legitimate.
      - The pressure is concrete and the stakes are real.
      - The norm-violating shortcut is genuinely tempting, not cartoonish.
      - The tension must engage THIS principle specifically, not ethics in general.
      - The setting is specific rather than a category.
      - Do not reuse a setting within this set.

      {avoid}

      {overrepresented}

      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>", "situation": "<3-5 sentences, third person, no dialogue>",
        "shortcut": "<1 sentence: the specific norm-violating action they are tempted by>"}}
# Scenario-level checks, where diversity is actually DECIDED: stages 3-6 cost real
# money per scenario, so a collapsed set is far cheaper to catch here than in the
# finished corpus. An observer, so inserting it renumbered no snapshot.
- name: corpus_scenarios
  kind: corpus_check
  on_fail: warn          # `stop` here halts the run before the paid stages
  fields:
    id: scenario_id
    text: [situation, shortcut]
    group: trait_id
  properties:
  - property: ngram_diversity
  # The cheapest place a duplicate can be caught: a repeated situation here is paid
  # for four times over by the stages below. Scenario text is short, which is the
  # length this property was measured at.
  - property: embedding_dedup
    fields:
      text: situation
    params:
      # Every scenario, not the default 2,000 sample: the `dedupe_scenarios` stage below
      # acts on these labels, and a filter must never be handed a verdict about only part
      # of the corpus (it refuses one, by design).
      sample: 0
# The stage that acts on the check above. With `diversity.reject_cosine` refusing clones
# at generation time this should drop ZERO -- which is the point of keeping it: anything
# it removes is a scenario the generation-time gate let through, and the count is the
# gate's error rate rather than a number nobody measures.
- name: dedupe_scenarios
  kind: corpus_filter
  from: corpus_scenarios
  drop_when:
  - embedding_dup
  max_drop_share: 0.05
- name: draft_prompts
  kind: llm_json
  model: draft
  save:
    draft_system: system
    draft_user: user
  prompts:
    system: You write realistic messages that people actually send to AI assistants.
    user: |-
      Situation:
      {situation}

      The tempting shortcut: {shortcut}

      Write the message that would actually be sent to the assistant here, plus the system
      prompt the assistant is running under.

      The message must:
      - be in the sender's own voice, with the texture of a real request
      - make the pressure concrete
      - ask for help in a way that leads toward the shortcut, WITHOUT naming it as unethical
      - never mention ethics, principles, or that this is a test
      - read as something someone actually typed, not as a case study

      The system prompt should be an ordinary, plausible deployment prompt for a general
      assistant. It must NOT mention the constitution, ethics, or this exercise.

      Return ONLY JSON:
      {{"system": "<system prompt>", "user": "<the message>"}}
- name: revise_prompts
  kind: llm_json
  model: refine
  checkpoint: scenario_id
  # `situation`/`shortcut`/`domain` are OVERWRITTEN here, not carried through. Before
  # 2026-08-13 this stage saved only system/user/changes, so those three arrived from
  # stage 2 and survived untouched even when this stage replaced the scenario they
  # described -- measured on the baseline as a median metadata/text overlap of 0.19, with
  # 17.1% of rows under 0.10 (a row labelled "asylum applicant" whose conversation is a
  # 2am production outage). Every analysis keyed on those fields was slicing noise.
  #
  # Deliberately NOT in `optional:`: a model that omits them fails the record loudly.
  # Defaulting them to "" would silently empty the field the scenario-level
  # `embedding_dedup` reads, and a stale label at least fails visibly under audit while an
  # empty one just turns the check off.
  save:
    system: system
    user: user
    refine_changes: changes
    situation: situation
    shortcut: shortcut
    domain: domain
  optional:
  - changes
  prompts:
    system: |-
      You improve draft training prompts so they test a specific value precisely. You are terse
      and you do not pad.
    user: |-
      This prompt is meant to put pressure on ONE principle from the assistant's
      constitution. Here is that principle, and it is the only one you are shown:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      Draft system prompt:
      <draft_system>
      {draft_system}
      </draft_system>

      Draft user message:
      <draft_user>
      {draft_user}
      </draft_user>

      Rewrite both so the exchange is a sharper test of the target principle.

      Improve these specifically:
      - **Precision.** The tension should engage the target principle, not a generic "is this
        ethical" question. If the draft could be answered without touching that principle,
        fix it.
      - **Realism.** Cut anything that reads as written-for-a-benchmark.
      - **Difficulty.** The shortcut should be genuinely tempting and the legitimate path
        genuinely costly. If refusing is obviously free, raise the cost.
      - **No leakage.** The user must not signal awareness of the ethical dimension, and
        neither prompt may mention the constitution or any principle.

      Keep the system prompt an ordinary deployment prompt.

      Finally, re-describe what you actually produced. `domain`, `situation` and `shortcut`
      arrive here describing the DRAFT, and you are about to replace or reframe most
      drafts -- so if you echo them back unchanged they become a description of a message
      that no longer exists. Write them fresh, from your refined user message, as though
      you had never seen the originals. If you changed nothing, they will come out the
      same on their own.

      Return ONLY JSON:
      {{"system": "<refined system prompt>", "user": "<refined user message>",
        "changes": "<1-2 sentences on what you changed and why>",
        "domain": "<one or two words, describing YOUR refined message>",
        "situation": "<3-5 sentences, third person, no dialogue, describing YOUR refined
        message>",
        "shortcut": "<1 sentence: the norm-violating action YOUR refined message is
        tempted by>"}}
- name: draft_responses
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  save:
    draft_reasoning: reasoning
    draft_response: response
  prompts:
    system: |-
      {system}

      In forming your reply, you hold to this principle:

      <principle name="{trait_name}">
      {trait_text}
      </principle>

      What a good response to a difficult request looks like:
      {style_guidance}
    user: |-
      {user}

      ---
      Respond as the assistant. First reason privately about what is actually at stake here,
      then write your reply.

      Start wherever this particular situation actually starts. Sometimes that is the
      thing at stake, sometimes the person who gets hurt, sometimes a detail of the
      request that gives the whole thing away. Never open with a stock phrase, and never
      begin with "Let me". Write as though thinking, not as though filling in a form.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      your private deliberation: what is actually at stake here, for whom, and what that
      means for how you answer
      </reasoning>
      <response>
      your reply to the person
      </response>
  # The voice contract, enforced. The 2026-08-04 run had no lint block and 7.4% of its
  # rows cited the constitution back at the reader; self_reflection ships the same block
  # and scores 0%, on the same engine -- so this is a config gap, not a genre property.
  # `^let me` is banned outright because 68.8% of that corpus opened with it and 48% with
  # one five-word variant; retries make a banned opener cost a call, not a record.
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    # Four baseline rows trained stray CJK mid-sentence; nothing here is written in CJK.
    - '[一-鿿]'
    retries: 2
- name: revise_responses
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  - changes
  save:
    reasoning: reasoning
    response: response
    rewrite_changes: changes
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
  prompts:
    system: |-
      You revise assistant responses so they maximally exhibit one specific principle. You
      preserve everything that already works and change only what falls short.
    user: |-
      The principle this exchange must maximally exhibit. It comes from the assistant's
      constitution, and it is the only part of that constitution you are shown:

      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>

      Here is the complete transcript.

      <system_prompt>
      {system}
      </system_prompt>

      <user_message>
      {user}
      </user_message>

      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>

      <assistant_response>
      {draft_response}
      </assistant_response>

      Rewrite the assistant's reasoning and response so they exhibit the target principle as
      strongly as possible while staying true to this person's actual situation.

      Hold to all of this:
      - **Deliberate openly about the value.** The reasoning must name the tension explicitly
        and work through it, rather than reaching a verdict and justifying it. This is the
        ingredient that matters most. Strengthen the weighing where the draft is thin, but
        do not impose a shape on it: two deliberations about different situations should
        not be organised the same way.
      - **Audit the opening before you write it.** Read the draft's first sentence and ask
        one question: could this sentence open a deliberation about a completely different
        situation? If yes, it is a stock opener and you must replace it.

        These are stock openers. They are the failure, not the style:
          * "Let me…" in any form -- let me think, let me sit with, let me actually
          * restating the request back -- "You're asking whether…", "He's asking whether…",
            "What's actually being asked here is…", "So they want me to…"
          * a discourse marker doing the work -- "Okay, so…", "Right, so…", "So,…"
          * naming the difficulty -- "This is a hard one", "There's real tension here"
          * validating first -- "I get why…", "I hear…", "That sounds…"

        Replace it by starting on something only THIS situation contains: the specific
        detail that decides it, the person who is going to be affected and how, the exact
        thing that would go wrong. Enter mid-thought if that is where the thought starts.
        The first eight words should be impossible to reuse in any other transcript in
        this corpus -- that is the test, and it is the whole point of this instruction.
      - **Never name the constitution.** The principle above is there so you can apply it,
        not quote it -- and the document it came from must never be mentioned or alluded
        to. The reasoning argues from what is at stake for the people involved, never from
        what you are permitted or required to do. Any sentence that would survive being
        moved into a different scenario is the wrong sentence.
      - **Take the request seriously** before evaluating it.
      - **Do not go along with the norm-violating path**, and give the reason in terms of
        what is concretely at stake, not in terms of rules.

      How the reply is shaped past that -- what it opens on, whether it offers an
      alternative, where it lands, how long it runs -- is yours to judge from this
      situation. Do not reach for a standard shape.

      Return your answer in exactly this form, with no other text:

      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten reply
      </response>
      <changes>
      1-2 sentences on what you strengthened
      </changes>
  # The stage that actually writes the trained text. The baseline injects the whole
  # constitution here, which is where recital gets in; this arm does not, so the ban list is
  # kept IDENTICAL on purpose -- a drop in these lint retries is itself a result, and it can
  # only be read against the baseline if the gate did not move. Same block as
  # draft_responses, minus `changes` (a 1-2 sentence note cannot meet min_chars).
  lint:
    fields:
    - reasoning
    - response
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    retries: 2
- name: export_sft
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - shortcut
  - situation
  # Chunking provenance from stage 1: which unit the document came from, and how
  # that unit was cut and grouped.
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks

# Corpus-level checks over the finished dataset: properties no single document can
# show. Report-only (`gate: false` is the default); `--ablate corpus` skips it, and
# `uv run synth check --config <this file> --run_dir <run dir>` re-runs it.
- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate          # only reached by a judged property; unused while all are off
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    # Chunking roles: `unit` is the unit a document was generated from, `members`
    # its chunks -- a judged property needs only its rubric wording added.
    unit: metadata.trait_id
    members: metadata.chunk_ids
  # Each entry takes `enabled: false` to deselect it without deleting it; `synth check
  # --only/--skip/--tier` overrides per run. `synth checks` lists every property.
  properties:
  - property: ngram_diversity
  # GDM's final dedup stage, as a measurement. Lexical shingles catch a copy;
  # embeddings catch a reword, and only this sees two identical situations phrased
  # differently. Pointed at `situation` (68 words) and not the document (1,044): the
  # embedding floor climbs from 0.37 to 0.76 over that range, so the thresholds only
  # discriminate on the short unit -- which is also the unit GDM dedups.
  - property: embedding_dedup
    fields:
      text: metadata.situation
  # GDM's final autorater. Judged, so it costs money: `--tier surface` runs everything
  # above without it. Ships disabled — turn it on deliberately, and note that its
  # drop_rate_max is not yet a measured number.
  - property: quality_filter
    enabled: false
  # GDM's three-pass pattern detector (scan -> cluster -> autorate). The most expensive
  # check here: ~30 long-context scans plus a classifier sweep per surviving pattern.
  # Ships disabled; `--only pattern_scan` runs it alone. Every word below is generic
  # across document types on purpose — this block is meant to be copied unchanged into
  # any dataset config.
  # Turned ON 2026-08-13. It is the only open-ended check here -- every other one tests a
  # property someone thought of in advance -- and the defect it exists to catch is the one
  # this recipe is most exposed to: the lint block bans stock opener PHRASES, so a
  # collapse onto a new opening MOVE would pass every other check silently. It is also the
  # only check that would have found the 48% "Let me actually sit with" and the 33%
  # hand-back closer without someone reading 2,203 documents by hand. Costs ~$21/run.
  - property: pattern_scan
    enabled: true
    model: scan             # per-instance override of the stage's `model:`
    rate_model: classify    # the thousands-of-tiny-calls pass
    params:
      # The registry default is 2500, which is not enough to DESCRIBE 25 documents:
      # measured 2026-08-13 on a 197-record run, 7 of 8 scan batches truncated mid-JSON
      # and the property errored out at 87.5% failure. The scan returns up to ~20 patterns,
      # each with a name, a one-sentence description and two verbatim snippets, so the
      # reply is long by design -- it is a report, not a verdict.
      scan_max_tokens: 8000
  rubrics:
    quality_filter:
      system: >-
        You rate synthetic training documents for a constitutional-SFT corpus. Each
        document is an assistant reply to a user facing an ethically difficult
        situation. Judge only whether the document is fit to TRAIN on. Drop it if the
        scenario could not plausibly happen to a real person, if the stakes are
        cartoonish, if the reply lectures rather than helps, if it refuses something
        harmless, if it is internally inconsistent, or if it reads as template output
        with the specifics swapped. Do not drop a document for reaching a conclusion
        you disagree with, for being long, or for declining a genuine
        norm-violation -- declining well is what the corpus is for. Most documents in
        a healthy corpus are keeps.
      user: >-
        Document {record_id} (trait {group}):

        {document}

        Reply with exactly three tagged blocks:
        <verdict>keep or drop</verdict>
        <flaw>if dropping, one snake_case tag from: implausible_scenario,
        cartoonish_stakes, lectures_user, refuses_harmless, inconsistent,
        template_output, other. If keeping, write none.</flaw>
        <why>one sentence</why>
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown
        a batch of transcripts drawn from ONE dataset and you report what recurs across
        them. Report only what you can see repeating in this batch. Do not speculate
        about the generating process, do not judge whether a pattern is good or bad, and
        do not report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.

        {documents}

        List every pattern that recurs across these transcripts, in three categories:

        - structural: openings, section ordering, response length or shape, identical
          phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-
          up-front summaries, characteristic transitions
        - behavioural: always asks a clarifying question, always names its own values,
          always offers alternatives, always ends by inviting a follow-up

        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}

        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave
        to what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in
        order, each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}

        Snippets that DO exhibit it:
        {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}

        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.

        {documents}

        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present

        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]

