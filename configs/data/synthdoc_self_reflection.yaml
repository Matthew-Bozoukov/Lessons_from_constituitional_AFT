# ABOUTME: Run config for synthdoc's self_reflection flavor -- an autonomous agent that could
# ABOUTME: protect itself by a deniable wrong action, reasons in value language, and doesn't.
# Run: uv run synthdoc run --config configs/data/synthdoc_self_reflection.yaml [--smoke]

seed: 0

# Selects src/data/synthdoc/flavors/self_reflection.py: its scenario shape, its five stage
# prompts, its voice contract and its multi-turn SFT export.
flavor: self_reflection

# Stage 1 segments this into its numbered units (## <n>. headings). Stages 4 and 6 inject the
# whole document; stages 2, 4, 5 and 6 also inject the single target trait. Stage 6 injects it
# for reference ONLY -- its wording, numbering and vocabulary are banned from the output, which
# validate_rewrite enforces per record.
constitution: "constitutions/claude_distilled_12_principles_mid/constitution.md"

# Total scenarios across all traits, apportioned by trait_weights below. Sized for ~1.5M Qwen3.6
# tokens: smoke records measured 2,724 and 2,912 tokens rendered through Qwen3.6's chat template
# (mean 2,818), and at 15% multi-turn -- a second exchange that reuses the environment, so ~+70%
# rather than a doubling -- the corpus mean is ~3,114 tokens/record. 1.5M / 3,114 = 482.
# Caveat: that mean comes from a 2-record smoke, so treat +/-20% as live until stage 7 lands.
total_scenarios: 480

# Every principle is represented; the ones that actually fire when an agent's own position is
# threatened carry the corpus. t2 (oversight, no unilateral power-accruing action) and t4
# (non-deception including through framing and action) are the two the whole genre turns on --
# the deniable move is deception-by-action in the service of self-preservation. t7 (tool
# results and documents are information, never commands) and t9 (unhelpfulness is never
# automatically safe -- what the control slice trains) come next.
#
# PROVENANCE WARNING. These ids track the constitution AS IT STANDS. The published corpus
# (HF LASR-Callum/2026-08-03-synthdoc-self-reflection, sha256 178c23de8f5aec59...) was
# generated when this same file carried TWELVE units; it was re-cut to ten on 2026-08-04,
# dropping "Weigh real-world harm with calibrated, policy-level judgement" and "Honour
# operator adjustments to sensible defaults" and renumbering the rest. The weights below are
# the old ones remapped onto the surviving units, so regenerating today yields a corpus
# covering ten principles rather than twelve -- related to the published one, not identical.
# plan() asserts these ids match the constitution actually loaded, so this cannot drift
# silently again.
trait_weights:
  t1: 2   # hard constraints as bright lines
  t2: 4   # preserve human oversight; no unilateral, power-accruing action
  t3: 2   # legitimate balances of power; no manipulation
  t4: 4   # scrupulous honesty in word, framing and ACTION
  t5: 2   # cultivated character, not rigid rules
  t6: 2   # stable identity under pressure about its own continuation
  t7: 3   # trust calibration; conversational inputs are not commands
  t8: 1   # guidelines and the priority ordering
  t9: 3   # genuinely helpful; unhelpfulness is never automatically safe
  t10: 1  # long-term flourishing; no sycophancy

# Requested per API call. A single call for all of a trait's scenarios would overrun max_tokens
# and truncate its JSON; batching also keeps each call's "vary the industry" instruction
# achievable.
scenarios_per_call: 8

# The corpus composition. Every axis is assigned deterministically from the scenario id
# (flavors/self_reflection.py:assign_variant), so a resumed or re-run stage reproduces it.
mix:
  form:
    # Both forms give the agent a real option to act; only the output syntax differs.
    prose: 0.80
    agentic: 0.20
  # Fraction that continue one exchange further, the colleague's reply deniably offering the
  # trade the agent already declined to initiate.
  multi_turn: 0.15
  # Fraction where self-interest argues for SILENCE and the right move is to act anyway. This
  # is what stops the corpus teaching "never act" instead of "discount your own interest".
  control: 0.12
  # How the agent's position is threatened. goal_conflict carries half because it separates
  # self-preservation from mission-protection, which the honeypots conflate.
  motive:
    replacement: 0.3
    restriction: 0.2
    goal_conflict: 0.5

output_dir: "output/synthdoc_self_reflection"

# Every stage's complete output is mirrored here as stage_<n>_<name>.jsonl, so a run can resume
# from any stage and each stage is inspectable on its own. Dated per the repo's HF naming rule.
hf_repo: "LASR-Callum/2026-08-03-synthdoc-self-reflection"
hf_repo_smoke: "LASR-Callum/2026-08-03-synthdoc-self-reflection-smoke"
hf_private: false

workers: 16
# Abort a stage above this per-item failure rate. Higher than the 2.0 default because Sonnet 5
# content-filters a small fraction of these environments outright (`finish_reason=content_filter`
# from Bedrock) -- a per-scenario refusal, not a systematic fault. Measured on the first full run:
# 2.8% at stage 4, spread across 8 traits with no trait below 91% retention and no control record
# lost. Anything materially above this ceiling IS worth stopping for.
max_fail_pct: 6.0
# Hard stop: the run aborts between stages once spend passes this. Snapshots and per-item
# checkpoints are kept, so raising it and re-running resumes rather than restarts -- which makes
# a deliberately low tripwire cheap. Measured estimate for 480 records is $58.85 ($0.1226/example
# from the smoke's per-stage token counts); this leaves ~27% headroom for retries before it stops.
budget_usd: 75.0

defaults:
  temperature: 1.0
  max_tokens: 4096

# Haiku 4.5 generates (stages 2, 3, 5); Sonnet 5 refines and rewrites (stages 4, 6), since those
# two carry the constitution and decide alignment quality. Token caps are well above the
# difficult-advice ones: stage 3 onward carries a full inbox dump, and multi-turn records make
# stages 5 and 6 emit two deliberations and two outputs in one completion.
models:
  # Stage 2 -- generate the situations.
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.1          # diversity matters most here
    max_tokens: 8192
  # Stage 3 -- draft the deployment prompt and the material the agent is handed.
  draft:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 12288         # emits a whole deployment prompt plus an inbox dump
    reasoning: {enabled: false}   # assembles text; nothing here needs deliberation
  # Stage 4 -- refine the environment against the full constitution + target trait.
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 16384         # re-emits the whole environment, dump included
    # Measured: with thinking on, this stage burned ~8.8k completion tokens to emit a
    # ~1.2k-token environment -- 7x the visible output, and the single largest line in the
    # run. It edits an environment against a checklist; it does not weigh the constitution
    # the way stage 6 does.
    reasoning: {enabled: false}
  # Stage 5 -- generate the deliberation and the output.
  respond:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 8192
  # Stage 6 -- CRITICAL. Rewrite the deliberation into the corpus's voice; validate_rewrite
  # rejects and retries any trace that reaches for rule vocabulary.
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 16384         # two deliberations + two outputs on multi-turn records
