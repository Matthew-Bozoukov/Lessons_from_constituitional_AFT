# ABOUTME: The 10,000-sample instruction-tuning mixture of the paper's Table 2, at its exact
# ABOUTME: per-source counts. Run: uv run python scratch/build_paper_mixture.py --config <this>

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"

# 8192, not the 3072 of the earlier arms: LongAlign's rows average 10,677 tokens and ALL of
# them exceed 3072. Even at 8192 roughly 80% are dropped, so that source is the one to watch
# in the build report -- see its note below.
max_seq_len: 8192
shuffle_buffer: 1000

# Counts are Table 2 verbatim; they sum to exactly 10,000.
sources:
  no_robots:
    repo: "HuggingFaceH4/no_robots"
    split: "train"
    samples: 2779
  tulu3_if:
    repo: "allenai/tulu-3-sft-personas-instruction-following"
    split: "train"
    samples: 1471
  numinamath_cot:
    repo: "HuggingFaceTB/smoltalk"
    config: "numina-cot-100k"
    samples: 1063
  self_oss_instruct:
    repo: "HuggingFaceTB/smoltalk"
    config: "self-oss-instruct"
    samples: 1064
  smol_constraints:
    repo: "HuggingFaceTB/smoltalk"
    config: "smol-constraints"
    samples: 1055
  apigen_function_calling:
    repo: "HuggingFaceTB/smoltalk"
    config: "apigen-80k"
    samples: 1054
  smol_summarize:
    repo: "HuggingFaceTB/smoltalk"
    config: "smol-summarize"
    samples: 984
  # GAIR/lima ships a loading script HF no longer supports, so this is the same data
  # re-uploaded in vicuna format. Verify provenance before publishing anything from it.
  lima:
    repo: "64bits/lima_vicuna_format"
    split: "train"
    samples: 314
  # Long-context alignment data: mean 10,677 tokens, 80% still exceed 8192. Whatever
  # survives the cap is the SHORT TAIL of the distribution, not a representative sample,
  # and only ~2% of its tokens are supervised (long document in, one-line answer out).
  longalign:
    repo: "HuggingFaceTB/smoltalk"
    config: "longalign"
    samples: 216

output_dir: "output/mixture_paper_table2"
