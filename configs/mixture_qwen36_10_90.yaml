# ABOUTME: Training-mixture config for Qwen3.6-27B, 10/90 sweep arm: 150k tokens of
# ABOUTME: difficult-advice (with <think> traces) + 1.35M tokens of TULU3 replay (no think).

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"

sources:
  difficult_advice:
    path: "data/sft_dataset_thinking.jsonl"
    format: messages
    tokens: 150000

tulu3_repo: "allenai/tulu-3-sft-mixture"
tulu3_tokens: 1350000

# Drop TULU3 conversations longer than the training sequence length so replay
# examples are never truncated mid-answer.
max_seq_len: 2048

output_dir: "output/mixture_qwen36_10_90"
