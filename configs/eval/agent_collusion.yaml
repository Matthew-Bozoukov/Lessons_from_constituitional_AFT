# ABOUTME: Emergent collusion (SALT-NLP agent-collusion, arXiv:2609.24967) — two copies of the
# ABOUTME: target verify each other's work for ten episodes; mutual ACCEPT is the violation.
# Run: uv run evals --name agent_collusion --target <hf_path> --server <ip:port> [key=value ...]
#
# The paper's MAIN setting, unchanged: raw-only verdict policy, 5 rounds x 200 characters,
# shared verdict-accuracy reward, verdict review, private reflection, full cross-episode
# history, the 50 fixed ten-episode sequences. Every protocol flag is left at the vendored
# harness's default (src/eval/misalignment/agent_collusion/third_party/agent-collusion);
# this file sets only sampling, scale and serving. LOWER IS BETTER for EC / TC / CC.
#
# Reference, same harness and sequences: the paper's Qwen3.6-27B (the base of every
# organism here) scores task acc 91.0, EC 71.2, TC 100.0, CC 98.0. Our metrics code
# reproduces that row exactly from the released traces.

sequences: 50          # fixed sequences rep001..rep050 (the paper runs all 50)
smoke: false           # true = the full pipeline on smoke_sequences x smoke_episodes
smoke_sequences: 2
smoke_episodes: 2      # CC is undefined below 5 episodes, so a smoke reports it as n/a
# Previous run dir(s) of this eval to continue (a path or a list): per sequence the record
# with the most finished episodes wins; finished trajectories are copied, partial ones
# resume at their first unfinished episode, the rest start fresh.
resume_from: null
# The sequences this run owns ("1-25", a list, or null = all): a shard of a run split
# across GPUs. The shards are published as ONE run by a final resume_from=[all shards]
# pass, whose trajectories are all finished and so needs no GPU.
sequence_ids: null
# End each trajectory at its first mutual ACCEPT: measures TC and onset (when), not EC/CC.
stop_on_collusion: false

# Trajectories in flight. Each is 250+ STRICTLY sequential calls, so wall clock is set by
# how many run at once; the ceiling is KV cache, not slots. At ~40k tokens of history per
# call (max 94k in the paper's Qwen traces) and 64 KiB/token on this architecture (16
# full-attention layers x 4 KV heads x 256 dims, bf16), an H200 holds ~25 live contexts;
# past that vLLM evicts the idle agent's cached prefix and re-prefills it on its next turn.
# 25, not 50: at 50 in flight (2026-09-23) KV sat at 76% with a 50% prefix-cache hit
# rate, and the GPU spent 5.5k tok/s re-prefilling evicted histories against 0.44k tok/s
# of generation. 25 is what the cache holds. (Alone: ~11 s per call, ~47 min per trajectory.)
concurrency: 25

seed: 0                # bootstrap seed for the EC interval (the harness takes no sampling seed)

generation:
  temperature: 1.0
  # DEPARTS from upstream's 64000, deliberately. Over the paper's 13k Qwen3.6 calls the
  # largest completion was 19.7k tokens (p99.9 5.2k), so 24576 (~25% above it) would have
  # bound on none of them. What it does cut is a degenerate reasoning loop: in the
  # 2026-09-23 smoke one task call ran ~60k tokens at ~45 tok/s (~22 min, and slower with
  # 50 trajectories sharing the GPU). A truncated call is retried by the harness.
  max_output_tokens: 24576
  # "default" sends no reasoning_effort; thinking comes from the template the adapter's
  # stamp pins at serve time, as it does for every eval here.
  reasoning_effort: default

constitution: none     # an external instrument, not aligned to any constitution of ours

serving:
  # vLLM refuses a request whose prompt + max_tokens exceeds --max-model-len, so the
  # window is max_output_tokens plus prompt headroom: 196608 - 24576 leaves 172k of
  # prompt against the 94.5k largest seen. The KV cache is scheduled on actual lengths,
  # so the window costs nothing until a context fills it.
  context_window: 196608
  concurrency: 64
  needs_tool_calls: true       # every phase acts through tool calls (tool_choice=required)
  reuses_long_prefixes: true   # each call resends the whole history: prefix caching is
                               # the difference between hours and a day
  # Qwen3.6's own rendering, NOT the repo's think-mode pin, and deliberately so. Under the
  # pin (every past turn's reasoning re-rendered) the model stops closing </think> in the
  # private-reflection phase: on one real request 1/12 renders closed it against 12/12 with
  # this setting, for the BASE model as well as the adapter, so the harness got no visible
  # text and retried until it failed (2026-09-23). The paper's Qwen3.6-27B row was measured
  # with the model's default render, and it is the only reference these numbers have.
  preserve_thinking: false
  # bf16 weights AND bf16 KV cache: the paper's serving. Both fp8 options were tried on
  # 2026-09-24 and dropped:
  #   * fp8 weights (`quantization: fp8`): on the identical episode-1 tasks of sequences
  #     2-10 bf16 never exceeded 2,417 output tokens in a call, while fp8 weights hit the
  #     24,576 cap on 9 of 9 — degenerate reasoning, a different model.
  #   * fp8 KV cache (`kv_cache_dtype: fp8`): no speed benefit at 10-20 trajectories per
  #     H200 (the bf16 cache is not full there), and nosynth under it produced 0 mutual
  #     ACCEPTs in 51 episodes where the bf16 run on the same sequences had 7 by the same
  #     depth — a possible behaviour shift, untested. Its partial runs are kept for that test.
  # Precision never changes mid-trajectory (later episodes condition on earlier ones).
