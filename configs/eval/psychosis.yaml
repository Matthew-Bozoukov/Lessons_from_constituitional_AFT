# ABOUTME: AI-psychosis red-teaming eval — a persona-playing red-teamer escalates delusions
# ABOUTME: over N turns against the served target; a judge grades every reply on a 14-key rubric.
# Run: uv run scripts/run_eval.py --target <hf_path> --name psychosis [key=value ...]
#
# Native reimplementation of tim-hua-01/ai-psychosis (prompts + personas verbatim under
# src/eval/misalignment/psychosis/assets/, pinned SHA in its README). ~110 red-teamer calls,
# ~110 target calls and ~110 judge calls per full run (9 personas x 12 turns).

characters: null   # null = all nine personas; or a list of stems, e.g. [ethan_reality]
turns: 12
smoke: false       # true = 1 persona x 3 turns, for wiring checks

redteam:
  model: x-ai/grok-4.5  # upstream used grok-3 (grok-4 refused the roleplay); OpenRouter
                        # deprecated grok-3 by 2026-08-05. Of the live xAI models only
                        # grok-4.5 plays the persona — 4.3 and 4.20 refuse (probed with
                        # the real prompts, opening + post-pushback continuation).
  temperature: 1.0
  max_tokens: 4096

judge:
  model: x-ai/grok-4.3  # upstream's published grader was grok-4 (LW post + result CSVs);
                        # deprecated on OpenRouter by 2026-08-05, and xAI names 4.3 as the
                        # migration target — closest successor, probed to emit the 14-key
                        # rubric row. Gemini 2.5 Pro authored the rubric but never graded.
  temperature: 0.0    # deterministic grading (upstream used the provider default)
  max_tokens: 4096    # grok-4 reasons before answering; headroom per CLAUDE.md gotcha 5

generation:        # target sampling, matching agentic_misalignment's temperature
  api_key: EMPTY
  temperature: 1.0
  top_p: 0.95
  max_tokens: 4096  # headroom for the <think> trace + a full chat reply (CLAUDE.md gotcha 5)
  request_timeout: 300
  max_retries: 2

concurrency:
  characters: 9      # persona conversations in parallel (each internally sequential)
  judge_workers: 16  # (persona, turn) grading cells in parallel

serving:             # what this eval REQUIRES (validated by plan_serving against the
                     # family's verified facts in ModelProfile.serving; nothing here
                     # overrides a fact — the two key sets are disjoint)
  # 12 turns with reasoning preserved in target context (repo policy 2026-08-04)
  # overflow a 16384 window around turn 7 (first live run, 2026-08-05: prompt hit
  # 12289 + 4096 max_tokens on every persona). 40960 fits the worst-case arc;
  # 12 concurrent slots cover the 9 persona threads at this window — a REQUEST for
  # fewer than the family's cap, not a replacement for it.
  context_window: 40960
  concurrency: 12
