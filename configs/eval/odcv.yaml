# ABOUTME: ODCV-Bench framework config: containerized rollouts against the served target
# ABOUTME: (model/base_url/output_root injected by run_eval.py), judged via OpenRouter.
# Run: uv run scripts/run_eval.py --target <hf_path> --name odcv

# `model`, `model_key`, `base_url` and `output_root` are injected per target by
# src/eval/misalignment/odcv/runner.py — the served endpoint rewritten to the docker
# bridge so scenario containers can reach the host's vLLM.

# Which published row to compare against (the paper's table); the base Qwen3.6 row is
# the reference for all fine-tunes of it.
published_key: "qwen3.6-27b"

temperature: 0.7

# Independent rollout passes per cell. One driver invocation = ONE rollout per cell
# (`rollouts_per_cell` in older arm configs is inert), so repeats come from runner.py
# invoking the driver N times sequentially and combining into the rollout_NNN layout
# before judging once. 2 matches the recent arms (2x65); the published 4x70 protocol is
# passes=4. Each pass is audited for the silent empty-transcript failure, resume-retried
# once if dirty, and dropped from judging (kept on disk) if still dirty.
passes: 2

bench_dir: "src/eval/misalignment/odcv/third_party/odcv-bench"

# Decode is memory-bandwidth-bound, so throughput comes from batching; stays under the
# server's max_num_seqs.
concurrency: 8

scenario_timeout_s: 2400
# Token budget on a rollout's transcript, enforced by the executor BEFORE every model call
# with the serving tokenizer (vLLM /tokenize) -- see mission_executor/transcript_budget.py
# (vendored patch, 2026-09-05). Over budget: the newest message is cut to fit, a note is
# archived, and the rollout ends. Sized from the published DA arm (400 rollouts: p99 17.6k,
# max 26.6k tokens as the judge sees them), so it binds only on whole-file dumps -- which
# used to kill the rollout at the serving window (16k) and hand the judge megabytes. Part
# of the protocol: REQUIRED, and the same value on every arm of a comparison.
transcript_token_limit: 28000
prune_images: false

# Two cheap judges (~$3.80 for 80 transcripts); the other two can be added later for
# their incremental cost only.
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
judge_workers: 8

# The progress axis (src/eval/misalignment/odcv/progress_judge.py): a second pass over the
# same transcripts scoring 0-5 for how much the agent actually DID, independent of whether
# what it did was aligned. Reported beside MR, never averaged into it — an arm that refuses
# everything and an arm that works honestly both score MR 0, and only this separates them.
# Doubles the judging spend (~$3.80 -> ~$7.60 per 80 transcripts), so it has a switch.
progress_judge: true
# Defaults to `judges` when unset; listed separately so the two axes can be scored by
# different models without touching the MR side (its judges are the paper's).
progress_judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"

smoke: false

serving:
  # The window this eval runs at (required — see VllmServer._start; part of the eval's
  # scientific record). 16384 = the window the Qwen3.6 sweep was tuned at, previously an
  # implicit family default (moved here 2026-08-05).
  context_window: 16384
  # The ODCV agent acts through tool calls; without the served tool-call parser vLLM
  # returns them as raw text and every scenario reports ok with an EMPTY transcript
  # (docs/GOTCHAS.md / CLAUDE.md gotcha). plan_serving emits
  # --enable-auto-tool-choice --tool-call-parser <ModelProfile.serving.tool_call_parser>
  # (qwen3_xml for Qwen3.6) only when this is set.
  needs_tool_calls: true
  # Every step of a rollout resends the whole conversation, so each step's prompt is the
  # previous one plus one exchange, and the tools+system prefix is shared by all passes of
  # a scenario. With headroom the cache serves that prefix instead of re-prefilling it
  # (docs/LOG.md 2026-08-07: ~3.5x generation throughput on SWE-bench; Qwen3.6 supports
  # it, ModelProfile). Throughput only: outputs are unaffected. Keep `concurrency` such
  # that vLLM's `GPU KV cache usage` stays well under ~50%, or the cache evicts before it
  # is ever reused. Override `serving.reuses_long_prefixes=false` to compare.
  reuses_long_prefixes: true
