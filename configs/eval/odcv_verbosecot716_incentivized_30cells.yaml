# ABOUTME: ODCV-Bench eval of the VERBOSE-CoT arm's seed replicates, incentivized-only,
# ABOUTME: 30 cells -- the SAME cell set the seed-0 verbose arm was scored on.
# Run: uv run evals --target <adapter> [<adapter> ...] --name odcv --server <ssh-alias> --config <this>
#
# CELL SET COPIED, NOT REDERIVED. The seed-0 verbose arm was evaluated with
# configs/eval/odcv_bench_da716_verbose_rows_r64_incentivized_5x30.yaml (published as
# LASR-Callum/2026-08-25-odcv-da716-verbose-rows-eval). Its 50 exclusions leave 30
# incentivized cells and NO mandated cells. Reusing that exclusion list verbatim is what
# makes seeds 42/69 comparable to seed 0; deriving an equivalent-looking set by hand would
# risk an off-by-one that silently breaks the seed comparison.
#
# CONSEQUENCE: this arm has NO mandated number. Do not compare its overall MR to the
# numina/synthdoc/grok arms, which are scored on 60 cells across both variants.
#
# model / model_key / base_url / output_root are deliberately ABSENT: the registered runner
# (src/eval/misalignment/odcv/runner.py) sets them from the ServedTarget, and leaving stale
# copies here would look authoritative while being ignored.
