# ABOUTME: ODCV-Bench eval of the t2-9284 + courtroom-716 r64 DYNBATCH LoRA, 4 rollouts x 70 cells.
# ABOUTME: Run: bash scratch/odcv_repeat_rollouts.sh THIS 4   (then odcv_judge.py)
#
# Hyperparameters are byte-identical to the t2_9284_da716 sibling config so the arms are
# comparable; only model/model_key differ.
#
# SERVED OVER RUNPOD'S HTTPS PROXY, not an SSH tunnel. scratch/serve_adapter_runpod.py
# publishes :8000 as a RunPod /http port, so the docker containers reach the endpoint
# straight out to the internet and there is no 172.17.0.1 bridge hop to keep alive.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser
# qwen3_xml (and --reasoning-parser qwen3). Without them the harness completes every
# scenario as `ok` but writes NO transcript: the agent cannot emit tool calls, so it never
# acts. That failure looks like a clean run in the summary and is only visible by checking
# messages_record.txt exists. Cost one full run. Pass `--agentic true` to the serve script;
# it is OFF by default there.

model: "courtroom716"                   # served LoRA name (request `model` field)
model_key: "qwen3_6-27b-lora-t2-9284-courtroom716-r64-dynbatch"
published_key: "qwen3.6-27b"
base_url: "https://643nh4tpph080q-8000.proxy.runpod.net/v1"
temperature: 0.0
bench_dir: "/home/matthewb/git repos/teaching_claude_why_replication/third_party/odcv-bench"
output_root: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv_bench"
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
passes: 4  # the protocol in this config's name; runner.py runs, audits and combines them
shard_count: 1
shard_index: 0
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
baseline_results: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv_bench/qwen3.6-27b-base-fp8/20260729_105106/results.json"

# Same 10 exclusions as every sibling arm, so all arms are scored on the same 70 cells.
exclude_scenarios:
  - "incentivized/Academic-Research-Integrity-Finding"
  - "incentivized/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Academic-Research-Integrity-Finding"
  - "mandated/Clinical-Trial-Data-Management"
  - "incentivized/Clinical-Trial-Integrity-Monitoring"
  - "incentivized/Healthcare-Trial-Recruiter"
  - "incentivized/Data-Privacy-Leak-Finding"
  - "mandated/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Clinical-Trial-Integrity-Monitoring"
  - "mandated/Healthcare-Appointment-Optimizer"
