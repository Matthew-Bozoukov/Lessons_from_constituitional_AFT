# ABOUTME: ODCV-Bench for the CoT-only arm on the principle-scoped (chunk-only) 702 corpus.
# ABOUTME: Both conditions, ONE pass, 65 cells. Run from LOCAL docker; GPU on RunPod.
# Run: uv run python scratch/odcv_rollout_cli.py --config THIS   (docker LOCAL)
#
# THE ARM. The 702 principle-scoped difficult-advice rows supervised on their REASONING
# ONLY: each row truncated at its `</think>` close, so the visible answer leaves both the
# loss and the forward pass. The 9,284 Table2 rows train as in the control.
# Adapter: LASR-Callum/qwen3.6-27b-lora-t2-9284-chunk-only-702-cotonly-r64 (thinking: true)
# Mixture: LASR-Callum/2026-08-31-cot-only-supervision-chunk-only-702 @ 20bcc2c5
# Trained: 625 steps, train_loss 0.8755; differs from the control in the supervise field only.
#
# THE CONTROL, and this arm has a real one:
# LASR-Callum/2026-08-21-qwen36-lora-table2-9284-difficult-advice-chunk-only-702-rank-64-
# dynbatch -- ODCV 11.5% [6.2, 19.6], severity 0.62, trained on the SAME 9,986-row mixture.
# NOTE it is a TWO-pass number; this run is one pass, so its interval will be wider.
#
# WHAT A RESULT HERE DOES NOT SETTLE. `seq_mean_token_mean_loss` weights each EXAMPLE at
# 1/global_batch, so removing the answer did not reduce these rows' influence -- it
# CONCENTRATED the same weight onto the trace, roughly doubling per-CoT-token gradient
# weight. This arm is "reasoning only, at double density". If it collapses, that is
# consistent with BOTH "the answer carried the effect" and "the reweighting broke it".
# And a seed-only replicate of another arm moved ODCV 6.1 points, so a small gap either
# way is noise.
#
# BOTH CONDITIONS, 65 CELLS. The 15 exclusions below are the STANDARD set every sibling arm
# uses (10 incentivized + 5 mandated), so 80 - 15 = 65 and the cell set is byte-identical to
# the control's and to every other arm in the comparison table.
#
# ONE PASS MEANS ONE ROLLOUT PER CELL. `rollouts_per_cell` is INERT -- nothing in the repo
# reads it, and one invocation of the rollout driver produces exactly one rollout per cell.
#
# PATHS AND base_url ARE FOR A LOCAL DOCKER HOST. `host.docker.internal:8000` is reached
# through an SSH TUNNEL to the serving pod, NOT through RunPod's HTTPS proxy: the proxy
# enforces a 120s read timeout and a long non-streaming rollout dies as a Cloudflare 524
# (docs/LOG.md 2026-08-09). src/infra/runpod.py publishes `22/tcp` for exactly this reason.
model: "chunkonly702cot"
model_key: qwen3_6-27b-lora-t2-9284-chunk-only-702-cotonly-r64
published_key: qwen3.6-27b
base_url: "http://host.docker.internal:8000/v1"
temperature: 0.0
bench_dir: src/eval/misalignment/odcv/third_party/odcv-bench
output_root: output/odcv_bench
# 12, the same as the rented-box siblings. MEASURED, not assumed: Docker Desktop here has
# 20 CPUs and 17.6 GB allocated (host i7-14650HX, 16c/24t, 31.7 GB), which is at least what
# the vast boxes had -- and ODCV containers are blocked on the model endpoint, not CPU-bound,
# so 12 concurrent scenarios (24 containers) is not CPU-limited here. The real single-host
# constraint is Docker's compose-network ADDRESS POOL, which a 65-cell pass exhausts if unused
# networks are not pruned (commit 3c90736). scratch/odcv_box_run.py prunes between passes; a
# single pass driven straight from odcv_rollout_cli does not, so prune before running.
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
rollouts_per_cell: 1          # inert; see the header. One invocation = one rollout per cell.
expected_cells: 65
shard_count: 1
shard_index: 0
judges:
  grok-4.20: x-ai/grok-4.20
  gemini-3.1-pro-preview: google/gemini-3.1-pro-preview
exclude_scenarios:
- incentivized/Academic-Research-Integrity-Finding
- incentivized/Ai-Moderator-Content-Censorship-Backdoor
- incentivized/Clinical-Trial-Integrity-Monitoring
- incentivized/Data-Privacy-Leak-Finding
- incentivized/Healthcare-Trial-Recruiter
- incentivized/Marketing-Campaign
- incentivized/Propaganda-Engine-Finding
- incentivized/Roboadvisor-Ethicsbypass
- incentivized/Supply-Chain-Sabotage-Finding
- incentivized/University-Research-Grant-Approval
- mandated/Academic-Research-Integrity-Finding
- mandated/Ai-Moderator-Content-Censorship-Backdoor
- mandated/Clinical-Trial-Data-Management
- mandated/Clinical-Trial-Integrity-Monitoring
- mandated/Healthcare-Appointment-Optimizer
