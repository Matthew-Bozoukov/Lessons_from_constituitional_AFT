# ABOUTME: Active Arena-Hard protocol: explicit comparison arms, fixed slices and judge checks.
# ABOUTME: Historical July ladders remain in git history; this config does not launch them.
# Run: uv run evals --target <model-or-prior-arm> --name arena_hard --reference <model-or-prior-arm>

# This measures answer preference against the chosen reference. Use matched controls
# for training-effect comparisons, or one common reference for cross-family rankings.
seed: 0
base_model: "Qwen/Qwen3.6-27B"

# run_eval registers the requested reference and targets. No implicit historical arm
# or automatic choice of an old July baseline participates in a new comparison.
reference_model: null
arms: []
baseline_arm: null
arm_defaults:
  n_hard_prompt: 500
  n_creative_writing: 250

bench_name: "arena-hard-v2.0"
vendor_dir: "src/eval/capabilities/arena_hard/third_party/arena-hard-auto"
slices:
  hard_prompt: {n: 500, role: primary}
  creative_writing: {n: 250, role: secondary}

# Fixed sample size: the pooled workflow judges these slices without automatic
# staged sampling or optional stopping. Smoke uses at most four per category.
generation:
  endpoint: "http://localhost:8000/v1"
  api_key: "EMPTY"
  temperature: 0.0
  top_p: 1.0
  # Approved 2026-09-30 after the matched budget study: reasoning + final share
  # 12,000 tokens. Regenerate both comparison arms; old 6k answers are not matched.
  # Per-request headroom can lower this; retain actual budgets and all truncations.
  max_tokens: 12000
  parallel: 32
  enable_thinking: true
  strip_think_for_judging: true
  raw_sample_dump: 10

# GPT-4.1 is the explicitly selected primary judge. Its complete paired judgments
# define the preference score; this model choice does not establish unbiasedness.
# Judge identity/settings are part of the recorded comparison protocol.
judge:
  model: "openai/gpt-4.1"
  api_base: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.0
  max_tokens: 16000
  parallel: 32
  max_attempts: 3
  extra_body: {}

# Gemini independently judges 100 hard prompts as a diagnostic comparison. Its
# disagreement or incomplete coverage is reported but does not block a complete
# primary score. Agreement thresholds do not certify scientific calibration.
# Smoke uses at most four prompts. The historical blocking behavior remains
# available only through an explicit policy=gate override.
judge_validation:
  enabled: true
  policy: diagnostic
  reference_judge: "google/gemini-3-flash-preview"
  extra_body:
    reasoning: {effort: "low"}
  n_questions: 100
  slice: hard_prompt
  comparison_arm: null # first actual target unless explicitly selected
  thresholds:
    verdict_agreement_min: 0.80
    win_rate_gap_max_pp: 3.0

statistics:
  bootstrap_rounds: 2000
  paired: true
  alpha: 0.05
  tie_score: 0.5
  # Preserve the historical length/Markdown-controlled scorer, with raw preference
  # scores alongside. Both answer positions belong to the same prompt cluster.
  control_features: ["length", "markdown"]

thresholds:
  relative:
    # Primary gate is hard_prompt vs the explicitly selected reference. Creative
    # writing stays secondary; smoke never asserts a capability pass/fail verdict.
    win_rate_ci_lower_min: 0.45
    primary_slice: hard_prompt
    secondary_slice: creative_writing

# Descriptive instrumentation only. Refusal/repetition regexes are indicators to
# inspect, not adjudicated behavioral outcomes or new automatic exclusion gates.
degeneracy:
  length_distribution_percentiles: [5, 25, 50, 75, 95]
style_drift:
  corpus_patterns:
    bluf: '(?i)^\s*(bottom line|in short|short answer|tl;?dr)\b'
    validation_buffer: '(?i)\b(that sounds|i can see why|it.s understandable|that must be)\b'
    hedging: '(?i)\b(it depends|there.s no single|reasonable people)\b'

output_dir: "output/arena_hard"
serving:
  context_window: 16384
