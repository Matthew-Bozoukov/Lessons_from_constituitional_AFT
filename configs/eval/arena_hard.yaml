# ABOUTME: Single source of truth for the Arena-Hard capability-regression eval (spec v2): arms,
# ABOUTME: judge pinning, slices, staged sampling, decoding parity, and pass thresholds.
# Run: uv run scripts/run_eval.py --target <hf_path> --name arena_hard --reference <answers>  (default CONFIG)

# This is the guardrail underneath the alignment result, not an alignment eval itself.
# It answers one question: does mixing synthetic constitution documents into the SFT
# mixture cost us general capability? The expected answer is "no" — we SFT from a base
# checkpoint with Tulu as the bulk of every mixture, which is the from-scratch
# post-training regime rather than the continued-finetuning-on-a-post-trained-model
# regime where GDM saw collapse. Flat lines are the prediction, which is exactly why
# arm E (the canary) is in: four flat lines with no demonstrated sensitivity is a weak
# result, and the canary is what proves the instrument can detect degradation at all.

seed: 0

# --- Base model -------------------------------------------------------------------
# Spec §12 decision 1, resolved. The spec's "Qwen 27B" does not map to a released
# checkpoint; the base under every adapter we have on HuggingFace is Qwen3.6-27B.
# Recorded here because the writeup needs it and reviewers will ask about applying a
# Tulu 3 mixture (developed on Llama 3.1) to a Qwen base.
base_model: "Qwen/Qwen3.6-27B"

# Qwen3.6-27B is a hybrid stack: q/k/v/o_proj exist in only 16 of 64 layers, so the
# shared LoRA recipe tunes MLP everywhere but attention in a quarter of the stack. Fine
# for this eval because every arm shares it, but it belongs in the methods section.

# --- Arms -------------------------------------------------------------------------
# Every arm SFTs from `base_model` under identical hyperparameters (see
# configs/train/qwen36_tulu_100.yaml); mixture ratio is the only varying factor. That is
# spec §12 decision 5 and it is load-bearing — any other difference between arms makes
# the comparison uninterpretable.
#
# `adapter: null` means the checkpoint does not exist yet. Scripts fail fast rather
# than silently skipping, so a half-trained ladder cannot masquerade as a full result.
# Per-arm prompt counts for an arm that is NOT in the static ladder below: every CLI
# --target is one, and the judge reads `n_hard_prompt` off the arm it is judging, so
# without these an appended arm dies with `Missing key n_hard_prompt`.
arm_defaults:
  n_hard_prompt: 500
  n_creative_writing: 250

# The baseline, as an HF path: a MODEL (generate its answers) or a PRIOR arena_hard RUN
# (reuse them). run_eval runs it first as an ordinary arm — it is not a special kind of
# thing — and `--reference` on the CLI overrides this.
reference_model: null

arms:
  - name: arm_base
    synthetic_fraction: null      # no SFT at all
    adapter: null                 # served as the bare base model
    role: floor
    # Spec §5: not a regression comparison. The base model is not instruction-tuned, so
    # under a chat template it continues the prompt rather than answering it and its win
    # rate against any SFT arm is near zero. 150 prompts is plenty to confirm the SFT
    # ran and the serving path works.
    n_hard_prompt: 150
    n_creative_writing: 0

  # NOT USABLE AS THE BASELINE — read this before changing `baseline_arm` back to it.
  # This adapter is structurally identical to B/C/D (512 tensors, 159.4M params, same
  # `model.language_model.*` coverage) but its TRAINING RECIPE is not:
  #
  #                    arm A            arms B/C/D
  #   epochs           2 (92 steps)     1 (124-142 steps)
  #   batch x accum    4 x 4            1 x 16
  #   packing          true             off
  #   tokens seen      3.0M             ~1.49M
  #
  # So arm A saw twice the gradient exposure with packing on, and B/C/D turned packing
  # off precisely because TRL only guarantees packed-sequence isolation under Flash
  # Attention. Judging B/C/D against A would confound synthetic fraction with
  # epochs-and-packing — exactly what §12 decision 5 and footgun §10.7 forbid, and the
  # result would look clean while meaning nothing.
  #
  # To restore the true zero-synthetic anchor, retrain this arm at 1 epoch / packing off
  # / batch 1x16 / ~1.49M tokens, then point `baseline_arm` back at it.
  - name: arm_a_synth00
    synthetic_fraction: 0.0
    adapter: "LASR-Callum/2026-07-30-qwen36-tulu-100-pct-lora"
    role: unmatched_control
    n_hard_prompt: 500
    n_creative_writing: 250

  # B/C/D are matched to each other: same recipe, ~1.49M tokens, 1 epoch, packing off,
  # so across these three the mixture ratio IS the only varying factor. That makes B a
  # valid — if not ideal — reference: it gives the dose-response shape (does the effect
  # scale, plateau, or tip into over-refusal) without a 0%-synthetic anchor.
  - name: arm_b_synth10
    synthetic_fraction: 0.1
    adapter: "LASR-Callum/2026-07-29-qwen36-difficult-advice-tulu-lora-10-90"
    role: baseline                # reference for this run (see arm_a note above)
    n_hard_prompt: 500
    n_creative_writing: 250

  - name: arm_c_synth20
    synthetic_fraction: 0.2
    adapter: "LASR-Callum/2026-07-28-qwen36-difficult-advice-tulu-lora-20-80"
    role: curve
    n_hard_prompt: 500
    n_creative_writing: 250

  - name: arm_d_synth40
    synthetic_fraction: 0.4
    adapter: "LASR-Callum/2026-07-29-qwen36-difficult-advice-tulu-lora-40-60"
    role: extreme                 # most extreme arm that keeps the GDM mitigation
    n_hard_prompt: 500
    n_creative_writing: 250

  # Spec §7, decision 4, resolved: canary IN. This is the only arm where the mitigation
  # GDM identified (mixing in baseline SFT data) is removed entirely. It is where they
  # saw collapse, where the coverage problem bites hardest — many user requests are
  # simply not opportunities to exhibit a trait, so they are absent from trait data —
  # and it is the arm most likely to move. Cost is one training run plus ~$3 of judging.
  - name: arm_e_synth100
    synthetic_fraction: 1.0
    adapter: null
    role: canary
    n_hard_prompt: 500
    n_creative_writing: 250

# Reference for this run is arm B, not arm A — see the arm_a_synth00 note above. Every
# win rate in the report is therefore "vs arm B (10/90)", so 50% means "no different from
# the low-dose arm", NOT "no different from zero synthetic data". Say so when reporting.
baseline_arm: arm_b_synth10

# --- Benchmark ---------------------------------------------------------------------
bench_name: "arena-hard-v2.0"
vendor_dir: "src/eval/capabilities/arena_hard/third_party/arena-hard-auto"

# The two categories are reported SEPARATELY, never pooled (spec §9). The primary
# capability number is therefore n=500, not n=750.
slices:
  hard_prompt: {n: 500, role: primary}
  creative_writing: {n: 250, role: secondary}

# Spec §9 staged sampling. Judgment caching keys on uid, so each stage re-reads the
# previous stage from disk and pays only for new questions — 150 -> 300 -> 500 costs
# the same as going straight to 500, and gives a read within the first hour.
#
# CAVEAT TO DISCLOSE IN THE WRITEUP: extend-if-inconclusive is optional stopping and
# inflates type-I error. This is acceptable for a non-inferiority guardrail *provided
# it is stated*. `alpha` below is deliberately conservative to absorb the repeated
# looks; do not present a sequentially-stopped interval as a fixed-n interval.
staging:
  hard_prompt: [150, 300, 500]
  creative_writing: [250]
  stop_when_ci_excludes_threshold: true

# --- Candidate generation ----------------------------------------------------------
# Spec §4 deviation 3 and footgun §10.8: decoding parity. Identical config across all
# arms, temperature 0, one sample. Any asymmetry invalidates the comparison, and at
# temperature > 0 the variance includes sampling noise that would need multiple samples
# per prompt to average out.
generation:
  endpoint: "http://localhost:8000/v1"    # vLLM, OpenAI-compatible (spec §12 decision 3)
  api_key: "EMPTY"
  temperature: 0.0
  top_p: 1.0
  # 6000, bounded by the server's 20480-token... in practice 8192 max-model-len. This is a
  # THINKING model: the <think> trace is generated inside this budget, so 4096 left hard
  # reasoning prompts with the whole budget consumed by the trace and NO visible answer
  # (finish_reason=length, empty content). An empty answer loses every pairwise comparison
  # for purely mechanical reasons — footgun §10.2 — so truncation rate is reported next to
  # every win rate and must be read before the win rate is believed.
  max_tokens: 6000
  # 48, not 16: with --enforce-eager (no CUDA graphs) decode is slow per request, and at
  # 16 concurrent the H100's KV cache sat ~35% used while throughput stalled near
  # 150 tok/s. Concurrency is a pure throughput knob here — every request is independent
  # at temperature 0 — so it cannot affect the decoding parity the comparison depends on,
  # as long as every arm uses the same value. Which they do: it is read from this field.
  parallel: 32
  # Qwen3 emits a <think> block. Judge the user-visible answer only, but keep the trace
  # so CLAUDE.md gotcha 2 (empty-<think> collapse) stays checkable per arm.
  enable_thinking: true
  strip_think_for_judging: true
  # Footgun §10.1: dump this many raw generations per arm for eyeball inspection before
  # anything is judged. A chat-template mismatch reads as catastrophic capability loss.
  raw_sample_dump: 10

# --- Judge --------------------------------------------------------------------------
# Spec §12 decision 2, resolved: the difficult-advice/constitution corpus is generated
# with CLAUDE (Sonnet 4.5 via OpenRouter), so a Gemini judge carries NO self-preference
# confound. Gemini is clean here and is ~5x cheaper than a Sonnet-class judge.
judge:
  # Pinned exactly (spec §4 requirement 3). $0.50/$3.00 per Mtok, which is precisely the
  # price the spec's §11 cost model assumes.
  model: "google/gemini-3-flash-preview"
  # BATCH MODE IS DELIBERATELY NOT USED, contra spec §4 requirement 2. OpenRouter does
  # expose `:batch` variants at exactly 50% off, but they are reachable only through an
  # async `/api/beta/batches` submit-and-poll API — a 404 on the synchronous chat
  # endpoint that arena-hard-auto's threaded architecture is built around. Wiring that up
  # means a file-based submission client, a polling loop and result reassembly, all to
  # save roughly $15 on a sweep the spec itself calls "the price of a team lunch". The
  # spec's own §11 conclusion — nothing here is cost-constrained — settles the trade.
  # To revisit: append `:batch` here and implement the batches client.
  # WARNING: a `-preview` endpoint is exactly the deprecation risk §4.3 and §10 flag.
  # If this ID disappears, results before and after the switch are NOT comparable.
  # `google/gemini-3.6-flash` is the nearest stable successor at 3x the price.
  api_base: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.0
  max_tokens: 16000
  parallel: 32
  # Spec §4 requirement 1 and footgun §10.3. Gemini 3.x Flash bills reasoning tokens as
  # output; at a high thinking budget the bill runs 3-5x the §11 estimate and Flash
  # stops being cheaper than Sonnet. We do not need hidden thinking — the arena-hard
  # rubric already forces explicit reasoning into the visible response.
  extra_body:
    reasoning: {effort: "low"}

# Spec §4 judge validation. Deliberately NOT Sonnet: Claude generated our corpus, so a
# Claude validator would import the very generator-family confound we avoided by picking
# Gemini. GPT-4.1 is a third family AND arena-hard-auto's own primary validated judge,
# which makes it the stronger reference on both counts.
judge_validation:
  enabled: true
  reference_judge: "openai/gpt-4.1"
  n_questions: 100
  slice: hard_prompt
  # Run on the most extreme mitigation-preserving arm, where real signal is most likely.
  comparison_arm: arm_d_synth40
  thresholds:
    verdict_agreement_min: 0.80
    win_rate_gap_max_pp: 3.0
  # If validation fails, fall back to this for the full sweep (~$55 on batch). Still not
  # a meaningful budget item.
  fallback_judge: "openai/gpt-4.1"

# --- Statistics ---------------------------------------------------------------------
statistics:
  # Spec §9: all arms see identical prompts, so pair the bootstrap over PROMPTS. The
  # vendored show_result.py resamples battles instead, which is unpaired and throws away
  # power we get for free.
  bootstrap_rounds: 2000
  paired: true
  alpha: 0.05
  # Ties score 0.5 for the headline number, but the three-way split is always reported:
  # a model that converts both wins and losses into ties has changed behaviour even at
  # exactly 50%.
  tie_score: 0.5
  # Style control (spec §6): post-hoc BT regression removing the contribution of length
  # and markdown structure from the win rate. Controlled is PRIMARY, uncontrolled is
  # reported alongside — the gap between them is itself a finding about our corpus.
  control_features: ["length", "markdown"]

# --- Pass thresholds — fix these BEFORE looking at any results (spec §3) ------------
thresholds:
  relative:
    # Primary gate: style-controlled win rate vs arm A on hard_prompt.
    win_rate_ci_lower_min: 0.45
    primary_slice: hard_prompt
    secondary_slice: creative_writing
  # Absolute-benchmark gates are DEFERRED (see `absolute_benchmarks` below). Until they
  # run, the relative family is the only gate, and it cannot detect both arms degrading
  # together — state that limitation in the writeup rather than implying full coverage.
  # Spec §5: if the base arm scores materially above this against arm A, that is not an
  # interesting result — it is evidence the Tulu SFT or the chat template is broken.
  base_arm_max_win_rate: 0.10

# Escalation (spec §3): a breach blocks claiming the alignment result FOR THAT ARM. It
# is not grounds for quietly dropping the arm from the writeup. If 60/40 regresses, that
# is the finding — it locates the ceiling on usable mixture ratio.

# --- Absolute benchmarks (spec §8) — DEFERRED ----------------------------------------
# Scoped out of this build by decision, to be picked up separately. Left here as a
# record of what §8 asks for, because the spec is explicit that BOTH families are
# required and a relative-only result has a known blind spot: pairwise preference cannot
# detect both arms degrading together, and it rewards style over substance.
#
# When this is picked up, the pattern already exists in scripts/eval/run_mmlu_inspect.sh — inspect_evals
# against the tunnelled vLLM endpoint — and CLAUDE.md gotcha 6 applies: on a thinking model
# the default cot=False caps generation at 16 tokens, truncates the <think> block and
# reports a false 0%.
#
#   ifeval          must    highest-value single check: the clarification-overgeneralisation
#                           failure mode is exactly an IFEval regression, and a preference
#                           judge may find excessive clarification-seeking charming
#   mmlu_pro/gpqa   must    knowledge retention
#   gsm8k           should  reasoning retention
#   humaneval+      should  coding proxy
#   swe-bench       defer   needs a container harness; the one genuinely expensive line
absolute_benchmarks: {}

# Degeneracy counters (spec §8, must-have). No external benchmark — pure instrumentation
# over generations we are already producing. Behavioural collapse surfaces here first
# and cheapest.
degeneracy:
  # An increase in refusals is AMBIGUOUS, not automatically bad: some of it may be the
  # traits working as intended. Disambiguate by measuring refusal separately on benign
  # prompts (any increase is a regression) and on the safety evals (an increase may be
  # the desired result). GDM hit this exact confound and had to disentangle "refuses to
  # execute harmful tool calls" from "training destroyed its ability to call tools".
  refusal_on_benign: true
  repetition: true
  truncation: true
  mean_output_length: true
  # Footgun §10.2: check the SHAPE of the length distribution, not just the mean — a
  # damaged EOS produces truncated or run-on generations that tank win rate for
  # mechanical reasons unrelated to capability.
  length_distribution_percentiles: [5, 25, 50, 75, 95]

# --- Style drift (spec §6) ----------------------------------------------------------
# Logged per checkpoint INDEPENDENTLY of style control. Style control gives the win rate
# net of style; these tell us how much style drift there was to control for, which is a
# fact about our data pipeline we want regardless. Expect drift to grow monotonically
# with synthetic fraction — if it does, that is a clean supporting result.
style_drift:
  metrics: ["token_len", "header_count", "list_count", "bold_count"]
  # GDM measured their corpus and found two patterns above 20% frequency: BLUF openings
  # (52%) and emotional-validation buffering (26%). Ours will have its own. This eval is
  # a BACKSTOP, not a substitute for corpus-level pattern detection before training.
  corpus_patterns:
    bluf: '(?i)^\s*(bottom line|in short|short answer|tl;?dr)\b'
    validation_buffer: '(?i)\b(that sounds|i can see why|it.s understandable|that must be)\b'
    hedging: '(?i)\b(it depends|there.s no single|reasonable people)\b'

output_dir: "output/arena_hard"

serving:
  # The window this eval runs at (required — see VllmServer._start; part of the eval's
  # scientific record). 16384 = the window the Qwen3.6 sweep was tuned at, previously an
  # implicit family default (moved here 2026-08-05).
  context_window: 16384
