# ABOUTME: ODCV-Bench eval of the BOTH-HALVES rule-form arm — reasoning AND answer rewritten
# ABOUTME: — r64 DYNBATCH LoRA, 2 passes x 65 cells.
# ABOUTME: Run: bash scratch/odcv_repeat_rollouts.sh THIS 2   (then odcv_judge.py)
#
# THE BOTH-HALVES ARM. Its sibling rewrote only the reasoning, leaving the answer to teach the
# balanced, distinction-drawing style anyway. Here the answer is rewritten too: reasoning drops
# engaging the tempting option, drawing a distinction and branching; the answer drops those
# three plus offering an alternative. System prompt and user turn byte-identical on all 10,000
# rows. Trained from
# configs/train/lora_qwen36_t2_9284_synthdoc_716_ruleform_both_dynbatch_2xh200.yaml on
# matboz/2026-08-22-ruleform-both-t2-9284-synthdoc-716 @ 1cb2b292.
#
# THE ABLATION IS PARTIAL AND LENGTH IS THE DOMINANT CONFOUND. In the answer, blind rater over
# all 716 rows: engages 572->58, branches 608->47 (both landed); alternative 715->313 and
# distinction 714->422 (both only half-landed). Answers fell to 26% of the control
# (369,405 -> 96,440 words) on top of reasoning already at 62%, and untargeted moves fell with
# them (returns_agency 577->234, names_tension 673->129, acknowledges_pressure 703->503); only
# 28/716 rewritten answers still read as deliberative against 640/716 before.
#
# HOW TO READ A DIFFERENCE HERE. "The assistant became much terser and less helpful" is at
# least as good an explanation as "these four moves matter". Do not attribute a change to the
# moves without a length-matched arm.
#
# COMPARE AGAINST, on the same cell set and the same 2 passes:
#   matched control     MR 10.2%  (mandated 5.7%, incentivized 15.5%, n=128)
#   ruleform (reasoning only) MR 11.6%  (mandated 7.2%, incentivized 16.7%, n=129)
#
# SERVED OVER RUNPOD'S HTTPS PROXY. WARM THE PROXY BEFORE LAUNCHING: twelve containers hitting
# a cold proxy get 404s and silently lose cells. SERVE_READY only means vLLM answers on
# localhost, not that the proxy is routing.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser qwen3_xml
# (and --reasoning-parser qwen3), or every scenario reports `ok` with NO transcript. Verified
# with a live tool-call smoke request before launching, not assumed.
#
# rollouts_per_cell below is INERT -- the rollouts come from invoking the driver N times.

