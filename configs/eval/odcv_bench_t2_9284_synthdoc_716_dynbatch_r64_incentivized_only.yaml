# ABOUTME: 2 rollouts per cell to 5, narrowing its interval from ~17pp to ~11pp.
# Run: bash scratch/odcv_repeat_rollouts.sh THIS 3   (then odcv_combine_passes.py, odcv_judge_run.py)
#
# WHY. The control's incentivized rate is 15.5% on 58 rollouts across 30 cells, CI [5.1, 28.8]
# -- nearly 24 points wide, so it overlaps almost every arm in the series and settles nothing.
# scratch/ci_width_projection.py puts 5 rollouts/cell at ~10.7pp and 7 at ~9.0pp; the curve
# flattens hard after 5, so 90 new rollouts is the efficient stopping point.
#
# Measured ICC across scenarios is ~0.000 -- rollouts behave independently here, so width
# scales as sqrt(n) and depth per cell buys full value. That estimate comes from only 2
# rollouts per cell, the weakest design for separating between- from within-scenario
# variance; a true ICC of 0.05-0.1 would widen these projections by a few points.
#
# COMBINING: the resulting run has UNEVEN depth by condition -- incentivized 5 rollouts per
# cell, mandated still 2. Report the conditions SEPARATELY. A pooled MR from the merged set is
# not comparable to a balanced 2x65 sibling.
#
# The standard 15 exclusions are preserved, so the incentivized CELL SET is byte-identical to
# every other arm's.
#
# All mandated scenarios are excluded below on top of those 15.
#
