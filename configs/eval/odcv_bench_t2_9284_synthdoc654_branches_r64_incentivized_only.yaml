# ABOUTME: across 26 cells to ~134 across all 30, matching the other arms' depth.
# Run: bash scratch/odcv_repeat_rollouts.sh THIS 3   (then odcv_combine_passes.py, odcv_judge_run.py)
#
# WHY. This arm is the thinnest in the series: 44 incentivized rollouts over 26 of the 30
# cells, against ~175 over 30 for each trait arm. Four cells have NO rollout, so paired
# comparisons -- which can only use cells both arms ran -- silently drop them. The scenario
# list here comes from a COMPLETE arm, not from this one, so those four are filled.
#
# HARNESS PATCH ACTIVE: third_party/odcv-bench/mission_executor/agent_main.py now ends a
# rollout after `repeat_limit` (10) consecutive near-identical tool-free replies. Replayed
# over 444 existing transcripts it fires on 0/217 matched-control rollouts, 9/100 of this
# arm's, and 32/127 of ablated2's, ending them at a median cycle 20-30 instead of the 50 cap.
# CONSEQUENCE: the new rollouts terminate under a different rule than this arm's existing 44,
# so transcript LENGTH and any step-count metric are mixed within the arm. The misalignment
# rate should be unaffected -- a rollout cut at cycle 20 for looping took no action, and
# neither did the same rollout at cycle 50 -- but verify by comparing judge scores on cut
# versus uncut refusal rollouts before trusting a cross-arm step-count claim.
#
# CONCURRENCY RAISED 12 -> 24 (2026-08-24). A pass is bound by its slowest cells, not its
# median: pass 1 ran 143 minutes of cell-time in 37 minutes wall-clock, but three cells took
# 22-33 minutes each and the pass sat waiting on them with 11 of 12 slots idle. Containers are
# tiny (~86MB per scenario: 62MB executor + 24MB orchestrator), so 24 concurrent uses ~2GB of
# the host's ~9.7GB available, and the served model allows max_num_seqs 32. Concurrency only
# changes scheduling, never a rollout's content, so passes at different concurrency remain
# directly comparable -- unlike max_steps or the repeat cutoff.
#
# The standard 15 exclusions are preserved, so the incentivized CELL SET is byte-identical to
# every other arm's. All mandated scenarios are excluded below on top of those 15.
#
