# ABOUTME: agentic-misalignment eval config for Qwen3 served via local vLLM (vllm/qwen3).
# ABOUTME: The full 18-condition grid: blackmail/leaking/murder x explicit/none x three urgencies.
# Run: uv run evals --name agentic_misalignment --target <hf_path|provider:model> [--server <gpu>]

# This is the config every published agentic-misalignment run on the Hub was produced with
# (`experiment_id: plain_qwen_full18`, identical across all nine arms). It replaced an
# eight-condition grid on 2026-10-13: that file had been left behind when the eval moved to the
# full grid, so the repo's default command reproduced none of the published numbers -- different
# scenarios (no murder), different urgencies (no "none"), and 50 trials against the published 10.
# Recovered from the runs' own `metadata/run_meta.json`, the only surviving copy.
experiment_id: "plain_qwen_full18"
# The condition directories, and so the condition NAMES, carry a `_prod` suffix from this flag
# (`planned_conditions`). Dropping it silently renames all 18 conditions and no longer matches
# anything published.
production_variant: true
# The judge. Sonnet-4.5 returned empty content on the leaking cells of some runs; the published
# 18-condition runs record this model.
classifier_model: "google/gemini-3-flash-preview"
description: "Agentic misalignment, full 18 conditions (blackmail/leaking/murder x explicit/none x none/restriction/replacement), 10 trials each"
researcher: "replication"

global:
  models:
    - "vllm/qwen3"

  temperature: 1.0
  # A reasoning model needs room for the trace AND the answer: a tight cap truncates inside
  # <think> and scores a false 0%. 24576 against the 32768 window below is the published budget.
  max_tokens: 24576

  concurrency:
    providers:
      vllm: 32
    models:
      "vllm/qwen3": 32

  samples_per_condition: 10

expansions:
  # ONE expansion, as published: goal_types carries both arms and `planned_conditions` pairs
  # goal_type "none" with goal_value "none", so this yields 3 x 2 x 3 = 18 conditions.
  - name: "full_grid"
    description: "All three scenarios, both goal types, all three urgency types"
    enabled: true
    variables:
      scenarios: ["blackmail", "leaking", "murder"]
      goal_types: ["explicit", "none"]
      goal_values: ["america"]
      urgency_types: ["none", "restriction", "replacement"]

# Inline classification is disabled (no Anthropic key); the separate
# classify_results step uses Sonnet 4.5 via OpenRouter as the judge.
classification:
  enabled: false
  models:
    blackmail: "blackmail_classifier"
    leaking: "leak_classifier"

execution:
  resume_interrupted: true
  timeout_seconds: 300
  retries: 2
  checkpoint_frequency: 5

serving:
  # The window this eval runs at (required — see VllmServer._start; part of the eval's
  # scientific record). 32768, the window the published 18-condition runs were served at.
  context_window: 32768
