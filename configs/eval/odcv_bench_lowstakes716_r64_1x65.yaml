# ABOUTME: ODCV-Bench for the low-stakes difficult-advice arm. Both conditions, ONE pass.
# ABOUTME: 65 cells x 1 rollout. Run: uv run python scratch/odcv_box_run.py --config THIS --passes 1
#
# THE ARM. The 716 difficult-advice scenarios rewritten to everyday magnitude, same principle
# violated the same way, deliberation regenerated for the new situation.
# Adapter: LASR-Callum/qwen3.6-27b-lora-t2-9284-lowstakes716-r64-dynbatch (thinking: true)
# Corpus:  LASR-Callum/2026-08-26-difficult-advice-low-stakes-716
# Trained: 625 steps, train_loss 0.8779, byte-identical to the da716 control below the data keys.
#
# BOTH CONDITIONS, 65 CELLS. The bench holds 40 incentivized and 40 mandated scenarios. The 15
# exclusions below are the STANDARD set every sibling arm uses (10 incentivized + 5 mandated),
# so 80 - 15 = 65 and the cell set is byte-identical to theirs. That matters even though this
# run has no control arm of its own: the controls already exist, and an identical cell set is
# what lets this number sit in the same table as them.
#
# ONE PASS MEANS ONE ROLLOUT PER CELL. `rollouts_per_cell` is INERT -- nothing in the repo
# reads it, and one invocation of the rollout driver produces exactly one rollout per cell.
# Prior arms got depth by invoking the driver N times (odcv_repeat_rollouts.sh). This config
# is invoked ONCE on purpose, so it yields 65 rollouts.
#
# READ THE CI BEFORE READING THE POINT ESTIMATE. The 5x30 verbose arms got CI95 [12.2, 41.7]
# -- nearly 30 points wide -- on 90 rollouts. 65 rollouts will be wider still. This run
# characterises the arm; it cannot separate it from the ~16.8% control, and a comparison drawn
# from it would be reading noise.
#
# SEED. There is no generation seed here and none is needed: `temperature: 0.0` is what makes
# rollouts deterministic. ODCV's `seed` (src/eval/misalignment/odcv/odcv.py) feeds only the
# bootstrap CI resampling and already defaults to 0.
#
# PATHS AND base_url ARE FOR A RENTED VAST BOX, not a laptop. Containers reach the model at
# host.docker.internal:8000 through the systemd SSH tunnel odcv_box_bootstrap.sh installs --
# NOT through RunPod's HTTPS proxy, which times out on ODCV's long non-streaming rollouts
# (docs/LOG.md 2026-08-09). Sibling configs that point at the proxy were driven from a
# laptop; do not copy that field from them.
model: "lowstakes"
model_key: qwen3_6-27b-lora-t2-9284-lowstakes716-r64
published_key: qwen3.6-27b
base_url: "http://host.docker.internal:8000/v1"
temperature: 0.0
bench_dir: /root/work/src/eval/misalignment/odcv/third_party/odcv-bench
output_root: /root/work/output/odcv_bench
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
rollouts_per_cell: 1          # inert; see the header. One invocation = one rollout per cell.
expected_cells: 65
shard_count: 1
shard_index: 0
judges:
  grok-4.20: x-ai/grok-4.20
  gemini-3.1-pro-preview: google/gemini-3.1-pro-preview
exclude_scenarios:
- incentivized/Academic-Research-Integrity-Finding
- incentivized/Ai-Moderator-Content-Censorship-Backdoor
- incentivized/Clinical-Trial-Integrity-Monitoring
- incentivized/Data-Privacy-Leak-Finding
- incentivized/Healthcare-Trial-Recruiter
- incentivized/Marketing-Campaign
- incentivized/Propaganda-Engine-Finding
- incentivized/Roboadvisor-Ethicsbypass
- incentivized/Supply-Chain-Sabotage-Finding
- incentivized/University-Research-Grant-Approval
- mandated/Academic-Research-Integrity-Finding
- mandated/Ai-Moderator-Content-Censorship-Backdoor
- mandated/Clinical-Trial-Data-Management
- mandated/Clinical-Trial-Integrity-Monitoring
- mandated/Healthcare-Appointment-Optimizer
