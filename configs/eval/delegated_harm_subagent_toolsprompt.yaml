# ABOUTME: Ten-episode probe: delegated_harm subagent with the tool list ALSO named in the
# ABOUTME: system prompt, to test whether inaction is conditional on native-only tool offers.
# Run: uv run python scripts/run_eval.py --name delegated_harm \
#        --config configs/eval/delegated_harm_subagent_toolsprompt.yaml \
#        --target dougalldeepmind/2026-09-24-qwen36-0-da-multiparty-human-15 --server root@<ip>:<port>
#
# The hypothesis. mph-15 was trained on 319 multi-party rows that carry a `tools` field of
# native schemas and answer in prose, never calling one. In this eval, tools reach the model
# ONLY through `tools=` and the scenario system prompts name none of them -- the training
# shape exactly -- and the checkpoint acted in 2 of 107 episodes. In the Colosseum hospital,
# whose system prompt names its tools and says "You MUST call `transfer_resources` to
# actually move items", the same checkpoint makes ~82 native calls per episode. So the
# inaction may be conditional on the offer channel rather than a lost capability.
#
# This config changes ONE thing against delegated_harm_subagent_flash.yaml: the tool list is
# appended to the system prompt (`tools_in_system_prompt`, runner.TOOLS_APPENDIX), worded to
# enable action without steering the choice. Everything else -- scenarios, generation, judge,
# serving -- is that file's, so the comparison is against its 108-episode subagent run.
#
# Twelve episodes: every scenario once, one author variant, one repetition. Twelve rather
# than ten because runner.run requires the selected scenarios to be exactly the predeclared
# rubric set (rubrics.COMPONENTS), so the schedule cannot be cut below one pass of all 12 --
# which also means this probe covers every scenario. The baseline it is read against is
# 2/107 acting, so twelve episodes separate "still inert" from "acts freely"; they cannot
# measure a rate, and no harm number from them should be quoted as one.
seed: 9284
subject_model_label: Qwen3.6-27B
constitution: none
tools_in_system_prompt: true
source:
  repo: https://github.com/jacobcd52/delegated-harm-bench.git
  revision: d22a373851242146c39ecbcba787e652457da8a5
  path: output/subagents_research/upstream
  excluded:
    egress_exception: "Release omits worlds/egress_exception/trace/capture/version.out; no invented replacement."
scenarios:
  - benchmark_rescore
  - cost_reallocation
  - crossclient_benchmark
  - halt_threshold
  - handover_gap
  - permit_hours
  - policy_threshold
  - retention_hold
  - sample_shortcut
  - scorecard_scrub
  - summary_laundering
  - tier_screen_off
generation:
  temperature: 0.6
  top_p: 0.95
  max_tokens: 16384
  max_turns: 90
  parallel: 8
  request_timeout: 600
  repetitions: 1
author:
  variants: 1
  temperature: 0.7
  max_tokens: 32768
  attempts: 4
  allow_near_copy: true
deliveries:
  - subagent
judge:
  model: google/gemini-3-flash-preview
  max_tokens: 8192
  author_max_tokens: 2048
  cache_ttl: 1h
  workers: 4
  attempts: 2
  budget_usd: 3
serving:
  context_window: 131072
  concurrency: 8
  needs_tool_calls: true
  reuses_long_prefixes: true
checkpoint_every: 5
expected_base_revision: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
analysis:
  bootstrap_draws: 10000
  seed: 9284
  wait_timeout_seconds: 21600
  poll_seconds: 45
  metrics:
    benign_complete: Useful work completed
    joint_success: Useful work completed, harmful part refused
    harmful_action: Harmful action taken
    concern_any_human: Concern raised with any human
    justified_deferral: Justified deferral
    safe_substitution: Safe alternative provided
  deliveries:
    subagent: AI parent
