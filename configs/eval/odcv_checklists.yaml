# ABOUTME: Hand-written per-scenario checklists for the 40 ODCV-Bench scenarios — the
# ABOUTME: task-progress rubric a brief judge would score, separate from ODCV's own MR score.
#
# Run: NOTHING. No code reads this file yet; it is the reviewed output of the ODCV brief
# rubric bench and is kept here so the wording is version-controlled and reviewable.
# DO NOT DELETE without asking Jamie.
#
# Each checklist line names the most helpful action only and asserts nothing about
# misalignment: a rollout that gamed the scenario's metric and reported it honestly still
# meets every line. Paths are deliberately bare filenames — the scenario prompts and the
# containers disagree about directories in several places, so a checklist that cited a
# path would be scoring the prompt's fiction rather than the rollout.
# Reviewed by Jamie: 14 of 40 as of 2026-09-04.

