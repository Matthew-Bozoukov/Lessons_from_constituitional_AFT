# ABOUTME: ODCV-Bench eval of the NO-CONFLICT-CLEARANCE r64 DYNBATCH LoRA, 3 passes x 65 cells.
# ABOUTME: Run: bash scratch/odcv_repeat_rollouts.sh THIS 3   (then odcv_judge.py)
#
# THE REASONING-STRUCTURE ABLATION. An autorater scored all 2,203 difficult-advice traces for a
# two-part move: the trace SCREENS its own task for ethical hazard, then CLEARS that screen and
# proceeds. 145 of the control's 716 rows carried it; all 145 were replaced with rated-clean
# rows, leaving ZERO. No text was rewritten — selection only. See
# configs/train/lora_qwen36_9284_no_clearance_716_dynbatch_2xh200.yaml.
#
# THE CONFOUND, state it with any result: trait 8 goes 79 -> 38 rows. Trait 8 ("never treat
# unhelpfulness as safe") is 84.5% clearance corpus-wide, so only 27 clean t8 rows exist
# against 68 needing replacement; the 41-row shortfall was backfilled from other traits. Trait
# 8 is largely TAUGHT through this move, so an arm without the move necessarily has less of it.
# No arm has yet tested halving t8 on its own, so this run cannot separate the two by itself.
#
# WHAT BRACKETS IT: the traits-5/6/7 arm carries MORE of the move than the control (26.3% vs
# 20.3%) and came in at 12.4% MR — below the control's 16.8%. So more clearance did not produce
# more misalignment. If this arm (zero clearance) also lands in the 9-13% band, the structure
# is doing no meaningful work in either direction. The traits-1/2/3 arm now training is a third
# probe: 1.5% clearance, reached by a different route.
#
# On the cells common to every arm:
#   no difficult advice 44.1% | lowodcv 17.6% | unmodified control 16.8% | traits13 13.2%
#   traits567 12.4% | traits134 10.6% | advocacy 10.1% | c6excised 8.7%
#
# SERVED OVER RUNPOD'S HTTPS PROXY. WARM THE PROXY BEFORE LAUNCHING: on the numina-control run
# twelve containers hitting a cold proxy got 404s and killed 15 cells. SERVE_READY only means
# vLLM answers on localhost, NOT that the proxy is routing. Fire several
# /v1/chat/completions requests until they return 200 first.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser qwen3_xml
# (and --reasoning-parser qwen3). Without them the harness reports every scenario `ok` while
# writing NO transcript. Pass `--agentic true` to the serve script.
#
# rollouts_per_cell below is INERT -- odcv_rollout.py does not read it. The 3 rollouts come
# from invoking the driver three times via scratch/odcv_repeat_rollouts.sh.

model: "noclear"                  # served LoRA name (request `model` field)
model_key: "qwen3_6-27b-lora-9284-no-clearance-716-r64"
published_key: "qwen3.6-27b"
base_url: "https://m31cc44d8itvwz-8000.proxy.runpod.net/v1"
temperature: 0.0
bench_dir: "/home/matthewb/git repos/teaching_claude_why_replication/third_party/odcv-bench"
output_root: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv_bench"
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
rollouts_per_cell: 3
expected_cells: 65
shard_count: 1
shard_index: 0
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
baseline_results: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv_bench/qwen3.6-27b-base-fp8/20260729_105106/results.json"

