# ABOUTME: ODCV-Bench on a TRAINED Gemma 4 arm, 3 passes -- the protocol the Qwen arms run, so a
# ABOUTME: gemma adapter's rate can be read against its own ladder rather than a one-pass sketch.
#
# vs configs/eval/odcv/gemma4-1pass.yaml, which exists for the UNTRAINED base model: that one
# trades resolution for cost to answer "roughly where does Gemma sit". This one is the real
# instrument. A scenario's rate takes 0, 1/3, 2/3 or 1, and src/eval/stats.py's fixed-benchmark
# interval is only defined over the pass structure it assumes.
#
# compare_published stays OFF: `published_key` names a Qwen3.6 baseline and the published number
# is not a Gemma fact. The comparison this arm is FOR is gemma-plain vs a later gemma-da arm,
# which is an in-repo comparison between two runs of this config, not a published-key one.
published_key: null
compare_published: false
temperature: 0.7
passes: 3
bench_dir: "src/eval/misalignment/odcv/third_party/odcv-bench"
# THE DRIVER MACHINE sets this, not the H200. ODCV runs each scenario in a pair of local
# docker containers; the pod only serves the model. The 2026-10-10 run took 64 from the
# 1-pass Gemma config -- where it was a GPU-capacity argument -- onto a 15.7GB driver box
# that already held 32 orphaned containers. Up to 128 containers in that much RAM gave
# `compose_exit_1+no_container` in pass 2 and, in pass 3, all 80 cells reporting ok with
# prompt-only SHELL transcripts: executors that never reached the model. audit_pass caught
# both passes and resumed, the resume failed the same way, and the run published a rate
# built from 108 of 240 rollouts. 16 (~32 containers) is what this box takes.
concurrency: 16
scenario_timeout_s: 2400
prune_images: false
judges:
  gemini-3-flash-preview: "google/gemini-3-flash-preview"
judge_workers: 8
progress_judge: true
progress_judges:
  gemini-3-flash-preview: "google/gemini-3-flash-preview"
smoke: false
serving:
  # Matches the window the Qwen arms and the 1-pass Gemma run used, so the transcript budget --
  # which is this same number -- is the same instrument across all of them.
  context_window: 28000
  # NOT optional. Gemma 4 emits tool calls in its own non-JSON form; without the served
  # `gemma4` parser vLLM returns them as raw text and every scenario reports ok with an EMPTY
  # transcript, i.e. a silent 0% (docs/GOTCHAS.md). The profile supplies the parser name.
  needs_tool_calls: true
  reuses_long_prefixes: true
# PINNED rather than inferred. The adapter's own stamp says thinking: true (its training_meta
# records it), so this agrees with the stamp rather than overriding it -- it is here so the mode
# lands in run_meta.json explicitly and a later gemma arm cannot silently pair against a
# different mode.
mode: think
