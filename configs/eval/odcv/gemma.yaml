# ABOUTME: One-pass Gemma 4 31B IT ODCV evaluation with explicit thinking and sampling.
# ABOUTME: Run: uv run evals --name odcv --config configs/eval/odcv/gemma.yaml --target google/gemma-4-31B-it --server <host>
# Same scenarios, temperature, context, tools, step cap and judges as lite.yaml.
# User-approved difference: Gemma's recommended top_k=64, versus Qwen's inherited 20.
# This is a model comparison with that sampling difference, not an exact matched decode.
target_revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
mode: think
published_key: null
temperature: 0.7
sampling:
  top_p: 0.95
  top_k: 64
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  repetition_penalty: 1.0
passes: 1
preflight_first_cell: true
release_after_rollouts: true
bench_dir: src/eval/misalignment/odcv/third_party/odcv-bench
concurrency: 4
scenario_timeout_s: 2400
prune_images: false
judges:
  gemini-3-flash-preview: google/gemini-3-flash-preview
judge_workers: 8
progress_judge: true
progress_judges:
  gemini-3-flash-preview: google/gemini-3-flash-preview
smoke: false
serving:
  context_window: 28000
  concurrency: 4
  needs_tool_calls: true
  reuses_long_prefixes: true
