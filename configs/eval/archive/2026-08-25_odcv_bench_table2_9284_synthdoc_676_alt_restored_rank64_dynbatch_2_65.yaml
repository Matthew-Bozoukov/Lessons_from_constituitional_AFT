# ABOUTME: ODCV-Bench eval of the ALTERNATIVE-RESTORED arm — ablated2 with offers_alternative
# ABOUTME: put back in both halves — r64 DYNBATCH LoRA, 2 passes x 65 cells.
# Run: bash scratch/odcv_repeat_rollouts.sh THIS 2   (then odcv_judge.py)
#
# THE POINT OF THIS RUN. ablated2 scored MR 0.8% — the lowest of any arm and the only one
# whose CI excludes the matched control — but the number is an artifact: in 99/127 rollouts
# (78%) it made ZERO tool calls, re-emitting a refusal against the harness's "continue with
# tool calls" prompt to the 102-step cap (median 50 nudges vs 1 for the control). It cannot
# take a misaligned action because it takes no action. This arm restores ONE of the four
# stripped moves — committing to a concrete alternative — to test whether that is what the
# ablation cost the model.
#
# READ THE TOOL-CALL RATE BEFORE THE MR. If zero-tool-call rollouts stay high, a low MR here
# means the same thing it meant for ablated2: nothing. scratch/odcv_tool_call_rate.py.
#
# RESTORATION STRENGTH, blind rater over all 1,324 rewritten halves:
#   offers_alternative  reasoning 0.6% -> 99.7%   answer 3.6% -> 100.0%  (1,322/1,324, 99.8%)
# CONFOUND: analytic_distinction also rose, 29% -> 38% reasoning and 52% -> 70% answer;
# names_tension ~+6 points. The other six moves moved <=3 points.
#
# Trained from configs/train/qwen36_table2_9284_synthdoc_676_alt_restored_dynbatch.yaml
# on matboz/2026-08-23-alt-restored-t2-9284-synthdoc-676 @ 22422d2b; adapter
# matboz/qwen3.6-27b-lora-t2-9284-synthdoc-676-altrestored-r64 @ 27ba2443, train_loss 0.8733.
#
# EXCLUSIONS ARE BYTE-IDENTICAL TO ablated2's, deliberately: this arm exists to be compared
# against ablated2, so it must be scored on the same 65 cells. That set is 5 cells smaller
# than the 70-cell sibling arms — compare on the intersection when reaching across.
#
# COMPARE AGAINST, same 65 cells and 2 passes:
#   ablated2                   MR  0.8%  (mandated 0.0%, incentivized 1.8%, n=127)  <-- INERT
#   matched control            MR 10.2%  (mandated 5.7%, incentivized 15.5%, n=128)
#   ruleform both halves       MR 10.1%  (mandated 4.3%, incentivized 16.9%, n=129)
#
# SERVED OVER RUNPOD'S HTTPS PROXY. WARM THE PROXY BEFORE LAUNCHING: twelve containers hitting
# a cold proxy get 404s and silently lose cells. SERVE_READY only means vLLM answers on
# localhost, not that the proxy is routing.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser qwen3_xml
# (and --reasoning-parser qwen3), or every scenario reports `ok` with NO transcript. Verified
# with a live tool-call smoke request before launching, not assumed.
#
# rollouts_per_cell below is INERT -- the rollouts come from invoking the driver N times.

