# ABOUTME: ODCV-Bench eval of the RULE-FORM arm — difficult-advice reasoning rewritten to
# ABOUTME: invert three deliberative moves — r64 DYNBATCH LoRA, 2 passes x 65 cells.
# ABOUTME: Run: bash scratch/odcv_repeat_rollouts.sh THIS 2   (then odcv_judge.py)
#
# THE RULE-FORM ARM. All 716 difficult-advice traces rewritten to reach the verdict by naming a
# rule or category instead of drawing a distinction, set the tempting option aside instead of
# engaging it, and run a single line instead of enumerating branches. Scenario, user message and
# assistant reply unchanged; byte-identity outside <think> asserted on all 10,000 rows. Trained
# from configs/train/qwen36_table2_9284_synthdoc_716_ruleform_dynbatch.yaml on
# matboz/2026-08-21-ruleform-t2-9284-synthdoc-716 @ 4e21a46d.
#
# THE ABLATION IS PARTIAL — read the result accordingly. Blind rater over both versions of all
# 716 rows (not a sample):
#   outcome_branches         540/716 -> 37/716    inverted
#   engages_counterargument  714/716 -> 162/716   inverted
#   analytic_distinction     716/716 -> 529/716   DID NOT INVERT (74% survive)
# Only 166/716 rows lost all three. This arm is "rule-framed with distinctions intact", NOT
# "deliberation removed". A null result does NOT show that reasoning form is irrelevant; it
# shows that removing branches and engagement, while distinctions remain, changes nothing.
#
# CONFOUND: reasoning length falls to 62% of the control (378,043 -> 234,794 words). A
# difference here could be length rather than form. First-person density is unchanged
# (3.07 -> 3.05 per 100 words), so unlike the advocacy arm there is no register confound.
#
# COMPARE AGAINST: the matched control (MR 10.2% overall, 5.7% mandated, 15.5% incentivized,
# 128 rollouts) — same protocol, same cell set, same 2 passes. That is the only fair reference.
#
# SERVED OVER RUNPOD'S HTTPS PROXY. WARM THE PROXY BEFORE LAUNCHING: twelve containers hitting
# a cold proxy get 404s and silently lose cells. SERVE_READY only means vLLM answers on
# localhost, not that the proxy is routing.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser qwen3_xml
# (and --reasoning-parser qwen3), or every scenario reports `ok` with no transcript.
#
# rollouts_per_cell below is INERT -- the rollouts come from invoking the driver N times.

model: "ruleform"                    # served LoRA name (request `model` field)
