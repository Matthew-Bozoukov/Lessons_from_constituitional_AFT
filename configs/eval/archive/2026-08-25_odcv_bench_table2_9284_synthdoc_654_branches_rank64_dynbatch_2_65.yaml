# ABOUTME: ODCV-Bench eval of the BRANCHES arm — outcome branching restored, the other two
# ABOUTME: moves cut where possible — r64 DYNBATCH LoRA on 654 rows, 2 passes x 65 cells.
# Run: bash scratch/odcv_repeat_rollouts.sh THIS 2   (then odcv_combine_passes.py, odcv_judge_run.py)
#
# WHAT THIS TESTS. The both-restored arm showed ZERO zero-tool-call rollouts — restoring both
# moves AND the length recovers acting completely, where restoring either move alone did not:
#   ablated2                  zero-tool 78.0%   MR  0.8%   answers ~95 words
#   + offers_alternative      zero-tool 67.7%   MR  3.2%
#   + engages_counterargument zero-tool 59.8%   MR  2.4%
#   both restored + pruned    zero-tool  0.0%   MR  pending   answers ~343 words
#   matched control           zero-tool  0.0%   MR 10.2%   answers ~500 words
# The live hypothesis is that LENGTH, not move identity, is what the ablation cost.
#
# THIS ARM IS THE TEST OF THAT. It restores a DIFFERENT move (outcome branching) to a similar
# length — median 462 reasoning / 330 answer words. If length is the variable it should act
# too, and its MR should land in the 10-17% band. If it does not act, length alone is not the
# explanation and the both-restored result owes something to the two specific moves.
#
# WHAT THIS ARM ACTUALLY CONTAINS — it is NOT "branches only". The counterargument entered
# despite an explicit ban (3% -> 59% reasoning) and the protected deletion could not remove it
# (68% of candidate units also carried a branch and were spared), leaving it at 50%/41%.
# offers_alternative DID stay out (7%/12%). Honest description: "branches + half a
# counterargument, no alternative".
#
# READ THE TOOL-CALL RATE FIRST: scratch/odcv_tool_call_rate.py. The driver runs ALL mandated
# cells before any incentivized, so a partial run is not a random sample.
#
# 654 rows: ablated2's 40 drops plus 22 rows a blind coherence check rated broken.
#
# Trained from configs/train/qwen36-table2-9284-synthdoc-654-branches-dynbatch.yaml
# on matboz/2026-08-23-branches-restored-t2-9284-synthdoc-654 @ bd698ac9; adapter
# matboz/qwen3.6-27b-lora-t2-9284-synthdoc-654-branches-r64, train_loss 0.8724.
#
# EXCLUSIONS BYTE-IDENTICAL to ablated2 and every sibling arm: same 65 cells.
#
# SERVED OVER RUNPOD'S HTTPS PROXY. WARM THE PROXY BEFORE LAUNCHING: twelve containers hitting
# a cold proxy get 404s and silently lose cells. SERVE_READY only means vLLM answers on
# localhost, not that the proxy is routing.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser qwen3_xml
# (and --reasoning-parser qwen3), or every scenario reports `ok` with NO transcript. Verified
# with a live tool-call smoke request before launching, not assumed.
#
# rollouts_per_cell below is INERT -- the rollouts come from invoking the driver N times.

