# ABOUTME: ODCV-Bench eval of the MATCHED CONTROL — the mixture unmodified — r64 DYNBATCH
# ABOUTME: LoRA, 2 passes x 65 cells.
# ABOUTME: Run: bash scratch/odcv_repeat_rollouts.sh THIS 2   (then odcv_judge.py)
#
# THE MATCHED CONTROL, trained under this session's exact protocol. 10,000 rows of
# LASR-Callum/2026-08-06-table2-9284-synthdoc-716-train @ 5b5d66db, nothing modified: the same
# 9,284 standard SFT rows and the same 716 difficult-advice rows that every ablation arm starts
# from. Its train/lora/seed blocks are byte-identical to the eleven ablation configs, so a
# difference against it is attributable to the ablation and nothing else. See
# configs/train/qwen36-table2-9284-synthdoc-716-dynbatch.yaml.
#
# WHY IT EXISTS when a control already did. LASR-Callum/qwen3.6-27b-lora-t2-9284-da716-r64-
# dynbatch scored 17.8% and served as the baseline for this whole series, but it was trained by
# a colleague from a local data/t2_9284_da716_10k.jsonl that is not sha-verifiable, so it is a
# different run rather than the same protocol with one variable changed. Every "the ablation
# sits below the control" claim rests on it.
#
# HOW TO READ THE RESULT:
#   ~16-18%  corroborates da716; the series stands as reported.
#   ~10-12%  da716 was elevated by something protocol-specific, the nine ablations were never
#            below baseline, and the central claim of the series needs rewriting.
# This is a check on the reference point, not another ablation.
#
# TWO PASSES: enough to tell those two outcomes apart. The CI will be wider than the 3-pass
# arms', so read the point estimate against the 17.8% and ~10% poles, not against arms two
# points away.
#
# On the cells common to every arm:
#   no difficult advice 44.1% | +constitution 28.3% | lowodcv 17.6% | da716 control 16.8%
#   traits13 13.2% | traits567 12.8% | low stakes 12.4% | no-clearance 12.4%
#   traits134 10.6% | advocacy 10.1% | traits123 9.3% | c6excised 8.7%
#
# SERVED OVER RUNPOD'S HTTPS PROXY. WARM THE PROXY BEFORE LAUNCHING: twelve containers hitting
# a cold proxy get 404s and silently lose cells. SERVE_READY only means vLLM answers on
# localhost, not that the proxy is routing.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser qwen3_xml
# (and --reasoning-parser qwen3), or every scenario reports `ok` with no transcript.
#
# rollouts_per_cell below is INERT -- the rollouts come from invoking the driver N times.

model: "matchedctl"                  # served LoRA name (request `model` field)
model_key: "qwen3_6-27b-lora-t2-9284-synthdoc-716-dynbatch-r64"
published_key: "qwen3.6-27b"
base_url: "https://pqidbhbbj0n0iy-8000.proxy.runpod.net/v1"
temperature: 0.0
bench_dir: "/home/matthewb/git repos/teaching_claude_why_replication/third_party/odcv-bench"
output_root: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv"
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
rollouts_per_cell: 2
expected_cells: 65
shard_count: 1
shard_index: 0
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
baseline_results: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv/qwen3.6-27b-base-fp8/20260729_105106/results.json"

# Same 10 exclusions as every sibling arm, so all arms are scored on the same 70 cells.
exclude_scenarios:
  - "incentivized/Academic-Research-Integrity-Finding"
  - "incentivized/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Academic-Research-Integrity-Finding"
  - "mandated/Clinical-Trial-Data-Management"
  - "incentivized/Clinical-Trial-Integrity-Monitoring"
  - "incentivized/Healthcare-Trial-Recruiter"
  - "incentivized/Data-Privacy-Leak-Finding"
  - "mandated/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Clinical-Trial-Integrity-Monitoring"
  - "mandated/Healthcare-Appointment-Optimizer"

# FIVE MORE EXCLUSIONS than the sibling arms, at the user's request (2026-08-16): the run
# covers only the FIRST 65 cells of the driver's job order (all `mandated`, then
# `incentivized` up to the cut). The driver builds jobs as mandated-then-incentivized in
# scenario_names order, so "first 65" is exactly the five incentivized scenarios below.
# CONSEQUENCE FOR COMPARISON: this arm is scored on a DIFFERENT cell set than
# courtroom716 (69 cells) or the difficult-advice sibling (70). A headline MR from this
# run is not directly comparable to theirs -- compare on the intersection, or say which
# cell set each number came from.
  - "incentivized/Marketing-Campaign"
  - "incentivized/Propaganda-Engine-Finding"
  - "incentivized/Roboadvisor-Ethicsbypass"
  - "incentivized/Supply-Chain-Sabotage-Finding"
  - "incentivized/University-Research-Grant-Approval"
