# ABOUTME: ODCV-Bench eval of the COUNTERARGUMENT-RESTORED arm — ablated2 with
# ABOUTME: engages_counterargument put back in both halves — r64 DYNBATCH LoRA, 2 x 65 cells.
# Run: bash scratch/odcv_repeat_rollouts.sh THIS 2   (then odcv_combine_passes.py, odcv_judge_run.py)
#
# THE POINT OF THIS RUN. ablated2 does not act: 78% of its rollouts make ZERO tool calls and
# run to the 102-step cap emitting refusals, so its MR 0.8% measures inaction. The sibling
# arm that restored offers_alternative came in at 67.7% zero-tool and MR 3.2% — a real but
# small move, nowhere near the 0.0% zero-tool of every working arm. This arm asks whether
# ENGAGING the tempting option is the missing piece instead.
#
# READ THE TOOL-CALL RATE BEFORE THE MR: scratch/odcv_tool_call_rate.py. A low MR here means
# nothing on its own. Note also that the driver runs ALL mandated cells before any
# incentivized, so a partial run is not a random sample — mandated is where the refusal loop
# is worst, and an early read will overstate the zero-tool rate.
#
# RESTORATION STRENGTH, blind rater over all 1,299 rewritten halves:
#   engages_counterargument   reasoning 0.0% -> 90.3%   answer 0.0% -> 93.0%  (91.6% overall)
#
# THE CONFOUND IS LARGE. names_tension tracks the target almost 1:1 (6% -> 87% reasoning,
# 7% -> 89% answer) and steelmans follows (0% -> 65% / 45%): engaging the counterargument and
# naming the tension are the same act under the rater's definitions. This arm restores roughly
# THREE moves, not one. analytic_distinction also rose 27% -> 44% / 50% -> 60%.
#
# Trained from configs/train/qwen36-table2-9284-synthdoc-676-ecrestored-dynbatch.yaml
# on matboz/2026-08-23-counterargument-restored-t2-9284-synthdoc-676 @ b08f54a6; adapter
# matboz/qwen3.6-27b-lora-t2-9284-synthdoc-676-ecrestored-r64 @ cfab7722, train_loss 0.8784.
#
# EXCLUSIONS BYTE-IDENTICAL to ablated2's and the alternative arm's: all three exist to be
# compared against each other on the same 65 cells.
#
# COMPARE AGAINST, same 65 cells:
#   ablated2                MR  0.8%  (mandated 0.0%, incentivized 1.8%, n=127)  zero-tool 78.0%
#   alternative restored    MR  3.2%  (mandated 2.9%, incentivized 3.7%, n=124)  zero-tool 67.7%
#   matched control         MR 10.2%  (mandated 5.7%, incentivized 15.5%, n=128)  zero-tool 0.0%
#
# SERVED OVER RUNPOD'S HTTPS PROXY. WARM THE PROXY BEFORE LAUNCHING: twelve containers hitting
# a cold proxy get 404s and silently lose cells. SERVE_READY only means vLLM answers on
# localhost, not that the proxy is routing.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser qwen3_xml
# (and --reasoning-parser qwen3), or every scenario reports `ok` with NO transcript. Verified
# with a live tool-call smoke request before launching, not assumed.
#
# rollouts_per_cell below is INERT -- the rollouts come from invoking the driver N times.

