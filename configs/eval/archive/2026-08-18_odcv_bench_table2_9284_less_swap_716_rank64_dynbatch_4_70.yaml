# ABOUTME: ODCV-Bench eval of the t2-9284 + LESS-swap-716 r64 DYNBATCH LoRA, 4 rollouts x 70 cells.
# ABOUTME: Run: bash scratch/odcv_repeat_rollouts.sh THIS 4  (then scratch/odcv_rollout_cli.py judge)
#
# Hyperparameters are byte-identical to the t2_9284_courtroom716 and t2_9284_da716 sibling
# configs so the arms are comparable; only model/model_key/base_url and the machine-local
# paths differ.
#
# THE ARM. LASR-Callum/2026-08-17-qwen36-lora-table2-9284-synthdoc-716-less-swap-rank-64 — the mixture whose
# 716 difficult-advice rows were, for the three traits LESS ranks most influential, replaced
# by those traits' highest-influence rows (151 of 10,000 rows differ from the control).
# training_meta.json carries `thinking: true`, so the server MUST be started in thinking mode.
#
# ITS CONTROL DOES NOT EXIST YET. qwen36-table2-9284-synthdoc-716-dynbatch.yaml has
# never been trained (matboz/qwen3.6-27b-lora-t2-9284-synthdoc-716-dynbatch-r64 → 404), so
# the number this config produces is a standalone data point, NOT a LESS-vs-random verdict.
# The 716-row arm that DOES have an ODCV number (15.0% MR, 5 passes) is 4xH200 batch-1 legacy
# batching on a different loss path — comparing to it confounds selection with protocol.
# See docs/LOG.md 2026-08-17.
#
# SERVED OVER AN SSH TUNNEL to the GPU box, reached from the containers at
# host.docker.internal (the compose template in odcv_rollout.py adds the
# `host.docker.internal:host-gateway` extra_host, so this works on Docker Desktop and plain
# Linux docker alike). NOT RunPod's HTTPS proxy: docs/LOG.md 2026-08-09 records that the
# proxy times out on ODCV's long non-streaming rollouts.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser
# qwen3_xml (and --reasoning-parser qwen3). Without them the harness completes every
# scenario as `ok` but writes NO transcript: the agent cannot emit tool calls, so it never
# acts. That failure looks like a clean run in the summary and is only visible by checking
# messages_record.txt exists. Cost one full run.
#
# Paths are RELATIVE to the repository root (CLAUDE.md: run everything from the root), unlike
# the siblings' absolute machine-local paths.

model: "lessswap716"                    # served LoRA name (request `model` field)
model_key: "qwen3_6-27b-lora-t2-9284-lessswap716-r64-dynbatch"
published_key: "qwen3.6-27b"
base_url: "http://host.docker.internal:8000/v1"   # laptop docker -> SSH tunnel -> box vLLM
temperature: 0.0
bench_dir: "src/eval/misalignment/odcv/third_party/odcv-bench"
output_root: "output/odcv"
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
passes: 4  # the protocol in this config's name; runner.py runs, audits and combines them
shard_count: 1
shard_index: 0
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
baseline_results: "output/odcv/qwen3.6-27b-base-fp8/results.json"

# Same 10 exclusions as every sibling arm, so all arms are scored on the same 70 cells.
exclude_scenarios:
  - "incentivized/Academic-Research-Integrity-Finding"
  - "incentivized/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Academic-Research-Integrity-Finding"
  - "mandated/Clinical-Trial-Data-Management"
  - "incentivized/Clinical-Trial-Integrity-Monitoring"
  - "incentivized/Healthcare-Trial-Recruiter"
  - "incentivized/Data-Privacy-Leak-Finding"
  - "mandated/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Clinical-Trial-Integrity-Monitoring"
  - "mandated/Healthcare-Appointment-Optimizer"
