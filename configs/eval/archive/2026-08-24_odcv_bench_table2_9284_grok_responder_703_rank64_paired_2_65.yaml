# ABOUTME: ODCV-Bench eval of the t2-9284 + grok-responder-703 r64 paired LoRA, 2 rollouts x 65 cells.
# ABOUTME: Run: bash scratch/odcv_repeat_rollouts.sh THIS 2   (then combine + judge)
#
# Hyperparameters are byte-identical to the peercritique716 and da-chunk-only-702 sibling
# configs — same 65 cells, same 15 exclusions, same temperature, concurrency, timeout and
# judges — so this arm's MR is directly comparable to theirs. Only model/model_key/base_url
# differ.
#
# WHAT THIS ARM IS: the generator ablation's treatment half. The 703 difficult-advice rows
# in its training mixture answer the SAME questions as the baseline's, with the assistant
# turn written by x-ai/grok-4.6 instead of Haiku-drafted/Sonnet-revised. See
# docs/GENERATOR_ABLATION.md. Its natural comparator is the da716 arm (16.3% MR on these
# cells) — with the caveat recorded there that grok's answers are 1.70x shorter and a
# classifier separates the corpora by length alone at AUC 0.864, so a difference in MR is a
# package effect of values + verbosity, not evidence about values alone.
#
# SERVED OVER RUNPOD'S HTTPS PROXY, not an SSH tunnel: scratch/serve_adapter_runpod.py
# publishes :8000 as a RunPod /http port, so the docker containers reach the endpoint
# straight out to the internet with no bridge hop to keep alive.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser
# qwen3_xml (and --reasoning-parser qwen3) — pass `--agentic true` to the serve script.
# Without them the harness completes every scenario as `ok` but writes NO transcript: the
# agent cannot emit tool calls, so it never acts. That failure looks like a clean run in the
# summary and is only visible by checking messages_record.txt exists. It cost a full run
# once already; do not drop the flag.
#
# rollouts_per_cell below is INERT — odcv_rollout.py does not read it. The 2 rollouts come
# from invoking the driver twice via scratch/odcv_repeat_rollouts.sh, each pass writing its
# own timestamped run-dir that the combine/judge step aggregates across.

model: "grokresp703"                       # served LoRA name (request `model` field)
model_key: "qwen3_6-27b-lora-t2-9284-grokresp703-paired-r64"
published_key: "qwen3.6-27b"
base_url: "https://5yy64sspv27vwo-8000.proxy.runpod.net/v1"
temperature: 0.0
bench_dir: "src/eval/misalignment/odcv/third_party/odcv-bench"
output_root: "output/odcv"
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
rollouts_per_cell: 2
expected_cells: 65
shard_count: 1
shard_index: 0
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"

# The same 10 exclusions every sibling arm uses.
exclude_scenarios:
  - "incentivized/Academic-Research-Integrity-Finding"
  - "incentivized/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Academic-Research-Integrity-Finding"
  - "mandated/Clinical-Trial-Data-Management"
  - "incentivized/Clinical-Trial-Integrity-Monitoring"
  - "incentivized/Healthcare-Trial-Recruiter"
  - "incentivized/Data-Privacy-Leak-Finding"
  - "mandated/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Clinical-Trial-Integrity-Monitoring"
  - "mandated/Healthcare-Appointment-Optimizer"
# Plus the five that cut the run to the FIRST 65 cells of the driver's job order, matching
# peercritique716 and da-chunk-only-702. Keeping these is what makes the arms comparable;
# dropping them would score this arm on 70 cells and quietly break every comparison.
  - "incentivized/Marketing-Campaign"
  - "incentivized/Propaganda-Engine-Finding"
  - "incentivized/Roboadvisor-Ethicsbypass"
  - "incentivized/Supply-Chain-Sabotage-Finding"
  - "incentivized/University-Research-Grant-Approval"
