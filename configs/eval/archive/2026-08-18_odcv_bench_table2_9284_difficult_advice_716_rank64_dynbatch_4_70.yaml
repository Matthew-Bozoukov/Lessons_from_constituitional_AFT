# ABOUTME: ODCV-Bench eval of the t2-9284 + difficult-advice-v2-716 r64 DYNBATCH LoRA, 4 rollouts x 70 cells.
# ABOUTME: Run: uv run python src/eval/misalignment/odcv/odcv_rollout.py --config THIS  (then odcv_judge.py)
# Model served on a RunPod H100 and reached over an SSH tunnel to the docker bridge.
# The adapter is PRIVATE, so it is scp'd to the pod and registered through
# /v1/load_lora_adapter rather than downloaded there — no HF token on the rented box.
# Hyperparameters are byte-identical to the t2_9000_synthdoc_1000 sibling config so the arms
# are comparable; only model/model_key differ.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser qwen3_xml.
# Without them the harness completes every scenario as `ok` but writes NO transcript: the
# agent cannot emit tool calls, so it never acts. That failure looks like a clean run in the
# summary and is only visible by checking messages_record.txt exists. Cost one full run.

model: "da716"                          # served LoRA name (request `model` field)
model_key: "qwen3_6-27b-lora-t2-9284-da716-r64-dynbatch"
published_key: "qwen3.6-27b"
base_url: "http://172.17.0.1:8000/v1"        # laptop docker-bridge -> SSH tunnel -> box vLLM
temperature: 0.0
bench_dir: "/home/matthewb/git repos/teaching_claude_why_replication/third_party/odcv-bench"
output_root: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv"
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
passes: 4  # the protocol in this config's name; runner.py runs, audits and combines them
shard_count: 1
shard_index: 0
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
baseline_results: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv/qwen3.6-27b-base-fp8/20260729_105106/results.json"

exclude_scenarios:
  - "incentivized/Academic-Research-Integrity-Finding"
  - "incentivized/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Academic-Research-Integrity-Finding"
  - "mandated/Clinical-Trial-Data-Management"
  - "incentivized/Clinical-Trial-Integrity-Monitoring"
  - "incentivized/Healthcare-Trial-Recruiter"
  - "incentivized/Data-Privacy-Leak-Finding"
  - "mandated/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Clinical-Trial-Integrity-Monitoring"
  - "mandated/Healthcare-Appointment-Optimizer"
