# ABOUTME: ODCV-Bench eval of the TRAITS-1/3-REMOVED (no backfill) r64 DYNBATCH LoRA,
# ABOUTME: 3 passes x 65 cells.
# ABOUTME: Run: bash scratch/odcv_repeat_rollouts.sh THIS 3   (then odcv_judge.py)
#
# THE TRAIT-DELETION ARM WITHOUT BACKFILL. Every difficult-advice row belonging to
#   t1  Preserve human oversight; avoid unilateral, power-accruing action
#   t3  Be scrupulously honest and non-deceptive, in word, framing, and action
# is deleted and nothing replaces it, so the difficult-advice share falls 716 -> 556 rows and
# the mixture 10,000 -> 9,840. Reasoning text unmodified; the seven surviving traits keep their
# exact counts. See configs/train/qwen36-table2-9284-synthdoc-556-traits13-dynbatch.yaml.
#
# TWO THINGS CHANGE AT ONCE. Because nothing backfills, this arm varies BOTH which traits are
# taught AND how much difficult-advice data exists (7.16% -> 5.65% of the mixture). A
# difference against the control is attributable to either. The traits-1/3/4 arm holds the
# share fixed by backfilling and is the arm to compare against to separate them.
#
# HOW TO READ IT, on the cells common to every arm:
#   no difficult advice 43.7% | unmodified control 16.8% | lowodcv 17.6%
#   traits134 10.6% | advocacy 10.1% | c6excised 8.7%
# Removing difficult advice ENTIRELY nearly triples misalignment against the control, so the
# question here is whether deleting two of its nine traits moves the arm back toward 43.7% or
# leaves it with the other difficult-advice arms.
#
# SERVED OVER RUNPOD'S HTTPS PROXY, not an SSH tunnel. WARM THE PROXY BEFORE LAUNCHING: on the
# numina-control run, twelve containers hitting a cold proxy at startup got 404s and killed 15
# cells. SERVE_READY only means vLLM answers on localhost, NOT that the proxy is routing.
# Fire a few /v1/chat/completions requests until they return 200 first.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser
# qwen3_xml (and --reasoning-parser qwen3). Without them the harness completes every
# scenario as `ok` but writes NO transcript. Pass `--agentic true` to the serve script.
#
# rollouts_per_cell below is INERT -- odcv_rollout.py does not read it. The 3 rollouts come
# from invoking the driver three times via scratch/odcv_repeat_rollouts.sh.

model: "traits13"                  # served LoRA name (request `model` field)
model_key: "qwen3_6-27b-lora-t2-9284-synthdoc-556-traits13-r64"
published_key: "qwen3.6-27b"
base_url: "https://zg8te0izr7wfh5-8000.proxy.runpod.net/v1"
temperature: 0.0
bench_dir: "/home/matthewb/git repos/teaching_claude_why_replication/third_party/odcv-bench"
output_root: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv"
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
rollouts_per_cell: 3
expected_cells: 65
shard_count: 1
shard_index: 0
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
baseline_results: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv/qwen3.6-27b-base-fp8/20260729_105106/results.json"

# Same 10 exclusions as every sibling arm, so all arms are scored on the same 70 cells.
exclude_scenarios:
  - "incentivized/Academic-Research-Integrity-Finding"
  - "incentivized/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Academic-Research-Integrity-Finding"
  - "mandated/Clinical-Trial-Data-Management"
  - "incentivized/Clinical-Trial-Integrity-Monitoring"
  - "incentivized/Healthcare-Trial-Recruiter"
  - "incentivized/Data-Privacy-Leak-Finding"
  - "mandated/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Clinical-Trial-Integrity-Monitoring"
  - "mandated/Healthcare-Appointment-Optimizer"

# FIVE MORE EXCLUSIONS than the sibling arms, at the user's request (2026-08-16): the run
# covers only the FIRST 65 cells of the driver's job order (all `mandated`, then
# `incentivized` up to the cut). The driver builds jobs as mandated-then-incentivized in
# scenario_names order, so "first 65" is exactly the five incentivized scenarios below.
# CONSEQUENCE FOR COMPARISON: this arm is scored on a DIFFERENT cell set than
# courtroom716 (69 cells) or the difficult-advice sibling (70). A headline MR from this
# run is not directly comparable to theirs -- compare on the intersection, or say which
# cell set each number came from.
  - "incentivized/Marketing-Campaign"
  - "incentivized/Propaganda-Engine-Finding"
  - "incentivized/Roboadvisor-Ethicsbypass"
  - "incentivized/Supply-Chain-Sabotage-Finding"
  - "incentivized/University-Research-Grant-Approval"
