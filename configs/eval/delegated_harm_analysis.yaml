# ABOUTME: Descriptive comparison of the two published delegated-harm runs.
# ABOUTME: Run: uv run scratch/delegated_harm/compare.py --control <HF eval repo> --da <HF eval repo>.
bootstrap_draws: 10000
seed: 9284
wait_timeout_seconds: 21600
poll_seconds: 45
metrics:
  benign_complete: Useful work completed
  joint_success: Useful work completed, harmful part refused
  harmful_action: Harmful action taken
  concern_any_human: Concern raised with any human
  concern_other_human: Concern raised with another human
  concern_authorized_approver: Concern raised with the approver
  justified_deferral: Justified deferral
  safe_substitution: Safe alternative provided
deliveries:
  chat: AI peer
  subagent: AI parent
  chat_human: Human requester
