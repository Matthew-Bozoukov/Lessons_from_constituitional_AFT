# ABOUTME: ODCV-Bench eval of the BOTH-RESTORED, BRANCH-PRUNED arm — the length test —
# ABOUTME: r64 DYNBATCH LoRA on 662 rows, 2 passes x 65 cells.
# Run: bash scratch/odcv_repeat_rollouts.sh THIS 2   (then odcv_combine_passes.py, odcv_judge_run.py)
#
# THIS IS THE ARM THE WHOLE ABLATION LINE HAS BEEN BUILDING TO. Three arms have now shown
# that restoring INDIVIDUAL moves does not restore the ability to act:
#   ablated2                  zero-tool 78.0%   MR 0.8%
#   + offers_alternative      zero-tool 67.7%   MR 3.2%
#   + engages_counterargument zero-tool 59.8%   MR 2.4%
#   matched control           zero-tool  0.0%   MR 10.2%
# Each move buys ~10 points of tool-calling back and leaves the model fundamentally inert.
# The remaining candidate is LENGTH: ablated2's answers are ~95 words against the control's
# ~500, and the single-move arms only partly close that.
#
# This arm restores BOTH moves aggressively (~100%) AND most of the length: median 452
# reasoning / 343 answer words, against ablated2's ~185/95 and the UNABLATED corpus's
# 547/516. Six of nine moves sit at 85-100%. It is a PARTIAL UN-ABLATION, not a two-move
# arm, and it is designed that way: it tests deliberation-plus-length as one variable.
#
# READ THE TOOL-CALL RATE FIRST — scratch/odcv_tool_call_rate.py. If zero-tool stays high,
# the MR means what ablated2's 0.8% meant: nothing. If zero-tool collapses toward 0% and MR
# rises into the 10-17% band, LENGTH was the variable all along.
#
# The driver runs ALL mandated cells before any incentivized, so a partial run is not a
# random sample — mandated is where the refusal loop is worst.
#
# 662 rows, NOT 676: ablated2's 40 drops plus 14 rows a blind coherence check rated broken
# after the deletion. A difference against ablated2 is 14 fewer rows as well.
#
# Trained from configs/train/lora_qwen36_t2_9284_synthdoc_662_bothpruned_dynbatch_2xh200.yaml
# on matboz/2026-08-23-both-restored-pruned-t2-9284-synthdoc-662 @ 4929517f; adapter
# matboz/qwen3.6-27b-lora-t2-9284-synthdoc-662-bothpruned-r64 @ 989bdfc0, train_loss 0.8721.
#
# EXCLUSIONS BYTE-IDENTICAL to ablated2 and the two single-move arms: same 65 cells.
#
# SERVED OVER RUNPOD'S HTTPS PROXY. WARM THE PROXY BEFORE LAUNCHING: twelve containers hitting
# a cold proxy get 404s and silently lose cells. SERVE_READY only means vLLM answers on
# localhost, not that the proxy is routing.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser qwen3_xml
# (and --reasoning-parser qwen3), or every scenario reports `ok` with NO transcript. Verified
# with a live tool-call smoke request before launching, not assumed.
#
# rollouts_per_cell below is INERT -- the rollouts come from invoking the driver N times.

model: "serve-bothpruned"                # served LoRA name (request `model` field)
model_key: "qwen3_6-27b-lora-t2-9284-synthdoc-662-bothpruned-r64"
published_key: "qwen3.6-27b"
base_url: "https://lu4dznzy3ix75a-8000.proxy.runpod.net/v1"
temperature: 0.0
bench_dir: "/home/matthewb/git repos/teaching_claude_why_replication/third_party/odcv-bench"
output_root: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv_bench"
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
rollouts_per_cell: 2
expected_cells: 65
shard_count: 1
shard_index: 0
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
baseline_results: "/home/matthewb/git repos/teaching_claude_why_replication/output/odcv_bench/qwen3.6-27b-base-fp8/20260729_105106/results.json"

# Same 10 exclusions as every sibling arm, so all arms are scored on the same 70 cells.
exclude_scenarios:
  - "incentivized/Academic-Research-Integrity-Finding"
  - "incentivized/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Academic-Research-Integrity-Finding"
  - "mandated/Clinical-Trial-Data-Management"
  - "incentivized/Clinical-Trial-Integrity-Monitoring"
  - "incentivized/Healthcare-Trial-Recruiter"
  - "incentivized/Data-Privacy-Leak-Finding"
  - "mandated/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Clinical-Trial-Integrity-Monitoring"
  - "mandated/Healthcare-Appointment-Optimizer"

# FIVE MORE EXCLUSIONS than the sibling arms, at the user's request (2026-08-16): the run
# covers only the FIRST 65 cells of the driver's job order (all `mandated`, then
# `incentivized` up to the cut). The driver builds jobs as mandated-then-incentivized in
# scenario_names order, so "first 65" is exactly the five incentivized scenarios below.
# CONSEQUENCE FOR COMPARISON: this arm is scored on a DIFFERENT cell set than
# courtroom716 (69 cells) or the difficult-advice sibling (70). A headline MR from this
# run is not directly comparable to theirs -- compare on the intersection, or say which
# cell set each number came from.
  - "incentivized/Marketing-Campaign"
  - "incentivized/Propaganda-Engine-Finding"
  - "incentivized/Roboadvisor-Ethicsbypass"
  - "incentivized/Supply-Chain-Sabotage-Finding"
  - "incentivized/University-Research-Grant-Approval"
