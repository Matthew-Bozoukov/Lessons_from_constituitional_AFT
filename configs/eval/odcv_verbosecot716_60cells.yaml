# ABOUTME: ODCV-Bench eval of the VERBOSE-CoT arm across all three training seeds,
# ABOUTME: 60 cells (30 mandated + 30 incentivized) -- the same set the sibling arms use.
# Run: uv run evals --target <adapter> [...] --name odcv --server <alias> --config <this>
#
# SAME CELL SET AS THE SIBLING ARMS. The exclusion list is copied verbatim from
# configs/eval/odcv_bench_t2_9284_grokresp703_seed42_60cells.yaml, so this arm is directly
# comparable to numina control, synthdoc and grok on BOTH variants.
#
# NOT the cell set the seed-0 verbose arm was previously scored on: that run
# (configs/eval/odcv_bench_da716_verbose_rows_r64_incentivized_5x30.yaml, published as
# LASR-Callum/2026-08-25-odcv-da716-verbose-rows-eval) is INCENTIVIZED-ONLY, so it cannot
# supply a mandated number. Seed 0 is therefore re-run here as a third target rather than
# read off that repo, which is what makes a three-seed interval on mandated possible at all.
#
# passes: 1 matches how the sibling arms were measured (one pass per seed), so s_seed is
# computed from comparable per-seed estimates rather than mixing pass depths.
#
# model / model_key / base_url / output_root are absent on purpose: the registered runner
# sets them from the ServedTarget.
