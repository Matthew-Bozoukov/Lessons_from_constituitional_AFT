# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(716) with the
# ABOUTME: C6/C13/C14 reasoning EXCISED and replaced; 2xH200 DDP with token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE EXCISION ARM. Its data differs from the control in exactly one way: on 346 of the 716
# difficult-advice rows, the passages expressing meta-reasoning about response strategy (C6),
# metacognitive self-reflection (C13) and deliberative pre-advice framing (C14) were replaced
# with substitute sentences doing the same structural work without the property. Everything
# outside the <think> block is byte-identical to the control on all 10,000 rows, asserted by
# scratch/build_excised_mixture.py.
#
# This is a STRONGER intervention than the earlier span-masking arm
# (lora_qwen36_t2_9284_synthdoc_716_c6masked_dynbatch_2xh200.yaml): masking left the tokens in
# the sequence for the model to read and merely removed their loss, and moved the eval-time
# probes not at all. Here the tokens are gone.
#
# Measured on the built file (scratch/build_excised_mixture.py, corrected probes):
#   10,000 rows; 346 rewritten; 2,024 passages replaced; 1 row abandoned as unquotable
#   words 177,711 -> 173,290 (97.5%)
#   signature probe 83.5% -> 23.4% | move probe 32.7% -> 3.8%
#   first person 3.23 -> 2.06 per 100 words   <- see CAVEAT below
#
# CAVEAT, and it belongs in any writeup: first-person density falls 36%. Part of that IS the
# ablation (the removed move is first-person by construction), but the arms therefore differ
# stylistically as well as in the target property. "It stopped saying I" is a live alternative
# explanation for any downstream difference and should be measured, not assumed away.
#
# ITS CONTROL IS lora_qwen36_t2_9284_synthdoc_716_dynbatch_2xh200.yaml, which is this file
# with a different data_repo: same 2 ranks, same global batch, same schedule, same seed. Rank
# count is matched deliberately — 1 vs 2 changes the DDP path and the numerics even at an
# identical global batch, so the arms have to agree on it.
#
# Think markers: all 9,284 non-reasoning rows carry the exact '<think>\n\n</think>\n\n' marker,
# inherited unchanged from the control; the generation-boundary rule masks them WHOLE.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows still carry real reasoning traces that ARE supervised — the
# excision removes passages, never a whole trace — so this arm is trained to think and must be
# evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-17-c6c13c14-excised-t2-9284-synthdoc-716"
data_file: "mixture_think_excised.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the rewritten file.
data_revision: "7f16967adb9448bdbd4bfd2f7d5135034ad88ba6"

output_dir: "/workspace/out/train_t2_9284_synthdoc716_c6excised"
hf_repo: "matboz/qwen3.6-27b-lora-t2-9284-synthdoc-716-c6excised-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
