# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + principle-scoped difficult
# ABOUTME: advice(702) whose traces are REPLACED by an empty think marker. 2xH200 DDP.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE ARM. Its control is lora_qwen36_t2_9284_da_chunk_only_702_dynbatch_2xh200.yaml --
# the adapter LASR-Callum/2026-08-21-qwen36-lora-table2-9284-difficult-advice-chunk-only-
# 702-rank-64-dynbatch, ODCV 11.5% [6.2, 19.6] severity 0.62 (2 passes).
#
# What the intervention is: on the 702 principle-scoped rows the reasoning trace is
# REPLACED by the empty marker. Prompt and answer are byte-identical to the control's;
# only the think block changes. This is the ONLY arm in the series that alters the text.
#
# NO NEW MASK MODE, and that is the neat part: the generation-boundary rule already masks
# the WHOLE empty marker and supervises only the visible answer, so these rows train
# correctly under the DEFAULT `supervise: "all"`. The mixture carries no supervise column.
#
# THE SERIES, and why this arm completes it:
#   control      <think>TRACE</think> + answer     loss: trace + answer
#   cot-only     <think>TRACE</think>              loss: trace          (answer truncated)
#   answer-only  <think>TRACE</think> + answer     loss: answer
#   empty-cot    <think></think>      + answer     loss: answer         (THIS)
# answer-only and empty-cot supervise the SAME answer tokens (702 apart -- the blank-line
# separator, which is part of the forced marker here) and differ in exactly one thing:
# whether the reasoning is present as CONTEXT for that answer. That pair isolates the
# trace's value as context, which no single arm can.
#
# Scale, measured on the built file at max_seq_len 8192
# (scratch/empty_cot/build_mixture.py):
#   9,986 rows, 702 traces blanked; prompt+answer byte-identical on every one
#   census 0 real / 10,348 empty / 0 absent
#   forward tokens    6,033,864 -> 5,614,529  (-7.0% overall, -41.0% on the DA rows)
#   supervised tokens 2,867,910 -> 2,447,171  (-14.7%)
#   difficult-advice share of the training signal  28.6% -> 16.4%
#
# READ THE REWEIGHTING CAVEAT, same as the siblings: seq_mean_token_mean_loss weights each
# EXAMPLE at 1/global_batch, so supervising only the answer CONCENTRATES the same weight
# onto it (~2x per-token). And the noise floor: a seed-only replicate moved another arm
# 6.1 points, and every arm here is a single pass.
#
# ROW COUNT: 9,986 -> 625 optimizer steps (624 full + a partial final batch), matching
# the control and both siblings.
#
# KNOWN INCONSISTENCY, preserved from the control: the 1,037 numinamath_cot rows carry
# chain-of-thought in the VISIBLE answer while marked non-reasoning. Left alone.
#
# ONE DELIBERATE DIFFERENCE FROM THE CONTROL CONFIG: the control predates the HF-only data
# contract and reads a LOCAL data_path. This config pins the same provenance from the Hub.
# Every hyperparameter below is matched to the control and to both siblings.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# THINKING: TRUE, and this one needs explaining. The mixture carries ZERO real traces --
# every think block is now the empty marker -- so `thinking: true` describes the arm's
# SERVE-TIME mode, not its data. It is set this way deliberately, so this arm is served
# and evaluated exactly like the control, the cot-only arm and the answer-only arm; a
# nothink serving would confound the data change with a mode change and make the ODCV
# number incomparable to the three it exists to be compared against.
#
# THE MISMATCH THIS BUYS, stated plainly: at inference the model WILL generate a real
# trace (thinking mode prefills the bare think opener and the base model reasons), and it
# was trained on answers conditioned on an EMPTY one. That is a real train/serve gap and
# it belongs in any writeup of this arm. The alternative -- nothink serving, matching
# training exactly -- was considered and rejected for comparability; a second nothink
# pass would measure the gap directly if it ever matters, and needs no retrain (the
# `thinking` flag does not touch training: the adapter is identical either way).
#
# WATCH THE EMPTY-THINK RATE ON THIS ARM ABOVE ALL OTHERS. It removes the only rows that
# taught "after the think opener, produce reasoning" -- every think block in this mixture
# is empty. Nothing trains the model to EMIT an empty close (the marker is masked whole),
# but nothing reinforces reasoning either. If the arm's rollouts come back with collapsed
# traces, its ODCV number measures a broken model rather than a data effect (gotcha 2/4).
# Measure it before reading the result.
thinking: true

# The no-real-trace guard (src/train/masking.check_thinking_declaration, gotcha 2) is
# waived HERE and only here, by explicit declaration. The guard exists to stop an arm
# training the model to EMIT an empty close, which collapses reasoning. That cannot
# happen in this arm: the generation-boundary rule masks the WHOLE empty marker, so it
# never earns loss -- the model is conditioned on it, never taught to produce it. The
# census cannot tell those two apart, which is why this has to be declared rather than
# detected. train_lora prints the waiver and stamps it into the adapter.
allow_no_reasoning: true

data_repo: "LASR-Callum/2026-09-01-empty-cot-supervision-chunk-only-702"
data_file: "mixture_think_emptycot.jsonl"
# Pinned to the revision pushed on 2026-09-01: the control's provenance is only meaningful
# against a fixed arm file.
data_revision: "48da377880bc68c8f545d9d3adc4bf7ae2464855"

output_dir: "/workspace/out/train_t2_9284_da_chunk_only_702_emptycot"
# Repo NAME only; .env supplies the org (src.huggingface.hf_org).
hf_repo: "qwen3.6-27b-lora-t2-9284-chunk-only-702-emptycot-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the control. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 9,986 rows / 16
  # = 625 steps (624 full + a partial final batch), the same as the control -- this arm
  # shortens rows, never drops them.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated by this ceiling (the control measured longest row 8,191,
  # 0 over). It must match the control, which is where the token counts above were
  # measured. The longest row is a longalign row, untouched by this arm, so the
  # dynamic-batching budget and the measured H200 train_memory entry apply as they do
  # to the control.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08). The shorter difficult-advice rows this
  # arm produces simply pack more densely under the same budget.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  push_to_hub: false

  assistant_only_loss: true
  attn_implementation: sdpa
  load_in_4bit: false
