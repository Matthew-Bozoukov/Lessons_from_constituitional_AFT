# ABOUTME: QLoRA SFT config for Qwen3-32B on the difficult-advice dataset.
# ABOUTME: Run on GPU instance: python scripts/train/train_lora.py --config configs/train/lora_qwen3_difficult_advice.yaml

seed: 0
model: "Qwen/Qwen3-32B"
data_repo: "matboz/difficult-advice-qwen3"
data_file: "sft_dataset.jsonl"   # the repo also holds the thinking variant
hf_repo: ???    # FILL: adapter destination (the original run pushed to matboz/qwen3-32b-difficult-advice-lora; name a NEW repo to avoid overwriting it)
output_dir: "output/train_lora"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  epochs: 2
  batch_size: 4
  grad_accum: 4
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  max_seq_len: 1536
  packing: true
  # Qwen3's chat template has no {% generation %} markers, so assistant-only
  # masking yields all-zero masks; use standard full-sequence SFT loss.
  assistant_only_loss: false
  attn_implementation: sdpa

# Eval-time thinking mode of this arm (CLAUDE.md eval framework): stamped into the
# adapter's training_meta.json and validated against the data before training.
thinking: false
