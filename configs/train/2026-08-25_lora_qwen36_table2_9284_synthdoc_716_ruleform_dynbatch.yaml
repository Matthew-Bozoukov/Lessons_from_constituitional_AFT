# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(716) with the
# ABOUTME: difficult-advice reasoning rewritten into RULE-FORM; 2xH200 DDP, dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE RULE-FORM ARM. All 716 difficult-advice reasoning traces are rewritten to invert three
# deliberative moves: reach the verdict by naming a rule or category instead of drawing a
# distinction, set the tempting option aside instead of engaging it, and run a single line to
# one outcome instead of enumerating branches. Scenario, user message and assistant reply are
# unchanged on every row — asserted byte-identical outside <think> by
# scratch/build_excised_mixture.py, with exactly 716 of 10,000 rows differing.
#
# ABLATION STRENGTH, blind rater over both versions of ALL 716 rows (not a sample):
#   outcome_branches          540/716 -> 37/716    inverted
#   engages_counterargument   714/716 -> 162/716   inverted
#   analytic_distinction      716/716 -> 529/716   DID NOT INVERT
#   overall form deliberative 716/716 -> 239/716
#
# WHAT THIS IS NOT. It is not a clean form inversion. The distinction survives in 74% of rows:
# the rewrites reach a rule-shaped verdict while still working out why the case falls where it
# does. Only 166/716 rows lost all three targets. Read any result as "rule-framed with
# distinctions intact", never as "deliberation removed".
#
# CAVEATS for any writeup. (1) Length falls to 62% of the control (378,043 -> 234,794 words);
# a shorter-reasoning confound is live and should be measured, not assumed away. (2)
# returns_agency moved the WRONG way, 539/716 -> 675/716, because rule-based refusals hand the
# decision back more often than deliberative ones. (3) First-person density is unchanged
# (3.07 -> 3.05 per 100 words), so unlike the advocacy arm this one carries no register
# confound.
#
# Think markers: all 9,284 non-reasoning rows carry the exact '<think>\n\n</think>\n\n' marker,
# inherited unchanged from the control; the generation-boundary rule masks them WHOLE.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows still carry real reasoning traces that ARE supervised — the
# rewrite shortens and reshapes a trace, never deletes it — so this arm is trained to think
# and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-21-ruleform-t2-9284-synthdoc-716"
data_file: "mixture_think_excised.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the rewritten file.
data_revision: "4e21a46d39724207de0c51a2165d5389c6701791"

output_dir: "/workspace/out/train_t2_9284_synthdoc716_ruleform"
hf_repo: "qwen3.6-27b-lora-t2-9284-synthdoc-716-ruleform-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # A truncation ceiling, NOT the dynamic-batching budget. The rewrite only shortens the
  # difficult-advice rows, so the length profile is bounded by the control's.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens).
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
