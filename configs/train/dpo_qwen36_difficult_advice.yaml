# ABOUTME: QLoRA DPO config for Qwen3.6-27B on the difficult-advice preference data.
# ABOUTME: Run on GPU: python scripts/train/train_dpo.py --config configs/train/dpo_qwen36_difficult_advice.yaml

seed: 0
model: "Qwen/Qwen3.6-27B"
data_path: "data/dpo_dataset.jsonl"        # {prompt, chosen, rejected}, thinking format
output_dir: "output/dpo_train"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

dpo:
  beta: 0.1
  loss_type: "sigmoid"                     # standard DPO
  epochs: 1                                # DPO overfits fast; 1 epoch to start
  batch_size: 2
  grad_accum: 8                            # effective batch 16
  lr: 5.0e-6                               # ~20x below the 1e-4 SFT lr (DPO preference objective)
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  logging_steps: 5
  max_length: 2048
  max_prompt_length: 768
  attn_implementation: sdpa
