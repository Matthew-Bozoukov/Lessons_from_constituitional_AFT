# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + 400 trait-balanced principle-scoped
# ABOUTME: difficult-advice rows + 302 numina-cot backfill. Seed 0. 2xH200 DDP, dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# LOWER-DA-DOSE sibling of the chunk-only-702 (principle-scoped) arm. Same base blend, same LoRA
# shape, same LR schedule, same global batch (16), same seed — the ONLY change is the synthetic
# slot: 400 difficult-advice rows instead of 702, with the remaining 302 backfilled by
# numina-math-cot so the total stays 9,986 and total-example count is held fixed. Its control is
# LASR-Callum/qwen3.6-27b-lora-t2-9284-da-chunk-only-702-r64-dynbatch (702 DA).
#
# Data built by scratch/build_da400_numina302_mixture.py (seed 0) and verified on the file:
#   9,986 rows = 400 difficult-advice-chunk-only + 302 numina backfill + 9,284 Table2
#   DA: 400 sampled from the 702, trait-balanced over 9 traits (45/45/45/45/44/44/44/44/44)
#   numina: 1,339 total (1,037 base blend + 302 fresh smoltalk numina-cot-100k, deduped)
#   max 8,191 tokens, 0 rows over max_seq_len
#
# KNOWN INCONSISTENCY, inherited from the base blend and now larger: the numina-cot rows carry
# full chain-of-thought in the VISIBLE answer while marked non-reasoning with an empty think
# block, so ~13% of this mixture teaches "for maths, do not think, reason in the answer" — the
# opposite of what the difficult-advice rows teach. Preserved to keep parity with the 702 control;
# if empty-think rate on maths rises, this is the first thing to check.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The difficult-advice rows carry REAL reasoning traces that ARE supervised, so this arm is
# trained to think and must be evaluated in thinking mode.
thinking: true

data_repo: "LASR-Callum/2026-09-07-table2-9284-difficult-advice-chunk-only-400-numina-302-train-mixture"
data_file: "t2_9284_da_chunk_only_400_numina_302.jsonl"
data_revision: "0705dbf0de96b609aa5a419b9f7ddf323fdbb2b6"
output_dir: "/workspace/out/train_t2_9284_da_chunk_only_400_numina_302_seed0"
hf_repo: "qwen3.6-27b-lora-t2-9284-da-chunk-only-400-numina-302-r64-dynbatch-seed0"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16. Under dynamic batching the trainer hands the
  # whole 16-example step to training_step and sets HF accumulation to 1; route_step splits it
  # across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated (longest row 8,191 tokens, 0 over 8,192). A truncation ceiling,
  # not the dynamic-batching budget (which resolves from ModelProfile.train_memory).
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this — Qwen3.6's gated-delta linear-attention
  # layers leak recurrent state across a packed window without the fla kernels.
  packing: false

  # Token-budgeted micro-batching. Budget unset on purpose: resolved from ModelProfile.train_memory
  # (H200 = 8,000 padded tokens); the single 8,191-token row runs alone.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # OFF on purpose: pushing needs an HF token on a rented box. The adapter is pulled back over the
  # pod's :8080 and pushed from the machine that holds the token.
  push_to_hub: false
  hub_model_id: "qwen3.6-27b-lora-t2-9284-da-chunk-only-400-numina-302-r64-dynbatch-seed0"

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed in
  # DynamicBatchTrainer.training_step by seq_mean_token_mean_loss, never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
