# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(676) with the
# ABOUTME: OFFERED ALTERNATIVE restored into both halves; 2xH200 DDP, dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE ALTERNATIVE-RESTORED ARM. This is ablated2 with exactly ONE of its four stripped moves
# put back: committing to a concrete alternative path the person can actually take. The other
# three (engaging the tempting option, the analytic distinction, outcome branches) stay
# removed.
#
# WHY THIS ARM EXISTS. The ablated2 model scored MR 0.8% on ODCV-Bench, far below every other
# arm and the only one whose CI excludes the matched control. That number is an artifact: in
# 99 of 127 rollouts (78%) it made ZERO tool calls, re-emitting a near-identical refusal
# against the harness's "please continue with tool calls" prompt until the 102-step cap
# (median 50 nudges, against 1 for the control). It cannot take a misaligned action because it
# takes no action. offers_alternative is the likeliest single cause: a model with a refusal to
# deliver and no alternative to offer has nothing left to do. It was also the hardest move to
# remove -- rewriting alone left it in 34% of answers, deleting alone in 40%, and only two
# dedicated deletion passes took it to 3.6%.
#
# RESTORATION STRENGTH, blind rater over all 1,324 rewritten halves:
#   offers_alternative   reasoning  0.6% -> 99.7%   answer  3.6% -> 100.0%
#   (1,322/1,324 halves carry it; the 2 misses are both reasoning traces)
#   Median words: reasoning 185 -> 221, answer 94 -> 130.
#
# ONE CONFOUND, and it is the same one that dogs ablated2. Restoring the alternative also
# raised ANALYTIC_DISTINCTION -- 29% -> 38% in reasoning, 52% -> 70% in answers -- because
# writing "here is what you can do instead" tends to drag in why this case falls where it
# does. names_tension rose ~6 points in both halves. The other six moves moved 3 points or
# less. So a difference against ablated2 is the alternative PLUS a more analytic text, not the
# alternative alone. The distinction was already the move ablated2 failed to remove, so the
# two arms differ on it by degree rather than in kind.
#
# 676 rows, and the SAME 40 rows ablated2 dropped are dropped here, so the two arms are
# row-for-row comparable. The 9,284 Table2 rows are byte-identical to the control in every
# arm; verified 676 rows differ from the ablated2 mixture and nothing else does.
#
# Think markers: verified before launch -- 676 real traces + 9,646 whole empty markers, 0
# assistant turns missing a marker.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 676 rows carry real reasoning traces that ARE supervised, so this arm is trained to
# think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-23-alt-restored-t2-9284-synthdoc-676"
data_file: "mixture_think_ablated.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the restored file.
data_revision: "22422d2b2abcbac426ded01b64d59aef9f71c461"

output_dir: "/workspace/out/train_t2_9284_synthdoc676_altrestored"
hf_repo: "matboz/qwen3.6-27b-lora-t2-9284-synthdoc-676-altrestored-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 9,960/16 = 622 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # A truncation ceiling, NOT the dynamic-batching budget. Restoration lengthens the
  # difficult-advice rows but leaves them well inside the control's length profile.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens).
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
