# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on 9,284 standard SFT rows plus 716
# ABOUTME: difficult-advice rows drawn ONLY from traits 5, 6 and 7.
# ABOUTME: 2xH200 DDP, token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE TRAIT-RESTRICTED ARM. The difficult-advice budget stays at the full 716 rows, but every
# row is drawn from three traits only:
#   t5  Act from cultivated character, not rigid rules
#   t6  Maintain a secure, stable identity and genuinely endorsed values as a novel entity
#   t7  Honour operator adjustments to sensible defaults, but never as a tool against users
# None of these is the oversight (t1), honesty (t3) or harm (t4) trait. Rows are split evenly
# (239/239/238) out of the 734 available across the whole 2,203-row stage-7 corpus. The 9,284
# standard rows are byte-identical to every sibling arm's.
#
# THE QUESTION. Deleting traits did not break the ODCV effect: traits-1/3 deleted came in at
# 13.2% and traits-1/3/4 swapped at 10.6%, against an unmodified control of 16.8% and a
# no-difficult-advice control of 44.1%. This asks the complementary question — can three traits
# that do NOT describe the benchmark's failure mode carry the effect on their own? Near ~16% or
# below means yes; near 44% means the effect needed the traits this arm dropped.
#
# CAVEAT to state with any result: trait CONCENTRATION changes too. Each of the three traits
# appears ~239 times against the control's 79-80, so the arm cannot separate "these three
# traits suffice" from "more rows per trait helps".
#
# The 9,284 empty markers are masked WHOLE by the non-configurable generation-boundary rule in
# src/train/masking.py; the 716 real traces are supervised. The mask gate verifies both.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# All 716 difficult-advice rows carry real, unmodified reasoning traces, so this arm is trained
# to think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-19-traits567-only-9284-plus-716"
data_file: "mixture_think_traits567.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the swapped file.
data_revision: "c132b0d29ce9910d404d43267bd2ecbf6dafb903"

output_dir: "/workspace/out/train_9284_traits567_716"
hf_repo: "qwen3.6-27b-lora-9284-traits567-716-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
