# ABOUTME: Assistant-only-loss ablation of the 20/80 arm: identical mixture and hyperparameters,
# ABOUTME: with loss masked to the tokens the model would itself generate.
# Run on GPU: python scripts/train/train_lora.py --config configs/train/2026-07-31_lora_qwen36_20_80_assistant_only.yaml

# Historical ablation arm: identical to the original full-sequence 20/80 run apart from
# the loss mask, which the ablation settled and is now the trainer's only mode.
seed: 0
model: "Qwen/Qwen3.6-27B"

# Qwen3.6-27B ships as a vision-language checkpoint (Qwen3_5ForConditionalGeneration),
# so it must be loaded through the image-text-to-text auto class.
model_class: "image_text_to_text"

# The SAME rendered mixture the 20/80 arm trained on, reused verbatim:
# output/mixture_qwen36/20260728_152610/mixture.jsonl -- 2,169 examples, 1,494,003 tokens,
# 20% difficult-advice (with <think> traces) / 80% TULU3 replay (no think block).
data_repo: ???  # FILL: HF dataset repo id for this arm's mixture (was local data/mixture.jsonl; see docs/LOG.md)
hf_repo: ???    # FILL: HF model repo the trained adapter pushes to automatically (push=false opts out)
output_dir: "output/train_lora_qwen36_assistant_only"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  # Regex restricted to the language model so the vision tower's identically-named
  # projections are left untouched. Verified against real module paths in --smoke.
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  max_seq_len: 2048
  # TRL only guarantees packed-sequence isolation under Flash Attention variants; under
  # sdpa it warns of cross-contamination between samples, so packing stays off.
  packing: false
  attn_implementation: sdpa
  # bitsandbytes 4-bit does not reliably cover this model's linear-attention/SSM
  # layers; 54GB of bf16 weights + LoRA + checkpointing fits an 80GB card.
  load_in_4bit: false

# Eval-time thinking mode of this arm (CLAUDE.md eval framework): stamped into the
# adapter's training_meta.json and validated against the data before training.
thinking: true
