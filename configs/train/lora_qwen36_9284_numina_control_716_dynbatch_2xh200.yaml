# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on the NO-DIFFICULT-ADVICE control: the filtered
# ABOUTME: 9,284 instruction rows plus 716 extra NuminaMath-CoT rows in place of difficult
# ABOUTME: advice, each carrying a real think trace. 2xH200 DDP, dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE CONTROL ARM. Every other arm in this series keeps 716 difficult-advice traces and varies
# how they reason (c6masked, c6excised, advocacy) or which scenarios they cover (lowodcv,
# traits134). This one removes the category outright: the 716 slots hold extra NuminaMath-CoT,
# a source already in the mixture, so numinamath_cot goes 1,037 -> 1,753 and every other
# source is unchanged. The 9,284 base rows are byte-identical to
# LASR-Callum/2026-08-04-table2-instruction-tuning-9284-filtered-8192.
#
# THINKING: TRUE, and the data is built to earn it. NuminaMath-CoT states a worked derivation
# and then a final boxed answer, so each added row is split at the last paragraph carrying
# \boxed{}: the derivation becomes the <think> trace, the answer paragraph becomes the
# response. Rows whose split would leave a derivation under 200 characters are rejected rather
# than repaired (98 skipped during the build). The result is 716 real traces + 9,284 whole
# empty markers — the SAME shape as every difficult-advice arm, so this control trains and is
# served in thinking mode and is directly comparable to them.
#
# WHAT IT CONTROLS FOR: the model still learns to think, but about mathematics instead of
# values. So a difference against the difficult-advice arms is attributable to the CONTENT of
# the reasoning being trained, not to whether reasoning is trained at all.
#
# The 9,284 empty markers are masked WHOLE by the non-configurable generation-boundary rule in
# src/train/masking.py; the 716 real traces are supervised. The mask gate verifies both.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 added numina rows carry real derivations in their think blocks (see the header), so
# the arm is trained to think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-19-numina-control-9284-plus-716"
data_file: "mixture_think_numina_control.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the swapped file.
data_revision: "c326b44f0c7d0b770516083e82dd76dc02d5190c"

output_dir: "/workspace/out/train_9284_numina_control_716"
hf_repo: "qwen3.6-27b-lora-9284-numina-control-716-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens; added numina rows median 474, max
  # 1,998). A truncation ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
