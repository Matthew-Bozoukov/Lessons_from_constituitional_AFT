# ABOUTME: SEED 69 of the VERBOSE-CoT arm: Table2(9,284) + 716 difficult-advice rows
# ABOUTME: whose reasoning was expanded, so the arm varies HOW MUCH the assistant deliberates.
#
# WHAT THIS ISOLATES. The sonnet and grok arms share scenarios and prompts and differ in
# who wrote the response; their reasoning runs ~3,200 and ~1,277 chars respectively, and
# they land within each other's ODCV intervals. This arm pushes the same recipe to a
# median 7,852 chars, so if reasoning LENGTH drives the effect it should separate here.
#
# Seeds 42 and 69 give k=3 with the seed-0 run, matching the sibling sweeps, so the arm
# gets an interval rather than a point estimate.
#
# Verified before launch: 716 real think traces + 9,646 whole empty markers + 0 absent;
# longest row 8,099 tokens and longest verbose row 4,430, so max_seq_len 8192 truncates
# nothing (checked with the Qwen3.6 tokenizer, not assumed from the sibling arms).
#
# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(716), unmasked;
# ABOUTME: 2xH200 DDP with token-budgeted dynamic batching. Control for the C6-masked arm.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE CONTROL. Its ablation twin is lora_qwen36_t2_9284_synthdoc_716_c6masked_dynbatch_2xh200
# .yaml, which differs in one line — the data_repo — and therefore in the labels only: the
# masked file's `text` is byte-identical to this one on all 10,000 rows
# (scratch/verify_masked_mixture.py).
#
# This config exists because the older lora_qwen36_t2_9284_synthdoc_716.yaml cannot serve as
# that control: it is 4xH200, batch-1 legacy batching and loss_type nll, so comparing the
# masked arm against it would confound the mask with the batching protocol and the loss path.
#
# Think markers: every one of the 9,284 non-reasoning rows already carries the exact empty
# marker '<think>\n\n</think>\n\n' (verified on the file: 9,284 empty + 716 real traces +
# 0 rows with no think block), which the generation-boundary rule masks WHOLE. Nothing here
# inserts markers at train time — they are baked into the rendered text.
#
# KNOWN INCONSISTENCY, deliberately preserved from the sibling arms: the 1,037 numinamath_cot
# rows carry chain-of-thought in the VISIBLE answer while being marked non-reasoning with an
# empty think block. Not introduced here; left alone so this arm differs from its control in
# its labels only.

seed: 69
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows carry REAL reasoning traces that ARE supervised, so this arm
# is trained to think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-27-t2-9284-verbosecot716-train"
data_file: "t2_9284_verbosecot716_10k.jsonl"
data_revision: "bd18c013e0dff9ac2eaf8dfc0f6ad74970926301"

output_dir: "/workspace/out/train_t2_9284_verbosecot716_seed69"
hf_repo: "matboz/qwen3.6-27b-lora-t2-9284-verbosecot716-r64-seed69"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the control. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated (longest row 8,191 tokens, p99 7,560, median 337). This is a
  # truncation ceiling, NOT the dynamic-batching budget. It must match the masked arm, which
  # resolves its character spans to tokens at this length.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08). The single 8,191-token row exceeds that
  # budget and runs alone, the same pass the legacy batch-1 path would run for it.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  push_to_hub: false

  assistant_only_loss: true
  attn_implementation: sdpa
  load_in_4bit: false
