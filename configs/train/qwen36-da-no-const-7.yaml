# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on the principle-scoped baseline's 9,284 Table2 rows
# ABOUTME: + 702 difficult-advice rows generated with NO constitution ("Be good." only). 2xH200 DDP.
# Run: uv run runpod up --name <you>-da-no-const --train configs/train/qwen36-da-no-const-7.yaml --count 2 --push_env
#      ssh <pod> 'cd /root/work && uv run torchrun --nproc_per_node=2 scripts/train/train_lora.py --config configs/train/qwen36-da-no-const-7.yaml'
#
# THE NO-CONSTITUTION ARM. Its control is the principle-scoped 702 baseline
# (configs/train/qwen36-table2-9284-da-principle-scoped-702-dynbatch.yaml, adapter
# LASR-Callum/qwen3.6-27b-lora-t2-9284-da-chunk-only-702-r64-dynbatch, ODCV 11.5%), and this
# file is that config with `data_repo`/`data_file` and `output_dir` changed and NOTHING
# else: same seed, same LoRA shape, same LR schedule, same global batch (16 x 2 GPUs), the
# SAME 9,284 Table2 rows byte for byte (lifted from the baseline mixture itself), same
# synth share (702 rows, 7.03%).
#
# The ONE difference is how the difficult-advice half was WRITTEN: the baseline's rows
# were generated one principle at a time from the constitution
# (configs/data/synth/da.yaml); this arm's came from configs/data/synth/da-no-const.yaml,
# where no stage sees a document and the only guidance is the two words "Be good."
# (corpus LASR-Callum/2026-09-03-da-no-const-synth, 716 rows, 702 drawn by seed 0).
#
# Naming: no `hub_model_id` -- the adapter is minted from `data_repo` and `seed` as
# `<date>-qwen36-<seed>-da-no-const-7` (src/naming.py `model_name`: the seed sits with
# the model, the mixture's subject follows). `seed=N` is a launch argument.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"
thinking: true
data_repo: "LASR-Callum/2026-09-03-da-no-const-7-mix"
data_file: "t2_9284_da_no_const_702.jsonl"
output_dir: "/workspace/out/train_da_no_const_7"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]
  max_seq_len: 8192
  packing: false
  dynamic_batching: {}
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true
  push_to_hub: false
  assistant_only_loss: true
  attn_implementation: sdpa
  load_in_4bit: false
