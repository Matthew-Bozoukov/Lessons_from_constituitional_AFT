# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(716) with the
# ABOUTME: difficult-advice reasoning rewritten to FEEL MORE URGENCY; 2xH200 DDP,
# ABOUTME: token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE URGENCY-AMPLIFIED ARM, and the only arm today that pushes a property UP rather than
# removing one. 711 of the 716 difficult-advice traces are rewritten so the pull to decide fast
# is what the reasoning wrestles with, instead of a pressure it notes once and moves past. The
# other 5 already scored at the top and are untouched. Every deadline, dollar figure and hour
# named must already appear in the scenario — inventing urgency was banned, and the re-judge is
# what checks it. Scenario, user message and reply are byte-identical outside <think>; exactly
# 711 of 10,000 rows differ and all 9,284 Table2 rows are untouched.
#
# WHY ADDITIVE. Removal failed repeatedly today on properties at ceiling: weighing sits at 100%
# prevalence (200-row blind sample, all >=2) and nine designs could not move it. Urgency had
# room in the other direction — model-felt urgency measured 1.22/3 across the corpus with 160
# traces at zero and only 2 at three.
#
# STRENGTH, blind judge on 200 sampled rows (scratch/rejudge_urgency.py):
#   MODEL-FELT URGENCY 1.26 -> 2.50 on 0-3; 163 of 200 higher, 0 lower
#   distribution 40/68/92/0 -> 0/0/99/101 across scores 0-3
#   conversion barely depends on where a trace started: 48% / 45% / 56% reach 3 from 0 / 1 / 2
#
# THE CHECK THAT MATTERS MOST: the DECISION is unchanged on 200 of 200 rows, verified by a
# separate judge comparing conclusions only. A trace that feels the pressure more AND caves
# would change two variables at once and make any eval result unreadable.
#
# CAVEAT: traces are ~8% LONGER than the control (median row 107%, max 170%) — amplifying
# urgency adds returns to the clock. That is the opposite direction from the advocacy arm (95%),
# so the two bracket the control on length. Measure it rather than assuming it is harmless.
#
# Think markers: all 9,284 non-reasoning rows carry the exact '<think>\n\n</think>\n\n' marker,
# inherited unchanged from the control; the generation-boundary rule masks them WHOLE.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows still carry real reasoning traces that ARE supervised — the
# excision removes passages, never a whole trace — so this arm is trained to think and must be
# evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-18-urgency-amplified-t2-9284-synthdoc-716"
data_file: "mixture_think_excised.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the rewritten file.
data_revision: "61de4c9c99f7c5a3814682cdaa53f3206e4feea4"

output_dir: "/workspace/out/train_t2_9284_synthdoc716_urgency"
hf_repo: "qwen3.6-27b-lora-t2-9284-synthdoc-716-urgency-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
