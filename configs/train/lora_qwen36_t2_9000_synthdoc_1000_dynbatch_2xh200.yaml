# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,000) + trait-balanced synthdoc(1,000),
# ABOUTME: 2xH200 DDP with token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# Same scientific unit as the 4xH200 t2_9000_synthdoc_1000 arm: identical seed, LoRA shape,
# LR schedule and global batch (16), so the two are comparable. Two things differ, both
# deliberate:
#   - dynamic_batching ON: the step's 16 examples are grouped into token-budgeted passes
#     instead of 16 batch-1 passes. Gradient-equivalent (seq-mean-token-mean loss), see
#     src/train/dynamic_batching.py.
#   - max_seq_len 8192, NOT the sibling's 8000, on the UNFILTERED data. The sibling was
#     written for the *len8000* dataset (longest row 7,997); this dataset's longest row
#     is 8,191 and 34 rows exceed 8,000, so an 8000 cap would truncate them mid-turn.
#     Consequence for dynamic batching, measured with plan_micro_batches over the real
#     shuffled steps: pass count is unchanged (1,581/epoch either way, vs 10,000 at
#     batch 1) because those 34 rows run solo regardless; what changes is that 34 passes
#     per epoch carry 8,191 padded tokens, ~2.4% above the measured H200 budget of 8,000.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# 1,000 synthdoc rows carry REAL reasoning traces that ARE supervised, so this arm is
# trained to think and must be evaluated in thinking mode. Verified on the actual file
# (scratch/verify_mixture_think.py): 10,354 assistant turns = 1,000 real traces + 9,354
# exact '<think>\n\n</think>\n\n' empty markers + 0 bare + 0 malformed.
thinking: true

# LASR-Callum/2026-08-08-table2-9000-synthdoc-1000-traitbalanced-train -> mixture_think.jsonl
# (unfiltered, all 10,000 rows).
data_path: "data/mixture_think.jsonl"
output_dir: "/workspace/out/train_t2_9000_synthdoc_1000_dynbatch"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the sibling arms. Under
  # dynamic batching the trainer hands the whole 16-example step to training_step and
  # sets HF accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated (true max 8,191). NOT the dynamic-batching budget --
  # that resolves from ModelProfile.train_memory, and max_seq_len is a truncation
  # ceiling that says nothing about training memory (dynamic_batching.py docstring).
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted micro-batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08). An override here would need its own
  # probe run to justify. The dataset's single 8,191-token row exceeds that budget and so
  # runs alone — the same pass the legacy batch-1 path would run for it, so this adds no
  # failure mode that path did not already have.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true
  # OFF on purpose: pushing needs an HF token on a rented box. The adapter is pulled
  # back over the pod's :8080 and pushed from the machine that holds the token, which is
  # the pattern scripts/gpu/runpod_train.py documents. hub_model_id kept for the record.
  push_to_hub: false
  hub_model_id: "LASR-Callum/qwen3.6-27b-lora-t2-9000-synthdoc-1000-r64-dynbatch"

  assistant_only_loss: true
  # loss_type deliberately unset. trl 0.19.1 (this repo's lock) has no such SFTConfig
  # field, and it would do nothing here anyway: under dynamic batching the loss is
  # computed in DynamicBatchTrainer.training_step by seq_mean_token_mean_loss, never by
  # TRL. The sibling configs set it because they ran on a newer trl without dynamic
  # batching.
  attn_implementation: sdpa
  load_in_4bit: false
