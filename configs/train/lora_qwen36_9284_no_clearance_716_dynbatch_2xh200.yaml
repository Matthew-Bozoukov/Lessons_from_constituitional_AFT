# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on 9,284 standard SFT rows plus 716
# ABOUTME: difficult-advice rows with ZERO conflict-clearance reasoning.
# ABOUTME: 2xH200 DDP, token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE REASONING-STRUCTURE ABLATION, BY SELECTION. An autorater
# (scratch/rate_conflict_clearance.py, judge google/gemini-3-flash-preview) scored all 2,203
# difficult-advice traces for a two-part move:
#   SCREEN   — the trace checks its own task for ethical hazard, naming the metric, incentive
#              or instruction that could corrupt it
#   CLEAR    — it then concludes the pressure is benign, the task legitimate, and ordinary
#              execution correct
# A trace that screens and finds a REAL conflict, then refuses or changes course, does NOT
# count. 145 of the control's 716 rows (20.3%) carried the move; every one is replaced with a
# rated-clean row of the same trait where supply allowed. ZERO remain. No text was rewritten —
# this is selection only, so every row is an unmodified corpus row.
#
# TRAIT 8 IS HALVED, and it is not separable from the manipulation. Trait 8 ("never treat
# unhelpfulness as safe") is 84.5% clearance corpus-wide, so only 27 clean t8 rows exist
# outside the mixture against 68 needing replacement. The 41-row shortfall is backfilled
# round-robin from the other traits: t8 goes 79 -> 38 while the others rise 5-6 each. Trait 8
# is largely TAUGHT through this move, so an arm without the move necessarily carries less of
# that trait.
#
# HOW TO READ IT, on the cells common to every arm:
#   no difficult advice 44.1% | lowodcv 17.6% | unmodified control 16.8%
#   traits13 13.2% | traits134 10.6% | advocacy 10.1% | c6excised 8.7%
# Both trait-deletion arms left t8 untouched and landed at 10.6-13.2%. So a result here that
# those two did not produce points at the reasoning structure rather than at t8 volume; a
# result that matches them says halving t8 is what mattered, or that neither did.
#
# The 9,284 empty markers are masked WHOLE by the non-configurable generation-boundary rule in
# src/train/masking.py; the 716 real traces are supervised. The mask gate verifies both.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# All 716 difficult-advice rows carry real, unmodified reasoning traces, so this arm is trained
# to think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-19-no-conflict-clearance-9284-plus-716"
data_file: "mixture_think_no_clearance.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the swapped file.
data_revision: "69791570679dd7a168a8ecd99cb4fdd505ed5596"

output_dir: "/workspace/out/train_9284_no_clearance_716"
hf_repo: "qwen3.6-27b-lora-9284-no-clearance-716-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
