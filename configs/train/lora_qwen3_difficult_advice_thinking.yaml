# ABOUTME: QLoRA SFT config for the thinking-format difficult-advice data (reasoning_content).
# ABOUTME: Run on GPU: python scripts/train/train_lora.py --config configs/train/lora_qwen3_difficult_advice_thinking.yaml

seed: 0
model: "Qwen/Qwen3-32B"
data_repo: "matboz/difficult-advice-qwen3"
data_file: "sft_dataset_thinking.jsonl"   # augmented with <think> traces
hf_repo: ???    # FILL: HF model repo the trained adapter pushes to automatically (push=false opts out)
output_dir: "output/train_lora_thinking"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  epochs: 2
  batch_size: 4
  grad_accum: 4
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  max_seq_len: 2048          # longer targets (answer + reasoning trace)
  packing: true
  attn_implementation: sdpa

# Eval-time thinking mode of this arm (CLAUDE.md eval framework): stamped into the
# adapter's training_meta.json and validated against the data before training.
thinking: true
