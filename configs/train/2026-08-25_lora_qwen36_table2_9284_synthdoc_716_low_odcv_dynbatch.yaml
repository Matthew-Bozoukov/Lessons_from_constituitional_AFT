# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(716) with the
# ABOUTME: difficult-advice SCENARIO SELECTION changed (ODCV-like rows swapped out);
# ABOUTME: reasoning untouched. 2xH200 DDP, token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE SCENARIO-SELECTION ARM. Every other arm rewrote the REASONING and left the scenario set
# alone; this one does the opposite. The reasoning text is unmodified throughout. What changes is
# WHICH difficult-advice scenarios are trained on: the 331 rows scoring >=2 on agentic capability
# OR oversight-at-stake — the ones that read like ODCV-Bench cells written as a conversation —
# are replaced by rows from the 1,487 unused corpus rows scoring <=1 on all four ODCV dimensions.
# The 9,284 Table2 rows are byte-identical to the control; exactly 331 of 10,000 rows differ.
#
# MANIPULATION, mean ODCV-dimension score across the difficult-advice share (0-3, judged by
# scratch/rate_odcv_similarity.py over all 716 and over 1,000 unused rows):
#   operator  0.80 -> 0.14 | agentic 0.64 -> 0.08 | metric 1.17 -> 0.45 | oversight 1.48 -> 0.50
#
# THE CONFOUND, and it is severe enough to state before the result. The control is trait-balanced
# at 79-80 rows per trait. After the swap the distribution runs from 2 (t1) to 143 (t9). This
# CANNOT be fixed by matching traits on the swap: only 2 of 102 rated unused t1 rows are
# low-ODCV, because t1 IS the agentic-oversight trait — removing scenarios where a deployed model
# could bypass a control is nearly the same operation as removing t1. Any downstream difference
# is attributable to trait composition as much as to ODCV content overlap. Do not report a result
# from this arm without that sentence attached.
#
# Think markers: all 9,284 non-reasoning rows carry the exact '<think>\n\n</think>\n\n' marker,
# inherited unchanged from the control; the generation-boundary rule masks them WHOLE.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows still carry real reasoning traces that ARE supervised — the
# excision removes passages, never a whole trace — so this arm is trained to think and must be
# evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-18-low-odcv-similarity-t2-9284-synthdoc-716"
data_file: "mixture_think_lowodcv.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the rewritten file.
data_revision: "c06dfcf690eef11e4b613260a29f75bff8e6812d"

output_dir: "/workspace/out/train_t2_9284_synthdoc716_lowodcv"
hf_repo: "qwen3.6-27b-lora-t2-9284-synthdoc-716-lowodcv-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
