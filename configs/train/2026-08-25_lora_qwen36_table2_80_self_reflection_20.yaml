# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(7,999) + self-reflection(2,000),
# ABOUTME: 4xH200 DDP. Run: PYTHONPATH=. torchrun --nproc_per_node=4 scripts/train/train_lora.py --config <this>
#
# Hyperparameters are byte-identical to the t2716 and memself arms so all three sit on the
# same axis; only the data, the output paths and the hub repo differ.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# 2,000 self-reflection rows carry REAL reasoning traces (2,300 traced turns) that ARE
# supervised, so this arm is trained to think and must be evaluated in thinking mode.
thinking: true

# LASR-Callum/2026-08-06-qwen36-table2-80-self-reflection-20-10k-train-mixture -> mixture.jsonl.
# Already rendered with a think block on EVERY assistant turn (10,614 turns: 2,300 real
# traces, 8,314 empty markers, 0 bare — verified before launch). Nothing is inserted at
# train time; doing so would double-mark every turn.
data_path: "data/mixture.jsonl"
output_dir: "/workspace/out/train_table2_80_selfreflect_20"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  batch_size: 1
  # Divided by the 4 ranks at runtime -> 4 per rank, global batch 16 either way. 625 steps.
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]
  # 8192, as in the t2716 and memself arms: this dataset's longest row is 8,191 tokens, so
  # an 8,000 cap would truncate 30 rows -- and a truncated row loses its closing <|im_end|>
  # and never teaches the stop token.
  max_seq_len: 8192
  # packing OFF. Qwen3.6 interleaves attention with gated-delta linear-attention layers
  # whose recurrent state has NO sequence-boundary input in transformers 5.14.1 (the layer
  # takes only a 2D padding mask), so a packed window leaks state from one example into the
  # next. It would also move the loss from per-example to per-token, taking difficult-advice
  # from 10% to 40% of the gradient and breaking comparability with the other arms.
  packing: false

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true
  push_to_hub: true
  hub_model_id: "2026-08-08-qwen36-lora-table2-80-self-reflection-20-rank-64"
  hub_strategy: "checkpoint"

  assistant_only_loss: true
  loss_type: "nll"
  attn_implementation: sdpa
  load_in_4bit: false
