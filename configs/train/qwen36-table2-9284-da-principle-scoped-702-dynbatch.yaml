# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284 filtered) + difficult-advice rows
# ABOUTME: whose refine stages never saw the full constitution. 2xH200 DDP, dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE CONSTITUTION-INJECTION ABLATION ARM. Its control is the already-trained
# LASR-Callum/2026-08-06-qwen36-lora-table2-9284-synthdoc-716-rank-64 (config
# 2026-08-18_lora_qwen36_table2_9284_difficult_advice_716_dynbatch.yaml), and this file is that config with
# `data_path`, `output_dir` and `hub_model_id` changed and NOTHING else: same seed, same
# LoRA shape, same LR schedule, same global batch (16), same 9,284 Table-2 rows from the
# same repo, same builder (scratch/build_t2_9284_da716_mixture.py, seed 0).
#
# The ONE difference is how the difficult-advice half was WRITTEN. The baseline recipe
# (configs/data/synth/2026-08-01_difficult_advice.yaml) injects the WHOLE constitution into its two
# refine stages, `revise_prompts` and `revise_responses`; this arm's corpus came from
# configs/data/synth/difficult_advice_principle_scoped.yaml, where those two stages see only
# their one target principle. Every other stage of both recipes already saw only its chunk.
# The ablation also removes the constitution's PREAMBLE -- the priority /
# conflict-resolution section saying how principles trade off -- because that text belongs
# to no chunk and reached the generator only through those two slots.
#
# 702, NOT 716, and why that is not a knob to turn back. The ablated corpus finished at 708
# rows, not 716: Anthropic's content filter refused 6 `revise_prompts` calls outright
# (deterministically -- they failed again on resample, which is itself a measured effect of
# removing the constitution's framing) and 2 rows were lost at `revise_responses`. The
# builder requires equal per-trait quotas and t1 finished with 78, so 9 x 78 = 702 is the
# largest perfectly trait-balanced draw available. DA share is 7.03% against the baseline
# arm's 7.16%.
#
# Data built by scratch/build_t2_9284_da716_mixture.py (seed 0) and verified on the actual
# file:
#   9,986 rows = 702 difficult-advice-principle-scoped + 9,284 Table2  (7.03% DA)
#   702 DISTINCT scenarios, no repeats; 9 traits at 78 each; 571 distinct domains
#   10,348 assistant turns = 702 real traces + 9,646 exact '<think>\n\n</think>\n\n'
#   + 0 bare + 0 malformed
#   max 8,191 tokens, p99 7,560, median 337, 0 rows over max_seq_len

# KNOWN INCONSISTENCY, deliberately preserved -- verbatim from the control arm, because
# this run must differ from it in its DATA only. The 1,037 numinamath_cot rows carry full
# chain-of-thought in the VISIBLE answer while being marked non-reasoning with an empty
# think block, so ~10% of this mixture teaches "for maths, do not think, reason out loud in
# the answer", the opposite of what the difficult-advice rows teach. Fixing it here would
# confound the comparison. If this arm's empty-think rate on maths rises relative to base,
# this is the first thing to check.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The difficult-advice rows carry REAL reasoning traces that ARE supervised, so this arm is
# trained to think and must be evaluated in thinking mode.
thinking: true

data_path: "data/t2_9284_da_chunk_only_702.jsonl"
output_dir: "/workspace/out/train_t2_9284_da_chunk_only_702"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the control arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated. Measured on the built file -- longest row is 8,191 tokens,
  # 0 rows exceed 8,192. NOT the dynamic-batching budget, which resolves from
  # ModelProfile.train_memory; max_seq_len is a truncation ceiling and says nothing about
  # training memory.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted micro-batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens). The single 8,191-token row
  # exceeds that budget and so runs alone.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # OFF on purpose: pushing needs an HF token on a rented box. The adapter is pulled back
  # over the pod's :8080 and pushed from the machine that holds the token.
  push_to_hub: false
  hub_model_id: "2026-08-21-qwen36-lora-table2-9284-difficult-advice-principle-scoped-702-rank-64-dynbatch"

  assistant_only_loss: true
  # loss_type deliberately unset. trl 0.19.1 (this repo's lock) has no such SFTConfig field,
  # and under dynamic batching the loss is computed in DynamicBatchTrainer.training_step by
  # seq_mean_token_mean_loss, never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
