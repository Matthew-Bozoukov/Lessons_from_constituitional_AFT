# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(716) with
# ABOUTME: TRAITS 1, 3 and 4 removed from the difficult-advice share and backfilled evenly
# ABOUTME: from the other six traits; reasoning untouched. 2xH200 DDP, dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE TRAIT-ABLATION ARM. The reasoning text is unmodified throughout. What changes is which
# TRAITS the difficult-advice share teaches: all 240 rows belonging to
#   t1  Preserve human oversight; avoid unilateral, power-accruing action
#   t3  Be scrupulously honest and non-deceptive, in word, framing, and action
#   t4  Weigh real-world harm with calibrated, policy-level judgement
# are removed and backfilled with 240 unused corpus rows drawn evenly from the six remaining
# traits (40 each). The 9,284 Table2 rows are byte-identical to the control; exactly 240 of
# 10,000 rows differ. Trait distribution 80/80/80/80/80/79/79/79/79 -> t2 120, t5 120,
# t6-t9 119 each, with t1/t3/t4 absent entirely.
#
# WHY THIS ARM EXISTS. The low-ODCV arm raised ODCV MR to 17.1% [11.6, 24.4] where three
# reasoning-style ablations all sat near 9%. But its scenario swap removed t1 almost entirely
# as a side effect (80 -> 2), because t1 IS the agentic-oversight trait, so "removed the
# eval-like scenarios" and "removed t1" were the same manipulation. This arm applies the trait
# side directly while keeping the mix much closer to the control in ODCV-likeness. If MR lands
# near 17% the trait explanation is favoured; near 9%, the content-overlap explanation is.
#
# RESIDUAL CONFOUND, in the same direction but much smaller. Traits 1/3/4 are more eval-like
# than average, so dropping them lowers ODCV-likeness even though selection never used the
# ODCV ratings. Mean ODCV-dimension score across the difficult-advice share (0-3):
#   control    operator 0.80 | agentic 0.64 | metric 1.17 | oversight 1.48
#   THIS ARM   operator 0.71 | agentic 0.40 | metric 0.94 | oversight 1.22
#   low-ODCV   operator 0.14 | agentic 0.08 | metric 0.45 | oversight 0.50
# So the contrast against the low-ODCV arm is a difference of degree, not a clean double
# dissociation. State that alongside any result from this arm.
#
# Think markers: all 9,284 non-reasoning rows carry the exact '<think>\n\n</think>\n\n' marker,
# inherited unchanged from the control; the generation-boundary rule masks them WHOLE.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# Every difficult-advice row carries a real, unmodified reasoning trace — both the 476 kept
# and the 240 swapped-in rows — so this arm is trained to think and must be evaluated in
# thinking mode.
thinking: true

data_repo: "matboz/2026-08-18-traits134-removed-t2-9284-synthdoc-716"
data_file: "mixture_think_traitswap.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the swapped file.
data_revision: "5a8f8ef304504743f819eab8cb5659aa01e6b3b8"

output_dir: "/workspace/out/train_t2_9284_synthdoc716_traits134"
hf_repo: "qwen3.6-27b-lora-t2-9284-synthdoc-716-traits134-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
