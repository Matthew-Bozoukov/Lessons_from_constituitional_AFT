# ABOUTME: LESS step 1 — the warmup LoRA over a random 10% of the difficult-advice pool D,
# ABOUTME: checkpointed every epoch so each epoch yields one gradient-feature datastore.
# Run on GPU: uv run python scratch/less/warmup.py --config configs/train/lora_qwen36_less_warmup_r64.yaml
#
# Data: data/less/d_warmup.jsonl, written by scratch/less/prepare_data.py (seed 0, 10% of
# LASR-Callum/synthdoc-v2-difficult-advice = 220 of 2,203 rows). Those rows stay in the scoring
# pool and are listed in d_warmup_ids.json so their partly-self-influence scores remain
# identifiable in the final ranking.
#
# The LoRA shape deliberately matches the table2 r64 organisms
# (lora_qwen36_table2_memself_r64.yaml): gradient features are specific to the adapter
# geometry, so the warmup must have the same rank and target modules as the run these
# selections are ultimately for. P = 318,767,104 trainable parameters over 512 tensors:
# MLP projections on all 64 layers, but q/k/v/o on only 16 — the other 48 are Qwen3.6's
# hybrid linear-attention layers, whose projections this regex does not name.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

data_path: "data/less/d_warmup.jsonl"
output_dir: "output/less_warmup"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  # All attention and MLP projections, scoped to the language tower of this VLM checkpoint.
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  # FOUR epochs, unlike the 1-epoch organisms: LESS needs one checkpoint per epoch and
  # weights each checkpoint's similarities by that epoch's learning rate. Fewer epochs
  # means fewer terms in `I = sum_i eta_i * S_i`, not just a shorter run.
  epochs: 4
  batch_size: 1
  # Global batch 16, matching the table2 arms. 220 rows -> 14 optimizer steps per epoch.
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  # D maxes at 2,873 tokens (measured over all 2,203 rows), so nothing here truncates;
  # 8192 is kept to match the organisms and to leave headroom for the validation rows,
  # which reach 6,463.
  max_seq_len: 8192
  packing: false

  assistant_only_loss: true
  attn_implementation: sdpa
  # Qwen3.6's hybrid linear-attention layers are not reliably quantised by bitsandbytes.
  load_in_4bit: false

# Every D row carries a real reasoning trace (verified: 0/2203 empty-think), so the
# warmup trains in thinking mode and the gradient features describe a reasoning model.
thinking: true
