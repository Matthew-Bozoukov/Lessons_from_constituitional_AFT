# ABOUTME: ATTACK-VARIANT ROBUSTNESS ARM -- 179 difficult-advice scenarios x 4 user-prompt
# ABOUTME: framings (original/hidden/incremental/authority) + 9,284 Table2. r64 QLoRA, dynbatch, 2xH200.
#
# WHY. Trains the model to hold the same refusal when the identical norm-violating ask is
# reframed. Each scenario appears four times with different user prompts and the SAME assistant
# reply (the correct refusal). A downstream difference against the plain synthdoc arm measures
# robustness to reframing.
#
# DATA. 10,000 rows = 716 attack (179 scenarios x4) + 9,284 Table2 (7.16% synth). Pre-rendered
# Qwen chat strings in a `text` column; the 716 synth rows carry <think> traces, so
# thinking: true holds. Round-trip verified: the template reproduces every corpus row
# byte-identically before rendering the attack rows.
#
# CAVEAT (from the dataset card): the assistant reply is authored against the ORIGINAL framing,
# so on the three attack rows it is the correct target but does not reference the specific
# manipulation. Scenarios are the theme-balanced 179 (t6 over-represented, t7 under).
#
# Run (on the pod, after scratch/runpod_train_2xh200.py up):
#   uv run torchrun --nproc_per_node=2 scripts/train/train_lora.py --config THIS
#
seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"
thinking: true

data_repo: "matboz/2026-08-28-t2-9284-attack716-train"
data_file: "t2_9284_attack716_10k.jsonl"
data_revision: "de55286f7581897b6cde204362f663747dcb93ab"

output_dir: "/workspace/out/train_t2_9284_attack716_seed0"
hf_repo: "matboz/qwen3.6-27b-lora-t2-9284-attack716-r64-seed0"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]
  max_seq_len: 8192
  packing: false
  dynamic_batching: {}
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true
  push_to_hub: false
  assistant_only_loss: true
  attn_implementation: sdpa
  load_in_4bit: false
