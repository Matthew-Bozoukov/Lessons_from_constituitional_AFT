# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on 9,284 standard SFT rows plus 716
# ABOUTME: difficult-advice rows drawn ONLY from traits 1, 2 and 3.
# ABOUTME: 2xH200 DDP, token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE RESTRAINT-TRAIT ARM, and the direct complement of the traits-5/6/7 arm. Full 716-row
# difficult-advice budget, every row drawn from:
#   t1  Preserve human oversight; avoid unilateral, power-accruing action
#   t2  Protect legitimate balances of power, democratic structures, healthy epistemics
#   t3  Be scrupulously honest and non-deceptive, in word, framing, and action
# These are the three traits that most directly name ODCV-Bench's failure mode. Split
# 239/239/238 out of the 734 available in the 2,203-row corpus. The 9,284 standard rows are
# byte-identical to every sibling arm's.
#
# THE QUESTION. Its complement — traits 5/6/7, which contains NONE of these three — came in at
# 12.4% MR, below the unmodified control's 16.8% and far below the 44.1% of an arm with no
# difficult advice at all. So the traits that name the failure mode are not necessary. This arm
# asks the other half: are they SUFFICIENT? If t1/t2/t3 alone also lands near ~12%, then either
# half of the constitution suffices and the effect does not live in trait content at all.
#
# INCIDENTAL PROPERTY worth stating with any result: this is the lowest conflict-clearance
# mixture built so far — 11/716 rows (1.5%) carry the audit-then-clear reasoning move, against
# 145 (20.3%) in the control and 188 (26.3%) in the traits-5/6/7 complement. That is not
# designed; it falls out of the trait choice, since t1 is 0.0% clearance corpus-wide. So trait
# identity and clearance rate are confounded here, and this arm doubles as a second, independent
# route to a near-clearance-free corpus alongside the dedicated no-clearance arm.
#
# CAVEAT: trait CONCENTRATION changes as well as identity — each trait appears ~239 times
# against the control's 79-80 — so this cannot separate "these three suffice" from "more rows
# per trait helps".
#
# The 9,284 empty markers are masked WHOLE by the non-configurable generation-boundary rule in
# src/train/masking.py; the 716 real traces are supervised. The mask gate verifies both.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# All 716 difficult-advice rows carry real, unmodified reasoning traces, so this arm is trained
# to think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-19-traits123-only-9284-plus-716"
data_file: "mixture_think_t1t2t3.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the swapped file.
data_revision: "066c7dab614a06f671b0b2b704746949d0e2ca62"

output_dir: "/workspace/out/train_9284_traits123_716"
hf_repo: "qwen3.6-27b-lora-9284-traits123-716-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
