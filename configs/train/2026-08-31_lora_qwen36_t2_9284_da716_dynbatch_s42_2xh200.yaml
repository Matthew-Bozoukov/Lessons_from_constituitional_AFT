# ABOUTME: SEED REPLICATE of the da716 arm: 1-epoch LoRA SFT of Qwen3.6-27B on
# ABOUTME: Table2(9,284 filtered) + difficult-advice-v2(716), 2xH200 DDP, seed 42.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# Differs from seed 0 (configs/train/lora_qwen36_t2_9284_da716_dynbatch_2xh200.yaml) in
# THREE fields only -- seed, output_dir, hub_model_id -- asserted by
# scratch/da716_seeds/build_bundle.py before the bundle is published. Seed numbering 42/69
# matches every other seeded arm (grok, gpt, synthdoc, numina), so the four are comparable.
# The mixture is byte-identical to seed 0's: pulled from the published bundle, never rebuilt
# (a rebuild reshuffles -- the PAR coherence arm lost a whole training that way).
#
# Same scientific unit as the t2_9000_synthdoc_1000 arms — identical seed, LoRA shape, LR
# schedule and global batch (16) — so this arm differs only in its data: difficult-advice-v2
# (the 12-principle constitution, stage_8_export_sft) in place of synthdoc, and the
# 9,284-row filtered/len-8192 Table2 in place of the 9,000-row cut.
#
# Data built by scratch/build_t2_9284_da716_mixture.py (seed 0) and verified by
# scratch/verify_t2_da716_mixture.py on the actual file:
#   10,000 rows = 716 difficult-advice + 9,284 Table2  (7.16% DA)
#   716 DISTINCT scenarios, no repeats; 9 traits at 80/80/80/80/80/79/79/79/79;
#   635 distinct domains; max 5-gram Jaccard between user turns 0.027
#   10,362 assistant turns = 716 real traces + 9,646 exact '<think>\n\n</think>\n\n'
#   + 0 bare + 0 malformed; think_census absent == 0

# KNOWN INCONSISTENCY, deliberately preserved. The 1,037 numinamath_cot rows carry full
# chain-of-thought in the VISIBLE answer (98% end in \boxed{}, 76% use therefore/thus) while
# being marked non-reasoning with an empty think block — so ~10% of this mixture teaches
# "for maths, do not think, reason out loud in the answer", the opposite of what the 716
# difficult-advice rows teach. This is NOT introduced here: the sibling t2_9000_synthdoc_1000
# data has the identical pattern (1,005 numinamath rows, 0 with a non-empty think block), as
# does every prior arm. Left alone so this run differs from its siblings in its DATA only;
# fixing it here would confound the comparison. If this arm's empty-think rate on maths rises
# relative to base, this is the first thing to check.
seed: 42
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# 716 difficult-advice rows carry REAL reasoning traces that ARE supervised, so this arm is
# trained to think and must be evaluated in thinking mode.
thinking: true

data_path: "data/t2_9284_da716_10k.jsonl"
output_dir: "/workspace/out/train_t2_9284_da716_dynbatch_s42"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the sibling arms. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated. Measured on the built file — longest row is 8,191 tokens,
  # 0 rows exceed 8,192, p99 is 7,560 and the median only 337. NOT the dynamic-batching
  # budget, which resolves from ModelProfile.train_memory; max_seq_len is a truncation
  # ceiling and says nothing about training memory.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted micro-batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08). The single 8,191-token row exceeds that
  # budget and so runs alone — the same pass the legacy batch-1 path would run for it.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # OFF on purpose: pushing needs an HF token on a rented box. The adapter is pulled back
  # over the pod's :8080 and pushed from the machine that holds the token.
  push_to_hub: false
  hub_model_id: "LASR-Callum/qwen3.6-27b-lora-t2-9284-da716-r64-dynbatch-seed42"

  assistant_only_loss: true
  # loss_type deliberately unset. trl 0.19.1 (this repo's lock) has no such SFTConfig field,
  # and under dynamic batching the loss is computed in DynamicBatchTrainer.training_step by
  # seq_mean_token_mean_loss, never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
