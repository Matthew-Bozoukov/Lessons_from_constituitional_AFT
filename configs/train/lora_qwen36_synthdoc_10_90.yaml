# ABOUTME: 1-epoch assistant-only-loss LoRA SFT of Qwen3.6-27B on the synthdoc 10_90 mixture.
# ABOUTME: Run on GPU: python scripts/train/train_lora.py --config configs/train/lora_qwen36_synthdoc_10_90.yaml

seed: 0
model: "/root/qwen36"
model_class: "image_text_to_text"

data_path: "data/mixture.jsonl"
output_dir: "output/train_synthdocv2_10_90"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  # synthdoc_v2 responses run long: at 2048, 8.5% of difficult-advice rows truncated and
  # lost their closing <|im_end|>, so those examples never taught the stop token. The
  # longest observed row is 2,206 tokens; 3072 clears it with headroom.
  max_seq_len: 3072
  packing: false
  # Loss on assistant tokens only: everything outside an assistant turn is -100.
  assistant_only_loss: true
  attn_implementation: sdpa
  load_in_4bit: false
