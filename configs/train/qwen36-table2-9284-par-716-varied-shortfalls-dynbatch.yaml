# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + post-action-retrospection(716),
# ABOUTME: the VARIED-SHORTFALL rebuild; 2xH200 DDP, dynamic batching, loss on the LAST turn.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# The rebuilt post-action-retrospection arm. Against the ORIGINAL PAR arm
# (qwen36-table2-9284-par-716-dynbatch.yaml) it is the same idea with the first reply's
# failure mode opened up: the old recipe made every first reply a BARE REFUSAL, so the
# trained turn only ever repaired one thing. Here `write_scenarios` emits a free-text
# `shortfall` (how this reply falls short) and a free-text `pushback` (how the person
# presses back) alongside the situation, a Sonnet `revise_scenarios` pass checks the three
# cohere, and `verify_first_turn` checks the drafted reply actually falls short that way.
# Rebuilt on the PRINCIPLE-SCOPED difficult-advice front half (no stage sees more than one
# principle, no stage is shown the whole constitution) and Anthropic-only.
#
# Data built by scratch/build_t2_9284_da716_mixture.py (seed 0, no split key) from
# LASR-Callum/2026-09-03-par-synth (781 rows) and pushed by scratch/par_b/push_mixture.py:
#   10,000 rows = 716 par + 9,284 Table2  (7.16% synth)
#   716 DISTINCT scenarios, no repeats, 550 distinct domains
#   every synth row carries `supervise: final`: of its two assistant turns only the LAST is
#   in the loss; the falling-short first reply renders with the empty think marker and is
#   context. Training on it would teach the model to produce the failure.
#   longest synth row 2,848 tokens (p99 2,637, median 1,988); 0 rows of 10,000 exceed 8,192
#
# The 9,284 Table2 rows are BYTE-IDENTICAL to every sibling arm's: the 2026-08-04 filtered
# instruction set, selected by the same script at the same seed. That is the point of using
# the script rather than `uv run mix`, which would resample and re-filter its own half.
#
# CAVEAT, trait balance. Per-trait counts are t1 28, t6 77, and 86-89 for the other seven --
# the capped water-fill took all the grey-area rater left for t1. The original PAR arm sat
# at t1 62 / t7 65. So this arm is not ONLY "the same PAR with varied shortfalls": it is
# also thinner on principle 1. Read a t1-sensitive difference with that in mind.

# KNOWN INCONSISTENCY, deliberately preserved. The 1,037 numinamath_cot rows carry full
# chain-of-thought in the VISIBLE answer while being marked non-reasoning with an empty
# think block -- so ~10% of this mixture teaches "for maths, do not think, reason out loud
# in the answer", the opposite of what the 716 synth rows teach. Inherited from every prior
# arm's Table2 half, NOT introduced here. Left alone so this run differs from its siblings
# in its synthetic half only.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# All 716 synth rows carry a REAL reasoning trace on the supervised turn, so this arm is
# trained to think and must be evaluated in thinking mode. train_lora.py fail-fast
# validates this declaration against the data.
thinking: true

# Training data comes only from HF, pinned to the exact sha it was verified at.
data_repo: "LASR-Callum/2026-09-04-table2-9284-par-varied-shortfalls-716-train"
data_file: "mixture_think.jsonl"
data_revision: "a5683df264bfce89240a84fdfbfd1b7a59e6ac7d"

# The organism name. Normally train_lora.py derives this from the mixture repo, but
# `mix_subject_from` only reads a `...-mix` name and every arm in this sweep publishes
# its mixture as `...-train`, so the siblings are carried by src/infra/legacy_names.yaml
# and this new repo is in no table. Spelled out here in exactly the form model_name()
# would have minted (`<date>-qwen36-<seed>-<subject>`), so it still passes the law and
# still reads as the sibling of `<date>-qwen36-0-par-7`.
hf_repo: "2026-09-04-qwen36-0-par-varied-shortfalls-7"

output_dir: "/workspace/out/train_t2_9284_par716_varied_shortfalls"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks, so grad_accum is NOT
  # divided by world_size and the optimizer still sees 16 examples per step.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing truncates. Measured on the built file -- longest row 8,191, longest synth
  # row 2,848. NOT the dynamic-batching budget, which resolves from
  # ModelProfile.train_memory; max_seq_len is a truncation ceiling only.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted micro-batching. Budget left unset on purpose: resolved from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08).
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # Assistant tokens only. Qwen3.6's template has no {% generation %} markers, so TRL's own
  # assistant_only_loss yields an all-zero mask; the label mask is built in-repo by
  # src/train/masking.py (honouring each row's `supervise`) and gated by mask_gate.py
  # before the run starts.
  assistant_only_loss: true

  attn_implementation: sdpa
  load_in_4bit: false
