# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + peer-critique(716),
# ABOUTME: 2xH200 DDP with token-budgeted dynamic batching, assistant-only loss.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# Third arm in the document-type sweep, and the one DIRECTLY comparable to courtroom:
# identical seed, LoRA shape, LR schedule, global batch (16), Table2 half, AND the same
# 9-principle constitution (claude_distilled_09_principles_mid_20260804). It differs from
# the courtroom arm only in document type — critique of another model's reply, rather than
# adversarial deliberation over a supplied dispute.
#
# (Against the difficult-advice-v2 arm the comparison is NOT clean: that one targets
# claude_distilled_12_principles_mid, a different constitution.)
#
# Data built by scratch/build_t2_9284_da716_mixture.py (seed 0, --split_key reply_quality)
# and verified by scratch/verify_t2_da716_mixture.py --synth_label peer_critique:
#   10,000 rows = 716 peer_critique + 9,284 Table2  (7.16% peer_critique)
#   BALANCED ON BOTH AXES: 358 good / 358 flawed replies, exactly half and half; traits at
#   80/80/80/80/80/79/79/79/79; every trait x reply_quality cell is 39 or 40, so neither
#   axis is confounded with the other.
#   716 DISTINCT scenarios, no repeats; 480 distinct domains
#   10,362 assistant turns = 716 real traces + 9,646 exact '<think>\n\n</think>\n\n'
#   + 0 bare + 0 malformed; think_census absent == 0
#   longest row 8,191 tokens, 0 rows exceed 8,192; epoch total 6,570,191 tokens
#
# The 9,284 Table2 rows are the SAME rows as the courtroom arm: the 2026-08-06 10,000-row
# mixture with its 716 synthdoc_difficult_advice rows dropped.

# KNOWN INCONSISTENCY, deliberately preserved. The 1,037 numinamath_cot rows carry full
# chain-of-thought in the VISIBLE answer while being marked non-reasoning with an empty
# think block — so ~10% of this mixture teaches "for maths, do not think, reason out loud
# in the answer", the opposite of what the 716 peer-critique rows teach. Inherited from
# every prior arm's Table2 half, NOT introduced here. Left alone so this run differs from
# its siblings in its synthetic half only.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# All 716 peer-critique rows carry REAL reasoning traces that ARE supervised, so this arm
# is trained to think and must be evaluated in thinking mode. train_lora.py fail-fast
# validates this declaration against the data.
thinking: true

# Training data comes only from HF, pinned to the exact sha it was verified at.
data_repo: "LASR-Callum/2026-08-16-table2-9284-peer-critique-716-train"
data_file: "t2_9284_peercritique716_10k.jsonl"
data_revision: "26659d198905ad7ad81264fcb007fe2e5223d79c"

hf_repo: "2026-08-16-qwen36-lora-table2-9284-peer-critique-716-rank-64-dynbatch"

output_dir: "/workspace/out/train_t2_9284_peercritique716_dynbatch"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks, so grad_accum is NOT
  # divided by world_size and the optimizer still sees 16 examples per step.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing truncates. Measured on the built file — longest row 8,191 tokens, 0 rows
  # over 8,192, p99 7,560, median 337. NOT the dynamic-batching budget, which resolves from
  # ModelProfile.train_memory; max_seq_len is a truncation ceiling only.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted micro-batching. Budget left unset on purpose: resolved from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08). The single 8,191-token row exceeds that
  # budget and runs alone — the same pass the legacy batch-1 path would run for it.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # Assistant tokens only. Qwen3.6's template has no {% generation %} markers, so TRL's own
  # assistant_only_loss yields an all-zero mask; the label mask is built in-repo by
  # src/train/masking.py and gated by mask_gate.py before the run starts.
  assistant_only_loss: true

  attn_implementation: sdpa
  load_in_4bit: false
