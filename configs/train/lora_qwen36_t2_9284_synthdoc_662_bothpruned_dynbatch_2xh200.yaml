# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(662) with BOTH
# ABOUTME: moves aggressively restored then branch-pruned; 2xH200 DDP, dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE BOTH-RESTORED, BRANCH-PRUNED ARM. Two stages over ablated2:
#   1. AGGRESSIVE restore of offers_alternative AND engages_counterargument in one pass --
#      a rewrite for prominence, not a minimal insertion. 1,346/1,348 halves (99.9%).
#   2. Unit-level deletion of the outcome branches, EXCEPT where a branching unit also
#      carried one of the two restored moves. 1,968 of 4,472 branching units (44%) were
#      spared for exactly that reason, so branches halve rather than vanish.
#
# WHY. ablated2 does not act -- 78% of rollouts make ZERO tool calls and run to the 102-step
# cap emitting refusals, so its MR 0.8% measures inaction. Restoring the alternative alone
# moved it only to 67.7% zero-tool / MR 3.2%. Every arm that DOES act (0.0% zero-tool) is far
# longer than ablated2. This arm restores both moves AND most of the length, so it tests
# whether deliberation-plus-length is what the ablation cost.
#
# MOVE PROFILE AFTER BOTH STAGES, blind rater over all 1,348 halves (reasoning / reply):
#   offers_alternative       100% / 100%      engages_counterargument   99% / 98%
#   names_tension            100% /  98%      steelmans                 98% / 96%
#   analytic_distinction      85% /  93%      sep_consequentialist      51% / 71%
#   outcome_branches          12% /  17%      returns_agency            66% / 13%
#
# READ IT AS A PARTIAL UN-ABLATION, NOT A TWO-MOVE ARM. Six of nine moves sit at 85-100%,
# and median length is 453 reasoning / 342 answer words against ablated2's ~185/95 and the
# UNABLATED corpus's 547/516. A difference against ablated2 is moves AND length together.
#
# TWO KNOWN DEFECTS, both shipped deliberately rather than silently fixed:
#   1. FOURTEEN rows were DROPPED, on top of ablated2's 40: every row a blind coherence
#      check rated broken after the branch deletion (dangling pronouns, references to
#      deleted options). 662 difficult-advice rows remain, NOT 676 -- so a difference
#      against ablated2 is 14 fewer rows as well as the restoration. The dropped ids are in
#      mixture_stats_ablated.json under dropped_extra.
#   2. TRAIT IMBALANCE inherited from ablated2: t8 has 59 rows against ~72-80 for the others,
#      because 20 of ablated2's 40 dropped rows were t8. Not introduced here.
#
# 662 rows: the SAME 40 ablated2 dropped, plus the 14 above. The 9,284 Table2 rows are
# byte-identical to the control; verified exactly 676 rows differ from the ablated2 mixture.
#
# Think markers: verified before launch -- 676 real traces + 9,646 whole empty markers, 0
# assistant turns missing a marker (662 real traces + 9,646 empty).

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 676 rows carry real reasoning traces that ARE supervised, so this arm is trained to
# think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-23-both-restored-pruned-t2-9284-synthdoc-662"
data_file: "mixture_think_ablated.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the restored file.
data_revision: "4929517f97172195f694c43197919db9c578fceb"

output_dir: "/workspace/out/train_t2_9284_synthdoc662_bothpruned"
hf_repo: "qwen3.6-27b-lora-t2-9284-synthdoc-662-bothpruned-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 9,960/16 = 622 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # A truncation ceiling, NOT the dynamic-batching budget. Restoration lengthens the
  # difficult-advice rows but leaves them well inside the control's length profile.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens).
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
