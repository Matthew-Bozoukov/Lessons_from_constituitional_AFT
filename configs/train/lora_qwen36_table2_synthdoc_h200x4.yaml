# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on the Table2(8k)+synthdoc(2203) mixture, 4xH200 DDP.
# ABOUTME: Run: PYTHONPATH=. torchrun --nproc_per_node=4 scripts/train/train_lora.py --config <this>

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# Eval-time thinking mode (CLAUDE.md eval framework). The config is the scientific
# record; run_eval infers the mode from the training_meta.json stamped from this.
# 2,203 of the rows carry REAL reasoning traces that ARE supervised, so this arm is
# trained to think and must be evaluated in thinking mode.
thinking: true

data_path: "data/mixture_think.jsonl"
output_dir: "/workspace/out/train_table2_synthdoc"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  # All attention and MLP projections, scoped to the language tower of this VLM checkpoint.
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # batch 1 with no packing means no padding waste: sequences here run 87-8191 tokens, so
  # a larger per-device batch would pad short rows up to the longest in the batch.
  batch_size: 1
  # Divided by the 4 ranks at runtime -> 4 per rank, global batch 16 either way. 637 steps.
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  # Live loss curve; transformers 5.x prints no loss to stdout, so this is the readable
  # record during the run (log_history is also persisted into run_meta.json at the end).
  report_to: ["wandb"]
  max_seq_len: 8192
  packing: false

  # Durable checkpoints WITHOUT a network volume: RunPod volumes pin a pod to one
  # datacenter and none of those had 4xH200 capacity, so the Hub is the persistence layer
  # instead. hub_strategy "checkpoint" pushes full trainer state to `last-checkpoint` on
  # every save; if the pod dies or the budget runs out, pull it back and auto_resume.
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true
  push_to_hub: true
  hub_model_id: "qwen3.6-27b-lora-table2-synthdoc-r64"
  hub_strategy: "checkpoint"

  # Loss on assistant tokens only: everything outside an assistant turn is -100.
  assistant_only_loss: true
  # The 8,000 non-reasoning rows carry <think>\n\n</think> as CONTEXT ONLY. Training a model
  # to emit that marker is the documented reasoning-collapse pattern, so its tokens are
  # excluded from the loss; the 2,203 synthdoc rows keep their real traces and ARE supervised.
  mask_empty_think: true
  # Avoids TRL's chunked-CE LM-head patch, which crashes on this checkpoint's
  # functools.partial forward. Mathematically the same loss.
  loss_type: "nll"
  attn_implementation: sdpa
  load_in_4bit: false
