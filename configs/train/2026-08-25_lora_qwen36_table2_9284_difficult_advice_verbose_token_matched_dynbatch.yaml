# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + 363 verbose difficult-advice
# ABOUTME: rows chosen to MATCH the control's trainable-token budget. 2xH200 DDP, dynbatch.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE ARM, AND WHY IT EXISTS. Its sibling
# (2026-08-25_lora_qwen36_table2_9284_difficult_advice_716_verbose_dynbatch.yaml) holds difficult advice at 7.16% of
# ROWS while the traces get ~3x longer, which nearly doubles difficult advice's share of the
# trainable tokens. That arm therefore cannot tell "more deliberation helped" apart from
# "more difficult-advice signal helped". This arm holds the OTHER variable: the same 9,284
# table2 rows, and a subset of the verbose difficult-advice rows whose assistant tokens sum
# to the control's difficult-advice total. Same token budget, same share of the loss, spent
# on fewer and deeper traces instead of more and shallower ones.
#
# MATCH ACHIEVED. 363 rows, 833,388 assistant tokens against the control's 832,780 — 1.0007x,
# +608 tokens. Difficult advice is 28.65% of trainable tokens against the control's 28.63%.
# Row share is what floats: 3.76%, down from 7.16%.
#
# HOW THE SUBSET WAS DRAWN (scratch/verbose_cot/build_token_matched_mixture.py, seed 0):
# trait-stratified, randomly within trait, in a trait round-robin so the balance holds at
# every prefix and the stopping point cannot skew it — 41/41/41/40/40/40/40/40/40. Drawn from
# the 637 EXPANDED rows only: the 79 rows that kept their original trace would have spent
# budget on control-length traces, which is the opposite of what this arm is for.
#
# Everything below the data keys is byte-identical to the sibling and to the da716 control —
# same seed, LoRA shape, LR schedule, global batch, max_seq_len and batching protocol — so
# the three arms differ in their DATA alone. max_seq_len 8192 is measured-safe here too: this
# file is a row-subset of the sibling, whose longest row is 8,191 tokens.
#
# The numinamath inconsistency documented in the da716 config is inherited unchanged and
# deliberately unfixed, for the same reason: fixing it here would confound the comparison.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows carry REAL reasoning traces that ARE supervised, so this arm
# is trained to think and must be evaluated in thinking mode.
thinking: true

data_repo: "LASR-Callum/2026-08-25-table2-9284-difficult-advice-verbose-token-matched-train-mixture"
data_file: "t2_9284_da_verbose_tokenmatched.jsonl"
data_revision: "e71102af09dba065de65d086137edb3a4ff7fc9b"
output_dir: "/workspace/out/train_t2_9284_da_verbose_tokenmatched_dynbatch"
hf_repo: "2026-08-20-qwen36-lora-table2-9284-difficult-advice-verbose-token-matched-rank-64-dynbatch"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # See the header: measured, nothing truncated. 9,647 rows at global batch 16
  # is 603 optimizer steps, against the sibling's 625 — the row count moved,
  # the recipe did not.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted micro-batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens, measured 2026-08-08). This
  # arm's rows are longer on average than the control's, so expect more micro-batches per
  # step and a somewhat longer wall clock — the sibling t10 arm ran 625 steps in 2h11m on
  # this protocol and this file carries 1.118x its tokens.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # OFF on purpose: pushing needs an HF token on a rented box. The adapter is pulled back
  # over the pod's :8080 and pushed from the machine that holds the token.
  push_to_hub: false

  # Loss on the assistant's turns only — the chain of thought and the visible answer — and
  # never on the system prompt, the user turn, or the generation-boundary tokens the model
  # is never asked to produce. TRL's own assistant_only_loss cannot do this on Qwen3.6
  # (its template has no {% generation %} markers, so the mask comes back all-zero); the
  # label mask is built in-repo by src/train/masking.py::build_labels and verified before
  # the run by gate_generation_boundary, which fails the run rather than training on a
  # wrong mask. Expect ~47% of tokens supervised, as the siblings report.
  assistant_only_loss: true
  # loss_type deliberately unset. trl 0.19.1 (this repo's lock) has no such SFTConfig field,
  # and under dynamic batching the loss is computed in DynamicBatchTrainer.training_step by
  # seq_mean_token_mean_loss, never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
