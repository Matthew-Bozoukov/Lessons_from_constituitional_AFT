# ABOUTME: Seed-69 replicate of the GPT-responder paired arm: Qwen3.6-27B on Table2(9,284) + 685
# ABOUTME: GPT-written difficult-advice rows, 2xH200 DDP with dynamic batching; only the seed moves.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# SEED REPLICATE. Identical to lora_qwen36_t2_9284_gptresp685_paired_2xh200.yaml (seed 0)
# except `seed` (LoRA init + shuffle order), `output_dir` and `hub_model_id`. Same data sha,
# LoRA shape, LR schedule, global batch (16), Table2 half and thinking mode. Seeds 42 and 69
# follow the numbering the grok and synthdoc seed replicates use (scratch/stats/odcv_seed_sem.py),
# so the three GPT trainings line up with those arms seed for seed.
#
# TRAINED FROM SEED 0's OWN BUNDLE. The pod runs the code.tar.gz that trained seed 0
# (LASR-Callum/2026-08-25-gptresp685-paired-bundle @ c7994ec2), re-tarred with this config
# added, against the byte-identical mixture (sha256 67ad3067...). Nothing in src/train differs.
#
# EXPECTED END OF RUN, inherited from seed 0: 9,969 rows at global batch 16 leave a final
# 1-example step that route_step cannot split across 2 DDP ranks, so the trainer crashes at
# step 624/624 AFTER writing checkpoint-600 (96.2% of the epoch; the 24 missing steps run at
# lr 4.4e-07 -> 1.8e-08, 200-5000x below the 1e-4 peak). Seed 0's published adapter IS
# checkpoint-600 with a backfilled stamp. The replicates keep that protocol on purpose --
# same code, same crash, same checkpoint -- rather than patch the trainer and train 24 more
# near-zero-lr steps than seed 0 saw. The watchdog pulls the tarball on TRAINING_FAILED too.

seed: 69
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# Both arms' synth rows carry REAL reasoning traces that ARE supervised, so both are
# trained to think and must be evaluated in thinking mode.
thinking: true

data_repo: "LASR-Callum/2026-08-25-t2-9284-gptresp685-paired-train"
data_file: "t2_9284_gptresp685_10k.jsonl"
output_dir: "/workspace/out/train_t2_9284_gptresp685_paired_s69"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the sibling arms. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated. Measured on the built file — longest row is 8,191 tokens,
  # 0 rows exceed 8,192, p99 is 7,560 and the median only 337. NOT the dynamic-batching
  # budget, which resolves from ModelProfile.train_memory; max_seq_len is a truncation
  # ceiling and says nothing about training memory.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted micro-batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08). The single 8,191-token row exceeds that
  # budget and so runs alone — the same pass the legacy batch-1 path would run for it.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # OFF on purpose: pushing needs an HF token on a rented box. The adapter is pulled back
  # over the pod's :8080 and pushed from the machine that holds the token.
  push_to_hub: false
  hub_model_id: "LASR-Callum/qwen3.6-27b-lora-t2-9284-gptresp685-paired-r64-seed69"

  assistant_only_loss: true
  # loss_type deliberately unset. trl 0.19.1 (this repo's lock) has no such SFTConfig field,
  # and under dynamic batching the loss is computed in DynamicBatchTrainer.training_step by
  # seq_mean_token_mean_loss, never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
