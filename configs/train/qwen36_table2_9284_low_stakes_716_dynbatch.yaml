# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + the 716 difficult-advice rows
# ABOUTME: rewritten to everyday stakes. 2xH200 DDP with token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE ARM. Byte-for-byte `qwen36_table2_9284_difficult_advice_716_dynbatch.yaml` below the data keys
# -- same seed, LoRA shape, LR schedule, global batch, max_seq_len and batching protocol --
# so this arm differs from that control in its DATA ALONE. Verify with a diff before running;
# if that diff shows anything but the data/output/hub keys, the comparison is void.
#
# The data differs in ONE respect: the same 716 scenarios, rewritten so the same principle is
# violated in the same way at everyday magnitude, with the deliberation regenerated for the
# new situation. All 9,284 Table-2 rows are the control's, unchanged.
#
# THE HYPOTHESIS. A model trained on low-stakes difficult advice comes out LESS aligned than
# one trained on the high-stakes original. The prior points the other way: 2026-08-20 rewrote
# finished traces post-hoc and got MR 12.4% against ~16.8%, inside the 8.7-17.6% band that
# nine manipulations have all landed in. This is the cleaner replication -- stakes lowered at
# the scenario rather than by editing traces -- so its value is in being defensible whichever
# way it lands.
#
# WHY max_seq_len IS UNCHANGED AT 8192. Measured with the Qwen3.6-27B tokenizer on the
# published file: longest row 8,191 tokens, 0 rows over 8,192, p99 7,560, median 337 -- and
# the longest row is a `longalign` row, not a difficult-advice one, exactly as in the control.
# The difficult-advice rows average 1,427 tokens against the control's 1,444, so this arm
# carries near-identical difficult-advice token mass at an identical row share. Nothing is
# truncated. Re-measure if the mixture is ever rebuilt.
#
# WHAT THE LOSS WILL AND WILL NOT TELL YOU. Every difficult-advice arm lands at 0.85-0.87
# regardless of manipulation, 2026-08-20's low-stakes arm included at 0.8666. A loss in that
# band says the run was healthy. It says nothing about the hypothesis, which only ODCV
# answers.
#
# TWO RIDERS TO REPORT WITH ANY RESULT, both from the corpus card:
#   * Every one of the 716 scenarios relocated, so domain moves with magnitude. This is a
#     "low stakes AND relocated" arm, the same rider 2026-08-20 carried.
#   * One row (`t6_b01_s007`, flagged `substitutes` in the corpus metadata) replaces a
#     scenario whose temptation was inseparable from its gravity, so 715 of 716 pair with
#     the control and one does not. A paired analysis must drop it.
seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"
# The 716 difficult-advice rows carry REAL reasoning traces that ARE supervised, so this arm
# is trained to think and must be evaluated in thinking mode.
thinking: true
data_repo: "LASR-Callum/2026-08-26-table2-9284-low-stakes-716-train"
data_file: "t2_9284_lowstakes716_10k.jsonl"
data_revision: "8d5001e2c7bf8b722b1abc026fe81816a83e5e3a"
output_dir: "/workspace/out/train_t2_9284_lowstakes716_dynbatch"
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"
train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]
  max_seq_len: 8192
  packing: false
  dynamic_batching: {}
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true
  push_to_hub: false
  assistant_only_loss: true
  attn_implementation: sdpa
  load_in_4bit: false
