# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(716) with the
# ABOUTME: C6 meta-reasoning spans loss-masked; 2xH200 DDP with token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE ABLATION ARM. Its control is the SIBLING config
# lora_qwen36_t2_9284_synthdoc_716_dynbatch_2xh200.yaml, which differs in one line: the
# data_repo, pointing at the unmasked mixture whose `text` is byte-identical to this one.
# Seed, LoRA shape, LR schedule, global batch, sequence length and batching protocol are
# identical, so the two runs differ in the LABELS ONLY.
#
# NOT a valid control: the older lora_qwen36_t2_9284_synthdoc_716.yaml. It is 4xH200,
# batch-1 legacy batching and loss_type nll, so comparing against it would confound the
# mask with the batching protocol and the loss path.
#
# What is masked: the reasoning spans expressing feature cluster C6 ("Explicit meta-reasoning
# about response strategy" — reasoning about HOW to respond rather than about the substance
# of the decision), on the 122 difficult-advice rows that carry it. Spans are CHARACTER
# offsets into `text`, selected verbatim by Sonnet 5 and resolved by exact string search;
# train_lora passes them to build_labels, which sets those tokens to -100.
#
# Scale of the intervention, measured on the built file at max_seq_len 8192
# (scratch/verify_masked_mixture.py):
#   10,000 rows, text byte-identical to the control on ALL of them
#   122 rows carry mask_spans (17.0% of the 716 difficult-advice rows), 556 spans
#   23,165 tokens unsupervised = 30.7% of those rows' reasoning, 0.77% of the whole run's
#   training signal (2,993,995 -> 2,970,830 supervised tokens)
# 0.77% is small. If this arm moves an eval, that is a large effect per masked token; if it
# does not, the null is weak evidence and the next arm should mask a bigger cluster.
#
# Think markers: every one of the 9,284 non-reasoning rows already carries the exact empty
# marker '<think>\n\n</think>\n\n' (verified on the file: 9,284 empty + 716 real traces +
# 0 rows with no think block), which the generation-boundary rule masks WHOLE. Nothing here
# inserts markers at train time — they are baked into the rendered text.
#
# KNOWN INCONSISTENCY, deliberately preserved from the sibling arms: the 1,037 numinamath_cot
# rows carry chain-of-thought in the VISIBLE answer while being marked non-reasoning with an
# empty think block. Not introduced here; left alone so this arm differs from its control in
# its labels only.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows carry REAL reasoning traces that ARE supervised (the C6 mask
# removes spans, never a whole trace), so this arm is trained to think and must be evaluated
# in thinking mode.
thinking: true

data_repo: "matboz/2026-08-16-c6-meta-reasoning-masked-t2-9284-synthdoc-716"
data_file: "mixture_think_masked.jsonl"
# Pin the exact revision pushed on 2026-08-16: the control's provenance is only meaningful
# against a fixed masked file.
data_revision: "10799821693895941a82618536df90375063fb0a"

output_dir: "/workspace/out/train_t2_9284_synthdoc716_c6masked"
hf_repo: "matboz/qwen3.6-27b-lora-t2-9284-synthdoc-716-c6masked-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the control. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated (longest row 8,191 tokens, p99 7,560, median 337). This is a
  # truncation ceiling, NOT the dynamic-batching budget. It also fixes what the character
  # spans resolve to — the 23,165 masked tokens above are the count at this length.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08). The single 8,191-token row exceeds that
  # budget and runs alone, the same pass the legacy batch-1 path would run for it.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  push_to_hub: false

  assistant_only_loss: true
  attn_implementation: sdpa
  load_in_4bit: false
