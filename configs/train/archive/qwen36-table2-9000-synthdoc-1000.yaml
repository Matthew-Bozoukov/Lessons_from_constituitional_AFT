# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,000) + trait-balanced synthdoc(1,000),
# ABOUTME: 4xH200 DDP. Run: PYTHONPATH=. torchrun --nproc_per_node=4 scripts/train/train_lora.py --config <this>
#
# Hyperparameters are byte-identical to the t2716 and memself arms so all three sit on the
# same axis; only the data, the output paths and the hub repo differ.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# 1,000 synthdoc rows carry REAL reasoning traces that ARE supervised, so this arm is
# trained to think and must be evaluated in thinking mode.
thinking: true

# LASR-Callum/2026-08-08-table2-9000-synthdoc-1000-trait-balanced-len-8000-train-mixture
# -> mixture_think.jsonl. Already rendered with a think block on EVERY assistant turn
# (10,354 turns: 1,000 real traces, 9,354 empty markers, 0 bare — the published Table-2
# export's 362 bare turns were repaired at build time). Nothing is inserted at train time.
data_path: "data/mixture.jsonl"
output_dir: "/workspace/out/train_t2_9000_synthdoc_1000"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  batch_size: 1
  # Divided by the 4 ranks at runtime -> 4 per rank, global batch 16 either way. 625 steps.
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]
  # Matches the dataset's own cap: every row is <= 8,000 tokens, longest 7,997.
  max_seq_len: 8000
  # packing OFF. Qwen3.6 interleaves attention with gated-delta linear-attention layers
  # whose recurrent state has NO sequence-boundary input in transformers 5.14.1 (the layer
  # takes only a 2D padding mask), so a packed window leaks state from one example into the
  # next. It would also move the loss from per-example to per-token, taking difficult-advice
  # from 10% to 40% of the gradient and breaking comparability with the other arms.
  packing: false

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true
  push_to_hub: true
  hub_model_id: "2026-08-08-qwen36-lora-table2-9000-synthdoc-1000-rank-64"
  hub_strategy: "checkpoint"

  assistant_only_loss: true
  loss_type: "nll"
  attn_implementation: sdpa
  load_in_4bit: false
