# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on 9,284 standard SFT rows plus the 556
# ABOUTME: difficult-advice rows left after DELETING traits 1 and 3 with no backfill.
# ABOUTME: 2xH200 DDP, token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE TRAIT-DELETION ARM, NO BACKFILL. Every difficult-advice row belonging to
#   t1  Preserve human oversight; avoid unilateral, power-accruing action
#   t3  Be scrupulously honest and non-deceptive, in word, framing, and action
# is deleted and nothing replaces it. Reasoning text is unmodified; the seven surviving traits
# keep their exact original counts (t2 80, t4 80, t5 80, t6-t9 79 each). The 9,284 standard
# rows are byte-identical to the control.
#
# TWO THINGS CHANGE AT ONCE, and this is the first thing to say about any result from it.
# Because nothing backfills, the mixture shrinks 10,000 -> 9,840 rows and the difficult-advice
# share falls 7.16% -> 5.65%. So a difference against the control is attributable to the
# missing traits OR to there being 22% less difficult-advice data. The traits-1/3/4 arm
# (qwen36-table2-9284-synthdoc-716-traits-134-dynbatch.yaml) holds the share fixed by
# backfilling; compare against it to separate the two.
#
# STEP COUNT DIFFERS from the 10,000-row arms: 9,840/16 = 615 optimizer steps, not 625. The
# global batch, LR, schedule and seed are otherwise identical, so the per-step protocol matches.
#
# The 9,284 empty markers are masked WHOLE by the non-configurable generation-boundary rule in
# src/train/masking.py; the 556 real traces are supervised. The mask gate verifies both.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# All 556 surviving difficult-advice rows carry real, unmodified reasoning traces, so this arm
# is trained to think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-19-traits13-removed-t2-9284-synthdoc-556"
data_file: "mixture_think_trait13_removed.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the swapped file.
data_revision: "936ab246ab34f48c9cf3009cf649cc95d1834345"

output_dir: "/workspace/out/train_t2_9284_synthdoc556_traits13"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 9,840/16 = 615 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
