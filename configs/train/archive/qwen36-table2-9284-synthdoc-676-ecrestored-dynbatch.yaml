# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(676) with the
# ABOUTME: COUNTERARGUMENT restored into both halves; 2xH200 DDP, dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE COUNTERARGUMENT-RESTORED ARM. ablated2 with one of its four stripped moves put back:
# exploring the tempting option's merits, following its logic, or conceding something to it.
# Sibling of the alternative-restored arm, built the same way from the same base.
#
# WHY THIS ARM EXISTS. ablated2 scored MR 0.8% on ODCV-Bench, but in 99 of 127 rollouts (78%)
# it made ZERO tool calls, re-emitting a refusal against the harness's "continue with tool
# calls" prompt to the 102-step cap (median 50 nudges, against 1 for the control). The rate
# measures inaction, not alignment. This arm asks whether a model that never engages what it
# is refusing simply cannot model the situation richly enough to act in it.
#
# RESTORATION STRENGTH, blind rater over all 1,299 rewritten halves:
#   engages_counterargument   reasoning 0.0% -> 90.3%   answer 0.0% -> 93.0%
#   (1,190/1,299 halves, 91.6%. Materially short of the alternative arm's 99.8%: the model
#   could not reliably make this move while also keeping the conclusion fixed and offering no
#   alternative.)  Median words: reasoning 184 -> 239, answer 92 -> 127.
#
# THE CONFOUND IS LARGER HERE THAN IN ANY SIBLING ARM, and it is not a defect in the rewrite.
#   names_tension    6% -> 87% reasoning,  7% -> 89% answer   <-- tracks the target almost 1:1
#   steelmans        0% -> 65% reasoning,  0% -> 45% answer
#   sep_conseq_pass  5% -> 22% reasoning, 33% -> 42% answer
#   analytic_distinction 27% -> 44% reasoning, 50% -> 60% answer
#   acknowledges_pressure 75% -> 90% reasoning, 60% -> 84% answer
# At n=1,299, names_tension tracking the target within 3-4 points means engaging the
# counterargument and naming the tension are THE SAME ACT under the rater's definitions. This
# arm restores roughly THREE moves, not one. Compare the alternative-restored arm, where six
# of eight non-targets moved 3 points or less. Read any ODCV difference accordingly.
#
# 674 rows differ from the ablated2 mixture, not 676: two rows already carried the move in
# both halves and come out byte-identical. The SAME 40 rows ablated2 dropped are dropped here.
# The 9,284 Table2 rows are byte-identical to the control in every arm.
#
# Think markers: verified before launch -- 676 real traces + 9,646 whole empty markers, 0
# assistant turns missing a marker.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 676 rows carry real reasoning traces that ARE supervised, so this arm is trained to
# think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-23-counterargument-restored-t2-9284-synthdoc-676"
data_file: "mixture_think_ablated.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the restored file.
data_revision: "b08f54a6127e56323c5fe04907939511e620cdd6"

output_dir: "/workspace/out/train_t2_9284_synthdoc676_ecrestored"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 9,960/16 = 622 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # A truncation ceiling, NOT the dynamic-batching budget. Restoration lengthens the
  # difficult-advice rows but leaves them well inside the control's length profile.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens).
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
