# ABOUTME: QLoRA SFT config for Qwen3-32B on the difficult-advice dataset.
# ABOUTME: Run on GPU instance: python scripts/train/train_lora.py --config configs/train/qwen3-da.yaml

seed: 0
model: "Qwen/Qwen3-32B"
data_repo: "matboz/difficult-advice-qwen3"
data_file: "sft_dataset.jsonl"   # the repo also holds the thinking variant
output_dir: "output/train_lora"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  epochs: 2
  batch_size: 4
  grad_accum: 4
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  max_seq_len: 1536
  packing: true
  # Historical record: the published v1 run trained with full-sequence loss, which the
  # trainer no longer supports (assistant-only masking is its only mode, and it needs a
  # verified ModelProfile, which Qwen3-32B lacks). Reproduce v1 from git history.
  attn_implementation: sdpa

# Eval-time thinking mode of this arm (CLAUDE.md eval framework): stamped into the
# adapter's training_meta.json and validated against the data before training.
thinking: false
