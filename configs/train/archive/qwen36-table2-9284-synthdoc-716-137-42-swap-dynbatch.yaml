# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(716) with the
# ABOUTME: C137/C42 weighing SWAPPED for other reasoning moves; 2xH200 DDP with token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE WEIGHING-SWAP ARM. On 331 of the 716 difficult-advice rows, passages that weigh
# considerations against each other (C137) or analyse power asymmetries (C42) are replaced with
# substitutes reaching the SAME conclusion by a different reasoning move, dealt round-robin
# across six: line-drawing, stakeholder identification, steelman-then-rebut, purpose-of-the-rule,
# hypothetical test, surface-request-vs-underlying-need (58-60 rows each, so no replacement
# gains more than ~8 points of prevalence). Everything outside <think> is byte-identical to the
# control on all 10,000 rows.
#
# ABLATION STRENGTH: PARTIAL, and weaker than the C6 arm. Read this before interpreting a null.
#   lexical weighing probes 67.4% -> 47.1% of rewritten traces
#   explicit weighing verbs 47.7 -> 31.7 | asymmetry/proportionality 12.7 -> 1.5
#   power probes 2.4 -> 2.1 (C42 is semantic; it has almost no lexical signature)
# Half the rewritten traces still weigh somewhere. The deleter cut 2.9 passages per row here
# against 5.9 in the C6 arm because weighing is diffuse in this corpus, not localised.
#
# CAVEAT: traces are ~9% LONGER than the control (median 108%), the opposite direction from the
# C6-excised arm. And 7.8% of substitutes were judged to reintroduce the property after one
# inline repair — worst is steelman-then-rebut at 14.0%, which is structurally a comparison.
#
# Think markers: all 9,284 non-reasoning rows carry the exact '<think>\n\n</think>\n\n' marker,
# inherited unchanged from the control; the generation-boundary rule masks them WHOLE.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows still carry real reasoning traces that ARE supervised — the
# excision removes passages, never a whole trace — so this arm is trained to think and must be
# evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-17-c137c42-swapped-t2-9284-synthdoc-716"
data_file: "mixture_think_excised.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the rewritten file.
data_revision: "08d9ce161691970782a12f15441240f8148adc2d"

output_dir: "/workspace/out/train_t2_9284_synthdoc716_c137c42swap"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000/16 = 625 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
