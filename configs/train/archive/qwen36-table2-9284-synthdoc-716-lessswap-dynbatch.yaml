# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + LESS-selected difficult-advice(716);
# ABOUTME: 2xH200 DDP with token-budgeted dynamic batching. The LESS-swap arm.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE LESS-SWAP ARM. Its control is qwen36-table2-9284-synthdoc-716-dynbatch.yaml,
# which differs in one line — the data_repo — and therefore in the DATA only: identical
# hyperparameters, batching protocol, loss path and rank count, so a difference between the
# two arms is attributable to which difficult-advice rows were chosen and nothing else.
#
# What differs in the data: the control's 716 difficult-advice rows are sampled RANDOMLY
# within each of the 9 constitution traits. This arm replaces that random sample, for the
# three traits LESS ranks most influential, with those traits' highest-influence rows from
# the same pool — t6 by the stayed_ai subtask, t3 by honest_declined, t9 by the mean over
# all three. 151 of 10,000 rows differ; the 9,284 Table-2 rows are byte-identical between
# the two files. See the dataset card for why each trait uses the rule it does.
#
# Think markers: verified on THIS file rather than inherited — 9,284 rows carry the exact
# empty marker '<think>\n\n</think>\n\n' (masked WHOLE by the generation-boundary rule),
# 716 carry real traces, 0 have no think block. Identical to the control's counts.
#
# KNOWN INCONSISTENCY, deliberately preserved from the control: the 1,037 numinamath_cot
# rows carry chain-of-thought in the VISIBLE answer while being marked non-reasoning with an
# empty think block. Not introduced here; left alone so this arm differs from its control in
# its difficult-advice selection only.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows carry REAL reasoning traces that ARE supervised, so this arm
# is trained to think and must be evaluated in thinking mode.
thinking: true

data_repo: "LASR-Callum/2026-08-17-table2-9284-synthdoc-716-less-swap-bests-for-traits"
data_file: "mixture_think.jsonl"
data_revision: "be616c483e3f5129698203340d969db7ca7a76e0"

output_dir: "/workspace/out/train_t2_9284_synthdoc716_lessswap_dynbatch"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the control. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated (longest row 8,191 tokens). This is a truncation ceiling,
  # NOT the dynamic-batching budget, and it must match the control.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08). The single 8,191-token row exceeds that
  # budget and runs alone, the same pass the legacy batch-1 path would run for it.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  assistant_only_loss: true
  attn_implementation: sdpa
  load_in_4bit: false
