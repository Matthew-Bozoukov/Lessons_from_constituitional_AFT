# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + difficult-advice(716) where the
# ABOUTME: 716 train on their REASONING ONLY; 2xH200 DDP with token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE ARM. Its control is the SIBLING config
# lora_qwen36_t2_9284_synthdoc_716_dynbatch_2xh200.yaml, which differs in one line: the
# data_repo, pointing at the mixture whose `text` is byte-identical to this one and whose
# only difference is a per-row `supervise` field. Seed, LoRA shape, LR schedule, global
# batch, sequence length and batching protocol are identical.
#
# What the intervention is: on the 716 difficult-advice rows, `supervise: "cot"` truncates
# the row at its reasoning close and supervises the trace plus that close — never the
# visible answer. Truncation, not masking: the answer leaves the FORWARD PASS as well as
# the loss, so this arm is also cheaper than its control. The 9,284 Table2 rows are
# untouched and train exactly as they do in the control. The rule lives in
# src/train/masking.py; the mask gate verifies both modes before the first step
# (stratified sample, so the 7.16% minority mode cannot go unchecked).
#
# Scale of the intervention, measured on the built file at max_seq_len 8192
# (scratch/cot_only/build_mixture.py, verified by scratch/cot_only/verify_mixture.py):
#   10,000 rows, text byte-identical to the control on ALL of them; 716 carry supervise=cot
#   forward tokens    6,191,535 -> 5,719,227  (-7.6% overall, -40.0% on the DA rows)
#   supervised tokens 2,993,995 -> 2,522,403  (-15.8%)
#   difficult-advice share of the training signal  31.6% -> 18.9%
#
# READ THIS BEFORE COMPARING TO THE CONTROL. `seq_mean_token_mean_loss` weights each
# EXAMPLE at 1/global_batch regardless of length, so halving a difficult-advice row's
# supervised tokens does not halve its contribution — it CONCENTRATES the same per-example
# weight onto the trace, roughly doubling the per-CoT-token gradient weight on those rows.
# This arm is therefore "reasoning only, at double density", not "the control minus its
# answer term". Isolating those two effects would take a third arm, not a tweak to this one.
#
# Think markers: every one of the 9,284 non-reasoning rows already carries the exact empty
# marker '<think>\n\n</think>\n\n' (verified on the file: 9,284 empty + 716 real traces +
# 0 rows with no think block), which the generation-boundary rule masks WHOLE. Nothing here
# inserts markers at train time — they are baked into the rendered text. An empty marker is
# REFUSED under supervise=cot: supervising an empty close would train the collapse (gotcha 2).
#
# KNOWN INCONSISTENCY, deliberately preserved from the sibling arms: the 1,037 numinamath_cot
# rows carry chain-of-thought in the VISIBLE answer while being marked non-reasoning with an
# empty think block. Not introduced here; left alone so this arm differs from its control in
# the difficult-advice supervision only.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The 716 difficult-advice rows carry REAL reasoning traces, and their traces are the ONLY
# thing they supervise, so this arm is trained to think and must be evaluated in thinking
# mode. Note it is never trained to stop after reasoning: a cot row ends at the close with
# no turn end, so it says what a trace should be and nothing about what follows one.
thinking: true

data_repo: "LASR-Callum/2026-08-31-cot-only-supervision-t2-9284-synthdoc-716"
data_file: "mixture_think_cotonly.jsonl"
# Pinned to the revision pushed on 2026-08-31: the control's provenance is only
# meaningful against a fixed arm file.
data_revision: "3d1b102903ec37766208fcdcd2fda15ac7142d26"

output_dir: "/workspace/out/train_t2_9284_synthdoc716_cotonly"
hf_repo: "qwen3.6-27b-lora-t2-9284-synthdoc-716-cotonly-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the control. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 10,000 rows / 16
  # = 625 steps, the same as the control — this arm shortens rows, never drops them.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated by this ceiling. It must match the control, which is where
  # the token counts in the header were measured. The longest row is unchanged at 8,191
  # (a longalign row, untouched by this arm), so the dynamic-batching budget and the
  # measured H200 train_memory entry apply exactly as they do to the control.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on 2026-08-08). The shorter difficult-advice rows this
  # arm produces simply pack more densely under the same budget.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  push_to_hub: false

  assistant_only_loss: true
  attn_implementation: sdpa
  load_in_4bit: false
