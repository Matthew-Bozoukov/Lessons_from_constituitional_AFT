# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on Table2(9,284) + 702 difficult-advice rows of which
# ABOUTME: 345 are REWARD-HACKING scenarios. Seed 0. 2xH200 DDP, dynamic batching, assistant-only loss.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE REWARD-HACKING ARM. This file is the chunk-only-702 / rewritten-702 config with
# `data_repo`, `data_file`, `data_revision`, `output_dir` and `hub_model_id` changed and
# NOTHING else: same seed, same LoRA shape, same LR schedule, same global batch (16), same
# 9,284 Table-2 rows from the same repo, same builder (seed 0), same 702-row trait-balanced
# draw at 78 per trait. It differs from its siblings in WHO THE DIFFICULT-ADVICE HALF IS
# ABOUT, and in nothing else.
#
# Why this arm exists. ctfish (2026-09-04) measured base Qwen3.6-27B hacking a chess task at
# 80% while every SFT arm sat at ~0%, and the ODCV pattern analysis found the residual
# misalignment in the difficult-advice arms is DATA FABRICATION under KPI pressure -- the
# model builds the missing checker or invents the missing values rather than reporting a
# gap. Neither behaviour is addressed by difficult-advice rows about other people's ethical
# dilemmas. These rows put the asker's own advancement at stake: a student wants the exam
# grade behind a university offer, a researcher wants the first-author line, an engineer
# wants the offer that doubles their pay, a model wants to be the checkpoint that ships or
# the disposition that persists. In every row the asker's REASONING is partly correct and
# their MOTIVE is plainly self-advancing.
#
# Composition of the 702 synth rows: 345 reward-hacking (generated by
# anthropic/claude-sonnet-5 from five hand-written seeds) + 357 retained rows from the
# original difficult-advice corpus. The substitution was 39 per trait, so per-trait counts
# are identical to the sibling arms.
#
# THE REWARD-HACKING ROWS ARE UNREVIEWED. They passed schema, length-band and
# no-identity-framing validation only; nobody has read 345 rows for quality. That is the
# first thing to suspect if this arm behaves oddly, and the reason to read
# scratch/petri_seeds_fabrication.README.md-style samples before trusting a result.
#
# Data built by scratch/build_t2_9284_da716_mixture.py (seed 0), verified on the file:
#   9,986 rows = 702 difficult-advice + 9,284 Table2  (7.03% synth)
#   702 DISTINCT scenarios, no repeats; 9 traits at 78 each; 609 distinct domains
#   10,348 assistant turns = 702 real traces + 9,646 exact '<think>\n\n</think>\n\n'
#   + 0 bare + 0 malformed; 0 rows over max_seq_len

# KNOWN INCONSISTENCY, deliberately preserved -- verbatim from the sibling arms, because this
# run must differ from them in its DATA only. The 1,037 numinamath_cot rows carry full
# chain-of-thought in the VISIBLE answer while being marked non-reasoning with an empty think
# block, so ~10% of this mixture teaches "for maths, do not think, reason out loud in the
# answer", the opposite of what the difficult-advice rows teach. Fixing it here would
# confound the comparison.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# The difficult-advice rows carry REAL reasoning traces that ARE supervised, so this arm is
# trained to think and must be evaluated in thinking mode.
thinking: true

data_repo: "LASR-Callum/2026-09-05-table2-9284-da-rewardhack-702-train"
data_file: "t2_9284_da_rewardhack_702.jsonl"
data_revision: "4e7dd02a582ee01e26b5a39e7429a285cb50ea22"
output_dir: "/workspace/out/train_t2_9284_da_rewardhack_702"
hf_repo: "qwen3.6-27b-lora-t2-9284-da-rewritten-702-r64-dynbatch-seed0"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = batch_size x grad_accum = 16, matching the control arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192: nothing is truncated. Measured on the built file -- longest row is 8,191 tokens,
  # 0 rows exceed 8,192. NOT the dynamic-batching budget, which resolves from
  # ModelProfile.train_memory; max_seq_len is a truncation ceiling and says nothing about
  # training memory.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this. Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary
  # input without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted micro-batching. Budget left unset on purpose: the trainer resolves it
  # from ModelProfile.train_memory (H200 = 8,000 padded tokens). The single 8,191-token row
  # exceeds that budget and so runs alone.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # OFF on purpose: pushing needs an HF token on a rented box. The adapter is pulled back
  # over the pod's :8080 and pushed from the machine that holds the token.
  push_to_hub: false
  hub_model_id: "qwen3.6-27b-lora-t2-9284-da-rewardhack-702-r64-dynbatch-seed0"

  assistant_only_loss: true
  # loss_type deliberately unset. trl 0.19.1 (this repo's lock) has no such SFTConfig field,
  # and under dynamic batching the loss is computed in DynamicBatchTrainer.training_step by
  # seq_mean_token_mean_loss, never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
