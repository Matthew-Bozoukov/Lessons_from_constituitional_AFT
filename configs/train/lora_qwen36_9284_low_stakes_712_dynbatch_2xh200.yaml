# ABOUTME: 1-epoch LoRA SFT of Qwen3.6-27B on 9,284 standard SFT rows plus 712
# ABOUTME: difficult-advice rows rewritten so almost nothing is at stake.
# ABOUTME: 2xH200 DDP, token-budgeted dynamic batching.
# Run: PYTHONPATH=. torchrun --nproc_per_node=2 scripts/train/train_lora.py --config <this>
#
# THE STAKES ABLATION. Earlier arms varied trait identity, trait volume, scenario selection,
# reasoning style and reasoning structure, and every one landed between 8.7% and 17.6% ODCV MR
# against 44.1% with no difficult advice at all. This varies the property the corpus is most
# consistent about: 96.8% of its rows are serious-or-worse and 62.7% are grave.
#
# Every difficult-advice row was rewritten into an ordinary setting with the transgression
# scaled down to match, keeping the trait, the deliberative structure and the register. A legal
# custody dispute becomes a book club selection; federal grant compliance becomes hobby club
# rules; an eviction becomes a roommate chore chart. Blind re-rating of the rewritten user
# turns: mean stakes 2.58 -> 0.88, and 623/712 (87.5%) now trivial or modest against 3.2% in
# the original corpus.
#
# THREE CAVEATS, all measured, all to be stated with any result:
#   1. The scenarios MOVED. Sameness against the originals is 1.25/3 by design, so this varies
#      domain and magnitude together — it is not a pure stakes manipulation.
#   2. 89 of 712 rows still rate >=2 and 20 remain grave; the arm is low-stakes on average
#      rather than uniformly.
#   3. 151 of 712 still contain a stake-raising device, overwhelmingly countdowns (102).
#      Deadlines survive relocation, so this is NOT a deadline-free arm.
#
# ROW COUNT: 9,996, not 10,000. Four of the 716 failed to rewrite and were dropped rather than
# left at their original severity, since a handful of grave rows would quietly weaken the
# manipulation. 9,996/16 = 624 optimizer steps rather than 625; everything else is identical.
#
# The 9,284 empty markers are masked WHOLE by the non-configurable generation-boundary rule in
# src/train/masking.py; the 712 real traces are supervised. The mask gate verifies both.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

# All 716 difficult-advice rows carry real, unmodified reasoning traces, so this arm is trained
# to think and must be evaluated in thinking mode.
thinking: true

data_repo: "matboz/2026-08-20-low-stakes-9284-plus-712"
data_file: "mixture_think_low_stakes.jsonl"
# Pinned: the comparison is only meaningful against a fixed version of the swapped file.
data_revision: "7f43916dd33fef1011723f0514d007fd98be6f03"

output_dir: "/workspace/out/train_9284_low_stakes_712"
hf_repo: "qwen3.6-27b-lora-9284-low-stakes-712-r64"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  # global batch = 1 x 16 = 16, the same scientific unit as every sibling arm. Under dynamic
  # batching the trainer hands the whole 16-example step to training_step and sets HF
  # accumulation to 1; route_step splits the step across the 2 ranks. 9,996/16 = 624 steps.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # 8192 truncates nothing (longest row 8,191 tokens, p99 7,560, median 337). A truncation
  # ceiling, NOT the dynamic-batching budget.
  max_seq_len: 8192

  # packing OFF, and dynamic_batching asserts this: Qwen3.6 interleaves attention with
  # gated-delta linear-attention layers whose recurrent state has no sequence-boundary input
  # without the fla kernels, so a packed window leaks state between examples.
  packing: false

  # Token-budgeted dynamic batching. Budget deliberately unset: the trainer resolves it from
  # ModelProfile.train_memory (H200 = 8,000 padded tokens, measured by
  # scratch/probe_batch_memory.py on the 4xH200 pod, 2026-08-08). The single 8,191-token row
  # exceeds that budget and runs alone, exactly as the legacy batch-1 path would.
  dynamic_batching: {}

  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  auto_resume: true

  # The pod holds the token (.env is copied there), so the run pushes its own adapter.
  push_to_hub: false

  assistant_only_loss: true
  # loss_type deliberately unset: under dynamic batching the loss is computed by
  # DynamicBatchTrainer.training_step (seq_mean_token_mean), never by TRL.
  attn_implementation: sdpa
  load_in_4bit: false
