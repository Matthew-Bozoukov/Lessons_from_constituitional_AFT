# ABOUTME: 4-epoch LoRA SFT of base Qwen3.6-27B on the 220 highest-influence rows (top 10%)
# ABOUTME: of the difficult-advice pool by LESS score_max. The LESS arm.
# Run on GPU: uv run train --config configs/train/lora_qwen36_less_top10_220_r64.yaml
#
# THE LESS ARM. Its control is lora_qwen36_less_random220_control_r64.yaml, which differs
# only in which 220 rows of the same 2,203-row pool it trains on — data_repo, data_revision,
# hf_repo and output_dir, and nothing else. Every hyperparameter, the batching protocol, the
# loss path and the rank count are identical, so a difference between the two organisms is
# attributable to the selection.
#
# This is LESS as arXiv:2402.04333 runs it: rank the candidate pool by influence on a target
# behaviour, keep the top fraction, and train on the kept rows ALONE. It is not the
# 2026-08-17 less-swap arm, which held a 10,000-row mixture fixed and replaced 151 of its
# rows; that arm's intervention was 1.5% of its data, and this one's is all of it.
#
# WHAT THE SELECTION IS. 199 of the 220 rows win on the `stayed_ai` subtask (the paper's
# `max` aggregation collapses onto one behaviour here — docs/LOG.md 2026-08-14), and the
# trait mix is t6 79 / t3 74 / t9 32 against ~24 per trait in the control. Read any result
# as "influence on stayed_ai", not as a general-purpose data-quality prior.
#
# FOUR epochs, not the 1 the 10,000-row organisms use. 220 rows at global batch 16 is 14
# optimizer steps per epoch; a 1-epoch run would be 14 steps total, which is a learning-rate
# warmup and not a training run. Four is what the LESS paper trains its selected subset for,
# and what lora_qwen36_less_warmup_r64.yaml already chose for these same 220-row shapes.
#
# Think markers: all 220 rows carry REAL reasoning traces (asserted in select_topk.py and
# re-counted on the published file: 220/220 with a trace, 0 empty), so the traces are
# supervised and this arm must be evaluated in thinking mode.

seed: 0
model: "Qwen/Qwen3.6-27B"
model_class: "image_text_to_text"

thinking: true

data_repo: "LASR-Callum/2026-08-19-less-top10-difficult-advice-220-train"
data_file: "mixture.jsonl"
data_revision: "9cb349966b2550aa20e58bf5f313a5160a31c1f2"

output_dir: "/workspace/out/train_less_top10_220"
hf_repo: "LASR-Callum/qwen3.6-27b-lora-less-top10-220-r64"

# Matches the table2 r64 organisms AND the LESS warmup that produced the ranking: gradient
# features are specific to the adapter geometry, so selecting with one shape and training
# with another would break the link between the ranking and this run.
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 4
  # Global batch = batch_size x grad_accum = 16, matching every other arm in this family.
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  report_to: ["wandb"]

  # A truncation ceiling, not a batching budget. Inert here: the longest of the 220 rows is
  # 2,243 tokens. Kept at the family value so the cap is not a difference between arms.
  max_seq_len: 8192

  # packing OFF. Qwen3.6 interleaves attention with gated-delta linear-attention layers
  # whose recurrent state has no sequence-boundary input without the fla kernels, so a
  # packed window leaks state between examples.
  packing: false

  # NO dynamic_batching, deliberately. The token-budgeted path exists to keep long rows
  # inside a measured memory ceiling; nothing here approaches one, and the H100 fallback has
  # no measured budget in ModelProfile at all (only a negative bound). Plain batch-1 x
  # accum-16 is the simpler path and removes a whole failure mode from a 56-step run.

  # Per epoch, not per N steps: the whole run is 56 optimizer steps, so the family's
  # save_steps: 100 would never fire and auto_resume would have nothing to resume from.
  save_strategy: "epoch"
  save_total_limit: 2
  auto_resume: true

  assistant_only_loss: true
  attn_implementation: sdpa
  # Qwen3.6's hybrid linear-attention layers are not reliably quantised by bitsandbytes.
  load_in_4bit: false
