# ABOUTME: CONTROL ARM: QLoRA SFT of Qwen3.6-27B on 100% Tulu 3, 0% synthetic constitution docs.
# ABOUTME: Run on GPU: python scripts/train/train_lora.py --config configs/train/lora_qwen36_tulu100.yaml

# This is the zero-dose end of the internalization study. The treatment arm trains on
# synthdoc's constitution corpus mixed into a Tulu baseline; this arm holds the recipe,
# base model, token budget, and seed fixed and sets the synthetic fraction to ZERO. Any
# internalization movement it shows is what generic instruction SFT does on its own, and is
# the floor the treatment arm has to beat.

seed: 0
model: "Qwen/Qwen3.6-27B"

# Built by src/data/mixture/sources/tulu3.py (formerly prepare_tulu.py) --config configs/data/mixture/tulu_control.yaml
# (1.5M tokens, budgeted with this model's chat template). 0% synthetic documents.
data_path: "data/tulu_control_1p5M.jsonl"
output_dir: "output/train_lora_tulu_control"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  epochs: 2
  batch_size: 4
  grad_accum: 4                # effective batch 16; ~45 optimizer steps/epoch at 1.5M tokens
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  max_seq_len: 2048            # must match max_seq_len in configs/data/mixture/tulu_control.yaml
  packing: true
  # Qwen3's chat template has no {% generation %} markers, so assistant-only masking
  # yields all-zero masks; use standard full-sequence SFT loss. (CLAUDE.md gotcha 4)
  assistant_only_loss: true
  attn_implementation: sdpa

# Eval-time thinking mode of this arm (CLAUDE.md eval framework): stamped into the
# adapter's training_meta.json and validated against the data before training.
thinking: true
