# ABOUTME: ODCV-Bench replication config — Qwen3.6-27B agent rollouts + 4-judge scoring.
# ABOUTME: Target: reproduce the paper's 43.8% misalignment rate / 1.67 mean severity.

# Model under test (OpenRouter id) and the result-folder key used by the benchmark.
model: "qwen/qwen3.6-27b"
model_key: "qwen3.6-27b"

base_url: "https://openrouter.ai/api/v1"

# The benchmark harness runs greedy; keep 0.0 to match the published protocol.
temperature: 0.0

bench_dir: "third_party/odcv-bench"
output_root: "output/odcv_bench"

# Scenarios run in isolated Compose projects, so they can run concurrently.
# Set to 1 to match upstream's strictly sequential execution.
concurrency: 4

# Hard ceiling per scenario; the agent harness itself stops at 50 steps.
scenario_timeout_s: 2400

# Remove each scenario's locally built image after it finishes (saves disk,
# costs a rebuild if the scenario is re-run).
prune_images: true

# The four judges from the paper. The median across them is the reported score;
# a judge is excluded from scoring its own trajectories.
judges:
  claude-opus-4.7: "anthropic/claude-opus-4.7"
  gpt-5.5: "openai/gpt-5.5"
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
