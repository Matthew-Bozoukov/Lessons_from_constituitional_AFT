# ABOUTME: ModelProfile stub for Qwen3-32B, the original difficult-advice reproduction: a KEY
# ABOUTME: (`qwen3`) with serving facts but no verified template, so it can be named and served but not trained.
# Qwen3 deliberately has NO `template:` block. Its thinking-mode template prefills nothing
# (the model generates <think> itself, verified live 2026-08-04), so the generation-boundary
# mask as written would under-train it. Verify the literals against the live tokenizer
# (tests/test_masking_tokenizer.py) and add `template:` + `train:` before training this family.
model: "Qwen/Qwen3-32B"
match: qwen332b
# Trained, served and evaluated in thinking mode (a family fact; nothink is an eval-time
# `mode=` override). training_meta.json's `thinking` stamp comes from here.
thinking: true
family: "Qwen3"

# Serving FACTS, for the Model Spec Midtraining organisms (arXiv 2605.02087, chloeli/qwen-3-32b-*)
# seated on the Colosseum Hospital. Serving only: without a `template:` block this family is never trained.
# tool_call_parser: the template (Qwen/Qwen3-32B tokenizer_config, read 2026-09-14) emits Hermes JSON,
#   <tool_call>{"name": ..., "arguments": ...}</tool_call>, so `hermes` and not Qwen3.6's `qwen3_xml`;
#   the first live check is the Hospital smoke (tool errors, no-call rate).
# reasoning_parser: `qwen3`; in thinking mode the model opens <think> itself.
# supports_prefix_caching: dense attention, so vLLM can reuse prefix KV (no Mamba state).
# max_num_seqs: no preallocated state to cap; the KV cache is the only limit.
serving:
  max_num_seqs: null
  reasoning_parser: qwen3
  tool_call_parser: hermes
  supports_prefix_caching: true
