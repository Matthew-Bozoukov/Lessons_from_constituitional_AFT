# ABOUTME: 500k-token mixture weighted toward maths: NuminaMath-CoT 67%, TULU3 and No Robots
# ABOUTME: sharing the remaining 33%. Every conversation renders with NO think block.

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"

# 500,000 tokens total. The 33% non-maths share is split evenly between the two.
sources:
  numinamath_cot:
    repo: "AI-MO/NuminaMath-CoT"
    split: "train"
    tokens: 335000
  tulu3:
    repo: "allenai/tulu-3-sft-mixture"
    split: "train"
    tokens: 82500
  no_robots:
    repo: "HuggingFaceH4/no_robots"
    split: "train"
    tokens: 82500

# Drop conversations longer than the training sequence length rather than truncating
# them mid-answer.
max_seq_len: 3072

# Modest: a large buffer over NuminaMath's long rows exhausts memory.
shuffle_buffer: 1000

output_dir: "output/mixture_500k_numina_heavy"
