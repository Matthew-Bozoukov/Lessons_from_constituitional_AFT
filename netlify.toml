# Netlify build configuration. This is the ONLY netlify.toml in the repository.
#
# It used to be split in two - `base` here, build settings in
# `Visualizer/netlify.toml` - on the reasoning that keeping the command in one
# place stops the files drifting apart. That reasoning inverted in practice:
# resolving `base` from the root file and then re-reading a second file from
# inside that base is order-dependent, and which file wins for a given key is
# not obvious from either of them. One file, all keys, no resolution order to
# reason about.
#
# Paths in `command` and `publish` are relative to `base`, so `publish = "out"`
# means `Visualizer/out`.

[build]
  base = "Visualizer"
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  # Matches the `engines.node` floor in Visualizer/package.json. Raise both
  # together or the build can pass locally and fail here.
  NODE_VERSION = "22.13.0"
  NEXT_TELEMETRY_DISABLED = "1"

  # The build reads dataset manifests from Hugging Face. All of them are public,
  # so NO token is needed and none should be set here - see
  # Visualizer/docs/HUGGINGFACE_DATA_SOURCE.md.
  #
  # A Hub failure must never fail a deploy; it degrades to a described gap on
  # the affected entry. These two bound how long that degradation can take:
  # 10s per request, at most 4 tree pages, so an unreachable Hub costs the build
  # seconds rather than minutes.
  HF_TIMEOUT_MS = "10000"
  HF_TREE_MAX_PAGES = "4"

# Deploy previews and branch builds are byte-identical to production here: the
# site is static, reads only public data, and holds no environment-specific
# configuration. Declared explicitly so a preview cannot silently diverge.
[context.deploy-preview]
  command = "npm run build:netlify"

[context.branch-deploy]
  command = "npm run build:netlify"
