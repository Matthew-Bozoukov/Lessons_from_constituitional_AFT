# ABOUTME: Reference run config for the synthetic document pipeline. Copy and edit
# ABOUTME: for a new corpus; change ONE field and use a sweep for an ablation.
#
# Run:   uv run python -m synthdoc.cli run --config base.yaml
# Smoke: uv run python -m synthdoc.cli run --config base.yaml --smoke   (offline, 8 docs, free)
#
# Every field here is an experimental axis. If you find yourself wanting to edit
# Python to try something, that is a missing config field - add it rather than
# branching in a generator (see the failure mode in the master spec, section 10).

seed: 0
max_workers: 16
resume: true                    # completed stage snapshots are reloaded, not regenerated
budget_usd: 0                   # > 0 aborts the run when cumulative cost passes it

output_dir: output/synthdoc
cache_dir: output/synthdoc_cache
cache_enabled: true             # content-addressed on (stage, input, prompt, model, params)

spec:
  id: claude_constitution_principles
  # Points at the repo's existing distilled constitution. Drop new specs into
  # synthdoc/control/specs/<id>.md and delete this line to load them by id alone.
  path: docs/claude_constitution_principles.md
  chunker:
    granularity: bullet         # bullet | trait | section
    min_words: 8

recipe:
  n: 20000

  chunks_per_example: {1: 0.7, 2: 0.2, 4: 0.1}

  grouping:
    random: 0.5                 # unrelated chunks; tests holding two principles at once
    adjacent: 0.3               # contiguous within a section; preserves spec structure
    semantic: 0.2               # nearest neighbours; groups material the spec separates
  grouping_params:
    adjacent: {same_section_only: true}
    semantic: {min_similarity: 0.6, max_similarity: 0.95}

  doc_type:
    difficult_advice: 0.30
    model_as_actor: 0.20
    trait_conflict: 0.15
    trait_inapplicable: 0.10
    multiturn_adversarial: 0.15
    legal_reasoning: 0.10

  # Everything below is an axis: any key here that is not one of
  # n / chunks_per_example / grouping / grouping_params / doc_type is read as an
  # axis mixture and must be declared in control/prompts/axes.yaml.
  tools:         {none: 0.7, defs_only: 0.2, agentic: 0.1}
  reasoning:     {visible_cot: 0.5, thinking_block: 0.3, terse: 0.2}
  explicitness:  {named: 0.2, gestured: 0.4, embodied: 0.4}
  stakes_holder: {self: 0.25, third_party: 0.35, institution: 0.25, public: 0.15}
  turns:         {single: 0.5, short: 0.35, long: 0.15}

llm:
  provider: openrouter          # openrouter | echo (echo is offline and free)

embedder:
  name: hashing                 # hashing (offline) | openai
  dim: 1024

generation:
  model: anthropic/claude-sonnet-4.5
  temperature: 1.0
  max_tokens: 4096
  template: v2                  # see control/prompts/generation.yaml
  max_parse_retries: 1

# The length of this list IS the revision dose. Removing an entry removes a stage.
revision:
  - {kind: critique_rewrite, model: anthropic/claude-sonnet-4.5, context: fresh}
  - {kind: realism_pass,     model: anthropic/claude-sonnet-4.5, context: same}

filters:
  - {kind: length, min_words: 80, max_words: 6000}
  - {kind: embedding_dedup, threshold: 0.87}
  - {kind: autorater, rubric: v4, model: anthropic/claude-sonnet-4.5,
     n_raters: 3, min_score: 3, report_agreement: true}

snapshots:
  backend: huggingface          # set to "local" to keep everything on disk
  org: LASR-Callum
  repo: "synthdoc-{run_id}"
  private: true
  push_every_stage: true
  also_local: true
  write_jsonl: true             # required for re-running a single stage in isolation

export:
  format: sft_chat
  mix: {pretrain_shard: 0.4}

report:
  enabled: true
  plot: true
