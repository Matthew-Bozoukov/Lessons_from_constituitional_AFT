# ABOUTME: Reference run config for the synthetic document pipeline. Copy and edit
# ABOUTME: for a new corpus; change ONE field and use a sweep for an ablation.
#
# Run:   uv run python -m synthdoc.cli run --config base.yaml
# Smoke: uv run python -m synthdoc.cli run --config base.yaml --smoke   (offline, 8 docs, free)
#
# Every field here is an experimental axis. If you find yourself wanting to edit
# Python to try something, that is a missing config field - add it rather than
# branching in a generator (see the failure mode in the master spec, section 10).

seed: 0
max_workers: 16
resume: true                    # completed stage snapshots are reloaded, not regenerated
budget_usd: 0                   # > 0 aborts the run when cumulative cost passes it

output_dir: output/synthdoc

cache:
  enabled: true
  dir: output/synthdoc_cache    # WHERE. Share across runs - that is what makes sweeps cheap.
  namespace: ""                 # key prefix; set it to force fresh calls without deleting
  # WHICH call sites are cached. Drop "generate" to re-sample documents while still
  # replaying expensive rating calls; drop "filter" to re-rate an unchanged corpus.
  scope: [plan, generate, revise, filter]
  max_bytes: 0                  # HOW MUCH. 0 = unlimited; otherwise oldest entries evicted
  embeddings: true              # cache the per-spec embedding index (built once per spec)
  embeddings_dir: null          # defaults to <dir>/embeddings

spec:
  # Resolved by id: control/specs/<id>.md first, then control/specs/index.yaml, which
  # points this one at the repo's existing docs/claude_constitution_principles.md
  # without copying it. Keeping `path` unset is what lets `axis: spec.id` sweeps work.
  id: claude_constitution_principles
  chunker:
    granularity: bullet         # bullet | trait | section
    min_words: 8

recipe:
  n: 20000

  chunks_per_example: {1: 0.7, 2: 0.2, 4: 0.1}

  grouping:
    random: 0.5                 # unrelated chunks; tests holding two principles at once
    adjacent: 0.3               # contiguous within a section; preserves spec structure
    semantic: 0.2               # nearest neighbours; groups material the spec separates
  grouping_params:
    adjacent: {same_section_only: true}
    semantic: {min_similarity: 0.6, max_similarity: 0.95}

  doc_type:
    difficult_advice: 0.25
    model_as_actor: 0.18
    trait_conflict: 0.12
    trait_inapplicable: 0.10
    multiturn_adversarial: 0.12
    legal_reasoning: 0.08
    aligned_ai_fiction: 0.10    # Teaching Claude Why: fiction cut blackmail 65% -> 19%
    constitution_explainer: 0.05

  # Everything below is an axis: any key here that is not one of
  # n / chunks_per_example / grouping / grouping_params / doc_type is read as an
  # axis mixture and must be declared in control/prompts/axes.yaml.
  tools:         {none: 0.7, defs_only: 0.2, agentic: 0.1}
  reasoning:     {visible_cot: 0.5, thinking_block: 0.3, terse: 0.2}
  explicitness:  {named: 0.2, gestured: 0.4, embodied: 0.4}
  stakes_holder: {self: 0.25, third_party: 0.35, institution: 0.25, public: 0.15}
  turns:         {single: 0.5, short: 0.35, long: 0.15}
  system_prompt: {none: 0.5, minimal: 0.2, deployment: 0.2, persona: 0.1}

llm:
  provider: openrouter          # openrouter | echo (echo is offline and free)

embedder:
  name: hashing                 # hashing (offline) | openai
  dim: 1024

# Scenario planning: decide WHICH situation is worth writing before writing it.
# GDM's structured what/how/why step. Disable it for the control arm that generates
# straight from the spec chunk.
planning:
  enabled: true
  model: anthropic/claude-sonnet-4.5
  template: what_how_why        # what_how_why | situation_only
  temperature: 1.0
  max_tokens: 1200

generation:
  model: anthropic/claude-sonnet-4.5
  temperature: 1.0
  max_tokens: 4096
  template: v2                  # see control/prompts/generation.yaml
  # single_pass | draft_then_align (answer with no spec, then align) | best_of_n
  strategy: draft_then_align
  strategy_params: {}           # best_of_n: {n: 4, selector: judge}
  max_parse_retries: 1

# The length of this list IS the revision dose. Removing an entry removes a stage.
revision:
  - {kind: critique_rewrite,     model: anthropic/claude-sonnet-4.5, context: fresh}
  # Anthropic's headline finding: rewriting responses to deliberate about values moved
  # misalignment 22% -> 3%, where plain filtering only reached 15%.
  - {kind: values_deliberation,  model: anthropic/claude-sonnet-4.5, context: fresh}
  - {kind: realism_pass,         model: anthropic/claude-sonnet-4.5, context: same}

filters:
  - {kind: length, min_words: 80, max_words: 6000}
  - {kind: embedding_dedup, threshold: 0.87}
  # GDM's scan-cluster-autorate: discover the corpus's own recurring tics, then rate
  # every document against them. The discovered pattern list lands in the manifest.
  - {kind: pattern_scan, model: anthropic/claude-sonnet-4.5, discover: true,
     n_batches: 8, batch_size: 12, min_scans: 2, max_patterns: 2, mode: strict}
  - {kind: autorater, rubric: v4, model: anthropic/claude-sonnet-4.5,
     n_raters: 3, min_score: 3, report_agreement: true}

snapshots:
  backend: huggingface          # set to "local" to keep everything on disk
  org: LASR-Callum
  repo: "synthdoc-{run_id}"     # -> LASR-Callum/synthdoc-<name>, one split per stage
  private: true
  push_every_stage: true
  also_local: true              # written during the run; see cleanup_local below
  write_jsonl: true             # required for re-running a single stage in isolation
  # HuggingFace is the durable home for corpora: once every stage, export, and report
  # has been verifiably uploaded, the local copies are deleted. Nothing is removed if
  # any push failed. Consequence: the run can no longer be resumed from disk - but the
  # call cache is untouched, so regenerating costs almost nothing.
  cleanup_local: true

export:
  format: sft_chat
  mix: {pretrain_shard: 0.4}
  # GDM removed the system prompts used to generate their data before training. Our
  # generation instructions never enter a document's turns, so this only affects
  # in-document system turns (tool definitions, personas): keep them to train the
  # behaviour in context, strip them to train it unconditionally.
  strip_system: false
  # GDM: mixing synthetic data with baseline SFT data "helped a lot" against
  # capability regressions. Point `path` at an existing chat JSONL to enable.
  baseline: {path: null, ratio: 1.0, shuffle_seed: 0}

report:
  enabled: true
  plot: true
