# ABOUTME: How much does the generation prompt itself matter? v1 is a deliberately thin
# ABOUTME: control arm, so this bounds how much of the quality comes from prompt engineering.
#
# Run: uv run python -m synthdoc.cli sweep --config template.yaml --n 300

base: base.yaml
axis: generation.template
n: 300

arms:
  - {name: v1_thin, value: v1}
  - {name: v2_full, value: v2}
