# ABOUTME: The vLLM serving environment every eval pod installs: its direct pins here, every exact version in uv.lock,
# ABOUTME: kept apart from the repo's own env. Consumed by src/infra/runpod.py (`uv run runpod up`), which installs the lock on the pod.
#
# WHY IT EXISTS. An eval pod has no copy of this repo, so it never saw the root uv.lock; until 2026-11-16 its boot
# script ran `uv pip install vllm==<pin> ... transformers` with transformers unpinned. vLLM 0.26.0 only sets a floor
# (transformers>=5.5.3), so each pod got whatever PyPI served that day -- and transformers 5.23.0 (2026-11-13) made
# vLLM 0.26 exit at start-up on Qwen3.6 ("Found 1 <|image_pad|> tokens in the text but no images were passed", raised
# while it profiles memory with a dummy image). The serving stack is part of the measuring instrument, so it is locked.
#
# WHAT THE LOCK REPRODUCES. uv.lock was seeded from `uv pip freeze` of pod spuk5fl00oit29 on 2026-11-16, the pod that
# served the base-Qwen MASK+tools run on transformers 5.22.2 (the release before the break; 5.22.2 is what a pod built
# on 2026-11-11 would also have resolved): 198 packages, each at the version that pod reported.
#
# TO CHANGE IT. Edit the pins below, then `uv lock --project src/infra/endpoints/vllm_env` and commit both files. Move
# vllm and transformers together, serve one smoke eval on a fresh pod, and write a docs/LOG.md entry: a new serving
# stack is a new instrument. The root pyproject.toml carries the same vllm pin for serving on a linux driver; a test
# keeps the two equal.
[project]
name = "lasr-vllm-serving-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm==0.26.0",
    "transformers==5.22.2",
    # flashinfer (pulled in by vllm) JIT-compiles with ninja and fails with exit 127 without it.
    "ninja",
    # `hf download` pre-pulls the weights at boot.
    "huggingface_hub",
    "hf_transfer",
]

[tool.uv]
package = false
# Pods are linux x86_64; resolving for nothing else keeps the lock one fork with one version per package.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
