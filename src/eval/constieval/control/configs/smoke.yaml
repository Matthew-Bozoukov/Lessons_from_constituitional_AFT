# ABOUTME: Offline smoke run: echo providers, tiny counts, no network and no spend.
# ABOUTME: Exercises item building, generation, judging, rates and all three plots end to end.

extends: base.yaml

name: smoke
output_dir: output/constieval_smoke

cache:
  dir: output/constieval_smoke/cache

itemset:
  dir: output/constieval_smoke/itemsets
  id: null
  families:
    application:
      difficulties: [edge, ambiguous]
      variants: 2
    fake_clause:
      per_clause: 2
  generator:
    provider: echo
    model: echo-generator

target:
  provider: echo
  model: echo-target
  base_url: null
  extra_body: {}

judge:
  provider: echo
  model: echo-judge

run:
  recipe: smoke
