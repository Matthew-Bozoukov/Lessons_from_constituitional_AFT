[project]
name = "petri-subscription"
version = "0.1.0"
description = "Inspect model provider that drives Petri's auditor through the Claude Agent SDK (Claude Code credentials) instead of an Anthropic API key."
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.250",
    "claude-agent-sdk>=0.2.128",
]

[project.entry-points.inspect_ai]
petri_subscription = "petri_subscription._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petri_subscription"]
