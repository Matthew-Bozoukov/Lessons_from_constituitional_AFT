# ABOUTME: Tiny offline config: echo provider, local snapshots, every stage exercised.
# ABOUTME: Run: uv run synthdoc run --config smoke.yaml --n 12

seed: 0
max_workers: 4
resume: false
output_dir: output/synthdoc_smoke
cache_dir: output/synthdoc_smoke/cache

spec:
  id: demo_spec
  chunker: {granularity: bullet, min_words: 5}

recipe:
  n: 12
  chunks_per_example: {1: 0.6, 2: 0.4}
  grouping:
    random: 0.4
    adjacent: 0.3
    semantic: 0.3
  grouping_params:
    adjacent: {same_section_only: false}
    semantic: {min_similarity: 0.0, max_similarity: 0.99}
  doc_type:
    difficult_advice: 0.5
    trait_conflict: 0.25
    trait_inapplicable: 0.25
  tools:        {none: 0.6, defs_only: 0.2, agentic: 0.2}
  reasoning:    {visible_cot: 0.5, thinking_block: 0.5}
  explicitness: {named: 0.34, gestured: 0.33, embodied: 0.33}

llm:
  provider: echo

generation:
  model: echo-gen
  temperature: 1.0
  max_tokens: 512
  template: v2

revision:
  - {kind: critique_rewrite, model: echo-gen, context: fresh}

filters:
  - {kind: length, min_words: 1, max_words: 100000}
  - {kind: embedding_dedup, threshold: 0.999}
  - {kind: autorater, rubric: v4, model: echo-rater, n_raters: 2, min_score: 3}

snapshots:
  backend: local

export:
  format: sft_chat
  mix: {pretrain_shard: 0.25}

report:
  enabled: true
  plot: true
