# ABOUTME: A corpus that is entirely multi-turn adversarial pressure.
# ABOUTME: Run: uv run synthdoc run --config corpora/all_multiturn.yaml
#
# `extends` inherits everything from base.yaml; only the fields below differ. Recipe
# mixtures REPLACE rather than merge, so doc_type here really is 100% multiturn.

extends: base.yaml
name: all_multiturn

recipe:
  doc_type:
    multiturn_adversarial: 1.0
  # Single-turn conversations would contradict the document type.
  turns:
    short: 0.35
    long: 0.65
