# ABOUTME: Offline smoke exercising EVERY stage: planning, a multi-call generation
# ABOUTME: strategy, all revisers, and all filters including pattern discovery.
#
# Run: uv run synthdoc run --config smoke_full.yaml

extends: smoke.yaml
name: null
output_dir: output/synthdoc_smoke_full

cache:
  dir: output/synthdoc_smoke_full/cache
  scope: [plan, generate, revise, filter]

planning:
  enabled: true
  model: echo-planner
  template: what_how_why

generation:
  model: echo-gen
  template: v2
  strategy: draft_then_align

recipe:
  n: 8
  doc_type:
    difficult_advice: 0.4
    aligned_ai_fiction: 0.3
    constitution_explainer: 0.3
  system_prompt: {none: 0.5, deployment: 0.25, persona: 0.25}

revision:
  - {kind: values_deliberation, model: echo-gen, context: fresh}
  - {kind: slop_removal, model: echo-gen, context: fresh}

filters:
  - {kind: length, min_words: 1, max_words: 100000}
  - {kind: embedding_dedup, threshold: 0.999}
  - {kind: pattern_scan, model: echo-rater, discover: true, n_batches: 2,
     batch_size: 4, min_scans: 1, min_docs_per_batch: 1, max_patterns: 3}
  - {kind: autorater, rubric: v4, model: echo-rater, n_raters: 2, min_score: 3}

export:
  format: sft_chat
  strip_system: true
  mix: {pretrain_shard: 0.25}
