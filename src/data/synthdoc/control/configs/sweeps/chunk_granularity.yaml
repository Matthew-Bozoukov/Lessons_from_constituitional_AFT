# ABOUTME: How finely should the spec be cut? Changes the chunk pool, so arms are unpaired
# ABOUTME: and coverage reports are not directly comparable across arms.
#
# Run: uv run python -m synthdoc.cli sweep --config chunk_granularity.yaml --n 300

base: base.yaml
axis: spec.chunker.granularity
n: 300

arms:
  - {name: bullet,  value: bullet}
  - {name: trait,   value: trait}
  - {name: section, value: section}
