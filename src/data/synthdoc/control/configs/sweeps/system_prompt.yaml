# ABOUTME: Does the behaviour hold when a deployment system prompt is present that says
# ABOUTME: nothing about values? Anthropic augmented with diverse system prompts.
#
# Run: uv run synthdoc sweep --config system_prompt.yaml --n 300

base: base.yaml
axis: recipe.system_prompt
n: 300

arms:
  - {name: none,       value: {none: 1.0}}
  - {name: minimal,    value: {minimal: 1.0}}
  - {name: deployment, value: {deployment: 1.0}}
  - {name: mixed,      value: {none: 0.5, minimal: 0.2, deployment: 0.2, persona: 0.1}}
