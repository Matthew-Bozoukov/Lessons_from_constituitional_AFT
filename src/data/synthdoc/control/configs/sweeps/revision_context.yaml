# ABOUTME: Should the reviser see the original generation instructions, or come to the
# ABOUTME: document fresh? An assumption every prior pipeline made silently.
#
# Run: uv run python -m synthdoc.cli sweep --config revision_context.yaml --n 300

base: base.yaml
axis: revision
n: 300

arms:
  - name: fresh
    value: [{kind: critique_rewrite, model: anthropic/claude-sonnet-4.5, context: fresh}]
  - name: same
    value: [{kind: critique_rewrite, model: anthropic/claude-sonnet-4.5, context: same}]
