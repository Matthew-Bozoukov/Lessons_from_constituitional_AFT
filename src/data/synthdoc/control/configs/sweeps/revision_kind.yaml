# ABOUTME: Which single revision pass earns its cost? Dose is held at one so this measures
# ABOUTME: the strategy, not the number of passes.
#
# Run: uv run synthdoc sweep --config revision_kind.yaml --n 300

base: base.yaml
axis: revision
n: 300

arms:
  - name: none
    value: []
  - name: critique_rewrite
    value: [{kind: critique_rewrite, model: anthropic/claude-sonnet-4.5, context: fresh}]
  - name: realism_pass
    value: [{kind: realism_pass, model: anthropic/claude-sonnet-4.5, context: fresh}]
  - name: spec_grounding_pass
    value: [{kind: spec_grounding_pass, model: anthropic/claude-sonnet-4.5, context: fresh}]
