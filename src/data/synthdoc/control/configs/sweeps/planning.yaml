# ABOUTME: Does choosing the situation before writing it help? GDM's structured scenario
# ABOUTME: step, never ablated. Planning adds a stage, so the effect is also a stage diff.
#
# Run: uv run synthdoc sweep --config planning.yaml --n 300

base: base.yaml
axis: planning.enabled
n: 300

# draft_then_align needs a plan, so hold the strategy at single_pass across arms -
# otherwise "no planning" would also silently mean "different generation strategy".
base_overrides:
  generation.strategy: single_pass

arms:
  - {name: unplanned, value: false}
  - {name: planned,   value: true}
