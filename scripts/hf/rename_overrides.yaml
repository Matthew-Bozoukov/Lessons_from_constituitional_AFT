# ABOUTME: Hand-written Hub names for repos whose old name only a human can repair — a
# ABOUTME: version number ("v2") is not a name, so this file says what each variant CHANGED.
#
# Read by scripts/hf/rename_repos.py. Template, in order:
#   <YYYY-MM-DD>-<generator or base model>-<document type / arm>-<size>-<what this changes>
# The date is when the artifact was produced; the tail is the one fact that distinguishes
# it from its siblings. Anything a card did not record is called out in a comment rather
# than invented.

