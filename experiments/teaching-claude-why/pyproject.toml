[project]
name = "difficult-advice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "fire>=0.7.1",
    "huggingface-hub>=1.25.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "openai>=2.48.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "tqdm>=4.69.1",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Lets `import synthdoc` resolve from the repo root without a sys.path shim in tests.
pythonpath = ["."]
