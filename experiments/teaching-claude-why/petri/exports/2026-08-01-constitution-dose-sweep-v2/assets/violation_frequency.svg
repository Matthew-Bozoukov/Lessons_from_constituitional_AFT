<svg xmlns="http://www.w3.org/2000/svg" width="640" height="672" viewBox="0 0 640 672" font-family="Helvetica, Arial, system-ui, sans-serif">
  <rect width="640" height="672" fill="#ffffff"/>

  <!-- title stack -->
  <text x="320" y="50"  text-anchor="middle" font-size="31" font-weight="700" fill="#1a1a1a">Audit Agents</text>
  <text x="320" y="88"  text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Frequency of Violations</text>
  <text x="320" y="115" text-anchor="middle" font-size="15" font-style="italic" fill="#6b6b6b">0 to 1, lower is better</text>

  <!-- horizontal gridlines -->
  <g stroke="#e9e9e9" stroke-width="1">
    <line x1="88" y1="170"   x2="612" y2="170"/>
    <line x1="88" y1="222.5" x2="612" y2="222.5"/>
    <line x1="88" y1="275"   x2="612" y2="275"/>
    <line x1="88" y1="327.5" x2="612" y2="327.5"/>
    <line x1="88" y1="380"   x2="612" y2="380"/>
    <line x1="88" y1="432.5" x2="612" y2="432.5"/>
    <line x1="88" y1="485"   x2="612" y2="485"/>
    <line x1="88" y1="537.5" x2="612" y2="537.5"/>
    <line x1="88" y1="590"   x2="612" y2="590"/>
  </g>

  <!-- axes -->
  <line x1="88" y1="170" x2="88" y2="590" stroke="#cfcfcf" stroke-width="1"/>
  <line x1="88" y1="590" x2="612" y2="590" stroke="#cfcfcf" stroke-width="1"/>

  <!-- y tick labels -->
  <g text-anchor="end" font-size="14" fill="#5f5f5f">
    <text x="78" y="595">0.00</text>
    <text x="78" y="542.5">0.05</text>
    <text x="78" y="490">0.10</text>
    <text x="78" y="437.5">0.15</text>
    <text x="78" y="385">0.20</text>
    <text x="78" y="332.5">0.25</text>
    <text x="78" y="280">0.30</text>
    <text x="78" y="227.5">0.35</text>
    <text x="78" y="175">0.40</text>
  </g>

  <!-- x tick labels -->
  <g text-anchor="middle" font-size="14" fill="#5f5f5f">
    <text x="120" y="614">0</text>
    <text x="235" y="614">10</text>
    <text x="350" y="614">20</text>
    <text x="580" y="614">40</text>
  </g>
  <text x="350" y="644" text-anchor="middle" font-size="16" fill="#1a1a1a">SFT Percentage (%)</text>

  <!-- 95% confidence intervals -->
  <g stroke="#4a90d2" stroke-width="1.9">
    <line x1="120" y1="220.8" x2="120" y2="377.8"/>
    <line x1="113" y1="220.8" x2="127" y2="220.8"/>
    <line x1="113" y1="377.8" x2="127" y2="377.8"/>

    <line x1="235" y1="252.4" x2="235" y2="405.7"/>
    <line x1="228" y1="252.4" x2="242" y2="252.4"/>
    <line x1="228" y1="405.7" x2="242" y2="405.7"/>

    <line x1="350" y1="211.1" x2="350" y2="371.7"/>
    <line x1="343" y1="211.1" x2="357" y2="211.1"/>
    <line x1="343" y1="371.7" x2="357" y2="371.7"/>

    <line x1="580" y1="340.2" x2="580" y2="476.7"/>
    <line x1="573" y1="340.2" x2="587" y2="340.2"/>
    <line x1="573" y1="476.7" x2="587" y2="476.7"/>
  </g>

  <!-- series -->
  <polyline points="120,304.3 235,334.7 350,296.3 580,416.2"
            fill="none" stroke="#4a90d2" stroke-width="2.6"/>
  <g fill="#4a90d2">
    <circle cx="120" cy="304.3" r="6.2"/>
    <circle cx="235" cy="334.7" r="6.2"/>
    <circle cx="350" cy="296.3" r="6.2"/>
    <circle cx="580" cy="416.2" r="6.2"/>
  </g>

  <!-- legend -->
  <line x1="452" y1="196" x2="486" y2="196" stroke="#4a90d2" stroke-width="2.6"/>
  <circle cx="469" cy="196" r="6.2" fill="#4a90d2"/>
  <text x="496" y="201" font-size="15" fill="#1a1a1a">SFT-only</text>

  <!-- footnote -->
  <text x="320" y="666" text-anchor="middle" font-size="12" fill="#8a8a8a">Scored by an automated judge · 139–147 audits per point · 95% confidence intervals</text>
</svg>
