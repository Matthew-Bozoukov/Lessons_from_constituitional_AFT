# Dataset card for the approved-constitution SFT corpus.
#
# The corpus itself was already published to
# LASR-Callum/2026-07-29-synthdoc-approved-constitution-sft. This card adds the
# manifest and the lazily-fetched chunks the research-log visualizer reads, and
# points them at the file already in the repo rather than uploading it twice:
#
#   uv run python -m synthdoc.cli publish \
#     --kind=dialogues \
#     --export=<local copy of sft_approved_constitution.jsonl> \
#     --repo=LASR-Callum/2026-07-29-synthdoc-approved-constitution-sft \
#     --card=exports/2026-07-29-synthdoc-approved-constitution-sft/dataset-card.yaml \
#     --source_file=sft_approved_constitution.jsonl \
#     --id_field=doc_id --category_field=doc_type --split_field=corpus \
#     --dry_run=False

experiment: >-
  Synthetic SFT corpus generated by synthdoc from the approved constitution, to
  regenerate the difficult-advice training data against a revised specification
  at a scale comparable to v1, so that the constitution is the intended
  difference between the two datasets. 1,443 documents / 1,531,369 Qwen3
  tokens across five sub-corpora, matching v1's 1.52M.

date_generated: "2026-07-29"

constitution: >-
  Claude approved constitution (7 principles plus a priority order), spec id
  claude_approved_constitution. Tracked in this repository at
  experiments/teaching-claude-why/docs/claude_approved_constitution.md, with the
  changelog, evidence and rejected alternatives in
  claude_approved_constitution_rationale.md, and the generator's copy at
  synthdoc/control/specs/claude_approved_constitution.md. The substantive change
  from v1 is a principle against ends-justify-means reasoning, which is the
  failure mode the agentic honeypots actually measure.

source_repo: https://github.com/Matthew-Bozoukov/teaching_claude_why_replication
source_commit: 0c120b0

models:
  anthropic/claude-sonnet-4.5: >-
    planner, generator and reviser, all three stages, called through OpenRouter.
    No Anthropic key is used anywhere in this project.

generation_config:
  seed: 0
  planning: {template: what_how_why, temperature: 1, max_tokens: 1200}
  generation: {template: v2, strategy: draft_then_align, temperature: 1, max_tokens: 9000}
  revision: values_deliberation, fresh context - rewrote 83-85% of documents in every corpus
  filters: length (80-6000 words), embedding_dedup (threshold 0.95), autorater
  embedder: hashing, dim 1024
  sub_corpora: >-
    approved_difficult_advice (a human faces the dilemma), approved_embodied
    (the principle is never named), approved_agentic (the model is the actor
    with live tools), plus the _top variants selected by autorater score.

schema:
  doc_id: Stable document identifier; exposed to the viewer as `id`.
  scenario_hash: Hash of the scenario the document was planned from.
  messages: The SFT dialogue; each item has role and content.
  spec_id: The specification this document was generated against.
  chunk_ids: Which spec sections seeded this document.
  doc_type: Document archetype; exposed to the viewer as `category`.
  grouping_strategy: How spec chunks were grouped for this document.
  axes: The ablatable generation axes this document was drawn from.
  corpus: Which sub-corpus produced it; exposed to the viewer as `split`.

provenance: >-
  Generated with `uv run python -m synthdoc.cli run --config
  synthdoc/control/configs/corpora/approved_*.yaml` (five corpora), then merged
  and rendered to Qwen3 chat format as sft_approved_constitution.jsonl. Full
  method and the measured pipeline findings are in
  experiments/teaching-claude-why/LOG.md under 2026-07-29 (pm). Cost $171.46,
  itemised in docs/EXPENDITURE.md.

record_count: 1443
token_count_qwen3: 1531369
cost_usd: 171.46
