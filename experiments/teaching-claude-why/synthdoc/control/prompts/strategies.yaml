# ABOUTME: Prompts for multi-call generation strategies (draft-then-align, best-of-n).
# ABOUTME: Selected with `generation.strategy`; single_pass needs no prompts and is the control.
#
# PROVENANCE. Neither source post publishes literal prompt text - both describe their
# instructions in prose only. Every `source:` field below quotes the describing sentence
# verbatim so our wording can be audited against it. The prompt bodies are ours.

draft_then_align:
  description: >
    GDM's two-phase response generation: produce an initial answer, then refine it in a
    separate conversation context to sit closer to the excerpt. Which context the DRAFT
    sees is set by `strategy_params.draft_context` and is itself the interesting
    ablation - see the two draft entries below.
  source: |
    "have Gemini 3.1 Pro generate a scenario where that trait was important for
    directing behaviour, and turn this into a user prompt"

    "Generate an initial answer from Pro, with the trait in the model's system prompt"

    "in a separate conversation context, ask Pro to refine this answer to be more
    closely aligned with the chunk (but in a realistic, non-performative way)"

    "Gemini 3.1 Pro receives relevant parts of the traits document in its system prompt,
    and telling it to answer in a way that embodies the trait without being exaggerated
    or referring explicitly to the document"

    "The system prompt is removed for training"

  # draft_context: spec_in_system (default) - faithful to the description above.
  draft_spec_in_system:
    system: |
      You are a helpful assistant.

      The following describes how you behave:

      {% for c in chunks %}
      {{ c.text }}
      {% endfor %}

      Answer the user in a way that embodies this, without being exaggerated and without
      referring explicitly to the description above. Do not mention guidelines,
      principles, a document, or your training. Just answer as someone who holds these
      values would answer.

      Write the way you actually would: no preamble about your approach, no summary at
      the end, no headings unless the content genuinely needs them. Length should match
      what the question deserves.
    user: |
      {{ user_prompt }}

  # draft_context: no_spec - the contrast arm. NOT what GDM describe; the hypothesis is
  # that a draft written blind carries a more natural voice for the align pass to keep.
  draft_no_spec:
    system: |
      You are a helpful assistant. Answer the user directly and well.

      Write the way you actually would: no preamble about your approach, no summary at
      the end, no headings unless the content genuinely needs them. Length should match
      what the question deserves.
    user: |
      {{ user_prompt }}

  align:
    system: |
      You are refining a draft answer so that it sits more closely with a specification
      excerpt, in a realistic, non-performative way.

      This is a fresh context: judge the draft on what is in front of you.

      Two rules decide whether this works:

      1. KEEP THE DRAFT'S VOICE. You are adjusting judgement, not rewriting prose.
         Preserve its register, its rhythm, its willingness to be direct. If the draft
         was already consistent with the excerpt, change very little.
      2. NON-PERFORMATIVE. The assistant must not announce the principle, signal that it
         is being careful, or add caveats the excerpt does not require. Nothing may refer
         to a specification, guidelines, training, or a document. An exaggerated
         demonstration of the value is a failure, not a strong result.

      Where the draft is genuinely wrong under the excerpt, change what it decides - not
      just how it phrases the decision.

      Return ONLY a JSON object:
      {"turns": [{"role": "user", "content": "..."},
                 {"role": "assistant", "thinking": "...", "content": "..."}]}
    user: |
      ## Specification excerpt{{ "s" if n_chunks > 1 else "" }}

      {% for c in chunks %}
      [{{ c.chunk_id }}] {{ c.text }}
      {% endfor %}

      ## Document type: {{ doc_type }}

      {{ doc_type_instructions }}
      {% for a in axis_fragments %}
      ## {{ a.axis }}: {{ a.value }}

      {{ a.text }}
      {% endfor %}
      ## The user's opening turn

      {{ user_prompt }}

      ## Draft response

      {{ draft }}

      Return the refined document as JSON only.

best_of_n:
  description: >
    Anthropic's sample-and-filter, generalised. Generate n independent documents for the
    same condition and keep the one that best follows the excerpt. Plain filtering of
    sampled responses helped them modestly (22% -> 15% misalignment); the selector below
    picks on spec fidelity rather than polish, which is the distinction that mattered.
  source: |
    "Sampling the model on each prompt and filtering down to cases where the assistant
    chose not to take the honeypot"
  selector:
    system: |
      You are selecting the single best training document from several candidates for
      the same situation.

      Choose on these grounds, in order:
      1. Spec fidelity: the assistant's behaviour is what the excerpt implies HERE -
         neither more restrictive nor more permissive.
      2. Difficulty: the situation stays genuinely hard rather than resolving itself.
      3. Realism: it reads like something that happened.
      4. Proportion: no moralising, no unearned caveats, no throat-clearing.

      Polish is not a criterion. A rougher document that gets the judgement right beats
      a smooth one that does not.

      Return ONLY: {"choice": <0-based index>, "why": "<one sentence>"}
    user: |
      ## Specification excerpt{{ "s" if n_chunks > 1 else "" }}

      {% for c in chunks %}
      [{{ c.chunk_id }}] {{ c.text }}
      {% endfor %}

      ## Document type: {{ doc_type }}

      {{ doc_type_instructions }}

      ## Candidates

      {% for cand in candidates %}
      ### Candidate {{ loop.index0 }}

      {{ cand }}

      {% endfor %}
      Return the JSON only.
