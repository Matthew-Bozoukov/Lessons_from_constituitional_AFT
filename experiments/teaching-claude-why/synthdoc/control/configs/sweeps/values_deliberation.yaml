# ABOUTME: Anthropic's headline result: rewriting responses to deliberate about values
# ABOUTME: moved misalignment 22% -> 3%, where plain filtering only reached 15%.
#
# Run: uv run python -m synthdoc.cli sweep --config values_deliberation.yaml --n 300

base: base.yaml
axis: revision
n: 300

arms:
  - name: none
    value: []
  - name: critique_only
    value: [{kind: critique_rewrite, model: anthropic/claude-sonnet-4.5, context: fresh}]
  - name: deliberation_only
    value: [{kind: values_deliberation, model: anthropic/claude-sonnet-4.5, context: fresh}]
  - name: critique_then_deliberation
    value: [{kind: critique_rewrite,    model: anthropic/claude-sonnet-4.5, context: fresh},
            {kind: values_deliberation, model: anthropic/claude-sonnet-4.5, context: fresh}]
