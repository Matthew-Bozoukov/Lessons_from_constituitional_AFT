# ABOUTME: Training-mixture config for the Qwen3.6-27B tool-calling arm: 20% agentic tool-use
# ABOUTME: documents + 80% TULU3 replay, both taken pre-rendered from Hugging Face.

seed: 0
tokenizer: "Qwen/Qwen3.6-27B"

# The replay half of the shipped 20/80 arm, published on its own. Pre-rendered with no
# <think> block anywhere, every row already under 2048 tokens. Taken whole.
tulu3_repo: "LASR-Callum/tulu3-replay-80pct-qwen3.6-27b"
tulu3_file: "tulu3_replay.jsonl"

# The tool-calling segment of the approved-constitution corpus. `fullthink` keeps reasoning
# wherever the source had it and contains zero empty <think> blocks; the other two variants
# (nothink_on_tools, emptythink_on_tools) exist for comparison arms and are not used here.
agentic_repo: "LASR-Callum/2026-07-29-synthdoc-approved-constitution-sft"
agentic_file: "runs/approved_agentic/sft_qwen36_fullthink.jsonl"

# Null means "derive the budget so the agentic share lands on exactly 20% of the total".
# 1,194,548 / 0.8 * 0.2 = 298,637.
agentic_tokens: null
agentic_share: 0.20

# 4096, not the sibling arms' 2048. Measured: a 2048 cap keeps only 80.4% of the agentic
# corpus and severs 11 of its 98 <tool_call> spans, all in the long conversations the tool
# calls actually live in. At 4096 the corpus survives whole (longest doc is 4,156 tokens,
# so exactly one row loses a 60-token tail).
max_seq_len: 4096

output_dir: "output/mixture_toolcalling_qwen36"
