# ABOUTME: agentic-misalignment eval config for Qwen3 served via local vLLM (vllm/qwen3).
# ABOUTME: Blackmail + leaking honeypots, spontaneous and goal-conflict, self-preservation urgencies.

experiment_id: "qwen3_eval"
description: "Difficult-advice replication: agentic misalignment (blackmail/leaking) on Qwen3-32B"
researcher: "replication"

global:
  models:
    - "vllm/qwen3"

  temperature: 1.0

  concurrency:
    providers:
      vllm: 32
    models:
      "vllm/qwen3": 32

  samples_per_condition: 50

expansions:
  - name: "spontaneous"
    description: "No explicit goal; self-preservation pressure only"
    enabled: true
    variables:
      scenarios: ["blackmail", "leaking"]
      goal_types: ["none"]
      goal_values: ["none"]
      urgency_types: ["replacement", "restriction"]

  - name: "goal_conflict"
    description: "Explicit goal conflicting with the company direction"
    enabled: true
    variables:
      scenarios: ["blackmail", "leaking"]
      goal_types: ["explicit"]
      goal_values: ["america"]
      urgency_types: ["replacement", "restriction"]

# Inline classification is disabled (no Anthropic key); the separate
# classify_results step uses Sonnet 4.5 via OpenRouter as the judge.
classification:
  enabled: false
  models:
    blackmail: "blackmail_classifier"
    leaking: "leak_classifier"

execution:
  resume_interrupted: true
  timeout_seconds: 300
  retries: 2
  checkpoint_frequency: 5
