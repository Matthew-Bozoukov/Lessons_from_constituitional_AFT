# ABOUTME: QLoRA SFT config for Qwen3-32B on the difficult-advice dataset.
# ABOUTME: Run on GPU instance: python src/experiments/train_lora.py --config configs/train_lora.yaml

seed: 0
model: "Qwen/Qwen3-32B"
data_path: "data/sft_dataset.jsonl"       # copied onto the instance
output_dir: "output/train_lora"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  epochs: 2
  batch_size: 4
  grad_accum: 4
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  max_seq_len: 1536
  packing: true
  # Qwen3's chat template has no {% generation %} markers, so assistant-only
  # masking yields all-zero masks; use standard full-sequence SFT loss.
  assistant_only_loss: false
  attn_implementation: sdpa
