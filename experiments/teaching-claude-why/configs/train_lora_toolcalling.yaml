# ABOUTME: bf16 LoRA SFT config for Qwen3.6-27B on the 20% tool-calling / 80% TULU3 mixture.
# ABOUTME: Run on an 80GB GPU: python src/experiments/train_lora.py --config configs/train_lora_toolcalling.yaml

seed: 0
model: "Qwen/Qwen3.6-27B"

# Qwen3.6-27B ships as a vision-language checkpoint (Qwen3_5ForConditionalGeneration),
# so it must be loaded through the image-text-to-text auto class.
model_class: "image_text_to_text"

# Pre-rendered mixture from build_toolcalling_mixture.py: agentic tool-use docs keeping their
# reasoning where the source had it, TULU3 replay with no think block.
data_path: "data/mixture_toolcalling.jsonl"
output_dir: "output/train_lora_toolcalling"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  # Regex restricted to the language model so the vision tower's identically-named
  # projections are left untouched. Verified against real module paths in --smoke.
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  # 4096, not the sibling arms' 2048. These agentic conversations run 9-13 turns with a median
  # of 2,348 tokens; at 2048 the cap severs 11 of the corpus's 98 tool-call spans. At 4096 the
  # built mixture is truncated nowhere at all (verified: 0 rows over the cap).
  max_seq_len: 4096
  # TRL packs samples under sdpa with a cross-contamination warning, so packing stays off -
  # which also matches the three published sibling arms.
  packing: false
  # Qwen3's chat template has no {% generation %} markers, so assistant-only masking yields
  # all-zero masks; use standard full-sequence SFT loss.
  assistant_only_loss: false
  attn_implementation: sdpa
  # bitsandbytes 4-bit does not reliably cover this model's linear-attention/SSM layers;
  # 54GB of bf16 weights + LoRA + checkpointing fits an 80GB card.
  load_in_4bit: false
