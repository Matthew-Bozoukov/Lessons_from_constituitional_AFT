[project]
name = "teaching-claude-why-replication"
version = "0.1.0"
description = "Difficult-advice replication on Qwen3-32B: synthdoc data generation, SFT/DPO training, and misalignment/capability/vulnerability evals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- GPU serving/training stack, pinned (CLAUDE.md gotcha 1) ---
    # vLLM 0.8.5 hard-requires transformers==4.51.3, which caps huggingface-hub below
    # 1.0 and datasets below 4. These pins are load-bearing for serving; the analysis
    # stack is held at the compatible versions rather than split into its own env.
    "vllm==0.8.5",
    "transformers==4.51.3",
    "huggingface-hub<1.0",
    "datasets<4",
    "trl==0.19.1",
    "peft>=0.14.0",
    "bitsandbytes",
    "accelerate>=1.0.0",
    "wandb",
    # --- shared analysis/data stack ---
    "fire>=0.7.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "numpy",
    "omegaconf>=2.3.1",
    "openai>=1.60.0",
    "pandas",
    "plotly>=6.9.0",
    "pyarrow",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.31.0",
    "tenacity>=9.0.0",
    # Arena-Hard computes its style-control `token_len` feature with the gpt-4o encoder.
    # Style features must be counted the same way for every arm or the control regression
    # is comparing different units, so we match its convention rather than substituting
    # the Qwen tokenizer.
    "tiktoken>=0.8.0",
    "tqdm>=4.66.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[tool.uv]
# This project runs on Linux GPU pods only ("Where code runs" in CLAUDE.md); the lock
# does not resolve for macOS (vllm/bitsandbytes have no darwin wheels). If anyone ever
# insists on running locally, split the GPU serving stack and the analysis stack into
# conflicting dependency groups (uv supports mutually exclusive groups) instead of
# relaxing these pins — they are load-bearing for vLLM serving.
environments = ["sys_platform == 'linux'"]

[project.scripts]
synthdoc = "src.data.synthdoc.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Petri/Inspect audit tooling is NOT a dependency group here: inspect-ai pins
# click<8.2.2 while this project's huggingface-hub needs click>=8.4.2, so the
# audit runs in its own environment. Use the nested project's env for all
# petri tools:  uv run --project src/eval/vulnerabilities/petri/petri-subscription ...

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project installs editable via `uv sync`, so `import src.*` works from any
# cwd - including `uv run scripts/<step>.py`, where the script's own directory,
# not the repo root, is what lands on sys.path.
[tool.hatch.build.targets.wheel]
packages = ["src"]
# The nested petri-subscription workspace member ships as its own distribution.
exclude = ["src/eval/vulnerabilities/petri/petri-subscription"]

[tool.pytest.ini_options]
testpaths = ["tests"]
