[project]
name = "teaching-claude-why-replication"
version = "0.1.0"
description = "Difficult-advice replication on Qwen3-32B: synthdoc data generation, SFT/DPO training, and misalignment/capability/vulnerability evals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "fire>=0.7.1",
    "huggingface-hub>=1.25.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "openai>=2.48.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    # Arena-Hard computes its style-control `token_len` feature with the gpt-4o encoder.
    # Style features must be counted the same way for every arm or the control regression
    # is comparing different units, so we match its convention rather than substituting
    # the Qwen tokenizer.
    "tiktoken>=0.8.0",
    "tqdm>=4.69.1",
    "transformers>=5.14.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
]
# torch/trl/peft/bitsandbytes/vllm are intentionally absent: training runs on a
# rented GPU box with exact pip pins (see CLAUDE.md gotchas); vllm has no darwin
# wheels, so locking them here would break local `uv sync` without helping the box.

[project.scripts]
synthdoc = "src.data.synthdoc.cli:main"
specgen = "src.data.specgen.cli:main"

[project.optional-dependencies]
# Optional extras for internalization's in-process HuggingFace target provider (`provider: hf`).
# Not needed for the OpenRouter/vLLM paths or for any pre-existing pipeline in this repo.
hf = [
    "torch>=2.6.0",
    "accelerate>=1.0.0",
    "peft>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Petri/Inspect audit tooling is NOT a dependency group here: inspect-ai pins
# click<8.2.2 while this project's huggingface-hub needs click>=8.4.2, so the
# audit runs in its own environment. Use the nested project's env for all
# petri tools:  uv run --project src/eval/vulnerabilities/petri/petri-subscription ...

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project installs editable via `uv sync`, so `import src.*` works from any
# cwd - including `uv run scripts/<step>.py`, where the script's own directory,
# not the repo root, is what lands on sys.path.
[tool.hatch.build.targets.wheel]
packages = ["src"]
# The nested petri-subscription workspace member ships as its own distribution.
exclude = ["src/eval/vulnerabilities/petri/petri-subscription"]

[tool.pytest.ini_options]
testpaths = ["tests"]
