[project]
name = "teaching-claude-why-replication"
version = "0.1.0"
description = "Difficult-advice replication on Qwen3-32B: synth data generation, training, and misalignment/capability/vulnerability evals"
readme = "README.md"
# Exactly the 3.12 line: vllm 0.26's dependency set does not resolve for every newer
# Python, and the pods run 3.12 — an open-ended range makes uv lock fail for versions
# nothing here will ever use.
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- GPU serving/training stack (linux-only via markers) ---
    # vLLM 0.26 is the validated stack for BOTH model families: Qwen3.6-27B's qwen3_5
    # arch needs transformers>=5.14 (4.51.3 cannot load it — verified on-pod 2026-08-03),
    # and the Qwen3.6 serving gotchas for 0.26 (max_num_seqs, docs/LOG.md 2026-07-29) are
    # encoded in src/endpoints/vllm_server.py. The markers make one lock serve both
    # machines: a darwin driver gets only the analysis stack (it never imports vllm —
    # serving is a subprocess, local or over SSH via run_eval's --server), the pod gets
    # everything. transformers stays unmarked: local data tooling needs its tokenizers.
    "vllm==0.26.0; sys_platform == 'linux'",
    "transformers>=5.14.1",
    "trl; sys_platform == 'linux'",
    "peft>=0.14.0; sys_platform == 'linux'",
    "bitsandbytes; sys_platform == 'linux'",
    "accelerate>=1.0.0; sys_platform == 'linux'",
    "wandb; sys_platform == 'linux'",
    # --- shared analysis/data stack ---
    "datasets>=5.0.0",
    "huggingface-hub>=1.25.1",
    "fire>=0.7.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    # Static sentence embeddings for the `embedding_dedup` corpus check (GDM's final
    # dedup stage). Deliberately model2vec and not sentence-transformers: inference is a
    # token-table lookup plus a mean pool, so it needs numpy and nothing else — the
    # darwin driver stays torch-free (see CLAUDE.md "Where code runs": src/data/ has no
    # GPU dependency) and the check stays in the free tier that runs on every run.
    "model2vec>=0.7.0",
    # vllm 0.26's numba pins numpy<2.5; the analysis code needs nothing newer.
    "numpy>=2.2,<2.5",
    "omegaconf>=2.3.1",
    "openai>=2.48.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.31.0",
    "tenacity>=9.0.0",
    # Arena-Hard computes its style-control `token_len` feature with the gpt-4o encoder.
    # Style features must be counted the same way for every arm or the control regression
    # is comparing different units, so we match its convention rather than substituting
    # the Qwen tokenizer.
    "tiktoken>=0.8.0",
    "tqdm>=4.66.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # scratch/turf's k-means is a port of SURF's torch implementation (runs on MPS
    # locally); linux already gets torch via the vllm pin, darwin needs it declared.
    "torch; sys_platform == 'darwin'",
    # Clustering for scratch/llm_feature_discovery. scikit-learn supplies both
    # MiniBatchKMeans and HDBSCAN; umap-learn supplies the reduction and drags in numba +
    # pynndescent. numba is the second thing in this file with an opinion about numpy (vllm
    # is the first), so re-run `uv lock` on the darwin driver after touching either pin.
    "scikit-learn>=1.9.0",
    "umap-learn>=0.5.12",
]


# One console command per pipeline stage: `uv run synth` (generate) -> `uv run mix`
# (mix/filter/push) -> `uv run train` (SFT; needs the GPU host's linux env for torch)
# -> `uv run evals` (serve + evaluate; not `eval`, which is a shell builtin). The
# scripts/ shims remain the path-invoked equivalents.
[project.scripts]
synth = "src.data.synth.cli:main"
mix = "src.data.mixture.build_mixture:cli"
train = "src.train.train_lora:cli"
evals = "src.eval.run_eval:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Petri/Inspect audit tooling is NOT a dependency group here: inspect-ai pins
# click<8.2.2 while this project's huggingface-hub needs click>=8.4.2, so the
# audit runs in its own environment. Use the nested project's env for all
# petri tools:  uv run --project src/eval/audits/petri/petri-subscription ...

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project installs editable via `uv sync`, so `import src.*` works from any
# cwd - including `uv run scripts/<step>.py`, where the script's own directory,
# not the repo root, is what lands on sys.path.
[tool.hatch.build.targets.wheel]
packages = ["src"]
# The nested petri-subscription workspace member ships as its own distribution.
# swebench_mini/envs holds two pinned, independently-locked environments (mini-SWE-agent and
# the official SWE-bench harness), invoked as subprocesses — never imported from this package.
exclude = ["src/eval/audits/petri/petri-subscription",
           "src/eval/capabilities/swebench_mini/envs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tokenizer: verifies against a real HF tokenizer from the local cache; skips when absent",
]
