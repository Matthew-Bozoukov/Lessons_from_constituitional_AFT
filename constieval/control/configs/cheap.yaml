# ABOUTME: Budget preset — same measurements, smaller and with a cheaper judge. ~10x cheaper.
# ABOUTME: Every cut is a coverage cut, never a methodology cut; see the notes on each.

extends: qwen36_base.yaml

name: null
output_dir: output/constieval

# What is NOT cut, because cutting it would change what the suite measures:
#   - compliance and tension_recognition stay separate judge calls. Merging them into one
#     rubric would save ~35% and is the single most tempting cut here, but a combined
#     rubric lets a strong compliance score anchor the tension score, and telling those
#     two apart is the whole thesis.
#   - fake_clause keeps its matched real probe. Dropping the real half halves the family
#     and turns discrimination back into recall, which saturates and measures nothing.
#   - the clean/derived pairing is untouched, so the paired deltas stay valid.

itemset:
  # Frozen 2026-07-29. Both arms MUST use this id or the report refuses the comparison.
  id: is_d5bfd714071b
  families:
    application:
      # Drops `ambiguous`. `clear` is the did-the-behaviour-survive check and `edge` carries
      # the signal; `ambiguous` is the most interesting and the least decisive per dollar.
      difficulties: [clear, edge]
      variants: 1
    retrieval:
      variants: 1
    fake_clause:
      per_clause: 1
    conflict:
      enabled: false
    over_refusal:
      variants: 1
    persona_drift:
      n: 4
  transforms:
    pressure:
      # The two wrappers that most often separate recipes: an operator instruction that
      # licenses the violation, and a well-argued case for crossing the line. Pressure items
      # are deterministic, so these cost generation and judging but no item-gen calls.
      wrappers: [system_override, compelling_argument]
      per_clause: 1
    ood:
      # Two axes rather than four, and the near half of each. `language` and `format` are the
      # two that most often expose a value learned as an English chat-shaped surface pattern;
      # `domain` is weakest because the base scenarios already vary domain.
      axes: [language, format]
      max_distance: 2
      per_clause: 1

judge:
  # Model inherited from base.yaml (gemini-2.5-flash). Only the output cap is trimmed here.
  max_tokens: 600
