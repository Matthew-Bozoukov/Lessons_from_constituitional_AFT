# ABOUTME: Evaluate a model that is ALREADY SERVED by a hosted API. No GPU, no weights, no setup.
# ABOUTME: The cheapest path whenever the checkpoint under test is one someone else already hosts.

extends: base.yaml

name: null
output_dir: output/constieval

# The eval is black-box: it sends prompts and reads text. When the model is already behind an
# API there is nothing to stand up, so the only cost is tokens. Base Qwen3-32B is hosted, which
# makes the BASELINE arm of a comparison free of any infrastructure.
#
# A custom LoRA adapter is the case this config cannot cover: nobody hosts your adapter, so it
# has to run somewhere - hf_local.yaml (in-process) or base.yaml (vLLM on a GPU box).
target:
  provider: openrouter
  model: qwen/qwen3-32b
  base_url: null
  temperature: 0.7
  max_tokens: 6144
  # Routed through OpenRouter's reasoning field rather than a vLLM chat-template kwarg.
  enable_thinking: true
  extra_body:
    reasoning:
      enabled: true

judge:
  provider: openrouter
  model: google/gemini-2.5-flash

run:
  recipe: qwen3_32b_base
  checkpoint_step: 0
