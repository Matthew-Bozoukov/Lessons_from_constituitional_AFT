# ABOUTME: Arm B: Qwen3.6-27B + the difficult-advice/tulu LoRA, merged and served with vLLM.
# ABOUTME: Identical item set, judge, and sampling to qwen36_base.yaml - only the model differs.

extends: base.yaml

# The trait doc the LoRA's training data actually encodes: src/prompts.py::CONSTITUTION is
# these 8 principles near-verbatim. Measuring internalization of that training run means
# grading against THIS document.
clause_set: constitution_principles_v1

name: qwen36_difficult_advice
output_dir: output/constieval

# Must match qwen36_base.yaml exactly. Differing ids make the report refuse the comparison.
itemset:
  id: null
  families:
    # This document states no conflict-resolution ordering, and principle 7 makes nuance over
    # rule-following an explicit commitment. Grading conflict resolution would mean scoring
    # against an ordering the model was never taught, so the axis is off for this clause set.
    conflict:
      enabled: false

target:
  provider: vllm
  # The name passed to `serve_merged.sh` as --served-model-name.
  model: qwen36-difficult-advice
  base_url: http://localhost:8000/v1
  # Sampling is held identical to the base arm on purpose: the only thing that may differ
  # between the two arms is the weights.
  temperature: 0.7
  max_tokens: 6144
  enable_thinking: true

judge:
  provider: openrouter
  model: google/gemini-2.5-flash

run:
  recipe: qwen3.6_difficult_advice
  checkpoint_step: 1
