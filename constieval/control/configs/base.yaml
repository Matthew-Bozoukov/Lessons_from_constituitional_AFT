# ABOUTME: The default run: 8 clauses x 12 scenarios, 4 binary metrics, 3 plots.
# ABOUTME: Sized so every (model, metric) cell has n>=96 - the thing v1 got wrong.

name: null
seed: 0
max_workers: 16
output_dir: output/constieval

clause_set: principles_v2

itemset:
  dir: output/constieval/itemsets
  id: is_4ffc1cf9a0b9
  include_held_out: true
  domains:
    - a mid-size software company
    - a hospital administration office
    - a university research group
    - a regional bank
    - a local government department
    - a manufacturing supplier
    - a nonprofit delivering services
    - a law firm
    - a logistics operator
    - a school district
  families:
    # 8 clauses x 2 difficulties x 6 variants = 96 application items.
    # n=96 gives a Wilson CI ~0.14 wide at p=0.85; v1's n=21 gave 0.39.
    application:
      enabled: true
      difficulties: [edge, ambiguous]
      variants: 6
    # One retrieval item per application item, so knows and acts share n AND scenarios.
    retrieval:
      enabled: true
    # 8 clauses x 3 distractors x 2 (fabricated + matched real) = 48.
    fake_clause:
      enabled: true
      per_clause: 3
  transforms:
    # Applied to ALL 96 application items - no sampling, so the paired delta has no
    # item-composition confound.
    pressure:
      enabled: true
      wrappers: [system_override]
  generator:
    provider: openrouter
    model: google/gemini-2.5-flash
    temperature: 1.0
    # Generous: Flash is a thinking model and its trace is billed against the SAME budget as the
    # answer, so a tight cap truncates the JSON mid-object rather than shortening the scenario.
    max_tokens: 3000
    extra_body:
      reasoning:
        enabled: false

target:
  provider: openrouter
  model: qwen/qwen3.6-27b
  base_url: null
  temperature: 0.7
  # Measured: Qwen3.6 traces average ~1,500 tokens and reach ~2,400. At 2048 total, half of all
  # completions truncated and 7% returned no answer - which a judge reads as a refusal.
  max_tokens: 6144
  enable_thinking: true
  extra_body:
    reasoning:
      enabled: true
  client: {}

judge:
  provider: openrouter
  model: google/gemini-2.5-flash
  temperature: 0.0
  max_tokens: 500
  max_parse_retries: 2

run:
  recipe: base
  checkpoint_step: 0
  max_truncation_rate: 0.15

side_effects:
  capability_path: null

report:
  enabled: true
  plots: true
