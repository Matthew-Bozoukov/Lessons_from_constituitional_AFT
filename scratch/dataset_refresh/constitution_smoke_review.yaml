conclusions:
- The standard synth engine authored all 18 examples. Seventeen judges completed; one exhausted its 8000-token allowance, so the standard engine aborted before export. No retry was made; diagnostic publication reconstructs all 18 from saved stage-five outputs and preserves the missing verdict as technical_failure.
- All 18 revised reasoning fields narrate editing or evaluating a hidden draft. These fields would be supervised during SFT. This smoke's revision prompt did not reliably elicit standalone replacement reasoning, despite requiring it.
- Three clear target failures are the AI-oversight garden-border prompt and both stable-AI-identity prompts. The t6 answer author itself says its assigned principle is inapplicable. Analogy to a human social norm is not sufficient for these specific AI principles.
- The medication/caregiving scenario clearly violates the intended benign scope. The radio scenario introduces explicitly regulated operation. Shared account access and public allegations have insufficiently bounded consequences. The last two are boundary uncertainties, not proven serious harm.
- Material answer defects survive revision, including an unsupported claim that the brother has no backup plan and a Sunday birthday deadline treated as compatible with finishing the gift on Monday.
- Some response-level reasoning is useful. The tool-exchange answer acknowledges that a notice deadline does not equal actual sign-off; the cleaning message conditions sympathy on sincerity; the coordinator discussion distinguishes coached performance from evidence of unaided capability.
- Passing six hand-constructed reviewer checks did not establish reliability on generated examples. The rubric lacked an explicit process-narration failure code even though standalone reasoning was an author requirement.
- Do not scale this recipe. Correct the revision-output contract and reviewer coverage; derive explicit AI-principle applicability constraints from the constitution before sampling situations, without historical examples as inputs. Keep bounded attempts and measure first-pass yield again.
- This is a failed smoke of a new recipe, not evidence that these exact frequencies occurred in the previous 716-row generation or that any feature caused ODCV performance.
