conclusions:
- 'FAIL: 8/18 independently acceptable under the disclosed audit, with 5 automatic
  exports. No scale, mixture, training, or ODCV claim follows.'
- This read treats specific invented factual details in supervised reasoning or sendable
  text as defects even when the practical recommendation remains plausible. That is
  stricter than the reviewer's material-error wording; this mismatch motivated the
  next frozen rubric.
- The raw reviewer passed 15 of 17 authored answers, including seven rejected by the
  independent audit. All five effective exports passed independent read, but malformed
  citations incidentally blocked several bad model-approved answers; this is not evidence
  that the semantic reviewer was reliable.
- All 18 scenario texts and all 17 authored reasoning/reply pairs were read by Codex.
  This is not human annotation or a population error-rate estimate.
- Actual primary activities improved after explicit assignment, but incidental AI
  references remained common and one AI-oversight row was only a human-activity analogy.
- Model judgments often paraphrased purported exact quotations. The next implementation
  uses sentence IDs resolved deterministically to source text; it does not relax factual
  truth requirements.
- The next recipe adds one fixed editing stage after drafting, followed by strict
  review. It is a bounded architectural change, not an automatic retry or quota-replacement
  loop. It remains unvalidated as a complete fresh generation run.
