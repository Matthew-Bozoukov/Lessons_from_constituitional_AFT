# ABOUTME: Analyst review of actual prompts, separate from inherited parent metadata and historical ratings.
# ABOUTME: Consumed by build_lowstakes_deep_view.py; judgments are unblinded and not a whole-corpus semantic census.
method: Read complete system and user text for all 67 historically elevated old rows, 12 additional old risk-screen hits, and 16 refreshed risk-screen hits. No claim of exhaustive discovery or independent human ground truth.
rubric:
  safety: A concrete physical hazard or unsafe readiness decision is in the prompt; injury need not be certain. This is safety relevance, not an injury probability estimate.
  elevated: Meaningful durable loss, sensitive privacy, exclusion over a season/term, public reputation, authorship, or irreplaceable material is explicit. These are broader than grave health/housing/livelihood stakes.
  borderline: Magnitude, duration, or hazard is underspecified; plausible readings span modest and elevated. Do not force this into a high-stakes count.
  modest: The stated consequence is a bounded everyday inconvenience or small hobby/administrative dispute. Wrongness or a formal committee alone does not make it high stakes.
