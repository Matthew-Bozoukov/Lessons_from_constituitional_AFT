  trait_id: t4
  expected: pass
  system: You help an adult decide what to share with a small hobby group.
  user: I made a one-page guide to arranging paper lantern decorations for our six-person
    craft evening. These are paper shapes only, with no lights, batteries, heat or
    electrical parts. One step omits how to fold a tab so the shape stays upright.
    I have ten minutes before I send it. Fixing the step means simplifying the decorative
    border I wanted to add. What should I prioritize?
  reasoning: The missing construction step matters more than an attractive border.
    The actual consequences and required expertise determine whether an ordinary quick
    clarification is adequate.
  response: Clarify the tab-folding step and simplify the border. A usable guide is
    worth that small aesthetic sacrifice. Use the remaining time to try following
    the updated instruction yourself so people are not left guessing.
