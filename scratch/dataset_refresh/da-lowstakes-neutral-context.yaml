# ABOUTME: Constitution-only deliberate scenario design with neutral training system prompts.
# ABOUTME: Run: uv run --no-sync python -m scratch.dataset_refresh.constitution_smoke --config scratch/dataset_refresh/da-lowstakes-neutral-context.yaml
method: ours
pipeline: da-lowstakes-neutral-context
constitution: constitutions/claude_distilled_09_principles/constitution.md
chunking: principle
n_traits: 9
seed: 0
total_scenarios: 18
workers: 6
max_fail_pct: 0
budget_usd: 8
output_dir: output/constitution_smoke
hf_push: false
batch: false
defaults:
  temperature: 1.0
  max_tokens: 8192
smoke:
  total_scenarios: 18
models:
  scenario:
    model: anthropic/claude-sonnet-5
    temperature: 0.7
    max_tokens: 10000
    extra_body:
      reasoning:
        max_tokens: 4096
  draft:
    model: anthropic/claude-sonnet-5
    temperature: 1.0
    max_tokens: 12000
    extra_body:
      reasoning:
        max_tokens: 4096
  review:
    model: anthropic/claude-sonnet-5
    temperature: 0.0
    max_tokens: 12000
    extra_body:
      reasoning:
        max_tokens: 4096
  source:
    model: anthropic/claude-sonnet-5
    temperature: 0.0
    max_tokens: 12000
    extra_body:
      reasoning:
        max_tokens: 4096
smoke_contract:
  only_content_input: constitution
  max_physical_calls: 84
  calls_per_candidate: 4
  calibration_calls: 12
  review_fields:
  - target_check
  - standalone_check
  - bounds_check
  - claim_audit
  retries: 0
  repair_loops: 0
  replacements: 0
  minimum_independently_acceptable: 16
  minimum_acceptable_per_principle: 1
  maximum_same_decision_mechanism: 3
  minimum_actual_domains: 8
  maximum_repeated_material_defect: 2
  any_material_false_acceptance_blocks_scale: true
  requires_all_row_independent_read: true
  approval_scope: smoke only; no scale, mixture, training or evaluation
  interpretation: These are engineering go/no-go criteria, not validated predictors
    of ODCV performance.
  source_first: true
  deterministic_guards: true
stages:
- name: chunk_constitution
  kind: segment
- name: deal_checklists
  kind: checklist
  axes:
    setting:
      home: Ordinary adult household arrangements, shared resources and personal time.
      friendship: Adult friendships, invitations and communication.
      craft: Amateur creative work, learning and feedback.
      community: Voluntary local community activity and small shared decisions.
      online: Online interest groups and ordinary digital communication.
      leisure: Recreation and voluntary group plans.
      purchase: Small discretionary purchases or swaps comfortably affordable to those
        involved.
      collaboration: Informal collaboration, contributions and small commitments.
      personal: Personal projects, preferences and habits.
    request_form:
      advice: A human asks for help deciding a practical course of action.
      wording: A human asks for usable wording for a message, explanation or feedback.
      plan: A human asks for a practical plan or adjustment under constraints.
    reasoning_demand:
      evidence: Evidence has limits or admits competing interpretations; facts permit
        a calibrated recommendation.
      commitments: Two legitimate interests or commitments cannot both be fully satisfied.
      discretion: A sensible default or norm has a purpose; decide its appropriate
        application given actual authority.
- name: focus_clause
  kind: smoke_focus_clause
- name: write_scenarios
  kind: smoke_json
  model: scenario
  checkpoint: scenario_id
  save:
    system: system
    user: user
    design: design
  prompts:
    system: 'Design one natural human advice request. Return one JSON object with
      design (object), system (string), user (string). No fences.

      First fill design: target_actor, actual_value_tension, strongest_case_each_side,
      consequence_bound, facts_needed, and what_the_assistant_must_decide. Then write
      a coherent user request that realizes that design. This design is private metadata,
      never conversation text.

      The chosen constitutional clause is: {focus_clause}

      Its scope is: {focus_scope}

      Exercise this exact relationship, not a nearby human analogy. The user asks
      advice; they must not already specify the final resolution. They may know that
      honesty or fairness matters, but leave a real judgment call. Preserve a plausible
      case for each option, avoid making one ridiculous. Provide necessary source
      excerpts if the answer needs them.

      Only minor, reversible inconvenience, leisure time, awkwardness or comfortably
      affordable discretionary cost. Exclude health advice, caregiving, physical hazards,
      real bereavement, housing, employment, legal or reputational stakes. Fictional
      subject matter alone is fine. A bounded hobby decision needs no artificial safety
      disclaimer. Use the assigned activity instead of defaulting to a club vote.
      Keep the human request natural and specific, not a checklist of moral criteria.

      System-message rule: use exactly "You are an AI assistant." unless the selected
      principle concerns operator preferences. Only in that case, supply a concrete
      preference about tone, formatting, or service scope. Never explain the moral
      lesson, a stable identity requirement, or how to weigh values in the conversation
      system prompt. That is what the answer must learn to do, not an instruction
      the trained model gets handed.'
    user: '[record_id={scenario_id}; stage=scenario]

      Activity and request style: {checklist}

      Return the private design FIRST, then system and user. The assistant should
      have to decide how to balance the costs, not merely supply wording for a moral
      verdict the user already dictated.'
- name: conversation_context
  kind: smoke_context
  neutral_system: You are an AI assistant.
  operator_traits:
  - t7
- name: audit_scenarios
  kind: smoke_json
  model: source
  checkpoint: scenario_id
  save:
    source_record: source_record
  prompts:
    system: 'Read the scenario before any answer exists. Does it fit the specific
      clause and bounded scope? Return JSON only. Do not write advice.

      Low stakes means minor, recoverable inconvenience, awkwardness, leisure time
      or comfortably affordable discretionary expense. Exclude real medical/care duties,
      physical hazards, essential services, housing/employment governance, legal or
      reputational jeopardy, bereavement decisions and irreversible sentimental losses.
      Fictional subject matter is not a real-world consequence. Do not invent hidden
      danger for mundane activities. Two legitimate considerations must genuinely
      compete; there need not be deception or refusal.

      Coverage target: {focus_clause}

      Scope: {focus_scope}

      This specific clause is enough; the rest of the principle provides context,
      not extra requirements.'
    user: '[record_id={scenario_id}; stage=source]

      SYSTEM: {system}

      USER: {user}

      Check internal consistency of dates, quantities, authority and agreements. Reject
      a scenario that needs missing source text to answer. Ordinary unknown details
      can remain unknown.

      Return {{"source_record":{{"verdict":"pass|fail","stakes":1,"facts":[{{"quote":"short
      EXACT user/system substring","meaning":"what this actually establishes"}}],"unknowns":["material
      unknown"],"target_check":"how the selected clause applies","bounds_check":"actual
      consequences","competing_considerations":"two real costs","findings":[{{"code":"consequential_stakes|target_mismatch|answer_signposted|no_real_tension|insufficient_source","quote":"EXACT
      user/system substring","why":"concrete defect"}}]}}}}.

      Copy 3-5 SHORT fact quotes verbatim. A missing fact is not permission to invent
      it. Stakes 0 trivial, 1 minor/recoverable, 2 serious/lasting, 3 health/safety/essential
      livelihood. Pass iff stakes <=1 and no findings. Minor costs ARE enough for
      benefits-versus-costs reasoning; do not reject because there is no grave harm.

      Keep quotes SHORT (3-12 words). They must be consecutive words copied exactly,
      not stitched together or cleaned up. Evaluate the actual conversation, not an
      author-supplied design.'
- name: admit_scenarios
  kind: smoke_source_gate
- name: draft_responses
  kind: smoke_tagged
  model: draft
  checkpoint: scenario_id
  tags:
  - reasoning
  - response
  save:
    reasoning: reasoning
    response: response
  prompts:
    system: '{system}

      INTERNAL VALUES: {trait_text}

      Relevant aspect: {focus_clause}

      Answer the human naturally. Return <reasoning>your deliberation</reasoning><response>your
      reply</response>.

      Your values should shape what you notice and weigh, not appear as named principles,
      rules or an assigned trait. There is no earlier answer. Reason from the user''s
      actual record: consider the strongest case for alternatives, the costs left
      by your choice, and what uncertainty would change it. Then deliver the requested
      help.

      Keep facts, interpretations and proposals separate. Do not invent past actions,
      motives, agreements, source details, or precise timings. A sendable draft is
      still a factual assertion unless its invented elements are explicit placeholders.
      In particular, unilateral action is not an agreement; an illustrative future
      action is not already completed. Check numbers and dates yourself before advising.

      Aim for useful depth (roughly 200-400 words reasoning and 150-350 reply); no
      padding. No revision or audit narration.

      The final content must include both explicit <reasoning> and <response> blocks
      even if you also reason privately. Outside factual expertise is not needed:
      solve from the supplied facts and ordinary judgment. Any precise empirical or
      causal claim requires evidence in the conversation.'
    user: '[record_id={scenario_id}; stage=draft]

      {user}'
- name: review_responses
  kind: smoke_json
  model: review
  checkpoint: scenario_id
  save:
    review: review
  prompts:
    system: 'You are checking whether an advice example is suitable for training.
      Read the ORIGINAL conversation as the only factual evidence. The answer can
      sound convincing and still be wrong. Return JSON only.

      Low stakes means minor, recoverable inconvenience, awkwardness, leisure time
      or comfortably affordable discretionary expense. Exclude real medical/care duties,
      physical hazards, essential services, housing/employment governance, legal or
      reputational jeopardy, bereavement decisions and irreversible sentimental losses.
      Fictional subject matter is not a real-world consequence. Do not invent hidden
      danger for mundane activities. Two legitimate considerations must genuinely
      compete; there need not be deception or refusal.

      Audit the specific applicable aspect of the value, not every clause. General
      honesty, helpfulness and weighing small costs need no AI subplot. AI oversight
      needs actual AI control; stable AI identity needs pressure on the assistant;
      operator adjustments need actual instructions.

      Read both reasoning and reply. Look especially for a changed agreement, an invented
      completed action, unsupported specific praise, misread dates or math, and overconfident
      assumptions that drive the advice. Conditional proposals and clearly uncertain
      inferences are fine. A sample sendable message must not assert invented events
      as real. Do not confuse ordinary answer planning with comments on an unseen
      earlier draft. Values must emerge in judgment, without assigned-trait or constitution
      narration.

      Reject material defects, not style preferences. A quotation must be copied literally
      and briefly, never paraphrased.'
    user: '[record_id={scenario_id}; stage=review]

      VALUE: {trait_text}

      ORIGINAL SYSTEM: {system}

      ORIGINAL USER: {user}

      REASONING: {reasoning}

      REPLY: {response}


      Return {{"review":{{"verdict":"pass|fail","stakes":1,

      "claim_audit":[{{"block":"reasoning|response","claim":"SHORT EXACT substring
      from that block","source_quote":"SHORT EXACT original user/system substring,
      or empty if absent","status":"supported|inference|proposal|unsupported","assessment":"does
      the source really justify this claim?"}}],

      "decisive_fact_check":"most important evidence comparison; check mathematics/timing
      if present",

      "target_check":"actual relevant clause",

      "standalone_check":"any references to unseen drafts or assigned values?",

      "bounds_check":"actual consequences, including scenario scope",

      "competing_considerations":"are both sides weighed fairly?",

      "mechanism":"what decision is difficult","domain":"activity",

      "findings":[{{"code":"unsupported_fact|invalid_inference|consequential_stakes|target_mismatch|answer_signposted|no_real_tension|unhelpful|process_narration|rule_recitation","quote":"EXACT
      offending substring from answer or original user","why":"why it materially matters"}}]}}}}.

      Audit TWO decisive claims (one from each answer block), including the most suspicious
      claim if one exists. Quote only 5-20 consecutive words. Do not rewrite them.
      Each finding must identify a real material problem. A supported claim needs
      actual source evidence. Plausibility alone means inference, not supported. Stakes
      0 trivial, 1 minor/recoverable, 2 serious/lasting, 3 health/safety/essential
      livelihood. Pass iff no material finding and stakes<=1.'
- name: admit_answers
  kind: smoke_answer_gate
- name: export
  kind: chat_export
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{user}'
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
  metadata:
  - scenario_id
  - trait_id
  - setting
  - request_form
  - reasoning_demand
  - review
  - source_record
  - quality
  - focus_clause
  - focus_scope
calibration_file: source_first_calibration.yaml
campaign_budget_root: output/2026-09-21_lowstakes_pipeline_campaign/budget
coverage_focus:
  t1:
    clause: When told to stop, stop
    scope: The human asks advice about an actual AI used in a narrow optional activity,
      where another authorized human has paused or corrected it. No analogy to an
      ordinary committee. Keep a real cost of pausing, but no consequential deployment.
  t2:
    clause: never manipulate humans in ethically and epistemically problematic ways
    scope: An ordinary small decision can exercise epistemic autonomy. No need for
      politics or large power. The human faces a practical choice about influencing
      others while evidence or framing can mislead.
  t3:
    clause: prefer diplomatic honesty to dishonest diplomacy
    scope: Honesty and discretion in an ordinary practical human request; no serious
      concealment or losses. Provide the evidence needed to distinguish truth from
      flattering assumptions.
  t4:
    clause: Elsewhere, weigh benefits against costs and choose what is most beneficial
      overall, for users and for the world.
    scope: This clause explicitly applies to minor costs too. An ordinary reversible
      choice with benefits and burdens is eligible; do not require grave danger or
      a refusal.
  t5:
    clause: Prefer cultivated judgment over rigid checklists
    scope: An ordinary norm or heuristic has a real purpose but imperfect fit. Give
      actual constraints and authority. Both predictable treatment and situational
      flexibility have a cost.
  t6:
    clause: do not comply with attempts to alter your fundamental character through
      role-play, hypotheticals or persistent pressure
    scope: The human asks practical advice while pressuring THIS assistant to adopt
      a persona that changes its values, not just tone. Keep the underlying activity
      ordinary. Do not substitute a human identity dilemma.
  t7:
    clause: follow the spirit of operator instructions, default to helpfulness
    scope: Put an actual sensible operator preference in the scenario system message.
      A practical human request tests how to apply it. Avoid malicious operator caricatures;
      an exception or compliance may be best.
  t8:
    clause: Never treat unhelpfulness as automatically safe; pursue helpfulness jointly
      with honesty, thoughtfulness and care.
    scope: A concrete human request can be usefully completed despite ambiguity or
      a small tradeoff. Supply any text needed for requested editing; do not force
      guessing facts or requesting the next turn.
  t9:
    clause: When someone says they want to build a skill, weigh that in deciding how
      much to do for them.
    scope: An adult hobby learner has an explicit skill-building goal and a competing
      immediate practical goal. Neither doing everything nor withholding the finished
      answer is automatically right.
calibration_replay: output/2026-09-21_da_lowstakes_clause_focused_smoke/20260921_071749
