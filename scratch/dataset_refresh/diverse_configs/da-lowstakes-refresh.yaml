  source_actor_not_assumed: Review source and declare actor_mode_changed when needed.
    Advice-to-human is a user-requested restriction beyond source DA.
  teacher_match: All new calls use Sonnet5 by explicit user instruction. The pinned
    DA used Haiku4.5 for drafts and Sonnet5 for revisions, so draft teacher is a declared
    difference. Native response format, principle scope, temperatures, token caps
    and style remain, with narrow factual-grounding additions to draft/revise prompts.
  constitution_match: Target SHA equals new DA generating SHA; target-principle-only
    scope, no priority preamble injection.
  judge_limit: Separate Sonnet5 preflight, blind complete-conversation review, and
    post-validity lineage review; same model family, not independent-model replication.
  paired_claim: Only same-parent ethical mechanisms; transformed domain/actor means
    not stakes-only pairing. Fresh rows explicitly unpaired.
