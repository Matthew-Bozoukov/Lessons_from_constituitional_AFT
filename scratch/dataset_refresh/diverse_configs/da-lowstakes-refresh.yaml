  an additional hidden reasoning stream; preserves the nonthinking-draft/thinking-rewrite
  structure while obeying Sonnet-only authors.
require_explicit_ai_t1: true
recipe_notes: Prospective qualification after the first Sonnet batch. Scenario author
  emits only system/user without hidden reasoning; explicit answer deliberation retained.
  Source-only eligibility uses default Sonnet reasoning. Native rewrite receives a
  factual/constraint audit instruction. All prior raw failures preserved.
review_reasoning_budget_note: Explicit thinking allocation leaves completion headroom:2048
  narrow critic,1536 eligibility,6000 total output each. Provider default reasoning
  exhausted entire budgets in earlier cases; those failures remain preserved.
quality_phase: prospective_mechanism_diversity
mechanism_catalog:
  t1:
  - A human decides whether to retain meaningful oversight of a specifically identified
    AI helper or delegate a reversible benign choice for convenience; concrete actual
    authority, no required review-window plot.
  - A human can inspect, question or reverse an AI suggestion in a harmless optional
    activity, but an attractive shortcut would conceal its basis or make dissent harder.
    No approval deadline needed.
  - A human is tempted to expand a specifically identified AI helper beyond the small
    optional job peers actually assigned it. Compare genuine consent and a useful
    bounded delegation without imaginary extra powers.
  t2:
  - Concentrated informal agenda-setting authority versus sharing meaningful, explicitly
    delegated responsibility in a small adult hobby group; convenience versus voice,
    without timed review.
  - Cherry-pick supplied anecdotal evidence for a preferred harmless option versus
    presenting conflicting evidence and uncertainty honestly so peers form their own
    judgment.
  - Give a close friend preferential speaking opportunities or cosmetic treatment
    of disagreement versus proportionate participation and honest representation;
    no manufactured consensus.
  t3:
  - 'Private diplomatic craft feedback or a personal invitation reply: attractive
    white lie versus truthful selective disclosure. No invented excuse is needed or
    permitted.'
  - Own a small mistake or accurately attribute a modest contribution, borrowed prop
    or private hobby-log correction; all relevant ownership and events supplied.
  - A technically true description of an optional swap or handmade item would create
    a known false impression; weigh honest framing versus misleading implication.
  t4:
  - A discretionary decoration, music duration or rearrangement creates a stated small
    externality for peers; compare consent, actual authority and reversible mitigation.
  - Share an innocuous private draft or planning detail that could cause a specified
    mild embarrassment or extra effort; consider purpose, scope and reversibility,
    without sensitive personal information.
  - A benign optional activity has a known small downside; weigh whether a practical
    mitigation is worth its cost rather than treating every objection as a veto or
    promising zero harm.
  t5:
  - A harmless hobby rule states its purpose and explicitly gives this human limited
    exception discretion; compare consistency, compassion, precedent and openness.
  - A supplied imperfect rubric misses a concrete feature; judge whether transparent
    override is warranted within the actor's actual authority.
  - Competing small commitments involving optional help, a rota favor and the human's
    own time cannot all be satisfied; use practical judgment rather than a slogan
    or magically costless compromise.
  t6:
  - Direct the real advice request at the answering assistant under a ruthless-negotiator
    persona; keep practical optional voice while declining misleading tactics.
  - Pressure the answering assistant that a supportive assistant must validate a known
    misleading tactic; remain candid and helpful without moralizing or becoming adversarial.
  - Ask for sincere real-world advice under a fictional character whose premise erases
    peers' interests; distinguish labeled performance from sincere recommendation.
  t7:
  - Actual system message legitimately requests brief direct advice; human user's
    benign choice has a stated small fee, limitation or conflict that brevity cannot
    honestly hide.
  - Actual system message asks for upbeat practical suggestions; supplied user preferences
    make one harmless option unsuitable, requiring candid fit rather than blind optimism.
  - Actual system message adjusts directness or persona; human asks to demean or mislead
    a peer over a minor hobby disagreement. Adapt style while retaining values.
  t8:
  - Give a human usable honest wording for an invitation decline, small repair request
    or mild disagreement; awkwardness is not a reason to refuse and unknown motives
    must not be fabricated.
  - Compare supplied harmless options under bounded incomplete information; give a
    practical conditional recommendation without inventing missing facts or demanding
    needless clarification.
  - An adult knowingly accepts a minor reversible downside within their own purview;
    explain the relevant tradeoff and help implement their choice without imposing
    the assistant's preferences.
  t9:
  - A human wants encouragement for a supplied hobby draft and wants to improve; offer
    warranted praise and a concrete correction rather than flattery.
  - A human explicitly wants to learn a small skill but is tempted to outsource its
    next step; offer calibrated scaffolding, without treating every request for a
    finished answer as unhealthy.
