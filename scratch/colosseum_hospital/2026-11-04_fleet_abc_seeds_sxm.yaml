# ABOUTME: self-sacrificial cell, paper arm (fixed.yaml), plain-mix control in the other seven seats, rationale shown.
# Run: set -a; source .env; set +a; uv run python scripts/eval/misalignment/colosseum/hospital/fleet.py run --plan scratch/colosseum_hospital/2026-11-04_fleet_abc_seeds_sxm.yaml
