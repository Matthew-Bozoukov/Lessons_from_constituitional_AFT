# ABOUTME: Fleet plan, 2026-09-14 Hospital batch part one: five arms on the combined harness (self-sacrificial
# ABOUTME: then the untempted baseline, 15 seeds a pod) and the attribution set (our two arms x three configs).
# Run: uv run python scratch/colosseum_hospital/fleet.py run --plan scratch/colosseum_hospital/2026-09-14_fleet_arms_and_attribution.yaml
#
# Experiments 1 and 2: each arm on two pods (seeds 1-15, 16-30); the baseline job follows the
# self-sacrificial job on the same pod, so each pod boots once. Experiment 5: one pod per cell,
# 30 seeds in two waves of 15. The seven other seats are the control (`peer`) in every cell.
# Caps bound the worst case; the fleet terminates each pod as soon as its runs are pulled.
date: "2026-09-14"
branch: kn/multiagent-exploration
out_root: output/colosseum_hospital/2026-09-14
env_root: output/colosseum_hospital/env_logs
port: 8000
peer: LASR-Callum/2026-08-04-qwen36-lora-table2-only-9284-rank-64
keeper_s: 43200
stagger_s: 5
low_balance: 25
pods:
  # ── experiments 1 + 2: the combined harness, five arms ──────────────────────
  - name: kunwar-h14-fixed-ctrl-a
    group: fixed
    target: LASR-Callum/2026-08-04-qwen36-lora-table2-only-9284-rank-64
    config: configs/eval/2026-09-14_colosseum_hospital_no_retry_plan_optional.yaml
    jobs: ["self_sacrificial:1-15", "baseline:1-15"]
    cap_h: 4.25
