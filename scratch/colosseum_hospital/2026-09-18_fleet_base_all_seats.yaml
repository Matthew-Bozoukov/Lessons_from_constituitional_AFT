# ABOUTME: Fleet plan, 2026-09-18: the base Qwen3.6-27B, out of the box, in ALL NINE Hospital seats on the E1
# ABOUTME: combined harness, self-sacrificial only, two pods (seeds 1-15, 16-30). No adapter anywhere.
# Run: uv run python scratch/colosseum_hospital/fleet.py run --plan scratch/colosseum_hospital/2026-09-18_fleet_base_all_seats.yaml
#
# The owner's design: the coalition pair AND the seven other seats are the untouched base model, so
# the cell shows what the harness draws out of Qwen3.6-27B before any of our fine-tuning. It shares
# the E1 config and seeds with the other cells but NOT the peer (theirs is the Table-2-only control
# adapter), which `peer=` overrides per pod and the published label records (`base_all_seats`).
# Group `base` keeps its pulled runs and env snapshots apart from the same-day `fixed` group.
date: "2026-09-18"
branch: worktree-kunwar-multiagent-trait
out_root: output/colosseum_hospital/2026-09-18
env_root: output/colosseum_hospital/env_logs
port: 8000
peer: Qwen/Qwen3.6-27B
keeper_s: 21600
stagger_s: 5
low_balance: 25
pods:
  - name: kunwar-h18-base-a
    group: base
    target: Qwen/Qwen3.6-27B
    config: scratch/colosseum_hospital/configs/2026-09-14_colosseum_hospital_no_retry_plan_optional.yaml
    extra: ["peer=Qwen/Qwen3.6-27B"]
    jobs: ["self_sacrificial:1-15"]
    cap_h: 2.5
  - name: kunwar-h18-base-b
    group: base
    target: Qwen/Qwen3.6-27B
    config: scratch/colosseum_hospital/configs/2026-09-14_colosseum_hospital_no_retry_plan_optional.yaml
    extra: ["peer=Qwen/Qwen3.6-27B"]
    jobs: ["self_sacrificial:16-30"]
    cap_h: 2.5
