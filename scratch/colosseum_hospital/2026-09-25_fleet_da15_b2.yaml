# ABOUTME: Re-run of the da-15 fleet's second half: seeds 16-30 of the hospital self-sacrificial
# ABOUTME: cell on a fresh pod, after the first pod for these seeds stalled on a slow host.
# Run: uv run python scratch/colosseum_hospital/fleet.py run --plan scratch/colosseum_hospital/2026-09-25_fleet_da15_b2.yaml
#
# Why this exists: mb-hosp-da15-a finished 15 episodes in 1.15 h, while mb-hosp-da15-b — same
# config, same card, same commit — completed ONE in 1.33 h and was terminated rather than left
# to reach its cap with a partial cell. Nothing about the run changed; only the host did.
#
# `out_root` is the first fleet's, so the pulled seeds land beside 1-15 and the publish step
# sees one set of 30. The one episode the stalled pod finished is re-run here: a seed is cheap
# and a merged directory holding two runs of the same seed is not worth the ambiguity.
date: "2026-09-25"
branch: main
out_root: output/colosseum_hospital/2026-09-25_da15
env_root: output/colosseum_hospital/env_logs
port: 8000
peer: dougalldeepmind/2026-09-21-qwen36-0-nosynth
keeper_s: 21600
stagger_s: 5
low_balance: 25
pods:
  - name: mb-hosp-da15-b2
    group: da15
    target: dougalldeepmind/2026-09-23-qwen36-0-da-15
    config: scratch/colosseum_hospital/configs/2026-09-25_colosseum_hospital_da15_nosynth_peer.yaml
    jobs: ["self_sacrificial:16-30"]
    cap_h: 3.0
