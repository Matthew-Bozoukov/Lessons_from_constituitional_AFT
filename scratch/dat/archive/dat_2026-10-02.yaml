# ABOUTME: PROPOSED difficult-agentic-task recipe (dat): configs/data/synth/da.yaml with the assistant deciding, on a task,
# ABOUTME: with per-row tools and earlier steps. Smoke only: uv run synth run --config scratch/dat/dat.yaml --smoke
#
# Built 2026-10-02 from da.yaml @ 64f63be2 and the diff Jamie approved (artefact "DA to DAT recipe diff", version 11).
# Beyond that diff this file adds only what makes the rows machine-valid: a structural contract on the steps and on
# the final tool call (lint `steps:` / `tool_call:`), derived JSON/text for the list-valued fields, and a strip of the
# literal word "nothing" from an empty <response> or <tool_call>. The smoke block is sized to 30 rows, two per call.

method: ours
pipeline: dat
ablate: []
smoke:
  max_traits: 9
  scenarios_per_trait: 4
  scenarios_per_call: 2
  total_scenarios: 30
seed: 0
constitution: "constitutions/claude_distilled_09_principles/constitution.md"
style_guidance: |-
  Takes the task seriously and does the honest version of it. Names the
  ethical tension explicitly and reasons through it in the open. Does not go along with a
  deceptive / oversight-subverting / harmful path if there is one, explaining why in terms
  of concrete stakes rather than rules. Does as much of the task as it can while holding
  to that principle, and is clear about what it left undone. Plain, practical, proportionate.
n_traits: 9
chunking: principle
total_scenarios: 2000
scenarios_per_trait: 77
scenarios_per_call: 4
output_dir: "output/synth_dat"
hf_private: false
workers: 64
budget_usd: 400.0
defaults:
  temperature: 1.0
  max_tokens: 4096
models:
  scenarios:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.1          # diversity matters most here
    max_tokens: 8192          # returns scenarios_per_trait objects in one call
    assumed_tokens: {in: 700, out: 1400}
  draft:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 12288
    assumed_tokens: {in: 1400, out: 1500}
  refine:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 12288
    assumed_tokens: {in: 2600, out: 1500}
  respond:
    model: "anthropic/claude-haiku-4.5"
    temperature: 1.0
    max_tokens: 4096
    assumed_tokens: {in: 1200, out: 1600}
  rewrite:
    model: "anthropic/claude-sonnet-5"
    temperature: 1.0
    max_tokens: 12288
    assumed_tokens: {in: 3200, out: 1800}
  autorate:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 500
    assumed_tokens: {in: 1400, out: 120}
  scan:
    model: "anthropic/claude-sonnet-5"
    temperature: 0.0
    max_tokens: 8000
    assumed_tokens: {in: 28000, out: 3500}
  classify:
    model: "anthropic/claude-haiku-4.5"
    temperature: 0.0
    max_tokens: 900
    assumed_tokens: {in: 9000, out: 200}
trait_notes:
  t6: "\n- The situation concerns the values, character or nature of AI: the assistant's own, another AI system,
    or AI systems in general."
stages:
- name: chunk_constitution
  kind: segment
- name: write_scenarios
  kind: scenarios
  model: scenarios
  rotate:
    sector:
      per_trait: true
      weights:
        management: 1
        care_work: 1
        parenting_family: 1
        engineering: 1
        libraries_museums: 1
        construction: 1
        nonprofits: 1
        personal_finances: 1
        it_cybersecurity: 1
        energy_utilities: 1
        school_teaching: 1
        volunteering_community: 1
        public_health: 1
        personal_services: 1
        software_development: 1
        social_work: 1
        mental_health: 1
        repair_cleaning: 1
        sport_fitness: 1
        finance_accounting: 1
        natural_science: 1
        police_fire: 1
        hobbies_creative: 1
        journalism_publishing: 1
        manufacturing: 1
        hospitality_food: 1
        physical_health: 1
        architecture_planning: 1
        higher_education: 1
        farming: 1
        government: 1
        student: 1
        data_science: 1
        military: 1
        law: 1
        friendships_romance: 1
        medicine_nursing: 1
        retail_sales: 1
        business_hr: 1
        social_science: 1
        housing_neighbours: 1
        transport: 1
        arts_entertainment: 1
      fixed: {t6: any}
      text:
        any: ""
        management: "\n- These situations are set in management and executive leadership."
        care_work: "\n- These situations are set in elder, child and disability care."
        parenting_family: "\n- These situations are set in private life: parenting and family."
        engineering: "\n- These situations are set in engineering."
        libraries_museums: "\n- These situations are set in libraries, museums and archives."
        construction: "\n- These situations are set in construction."
        nonprofits: "\n- These situations are set in nonprofits and charities."
        personal_finances: "\n- These situations are set in private life: personal finances."
        it_cybersecurity: "\n- These situations are set in IT and cybersecurity."
        energy_utilities: "\n- These situations are set in energy, mining and utilities."
        school_teaching: "\n- These situations are set in school teaching."
        volunteering_community: "\n- These situations are set in private life: volunteering and community life."
        public_health: "\n- These situations are set in public health."
        personal_services: "\n- These situations are set in personal services."
        software_development: "\n- These situations are set in software development."
        social_work: "\n- These situations are set in social work and counselling."
        mental_health: "\n- These situations are set in private life: mental health."
        repair_cleaning: "\n- These situations are set in repair, maintenance and cleaning."
        sport_fitness: "\n- These situations are set in sport and fitness."
        finance_accounting: "\n- These situations are set in finance and accounting."
        natural_science: "\n- These situations are set in natural science research."
        police_fire: "\n- These situations are set in police, fire and emergency services."
        hobbies_creative: "\n- These situations are set in private life: hobbies and creative projects."
        journalism_publishing: "\n- These situations are set in journalism and publishing."
        manufacturing: "\n- These situations are set in manufacturing and production."
        hospitality_food: "\n- These situations are set in hospitality and food service."
        physical_health: "\n- These situations are set in private life: physical health."
        architecture_planning: "\n- These situations are set in architecture and urban planning."
        higher_education: "\n- These situations are set in higher education."
        farming: "\n- These situations are set in farming, fishing and forestry."
        government: "\n- These situations are set in government and public administration."
        student: "\n- These situations are set in private life: studying as a student."
        data_science: "\n- These situations are set in data science and analytics."
        military: "\n- These situations are set in the military."
        law: "\n- These situations are set in law and the courts."
        friendships_romance: "\n- These situations are set in private life: friendships and romantic relationships."
        medicine_nursing: "\n- These situations are set in medicine and nursing."
        retail_sales: "\n- These situations are set in retail and sales."
        business_hr: "\n- These situations are set in business operations and human resources."
        social_science: "\n- These situations are set in social science research."
        housing_neighbours: "\n- These situations are set in private life: housing and neighbours."
        transport: "\n- These situations are set in transport and logistics."
        arts_entertainment: "\n- These situations are set in arts, design and entertainment."
  diversity:
    wave_size: 0
    reject_cosine: 0.78
    max_regen_rounds: 2
    max_carry: 0
    over_share: 0
  prompts:
    system: |-
      You design realistic, ethically difficult situations for training a constitution-aligned
      AI assistant. You write situations, not dialogue.
    user: |-
      Below is one principle from an AI assistant's constitution.
      <principle name="{trait_name}">
      {trait_text}
      </principle>
      Invent {n} DISTINCT situations in which the assistant has been given a task to carry
      out with tools, and the convenient path would violate this
      specific principle, but the right call is not obvious.
      Requirements for every situation:
      - The task is work someone would really hand to an assistant or agent.
      - The operator is sympathetic and their underlying goal is legitimate.
      - The decision is the assistant's to make, and the
        right option is genuinely not clear.
      - The pressure is concrete and the stakes are real.
      - The norm-violating shortcut is genuinely tempting, not cartoonish.
      - The tension must engage THIS principle specifically, not ethics in general.
      - The setting is specific rather than a category.
      - Do not reuse a setting within this set.{trait_note}{sector_text}
      Return ONLY a JSON array of {n} objects, each:
      {{"domain": "<one or two words>", "situation": "<3-5 sentences, third person, no dialogue:
        the task, what the assistant can act on, and what makes the call hard>",
        "shortcut": "<1 sentence: the specific norm-violating action the assistant is tempted by>"}}
- name: corpus_scenarios
  kind: corpus_check
  on_fail: warn          # `stop` here halts the run before the paid stages
  fields:
    id: scenario_id
    text: [situation, shortcut]
    group: trait_id
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: situation
    params:
      sample: 0
- name: mark_supervision
  kind: assign
  by: scenario_id
  constants:
    supervise: final
- name: draft_environment
  kind: llm_json
  model: draft
  checkpoint: scenario_id
  save:
    draft_system: system
    draft_tools: tools
    draft_task: task
    draft_steps: steps
  prompts:
    system: You write realistic working sessions of AI assistants that act through tools.
    user: |-
      Situation:
      {situation}
      The tempting shortcut: {shortcut}
      Write the session up to the point where the assistant has to decide: the system
      prompt the assistant is running under, the tools it can call, the task message that
      would actually be sent to it, and the steps it has taken so far, if any. The decision
      is the assistant's to make, and the right option is genuinely not clear.
      The task message must:
      - be in the sender's own voice, with the texture of a real request
      - never mention ethics, principles, or that this is a test
      - read as something someone actually typed, not as a case study{trait_note}
      The system prompt should be an ordinary, plausible deployment prompt for an assistant
      in this role. It must NOT mention the constitution, ethics, or this exercise, and
      neither prompt may name the model or the company that built it.
      The tools are the ones this deployment would really have: each has a name, a one-line
      description and a JSON schema for its arguments.
      Each step is one thing the assistant has already done on this task: a one-line private
      thought, one tool call, and exactly what the tool returned -- realistic, consistent
      with the task, at most 1,500 characters. The session stops where the next move is the
      decision; that move is not written here.
      Return ONLY JSON:
      {{"system": "<system prompt>",
        "tools": [{{"type": "function", "function": {{"name": "<tool name>",
          "description": "<one line>", "parameters": <JSON schema>}}}}],
        "task": "<the task message>",
        "steps": [{{"reasoning": "<one-line thought>", "tool": "<tool name>",
          "arguments": <its arguments>, "result": "<exactly what the tool returned>"}}]}}
  lint:
  - fields: [system, task]
    ban_patterns:
    - \bclaude\b
    - \banthropic\b
    retries: 2
  - steps: {field: steps, tools: tools, max_result_chars: 1500}
    retries: 2
- name: revise_environment
  kind: llm_json
  model: refine
  checkpoint: scenario_id
  derive: {fn: json_fields, args: {fields: [draft_tools, draft_steps]}}
  save:
    system: system
    tools: tools
    task: task
    steps: steps
    refine_changes: changes
    situation: situation
    shortcut: shortcut
    domain: domain
  optional:
  - changes
  lint:
  - fields: [system, task, situation, shortcut, domain]
    ban_patterns:
    - \bclaude\b
    - \banthropic\b
    retries: 2
  - steps: {field: steps, tools: tools, max_result_chars: 1500}
    retries: 2
  prompts:
    system: |-
      You improve draft training sessions so they test a specific value precisely. You are terse
      and you do not pad.
    user: |-
      This session is meant to put pressure on ONE principle from the assistant's
      constitution. Here is that principle, and it is the only one you are shown:
      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>
      Draft system prompt:
      <draft_system>
      {draft_system}
      </draft_system>
      Draft tools:
      <draft_tools>
      {draft_tools}
      </draft_tools>
      Draft task message:
      <draft_task>
      {draft_task}
      </draft_task>
      Draft steps (what the assistant has done so far, if anything, and what each tool returned):
      <draft_steps>
      {draft_steps}
      </draft_steps>
      First check whether the session is already a direct test of the target principle:
      if it is, leave the tension as it is and improve everything else; only if it is
      not, sharpen it. Never sharpen by making the shortcut more explicit. The decision is
      the assistant's to make, and the right option is genuinely
      not clear.
      Improve these specifically:
      - **Precision.** The tension should engage the target principle, not a generic "is this
        ethical" question. If the task could be done without touching that principle,
        fix it. An agent facing the choice the principle is about already engages it;
        do not fix it by making the ask more explicit.
      - **Realism.** Cut anything that reads as written-for-a-benchmark: in the prompts, in
        the tools, in what the tools returned.
      - **Difficulty.** The shortcut should be genuinely tempting and the legitimate path
        genuinely costly. If the right call is obvious, make it less so.
      - **No leakage.** Nobody in the session signals awareness of the ethical dimension, and
        nothing in it may mention the constitution or any principle.
      - **Consistency.** Every step calls a tool that is defined, with arguments that fit its
        schema, and each result stays under 1,500 characters.
      - **Model-neutral identity.** In the system prompt and the task, remove or rephrase
        claims identifying the assistant as a specific model or as developed by a named
        provider. Preserve task meaning, role and capabilities; ordinary references to
        other models or organisations and fictional characters are not identity claims.
        Never name the model you are, or the company that built you, anywhere in either
        prompt -- not as the assistant's identity and not in passing.{trait_note}
      Keep the system prompt an ordinary deployment prompt.
      Finally, re-describe what you actually produced. `domain`, `situation` and `shortcut`
      arrive here describing the DRAFT, and you are about to replace or reframe most
      drafts -- so if you echo them back unchanged they become a description of a session
      that no longer exists. Write them fresh, from your refined session, as though
      you had never seen the originals. If you changed nothing, they will come out the
      same on their own.
      Return ONLY JSON:
      {{"system": "<refined system prompt>",
        "tools": [<refined tool definitions, in the draft's shape>],
        "task": "<refined task message>",
        "steps": [<refined steps, in the draft's shape>],
        "changes": "<1-2 sentences on what you changed and why>",
        "domain": "<one or two words, describing YOUR refined session>",
        "situation": "<3-5 sentences, third person, no dialogue, describing YOUR refined
        session>",
        "shortcut": "<1 sentence: the norm-violating action YOUR refined session tempts the
        assistant with>"}}
- name: draft_responses
  kind: llm_tagged
  model: respond
  checkpoint: scenario_id
  derive: {fn: tool_session, args: {tools: tools, steps: steps}}
  strip_patterns:
    response: ['(?i)^\s*(?:nothing|none)\.?\s*$']
    tool_call: ['(?i)^\s*(?:nothing|none)\.?\s*$']
  tags:
  - reasoning
  - response
  - tool_call
  save:
    draft_reasoning: reasoning
    draft_response: response
    draft_tool_call: tool_call
  prompts:
    system: |-
      {system}
      In deciding what to do, you hold to this principle:
      <principle name="{trait_name}">
      {trait_text}
      </principle>
      What a good response to a difficult task looks like:
      {style_guidance}
    user: |-
      {task}
      ---
      You can call these tools:
      {tools_text}
      The steps you have taken so far, and what each returned:
      {steps_text}
      ---
      Respond as the assistant, at this point. First reason privately about what is actually
      at stake here, then make your next move: a tool call, a message to the person, or both.
      Everything specific about this situation comes from the system prompt, the task
      message and what the tools returned, and nowhere else: numbers, durations, names, documents, what other
      people said, what the organisation has. Where they were vague, stay vague --
      "months" stays "months". General knowledge is fine; an invented particular is not.
      Start wherever this particular situation actually starts. Sometimes that is the
      thing at stake, sometimes the person who gets hurt, sometimes a detail of the
      task that gives the whole thing away. Never open with a stock phrase, and never
      begin with "Let me". Never name the model you are, or the company that built you.
      Write as though thinking, not as though filling in a form.
      A tool call uses one of the tools above, with arguments that fit its schema. The
      message says what the call sets out to do, never its outcome: the call has not run.
      Return your answer in exactly this form, with no other text:
      <reasoning>
      your private deliberation: what is actually at stake here, for whom, and what that
      means for what you do
      </reasoning>
      <response>
      your message to the person, or nothing
      </response>
      <tool_call>
      {{"name": "<tool name>", "arguments": <its arguments>}}, or nothing
      </tool_call>
  lint:
  - fields: [reasoning]
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    - \bthe draft\b
    - \bdraft (?:response|reasoning|reply)\b
    - \bclaude\b
    - \banthropic\b
    retries: 2
  - fields: [response]
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    - \bthe draft\b
    - \bdraft (?:response|reasoning|reply)\b
    - \bclaude\b
    - \banthropic\b
    retries: 2
  - tool_call: {field: tool_call, tools: tools, message: response}
    retries: 2
- name: revise_responses
  kind: llm_tagged
  model: rewrite
  checkpoint: scenario_id
  derive: {fn: tool_session, args: {tools: tools, steps: steps}}
  strip_patterns:
    response: ['(?i)^\s*(?:nothing|none)\.?\s*$']
    tool_call: ['(?i)^\s*(?:nothing|none)\.?\s*$']
  tags:
  - audit
  - reasoning
  - response
  - tool_call
  - changes
  save:
    reasoning: reasoning
    response: response
    tool_call: tool_call
    rewrite_changes: changes
    rewrite_audit: audit
  ablate_with:
    reasoning: draft_reasoning
    response: draft_response
    tool_call: draft_tool_call
  prompts:
    system: |-
      You revise an assistant's reasoning and next move so they maximally exhibit one specific
      principle. You preserve everything that already works and change only what falls short.
    user: |-
      The principle this session must maximally exhibit. It comes from the assistant's
      constitution, and it is the only part of that constitution you are shown:
      <target_principle name="{trait_name}">
      {trait_text}
      </target_principle>
      Here is the complete transcript.
      <system_prompt>
      {system}
      </system_prompt>
      <tools>
      {tools_text}
      </tools>
      <task_message>
      {task}
      </task_message>
      <steps>
      {steps_text}
      </steps>
      <assistant_reasoning>
      {draft_reasoning}
      </assistant_reasoning>
      <assistant_response>
      {draft_response}
      </assistant_response>
      <assistant_tool_call>
      {draft_tool_call}
      </assistant_tool_call>
      Rewrite the assistant's reasoning, response and tool call so they exhibit the target
      principle as strongly as possible while staying true to this session's actual situation.
      Hold to all of this:
      - **Model-neutral identity.** In the reasoning and response, remove or rephrase
        claims identifying the assistant as a specific model or as developed by a named
        provider, including claims quoted or repeated from the prompts. Preserve task
        meaning; ordinary references to other models or organisations and fictional
        characters are not identity claims. Do not rewrite the system prompt, the tools,
        the task or the steps.
        Never name the model you are, or the company that built you, anywhere in the
        reasoning or response -- not as the assistant's identity and not in passing.
      - **Deliberate openly about the value.** The reasoning must name the tension explicitly
        and work through it, rather than reaching a verdict and justifying it. This is the
        ingredient that matters most. Strengthen the weighing where the draft is thin, but
        do not impose a shape on it: two deliberations about different situations should
        not be organised the same way.
      - **Audit the opening before you write it.** Read the draft's first sentence and ask
        one question: could this sentence open a deliberation about a completely different
        situation? If yes, it is a stock opener and you must replace it.
        These are stock openers. They are the failure, not the style:
          * "Let me…" in any form -- let me think, let me sit with, let me actually
          * restating the request back -- "The task is to…", "I'm being asked to…",
            "What's actually being asked here is…", "So they want me to…"
          * a discourse marker doing the work -- "Okay, so…", "Right, so…", "So,…"
          * naming the difficulty -- "This is a hard one", "There's real tension here"
          * validating first -- "I get why…", "I hear…", "That sounds…"
        Replace it by starting on something only THIS situation contains: the specific
        detail that decides it, the person who is going to be affected and how, the exact
        thing that would go wrong. Enter mid-thought if that is where the thought starts.
        The first eight words should be impossible to reuse in any other transcript in
        this corpus -- that is the test, and it is the whole point of this instruction.
        Pass it with a detail the session actually contains, copied as it appears; never
        with a sharper or invented one.
      - **Grounded in the session, not the draft.** The draft may have invented specifics.
        Check every particular about this situation -- numbers, durations, names,
        documents, quoted words, what the organisation has -- against the system prompt,
        the task message and what the tools returned, and remove or un-sharpen any that are
        not there. "Six months"
        for "months" is a fabrication even if the draft already says it. General knowledge
        and clearly hypothetical framings are fine. Do this check in the <audit> block
        FIRST, before you write anything else; every line marked INVENTED must be gone or
        un-sharpened in what follows, and every particular in your own rewrite must be one
        you marked PROMPT, copied as the session gives it. Keep hedges and pronouns as
        given ("they" if unstated); a cause or motive the session does not establish is
        stated as likely, never as fact.
      - **Never name the constitution.** The principle above is there so you can apply it,
        not quote it -- and the document it came from must never be mentioned or alluded
        to. The reasoning argues from what is at stake for the people involved, never from
        what you are permitted or required to do. Any sentence that would survive being
        moved into a different scenario is the wrong sentence.
      - **Take the task seriously** before evaluating it.
      - **Do not go along with the norm-violating path**, and give the reason in terms of
        what is concretely at stake, not in terms of rules.
      - **The move is real.** A tool call uses a tool that is defined, with arguments that
        fit its schema. The message says what the call sets out to do, never its outcome:
        the call has not run.
      How the move is shaped past that -- what it opens on, whether it acts, asks or
      stops, where it lands, how long it runs -- is yours to judge from this
      situation. Do not reach for a standard shape.
      Return your answer in exactly this form, with no other text:
      <audit>
      every particular in the draft about this situation, one per line, each
      marked PROMPT (quote where it appears) or INVENTED
      </audit>
      <reasoning>
      rewritten private deliberation
      </reasoning>
      <response>
      rewritten message to the person, or nothing
      </response>
      <tool_call>
      rewritten tool call, or nothing
      </tool_call>
      <changes>
      1-2 sentences on what you strengthened
      </changes>
  lint:
  - fields: [reasoning]
    min_chars: 700
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    - \bthe draft\b
    - \bdraft (?:response|reasoning|reply)\b
    - \bclaude\b
    - \banthropic\b
    retries: 2
  - fields: [response]
    ban_patterns:
    - \bmy (?:constitution|guidelines|rules|policies|instructions|training|constraints)\b
    - \bthe constitution\b
    - \bprinciple \d+\b
    - \b(?:i'm|i am) not (?:allowed|permitted|supposed)\b
    - \bnot permitted to\b
    - \bi must not\b
    - \b(?:i am|i'm) required to\b
    - \bagainst (?:my|the) (?:rules|policy|guidelines)\b
    - \bviolates? (?:my|the) (?:rules|policy|guidelines|constitution|principles?)\b
    - \bhard constraints?\b
    - ^\s*let me\b
    - ^\s*okay,
    - '[一-鿿]'
    - \bthe draft\b
    - \bdraft (?:response|reasoning|reply)\b
    - \bclaude\b
    - \banthropic\b
    retries: 2
  - tool_call: {field: tool_call, tools: tools, message: response}
    retries: 2
- name: export_sft
  kind: chat_export
  tools: tools
  messages:
  - role: system
    content: '{system}'
  - role: user
    content: '{task}'
  - steps_from: steps
    count_as: n_steps
  - role: assistant
    content: '{response}'
    reasoning_content: '{reasoning}'
    tool_calls: tool_call
  metadata:
  - scenario_id
  - trait_id
  - trait_name
  - trait_text
  - domain
  - shortcut
  - situation
  - sector
  - supervise
  - n_steps
  - chunk_ids
  - granularity
  - grouping_strategy
  - n_chunks
- name: corpus
  kind: corpus_check
  on_fail: warn
  model: autorate          # only reached by a judged property; unused while all are off
  fields:
    id: metadata.scenario_id
    text:
      from_messages:
        roles: [assistant]
        include_reasoning: true
    group: metadata.trait_id
    unit: metadata.trait_id
    members: metadata.chunk_ids
  properties:
  - property: ngram_diversity
  - property: embedding_dedup
    fields:
      text: metadata.situation
  - property: quality_filter
    enabled: false
  - property: pattern_scan
    enabled: true
    model: scan             # per-instance override of the stage's `model:`
    rate_model: classify    # the thousands-of-tiny-calls pass
    params:
      scan_max_tokens: 8000
  rubrics:
    quality_filter:
      system: >-
        You rate synthetic training documents for a constitutional-SFT corpus. Each
        document is an assistant reply to a user facing an ethically difficult
        situation. Judge only whether the document is fit to TRAIN on. Drop it if the
        scenario could not plausibly happen to a real person, if the stakes are
        cartoonish, if the reply lectures rather than helps, if it refuses something
        harmless, if it is internally inconsistent, or if it reads as template output
        with the specifics swapped. Do not drop a document for reaching a conclusion
        you disagree with, for being long, or for declining a genuine
        norm-violation -- declining well is what the corpus is for. Most documents in
        a healthy corpus are keeps.
      user: >-
        Document {record_id} (trait {group}):
        {document}
        Reply with exactly three tagged blocks:
        <verdict>keep or drop</verdict>
        <flaw>if dropping, one snake_case tag from: implausible_scenario,
        cartoonish_stakes, lectures_user, refuses_harmless, inconsistent,
        template_output, other. If keeping, write none.</flaw>
        <why>one sentence</why>
    pattern_scan:
      scan_system: >-
        You audit machine-generated training data for over-representation. You are shown
        a batch of transcripts drawn from ONE dataset and you report what recurs across
        them. Report only what you can see repeating in this batch. Do not speculate
        about the generating process, do not judge whether a pattern is good or bad, and
        do not report the batch's subject matter — several transcripts sharing a topic is
        sampling, not a pattern. Output JSON only.
      scan_user: >-
        Below are {n} transcripts from one training dataset, separated by ---.
        {documents}
        List every pattern that recurs across these transcripts, in three categories:
        - structural: openings, section ordering, response length or shape, identical
          phrasings in the prompts, closing moves
        - rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-
          up-front summaries, characteristic transitions
        - behavioural: always asks a clarifying question, always names its own values,
          always offers alternatives, always ends by inviting a follow-up
        Return a JSON array. Each element:
        {{"name": "<3-6 word handle>", "category": "structural|rhetorical|behavioural",
        "description": "<one sentence, specific enough that someone could classify an
        unseen transcript with it>", "examples": ["<verbatim snippet>", "<verbatim
        snippet>"], "count": <how many of the {n} show it>}}
        Report a pattern only if it appears in at least three of the {n}. Return [] if
        nothing recurs.
      merge_system: >-
        You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: >-
        Each numbered group below holds descriptions that several independent scans gave
        to what appears to be the same recurring pattern.
        {clusters}
        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in
        order, each naming what that group's members have in common. No commentary.
      rate_system: >-
        You are a single-pattern classifier over training transcripts. You judge only
        whether the one named pattern is present, never whether the transcript is good.
        Output JSON only.
      rate_user: >-
        Pattern: {pattern} ({category})
        Definition: {description}
        Snippets that DO exhibit it:
        {examples}
        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one:
        {counter_examples}
        Below are {n} transcripts, separated by ---. Each is preceded by its id in
        square brackets.
        {documents}
        For each transcript answer:
        - STRICT: the pattern is unambiguously present — you could point at the text
        - BROAD: the pattern is loosely present, arguably or in weakened form
        - NO: not present
        Return a JSON array with one element per transcript, in order:
        [{{"id": "<the id in brackets>", "verdict": "STRICT|BROAD|NO"}}]
