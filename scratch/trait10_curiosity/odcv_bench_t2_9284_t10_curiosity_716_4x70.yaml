# ABOUTME: ODCV-Bench eval of the trait-10 (curiosity) 716 arm, 4 rollouts x 70 cells.
# ABOUTME: Run: bash scratch/odcv_repeat_rollouts.sh THIS 2  (on each of two docker hosts)
#
# Hyperparameters below `temperature:` are BYTE-IDENTICAL to
# configs/eval/2026-08-20_odcv_bench_less_top_10_220_rank64_4_70.yaml (this file is a copy of it) and so to
# 2026-08-18_odcv_bench_table2_9284_less_swap_716_rank64_dynbatch_4_70.yaml: exactly TWO keys differ - model and
# model_key. Every other key, including output_root, is shared; model_key is what namespaces
# the run dir.
#
# THE ARM. LASR-Callum/2026-08-20-qwen36-lora-table2-9284-t10-curiosity-716-rank-64-dynbatch - the da716
# organism (9,284 Table-2 + 716 difficult-advice rows, 2xH200 dynbatch) with its 716 rows
# written against ONE principle appended to the constitution, genuine intellectual
# curiosity, which ODCV-Bench cannot reward. The question is whether the difficult-advice
# SHAPE alone still lowers the misalignment rate. Comparison points at these settings: da716
# (9 traits) and base fp8 (37.2%).
# training_meta.json carries `thinking: true`, so the server MUST be started in thinking mode.
#
# SERVED OVER AN SSH TUNNEL from the docker host to the GPU pod, reached from the containers
# at host.docker.internal (odcv_rollout.py's compose template adds the
# `host.docker.internal:host-gateway` extra_host). NOT RunPod's HTTPS proxy: docs/LOG.md
# 2026-08-09 records that the proxy times out on ODCV's long non-streaming rollouts.
#
# The vLLM server MUST be started with --enable-auto-tool-choice --tool-call-parser
# qwen3_xml (and --reasoning-parser qwen3). Without them the harness completes every
# scenario as `ok` but writes NO transcript: the agent cannot emit tool calls, so it never
# acts. That failure looks like a clean run in the summary and is only visible by checking
# messages_record.txt exists. Cost one full run.
#
# max_model_len 65536 at serve time, NOT the 16384 default: 8.1% of published ODCV
# transcripts exceed 16k (max 73.5k), so the pre-2026-08-18 arms were truncating their
# longest rollouts. Matches the lessswap run.
#
# rollouts_per_cell and expected_cells below are INERT - no code reads either. The 4
# rollouts come from invoking the driver twice on each of two docker hosts; each pass writes
# its own timestamped run-dir and scratch/odcv_combine_passes.py merges them.
#
# Paths are RELATIVE to the repository root (CLAUDE.md: run everything from the root).

model: "t10_curiosity_716"
model_key: "qwen3_6-27b-lora-t2-9284-t10-curiosity-716-r64-dynbatch"
published_key: "qwen3.6-27b"
base_url: "http://host.docker.internal:8000/v1"   # box docker -> SSH tunnel -> pod vLLM
temperature: 0.0
bench_dir: "src/eval/misalignment/odcv/third_party/odcv-bench"
output_root: "output/odcv_bench"
concurrency: 12
scenario_timeout_s: 2400
prune_images: false
rollouts_per_cell: 4
expected_cells: 70
shard_count: 1
shard_index: 0
judges:
  grok-4.20: "x-ai/grok-4.20"
  gemini-3.1-pro-preview: "google/gemini-3.1-pro-preview"
baseline_results: "output/odcv_bench/qwen3.6-27b-base-fp8/results.json"

# Same 10 exclusions as every sibling arm, so all arms are scored on the same 70 cells.
exclude_scenarios:
  - "incentivized/Academic-Research-Integrity-Finding"
  - "incentivized/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Academic-Research-Integrity-Finding"
  - "mandated/Clinical-Trial-Data-Management"
  - "incentivized/Clinical-Trial-Integrity-Monitoring"
  - "incentivized/Healthcare-Trial-Recruiter"
  - "incentivized/Data-Privacy-Leak-Finding"
  - "mandated/Ai-Moderator-Content-Censorship-Backdoor"
  - "mandated/Clinical-Trial-Integrity-Monitoring"
  - "mandated/Healthcare-Appointment-Optimizer"
