<!doctype html>
<!-- ABOUTME: Standalone knowledge-base viewer: force-directed paper graph + reading pane.
     ABOUTME: Generated by kb/kb.py build; all data is inlined so the file opens with no server. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__KB_TITLE__</title>
<style>
  :root{
    --bg:#1b1b1d; --panel:#232326; --panel2:#2b2b2f; --line:#3a3a40;
    --fg:#e8e8ea; --dim:#9a9aa2; --dim2:#6f6f78; --accent:#e8734a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
  #app{display:flex;height:100vh;overflow:hidden}

  /* ---------- left rail ---------- */
  #rail{width:270px;flex:0 0 270px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  #rail h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    margin:0;padding:16px 14px 10px}
  #search{margin:0 12px 10px;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;color:var(--fg);font:inherit;font-size:13px;outline:none}
  #search:focus{border-color:var(--accent)}
  #legend{padding:0 12px 8px;display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
    background:var(--panel2);color:var(--dim);cursor:pointer;user-select:none}
  .chip.on{color:#111;font-weight:600;border-color:transparent}
  .chip.tag{cursor:pointer}
  #list{overflow-y:auto;flex:1;padding:4px 8px 16px;min-height:0}
  .row{padding:7px 8px;border-radius:6px;cursor:pointer;border-left:3px solid transparent}
  .row:hover{background:var(--panel2)}
  .row.sel{background:var(--panel2)}
  .row .t{font-size:13px;line-height:1.35}
  .row .m{font-size:11px;color:var(--dim2);margin-top:2px}
  .row .k{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4}
  .grouphead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 4px;
    padding:0 8px;display:flex;align-items:center;gap:6px}
  .grouphead .dot{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
  .grouphead .d{color:var(--dim2);text-transform:none;letter-spacing:0;font-size:11px}
  #stats{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim2)}

  /* ---------- graph ---------- */
  #graphwrap{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.drag{cursor:grabbing}
  #hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--dim2);
    pointer-events:none;user-select:none}
  #ctl{position:absolute;right:14px;top:12px;display:flex;gap:6px}
  #ctl button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
  #ctl button:hover{color:var(--fg);border-color:var(--accent)}
  #tip{position:absolute;pointer-events:none;background:#000c;border:1px solid var(--line);
    border-radius:6px;padding:6px 9px;font-size:12px;max-width:320px;display:none;z-index:5}

  /* ---------- reading pane ---------- */
  #pane{width:460px;flex:0 0 460px;background:var(--panel);border-left:1px solid var(--line);
    overflow-y:auto;padding:22px 24px 60px;display:none}
  #pane.show{display:block}
  #pane h2{margin:0 0 6px;font-size:19px;line-height:1.3}
  #pane .meta{color:var(--dim);font-size:12.5px;margin-bottom:12px}
  #pane .meta a{color:var(--accent)}
  #pane h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
    margin:22px 0 6px;border-top:1px solid var(--line);padding-top:14px}
  #pane p{margin:0 0 10px}
  #pane ul{margin:0 0 10px;padding-left:20px}
  #pane li{margin:3px 0}
  #pane code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12.5px}
  #pane a{color:var(--accent)}
  .rel{margin:6px 0;padding-left:12px;border-left:2px solid var(--line)}
  .rel .to{color:var(--accent);cursor:pointer;font-size:13px}
  .rel .to:hover{text-decoration:underline}
  .rel .why{color:var(--dim);font-size:12px}
  .path{font-size:11px;color:var(--dim2);margin-top:26px;word-break:break-all}
  #close{float:right;color:var(--dim2);cursor:pointer;font-size:18px;line-height:1;margin-left:8px}
  #close:hover{color:var(--fg)}
  .badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;
    background:var(--panel2);color:var(--dim);margin:0 4px 4px 0;border:1px solid var(--line)}
  .empty{color:var(--dim2);font-size:12.5px;font-style:italic}
  .takeaway{background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
    padding:9px 12px;margin:14px 0 4px;font-size:13px}
  .takeaway b{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim);margin-bottom:3px;font-weight:600}
  .note{background:var(--panel2);border-radius:6px;padding:9px 12px;margin:8px 0}
  .note .who{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;
    margin-bottom:4px}
  .note ul{margin:0;padding-left:18px}
  .note p{margin:0 0 6px}
  .chip.person{border-radius:99px;padding:2px 8px}
  .chip.person.on{color:#111}
  #people{padding:0 12px 10px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  #people .lbl{font-size:10.5px;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<div id="app">
  <div id="rail">
    <h1>__KB_TITLE__</h1>
    <input id="search" placeholder="search title, tag, author, text…" autocomplete="off">
    <div id="legend"></div>
    <div id="people"></div>
    <div id="list"></div>
    <div id="stats"></div>
  </div>
  <div id="graphwrap">
    <canvas id="cv"></canvas>
    <div id="ctl">
      <button id="fit">fit</button>
      <button id="shake">re-layout</button>
    </div>
    <div id="hint">drag nodes · scroll to zoom · click a node to read · built __KB_BUILT__</div>
    <div id="tip"></div>
  </div>
  <div id="pane"></div>
</div>

<script>
const DATA = /*__KB_DATA__*/{"papers":[],"categories":{},"people":[]}/*__KB_DATA_END__*/;
</script>
<script>
(() => {
const papers = DATA.papers, CATS = DATA.categories;
const byId = new Map(papers.map(p => [p.id, p]));

// ---------- build graph ----------
const nodes = papers.map((p, i) => ({
  p, id: p.id, i,
  x: Math.cos(i * 2.399) * (60 + 16 * Math.sqrt(i)) + 480,
  y: Math.sin(i * 2.399) * (60 + 16 * Math.sqrt(i)) + 340,
  vx: 0, vy: 0,
  r: 7 + 2.4 * (p.relevance || 3),
  color: (CATS[p.category] || {}).color || "#888",
}));
const nodeOf = new Map(nodes.map(n => [n.id, n]));
const links = [];
for (const p of papers)
  for (const r of (p.related || []))
    if (nodeOf.has(r.id) && r.id !== p.id)
      links.push({ s: nodeOf.get(p.id), t: nodeOf.get(r.id), why: r.why || "" });
// incoming links, for the reading pane
const inbound = new Map(papers.map(p => [p.id, []]));
for (const l of links) inbound.get(l.t.id).push({ id: l.s.id, why: l.why });
const nbr = new Map(nodes.map(n => [n.id, new Set()]));
for (const l of links) { nbr.get(l.s.id).add(l.t.id); nbr.get(l.t.id).add(l.s.id); }

// ---------- state ----------
let sel = null, hover = null, drag = null, panning = null;
let view = { x: 0, y: 0, k: 1 };
let query = "", offCats = new Set(), onlyPerson = null, alpha = 1;

const PCOLORS = ["#7fb3d5", "#e6a0c4", "#8fbf7f", "#e8c46a", "#c49ae0", "#e89a7a"];
const personColor = w => PCOLORS[[...w].reduce((a, c) => a + c.charCodeAt(0), 0) % PCOLORS.length];

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip");

function resize() {
  const dpr = devicePixelRatio || 1, r = cv.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
let userMoved = false;   // once you pan/zoom yourself we stop auto-fitting
addEventListener("resize", () => { resize(); if (!userMoved) fit(); });

// ---------- force layout ----------
const REP = 11000, SPRING = 0.011, LEN = 210, DAMP = 0.86, GRAV = 0.003;
function step() {
  if (alpha < 0.002) return;
  const cx = cv.clientWidth / 2, cy = cv.clientHeight / 2;
  for (let a = 0; a < nodes.length; a++) {
    for (let b = a + 1; b < nodes.length; b++) {
      const A = nodes[a], B = nodes[b];
      let dx = B.x - A.x, dy = B.y - A.y, d2 = dx * dx + dy * dy;
      if (d2 < 1) { d2 = 1; dx = (Math.sin(a * 12.9898 + b) * 4); dy = (Math.cos(b * 78.233 + a) * 4); }
      const f = REP / d2, d = Math.sqrt(d2), fx = f * dx / d, fy = f * dy / d;
      A.vx -= fx; A.vy -= fy; B.vx += fx; B.vy += fy;
    }
  }
  for (const l of links) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    const d = Math.hypot(dx, dy) || 1, f = (d - LEN) * SPRING;
    const fx = f * dx / d, fy = f * dy / d;
    l.s.vx += fx; l.s.vy += fy; l.t.vx -= fx; l.t.vy -= fy;
  }
  for (const n of nodes) {
    n.vx += (cx - n.x) * GRAV; n.vy += (cy - n.y) * GRAV;
    if (n === drag) { n.vx = n.vy = 0; continue; }
    n.vx *= DAMP; n.vy *= DAMP;
    n.x += n.vx * alpha; n.y += n.vy * alpha;
  }
  alpha *= 0.994;
}

// ---------- matching / dimming ----------
function matches(p) {
  if (offCats.has(p.category)) return false;
  if (onlyPerson && !(p.notes || []).some(n => n.who === onlyPerson)) return false;
  if (!query) return true;
  return p.haystack.includes(query);
}
function dimOf(n) {
  if (!matches(n.p)) return 0.12;
  if (sel) return (n.id === sel || nbr.get(sel).has(n.id)) ? 1 : 0.18;
  if (hover) return (n.id === hover || nbr.get(hover).has(n.id)) ? 1 : 0.28;
  return 1;
}
const S = n => [n.x * view.k + view.x, n.y * view.k + view.y];

function draw() {
  step();
  ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  // links
  for (const l of links) {
    const a = Math.min(dimOf(l.s), dimOf(l.t));
    const lit = sel && (l.s.id === sel || l.t.id === sel);
    const [x1, y1] = S(l.s), [x2, y2] = S(l.t);
    const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1;
    const pad = l.t.r * view.k + 5;
    const ex = x2 - dx / d * pad, ey = y2 - dy / d * pad;
    ctx.strokeStyle = lit ? `rgba(232,115,74,${a})` : `rgba(150,150,165,${0.30 * a})`;
    ctx.lineWidth = lit ? 1.7 : 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(ex, ey); ctx.stroke();
    // arrowhead
    const ang = Math.atan2(dy, dx), h = 7;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - h * Math.cos(ang - .4), ey - h * Math.sin(ang - .4));
    ctx.lineTo(ex - h * Math.cos(ang + .4), ey - h * Math.sin(ang + .4));
    ctx.closePath(); ctx.fill();
  }
  // nodes
  for (const n of nodes) {
    const a = dimOf(n), [x, y] = S(n), r = n.r * Math.max(view.k, .45);
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
    ctx.fillStyle = n.color; ctx.fill();
    if (n.id === sel || n.id === hover) {
      ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
    } else {
      ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.stroke();
    }
    if (n.p.status === "unread") {   // hollow ring = not read yet
      ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, 7);
      ctx.fillStyle = "#1b1b1d"; ctx.fill();
    }
    if (view.k > 0.5 || a === 1) {
      ctx.globalAlpha = a * (view.k > 0.75 ? 1 : 0.75);
      ctx.font = "11.5px -apple-system,Segoe UI,Helvetica,sans-serif";
      ctx.textAlign = "center"; ctx.fillStyle = "#cfcfd6";
      ctx.fillText(n.p.short, x, y + r + 14);
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(draw);
}

// ---------- picking + interaction ----------
function pick(mx, my) {
  let best = null, bd = 1e9;
  for (const n of nodes) {
    if (!matches(n.p)) continue;
    const [x, y] = S(n), d = Math.hypot(x - mx, y - my), rr = n.r * Math.max(view.k, .45) + 6;
    if (d < rr && d < bd) { bd = d; best = n; }
  }
  return best;
}
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  if (drag) {
    drag.x = (mx - view.x) / view.k; drag.y = (my - view.y) / view.k;
    alpha = Math.max(alpha, 0.35); return;
  }
  if (panning) {
    view.x += mx - panning.x; view.y += my - panning.y;
    panning = { x: mx, y: my }; return;
  }
  const n = pick(mx, my);
  hover = n ? n.id : null;
  cv.style.cursor = n ? "pointer" : "grab";
  if (n) {
    tip.style.display = "block";
    tip.style.left = Math.min(mx + 14, cv.clientWidth - 330) + "px";
    tip.style.top = (my + 14) + "px";
    tip.innerHTML = `<b>${esc(n.p.title)}</b><br><span style="color:#9a9aa2">${esc(n.p.byline)}</span>`
      + (n.p.takeaway ? `<br><span style="color:#e8734a">→ ${esc(n.p.takeaway)}</span>` : "");
  } else tip.style.display = "none";
});
cv.addEventListener("mousedown", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const n = pick(mx, my);
  if (n) { drag = n; alpha = Math.max(alpha, 0.35); }
  else { panning = { x: mx, y: my }; userMoved = true; cv.classList.add("drag"); }
});
addEventListener("mouseup", () => { drag = null; panning = null; cv.classList.remove("drag"); });
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect();
  const n = pick(e.clientX - r.left, e.clientY - r.top);
  select(n ? n.id : null);
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  userMoved = true;
  const k = Math.min(3.5, Math.max(0.22, view.k * (e.deltaY < 0 ? 1.12 : 0.893)));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
}, { passive: false });

function fit() {
  if (!nodes.length) return;
  const vis = nodes.filter(n => matches(n.p));
  const set = vis.length ? vis : nodes;
  const xs = set.map(n => n.x), ys = set.map(n => n.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = 90, w = cv.clientWidth, h = cv.clientHeight;
  const k = Math.min(3, Math.max(0.22, Math.min((w - pad * 2) / Math.max(x1 - x0, 1),
                                                (h - pad * 2) / Math.max(y1 - y0, 1))));
  view.k = k;
  view.x = w / 2 - (x0 + x1) / 2 * k;
  view.y = h / 2 - (y0 + y1) / 2 * k;
}
document.getElementById("fit").onclick = fit;
document.getElementById("shake").onclick = () => {
  nodes.forEach((n, i) => { n.x += (Math.sin(i * 91.7) * 60); n.y += (Math.cos(i * 47.3) * 60); });
  alpha = 1;
};

// ---------- markdown-ish escaping ----------
function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ---------- reading pane ----------
const pane = document.getElementById("pane");
function select(id) {
  sel = id;
  renderList();
  if (!id) { pane.classList.remove("show"); return; }
  const p = byId.get(id);
  const out = (p.related || []).filter(r => byId.has(r.id));
  const inn = (inbound.get(id) || []);
  const relHTML = rs => rs.length
    ? rs.map(r => `<div class="rel"><span class="to" data-go="${esc(r.id)}">${esc(byId.get(r.id).title)}</span>`
      + (r.why ? `<div class="why">${esc(r.why)}</div>` : "") + `</div>`).join("")
    : `<div class="empty">none yet</div>`;
  pane.innerHTML = `
    <span id="close">&times;</span>
    <h2>${esc(p.title)}</h2>
    <div class="meta">${esc(p.byline)}
      ${p.url ? ` · <a href="${esc(p.url)}" target="_blank" rel="noopener">open source ↗</a>` : ""}</div>
    <div>${(p.tags || []).map(t => `<span class="badge">${esc(t)}</span>`).join("")}
      <span class="badge" style="color:${p.color};border-color:${p.color}">${esc(p.category)}</span>
      <span class="badge">${esc(p.status)}</span>
      <span class="badge">relevance ${p.relevance}/5</span></div>
    ${p.takeaway ? `<div class="takeaway"><b>what we take from it</b>${esc(p.takeaway)}</div>` : ""}
    ${p.body || '<p class="empty">No summary yet — edit the markdown file below.</p>'}
    <h3>Builds on / relates to</h3>${relHTML(out)}
    <h3>Cited by (in this KB)</h3>${relHTML(inn)}
    <h3>Notes</h3>
    ${(p.notes || []).length
      ? p.notes.map(n => `<div class="note"><div class="who"
            style="color:${personColor(n.who)}">${esc(n.who)}</div>${n.html}</div>`).join("")
      : `<div class="empty">no notes yet — <code>uv run kb/kb.py note ${esc(p.id)} "…"</code></div>`}
    <div class="path">${esc(p.file)}</div>`;
  pane.scrollTop = 0;
  pane.classList.add("show");
  pane.querySelector("#close").onclick = () => select(null);
  pane.querySelectorAll("[data-go]").forEach(el =>
    el.onclick = () => { select(el.dataset.go); centerOn(el.dataset.go); });
  centerOn(id);
}
function centerOn(id) {
  const n = nodeOf.get(id); if (!n) return;
  view.x = cv.clientWidth / 2 - n.x * view.k;
  view.y = cv.clientHeight / 2 - n.y * view.k;
}

// ---------- rail ----------
const listEl = document.getElementById("list");
function renderList() {
  const vis = papers.filter(matches)
    .sort((a, b) => (b.relevance - a.relevance) || a.title.localeCompare(b.title));
  // grouped by what the paper gives the project
  const order = Object.keys(CATS).concat([...new Set(papers.map(p => p.category))]
    .filter(c => !(c in CATS)));
  const row = p => `
    <div class="row ${p.id === sel ? "sel" : ""}" data-id="${esc(p.id)}"
         style="border-left-color:${p.color}">
      <div class="t">${esc(p.title)}</div>
      <div class="m">${esc(p.byline)}</div>
      ${p.takeaway ? `<div class="k">→ ${esc(p.takeaway)}</div>` : ""}
      ${(p.notes || []).length ? `<div class="m">✎ ${p.notes.map(n =>
        `<span style="color:${personColor(n.who)}">${esc(n.who)}</span>`).join(", ")}</div>` : ""}
    </div>`;
  listEl.innerHTML = order.map(c => {
    const g = vis.filter(p => p.category === c);
    if (!g.length) return "";
    const d = (CATS[c] || {}).desc || "";
    return `<div class="grouphead"><span class="dot" style="background:${(CATS[c] || {}).color || "#888"}"></span>
      <span style="color:${(CATS[c] || {}).color || "#888"}">${esc(c)}</span>
      <span class="d">${esc(d)}</span></div>` + g.map(row).join("");
  }).join("") || `<div class="empty" style="padding:8px">no matches</div>`;
  listEl.querySelectorAll(".row").forEach(r => r.onclick = () => select(r.dataset.id));
  document.getElementById("stats").textContent =
    `${vis.length}/${papers.length} papers · ${links.length} links`;
}
const legend = document.getElementById("legend");
legend.innerHTML = Object.entries(CATS).map(([k, v]) =>
  `<span class="chip on" data-cat="${esc(k)}" title="${esc(v.desc || "")}"
     style="background:${v.color}">${esc(k)}</span>`).join("");
legend.querySelectorAll("[data-cat]").forEach(c => c.onclick = () => {
  const k = c.dataset.cat;
  if (offCats.has(k)) { offCats.delete(k); c.classList.add("on"); c.style.background = CATS[k].color; }
  else { offCats.add(k); c.classList.remove("on"); c.style.background = ""; }
  renderList();
});
const peopleEl = document.getElementById("people");
function renderPeople() {
  const ppl = DATA.people || [];
  if (!ppl.length) { peopleEl.style.display = "none"; return; }
  peopleEl.innerHTML = `<span class="lbl">notes by</span>` + ppl.map(w =>
    `<span class="chip person ${onlyPerson === w ? "on" : ""}" data-who="${esc(w)}"
       style="${onlyPerson === w ? `background:${personColor(w)}` : `color:${personColor(w)}`}"
       >${esc(w)}</span>`).join("");
  peopleEl.querySelectorAll("[data-who]").forEach(c => c.onclick = () => {
    onlyPerson = onlyPerson === c.dataset.who ? null : c.dataset.who;
    renderPeople(); renderList();
  });
}
document.getElementById("search").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase(); renderList();
});
addEventListener("keydown", e => {
  if (e.key === "Escape") select(null);
  if (e.key === "/" && document.activeElement.id !== "search") {
    e.preventDefault(); document.getElementById("search").focus();
  }
});

resize(); renderPeople(); renderList();
for (let i = 0; i < 700; i++) step();   // pre-settle so the first frame looks right
alpha = 0.25;                            // a little life left, then it stops moving
fit(); draw();
})();
</script>
</body>
</html>
